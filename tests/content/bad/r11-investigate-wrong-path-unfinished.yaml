goals:
  - id: g1
    label: Name who threw the starter away, and how
    hint: A refused event changes nothing in the pantry; only an event that is done
      removes the starter.
  - id: g2
    label: Pin down when the starter left
    hint: Every time in this ledger is in UTC; read the time of the event that
      worked.
solution:
  - t: filter
    column: event
    value: Throw away
  - t: answer
    question: who
    option: ines
  - t: answer
    question: what
    option: throw-away
  - t: answer
    question: when
