    concept: shared-kitchen
    note: m01/what-a-bakery-cloud-is
    task: "1.1"
    level: 2
    stem: Which feature lets a branch borrow ovens only during the busy morning hours?
    options:
      - id: a
        text: Send the extra bun trays to the shared ovens for the morning
        correct: true
        why: Borrowing idle shared ovens for a busy morning adds capacity without buying anything.
      - id: b
        text: Order a new oven for the harbour branch
        why: A new oven would stand unused on quiet days, the waste the shared ovens avoid.
      - id: c
        text: Turn customers away once the queue passes ten people
        why: Turning people away loses the sales that borrowed capacity would have kept.
      - id: d
        text: Bake tomorrow's buns tonight and sell them cold
        why: Baking early adds no oven capacity and leaves the buns stale by morning.
    evidence:
      - Branches use ovens from one central kitchen when their queues grow.
    takeaway: When a queue grows, borrow shared ovens instead of buying more.
