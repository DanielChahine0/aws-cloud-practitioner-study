    stem: The manager handed the borrowed proofing cabinet back at noon. What does the branch pay for that cabinet after noon?
    options:
      - id: a
        text: Nothing, since no dough rises in it once it is handed back
        correct: true
        why: A cabinet costs money only while dough is inside it, so a returned one costs nothing.
      - id: b
        text: The whole day, since the cabinet was booked that morning
        why: The bill follows the minutes of proofing, not the day the cabinet was first used.
      - id: c
        text: A flat monthly fee for keeping the cabinet on hand
        why: There is no standing fee; the branch pays only for the minutes dough proofs.
      - id: d
        text: Half the day, as a charge for handing it back early
        why: Handing a cabinet back early carries no charge; it simply stops the billing.
    evidence:
      - Cabinets are billed only while dough proofs.
    takeaway: A cabinet handed back stops costing money as soon as the dough leaves it.
