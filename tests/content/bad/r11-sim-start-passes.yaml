# fixture-target: content/labs/01-baking-basics/sort-the-bakes.yaml
id: lab-m01-sort-the-bakes
module: 1
title: Oven rush
engine: simulate
tier: core
rev: 1
concepts: [shared-kitchen, per-minute-rental]
notes: [m01/what-a-bakery-cloud-is]
minutes: 6
brief: Bread orders peak at 08:00. Set how many ovens the bakery rents each hour. Every figure here is a lab value.
spec:
  model: scaling
  constants:
    orders: [0, 0, 0, 0, 0, 10, 40, 90, 120, 60, 30, 20, 40, 30, 20, 10, 10, 20, 10, 0, 0, 0, 0, 0]
    perInstance: 40
    credits: 1
  params:
    - { kind: choice, id: mode, label: When ovens are added, initial: dynamic, options: [{ id: dynamic, label: Once the orders arrive }, { id: predictive, label: Ahead of the forecast }] }
    - { kind: int, id: min, label: Fewest ovens, min: 0, max: 4, step: 1, initial: 1 }
    - { kind: int, id: desired, label: Ovens at opening, min: 0, max: 4, step: 1, initial: 1 }
    - { kind: int, id: max, label: Most ovens, min: 1, max: 6, step: 1, initial: 1 }
    - { kind: toggle, id: balancer, label: Share orders across ovens, initial: false }
  thresholds:
    - { goal: g1, metric: droppedShare, max: 50 }
    - { goal: g2, metric: cost, max: 40 }
goals:
  - { id: g1, label: Most orders get baked, hint: 'Orders rise before 08:00, and one oven bakes 40 an hour.' }
  - { id: g2, label: Stay within 40 lab credits a day, hint: 'Each oven costs 1 lab credit an hour, busy or idle.' }
solution:
  - { t: set, param: mode, value: predictive }
  - { t: set, param: max, value: 3 }
  - { t: set, param: balancer, value: true }
wrongPaths:
  - actions: [{ t: set, param: max, value: 6 }, { t: set, param: min, value: 4 }, { t: set, param: desired, value: 4 }]
    failsGoal: g2
    mistake: Keeps four ovens hot all day for a two-hour peak
  - actions: [{ t: set, param: min, value: 0 }, { t: set, param: desired, value: 0 }, { t: set, param: max, value: 1 }]
    failsGoal: g1
    mistake: Rents no oven until the first order is late
debrief:
  lines:
    - A shared kitchen is rented by the minute, so the bakery pays only while the ovens run.
    - A start that already meets every threshold teaches nothing, which is why R11 rejects it.
  questions: [q-b4k7m2, q-d9p4r6]
