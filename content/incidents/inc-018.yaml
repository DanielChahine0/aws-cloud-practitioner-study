  - id: q-89stbz
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-glacier-storage-classes
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 3
    stem: >-
      The cafe's old event photos are opened only a few times a year.
      When a customer asks to see one, though, staff must show it on the spot.
      Which storage class keeps these photos most cheaply while meeting that need?
    options:
      - id: a
        text: S3 Glacier Instant Retrieval
        correct: true
        why: It is built for rarely read archives that must still come back in milliseconds, at a low storage price.
      - id: b
        text: S3 Glacier Flexible Retrieval
        why: Its retrievals take minutes to hours, so staff could not show a photo while the customer waits.
      - id: c
        text: S3 Glacier Deep Archive
        why: It is the cheapest class, but a retrieval takes about 12 hours by default, far too slow for this need.
      - id: d
        text: S3 Standard
        why: It suits data used often, so it costs more than needed for photos opened only a few times a year.
    evidence:
      - "S3 Glacier Instant Retrieval: rarely read archives returned in milliseconds, up to 68 percent cheaper than Standard-IA at equal speed, for things like medical images or media."
      - "Glacier classes are for archives: Instant Retrieval in milliseconds, Flexible Retrieval in minutes to hours, Deep Archive in about 12 hours at the lowest price."
    takeaway: Rarely opened data that must still come back in milliseconds fits S3 Glacier Instant Retrieval.
    history: []
    verified:
      keyHash: a8a9459a54e0
      fullHash: d26930924414
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-kab237
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-lifecycle
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      A team member drafts an S3 Lifecycle rule that expires the daily order logs before the accountant has finished checking them.
      What goes wrong if the cafe applies this rule?
    options:
      - id: a
        text: The logs are deleted for good and cannot be brought back
        correct: true
        why: An expiration action removes objects permanently, so logs expired before the check ends are gone while the accountant still needs them.
      - id: b
        text: The logs are archived where each read takes hours to finish
        why: Slow archive reads follow a transition to a Glacier class, while this rule expires the logs instead of moving them.
      - id: c
        text: The logs are copied into a second bucket and billed twice
        why: Lifecycle actions work within the same bucket and never make a second billed copy of the logs.
      - id: d
        text: The logs are kept in one Availability Zone with no spare copy
        why: An expiration action deletes objects rather than changing where or how they are stored.
    evidence:
      - Expiration actions delete objects for good, such as when compliance no longer needs them.
      - Rules should follow the access curve, since archiving too early blocks quick access and expiring too early deletes needed data.
    takeaway: Lifecycle rules should follow how data is used, because an expiration that fires too early permanently deletes data still needed.
    history: []
