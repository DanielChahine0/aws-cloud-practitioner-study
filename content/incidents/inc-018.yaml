id: inc-018
title: The S3 bill that keeps creeping up
modules:
  - 6
concepts:
  - s3-storage-classes
  - s3-glacier-storage-classes
  - s3-lifecycle
brief: >-
  The cafe's Amazon S3 bill has grown every month this year.
  Menu photos, event pictures and daily order logs all sit in one bucket, and the owner wants the bill trimmed without losing anything staff still use.
steps:
  - id: q-nsmtyf
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-storage-classes
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe keeps menu photos, event pictures and daily order logs in one Amazon S3 bucket.
      Before moving any of them somewhere cheaper, the owner wants to see how often each group is actually read, so she knows where a move would pay off.
      What should she use to get this view?
    options:
      - id: a
        text: S3 Storage Class Analysis
        correct: true
        why: It watches how often each group of objects is read and shows where a cheaper class would save money, the view the owner wants before moving anything.
      - id: b
        text: S3 Intelligent-Tiering
        why: It moves objects among its own tiers by itself, but it gives the owner no report on each group to plan her own moves from.
      - id: c
        text: S3 Lifecycle configuration
        why: It moves or deletes objects on a schedule the owner sets, so it acts on a plan rather than showing her how often each group is read.
      - id: d
        text: Amazon S3 Access Points
        why: They give each group of users its own access policy on shared data, which says nothing about how often the photos or logs are read.
    evidence:
      - S3 Storage Class Analysis studies access patterns to show when a cheaper class pays off.
    takeaway: S3 Storage Class Analysis studies how objects are read to show when moving them to a cheaper class pays off.
    history: []
    verified:
      keyHash: 621fb497561f
      fullHash: 6c649b82b00b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
