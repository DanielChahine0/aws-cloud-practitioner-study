id: inc-027
title: The autumn app feature
modules: [8]
concepts: [amazon-bedrock, multimodal-generative-ai, amazon-q-developer]
brief: The autumn menu launches soon, and the cafe's only programmer has been asked to add a feature to the ordering app that describes each new drink to customers before release day.
steps:
  - id: q-6hbp9t
    version: 1
    status: live
    pool: practice
    type: single
    concept: amazon-bedrock
    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 3
    stem: >-
      The cafe's developer wants the ordering app to call a foundation model that writes drink descriptions for customers.
      She wants a secure, private service built for production apps, with AWS managing the models.
      Which service fits?
    options:
      - id: a
        text: Amazon Q Business
        why: Q Business is an assistant for the cafe's staff, not a model service to build into a customer app.
      - id: b
        text: Amazon Personalize
        why: Personalize recommends items from past activity, and it does not write new descriptions.
      - id: c
        text: Amazon Bedrock
        correct: true
        why: Bedrock offers managed foundation models through one API for secure, private production apps.
      - id: d
        text: Amazon Lex
        why: Lex builds chat interfaces that understand requests, but it does not supply models that write text.
    evidence:
      - Managed FMs from Amazon and startups (Claude, Stable Diffusion) via one API; test, tune, integrate
      - Secure, private, scalable production apps; text and image output; agents on company data
    takeaway: Building a secure production app on managed foundation models points to Amazon Bedrock.
