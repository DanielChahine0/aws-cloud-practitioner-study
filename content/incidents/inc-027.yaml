    verified:
      keyHash: a27444c135ef
      fullHash: d98884fa69c8
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-6pwnvp
    version: 1
    status: live
    pool: practice
    type: single
    concept: multimodal-generative-ai
    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 2
    stem: >-
      A feature in the cafe's app uses a generative AI model to write drink descriptions.
      Marketing wants that one model to also create a matching picture of each drink.
      What kind of model does the feature need?
    options:
      - id: a
        text: A fine-tuned model
        why: Fine-tuning adapts a model with the cafe's own data, but it does not add the ability to make images.
      - id: b
        text: A multimodal model
        correct: true
        why: A multimodal model generates several content types, so one model can return both text and images.
      - id: c
        text: A large language model
        why: An LLM is trained on text for human language, so it writes descriptions but does not draw pictures.
      - id: d
        text: A classic ML model
        why: A classic ML model handles one narrow job, such as a forecast, and does not create images.
    evidence:
      - "**Multimodal**: Generating several content types."
    takeaway: A model that creates more than one type of content, such as text and images, is multimodal.
    history: []
    verified:
      keyHash: 719117d361bc
      fullHash: 5b1c00b66cbb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-qmty87
    version: 1
    status: live
    pool: practice
    type: single
    concept: amazon-q-developer
    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 3
    stem: >-
      Before release day, the programmer who builds the cafe's app wants an assistant inside her code editor that reviews her Python code for security problems and suggests fixes.
      Which service fits?
    options:
      - id: a
        text: Amazon SageMaker JumpStart
        why: JumpStart is a hub of models to fine-tune and deploy, not an assistant that reviews code.
      - id: b
        text: Amazon Q Business
        why: Q Business answers staff questions from company repositories, and it is not a coding assistant.
      - id: c
        text: Amazon Bedrock
        why: Bedrock offers foundation models to build apps with, not a ready assistant inside her editor.
      - id: d
        text: Amazon Q Developer
        correct: true
        why: Q Developer works inside IDEs, suggesting code and helping with security and code reviews.
    evidence:
      - Suggests code, even whole functions and logical blocks, in multiple IDEs; languages include C#, Java, JavaScript, Python, TypeScript
      - Faster coding, reliability, security, code reviews
    takeaway: A coding assistant in the IDE that helps with security and code reviews points to Amazon Q Developer.
