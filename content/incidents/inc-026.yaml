  - id: q-2jj7h3
    version: 1
    status: live
    pool: practice
    type: single
    concept: ml-model-training
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 2
    stem: >-
      A data scientist feeds the cafe's long sales history into an ML algorithm to find the patterns behind croissant demand.
      What does this training stage produce?
    options:
      - id: a
        text: A fixed rule that a developer wrote
        why: A hand-written rule is classical programming, while training learns the patterns from data.
      - id: b
        text: A forecast for tomorrow's bake
        why: A forecast for a new day comes later, once the finished model is run on fresh data.
      - id: c
        text: A model of the sales patterns
        correct: true
        why: Training finds the hidden patterns in historical data and outputs a model that captures them.
      - id: d
        text: A cleaned copy of the sales records
        why: Cleaning and formatting the data happens before training starts, not as its result.
    evidence:
      - "Training: ML finds hidden customer-sales patterns in lots of history and outputs a model."
      - "**Training**: Finding patterns in historical data to build a model."
    takeaway: Training turns historical data into a model, and using that model on new data comes afterward.
    history: []
    verified:
