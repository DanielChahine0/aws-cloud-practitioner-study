id: inc-026
title: Croissants in the bin
modules: [8]
concepts: [ai-ml-business-use-cases, ml-model-training, amazon-sagemaker-ai, ml-inference]
brief: Most evenings the cafe throws away trays of unsold croissants, and the owner has hired a data scientist to bring the morning bake closer to what really sells.
steps:
  - id: q-9sapga
    version: 1
    status: live
    pool: practice
    type: single
    concept: ai-ml-business-use-cases
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 2
    stem: >-
      The cafe wants a model that works out from past sales how many croissants will sell tomorrow, so the bakers know how many to make.
      Which kind of machine learning job is this?
    options:
      - id: a
        text: Detecting an anomaly
        why: Anomaly detection flags unusual events, such as fraud, rather than estimating tomorrow's sales.
      - id: b
        text: Routing a request
        why: Routing sends a request, such as a phone call, to the right place, which is not estimating sales.
      - id: c
        text: Making a prediction
        correct: true
        why: Estimating tomorrow's sales from past sales is a prediction, like forecasting the price of goods.
      - id: d
        text: Creating new content
        why: Creating original text or images is generative work, not estimating a sales figure.
    evidence:
      - ML predicts (stock trends, prices of goods), decides (routing a caller by spoken request) and detects anomalies (online-banking fraud).
    takeaway: Estimating a future quantity, such as tomorrow's sales, is a prediction job for machine learning.
