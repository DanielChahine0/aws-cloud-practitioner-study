  - id: q-36m7ds
    version: 1
    status: live
    pool: practice
    type: single
    concept: amazon-sagemaker-ai
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 3
    stem: >-
      The cafe's data scientist wants one managed AWS environment where she can run experiments on her own forecasting model, visualize the data, debug the model and monitor it after deployment, without running any servers.
      Which service fits?
    options:
      - id: a
        text: Amazon Personalize
        why: Personalize serves ready-made recommendations, and it is not a workspace for building and debugging her own model.
      - id: b
        text: Amazon SageMaker AI
        correct: true
        why: SageMaker AI gives one managed place to experiment with, debug and monitor her own model while AWS runs the servers.
      - id: c
        text: Amazon Bedrock
        why: Bedrock offers managed foundation models through an API, not a workspace for her own forecasting model.
      - id: d
        text: Amazon Rekognition
        why: Rekognition is a pre-trained image and video service with no place to build or monitor her own model.
    evidence:
      - "IDE: access control, visibility, experiments, data visualization, debugging, monitoring; plus hundreds of fast-deploy pre-trained models."
      - You build, train and deploy your own models while AWS runs the infrastructure.
    takeaway: Amazon SageMaker AI is one managed place to experiment with, debug and monitor your own ML models.
    history: []
