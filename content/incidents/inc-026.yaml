  - id: q-82kwjb
    version: 1
    status: live
    pool: practice
    type: single
    concept: ml-inference
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 2
    stem: >-
      Each morning the cafe's trained demand model receives that day's weather and weekday and returns how many croissants to bake.
      Which ML stage runs each morning?
    options:
      - id: a
        text: Training
        why: Training already happened on the sales history, and the morning run only applies the finished model.
      - id: b
        text: Fine-tuning
        why: Fine-tuning adapts a pre-trained model with more data, but this run uses the model as it is.
      - id: c
        text: Data preparation
        why: Gathering and cleaning data comes before training, not when the model makes its daily forecast.
      - id: d
        text: Inference
        correct: true
        why: Inference feeds new data to a trained model so it can predict, which is what happens each morning.
    evidence:
      - "Inference: the model gets new data, like a fresh order, and predicts or decides."
      - "**Inference**: Applying a trained model to new data."
    takeaway: Running a trained model on the day's fresh data to get a forecast is inference.
