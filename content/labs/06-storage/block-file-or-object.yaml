minutes: 6
brief: >-
  The cafe is moving its order system and back office onto AWS and linking the storage in the shop cupboard to the cloud, and each kind of data needs a fitting home.
  Sort each storage need under the service that fits it.
spec:
  buckets:
    - id: instance-store
      label: Amazon EC2 instance store
      detail: Block storage
    - id: ebs
      label: Amazon EBS
      detail: Block storage
    - id: s3
      label: Amazon S3
      detail: Object storage
    - id: efs
      label: Amazon EFS
      detail: File storage
    - id: fsx
      label: Amazon FSx
      detail: File storage
    - id: storage-gateway
      label: AWS Storage Gateway
      detail: Hybrid storage
  cards:
    - id: nightly-crunch
      text: Scratch space for a heavy nightly sales calculation, at no extra cost and fine to lose
      bucket: instance-store
      goal: g1
    - id: order-db
      text: The order database on one EC2 instance, which must keep its data through a stop
      bucket: ebs
      goal: g2
    - id: till-disk
      text: The till server's data drive, kept when the server moves to a larger instance type
      bucket: ebs
      goal: g2
    - id: promo-pdfs
      text: Poster PDFs and menu photos that are always fetched whole
      bucket: s3
      goal: g3
    - id: training-videos
      text: Recorded barista training videos, uploaded once and never edited
      bucket: s3
      goal: g3
    - id: recipe-manuals
      text: Recipe manuals that several Linux servers open and update at the same time
      bucket: efs
      also: [fsx]
      goal: g4
    - id: windows-share
      text: The back office Windows file share that signs staff in with Active Directory
      bucket: fsx
      goal: g4
    - id: roast-model
      text: Very fast shared storage for training a machine learning model on roasting data
      bucket: fsx
      goal: g4
    - id: cupboard-share
      text: A file share in the shop cupboard that keeps hot files local and the rest in the cloud
      bucket: storage-gateway
      goal: g5
    - id: tape-backups
      text: Tape backup software in the shop that should send its tapes to the cloud
      bucket: storage-gateway
      goal: g5
goals:
  - id: g1
    label: Throwaway block data sits on Amazon EC2 instance store
    hint: Ask whether losing the data on a stop would hurt, and whether the disk that comes with the host at no extra cost is enough.
  - id: g2
    label: Block data that must persist sits on Amazon EBS
    hint: Ask whether the data must outlive a stop or a move to another instance, which takes a volume that lives apart from the host.
  - id: g3
    label: Whole, rarely changed files sit in Amazon S3
    hint: Ask whether the file is always read and written whole and rarely changes once it is stored.
  - id: g4
    label: Shared file systems sit on Amazon EFS or Amazon FSx
    hint: Ask how the clients share files - Linux servers over NFS, Windows users over SMB with Active Directory, or a high-performance system for ML.
  - id: g5
    label: Systems in the shop reach the cloud through AWS Storage Gateway
    hint: Ask whether the system stays in the shop and keeps its usual routine, such as a file share or tape backup software, while the cloud holds the data.
