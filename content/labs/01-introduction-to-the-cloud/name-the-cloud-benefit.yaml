      - { t: place, card: shop-worldwide, bucket: go-global }
  - mistake: Reads scaling with a surprise rush as speed and agility rather than ending capacity guesses
    failsGoal: g3
    actions:
      - { t: place, card: no-upfront-servers, bucket: fixed-to-variable }
      - { t: place, card: quiet-winter, bucket: fixed-to-variable }
      - { t: place, card: small-team-big-tech, bucket: economies-of-scale }
      - { t: place, card: bulk-hardware, bucket: economies-of-scale }
