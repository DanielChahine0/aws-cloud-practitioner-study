debrief:
  lines:
    - The two cost benefits differ in where the saving comes from, either paying only for what was used or the lower prices AWS earns by buying hardware in bulk.
    - AWS runs the physical layer, so the cafe stops spending time and money paying for utilities and maintaining servers.
    - Scaling to a real rush ends capacity guesses, which is a different win from the speed of trying and dropping ideas.
    - Deploying to a Region abroad takes the app to new customers without building a data center there.
  questions: [q-y1nwv1, q-z5kgg6, q-dn0smx]
