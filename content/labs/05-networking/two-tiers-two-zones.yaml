  - { t: place, piece: route-a, slot: subnet-a1 }
  - { t: place, piece: web-one, slot: subnet-a1 }
  - { t: place, piece: orders-primary, slot: subnet-a2 }
  - { t: place, piece: route-b, slot: subnet-b1 }
  - { t: place, piece: web-two, slot: subnet-b1 }
