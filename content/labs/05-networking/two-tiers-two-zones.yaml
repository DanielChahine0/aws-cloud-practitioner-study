minutes: 8
brief: >-
  The cafe serves its online menu from two web servers and keeps orders in a database primary and its standby, in one VPC over two zones, and no server calls out and no office network links in.
  Place each piece so customers reach the menu, nobody outside reaches the orders, either zone can fail, and nothing unneeded runs.
  In this lab, the internet reaches a piece only when its subnet holds a route table to the internet gateway on the VPC edge, and the VPC and subnet address ranges are lab values.
spec:
  containers:
    - { id: beanhaven, label: Beanhaven Region, kind: region }
    - { id: cafe-vpc, label: Cafe VPC, kind: vpc, parent: beanhaven, detail: 10.42.0.0/16 }
    - { id: vpc-edge, label: VPC edge, kind: edge, parent: cafe-vpc, detail: Outside every subnet }
    - { id: zone-a, label: Beanhaven Zone A, kind: az, parent: cafe-vpc }
    - { id: subnet-a1, label: Subnet A1, kind: subnet, parent: zone-a, detail: 10.42.10.0/24 }
    - { id: subnet-a2, label: Subnet A2, kind: subnet, parent: zone-a, detail: 10.42.20.0/24 }
    - { id: zone-b, label: Beanhaven Zone B, kind: az, parent: cafe-vpc }
    - { id: subnet-b1, label: Subnet B1, kind: subnet, parent: zone-b, detail: 10.42.11.0/24 }
    - { id: subnet-b2, label: Subnet B2, kind: subnet, parent: zone-b, detail: 10.42.21.0/24 }
    - { id: not-used, label: Not used, kind: bench }
  pieces:
    - { id: web-one, label: Menu web server 1 }
    - { id: web-two, label: Menu web server 2 }
    - { id: orders-primary, label: Order database primary }
    - { id: orders-standby, label: Order database standby }
    - { id: gateway, label: Internet gateway, role: internet-gateway }
    - { id: route-a, label: Route table A, role: public-route, detail: Local route plus 0.0.0.0/0 to the internet gateway }
    - { id: route-b, label: Route table B, role: public-route, detail: Local route plus 0.0.0.0/0 to the internet gateway }
    - { id: private-gateway, label: Virtual private gateway, detail: Admits traffic only from an approved network }
    - { id: nat, label: NAT gateway, detail: Lets private instances start connections out }
  failures: [zone-a, zone-b]
  constraints:
    - { kind: public, goal: g1, pieces: [web-one, web-two] }
    - { kind: private, goal: g2, pieces: [orders-primary, orders-standby] }
    - { kind: survive, goal: g3, pieces: [web-one, web-two], min: 1 }
    - { kind: survive, goal: g3, pieces: [orders-primary, orders-standby], min: 1 }
    - { kind: in, goal: g3, pieces: [private-gateway, nat], within: [not-used] }
goals:
  - id: g1
    label: Customers reach both menu web servers
    hint: Follow a customer's request in, and ask what joins the VPC to the internet and what tells a subnet to send traffic there.
  - id: g2
    label: Nobody outside reaches the order database
    hint: Ask which subnets have a route out to the internet gateway, and keep the orders where no such route exists.
  - id: g3
    label: Either zone can fail, and nothing unneeded runs
    hint: Ask what still serves the menu and holds the orders when one zone goes dark, and whether each gateway you placed has a job here.
