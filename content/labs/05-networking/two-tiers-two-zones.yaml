debrief:
  lines:
    - Attaching an internet gateway is not enough, since a subnet turns public only when its route table sends 0.0.0.0/0 traffic to it.
    - The order database sits in private subnets with no route to the internet gateway, so nobody outside can reach it.
    - A web server and a database copy in each zone keep the cafe serving when one Availability Zone has an outage.
    - A virtual private gateway adds nothing when no office network links in, and a NAT gateway adds nothing when no server calls out.
  questions: [q-vtez84, q-gea5ar, q-48ahxj]
