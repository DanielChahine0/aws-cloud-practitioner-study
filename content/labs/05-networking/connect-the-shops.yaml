id: lab-m05-connect-the-shops
module: 5
title: Connect the shops
engine: sort
tier: stretch
status: live
rev: 1
concepts:
  - aws-client-vpn
  - aws-site-to-site-vpn
  - vpn
  - aws-direct-connect
  - direct-connect-failover
  - aws-transit-gateway
  - aws-privatelink
  - internet-gateway
  - nat-gateway
notes:
  - m05/more-ways-to-connect-to-the-aws-cloud
  - m05/organizing-aws-cloud-resources
  - m05/global-architectures
minutes: 7
brief: >-
  The cafe chain is wiring its shops, its roastery, its home-working staff and a bean supplier into its AWS network, and every link has a different need.
  Sort each need under the connection that fits it best.
spec:
  buckets:
    - id: client-vpn
      label: AWS Client VPN
    - id: site-to-site-vpn
      label: AWS Site-to-Site VPN
    - id: direct-connect
      label: AWS Direct Connect
    - id: privatelink
      label: AWS PrivateLink
    - id: transit-gateway
      label: AWS Transit Gateway
    - id: internet-gateway
      label: Internet gateway
    - id: nat-gateway
      label: NAT gateway
  cards:
    - id: home-barista-laptop
      text: A barista working from home opens the stock app on a laptop
      bucket: client-vpn
      goal: g1
    - id: bought-chain-staff
      text: Staff of a newly bought cafe chain, on their own laptops in many towns, who need secure access this week
      bucket: client-vpn
      goal: g1
    - id: shop-office-routers
      text: Each shop's back-office router, which needs an encrypted link to the cafe VPC
      bucket: site-to-site-vpn
      goal: g1
    - id: harbour-nightly-file
      text: The harbour shop network's nightly sales file, a modest transfer into the cafe VPC
      bucket: site-to-site-vpn
      goal: g1
    - id: roastery-bulk-loads
      text: The roastery's huge daily loads of roast-sensor data, which need steady bandwidth on a private path
      bucket: direct-connect
      goal: g2
    - id: training-video
      text: Live training video from the head office data center into the cafe VPC, needing steady bandwidth and no internet hop
      bucket: direct-connect
      goal: g2
    - id: standby-tunnel
      text: A backup path for the roastery's traffic over its existing internet link, for when its dedicated cable is cut
      bucket: site-to-site-vpn
      goal: g2
    - id: shop-vpcs-hub
      text: Every shop's VPC and the head office network, joined through one central point instead of link by link
      bucket: transit-gateway
      goal: g3
    - id: europe-hub-peering
      text: The European shops' networks, which must reach the home Region's shop networks through one Region-to-Region link
      bucket: transit-gateway
      goal: g3
    - id: supplier-ordering
      text: The bean supplier's ordering service alone, reached from the cafe VPC with no public address or internet path
      bucket: privatelink
      goal: g3
    - id: payroll-only
      text: Only the payroll service in the head office's other VPC, with nothing else in that VPC reachable
      bucket: privatelink
      goal: g3
    - id: public-menu-site
      text: Customers on the internet loading the menu site in the cafe VPC
      bucket: internet-gateway
      goal: g4
    - id: order-page-replies
      text: Replies from the online order page in a public subnet going back out to customers' browsers
      bucket: internet-gateway
      goal: g4
    - id: private-db-patches
      text: Order database servers with no public address that must fetch software patches but never accept calls from outside
      bucket: nat-gateway
      goal: g4
goals:
  - id: g1
    label: People and shop sites each have their own VPN link
    hint: Ask whether the link is for a person on a device or for a whole site's network, and whether a dedicated line is really needed.
  - id: g2
    label: Heavy steady traffic rides a dedicated line with a standby
    hint: Ask whether the traffic is heavy enough to need its own private line, and what carries it while that cable is down.
  - id: g3
    label: The hub and the private service links are told apart
    hint: Ask whether the cafe joins whole networks at one central point, or opens private access to exactly the services it picks.
  - id: g4
    label: Public traffic and private outbound calls use the right gateway
    hint: Ask whether outsiders must be able to start a connection, or only the cafe's own servers call out.
