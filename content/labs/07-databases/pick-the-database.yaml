debrief:
  lines:
    - The shape of the data picks the database, so linked tables under a rigid schema fit RDS or Aurora and records whose attributes vary fit DynamoDB or DocumentDB.
    - ElastiCache keeps hot data in memory beside the database, so repeat reads skip the database and it carries less load.
    - Specialist needs get purpose-built services, so Neptune answers questions about dense webs of relationships and Managed Blockchain runs blockchain networks for shipment tracking.
    - AWS Backup is a backup service, not a database, and it manages backups across services, accounts and Regions in one place.
  questions: [q-sw0mr3, q-vxdn07, q-4h028f]
