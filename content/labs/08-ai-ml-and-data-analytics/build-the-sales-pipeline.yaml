    failsGoal: g1
    actions:
      - { t: place, piece: emr, slot: ingest }
      - { t: place, piece: kinesis-streams, slot: not-used }
      - { t: place, piece: s3-lake, slot: store }
      - { t: place, piece: glue-catalog, slot: catalog }
      - { t: place, piece: athena, slot: query }
      - { t: place, piece: quick-sight, slot: visualize }
      - { t: place, piece: opensearch, slot: not-used }
  - mistake: Puts the Data Catalog in the query stage, as if the catalog ran the SQL itself
    failsGoal: g2
    actions:
      - { t: place, piece: kinesis-streams, slot: ingest }
      - { t: place, piece: s3-lake, slot: store }
      - { t: place, piece: glue-catalog, slot: query }
      - { t: place, piece: athena, slot: query }
      - { t: place, piece: quick-sight, slot: visualize }
      - { t: place, piece: emr, slot: not-used }
      - { t: place, piece: opensearch, slot: not-used }
  - mistake: Leaves the Data Catalog unused, as if Athena could find the sales files on its own
    failsGoal: g2
    actions:
      - { t: place, piece: kinesis-streams, slot: ingest }
      - { t: place, piece: s3-lake, slot: store }
      - { t: place, piece: glue-catalog, slot: not-used }
      - { t: place, piece: athena, slot: query }
      - { t: place, piece: quick-sight, slot: visualize }
      - { t: place, piece: emr, slot: not-used }
      - { t: place, piece: opensearch, slot: not-used }
  - mistake: Gives the managers Amazon OpenSearch Service, a search and monitoring tool, instead of business dashboards
    failsGoal: g3
    actions:
      - { t: place, piece: kinesis-streams, slot: ingest }
      - { t: place, piece: s3-lake, slot: store }
      - { t: place, piece: glue-catalog, slot: catalog }
      - { t: place, piece: athena, slot: query }
      - { t: place, piece: opensearch, slot: visualize }
      - { t: place, piece: quick-sight, slot: not-used }
      - { t: place, piece: emr, slot: not-used }
debrief:
  lines:
    - A till feed that must arrive as each sale happens calls for real-time ingestion with Amazon Kinesis Data Streams.
    - Amazon S3 works as the data lake that pools every sale in one place for each tool that reads it.
    - Amazon Athena runs SQL on the lake in place and reads the AWS Glue Data Catalog table to learn the schema and where the files sit.
    - Amazon Quick Sight gives non-developers business dashboards, while Amazon OpenSearch Service is for live search and monitoring and Amazon EMR for big Spark or Hadoop jobs.
  questions: [q-ahb2x6, q-pebdjx, q-20jg2m]
