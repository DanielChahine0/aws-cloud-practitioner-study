debrief:
  lines:
    - Relocate moves VMs or containers that already run on premises, while rehost lifts and shifts apps unchanged, often turning servers into VMs.
    - Replatform adds a few cloud optimizations, such as moving MySQL to Amazon RDS, without new code or architecture changes.
    - Refactor rebuilds an app with new code and cloud-built features at the highest upfront effort, while repurchase swaps a licensed app for software sold as a service.
    - Retain keeps business-critical apps in place for now, and retire switches off apps nobody needs, so neither one migrates.
  questions: [q-y70695, q-6gkne0, q-28swmy]
