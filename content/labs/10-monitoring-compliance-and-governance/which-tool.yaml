id: lab-m10-which-tool
module: 10
title: Pick the tool, from CloudWatch to Artifact
engine: sort
tier: core
status: live
rev: 1
concepts:
  - amazon-cloudwatch
  - cloudwatch-alarms
  - cloudwatch-logs
  - aws-cloudtrail
  - cloudtrail-logs
  - aws-config
