debrief:
  lines:
    - CloudWatch measures and reacts, with alarms on metric thresholds and Logs for searching what happened inside an app.
    - CloudTrail records who called the AWS API, when and from where, and its logs in S3 outlast the 90-day event history.
    - AWS Config checks configurations against the cafe's own rules and can fix drift, while Trusted Advisor checks AWS best practices.
    - "AWS Health and AWS Artifact both bring the cafe word from AWS itself: Health on events touching its resources, Artifact as audit reports and agreements."
  questions: [q-5dadmr, q-7w1h2h, q-vfayk9]
