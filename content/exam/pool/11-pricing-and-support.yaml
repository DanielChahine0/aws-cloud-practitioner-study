    stem: >-
      A media group keeps separate AWS accounts for its news, radio and events teams.
      It wants the accounts linked so their combined usage can earn discounts, with all spend visible from one primary account.
      What should it set up?
    options:
      - id: a
        text: Consolidated billing through AWS Organizations
        correct: true
        why: Consolidated billing links the team accounts to one primary account that sees all spend, and Organizations adds the discounts.
      - id: b
        text: Cost allocation tags on each team's resources
        why: Tags group costs inside an account by label, but they do not link the accounts or pool their usage.
      - id: c
        text: An AWS Budgets budget in each team account
        why: Budgets warns when spend nears a limit, but each account would stay separate with no pooled usage.
      - id: d
        text: AWS Cost Explorer reports in each account
        why: Cost Explorer charts spend inside each account, but it does not link the accounts or earn any discount.
    evidence:
      - With consolidated billing, subaccounts (by team, project, department or any split) link to a primary account that alone receives the bill and sees all spend.
      - AWS Organizations sets this up, adding central management, discounts and stronger security.
    takeaway: Consolidated billing in AWS Organizations links many accounts to one primary account and adds discounts.
