questions:
  - id: q-0hmp41
    version: 1
    status: live
    type: single
    pool: exam
    concept: cost-optimization
    note: m11/cost-optimization
    task: "1.2"
    level: 2
    stem: >-
      A ticket-booking startup runs an application that combines Amazon EC2, Amazon RDS and Amazon S3.
      It has already trimmed its EC2 instances and asks where else it should search to lower its monthly AWS spend.
      Which statement answers that question in line with AWS guidance?
    options:
      - id: a
        text: Savings may also sit in the database and storage layers
        correct: true
        why: The design combines several services, so the RDS and S3 parts of the bill deserve the same search as the instances.
      - id: b
        text: Many teams begin their search for savings with EC2
        why: It is true that EC2 is a common first stop, but the startup has done that step and asks where to look next.
      - id: c
        text: Data coming in from the internet carries no transfer fee
        why: Inbound transfer is indeed free, but that fact names no part of the design where the startup could still save.
      - id: d
        text: Unit prices can drop as overall usage keeps growing
        why: Volume pricing is a real AWS principle, but it explains a falling rate rather than where to search for savings.
    evidence:
      - Solutions usually combine services, so look for savings across the design (here EC2, RDS in a VPC, and S3).
      - EC2 is where many teams look first.
    takeaway: Cost optimization searches every service in a solution, not only the compute layer where many teams start.
    history: []
    verified:
      keyHash: 790ed523058a
      fullHash: 8f252f5d9651
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-vwr7ad
    version: 1
    status: live
    type: single
    pool: exam
    concept: rightsizing
    note: m11/cost-optimization
    task: "1.2"
    level: 1
    stem: >-
      Which practice measures what a workload really uses and then changes its compute or database resources so their capacity matches that demand?
    options:
      - id: a
        text: Rightsizing
        correct: true
        why: Rightsizing starts from measured demand and adjusts instance or database capacity to match it, cutting paid idle capacity.
      - id: b
        text: Scaling up
        why: Scaling up moves to a bigger resource for more power, which is a change in one direction rather than a fit to measured needs.
      - id: c
        text: Lift-and-shift
        why: Lift-and-shift moves a workload to the cloud as it is, without measuring its use and adjusting its resources.
      - id: d
        text: Provisioning
        why: Provisioning just sets up resources, and on its own says nothing about matching their capacity to real use.
    evidence:
      - "Rightsizing: measure real workload needs and resize to fit."
      - Rightsize databases too; storage autoscaling matches storage to demand.
    takeaway: Rightsizing matches resource capacity to measured workload needs, so you stop paying for capacity that sits idle.
    history: []
    verified:
      keyHash: d991f7384d9a
      fullHash: 5980503d9a59
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-kfxkk6
    version: 1
    status: retired
    type: single
    pool: exam
    concept: aws-prescriptive-guidance
    note: m11/aws-support-plans
    task: "1.3"
    level: 3
    stem: >-
      A regional credit union has chosen to migrate its loan systems to AWS with its own engineers doing all of the work.
      To lower the risk of the move, its migration strategy is to follow proven approaches that AWS experts have already published, with the steps and code ready to reuse.
      Which AWS option supports this migration strategy?
    options:
      - id: a
        text: AWS Prescriptive Guidance
        correct: true
        why: Prescriptive Guidance publishes expert patterns with steps, architectures, tools and code that the credit union's own engineers can follow for the move.
      - id: b
        text: AWS Professional Services
        why: Professional Services sends AWS consultants to carry out a migration project, while the credit union wants its own engineers to do the work.
      - id: c
        text: AWS Migration and Modernization Competency Partners
        why: These partners are outside firms hired to help with phases of a migration, while the credit union wants published approaches its own team follows.
      - id: d
        text: AWS re:Post
        why: re:Post holds answers from community peers, rather than proven migration approaches published by AWS experts with steps and code.
    evidence:
      - AWS Prescriptive Guidance offers guides and patterns from AWS technology experts, with steps, architectures, tools and code for common migration, optimization and modernization work.
      - "AWS Professional Services: project-based consulting, such as complex migrations, security audits and performance tuning."
    takeaway: A team that runs its own migration can lower risk by following the expert patterns, steps and code in AWS Prescriptive Guidance.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: AWS Prescriptive Guidance is a technical resource named under task 4.3, which fits better than 1.3 migration strategies."
