  - id: q-yy8y4w
    version: 1
    status: retired
    type: single
    pool: exam
    concept: outbound-data-transfer
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 2
    stem: >-
      A photo-sharing app keeps its images in Amazon S3.
      Users upload new photos from the internet and download photos to their phones over the internet.
      The finance team asks which part of this traffic appears on the bill as data transfer charges.
      Which statement answers the question?
    options:
      - id: a
        text: Data that leaves AWS for the internet is billed per gigabyte
        correct: true
        why: The downloads leave AWS for the internet, which is outbound transfer billed per gigabyte, while the uploads come in free.
      - id: b
        text: Most traffic between services in the same Region is free
        why: Same-Region traffic is mostly free, but the app's uploads and downloads cross the internet, so this does not name the billed part.
      - id: c
        text: Storage is billed by how much data is kept and for how long
        why: Storage is a real charge, but it is a separate driver from transfer and says nothing about which traffic is billed.
      - id: d
        text: Requests and retrievals are billed as a separate S3 component
        why: Requests are a real S3 charge, but they are not data transfer, so this leaves the finance team's question open.
    evidence:
      - Incoming data transfer costs are nothing for data coming from the internet into AWS, while outgoing data transfer costs apply to data leaving for the internet or for another Region.
      - "Example: downloads from a static website hosted in S3 count as outbound transfer."
      - "Data transfer: inbound and most same-Region traffic is free, with exceptions, while outbound data is pooled across services and billed per gigabyte at falling rates."
    takeaway: Data sent out of AWS to the internet is billed per gigabyte, while data coming in from the internet is free.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Options 1 and 3 are not about traffic at all, so the stem's 'data transfer' question leaves only options 2 and 4. Option 4 alone repeats the stem's word 'internet', which points at the key."
