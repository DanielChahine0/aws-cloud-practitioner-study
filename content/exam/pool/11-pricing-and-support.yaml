  - id: q-0k0amp
    version: 1
    status: live
    type: single
    pool: exam
    concept: vpc-endpoints
    note: m11/cost-optimization
    task: "4.1"
    level: 3
    stem: >-
      A logistics company's application runs on Amazon EC2 instances in its own private network on AWS and moves large volumes of data to and from Amazon S3.
      The team wants a private path to S3 that also trims the data transfer charges on that path.
      What should it add?
    options:
      - id: a
        text: A VPC endpoint
        correct: true
        why: A VPC endpoint links the network privately to S3, which keeps the traffic off the internet and trims transfer costs.
      - id: b
        text: A NAT gateway
        why: A NAT gateway sends traffic out toward the internet path, so it gives no private link to S3 and no transfer savings.
      - id: c
        text: An internet gateway
        why: An internet gateway opens the network to the public internet, the opposite of the private path the team wants.
      - id: d
        text: An AWS Site-to-Site VPN
        why: A Site-to-Site VPN links an on-premises network to AWS, rather than linking the company's AWS network to S3.
    evidence:
      - VPC endpoints connect a VPC privately to supported services, and one used for S3 trims transfer costs, notably out-of-Region.
      - Transfer is not always free, so keep cross-AZ and internet traffic low; as with road traffic, less is better.
    takeaway: A VPC endpoint for S3 gives a private path from the VPC to S3 and trims data transfer costs.
    history: []
    verified:
      keyHash: dc0a3e5e12b8
      fullHash: 164e23425f01
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
