      A video archive company is estimating its monthly AWS charges for Amazon S3 alone.
      Which charges belong on that estimate?
    options:
      - id: a
        text: Data kept in storage over time
        correct: true
        why: Storage is a core S3 cost component, charged for the data kept in buckets over time.
      - id: b
        text: Copies replicated to another Region
        correct: true
        why: Replication is one of the S3 cost components, charged when objects are copied to another location.
      - id: c
        text: Hours that compute instances run
        why: Instance hours are charged by compute services such as Amazon EC2, and S3 runs no instances for the company.
      - id: d
        text: Capacity provisioned for block volumes
        why: Provisioned block capacity is charged by Amazon EBS, while S3 bills for the objects actually stored.
      - id: e
        text: Hours that database instances run
        why: Database instance hours are charged by Amazon RDS, which is outside an estimate for S3 alone.
    evidence:
      - "S3 has six cost components: storage, requests and retrieval, transfer and acceleration, management and analytics, replication, and S3 Object Lambda processing."
    takeaway: S3 charges across several components, including storage, requests, transfer out, management, replication and Object Lambda processing.
