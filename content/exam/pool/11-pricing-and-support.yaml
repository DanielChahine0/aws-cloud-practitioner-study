  - id: q-yh58fj
    version: 1
    status: live
    type: single
    pool: exam
    concept: save-when-you-commit
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 2
    stem: >-
      A payroll software firm runs the same compute load around the clock and expects it to stay steady for years.
      Which AWS pricing principle can lower its cost the most for this pattern?
    options:
      - id: a
        text: Save when you commit
        correct: true
        why: A steady, predictable load is what a long usage commitment rewards with a large discount.
      - id: b
        text: Pay as you go
        why: Paying as you go suits variable or uncertain demand, and gives no discount for a load that never changes.
      - id: c
        text: Pay less by using more
        why: Volume discounts follow how much the firm uses, while its steady load calls for a discount on a time commitment.
      - id: d
        text: Bring your own license
        why: Reusing existing licenses is a licensing choice, rather than one of the AWS pricing principles for steady compute.
    evidence:
      - "Save when you commit: a usage commitment, usually 1 or 3 years, earns big discounts on steady workloads."
      - "Pay as you go: no upfront cost or commitment, so it suits variable or uncertain workloads and shifting needs without over- or underprovisioning."
    takeaway: A steady, long-running workload earns the biggest discount by committing to its usage for a term.
    history: []
    verified:
      keyHash: 561f34ee4517
      fullHash: 79c7ce955816
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-6ecr7r
    version: 1
    status: live
    type: single
    pool: exam
    concept: pay-less-by-using-more
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 3
    stem: >-
      An online video course provider keeps adding data to Amazon S3, and its price per gigabyte drops as the total grows, even though it has signed no commitment.
      Which pricing principle explains the lower unit price?
    options:
      - id: a
        text: Pay less by using more
        correct: true
        why: The unit price falls with volume through tiered pricing, which needs no commitment, only growing usage.
      - id: b
        text: Save when you commit
        why: Commitment discounts need a usage promise over a term, and the provider has signed none.
      - id: c
        text: Pay as you go
        why: Paying as you go explains paying only for use, but by itself it does not lower the price of each extra gigabyte.
      - id: d
        text: Bring your own license
        why: Reusing licenses affects software costs, while the falling storage rate here comes from volume.
    evidence:
      - "Pay less by using more: economies of scale lower the unit price as usage grows, and some services use tiered pricing."
      - Committing and using more sound alike, but one rewards a time commitment, the other sheer volume.
    takeaway: A unit price that falls as usage grows, with no commitment signed, is the pay less by using more principle.
    history: []
    verified:
      keyHash: 57ac80c10633
      fullHash: 0d3ab7848766
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-8xhk1d
    version: 1
    status: retired
    type: multi
    select: 2
    pool: exam
    concept: cost-drivers
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 2
    stem: >-
      A graphic design studio now stops its idle Amazon EC2 instances every night and deletes the Amazon EBS snapshots it no longer needs.
      It still sends the same amount of data out to the internet, and it keeps its Region and pricing model.
      Which fundamental cost drivers do these changes lower?
    options:
      - id: a
        text: Compute time
        correct: true
        why: EC2 compute is billed over time from launch until the instance stops, so stopping idle instances at night lowers it.
      - id: b
        text: Data storage
        correct: true
        why: Storage is billed by the amount kept and for how long, so deleting unneeded EBS snapshots lowers it.
      - id: c
        text: Outbound transfer
        why: Outbound transfer is a main cost driver, but the studio sends the same amount of data out, so this charge does not drop.
      - id: d
        text: Region choice
        why: The Region sets the rates the drivers are billed at, and the studio keeps the same one, so nothing changes there.
      - id: e
        text: Pricing model
        why: The pricing model sets the rate paid for usage, and the studio keeps its model, so its changes act elsewhere.
    evidence:
      - The three main drivers are compute, storage and outbound data transfer.
      - "Compute (EC2, Lambda, ECS): processing power over time, per hour or second, from launch until you stop the instance, unless a reservation fixed the price."
      - "Storage (S3, EBS): the amount provisioned or used and for how long, typically per gigabyte, across options for keeping, reaching, securing and analyzing data."
    takeaway: Stopping idle instances cuts the compute driver and deleting unused data cuts the storage driver, two of the three main AWS cost drivers.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The stem says the Region, pricing model and outbound data stay the same, which rules out options 2, 3 and 5 without any knowledge of cost drivers."
