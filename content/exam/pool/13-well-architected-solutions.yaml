  - id: q-svzr0m
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-workspaces
    note: m13/aws-specialized-services
    task: "3.8"
    level: 3
    stem: >-
      An architecture firm has staff who work from home and from client sites.
      Each person needs a complete desktop that keeps their files and settings between sessions and works like an office computer.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon AppStream 2.0
        why: AppStream 2.0 streams individual applications to a browser, not a complete persistent desktop for each person.
      - id: b
        text: Amazon WorkSpaces
        correct: true
        why: WorkSpaces delivers a fully managed, persistent desktop that staff reach securely from anywhere like an office PC.
      - id: c
        text: Amazon WorkSpaces Secure Browser
        why: Secure Browser is a managed browser for web-only work, so it does not give staff a full desktop.
      - id: d
        text: Amazon Lightsail
        why: Lightsail offers simple virtual servers for hosting, not managed desktops for staff to work in.
    evidence:
      - "**Amazon WorkSpaces**: fully managed virtual desktop infrastructure, a complete persistent desktop staff reach securely from anywhere and use like an office PC, cost-efficient and easy to run."
      - WorkSpaces gives a full desktop, AppStream 2.0 streams apps (the course's pick for staff SaaS access) and Secure Browser suits web-only work.
    takeaway: When staff need a full, persistent desktop reachable from anywhere, Amazon WorkSpaces fits rather than app streaming or a secure browser.
    history: []
    verified:
      keyHash: 64bce8c8a32c
      fullHash: 4536826f53b2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
