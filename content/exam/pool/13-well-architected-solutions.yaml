  - id: q-t276zs
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-well-architected-tool
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 3
    stem: >-
      A logistics company wants a free, self-service way to answer structured design questions about one of its workloads.
      It wants to skip questions that are irrelevant to it, record milestones over time and receive a list of issues, each with a suggested fix.
      Which AWS service fits?
    options:
      - id: a
        text: AWS Trusted Advisor
        why: Trusted Advisor runs automated checks on an account, but it does not walk a team through design questions about a workload.
      - id: b
        text: AWS Config
        why: AWS Config records and evaluates resource configurations, which is not a question-based design review with milestones.
      - id: c
        text: AWS Well-Architected Tool
        correct: true
        why: The Well-Architected Tool reviews a defined workload through questions, allows not-applicable answers, tracks milestones and reports fixes.
      - id: d
        text: AWS Cost Explorer
        why: Cost Explorer views and forecasts spending, so it cannot run a design review of a workload.
    evidence:
      - You define a workload, run the review on your account and get a report of issues, each with a best-practice fix.
      - "Features: workload reviews at its core, milestone tracking and custom lenses that adapt evaluations and improvement plans."
      - A free, self-service AWS service for reviewing and improving workloads against the six pillars.
    takeaway: The free AWS Well-Architected Tool runs question-based reviews of a workload and returns issues with suggested fixes and milestones.
    history: []
