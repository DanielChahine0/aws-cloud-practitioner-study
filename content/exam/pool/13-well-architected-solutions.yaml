questions:
  - id: q-9gvyy0
    version: 1
    status: live
    type: single
    pool: exam
    concept: cost-optimization-pillar
    note: m13/aws-well-architected-framework
    task: "1.4"
    level: 2
    stem: >-
      A regional clinic finds that several test environments from a finished project are still running and billing every month.
      The team shuts them down and removes them so the charges stop.
      Which Well-Architected pillar does this practice support most directly?
    options:
      - id: a
        text: Cost Optimization
        correct: true
        why: Removing resources nobody needs ends their charges, which is the spending focus of Cost Optimization.
      - id: b
        text: Reliability
        why: Reliability is about recovering from failures and growing with demand, not about ending charges for idle resources.
      - id: c
        text: Operational Excellence
        why: Operational Excellence covers running, monitoring and releasing systems well, while this change is about cutting spend.
      - id: d
        text: Performance Efficiency
        why: Performance Efficiency fits resource sizes to a live workload, but these environments serve no workload at all.
    evidence:
      - "**Cost Optimization**: lower spend through smarter allocation, such as cheaper specs for an underused instance and deprovisioning unneeded services."
      - Fitting capacity to the real workload is Performance Efficiency in the assessment; cutting spend via purchase options, budgets or deprovisioning is Cost Optimization.
    takeaway: Deprovisioning resources that no longer serve a purpose is a Cost Optimization practice, because it ends charges for unused capacity.
    history: []
    verified:
      keyHash: 2af72ba70b7b
      fullHash: ed7dc6245062
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-rf5xbp
    version: 1
    status: retired
    type: single
    pool: exam
    concept: cost-optimization-pillar
    note: m13/aws-well-architected-framework
    task: "1.4"
    level: 2
    stem: >-
      A bike rental shop runs a steady booking workload all year and sees short, unpredictable surges on sunny weekends.
      Its instances already match what the workload needs, but every one of them runs as an On-Demand Instance.
      The owner commits to a Savings Plan for the year-round load and moves the weekend surge capacity to Spot Instances.
      Which Well-Architected pillar does this change support most directly?
    options:
      - id: a
        text: Performance Efficiency
        why: The instances already fit the workload, and this change alters only how the same capacity is bought, not its size or type.
      - id: b
        text: Cost Optimization
        correct: true
        why: Moving from On-Demand to a Savings Plan for steady use and Spot for brief surges lowers the price of the same capacity, a Cost Optimization practice.
      - id: c
        text: Sustainability
        why: Sustainability favors replacing always-on resources to cut energy use, while here the same instances keep running under new pricing.
      - id: d
        text: Reliability
        why: Reliability plans recovery from failures and growth, and a new way of paying for instances does not change how bookings survive an outage.
    evidence:
      - Fitting capacity to the real workload is Performance Efficiency in the assessment; cutting spend via purchase options, budgets or deprovisioning is Cost Optimization.
      - Fitting size to workload points to Performance Efficiency, purchase options and deprovisioning to Cost Optimization, serverless over always-on to Sustainability.
    takeaway: Changing purchase options, such as a Savings Plan for steady load and Spot for surges, is a Cost Optimization practice rather than a sizing one.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The item asks which Well-Architected pillar a change supports, which task 1.2 design principles covers better than 1.4 cloud economics."
  - id: q-n6z8bs
    version: 1
    status: live
    type: multi
    pool: exam
    concept: aws-well-architected-framework
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      An online bookstore has handled every order for a year on the same architecture, and nothing has gone down.
      Which reasons does the AWS Well-Architected Framework give for examining this design again?
    select: 2
    options:
      - id: a
        text: The framework sorts its guidance into six pillars, from Operational Excellence to Sustainability.
        why: The pillar structure is true of the framework, but it describes how the guidance is organized rather than why the bookstore's design needs another look.
      - id: b
        text: Requirements change over time, so sizes and processes picked at launch need a fresh look.
        correct: true
        why: The framework expects needs to change, so a design that fit last year should be resized, refined and trimmed of waste as the workload becomes clearer.
      - id: c
        text: The AWS Well-Architected Tool is a free, self-service way to check a workload against the pillars.
        why: The tool being free is true, but its price is not a reason the framework gives for examining a design that already runs.
      - id: d
        text: The framework sets its bar at secure, resilient and efficient, which is higher than merely running.
        correct: true
        why: A year without downtime shows the design runs, but the framework also asks whether it is secure, resilient and efficient, which still needs checking.
      - id: e
        text: The AWS Well-Architected Tool lets a reviewer mark a question as not applicable to a workload.
        why: Skipping questions is a true feature of the tool, but it explains how a review runs rather than why the bookstore should look at its design again.
    evidence:
      - The framework aims past merely working, at secure, high-performing, resilient and efficient designs, with one consistent method for any workload.
      - Needs change, so the pillars keep asking you to refine processes, resize as the workload becomes clearer and trim waste.
    takeaway: The Well-Architected Framework treats a working design as a starting point, because needs change and working is not the same as well built.
    history: []
    verified:
      keyHash: aa673a459663
      fullHash: e24f41f96b52
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-7046zk
    version: 1
    status: live
    type: single
    pool: exam
    concept: operational-excellence-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      A mobile game studio deploys updates by hand, and missed steps keep breaking production during launches.
      It plans to push every release through an automated pipeline and to sharpen how staff respond to incidents.
      Which Well-Architected pillar does this plan address?
    options:
      - id: a
        text: Reliability
        why: Reliability centers on recovering from failures and growing with demand, not on how releases are carried out.
      - id: b
        text: Security
        why: Security is about least-privilege access and protecting data, which this release plan does not change.
      - id: c
        text: Operational Excellence
        correct: true
        why: Automated releases and better incident response are core parts of running systems well under Operational Excellence.
      - id: d
        text: Performance Efficiency
        why: Performance Efficiency sizes resources to the workload, while the studio's problem is its manual release process.
    evidence:
      - "**Operational Excellence**: running and monitoring systems for business value, improving processes, pipeline-automated releases and good event response."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: Automated release pipelines and well-run incident response are hallmarks of the Operational Excellence pillar.
    history: []
    verified:
      keyHash: 6e1588501dbc
      fullHash: 0b448aca0450
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-8rsp1g
    version: 1
    status: live
    type: multi
    pool: exam
    concept: security-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      A credit union is checking its online banking design against the Security pillar of the AWS Well-Architected Framework.
      Which practices belong to that pillar?
    select: 2
    options:
      - id: a
        text: Give each staff role only the permissions its work requires.
        correct: true
        why: Least-privilege access is a central Security practice, because it limits what any one identity can reach.
      - id: b
        text: Spread the database across several Availability Zones with automatic recovery.
        why: Multiple Availability Zones and automatic recovery point to Reliability, which plans for failures.
      - id: c
        text: Encrypt member data both while stored and while it travels.
        correct: true
        why: Encrypting data at rest and in transit protects it from exposure, which is what the Security pillar asks for.
      - id: d
        text: Resize servers so their memory matches what the workload needs.
        why: Matching server size to the workload is Performance Efficiency, which is about fit rather than protection.
      - id: e
        text: Send every release through an automated deployment pipeline.
        why: Automated releases are an Operational Excellence practice, aimed at running systems well rather than guarding them.
    evidence:
      - "**Security**: protection built in, with least-privilege access, intact data and guarded systems."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: Least-privilege access and encryption of data at rest and in transit are the clearest cues for the Security pillar.
    history: []
    verified:
      keyHash: 44f3f04a00d8
      fullHash: 6486281c7b9f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
