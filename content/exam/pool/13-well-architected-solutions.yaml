    concept: amazon-connect
    note: m13/aws-specialized-services
    task: "3.8"
    level: 1
    stem: >-
      Which AWS service provides a cloud contact center that routes customer calls and chats to agents and records the conversations?
    options:
      - id: a
        text: Amazon Simple Email Service (Amazon SES)
        why: Amazon SES sends email from applications, and it does not handle calls, chats or agent routing.
      - id: b
        text: Amazon Lex
        why: Amazon Lex builds conversational chatbots, but it is not a full contact center that routes and records calls.
      - id: c
        text: Amazon Connect
        correct: true
        why: Amazon Connect is the cloud contact center, with routing of calls and chats, recording and analytics.
      - id: d
        text: Amazon Simple Notification Service (Amazon SNS)
        why: Amazon SNS pushes notifications to subscribers, which is not a service for agents to take customer calls.
    evidence:
      - "**Amazon Connect**: AI-powered cloud contact center for calls and chats, with call routing, recording, analytics and AWS integrations."
      - Calls, routing and analytics mean Amazon Connect; SES is email only and WorkSpaces is a desktop.
    takeaway: A cloud contact center that routes, records and analyzes customer calls and chats is Amazon Connect.
