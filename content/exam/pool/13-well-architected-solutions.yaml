  - id: q-edk4p5
    version: 1
    status: live
    type: single
    pool: exam
    concept: performance-efficiency-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 3
    stem: >-
      A video editing startup sees its rendering jobs run short of memory and slow down on the instance type it chose at launch.
      The team switches to an instance type sized for the jobs' memory needs and schedules regular checks as the workload changes.
      Which Well-Architected pillar does this work fall under?
    options:
      - id: a
        text: Cost Optimization
        why: Cost Optimization lowers spend, but the startup moved to a size that fits the jobs rather than a cheaper one.
      - id: b
        text: Sustainability
        why: Sustainability favors avoiding always-on resources to cut energy use, which this sizing change does not aim at.
      - id: c
        text: Reliability
        why: Reliability plans recovery from failures, while these jobs are slow because the instance does not fit their needs.
      - id: d
        text: Performance Efficiency
        correct: true
        why: Sizing resources to a workload's memory needs and revisiting that as needs shift is the focus of Performance Efficiency.
    evidence:
      - "**Performance Efficiency**: sizing resources, such as an EC2 instance, to workload and memory needs, and revisiting that as needs move."
      - Fitting capacity to the real workload is Performance Efficiency in the assessment; cutting spend via purchase options, budgets or deprovisioning is Cost Optimization.
    takeaway: Matching resource sizes to what a workload actually needs, and rechecking as it changes, belongs to the Performance Efficiency pillar.
    history: []
