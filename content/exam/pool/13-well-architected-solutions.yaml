  - id: q-3r5mzf
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-iot-core
    note: m13/aws-specialized-services
    task: "3.8"
    level: 1
    stem: >-
      Which AWS service securely connects sensor-equipped physical devices to cloud applications and helps ingest, process and act on the data they send?
    options:
      - id: a
        text: Amazon EventBridge
        why: EventBridge routes events between applications and services, but it is not built to connect and secure physical devices.
      - id: b
        text: AWS IoT Core
        correct: true
        why: IoT Core links devices to cloud apps with mutual authentication and encryption and handles the data they send.
      - id: c
        text: Amazon Kinesis Data Streams
        why: Kinesis Data Streams collects streaming records, but it does not authenticate and manage connections from devices.
      - id: d
        text: AWS AppSync
        why: AppSync builds GraphQL APIs for web and mobile frontends, not secure links for sensor devices.
    evidence:
      - "**AWS IoT Core**: managed service that securely links devices to cloud apps and simplifies ingesting, processing and acting on their data, using mutual authentication, end-to-end encryption and a choice of protocols."
      - IoT needs a sensing physical device, managed with AWS IoT Core; a plain app or software feature does not count.
    takeaway: Securely connecting physical sensor devices to the cloud and acting on their data is the job of AWS IoT Core.
    history: []
    verified:
      keyHash: ed6c34798f74
      fullHash: 3e7af6d45494
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
