      - id: b
        text: Reliability
        correct: true
        why: Reliability is the pillar that plans recovery from failures and lets a workload keep up as needs grow.
      - id: c
        text: Performance Efficiency
        why: Performance Efficiency fits resource sizes to the workload, which is about fit rather than surviving failures.
      - id: d
        text: Security
        why: Security protects data and systems with least-privilege access, which does not address recovering from failures.
    evidence:
      - "**Reliability**: planning recovery from failures and adapting as business and customer needs grow."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: Planning for failure recovery and growth, often with multiple Availability Zones, is the job of the Reliability pillar.
