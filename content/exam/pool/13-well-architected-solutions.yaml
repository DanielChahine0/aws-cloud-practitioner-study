    concept: sustainability-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 1
    stem: >-
      Which Well-Architected pillar favors event-driven functions over servers left running around the clock in order to lower energy use and carbon impact?
    options:
      - id: a
        text: Performance Efficiency
        why: Performance Efficiency fits resource sizes to the workload, and its aim is a good fit rather than lower energy use.
      - id: b
        text: Reliability
        why: Reliability plans recovery from failures and growth, which does not depend on cutting energy use.
      - id: c
        text: Sustainability
        correct: true
        why: Sustainability seeks energy-efficient, lower-impact designs, such as replacing always-on servers with functions that run on demand.
      - id: d
        text: Cost Optimization
        why: Cost Optimization lowers spend through allocation and purchase choices, and its goal is the bill rather than carbon impact.
    evidence:
      - "**Sustainability**: energy-efficient, lower-impact designs that avoid always-on resources, like Lambda over a nonstop EC2 instance or a smaller RDS instance, cutting cost, energy and carbon."
      - Fitting size to workload points to Performance Efficiency, purchase options and deprovisioning to Cost Optimization, serverless over always-on to Sustainability.
    takeaway: Choosing serverless or elastic resources over always-on ones to cut energy and carbon is the Sustainability pillar's main cue.
