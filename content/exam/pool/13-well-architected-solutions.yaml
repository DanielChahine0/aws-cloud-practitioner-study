  - id: q-8zxn1k
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-x-ray
    note: m13/aws-specialized-services
    task: "3.8"
    level: 3
    stem: >-
      A travel booking website has a slow checkout, and each request passes through several backend services.
      Developers want to follow individual requests end to end and see which service is causing the delay.
      Which AWS service fits?
    options:
      - id: a
        text: AWS CodeBuild
        why: CodeBuild compiles, tests and packages code, which does nothing to follow live requests through the app.
      - id: b
        text: AWS X-Ray
        correct: true
        why: X-Ray traces requests across the app and shows where time is spent, so developers can find the slow service.
      - id: c
        text: AWS CloudTrail
        why: CloudTrail records API calls made in an account for auditing, not the path and timing of user requests.
      - id: d
        text: AWS AppSync
        why: AppSync builds GraphQL APIs over data sources, and it does not trace requests to find bottlenecks.
    evidence:
      - "**AWS X-Ray**: monitors and traces requests so developers can visualize app behavior, find bottlenecks, debug faster and tune efficiency and reliability."
      - CodeBuild does CI builds and CodePipeline the whole release, but only X-Ray visualizes and debugs app behavior.
    takeaway: Tracing requests across services to find bottlenecks and debug an app points to AWS X-Ray.
    history: []
    verified:
      keyHash: 42d3fba8944e
      fullHash: 2789086fc4eb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
