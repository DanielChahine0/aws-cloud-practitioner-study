    stem: >-
      A pharmacy chain keeps its database servers in a private subnet.
      They must download software updates from the internet, but nothing on the internet may open a connection to them.
      Which component fits?
    options:
      - id: a
        text: A NAT gateway
        correct: true
        why: A NAT gateway lets the private servers start outbound connections while refusing connections started from outside.
      - id: b
        text: An internet gateway
        why: Routing the servers through an internet gateway alone would make them reachable, which the chain must avoid.
      - id: c
        text: A virtual private gateway
        why: A virtual private gateway admits traffic from approved networks, not outbound downloads from the internet.
      - id: d
        text: AWS Transit Gateway
        why: Transit Gateway is a hub joining VPCs and on-premises networks, not a one-way path out to the internet.
    evidence:
      - Transit Gateway is a hub, a NAT gateway lets private instances call out but not be called, and API Gateway manages APIs.
    takeaway: Private instances that must reach out to the internet but stay unreachable from it need a NAT gateway.
