questions:
  - id: q-dh7zn7
    version: 1
    status: live
    type: single
    pool: exam
    concept: security-groups
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.1"
    level: 2
    stem: >-
      An online bookstore runs its storefront on Amazon EC2 instances and wants only HTTPS requests to reach them.
      Under the AWS shared responsibility model, who sets up the security group rules that do this?
    options:
      - id: a
        text: The bookstore, as part of security in the cloud
        correct: true
        why: Traffic rules around the bookstore's own instances are customer settings, so writing them is the bookstore's job.
      - id: b
        text: AWS, as part of security of the cloud
        why: Security of the cloud covers the hardware and facilities, not the rules a customer writes for its own instances.
      - id: c
        text: AWS, since the filtering runs on its own network
        why: AWS runs the filtering engine, but which requests the storefront accepts is a choice only the bookstore can make.
      - id: d
        text: The bookstore and AWS, each writing half the rules
        why: The model does not split one security group's rules between the parties; the customer owns all of them.
    evidence:
      - Under the AWS Shared Responsibility Model, setting up network ACLs and security groups for your subnets and resources is your job.
      - That is security IN the cloud, the traffic protection around your own applications.
    takeaway: Writing security group rules for your own instances is the customer's part of security in the cloud.
    history: []
    verified:
      keyHash: 0bed28e48039
      fullHash: 62c4c4928b5f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-s9nr6v
    version: 1
    status: live
    type: single
    pool: exam
    concept: security-groups
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.1"
    level: 1
    stem: >-
      Under the AWS shared responsibility model, which security group task falls to a customer that runs Amazon EC2 instances?
    options:
      - id: a
        text: Choosing which inbound traffic each group allows
        correct: true
        why: The customer decides which senders and ports a security group admits, which is security in the cloud.
      - id: b
        text: Running the filtering software that enforces group rules
        why: The software that enforces the rules is part of the service AWS operates, so it is security of the cloud.
      - id: c
        text: Patching the operating system inside each instance
        why: Patching the guest operating system is a customer job, but it is not a security group task as the stem asks.
      - id: d
        text: Securing the physical hosts that run the instances
        why: The hosts behind EC2 are AWS hardware, so protecting them falls under security of the cloud.
    evidence:
      - Under the AWS Shared Responsibility Model, setting up network ACLs and security groups for your subnets and resources is your job.
      - AWS owns security OF the cloud, meaning the software, hardware, data centers and facilities behind its services.
    takeaway: AWS runs and secures the software and hardware behind security groups, while the customer writes each group's traffic rules.
    history: []
