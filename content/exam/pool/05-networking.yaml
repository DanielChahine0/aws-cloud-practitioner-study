  - id: q-8mrwfx
    version: 1
    status: live
    type: single
    pool: exam
    concept: network-acls
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.4"
    level: 3
    stem: >-
      An insurance broker must stop one known hostile range of IP addresses from reaching any instance in a subnet, while other traffic keeps flowing.
      Which VPC control can block that range with a deny rule?
    options:
      - id: a
        text: A network ACL
        correct: true
        why: A network ACL guards the whole subnet edge and accepts deny rules, so it can turn away that one range.
      - id: b
        text: A security group
        why: A security group takes allow rules only, so it cannot name a range to refuse.
      - id: c
        text: A route table
        why: A route table decides where traffic is sent, not which senders are refused at the subnet edge.
      - id: d
        text: An internet gateway
        why: An internet gateway connects the VPC to the internet and has no rules for turning senders away.
    evidence:
      - Network ACLs work at the subnet level, are stateless, and support both allow and deny rules.
      - "Picture the network ACL as the subnet's border guard: a virtual firewall judging everything that enters or leaves the whole subnet."
    takeaway: To refuse specific senders for a whole subnet, use a network ACL deny rule, since security groups only allow.
    history: []
    verified:
      keyHash: 983e95189bc2
      fullHash: d9bdfafa80c5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-ya8kp0
    version: 1
    status: live
    type: single
    pool: exam
    concept: network-acls
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.4"
    level: 2
    stem: >-
      A video production studio creates a custom network ACL for a new subnet and associates it before writing any rules.
      What happens to traffic crossing that subnet's edge?
    options:
      - id: a
        text: All of it is denied until allow rules are added
        correct: true
        why: A new custom network ACL refuses everything, so the studio must add allow rules before any traffic passes.
      - id: b
        text: All of it is allowed until deny rules are added
        why: Allowing everything is how the default network ACL behaves, not a newly created custom one.
      - id: c
        text: Inbound is denied while outbound is allowed
        why: That split describes a security group's starting point, while a custom network ACL refuses both directions.
      - id: d
        text: Replies to outbound requests pass in automatically
        why: A network ACL is stateless and keeps no memory of requests, so replies get no automatic pass.
    evidence:
      - "A custom network ACL starts the other way round: nothing passes until you add allow rules."
      - Every AWS account comes with a default network ACL that lets everything through until you edit its rules.
    takeaway: A custom network ACL blocks all traffic until you add allow rules, unlike the default one that lets everything pass.
    history: []
    verified:
      keyHash: be0ab6a622f0
      fullHash: c07dc51b338d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-1279ew
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-global-accelerator
    note: m05/global-networking
    task: "3.2"
    level: 3
    stem: >-
      A ride-hailing company runs its booking API in more than one AWS Region for riders around the world.
      It wants rider traffic sent to fixed IP addresses and carried on the AWS private backbone, and moved quickly to a healthy Region if one fails.
      Which service fits?
    options:
      - id: a
        text: AWS Global Accelerator
        correct: true
        why: Global Accelerator gives static IP addresses and steers traffic over the AWS network to healthy endpoints with fast failover.
      - id: b
        text: Amazon CloudFront
        why: CloudFront caches content at edge locations, but the need here is fast failover of live API traffic between Regions.
      - id: c
        text: Amazon Route 53
        why: Route 53 answers DNS lookups, but it does not give the API fixed IP addresses or carry traffic on the AWS backbone.
      - id: d
        text: AWS Transit Gateway
        why: Transit Gateway links VPCs and on-premises networks as a hub, not riders on the internet to the closest healthy Region.
    evidence:
      - Global Accelerator moves app traffic off crowded public routes onto the AWS private global network for better availability, performance and security.
      - The assessment adds static IP addresses and a best-endpoint choice based on endpoint health, user location and your policies.
      - Global Accelerator offers static IPs and health-aware routing over the AWS global network with fast failover.
    takeaway: Static IPs plus fast, health-aware failover across Regions on the AWS network point to Global Accelerator.
    history: []
    verified:
      keyHash: e671f89001b9
      fullHash: d9c81ee775bb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-nx831h
    version: 1
    status: retired
    type: multi
    select: 2
    pool: exam
    concept: direct-connect-failover
    note: m05/global-architectures
    task: "3.2"
    level: 2
    stem: >-
      A freight-tracking firm reaches its VPC from its own data center over a single dedicated private cable that bypasses the public internet.
      An architecture review flags that cable as a single point of failure in the firm's hybrid setup.
      Which options remove that single point of failure?
    options:
      - id: a
        text: An AWS Site-to-Site VPN connection
        correct: true
        why: An encrypted VPN tunnel over the internet can carry the data center traffic to the VPC while the dedicated cable is down.
      - id: b
        text: A second AWS Direct Connect line
        correct: true
        why: The existing cable is itself a Direct Connect line, so another one gives a separate physical path that survives a cut on the first.
      - id: c
        text: An AWS Transit Gateway network hub
        why: Transit Gateway routes between networks already attached to it, but it adds no second physical path out of the data center.
      - id: d
        text: A NAT gateway in a public subnet
        why: A NAT gateway lets private instances reach out to the internet, but it gives the data center no backup way into the VPC.
      - id: e
        text: An AWS PrivateLink interface endpoint
        why: PrivateLink gives the VPC private access to chosen services, but it is not a connection that can stand in for the cut cable.
    evidence:
      - Direct Connect is a physical cable that can be cut, so a VPN often stands by as its failover, or a second Direct Connect line does.
      - A VPN or a second Direct Connect line can provide failover, and multiple connections add bandwidth.
    takeaway: A lone Direct Connect line is a single point of failure, so a VPN or a second Direct Connect connection should stand by as its failover.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 1 and 4 are the only on-premises-to-AWS connection types; the rest are VPC-side components.)"
