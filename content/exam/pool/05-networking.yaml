    concept: amazon-cloudfront
    note: m05/global-networking
    task: "3.5"
    level: 2
    stem: >-
      A recipe website hosts its photos and pages in a single AWS Region, but visitors on other continents complain that pages load slowly.
      Which service serves cached copies of the content from locations near those visitors?
    options:
      - id: a
        text: Amazon CloudFront
        correct: true
        why: CloudFront is a CDN that keeps copies at edge locations near visitors, so pages travel a shorter distance.
      - id: b
        text: Amazon Route 53
        why: Route 53 turns the site's name into an address but stores no copies of photos or pages near visitors.
      - id: c
        text: AWS Global Accelerator
        why: Global Accelerator routes traffic over the AWS network to healthy endpoints, but it does not cache site content.
      - id: d
        text: AWS Direct Connect
        why: Direct Connect is a private line from a data center to AWS and does nothing for public visitors far away.
    evidence:
      - CloudFront is a CDN (content delivery network) that securely serves static and dynamic web content from edge locations near customers, for faster loads, lower cost and reliability.
      - CloudFront caches static and dynamic content at edge locations near users.
    takeaway: Slow loads for distant visitors call for CloudFront, which caches content at edge locations close to them.
