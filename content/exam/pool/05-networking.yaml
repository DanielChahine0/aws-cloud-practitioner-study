    stem: >-
      Which tasks can Amazon Route 53 perform?
    options:
      - id: a
        text: Registering new domain names
        correct: true
        why: Route 53 can register domains and take over records from other registrars, keeping them in one place.
      - id: b
        text: Checking the health of endpoints
        correct: true
        why: Route 53 runs health checks on endpoints so it can route users toward ones that respond.
      - id: c
        text: Caching content at edge locations
        why: Caching copies of content near users is the job of Amazon CloudFront, not the DNS service.
      - id: d
        text: Filtering packets at a subnet edge
        why: Checking packets as they cross a subnet edge is done by network ACLs inside the VPC.
      - id: e
        text: Carrying traffic on a private line
        why: A dedicated private line from a data center is AWS Direct Connect, not a DNS feature.
    evidence:
      - It also runs health checks, registers new domains and takes over DNS records from other registrars, so all your domains live in one place.
      - Route 53 resolves names, routes with policies, runs health checks, and registers or consolidates domains.
    takeaway: Beyond DNS lookups, Route 53 registers and consolidates domains and runs health checks on endpoints.
