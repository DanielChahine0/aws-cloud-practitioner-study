    concept: internet-gateway
    note: m05/organizing-aws-cloud-resources
    task: "3.5"
    level: 1
    stem: >-
      Which component must be attached to a VPC before anyone on the public web can reach the resources inside it?
    options:
      - id: a
        text: An internet gateway
        correct: true
        why: An internet gateway is the VPC's connection to the internet, so public requests cannot enter without one.
      - id: b
        text: A NAT gateway
        why: A NAT gateway lets private instances start outbound connections and blocks ones started from the internet.
      - id: c
        text: A virtual private gateway
        why: A virtual private gateway admits protected traffic from approved networks, not open requests from the public web.
      - id: d
        text: A security group
        why: A security group filters traffic for an instance, but it does not join the VPC to the internet.
    evidence:
      - An internet gateway joins a VPC to the internet, and you must attach one before public traffic can flow in or out.
      - An internet gateway is required for any internet traffic to reach the VPC.
    takeaway: Public internet traffic enters a VPC only through an attached internet gateway.
