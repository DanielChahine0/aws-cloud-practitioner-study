    concept: aws-privatelink
    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 3
    stem: >-
      Which AWS service lets a VPC reach one specific service in another VPC as if that service were local, without a public IP address or an internet gateway?
    options:
      - id: a
        text: AWS PrivateLink
        correct: true
        why: PrivateLink exposes only the chosen service to the VPC over a private path, with no public IP or internet gateway.
      - id: b
        text: AWS Transit Gateway
        why: Transit Gateway joins whole networks through a hub rather than exposing one service as if it were local.
      - id: c
        text: AWS Direct Connect
        why: Direct Connect is a dedicated line from a data center to AWS, not private access between VPC services.
      - id: d
        text: AWS Client VPN
        why: Client VPN gives remote people access to AWS, not one VPC private access to a service in another.
    evidence:
      - "For resources: highly available, scalable private access from a VPC to services as if they were inside it, including other VPCs, other clouds and on-premises networks."
      - It needs no public IP, NAT device, internet gateway, VPN or Direct Connect, and you pick exactly what is reachable, so traffic stays protected and rules simple.
    takeaway: Private access from a VPC to one chosen service, as if it were local, is the job of AWS PrivateLink.
