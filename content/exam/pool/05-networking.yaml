      Which AWS service gives a company its own private, isolated network inside the AWS Cloud, with address ranges and subnets that the company chooses?
    options:
      - id: a
        text: Amazon VPC
        correct: true
        why: Amazon VPC creates an isolated network in the AWS Cloud whose ranges and subnets the customer defines.
      - id: b
        text: AWS Direct Connect
        why: Direct Connect is a private line into AWS, not the isolated network that resources live in.
      - id: c
        text: AWS Transit Gateway
        why: Transit Gateway connects existing networks through a hub rather than creating an isolated network.
      - id: d
        text: AWS PrivateLink
        why: PrivateLink gives private access to services from a network, but it does not create the network itself.
    evidence:
      - Amazon VPC gives you a logically isolated part of the AWS Cloud with a virtual network you design.
      - A VPC is your own logically isolated network in the AWS Cloud.
    takeaway: Amazon VPC is the service for a private, isolated network in AWS whose address ranges and subnets you define.
