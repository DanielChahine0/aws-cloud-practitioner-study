      - id: b
        text: AWS Direct Connect
        why: Direct Connect is a dedicated line, which the retailer does not need for modest office traffic.
      - id: c
        text: AWS Client VPN
        why: Client VPN connects individual remote users rather than whole branch office networks.
      - id: d
        text: AWS Transit Gateway
        why: Transit Gateway is a hub that joins networks, but it is not the encrypted office link itself.
