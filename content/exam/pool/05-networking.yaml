    concept: aws-direct-connect
    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 3
    stem: >-
      A genomics lab moves very large datasets from its data center to AWS every day.
      It needs steady, high throughput on a path separate from the shared public internet.
      Which service fits?
    options:
      - id: a
        text: AWS Direct Connect
        correct: true
        why: Direct Connect gives the lab a dedicated private line with the bandwidth and consistency these transfers need.
      - id: b
        text: AWS Site-to-Site VPN
        why: A Site-to-Site VPN runs over the shared internet, so heavy daily transfers can slow down.
      - id: c
        text: AWS Client VPN
        why: Client VPN connects individual remote users, not a data center moving bulk data.
      - id: d
        text: AWS PrivateLink
        why: PrivateLink gives a VPC private access to services, not a high-bandwidth line from a data center.
    evidence:
      - Shared links can jam, so Direct Connect gives a dedicated private line from your network to a VPC (via a Direct Connect location and a virtual private gateway), cutting costs and raising bandwidth.
      - Direct Connect is the dedicated high-bandwidth link, worth it only when you need that bandwidth.
    takeaway: Large, steady transfers from a data center that must avoid the shared internet point to Direct Connect.
