    concept: cloudtrail-event-history
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      A small architecture firm wants to look up management actions taken in its account over the past few weeks in one Region.
      It wants to do this right away, with no setup and no extra charge.
      Which AWS CloudTrail feature fits?
    options:
      - id: a
        text: Event history
        correct: true
        why: Event history is available without setup and shows recent management events per Region for free, so the firm can search it now.
      - id: b
        text: A trail sending logs to Amazon S3
        why: A trail must be created first and stores logs in S3, so it only captures actions from the moment it starts.
      - id: c
        text: CloudTrail Insights
        why: Insights must be enabled and only flags unusual API volume or error rates, rather than listing the firm's recent actions.
      - id: d
        text: Log file integrity validation
        why: Integrity validation proves delivered log files were left untouched, which does nothing to list recent account actions.
    evidence:
      - "Single actions (API or console calls); event history shows 90 days of management events per Region, free, searchable, downloadable, unchangeable"
      - "Event history: free 90-day view of management events."
    takeaway: CloudTrail event history is a free, ready-made view of recent management events in each Region.
