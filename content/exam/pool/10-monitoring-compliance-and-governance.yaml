    concept: cloudwatch-metrics
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 2
    stem: >-
      A print shop's ordering app on Amazon EC2 keeps a running count of pages each printer has produced, a value AWS has no built-in measure for.
      The shop wants that count tracked over time in Amazon CloudWatch.
      Which feature should it use?
    options:
      - id: a
        text: A custom CloudWatch metric
        correct: true
        why: A custom metric tracks a value AWS does not measure by default, such as the shop's page count, over time.
      - id: b
        text: A shared CloudWatch dashboard
        why: A dashboard displays metrics that already exist, so the page count must first be tracked as a metric to appear there.
      - id: c
        text: A CloudWatch alarm
        why: An alarm reacts when a metric crosses a threshold, so it needs the page count tracked as a metric before it can act.
      - id: d
        text: A CloudTrail trail
        why: A trail records API calls made in the account, which says nothing about how many pages a printer produced.
    evidence:
      - "Track a value per resource, built in (EC2 CPU) or custom"
      - "Metric: a value tracked over time for a resource or process, such as EC2 CPU use or coffees sold."
    takeaway: A CloudWatch metric tracks a value over time, and custom metrics cover values AWS does not measure by itself.
