    concept: aws-artifact-agreements
    note: m10/compliance
    task: "2.2"
    level: 3
    stem: >-
      A home health agency in the United States uses AWS Organizations.
      It must review and accept the HIPAA business associate addendum that AWS offers, for all of its accounts at once, then keep track of it.
      Where should it do this?
    options:
      - id: a
        text: AWS Artifact Agreements
        correct: true
        why: Artifact Agreements is where a customer reads, accepts and tracks agreements with AWS, including HIPAA ones, across an organization.
      - id: b
        text: AWS Artifact Reports
        why: Artifact Reports supplies audit reports on AWS for download, but agreements are accepted in the other part of Artifact.
      - id: c
        text: AWS Audit Manager
        why: Audit Manager collects evidence about the agency's own controls and offers no place to accept agreements with AWS.
      - id: d
        text: AWS Organizations
        why: Organizations groups and governs the agency's accounts, but agreements with AWS are signed and tracked through Artifact.
    evidence:
      - "Agreements: where you read, sign and track your agreements with AWS, for a single account or across AWS Organizations, including HIPAA ones."
      - "AWS Artifact Agreements: the part of Artifact for signing and tracking agreements with AWS."
    takeaway: Agreements with AWS, such as HIPAA ones, are reviewed, accepted and tracked in AWS Artifact Agreements.
