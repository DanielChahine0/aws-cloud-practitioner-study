  - id: q-897vag
    version: 1
    status: retired
    type: multi
    select: 2
    pool: exam
    concept: amazon-cloudwatch
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 1
    stem: >-
      Which tasks can Amazon CloudWatch perform?
    options:
      - id: a
        text: Record which identity made each API call, and from where
        why: Answering who called an API, and from where, is the auditing job of AWS CloudTrail rather than CloudWatch.
      - id: b
        text: Gather performance numbers from servers in a data center
        correct: true
        why: CloudWatch gives one real-time view of AWS resources, their apps and on-premises servers, so hybrid monitoring fits.
      - id: c
        text: Supply third-party audit reports about the controls of AWS
        why: Audit reports on how AWS itself was assessed come from AWS Artifact, while CloudWatch tracks performance numbers.
      - id: d
        text: Flag unusual changes in the volume of API calls
        why: Spotting API call volume that strays from the normal pattern is the job of CloudTrail Insights, not CloudWatch.
      - id: e
        text: Take an action when a tracked number crosses a set threshold
        correct: true
        why: A CloudWatch alarm reacts to a threshold by sending a notice or changing resources, such as adding instances.
      - id: f
        text: Track the agreements an account has accepted with AWS
        why: Reviewing and tracking agreements with AWS happens in AWS Artifact Agreements, which has no part in monitoring.
    evidence:
      - "Amazon CloudWatch is a single real-time hub for watching AWS resources, the apps on them, and on-premises servers."
      - "An alarm can notify through SNS or scale EC2 automatically."
      - "Choose it for performance numbers and thresholds, not for who called an API."
    takeaway: CloudWatch monitors AWS and on-premises resources in one place and can act when a metric crosses a threshold.
    history: []
    review:
      attempts: 3
      lastFailure: "solve-closed: a second option is defensible: CloudWatch alarms act on thresholds and the agent collects on-premises metrics; CloudWatch anomaly detection on API call metrics could also be argued for option 2."
  - id: q-mtzrh7
    version: 1
