  - id: q-k8826x
    version: 1
    status: live
    type: single
    pool: exam
    concept: cloud-monitoring
    note: m10/introduction-to-monitoring
    task: "2.2"
    level: 2
    stem: >-
      An event ticketing website runs on AWS resources that add and remove capacity on their own as ticket sales rise and fall.
      Why does the ticketing team still need cloud monitoring?
    options:
      - id: a
        text: To confirm resources keep performing well and catch problems early
        correct: true
        why: Scaling happens without the team, so monitoring is how it confirms the site stays healthy and learns of trouble before buyers do.
      - id: b
        text: To show regulators that its sales practices meet the laws that apply
        why: Proving that practices meet laws is compliance, a later step that monitoring supports but does not replace.
      - id: c
        text: To review on a schedule that its access controls work as planned
        why: A scheduled review of controls is auditing, which happens periodically rather than watching health as the site scales.
      - id: d
        text: To keep unauthorized users away from the ticketing servers
        why: Keeping out unauthorized users is the job of security controls, while monitoring watches health and performance.
    evidence:
      - "AWS services scale on their own, so you must keep checking they behave."
      - "Its goal is peak performance and early warning of problems."
    takeaway: Because AWS resources scale on their own, monitoring is how a team keeps checking performance and catches problems early.
