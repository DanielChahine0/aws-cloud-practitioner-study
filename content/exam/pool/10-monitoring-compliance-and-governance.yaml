    concept: cloudtrail-logs
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 3
    stem: >-
      A payment processor must keep a record of every API call in its AWS account for several years to support its PCI audits.
      Which CloudTrail feature keeps those records for that long?
    options:
      - id: a
        text: CloudTrail logs delivered to Amazon S3
        correct: true
        why: Log files sent to S3 have no time cap, so the processor can keep years of API records as audit proof.
      - id: b
        text: CloudTrail event history in the console
        why: Event history keeps only a rolling window of recent management events, far short of the years the audits require.
      - id: c
        text: CloudTrail Insights on a trail
        why: Insights flags unusual spikes in API activity, but it is no long-term store of every call made in the account.
      - id: d
        text: CloudTrail log file integrity validation
        why: Integrity validation shows whether delivered files were altered, but it stores nothing itself and keeps no records for years.
    evidence:
      - "The files holding events, sent to S3 or CloudWatch Logs, no 90-day cap, usable as PCI or HIPAA proof"
      - "Event history is free for 90 days, while S3 logs serve long audits."
    takeaway: For API records that must outlast the event history window, send CloudTrail logs to Amazon S3.
