questions:
  - id: q-28btaj
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-license-manager
    note: m10/governance
    task: "1.4"
    level: 2
    stem: >-
      An engineering consultancy is moving its servers to AWS and plans to keep running database software whose usage rights it already bought from a vendor.
      It wants to track how much of that purchased capacity is in use and stop launches that would exceed its vendor contracts.
      Which service fits?
    options:
      - id: a
        text: AWS License Manager
        correct: true
        why: License Manager tracks the consultancy's own licenses, enforces usage caps and can block launches that would break the contract terms.
      - id: b
        text: AWS Service Catalog
        why: Service Catalog offers approved resources for staff to launch, but it does not count license use against a vendor contract.
      - id: c
        text: AWS Control Tower
        why: Control Tower governs how accounts are set up across an organization, which says nothing about software license counts.
      - id: d
        text: AWS Cost Explorer
        why: Cost Explorer shows AWS spending over time, but it cannot enforce limits on licenses the consultancy bought from a vendor.
    evidence:
      - "License Manager tracks and controls those licenses and tunes their cost."
      - "It curbs noncompliance with usage caps, blocked launches and other controls."
    takeaway: Keeping existing licenses in use and in check on AWS, with usage caps and cost control, is the job of AWS License Manager.
    history: []
    verified:
      keyHash: c7cfba62b6cc
      fullHash: a8aa802c4f17
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-yw2c6v
    version: 1
    status: live
    type: single
    pool: exam
    concept: bring-your-own-license
    note: m10/governance
    task: "1.4"
    level: 3
    stem: >-
      A logistics firm runs Microsoft SQL Server on Amazon EC2 and already owns SQL Server licenses from an earlier purchase.
      It wants to reuse them on AWS instead of paying for a license with each instance.
      Which licensing model fits, and who handles license compliance under it?
    options:
      - id: a
        text: BYOL, with the firm handling license compliance
        correct: true
        why: BYOL reuses licenses the firm already owns, and since AWS did not supply them, keeping their use within the terms stays with the firm.
      - id: b
        text: BYOL, with AWS handling license compliance
        why: BYOL is the right model, but AWS takes on license cost and compliance only for licenses it supplies itself, not for owned ones.
      - id: c
        text: License-included, with AWS handling license compliance
        why: AWS does handle compliance for licenses it includes, but the firm would then pay for a new license with each instance.
      - id: d
        text: License-included, with the firm handling license compliance
        why: License-included instances have AWS supply the license and handle its compliance, and the firm's owned licenses go unused.
    evidence:
      - "With the Bring Your Own License (BYOL) model you reuse licenses you already own on AWS, while with included licenses, such as SQL Server license-included instances on Amazon EC2, AWS supplies the license and handles its cost and compliance."
      - "BYOL reuses vendor-bought licenses (Microsoft, say) on EC2 Dedicated Hosts or Amazon WorkSpaces, flexibly and often far cheaper than AWS-bought ones."
    takeaway: BYOL reuses licenses a company already owns, while license-included instances have AWS supply and charge for the license.
    history: []
    verified:
      keyHash: 6a5194adbb25
      fullHash: feb55a7396ef
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-s8wydh
    version: 1
    status: live
    type: single
    pool: exam
    concept: regulatory-compliance
    note: m10/compliance
    task: "2.2"
    level: 2
    stem: >-
      An online fashion retailer stores personal data about shoppers in the European Union, so GDPR applies to it.
      Which statement describes what compliance means for the retailer?
    options:
      - id: a
        text: Its data must satisfy every rule that binds the retailer
        correct: true
        why: Compliance is the bar of meeting every law, industry standard and internal policy that applies, with GDPR as one of them here.
      - id: b
        text: Its traffic must be watched nonstop for unusual behavior
        why: Constant watching for anomalies is monitoring, which supports compliance but does not by itself mean meeting GDPR.
      - id: c
        text: Its controls must be reviewed now and then to see they work
        why: A periodic review of controls is auditing, a check along the way rather than the bar of meeting the rules itself.
      - id: d
        text: Its records must be shielded from any unauthorized access
        why: Stopping unauthorized access is the securing step, a foundation for compliance rather than a definition of it.
    evidence:
      - "It is a security and data-protection bar: your resources and data must satisfy each internal policy, industry standard and regulation that binds you."
      - "Rules follow the workload: GDPR for EU consumer data, HIPAA for US healthcare apps."
    takeaway: Compliance means meeting every regulation, industry standard and internal policy that applies to a workload's data.
    history: []
    verified:
      keyHash: 6e6c0fe17ca7
      fullHash: 7f14e45ff7e6
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-kepb3d
    version: 1
    status: live
    type: single
    pool: exam
    concept: secure-monitor-audit-comply-progression
    note: m10/introduction-to-monitoring-compliance-and-governance-in-the-aws-cloud
    task: "2.2"
    level: 1
    stem: >-
      A bike rental chain is planning the governance work for its new AWS environment and wants to follow the usual four-stage progression.
      In which order should the stages run?
    options:
      - id: a
        text: Monitor, secure, audit, comply
        why: Watching for threats has little to protect until the environment is secured, so securing must come before monitoring.
      - id: b
        text: Secure, audit, monitor, comply
        why: A periodic audit checks controls that constant monitoring already watches, so monitoring comes before auditing, not after it.
      - id: c
        text: Secure, monitor, audit, comply
        correct: true
        why: The chain first protects the environment, then watches it nonstop, then checks its controls periodically, and finally proves it meets its rules.
      - id: d
        text: Monitor, secure, comply, audit
        why: This puts monitoring before securing and proof of compliance before the audit that checks the controls behind it.
    evidence:
      - "Order: secure, monitor, audit, comply."
      - "Audit: check periodically that controls work and policies are followed."
    takeaway: Governance stages run secure, monitor, audit, comply, so the periodic audit follows constant monitoring.
    history: []
    verified:
      keyHash: 965676b180e6
