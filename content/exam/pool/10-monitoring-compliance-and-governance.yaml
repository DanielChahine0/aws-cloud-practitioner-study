    stem: >-
      Which AWS Trusted Advisor findings belong to the check category that guards against unauthorized access?
    options:
      - id: a
        text: An EBS volume has no snapshot
        why: A volume without a snapshot is a fault tolerance finding, since the risk is lost data rather than a security gap.
      - id: b
        text: An RDS database instance sits idle
        why: An idle database wastes money, so it is a cost optimization finding rather than a security one.
      - id: c
        text: MFA is off for the root user
        correct: true
        why: A root user without MFA is a security check, since that account holds the widest access of all.
      - id: d
        text: EC2 instances all run in one Availability Zone
        why: Instances crowded into one Availability Zone are a fault tolerance finding, since one zone failing could halt the app.
      - id: e
        text: An EC2 instance is barely used
        why: An underused instance is a cost optimization finding that points to scaling down, not to a gap in access control.
      - id: f
        text: A security group allows traffic from anywhere
        correct: true
        why: A security group that admits anyone exposes resources to attack, which is why it falls in the security category.
    evidence:
