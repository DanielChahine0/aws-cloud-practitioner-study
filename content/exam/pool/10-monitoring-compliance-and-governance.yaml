      An accounting firm runs a separate AWS account for each of its practice areas and wants to manage their costs from one place.
      Which billing benefits does AWS Organizations give the firm?
    options:
      - id: a
        text: Caps on the services each account may use
        why: Service control policies in Organizations do cap what accounts may use, but that is an access limit, not a billing benefit.
      - id: b
        text: Alerts when spending passes a set amount
        why: Spending alerts against a custom budget come from AWS Budgets, a separate service, rather than from Organizations.
      - id: c
        text: A single bill that covers every account
        correct: true
        why: Consolidated billing rolls each account's charges into one bill paid through the parent account.
      - id: d
        text: Groups of accounts that share one policy
        why: Organizational units do group accounts for shared policies, but grouping serves security and compliance needs, not billing.
      - id: e
        text: Charts of past costs and a cost forecast
        why: Charting costs and forecasting them is the job of AWS Cost Explorer, a separate service, rather than of Organizations.
      - id: f
        text: Pricing discounts earned on pooled usage
        correct: true
        why: Because the bills roll up to the parent account, discounts apply to the usage of all accounts together.
    evidence:
      - "Consolidated billing: child bills roll up to the parent account, where discounts apply."
      - "Organizations centrally manages many accounts, including one consolidated bill."
    takeaway: AWS Organizations combines all accounts into one consolidated bill, where discounts apply to the combined usage.
