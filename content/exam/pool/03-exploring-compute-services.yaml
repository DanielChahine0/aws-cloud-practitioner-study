  - id: q-qc8sxc
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: containers-vs-virtual-machines
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      A media startup needs new copies of its service to come up quickly when traffic jumps, and it is weighing containers against virtual machines.
      Which statements explain why containers suit this need?
    options:
      - id: a
        text: Containers share the operating system of the host machine they run on
        correct: true
        why: With no OS of their own to boot, new containers come up sooner than virtual machines, which suits sudden traffic jumps.
      - id: b
        text: Containers are lighter because they leave out a full operating system
        correct: true
        why: A lighter unit is quicker to start, while a virtual machine must first boot its full OS on a hypervisor.
      - id: c
        text: Containers bundle code and dependencies so they run the same anywhere
        why: Portability across environments is true of containers, but it does not make new copies come up any faster.
      - id: d
        text: Containers each boot a full operating system on top of a hypervisor
        why: Booting a full OS on a hypervisor describes a virtual machine, and it is what makes new copies slower to start.
      - id: e
        text: Container images sit in a registry such as Amazon ECR for later pulls
        why: ECR does hold container images, but where images are kept does not explain why containers start sooner than VMs.
    evidence:
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
      - A VM runs its own full OS on a hypervisor, making it heavier and slower to start.
    takeaway: Sharing the host's OS makes containers lighter and quicker to start than full virtual machines.
    history: []
    verified:
      keyHash: 92a2ee1834d6
      fullHash: f86298ee5573
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
