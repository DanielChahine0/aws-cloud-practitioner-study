  - id: q-zk21m1
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-lambda
    note: m03/aws-lambda
    task: "2.1"
    level: 2
    stem: >-
      A travel agency's fare alert feature runs as AWS Lambda functions.
      After a change, the functions are refused each time they try to read messages from an Amazon SQS queue.
      Which task must the agency carry out to fix this?
    options:
      - id: a
        text: Updating the IAM role the functions run with
        correct: true
        why: The agency owns the IAM role and permissions its functions use to reach other services, so it grants the queue read.
      - id: b
        text: Reviewing the security of the function code itself
        why: The code is the agency's to secure, but a refused read of another service comes from missing permissions.
      - id: c
        text: Patching the environment the functions run in
        why: AWS patches and secures the Lambda environment, and patches would not grant the functions the queue read.
      - id: d
        text: Adding capacity for the functions as alerts grow
        why: Lambda scales on its own, and more capacity would not let the functions read a queue they are refused.
    evidence:
      - You own the code and the IAM roles and permissions the function uses to reach other services.
      - AWS patches, updates and secures the underlying environment and allocates its resources.
    takeaway: With Lambda, AWS runs and patches the environment, while the customer owns its code and IAM permissions.
    history: []
    verified:
      keyHash: 0a6541443f0b
      fullHash: c7c7ac7fec42
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
