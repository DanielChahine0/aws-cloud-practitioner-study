    note: m03/aws-lambda
    task: "4.1"
    level: 2
    stem: >-
      A photo printing website runs an AWS Lambda function each time a customer uploads an image, and it sits idle between uploads.
      How is the website charged for this function?
    options:
      - id: a
        text: By the compute time of each run, priced by memory
        correct: true
        why: Lambda bills only for the time code runs, at a rate set by the memory given to the function, so idle gaps cost nothing.
      - id: b
        text: By the time each instance runs, busy or idle
        why: Billing for running instances whether busy or idle is how EC2 On-Demand works, not how Lambda charges for runs.
      - id: c
        text: By a set monthly price for a server bundle
        why: A predictable monthly bundle price is Lightsail's model, while Lambda has no server bundle to rent.
      - id: d
        text: By the resources each container task uses
        why: Paying for the resources containers use is Fargate's model, while Lambda bills each function run instead.
    evidence:
      - You pay for compute time only, per millisecond, priced by allocated memory.
    takeaway: Lambda charges only for the compute time runs use, priced by allocated memory, so idle gaps cost nothing.
