    stem: >-
      Besides how long the code runs, which setting determines the price of an AWS Lambda function run?
    options:
      - id: a
        text: The memory allocated to the function
        correct: true
        why: Lambda prices each run's compute time by the memory the function is given.
      - id: b
        text: The runtime the function's code uses
        why: The runtime passes events to the code in its language, but it does not set the price of a run.
      - id: c
        text: The event source that invokes it
        why: The trigger decides when the function runs, while the price comes from run time and allocated memory.
      - id: d
        text: The execution role it runs with
        why: The execution role grants the function access to other services, and it plays no part in the bill.
    evidence:
      - You pay for compute time only, per millisecond, priced by allocated memory.
      - Memory size is also how you tune performance.
    takeaway: Lambda bills by compute time and allocated memory, and memory also tunes the function's performance.
