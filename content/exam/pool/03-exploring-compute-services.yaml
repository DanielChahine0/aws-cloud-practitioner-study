    concept: serverless-computing
    note: m03/introduction-to-serverless-computing
    task: "2.1"
    level: 3
    stem: >-
      A veterinary practice moves its appointment reminder app from Amazon EC2 instances it manages itself to serverless compute.
      Which task moves from the practice to AWS because of this change?
    options:
      - id: a
        text: Provisioning and scaling the servers that run the code
        correct: true
        why: On EC2 the practice sized and scaled its instances, and with serverless compute AWS provisions and scales the hidden servers.
      - id: b
        text: Guarding the data centers where the servers are housed
        why: AWS already secured the facilities while the app ran on EC2, so this task does not move with the change.
      - id: c
        text: Writing and securing the reminder app's own code
        why: The app's code and its security stay with the practice under serverless compute as well.
      - id: d
        text: Deciding which staff accounts may change the app
        why: Who may change the app is an access choice that the practice still makes after the move.
    evidence:
      - The servers hosting your app are hidden and out of reach.
      - AWS handles provisioning, maintenance, scaling and high availability.
    takeaway: Serverless compute hands server provisioning and scaling to AWS while the customer keeps its code and data duties.
