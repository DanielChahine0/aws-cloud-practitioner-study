        why: Leaving only the code is the fully managed serverless split from the stem, while a managed service can still need setup.
      - id: d
        text: AWS operates none of it, and the customer handles every layer of its own hardware
        why: Running every layer in-house is the on-premises split from the stem, not a service that AWS runs day to day.
    evidence:
      - "Managed: AWS absorbs much of the operational overhead, though some provisioning or configuration may remain yours depending on the service."
    takeaway: Managed services sit between unmanaged and serverless, with AWS running them and some setup left to the customer.
