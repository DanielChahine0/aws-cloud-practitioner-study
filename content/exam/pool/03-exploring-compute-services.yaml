    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-elastic-beanstalk
    note: m03/additional-compute-services
    task: "3.1"
    level: 3
    stem: >-
      A county library's small IT team wants to deploy its web catalog by handing AWS its code and settings.
      AWS should then build the load balancing, scaling and health checks, while the team keeps control of every resource.
      Which service fits?
    options:
      - id: a
        text: AWS Elastic Beanstalk
        correct: true
        why: Elastic Beanstalk takes code and settings and builds the scaling, load balancing and health checks, while the team keeps control.
      - id: b
        text: AWS CloudFormation
        why: CloudFormation builds resources from templates the team writes, rather than taking app code and deploying it.
      - id: c
        text: Amazon Lightsail
        why: Lightsail sells simple server bundles at a set price, and it does not build an auto-scaled environment from code.
      - id: d
        text: Amazon EC2 Auto Scaling
        why: Auto Scaling adjusts instance counts but leaves the deployment, load balancing and health checks to the team.
    evidence:
      - Give this fully managed service code and settings, and it builds the EC2 setup, scaling, load balancing and health checks.
      - You can save configurations to redeploy and still control every resource.
    takeaway: Elastic Beanstalk turns uploaded code into a scaled, load-balanced environment that the customer still controls.
