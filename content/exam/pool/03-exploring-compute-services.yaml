questions:
  - id: q-7fs3wp
    version: 1
    status: live
    type: single
    pool: exam
    concept: managed-services
    note: m03/introduction-to-serverless-computing
    task: "1.4"
    level: 3
    stem: >-
      An online bookstore spends many staff hours patching and restarting the message queue servers it runs itself.
      It wants to cut that recurring operations cost while its systems keep pulling orders from a queue as they do today.
      Which service fits?
    options:
      - id: a
        text: Amazon SQS
        correct: true
        why: SQS is a managed queue that AWS keeps running once configured, so the staff hours go away and orders still wait in a queue.
      - id: b
        text: Amazon SNS
        why: SNS is managed too, but it pushes messages to subscribers instead of holding them in a queue, so the order flow would change.
      - id: c
        text: Amazon EC2
        why: Moving the queue servers to EC2 instances leaves the bookstore patching and restarting them, so the operations cost stays.
      - id: d
        text: Amazon Lightsail
        why: A Lightsail server bundle is still a server the bookstore looks after, so the patching hours do not shrink.
    evidence:
      - After you configure one, AWS keeps it running with no server management on your part.
      - ELB, SNS and SQS are earlier examples.
    takeaway: A managed service takes day-to-day server upkeep off the payroll once it is configured.
    history: []
    verified:
      keyHash: 6d396568fe74
      fullHash: 8940203d3be3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-km0d87
    version: 1
    status: live
    type: single
    pool: exam
    concept: fully-managed-services
    note: m03/introduction-to-serverless-computing
    task: "1.4"
    level: 1
    stem: >-
      Which service model removes the most infrastructure labor from a company's operating costs, leaving its staff to look after only the application code and its security?
    options:
      - id: a
        text: Fully managed services
        correct: true
        why: AWS provisions, scales and runs every server, so the only work left in-house is the code and its security.
      - id: b
        text: Managed services
        why: AWS runs these day to day, but some provisioning or configuration can still fall to the company's staff.
      - id: c
        text: Unmanaged services
        why: The company still patches, scales and secures each instance, so the infrastructure labor stays on its books.
      - id: d
        text: Self-hosted servers on premises
        why: Owning the hardware keeps every layer of infrastructure work, and its cost, with the company.
    evidence:
      - "Fully managed, like serverless Lambda: there are no servers for you to provision or manage, and AWS also covers scaling and availability."
      - What stays with you under Lambda is the application code and keeping it secure.
    takeaway: Fully managed services shrink a customer's infrastructure work, and its cost, down to its own code.
    history: []
    verified:
      keyHash: 37b8f2881e02
      fullHash: e5e515455a54
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-6b8kt1
    version: 1
    status: live
    type: single
    pool: exam
    concept: unmanaged-services
    note: m03/introduction-to-serverless-computing
    task: "2.1"
    level: 3
    stem: >-
      A bike rental shop runs its booking app on Amazon EC2 instances.
      Under the AWS shared responsibility model, which task falls to the shop on EC2 that a fully managed service such as AWS Lambda would take off its hands?
    options:
      - id: a
        text: Patching the guest operating system on each instance
        correct: true
        why: On EC2 each instance's OS belongs to the shop, while under Lambda AWS patches that environment instead.
      - id: b
        text: Writing and securing the booking app's own code
        why: The app code and its security stay with the shop on EC2 and on Lambda alike, so nothing moves.
      - id: c
        text: Replacing failed hardware in the host servers
        why: AWS already runs the physical servers under EC2, so this task is not the shop's in either model.
      - id: d
        text: Guarding the facilities that house the host servers
        why: Physical security of the data centers is AWS's share under EC2 as well, so the shop never held it.
    evidence:
      - "Unmanaged, like EC2: AWS covers the physical layer, while each instance's OS, network setup and apps are yours to set up, secure and maintain."
      - What stays with you under Lambda is the application code and keeping it secure.
    takeaway: With unmanaged compute like EC2, AWS keeps the hardware and the customer keeps each instance's OS.
    history: []
    verified:
      keyHash: 5cd119075687
      fullHash: 65b30f06278e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
