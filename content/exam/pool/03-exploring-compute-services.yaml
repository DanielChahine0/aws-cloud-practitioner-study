    stem: >-
      A hospital network is weighing AWS Outposts for some of its clinical workloads.
      Which needs are reasons to choose Outposts?
    options:
      - id: a
        text: Keeping patient records in its own facility for residency rules
        correct: true
        why: Outposts runs AWS services inside the network's own facility, so the records can stay where the residency rules require.
      - id: b
        text: Cutting the delay between AWS compute and its local devices
        correct: true
        why: Outposts places AWS compute next to the hospital's on-site devices, which keeps the latency between them low.
      - id: c
        text: Closing its data center to stop paying for the floor space
        why: Outposts racks sit in the network's own data center, so choosing Outposts keeps that space rather than closing it.
      - id: d
        text: Serving its users from AWS Regions on several continents
        why: Reaching users through Regions abroad is a choice of Regions in the cloud, not a reason to bring AWS into the hospital.
      - id: e
        text: Paying one predictable monthly price for a small website
        why: A set monthly price for a small site is what Lightsail offers, not a reason to place AWS racks in the hospital.
    evidence:
      - A fully managed hybrid cloud offering that brings AWS compute, storage and networking into your data center.
      - It fits compliance, data residency, low latency, remote sites and legacy app modernization.
    takeaway: Outposts brings AWS on premises for hybrid needs such as data residency and low latency to local systems.
