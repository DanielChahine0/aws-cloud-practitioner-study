    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 3
    stem: >-
      An insurance broker pays steep license fees for a high-end commercial relational database.
      It wants a managed, MySQL-compatible database that gives similar performance for far less money.
      Which service fits?
    options:
      - id: a
        text: Amazon Aurora
        correct: true
        why: Aurora is MySQL-compatible and delivers commercial-grade performance at a small fraction of the cost.
      - id: b
        text: Amazon DynamoDB
        why: DynamoDB is a NoSQL key-value database, so it is not a MySQL-compatible stand-in for a relational engine.
      - id: c
        text: Amazon Redshift
        why: Redshift is a data warehouse for analytics rather than a replacement for an operational relational database.
      - id: d
        text: Amazon Neptune
        why: Neptune is a graph database for highly connected data and does not offer MySQL compatibility.
    evidence:
      - About one-tenth the cost of high-end commercial databases at similar performance, so it suits replacing pricey commercial engines.
      - MySQL- and PostgreSQL-compatible, built to cut needless I/O (the video also lists distributed SQL, DSQL).
    takeaway: Aurora suits replacing costly commercial relational engines, matching their performance for much less.
