    stem: >-
      A bike rental shop keeps customers, bikes and rentals in separate tables where every row has the same fixed columns.
      Staff run one query that joins the tables to list each customer's past rentals.
      Which type of database fits this design?
    options:
      - id: a
        text: A relational database
        correct: true
        why: Related tables under a fixed schema, joined by one query, are the defining traits of a relational database.
      - id: b
        text: A key-value NoSQL database
        why: A key-value database uses a flexible schema and does not join related tables in one query.
      - id: c
        text: A graph database
        why: A graph database stores nodes and their connections rather than tables of rows with fixed columns.
      - id: d
        text: An in-memory cache
        why: A cache only holds copies of hot data in RAM and is not the lasting home for the shop's records.
    evidence:
      - Tables of rows and columns follow a rigid schema and share attributes, so one query spans customers and orders.
    takeaway: Fixed-column tables that one query can join across point to a relational database.
