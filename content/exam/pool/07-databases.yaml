  - id: q-bnhjtm
    version: 1
    status: live
    type: multi
    pool: exam
    concept: aws-backup
    note: m07/additional-database-services
    task: "3.6"
    level: 2
    select: 2
    stem: >-
      A media company already uses AWS Backup, and its auditors set two new rules.
      Restores must still work if the company's main AWS Region goes offline, and every member account must follow one shared set of rules.
      Which AWS Backup capabilities meet these rules?
    options:
      - id: a
        text: Keeping copies of backups in a second Region
        correct: true
        why: Copies held in another Region can still be restored when the main Region is offline, which meets the first rule.
      - id: b
        text: Applying policies across a whole organization
        correct: true
        why: Organization-wide policies put every member account under the same rules, which meets the second rule.
      - id: c
        text: Showing jobs and restore points in one view
        why: One view helps the team watch backups, but it neither survives a Region outage nor makes accounts follow rules.
      - id: d
        text: Protecting new resources as soon as they appear
        why: Auto-protection covers resources as they are created, but it does not keep restores working when a Region fails.
      - id: e
        text: Encrypting backups and setting their schedules
        why: Encryption and schedules protect each backup, but they meet neither the outage rule nor the shared-rules rule.
    evidence:
      - "**Cross-Region redundancy**: copies in other Regions allow restores during a Regional outage."
      - "**Compliance**: audit logs, reports, organization-wide policies and activity tracking."
      - "**Central management**: one view of jobs, restore points and compliance across services and accounts, with schedules, encryption and auto-protection of new resources."
    takeaway: AWS Backup copies in other Regions survive a Regional outage, and organization-wide policies hold every account to one set of rules.
