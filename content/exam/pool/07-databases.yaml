questions:
  - id: q-8z5d59
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-rds
    note: m07/relational-database-services
    task: "2.1"
    level: 2
    stem: >-
      An online bookstore moves its order database from a server it ran itself to Amazon RDS for MySQL.
      An audit rule says the order records must be unreadable to anyone who copies the stored files or listens on the network.
      Under the shared responsibility model, who must set this up, and why?
    options:
      - id: a
        text: AWS, since it runs the servers and operating system beneath RDS
        why: AWS does run the layers beneath RDS, but making the order records unreadable to outsiders is not part of that upkeep.
      - id: b
        text: The bookstore, since it picks when the automated backups run
        why: The bookstore does choose the backup schedule, but that choice has nothing to do with keeping the records unreadable.
      - id: c
        text: The bookstore, since data security stays with the customer
        correct: true
        why: The audit rule calls for encryption at rest and in transit, and on RDS that kind of data protection stays with the bookstore.
      - id: d
        text: AWS, since RDS applies the engine patches for the bookstore
        why: RDS does take engine patching off the bookstore, but patching does not make the order records unreadable to outsiders.
    evidence:
      - AWS runs infrastructure, OS, patching and backups, while you own security measures and encryption at rest and in transit.
    takeaway: With Amazon RDS, AWS handles patching, backups and hardware, while the customer still secures and encrypts the data.
    history: []
    verified:
      keyHash: b785f4aee5a1
      fullHash: 98f7274018ff
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-gp87jx
    version: 1
    status: live
    type: single
    pool: exam
    concept: ec2-hosted-vs-managed-databases
    note: m07/introduction-to-databases
    task: "2.1"
    level: 2
    stem: >-
      A regional clinic is closing its server room and moving its PostgreSQL appointment database to AWS.
      Its vendor software needs custom settings in the operating system, so the clinic's team will install and patch both the operating system and PostgreSQL itself.
      Which approach fits?
    options:
      - id: a
        text: Run PostgreSQL on an Amazon EC2 instance
        correct: true
        why: On its own EC2 instance the clinic controls the operating system, and it takes on installing and patching both layers.
      - id: b
        text: Run PostgreSQL on Amazon RDS
        why: RDS patches the engine and the operating system for the clinic, so the team cannot change the OS settings the vendor needs.
      - id: c
        text: Run PostgreSQL on Amazon Aurora
        why: Aurora is a managed PostgreSQL-compatible engine, so AWS keeps the operating system out of the clinic's hands.
      - id: d
        text: Run PostgreSQL on a server in its own room
        why: The clinic is closing its server room and moving to AWS, so keeping a server on site does not fit.
    evidence:
      - With EC2 hosted databases you still install, patch, back up and scale the database and its operating system yourself, while AWS managed databases such as Amazon RDS hand those tasks to AWS.
      - Self-hosting on EC2 is for full control, OS included, and is not automatically cheaper or faster.
    takeaway: When a team needs control of the operating system and will patch it, a database on EC2 fits better than a managed service.
    history: []
    verified:
      keyHash: 804b9f0dff10
      fullHash: 2e1249318b19
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-n8mdq2
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-dynamodb-global-tables
    note: m07/nosql-database-services
    task: "3.2"
    level: 2
    stem: >-
      A mobile game studio keeps its player profiles in Amazon DynamoDB and is opening servers in two more AWS Regions.
      It wants each of those Regions to hold its own copy of the profiles that players there can both read and write.
      Which DynamoDB feature fits?
    options:
      - id: a
        text: DynamoDB global tables
        correct: true
        why: Global tables keep a writable copy of the data in each chosen Region, so players read and write close to home.
      - id: b
        text: DynamoDB Accelerator (DAX)
        why: DAX is a cache that speeds up reads, and it does not create writable copies of the profiles in other Regions.
      - id: c
        text: DynamoDB auto scaling
        why: Auto scaling adjusts throughput to traffic, but it leaves the profile data in the one Region where it already is.
      - id: d
        text: DynamoDB encryption at rest
        why: Encryption at rest protects the stored profiles, but it does not place copies of them in the new Regions.
    evidence:
      - "Use cases: gaming, finance and global mobile apps, served worldwide by **global tables**."
      - "**Availability**: 99.999%, copies in three facilities per Region and in other Regions."
    takeaway: DynamoDB global tables copy a table into other Regions so worldwide apps get local reads and writes.
    history: []
    verified:
      keyHash: 7408bd21f79b
      fullHash: 53c2b4a16ebc
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-r2126h
    version: 1
    status: retired
    type: single
    pool: exam
    concept: amazon-elasticache-high-availability
    note: m07/in-memory-caching-services
    task: "3.2"
    level: 2
    stem: >-
      A concert ticketing site keeps its session data in Amazon ElastiCache.
      The site must keep serving sessions even if a power failure takes down one of the separate data center sites inside its Region.
      Which ElastiCache setup supports this?
    options:
      - id: a
        text: Replicas in other Availability Zones that take over from the primary
        correct: true
        why: A replica in a zone the power failure did not touch is promoted, so the cache keeps serving sessions.
      - id: b
        text: Replicas in the primary's own Availability Zone that take over from it
        why: Replicas that share the primary's zone go down with it, so nothing is left to serve sessions.
      - id: c
        text: Nightly backups of the cache copied to a second Availability Zone
        why: A backup must first be restored to a new cache, so sessions stop being served during the outage.
      - id: d
        text: A single larger node in the busiest Availability Zone
        why: One node in one zone has no copy elsewhere, so the cache stops when that zone loses power.
    evidence:
      - Primary and replicas in separate AZs survive a zone outage
      - Failed nodes replaced, a replica promoted, usually in minutes
    takeaway: ElastiCache survives a zone outage by replicating from a primary to replicas placed in other Availability Zones.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Options 2 and 4 are near twins that differ only in Availability Zone placement, and option 4 is the cross-AZ variant.)"
  - id: q-wapmmz
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-backup
    note: m07/additional-database-services
    task: "3.6"
    level: 3
    stem: >-
      A logistics company set up data protection one service at a time for its EBS volumes, EFS file systems, RDS databases and DynamoDB tables, and the separate plans now overlap.
      It wants one dashboard to set protection rules and see restore points for all of them.
      Which service fits?
    options:
      - id: a
        text: AWS Backup
        correct: true
        why: AWS Backup brings backups for EBS, EFS, RDS, DynamoDB and more under one set of policies and one view.
      - id: b
        text: Amazon Data Lifecycle Manager
        why: Data Lifecycle Manager automates EBS snapshots only, so it cannot cover the file systems and databases too.
      - id: c
        text: AWS Elastic Disaster Recovery
        why: Elastic Disaster Recovery replicates servers for fast recovery, not central backup policies across these services.
      - id: d
        text: AWS Storage Gateway
        why: Storage Gateway links on-premises systems to AWS storage and does not manage backups of these AWS resources.
    evidence:
      - Separate disk and database backup plans overlap and confuse, so it unifies them in one dashboard.
      - It covers EBS, Amazon EFS, RDS, DynamoDB and more, even on-premises data.
    takeaway: AWS Backup replaces scattered per-service backup plans with one central place for policies and restore points.
