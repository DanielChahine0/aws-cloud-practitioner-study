    concept: amazon-dynamodb
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    select: 2
    stem: >-
      Which statements describe Amazon DynamoDB?
    options:
      - id: a
        text: It is a serverless NoSQL database for key-value and document data.
        correct: true
        why: DynamoDB is fully managed and serverless, and it stores key-value and document data without a fixed schema.
      - id: b
        text: It keeps single-digit millisecond latency as the workload grows.
        correct: true
        why: DynamoDB is built to answer in single-digit milliseconds no matter how large the workload becomes.
      - id: c
        text: It applies engine upgrades during weekly maintenance windows.
        why: DynamoDB has no maintenance windows or downtime, since AWS handles upgrades without the customer scheduling them.
      - id: d
        text: It links tables with foreign keys and joins them in SQL queries.
        why: Foreign keys and SQL joins belong to relational databases, while DynamoDB stores key-value items without them.
      - id: e
        text: It stores each table on one server whose size the customer picks.
        why: DynamoDB is serverless and spreads data over many servers, so no customer picks a single server size.
    evidence:
      - Fully managed, serverless NoSQL for key-value and document data.
      - Single-digit millisecond latency at any scale, with no patching, upgrades, maintenance windows, downtime or cold starts.
    takeaway: DynamoDB is a serverless NoSQL database that stays fast at any scale with no maintenance windows.
