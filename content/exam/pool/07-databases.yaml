  - id: q-crtsxr
    version: 1
    status: retired
    type: multi
    pool: exam
    concept: amazon-elasticache
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 2
    select: 2
    stem: >-
      An online furniture store's product pages send the same queries to its Amazon RDS database over and over, and pages load slowly during sales.
      The team plans to add Amazon ElastiCache.
      Which outcomes does adding the cache bring?
    options:
      - id: a
        text: Repeated reads come back from memory with sub-millisecond latency.
        correct: true
        why: ElastiCache answers from RAM in under a millisecond, so the repeated product queries return much faster.
      - id: b
        text: Fewer reads reach RDS, which may allow a smaller database instance.
        correct: true
        why: Cache hits take read load off RDS, so the store may be able to run a smaller and cheaper instance.
      - id: c
        text: Product data can live only in the cache, so RDS can be shut down.
        why: A cache lacks the lasting storage of a database, so it works beside RDS and never replaces it.
      - id: d
        text: The cache expands the storage of RDS as new products are added.
        why: ElastiCache scales only the cache itself and leaves the storage of the RDS database unchanged.
      - id: e
        text: Sales reports that join many tables run in the cache, not RDS.
        why: A cache lacks the rich queries of a database, so reports that join tables still run on RDS.
    evidence:
      - Sub-millisecond reads and writes (the video says microsecond reads).
      - Reading from the cache can let you run smaller, cheaper database instances.
      - It scales the cache only, not the database's storage.
    takeaway: ElastiCache speeds up repeated reads from memory and offloads the database, which can then be smaller.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 1 and 5 are the only true statements about a cache in front of RDS; 2, 3 and 4 are false.)"
