    type: single
    pool: exam
    concept: in-memory-caching
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 2
    stem: >-
      A news publisher's website asks its database for the same few headlines many times a minute, and those headlines rarely change.
      Which approach best cuts both the database load and the response time?
    options:
      - id: a
        text: Keep the hot results in an in-memory cache beside the database
        correct: true
        why: Serving the rarely changing headlines from RAM answers far faster and spares the database the repeat reads.
      - id: b
        text: Add a standby copy of the database in a second Availability Zone
        why: A standby only takes over when the primary fails, so it does not answer the repeated headline reads any faster.
      - id: c
        text: Move older articles that readers rarely open to archive storage
        why: Archiving cold articles saves storage cost, but the hot headlines still hit the database on every request.
      - id: d
        text: Add more storage capacity to the existing database instance
        why: More storage does not reduce the number of repeat reads hitting the database or speed them up.
    evidence:
      - Read-heavy traffic for data that rarely changes is common, and a caching layer is one of the best remedies.
      - Lacking a database's lasting storage and rich queries, a cache complements the database, never replaces it.
    takeaway: Read-heavy, rarely changing data is best served from an in-memory cache that sits beside the database.
    history: []
