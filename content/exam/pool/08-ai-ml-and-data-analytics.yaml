  - id: q-66h4h9
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-kinesis-data-streams
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 3
    stem: >-
      A ride-sharing company sends location updates from its drivers' phones without a break, day and night.
      Several separate applications, including pricing and dispatch, must each read the same incoming updates the moment they arrive.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Kinesis Data Streams
        correct: true
        why: Kinesis Data Streams ingests data in real time and lets several applications read one stream at the same time.
      - id: b
        text: Amazon Data Firehose
        why: Firehose delivers data in near real time to a destination, which suits loading storage rather than live readers.
      - id: c
        text: Amazon Simple Queue Service (Amazon SQS)
        why: SQS holds messages until one consumer handles each, so several apps cannot each read the full stream.
      - id: d
        text: Amazon EMR
        why: EMR processes big data on Apache frameworks after it lands, and it does not ingest a live stream for many readers.
    evidence:
      - Serverless, real time, terabytes from apps, streams and sensors; several apps can read one stream at once; on-demand mode provisions and scales itself
      - Kinesis Data Streams is real time with many readers, while Firehose is near real time with managed delivery.
    takeaway: Real-time ingestion that several applications read at once points to Kinesis Data Streams.
    history: []
    verified:
      keyHash: 80e4fa75f5d8
      fullHash: a68604139b20
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-ym8n1x
    version: 1
    status: live
    type: single
