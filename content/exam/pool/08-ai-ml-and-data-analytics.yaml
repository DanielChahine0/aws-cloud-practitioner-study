    stem: >-
      A legal services firm is building a production application that generates both text and images.
      Developers want to try foundation models from several providers through a single API, with no infrastructure to manage.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Bedrock
        correct: true
        why: Bedrock offers managed foundation models from Amazon and other providers behind one API, ready for production apps.
      - id: b
        text: Amazon SageMaker JumpStart
        why: JumpStart is a model hub inside SageMaker AI for fast starts, not the managed one-API service for multimodal apps.
      - id: c
        text: Amazon Q Business
        why: Q Business is a finished assistant that answers staff questions from company data, not a platform for building apps.
      - id: d
        text: Amazon Q Developer
        why: Q Developer suggests code to programmers, but it does not give an application access to many foundation models.
    evidence:
      - Managed FMs from Amazon and startups (Claude, Stable Diffusion) via one API; test, tune, integrate
      - Managed, enterprise-grade multimodal generation points to Bedrock, not JumpStart or Q Business.
    takeaway: A managed choice of foundation models behind one API for generative apps points to Amazon Bedrock.
