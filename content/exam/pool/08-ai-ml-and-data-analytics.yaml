    pool: exam
    concept: amazon-translate
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 1
    stem: >-
      Which AWS service converts written content from one human language into another, so an application can serve users around the world?
    options:
      - id: a
        text: Amazon Translate
        correct: true
        why: Translate is the pre-trained service that renders text in another language for multilingual apps and documents.
      - id: b
        text: Amazon Transcribe
        why: Transcribe turns spoken audio into text in the same language, and it does not convert between languages.
      - id: c
        text: Amazon Comprehend
        why: Comprehend can detect which language a text is in and its sentiment, but it does not rewrite it in another one.
      - id: d
        text: Amazon Polly
        why: Polly speaks text aloud in many voices, yet the words stay in the language they were written in.
    evidence:
      - "Amazon Translate: Text translation."
      - Documents, multilingual apps
    takeaway: Converting text between human languages for global users is the job of Amazon Translate.
