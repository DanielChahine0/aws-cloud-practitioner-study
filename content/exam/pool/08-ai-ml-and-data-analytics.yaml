  - id: q-nfnjm2
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-polly
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 3
    stem: >-
      A publisher of workplace training manuals wants its readers to be able to listen to each guide read aloud in a natural voice.
      It wants to avoid hiring narrators for every new edition.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Polly
        correct: true
        why: Polly converts written text into lifelike speech, so each new edition can be voiced without a narrator.
      - id: b
        text: Amazon Transcribe
        why: Transcribe works the other way round, turning recorded speech into text, while the publisher starts from text.
      - id: c
        text: Amazon Translate
        why: Translate changes text from one language to another but produces no spoken audio for listeners.
      - id: d
        text: Amazon Lex
        why: Lex builds two-way chat and voice bots, which is more than reading a fixed guide aloud.
    evidence:
      - Assistants, e-learning, visually impaired users, studio-free narration
      - "Amazon Polly: Text to speech."
    takeaway: Text that must be heard as lifelike speech points to Amazon Polly, while speech that must become text points to Transcribe.
    history: []
    verified:
      keyHash: 54e0696dc39d
      fullHash: 82cf3d2257b8
