  - id: q-f0adkk
    version: 1
    status: live
    type: multi
    pool: exam
    concept: amazon-redshift
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 1
    stem: >-
      Which statements describe Amazon Redshift?
    select: 2
    options:
      - id: a
        text: It keeps nearly unlimited raw data of any shape as elastic object storage.
        why: Elastic object storage for raw data of any shape describes Amazon S3 as the data lake, not the warehouse.
      - id: b
        text: It holds structured or semistructured data at petabyte scale in a managed warehouse.
        correct: true
        why: Redshift is the managed, pay-as-you-go warehouse built for structured or semistructured data up to petabyte scale.
      - id: c
        text: It runs large-scale processing jobs on Apache Spark, Hadoop or Hive.
        why: Large-scale processing on Apache frameworks is Amazon EMR, a processing service rather than a warehouse.
      - id: d
        text: It suits complex big data jobs that need custom cluster settings and framework skills.
        why: Custom configurations and big data expertise point to Amazon EMR, while Redshift is a warehouse queried with SQL.
      - id: e
        text: It runs complex SQL on big datasets using columnar storage and parallel processing.
        correct: true
        why: Columnar storage and massively parallel processing are how Redshift handles frequent, heavy SQL queries.
      - id: f
        text: It serves as the usual data lake for unstructured files such as images and logs.
        why: The usual data lake for unstructured files is Amazon S3, while Redshift holds structured or semistructured data.
    evidence:
      - Managed warehouse for structured or semistructured data at petabyte scale; scales, pay-as-you-go
      - Columnar storage plus massively parallel processing for complex SQL on big datasets
    takeaway: Amazon Redshift is the managed data warehouse that runs heavy SQL over large structured datasets.
    history: []
    verified:
      keyHash: 099f099ff673
      fullHash: d737ff0c7d70
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-2hvd58
    version: 1
    status: live
    type: multi
    pool: exam
    concept: aws-glue
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 2
    stem: >-
      A regional clinic network plans to use AWS Glue to prepare patient visit records from several systems for analysis.
      Which capabilities will AWS Glue give the network?
    select: 2
    options:
      - id: a
        text: A visual builder for data preparation, with scheduling built in
        correct: true
        why: Glue offers a visual job builder and built-in scheduling, so the network can set up and repeat its prep jobs.
      - id: b
        text: Managed extract, transform and load across many sources and formats
        correct: true
        why: Glue is a managed ETL service that reads many sources and formats, which fits records spread over several systems.
      - id: c
        text: Custom-configured Apache Spark, Hadoop or Hive clusters for complex jobs
        why: Custom big data clusters on Apache frameworks are Amazon EMR, while Glue keeps preparation simple and managed.
      - id: d
        text: Serverless SQL over the prepared records in Amazon S3, billed per query
        why: Ad hoc pay-per-query SQL on S3 data is the job of Amazon Athena rather than the ETL service.
      - id: e
        text: Interactive dashboards and reports over the prepared records
        why: Self-service dashboards for business users come from Amazon Quick Sight, after the data is prepared.
    evidence:
      - Managed ETL that makes prep simpler, faster and cheaper; visual job builder, built-in scheduling, many sources and formats, code-free scripts; jobs read Catalog metadata to shape transforms
      - "AWS Glue: Managed ETL service."
    takeaway: AWS Glue is the managed ETL service for preparing data from many sources, with a visual builder and scheduling.
    history: []
    verified:
      keyHash: 7a9a9f3e0578
      fullHash: 97c981207012
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-te3c02
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-athena
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 3
    stem: >-
      A marketing agency keeps its campaign logs in an Amazon S3 data lake.
      Its analysts want to run standard SQL queries on the logs where they already sit, without loading them into a warehouse first.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Athena
        correct: true
        why: Athena runs standard SQL directly against data in S3, using catalog metadata to understand its structure.
      - id: b
        text: Amazon Redshift
        why: Redshift is a data warehouse, so it suits heavy, frequent SQL on data loaded into it rather than querying S3 in place.
      - id: c
        text: Amazon EMR
        why: EMR runs big data frameworks on managed clusters, which is more than the analysts need for SQL on S3 data.
      - id: d
        text: Amazon Quick Sight
        why: Quick Sight builds dashboards and reports for business users, and it is not a SQL query engine over S3.
    evidence:
      - "7 Perform data analytics: data scientists query S3 in place with standard SQL in Amazon Athena, which reads the catalog table to recognize the structure."
    takeaway: Standard SQL on data that stays in Amazon S3, with no warehouse to load, points to Amazon Athena.
    history: []
    verified:
      keyHash: baf46eadf560
      fullHash: 616c9f87cd40
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
