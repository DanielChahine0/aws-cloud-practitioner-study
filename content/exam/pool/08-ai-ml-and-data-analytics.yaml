    concept: amazon-data-firehose
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 1
    stem: >-
      Which AWS service is a fully managed way to capture streaming data and deliver it in near real time to data lakes, warehouses or analytics tools, scaling on its own?
    options:
      - id: a
        text: Amazon Data Firehose
        correct: true
        why: Firehose is the managed streaming delivery service that lands data at its destination within seconds and scales itself.
      - id: b
        text: Amazon Kinesis Data Streams
        why: Kinesis Data Streams captures data in real time for applications to read, but delivery to storage is not its role.
      - id: c
        text: AWS Glue
        why: Glue runs managed ETL jobs on stored data and catalogs it, rather than capturing and delivering a stream.
      - id: d
        text: Amazon Redshift
        why: Redshift is a data warehouse that can receive delivered data, not the service that carries the stream to it.
    evidence:
      - Fully managed streaming ETL in near real time; provisions and scales itself; lands data in seconds in lakes, warehouses or analytics tools
      - Kinesis Data Streams is real time with many readers, while Firehose is near real time with managed delivery.
    takeaway: Managed near-real-time delivery of streaming data into storage or analytics tools points to Amazon Data Firehose.
    history: []
