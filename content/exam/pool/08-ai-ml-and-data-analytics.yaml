    stem: >-
      A chain of fitness studios wants its studio managers, who have no technical background, to create interactive dashboards and reports from membership and sales data.
      It wants no servers to run and no coding help.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Quick Sight
        correct: true
        why: Quick Sight is the business intelligence service where non-experts build interactive dashboards with nothing to host.
      - id: b
        text: Amazon OpenSearch Service
        why: OpenSearch Service focuses on live search and monitoring of logs and operational data, not business reports.
      - id: c
        text: Amazon Athena
        why: Athena answers SQL queries over data in S3, which needs query skills and does not produce dashboards itself.
      - id: d
        text: Amazon Redshift
        why: Redshift stores and queries warehouse data, but it is not the tool managers use to build their own dashboards.
    evidence:
      - "BI at scale: experts and non-experts build interactive dashboards and reports without infrastructure or developers; Amazon Q in QuickSight adds natural language"
      - AWS now spells the business intelligence service the course calls QuickSight as Amazon Quick Sight, which delivers AI-powered business intelligence.
    takeaway: Self-service business intelligence dashboards for non-technical users point to Amazon Quick Sight.
