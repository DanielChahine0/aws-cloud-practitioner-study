questions:
  - id: q-tqgmp3
    version: 1
    status: retired
    type: multi
    pool: exam
    concept: amazon-sagemaker-ai
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 1
    stem: >-
      Which statements describe Amazon SageMaker AI?
    select: 2
    options:
      - id: a
        text: It reports the sentiment expressed in large volumes of written customer comments.
        why: Judging sentiment in customer text is a ready-made job of Amazon Comprehend, with no model for the team to build.
      - id: b
        text: It lets a team build, train and deploy its own models on infrastructure that AWS runs.
        correct: true
        why: SageMaker AI is the tier for a team's own models, and AWS manages the servers that training and hosting run on.
      - id: c
        text: It identifies people, objects and scenes in images and video stored in Amazon S3.
        why: Finding people, objects and scenes in S3 media is the pre-trained Amazon Rekognition service, not SageMaker AI.
      - id: d
        text: It gives data scientists an IDE for experiments, debugging and monitoring of their models.
        correct: true
        why: SageMaker AI includes a development environment where teams run experiments, debug and monitor their own models.
      - id: e
        text: It picks out the key phrases and the language used across a set of documents.
        why: Pulling key phrases and the language out of documents is Amazon Comprehend, a pre-trained language service.
      - id: f
        text: It flags unsafe content in uploaded media and supports identity checks on photos.
        why: Moderating media and checking identities in photos are uses of Amazon Rekognition rather than SageMaker AI.
    evidence:
      - You build, train and deploy your own models while AWS runs the infrastructure.
      - "IDE: access control, visibility, experiments, data visualization, debugging, monitoring; plus hundreds of fast-deploy pre-trained models."
    takeaway: SageMaker AI is where teams build, train and deploy their own models on managed infrastructure, with an IDE to experiment and debug.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Options 4 and 5, the two keys, are clearly the two longest options, a length tell."
  - id: q-dgjk92
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-comprehend
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 2
    stem: >-
      An online furniture retailer receives a large volume of written product reviews every week.
      It wants to flag the reviews that express negative feelings without training a model of its own.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon Comprehend
        correct: true
        why: Comprehend applies pre-trained language analysis to text and reports its sentiment, so negative reviews stand out.
      - id: b
        text: Amazon Polly
        why: Polly reads text aloud as speech, which does nothing to judge whether a review is negative.
      - id: c
        text: Amazon Textract
        why: Textract pulls text out of scanned forms and documents, but the reviews are already text and need sentiment.
      - id: d
        text: Amazon Rekognition
        why: Rekognition analyzes images and video, while the retailer's reviews are written text.
    evidence:
      - Classifying, compliance, sentiment in lots of customer comments
      - "Amazon Comprehend: Text insights, such as sentiment."
    takeaway: Finding the sentiment in large amounts of customer text with a ready-made model points to Amazon Comprehend.
