    concept: amazon-lex
    note: m08/aws-ai-ml-solutions
    task: "3.7"
    level: 3
    stem: >-
      A regional bank wants a support assistant on its website that customers can type or speak to.
      The assistant must understand each request and reply in a back-and-forth conversation.
      Which AWS service should the bank use to build it?
    options:
      - id: a
        text: Amazon Lex
        correct: true
        why: Lex combines language understanding and speech recognition to build bots that hold a conversation by voice or text.
      - id: b
        text: Amazon Polly
        why: Polly can give a bot a speaking voice, but it does not understand what the customer asks or manage the dialog.
      - id: c
        text: Amazon Transcribe
        why: Transcribe writes down what was said, yet it cannot work out the request or answer the customer.
      - id: d
        text: Amazon Comprehend
        why: Comprehend finds sentiment and key phrases in text, but it does not run a conversation with the customer.
    evidence:
      - Lifelike voice or text chat via NLU and ASR (language understanding, speech recognition)
      - "Amazon Lex: Conversational app interfaces."
    takeaway: A chat or voice bot that understands requests and talks back is built with Amazon Lex.
