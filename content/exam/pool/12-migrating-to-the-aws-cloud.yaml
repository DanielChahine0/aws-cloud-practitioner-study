  - id: q-ak6fyd
    version: 1
    status: live
    type: multi
    select: 3
    pool: exam
    concept: three-phase-migration-process
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      A pet supply retailer follows the three-phase AWS process for a large migration to the cloud.
      Which activities belong to the first of the three phases?
    options:
      - id: a
        text: Gauging how ready the organization is for the cloud
        correct: true
        why: Gauging readiness is part of assess, the first phase, which checks how prepared the retailer is before anything else.
      - id: b
        text: Writing the plan around the dependencies of each app
        why: Writing the plan around app dependencies is the mobilize phase, the second of the three, so it comes after assess.
      - id: c
        text: Setting the outcomes and goals the move has to reach
        correct: true
        why: Setting outcomes and goals for the move is part of assess, the first phase, before any planning or moving starts.
      - id: d
        text: Closing the readiness gaps across the organization
        why: Closing readiness gaps is work for the mobilize phase, which follows assess and readies the organization for the move.
      - id: e
        text: Weighing the findings into a business case for the move
        correct: true
        why: Weighing findings into a business case, often with Migration Evaluator, is the output of assess, the first phase.
      - id: f
        text: Picking one of the seven strategies for each app
        why: Picking a strategy for each app is part of the mobilize phase, the second of the three, so it is not first-phase work.
    evidence:
      - "Order: assess, mobilize, migrate and modernize."
      - "Assess: gauge readiness, set outcomes, goals and the need to move, then weigh findings into a business case (Migration Evaluator)."
      - "Mobilize: ready the organization and resources, write the plan around app dependencies, close readiness gaps and pick strategies (Application Discovery Service, Migration Hub)."
    takeaway: A large migration runs through three phases in order, assess, mobilize, then migrate and modernize, and assess yields the business case.
    history: []
    verified:
      keyHash: 6dca8ac9f6c9
      fullHash: e9b918409704
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
