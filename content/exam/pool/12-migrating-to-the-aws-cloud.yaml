  - id: q-7d8fak
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-datasync
    note: m12/transferring-data-online
    task: "3.8"
    level: 3
    stem: >-
      A film archive must copy a very large set of files from its on-premises storage into Amazon S3 over its network.
      It wants the transfer throttled during work hours, scheduled at night and reported on after each task.
      Which service fits?
    options:
      - id: a
        text: AWS DataSync
        correct: true
        why: DataSync automates large online moves into AWS storage and lets the archive throttle, schedule and report on each task.
      - id: b
        text: AWS Direct Connect
        why: Direct Connect only supplies a dedicated network path, so a service like DataSync must still manage and report on the move.
      - id: c
        text: AWS Transfer Family
        why: Transfer Family runs managed file exchanges over protocols such as SFTP, rather than throttled, scheduled bulk copies from storage.
      - id: d
        text: AWS Snow Family
        why: The Snow Family ships data offline on devices, which misses the archive's plan to send data over its network.
    evidence:
      - It handles instances, encryption and network tuning, and lets you throttle, schedule, filter and report on tasks.
      - Direct Connect is a link, not a migration manager.
    takeaway: For a large online move into AWS storage with throttling, scheduling and task reports, choose AWS DataSync.
    history: []
    verified:
      keyHash: f26b42370a7e
      fullHash: 5a0560b319ce
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-adv0kk
    version: 1
    status: live
    type: single
    pool: exam
    concept: migration-strategy-rehost
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 3
    stem: >-
      A car parts distributor must move a large legacy estate to AWS quickly.
      Its physical servers will become virtual machines on AWS, and the applications will run unchanged at first.
      Which migration strategy is this?
    options:
      - id: a
        text: Rehost
        correct: true
        why: Rehosting, or lift and shift, moves apps as they are, often turning servers into VMs, which suits a large estate that must move fast.
      - id: b
        text: Replatform
        why: Replatforming adds a few cloud optimizations during the move, while this plan keeps every application unchanged.
      - id: c
        text: Refactor
        why: Refactoring rewrites applications with new code, the slowest path for an estate that must move quickly.
      - id: d
        text: Repurchase
        why: Repurchasing swaps licensed software for a SaaS product, but the distributor keeps its own applications.
    evidence:
      - Apps move as they are, often servers turned into VMs, with no changes at first
      - "Legacy estate that must scale fast: rehost."
    takeaway: Moving a large legacy estate fast with no application changes, servers becoming VMs, is the rehost strategy.
    history: []
    verified:
      keyHash: caf8e8d75208
      fullHash: 16ba22db4d13
