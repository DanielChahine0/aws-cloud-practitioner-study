questions:
  - id: q-q606bg
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-migration-and-modernization-competency-partners
    note: m12/migration-services-and-tools
    task: "4.3"
    level: 2
    stem: >-
      A regional credit union wants to move its branch systems to AWS, but its IT staff have never moved systems to the cloud.
      It wants an outside firm with proven skill in the phase it is about to start.
      What should it do?
    options:
      - id: a
        text: Engage one of the AWS Migration and Modernization Competency Partners
        correct: true
        why: These AWS partners specialize in particular migration phases or needs, so one of them fills the credit union's missing expertise.
      - id: b
        text: Post its open questions about the move on the AWS re:Post community site
        why: re:Post is a community question and answer site, so it offers advice threads rather than a firm to run the move.
      - id: c
        text: Read the articles and videos on common topics in the AWS Knowledge Center
        why: The Knowledge Center holds articles and videos on common questions, which leaves the credit union without hands-on migration help.
      - id: d
        text: Run the AWS Trusted Advisor best practice checks against its AWS account
        why: Trusted Advisor checks an account against best practices and supplies no outside firm to lead a migration.
    evidence:
      - Competency partners fill expertise gaps.
    takeaway: When a company lacks migration skills, AWS Migration and Modernization Competency Partners supply experts for each phase.
    history: []
    verified:
      keyHash: a824cf97af6d
      fullHash: 3f859042f8ef
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
