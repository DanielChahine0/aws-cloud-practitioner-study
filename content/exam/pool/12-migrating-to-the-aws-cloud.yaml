  - id: q-zhnmmn
    version: 1
    status: live
    type: single
    pool: exam
    concept: database-schema
    note: m12/database-migrations
    task: "3.4"
    level: 1
    stem: >-
      In a relational database, what is the blueprint that defines the tables, the type of each field and the relationships between tables?
    options:
      - id: a
        text: The schema
        correct: true
        why: The schema is the database's blueprint of tables, field types and relationships, which is what the stem describes.
      - id: b
        text: A stored procedure
        why: A stored procedure is a code object that runs logic inside the database, rather than the layout of its tables.
      - id: c
        text: A read replica
        why: A read replica is a copy of a database that serves reads, so it holds data rather than defining the structure.
      - id: d
        text: A partition key
        why: A partition key decides where a NoSQL item is stored and describes no tables or relationships.
    evidence:
      - "Schema: The blueprint of a database's tables, field types and relationships."
    takeaway: A schema is a database's blueprint of tables, field types and relationships, and a new engine means recreating it.
    history: []
    verified:
      keyHash: f0e5f93adc21
      fullHash: 93ad666da8c6
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-4222vt
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: aws-database-migration-service
    note: m12/database-migrations
    task: "3.4"
    level: 2
    stem: >-
      A concert ticketing platform will move its production database to AWS with AWS Database Migration Service (AWS DMS).
      Ticket sales must go on while the migration runs, and the target must pick up every sale made until the cutover.
      Which AWS DMS capabilities meet these two needs?
    options:
      - id: a
        text: It moves the data while the source database stays live
        correct: true
        why: AWS DMS moves data with a scheduled task while the source stays live, so ticket sales go on during the migration.
      - id: b
        text: It keeps applying ongoing source changes to the target
        correct: true
        why: With replication, AWS DMS goes past a one-time copy and keeps the target in sync with each new sale until cutover.
      - id: c
        text: It also moves NoSQL databases and data warehouses
        why: This is true of AWS DMS, but the range of database types it supports does nothing to keep sales running or the copy current.
      - id: d
        text: It handles moves to the same engine or to a new one
        why: This is true of AWS DMS, but support for both migration types is about engines rather than the platform's uptime or new sales.
      - id: e
        text: It can carry terabytes of data at a low cost
        why: This is true of AWS DMS, but a low price for large moves meets neither the need for live sales nor the need to capture new ones.
    evidence:
      - You name the source and target, and a scheduled task on a replication VM copies the data while the source stays live.
      - With database replication, AWS DMS goes beyond a one-time copy and keeps replicating ongoing changes from the source database to the target so the two stay in sync.
    takeaway: AWS DMS migrates databases while the source stays live and can keep replicating changes so source and target stay in sync.
    history: []
    verified:
      keyHash: 31149ef3c3c5
      fullHash: 679cc0f918da
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-stx5m2
    version: 1
    status: retired
    type: single
    pool: exam
    concept: aws-schema-conversion-tool
    note: m12/database-migrations
    task: "3.4"
    level: 2
    stem: >-
      An insurance broker is moving from a commercial database engine to Amazon Aurora PostgreSQL.
      Before any data is copied, its stored procedures, views and functions must be rewritten to run on the new engine.
      Which AWS tool is built to automate that rewriting step?
    options:
      - id: a
        text: AWS Schema Conversion Tool
        correct: true
        why: AWS SCT converts schemas and code objects such as stored procedures, views and functions to a new engine.
      - id: b
        text: AWS Application Discovery Service
        why: Application Discovery Service inventories on-premises servers and their links, and leaves stored procedures and views unconverted.
      - id: c
        text: AWS Application Migration Service
        why: Application Migration Service replicates whole applications to AWS and leaves database code for a new engine unconverted.
      - id: d
        text: AWS DataSync
        why: DataSync moves files and objects into AWS storage, so it leaves stored procedures and views untouched.
    evidence:
      - Converts schemas and code objects (stored procedures, views, functions) to a new engine
      - "Rule: schema or code conversion points to SCT; moving data or one end-to-end tool points to DMS."
    takeaway: Converting schemas and code objects for a different database engine is the job of AWS SCT.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The stem asks for an AWS 'tool' and option 4 is the only option with 'Tool' in its name."
  - id: q-38n7ed
    version: 1
    status: retired
    type: single
    pool: exam
    concept: transfer-protocols
    note: m12/transferring-data-online
    task: "3.8"
    level: 1
    stem: >-
      Before two systems can exchange files, they must agree on a shared set of rules for how the data travels from one to the other.
      What is that set of rules called?
    options:
      - id: a
        text: A transfer protocol
        correct: true
        why: A transfer protocol is a rule set for how data moves between places, which is what the two systems must agree on.
      - id: b
        text: A security group
        why: A security group is a set of rules that filters which traffic reaches a resource, not a rule set for how file data travels.
      - id: c
        text: A network access control list
        why: A network ACL holds rules that filter traffic in and out of a subnet, rather than rules for how two systems exchange files.
      - id: d
        text: An IAM policy
        why: An IAM policy holds allow and deny rules for what identities may do in AWS, not rules for how data travels between systems.
    evidence:
      - "Transfer protocol: A rule set for how data moves between places."
    takeaway: A transfer protocol, such as SFTP or FTPS, is the rule set that governs how data moves between places.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The item tests a general networking term rather than an AWS service, so task 3.8 other service categories does not fit it."
  - id: q-705wh0
    version: 1
    status: live
    type: single
    pool: exam
    concept: edge-computing
    note: m12/transferring-data-offline
    task: "3.8"
    level: 2
    stem: >-
      A mining company runs a remote site in harsh conditions with no reliable network link.
      It needs secure, rugged hardware on site that processes sensor data where it is collected.
      Which type of workload is this?
    options:
      - id: a
        text: Edge computing
        correct: true
        why: Processing data on a secure, rugged device at a remote site is edge computing, a use case that Snowball Edge devices serve.
      - id: b
        text: Serverless computing
        why: Serverless computing runs code in AWS Regions without managing servers, which needs the network link this site lacks.
      - id: c
        text: Multi-cloud deployment
        why: A multi-cloud deployment spreads workloads across several cloud providers, rather than processing data on site.
      - id: d
        text: Cloud-based deployment
        why: A cloud-based deployment runs everything in the cloud, which a site without a reliable link has no way to reach.
    evidence:
      - They bring strong compute, large capacity and gigabytes per second, and also serve rugged, secure edge computing.
      - "Edge computing: A Snowball Edge use case that calls for a secure, rugged device."
    takeaway: Processing data on secure, rugged hardware at a remote site is edge computing, which Snowball Edge devices also serve.
