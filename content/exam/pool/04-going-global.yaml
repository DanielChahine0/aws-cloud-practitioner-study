      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-67nwgr
    version: 1
    status: live
    type: single
    pool: exam
    concept: infrastructure-as-code
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      Which approach declares what an entire environment should contain in files kept under source control, so tools can rebuild that environment identically in any Region?
    options:
      - id: a
        text: Command-line scripting
        why: Command-line scripts run commands step by step for routine jobs and grow hard to maintain, rather than declaring a whole environment.
      - id: b
        text: Infrastructure as code
        correct: true
        why: Infrastructure as code declares the environment in source-controlled files that tools can rebuild identically anywhere.
      - id: c
        text: Programmatic access
        why: Programmatic access calls AWS through code one step at a time, such as saving user data, not keeping a blueprint of a whole environment.
      - id: d
        text: Manual console workflows
        why: Console workflows suit newcomers and small one-off jobs, and they leave no declared definition that rebuilds the same way.
    evidence:
      - Infrastructure as code (IaC) stores the architecture as a source-controlled blueprint that tools rebuild anywhere, identically and easily.
      - IaC is declarative, so teams can version, review and automate deployments.
      - Programmatic access suits developers, the console newcomers, and IaC repeatable work at scale.
    takeaway: Infrastructure as code keeps an environment as a versioned blueprint, so it can be rebuilt identically in any Region.
    history: []
    verified:
      keyHash: f811f8aea28a
      fullHash: 267327d3f822
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-45b5x0
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-cloudformation
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 3
    stem: >-
      A logistics company wants its network, servers and databases described in text files that reviewers approve before each release.
      The same files must then create matching environments in each of its AWS accounts.
      Which AWS service fits?
    options:
      - id: a
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk deploys and runs an application for you, rather than building any set of resources from files the team writes.
      - id: b
        text: AWS Config
        why: AWS Config records and evaluates how existing resources are set up; it does not create them from a template.
      - id: c
        text: AWS CloudFormation
        correct: true
        why: CloudFormation reads declarative templates and provisions the resources they describe, giving matching environments in every account.
      - id: d
        text: AWS Systems Manager
        why: Systems Manager helps operate and patch resources that already exist, not build whole environments from reviewed templates.
    evidence:
      - Its templates are text files declaring what to build, not how, and it provisions and configures it all through AWS APIs.
      - One template across accounts or Regions gives identical environments from one command, with fewer errors and more resilience.
    takeaway: Reviewed text templates that build matching resource stacks across accounts point to AWS CloudFormation.
    history: []
    verified:
      keyHash: 17108f8b3c42
      fullHash: 16a47a354cc5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-fwx2k9
    version: 1
    status: live
    type: single
    pool: exam
    concept: multi-az-deployment
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      A regional clinic runs its appointment booking app in one AWS Region.
      The app must keep working if one isolated location in that Region fails, but leadership accepts the risk of a full Region outage to hold down cost.
      Which design fits?
    options:
      - id: a
        text: Copy it into a second AWS Region
        why: A second Region guards against a whole Region failing, a risk the clinic chose to accept, so it adds cost beyond the need.
      - id: b
        text: Spread it across several AZs in the Region
        correct: true
        why: Running in more than one Availability Zone lets the app fail over to a backup AZ when one location goes down.
      - id: c
        text: Serve it from Amazon CloudFront edge locations
        why: Edge locations cache content near users and are not where the booking app and its data run.
      - id: d
        text: Move it to one larger EC2 instance
        why: One bigger instance still sits in a single location, so that location failing takes the app down.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
    takeaway: To survive one Availability Zone failing without paying for a second Region, run across several AZs in the same Region.
    history: []
