      fullHash: eb9589fc64f9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-35szgn
    version: 1
    status: live
    type: single
    pool: exam
    concept: regional-pricing
    note: m04/choosing-aws-regions
    task: "4.1"
    level: 2
    stem: >-
      A game studio faces no legal limits on where its data is stored, and its players are spread evenly across the world.
      Two AWS Regions both offer every service it needs.
      What should guide its choice between those two Regions?
    options:
      - id: a
        text: The distance to its players
        why: Distance does vary by Region, but with players spread evenly across the world, neither Region is nearer to most of them.
      - id: b
        text: The rates charged in each Region
        correct: true
        why: Each Region sets its own prices, so with compliance, proximity and services equal, cost is what remains to compare.
      - id: c
        text: The services each Region offers
        why: Services do differ between Regions, but both of these already offer everything the studio needs, so this cannot decide.
      - id: d
        text: The data laws each Region follows
        why: Each Region follows local law, but the studio has no legal limits on where its data lives, so law does not separate them.
    evidence:
      - AWS pricing is transparent and granular, yet each Region has its own rates.
      - Regions are isolated, follow local law, and differ in services and prices.
    takeaway: When compliance, proximity and services are equal, the different rates each Region charges decide the choice.
    history: []
    verified:
      keyHash: 32aabbe77070
      fullHash: f493b82a5ca3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-kdm0v5
    version: 1
    status: live
    type: single
    pool: exam
    concept: regional-pricing
    note: m04/choosing-aws-regions
    task: "4.1"
    level: 1
    stem: >-
      Which statement explains why the same AWS service can carry a higher price in one Region than in another?
    options:
      - id: a
        text: Each Region is walled off from every other AWS Region.
        why: Isolation is true of every Region and protects data, but it is a security trait and does not set a service's price.
      - id: b
        text: New features roll out to each Region at a different time.
        why: Gradual rollout explains why a service may be missing in a Region, not why the same service costs more there.
      - id: c
        text: Each Region has its own operating, energy and tax costs.
        correct: true
        why: Each Region's rates reflect its local operating and energy costs, taxes and tax incentives, so prices vary by Region.
      - id: d
        text: Edge locations cache content in places apart from Regions.
        why: Edge locations do sit apart from Regions to cut latency, but where they sit does not set what a Region charges.
    evidence:
      - AWS pricing is transparent and granular, yet each Region has its own rates.
      - Operating and energy costs, local taxes and tax incentives
    takeaway: Region prices differ because each Region carries its own local operating, energy and tax costs.
    history: []
