questions:
  - id: q-egbm80
    version: 1
    status: live
    type: single
    pool: exam
    concept: region-selection
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 2
    stem: >-
      A payroll software firm in Germany is comparing AWS Regions for a new deployment.
      Most of its customers sit in neighboring countries, it wants a low monthly bill, it relies on a recently launched service, and its salary records must stay inside Germany.
      Which factor should the firm settle before any other?
    options:
      - id: a
        text: Distance to its customers
        why: Nearness to customers matters for speed, but a Region outside Germany is ruled out whatever its distance, so it comes later.
      - id: b
        text: Rules on where data is stored
        correct: true
        why: The bar on salary records leaving Germany can decide the Region by itself, so it is checked before every other factor.
      - id: c
        text: Services offered in each Region
        why: The new service is only compared among Regions that already keep the records in Germany, so it cannot come first.
      - id: d
        text: Rates charged in each Region
        why: A cheaper Region outside Germany would break the storage rule, so price is weighed only after that check.
    evidence:
      - Check compliance first, since a legal rule can settle the Region alone, but most businesses have none and move on to the rest.
      - Data sovereignty laws may force data to stay in the country, which touches both compliance and cost.
    takeaway: When a rule limits where data may be stored, compliance settles the Region before proximity, services or price.
    history: []
    verified:
      keyHash: 1d78bd71bbd8
      fullHash: b21185201cbd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-69pq32
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-govcloud-regions
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 2
    stem: >-
      A US federal agency and the outside contractors that run its systems need to host sensitive workloads under stricter physical, operational and staffing controls than standard AWS locations apply.
      Which AWS offering fits?
    options:
      - id: a
        text: AWS Outposts
        why: Outposts runs AWS services in the agency's own building, leaving the stricter staffing and operational controls it needs to the agency.
      - id: b
        text: Amazon EC2 Dedicated Hosts
        why: A Dedicated Host gives one customer a whole physical server, but it does not add stricter controls over the people and sites behind it.
      - id: c
        text: AWS GovCloud Regions
        correct: true
        why: These Regions serve US federal and other public bodies and their contractors, with stricter physical, operational and personnel controls.
      - id: d
        text: AWS Artifact
        why: Artifact hands out compliance reports and agreements; it does not host the agency's sensitive workloads anywhere.
    evidence:
      - AWS GovCloud Regions carry strict physical, operational and personnel controls for US government bodies and contractors.
    takeaway: US government agencies and their contractors that need stricter facility and staff controls run in AWS GovCloud Regions.
    history: []
    verified:
