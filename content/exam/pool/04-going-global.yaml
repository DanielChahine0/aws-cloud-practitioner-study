  - id: q-7nfyb7
    version: 1
    status: live
    type: single
    pool: exam
    concept: edge-locations
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      A fitness company streams workout videos from a single AWS Region to members on several continents.
      Members far from that Region report long buffering before each video starts.
      Which part of the AWS global infrastructure should hold cached copies of the videos closer to those members?
    options:
      - id: a
        text: Availability Zones
        why: Availability Zones sit inside the Region and add resilience there, so they do not bring videos nearer to distant members.
      - id: b
        text: Edge locations
        correct: true
        why: Edge locations sit outside Regions near users and cache video, cutting latency and speeding up delivery to far-off members.
      - id: c
        text: AWS Outposts racks
        why: Outposts runs AWS services in a customer's own facility, not at caching sites spread out near members around the world.
      - id: d
        text: AWS GovCloud Regions
        why: GovCloud Regions add strict controls for US government workloads and do not cache content near members.
    evidence:
      - Edge locations sit apart from Regions, in spots like Atlanta and Shanghai, and cache data, video and apps for higher transfer speeds and lower latency.
    takeaway: Cached copies near distant users come from edge locations, which sit outside Regions and cut latency.
    history: []
    verified:
