  - id: q-2c5c21
    version: 1
    status: live
    type: single
    pool: exam
    concept: multi-region-architecture
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 1
    stem: >-
      Which deployment design keeps a workload available even when every Availability Zone in its home Region becomes unreachable?
    options:
      - id: a
        text: Running copies in more than one Region
        correct: true
        why: Copies in another Region keep serving when the whole home Region is down, which is the failure the stem describes.
      - id: b
        text: Running copies in several AZs of one Region
        why: Several AZs in one Region protect against a single AZ failing, not against all of that Region's AZs failing together.
      - id: c
        text: Caching content at edge locations
        why: Edge locations cache content for speed and are not built to run the workload or its databases.
      - id: d
        text: Adding instances with Auto Scaling
        why: Auto Scaling adds capacity inside the Region, so the new instances fail along with the Region.
    evidence:
      - "**Multi-Region** goes one step further and survives a whole Region going down."
    takeaway: Only a multi-Region design keeps a workload running when an entire Region goes down.
