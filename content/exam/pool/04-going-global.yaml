  - id: q-0k4bkh
    version: 1
    status: live
    type: single
    pool: exam
    concept: gdpr
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 3
    stem: >-
      An online pharmacy based in Spain takes card payments from shoppers across the European Union and keeps their names, emails and order history.
      It must get each shopper's permission before collecting these details and let shoppers view or erase them on request.
      Which rules set these duties?
    options:
      - id: a
        text: HIPAA rules
        why: HIPAA is a US law on health information, so it does not set consent and erasure duties for a pharmacy serving EU shoppers.
      - id: b
        text: PCI rules
        why: PCI rules protect the card data the pharmacy takes at checkout, but they do not cover consent or erasing personal details.
      - id: c
        text: GDPR rules
        correct: true
        why: GDPR is the EU privacy law that requires consent before collecting personal details and lets people see or erase them.
      - id: d
        text: Data sovereignty rules
        why: These rules decide where data must be stored, not consent or a shopper's right to view and erase their details.
    evidence:
      - Under GDPR, the EU privacy law, an EU online shop must get consent before collecting personal data and let people see or erase it.
    takeaway: An EU business that must get consent and let people view or erase their personal data is meeting GDPR.
    history: []
    verified:
