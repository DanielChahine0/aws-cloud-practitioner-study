questions:
  - id: q-5tanrf
    version: 1
    status: live
    type: single
    pool: exam
    concept: ebs-data-lifecycle
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "2.1"
    level: 2
    stem: >-
      An online bookstore runs its order system on Amazon EC2 instances with Amazon EBS volumes.
      It wants regular snapshots of those volumes, with the old snapshots removed over time.
      Under the AWS shared responsibility model, how is this work split?
    options:
      - id: a
        text: AWS schedules the snapshots, and the bookstore deletes the old ones
        why: Scheduling backups is part of looking after the data, so it falls to the bookstore and not to AWS.
      - id: b
        text: The bookstore schedules the snapshots and deletes the old ones
        correct: true
        why: The data on the volumes is the customer's, so the bookstore both plans the snapshots and prunes old ones to control cost.
      - id: c
        text: AWS schedules the snapshots and deletes the old ones
        why: AWS runs the hardware behind EBS, but backing up the data on the volumes and cleaning up old copies is the bookstore's job.
      - id: d
        text: The bookstore schedules the snapshots, and AWS deletes the old ones
        why: Pruning old snapshots to keep costs down is also the bookstore's task, so AWS does not remove them on its behalf.
    evidence:
      - Your data is your job under shared responsibility, so you provision, move, deprovision and back up volumes.
      - 'Your part: schedule snapshots, prune them to control cost, encrypt sensitive data, verify integrity and test restores.'
    takeaway: The customer owns the EBS data lifecycle, from scheduling snapshots to deleting the ones it no longer needs.
    history: []
