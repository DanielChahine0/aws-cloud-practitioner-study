    pool: exam
    concept: s3-lifecycle
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      A travel agency writes booking logs to S3 Standard.
      The logs are read often for 30 days and rarely after that, but they must come back quickly whenever someone asks for one.
      Regulators require the agency to keep each log for a year, and then it should be deleted.
      Which S3 Lifecycle actions fit this pattern?
    options:
      - id: a
        text: A transition action that moves logs older than 30 days to S3 Standard-IA
        correct: true
        why: A transition at that age moves the cooled-off logs to a cheaper class while keeping them quick to read.
      - id: b
        text: A transition action that moves logs older than 30 days to S3 Glacier Deep Archive
        why: Deep Archive takes hours to return data, which breaks the need to get a log back quickly.
      - id: c
        text: An expiration action that deletes logs once they are a year old
        correct: true
        why: An expiration action deletes objects for good when they are no longer needed, matching the one-year retention rule.
      - id: d
        text: An expiration action that deletes logs once they are 30 days old
        why: Deleting logs at that age throws away records that regulators require the agency to keep for a year.
      - id: e
        text: A transition action that moves new logs to S3 Standard-IA right away
        why: New logs are read often in their first 30 days, and Standard-IA charges for each retrieval, so moving them at once costs more.
    evidence:
      - Transition actions move objects to another class at a set age, such as Standard-IA after 30 days or Glacier Deep Archive after a year.
      - Expiration actions delete objects for good, such as when compliance no longer needs them.
      - 'S3 Standard-IA: data used less often but needed fast, with S3 Standard''s durability, throughput and latency, cheaper storage and a per-GiB retrieval fee, for backups and disaster recovery files.'
    takeaway: S3 Lifecycle uses transition actions to move aging objects to cheaper classes and expiration actions to delete them.
