  - id: q-kade9p
    version: 1
    status: live
    type: single
    pool: exam
    concept: ebs-data-lifecycle
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "2.1"
    level: 2
    stem: >-
      A bike rental shop runs its booking app on Amazon EC2 and protects the app's Amazon EBS volumes with snapshots.
      Under the AWS shared responsibility model, which task is the shop's own?
    options:
      - id: a
        text: Replicating each volume within its Availability Zone
        why: EBS copies every volume inside its zone automatically, so this protection is handled by AWS.
      - id: b
        text: Storing snapshots across several Availability Zones
        why: Snapshots are kept in Amazon S3 with redundant copies in several zones, which AWS arranges without customer work.
      - id: c
        text: Removing old snapshots to keep costs down
        correct: true
        why: Pruning snapshots to control cost is part of looking after the data, which is the shop's share as the customer.
      - id: d
        text: Keeping each incremental snapshot usable as a full copy
        why: AWS manages the links between incremental snapshots, so each one restores in full without customer effort.
    evidence:
      - 'Your part: schedule snapshots, prune them to control cost, encrypt sensitive data, verify integrity and test restores.'
      - Each still acts as a full copy, AWS manages the links, and deleting one frees only data no other snapshot uses.
      - Snapshots sit in Amazon S3, redundantly across several Availability Zones.
    takeaway: AWS runs and replicates EBS, while the customer schedules, encrypts, prunes and test-restores its own snapshots.
    history: []
