  - id: q-v91w5p
    version: 1
    status: retired
    type: single
    pool: exam
    concept: ebs-snapshots
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.2"
    level: 2
    stem: >-
      A video game studio keeps a build server's data on an Amazon EBS volume in one Availability Zone.
      It wants the same data on a test server in a different AWS Region.
      Which Amazon EBS capability should the studio use to get the data there?
    options:
      - id: a
        text: Point-in-time snapshots of the volume
        correct: true
        why: A snapshot can be copied across Regions and used to create a new volume there with the same data.
      - id: b
        text: Automatic replication of the volume inside its zone
        why: EBS does replicate each volume inside its zone, but those copies never leave that zone, so the test server cannot use them.
      - id: c
        text: Live changes to the volume's size and type
        why: Changing size or type tunes the volume in place, and it leaves the data in the same zone as before.
      - id: d
        text: Reattachment of the volume to another instance
        why: A volume attaches only to instances in its own zone, so the test server in another Region cannot mount it.
    evidence:
      - 'Benefits: recovery from corruption, deletion or failure; cross-Region migration, resizing, cloning and cross-account sharing; and lower cost from storing only changes.'
      - A snapshot can create many new volumes, each an exact copy of the source at that moment.
    takeaway: EBS snapshots move volume data across Availability Zones and Regions, which a volume cannot cross by itself.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The item tests an Amazon EBS capability, so task 3.6 storage services fits better than 3.2 global infrastructure."
  - id: q-qm111r
    version: 1
