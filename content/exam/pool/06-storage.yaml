  - id: q-r1nxqa
    version: 1
    status: live
    type: single
    pool: exam
    concept: block-storage
    note: m06/introduction-to-storage
    task: "3.6"
    level: 1
    stem: >-
      Which type of storage splits data into fixed-size chunks so that an edit rewrites only the chunks that changed?
    options:
      - id: a
        text: Object storage
        why: Object storage rewrites the whole object on any change, rather than just the changed parts.
      - id: b
        text: File storage
        why: File storage is defined by a shared folder hierarchy reached over a network, not by the fixed-size chunks with partial rewrites that the stem describes.
      - id: c
        text: Block storage
        correct: true
        why: Block storage writes only the changed blocks, which keeps frequent small updates fast.
      - id: d
        text: Ephemeral storage
        why: Ephemeral describes how long data lasts, since it is lost on stop, and says nothing about how edits are written.
    evidence:
      - Data is split into blocks for fast access, and an edit rewrites only changed blocks, which suits frequently updated apps and databases.
    takeaway: Block storage updates only the blocks that change, which suits databases and other frequently updated data.
    history: []
