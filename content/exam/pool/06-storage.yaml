    stem: >-
      A ticketing company runs its database on an Amazon EBS volume.
      At busy times checkout slows, because the volume cannot keep up with the number of reads and writes per second.
      The company wants to stay on Amazon EBS.
      What should it do?
    options:
      - id: a
        text: Take snapshots of the volume more often
        why: Snapshots back up the volume, and taking them more often adds nothing to its read and write performance.
      - id: b
        text: Switch the volume to a type with higher IOPS
        correct: true
        why: Volume types differ in performance measured in IOPS, and the type can be changed in place to serve more reads and writes.
      - id: c
        text: Copy the volume's snapshots to a second Region
        why: Copies in another Region help with recovery and migration, but the volume in use stays exactly as fast as before.
      - id: d
        text: Turn on encryption for the volume
        why: Encryption protects the stored data, and it does nothing to raise the number of operations the volume can serve.
    evidence:
      - Volume types differ in price and in performance, measured in IOPS (input/output operations per second) and tied to type and often size.
      - 'Cost and performance tuning: change type, size or IOPS on the fly without downtime.'
    takeaway: When an EBS volume cannot keep up, a volume type with higher IOPS raises performance without leaving EBS.
