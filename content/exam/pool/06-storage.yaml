  - id: q-ja8zf5
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: ec2-instance-store
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 3
    stem: >-
      A weather research lab runs heavy simulations on one Amazon EC2 instance and writes scratch files it can lose without harm.
      It wants the fastest disk the instance can reach, at no extra cost.
      Which statements explain the best storage choice for those scratch files?
    options:
      - id: a
        text: Amazon EBS keeps a volume's data through instance stops
        why: EBS persistence is true but wasted here, since the scratch files can be lost and EBS volumes are billed on top of the instance.
      - id: b
        text: EC2 instance store sits on the host, so latency is very low
        correct: true
        why: Disk on the instance's own host gives the lowest latency and highest I/O, which is the speed the lab wants.
      - id: c
        text: Amazon EFS lets many instances share one file system
        why: EFS sharing is true but not needed for one instance, and a local instance store disk is usually faster than EFS.
      - id: d
        text: EC2 instance store comes free with many instance types
        correct: true
        why: Instance store is included with many instance types at no extra cost, which meets the lab's cost goal.
      - id: e
        text: Amazon EBS volumes change size and type without downtime
        why: Live EBS changes are true but beside the point, because the lab needs neither resizing nor persistence for scratch data.
      - id: f
        text: Amazon EFS grows and shrinks as files are added or removed
        why: EFS elasticity is true but does not make it the fastest or a free disk, so it does not meet the lab's goals.
    evidence:
      - Being ephemeral, it suits data you can lose, such as buffers, caches and scratch space for heavy processing.
      - 'Benefits: included with many instance types at no extra cost, with very low latency and high I/O because it sits on the host.'
    takeaway: Instance store gives very fast, free disk for temporary data such as caches and scratch space that can be lost.
    history: []
    verified:
      keyHash: 5fa2e6af75ac
      fullHash: ff1d75f59e86
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
