    note: m06/introduction-to-storage
    task: "3.6"
    level: 1
    stem: >-
      Which statements describe object storage?
    options:
      - id: a
        text: Each item is kept with a unique ID and metadata
        correct: true
        why: An object bundles its data with an identifier and descriptive metadata, which is how object storage keeps it.
      - id: b
        text: An edit rewrites only the blocks that changed
        why: Rewriting only changed blocks is how block storage works, while an object is replaced as a whole.
      - id: c
        text: Items sit in a folder hierarchy shared over a network
        why: A shared folder hierarchy describes file storage, while objects sit in flat buckets.
      - id: d
        text: An edit replaces the whole item, not only a part
        correct: true
        why: Objects are updated as complete units, which is why object storage suits files that rarely change.
      - id: e
        text: A volume attaches to one instance like a drive
        why: A volume attached like a drive describes block storage, while objects are reached in buckets, not mounted on an instance.
      - id: f
        text: Many users open one file system over a network
        why: One file system opened by many users describes file storage, while object storage keeps separate objects in buckets.
    evidence:
      - An object holds data, a unique ID and metadata, and any change rewrites the whole object.
      - Objects sit in flat buckets with practically unlimited room for unstructured data, and rich metadata helps search and analytics.
    takeaway: Object storage keeps self-contained objects of data, ID and metadata, and replaces a whole object on any change.
