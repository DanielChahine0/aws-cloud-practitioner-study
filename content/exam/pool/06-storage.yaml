    concept: aws-elastic-disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.2"
    level: 2
    stem: >-
      A pharmacy chain runs its prescription servers in its own data center.
      If that site fails, the servers must come back in an AWS Region within minutes from an up-to-date copy, and the chain wants to avoid paying for a second data center.
      Which service fits?
    options:
      - id: a
        text: AWS Storage Gateway
        why: Storage Gateway extends local storage into AWS, but it does not recover whole servers in a Region.
      - id: b
        text: AWS Elastic Disaster Recovery
        correct: true
        why: It replicates servers to AWS continuously, so they recover in the target Region within minutes with no standby site.
      - id: c
        text: Amazon Data Lifecycle Manager
        why: Data Lifecycle Manager schedules EBS snapshots for resources already in AWS, so it cannot protect on-site servers.
      - id: d
        text: Amazon S3 Glacier Deep Archive
        why: Deep Archive keeps cheap long-term copies with retrieval measured in hours, far too slow for server recovery.
    evidence:
      - Exact, current replicas let servers recover in the target AWS Region within minutes, with point-in-time recovery.
      - 'No secondary data center: low-cost storage, minimal compute and pay-per-use pricing.'
    takeaway: Fast recovery of on-premises servers into an AWS Region, without a standby data center, points to Elastic Disaster Recovery.
