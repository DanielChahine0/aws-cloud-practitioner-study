  - id: q-9hbyxd
    version: 1
    status: retired
    type: single
    pool: exam
    concept: s3-block-public-access
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "2.3"
    level: 2
    stem: >-
      An online art gallery gave its Amazon S3 bucket a policy that lets anyone read the images in it.
      Anonymous visitors still get an access denied error for every image.
      Which S3 feature is most likely stopping these requests?
    options:
      - id: a
        text: S3 Versioning
        why: Versioning keeps earlier copies of objects for restoring, and it never blocks a read that a policy allows.
      - id: b
        text: S3 Block Public Access
        correct: true
        why: Block Public Access overrides a bucket policy that would open data to the public, so the anonymous reads fail.
      - id: c
        text: Amazon S3 presigned URLs
        why: A presigned URL grants extra, expiring access to one object, so it could open a read but cannot cause this denial.
      - id: d
        text: Amazon S3 Audit Logs
        why: Audit logs record each request and who made it, but they only report on access and do not refuse any request.
    evidence:
      - Block Public Access, on the account or the bucket, overrides any bucket policy that would open data to the public.
      - Presigned URLs grant expiring access without touching the bucket policy.
    takeaway: S3 Block Public Access beats a permissive bucket policy, so public requests fail while the block is on.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Option 4 alone repeats the stem's word 'access', which points at the key. Option 2 'Amazon S3 Audit Logs' is not a real AWS feature name. Option names mix 'S3' and 'Amazon S3' prefixes, so the options are not parallel."
  - id: q-nt7aq6
    version: 1
    status: retired
    type: single
