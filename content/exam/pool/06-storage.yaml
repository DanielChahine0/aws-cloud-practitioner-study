    concept: aws-storage-gateway
    note: m06/aws-storage-gateway
    task: "3.1"
    level: 3
    stem: >-
      A law office is moving to a hybrid deployment: its document apps keep running in its own building, and AWS adds storage capacity behind them.
      Staff must keep fast local access to the files they open most, and the apps should need little or no rework.
      Which AWS service lets the office operate this way?
    options:
      - id: a
        text: AWS Outposts
        why: Outposts runs AWS infrastructure inside the building, so capacity stays on site instead of extending into storage in AWS.
      - id: b
        text: AWS Storage Gateway
        correct: true
        why: Storage Gateway bridges on-premises apps to virtually unlimited AWS storage and keeps frequently used files cached on site.
      - id: c
        text: AWS Direct Connect
        why: Direct Connect is a private network link to AWS, and it neither stores the office's files nor caches them locally.
      - id: d
        text: AWS Site-to-Site VPN
        why: A Site-to-Site VPN encrypts traffic between the office and a VPC, but it adds no storage capacity and no local cache.
    evidence:
      - A hybrid storage service bridging on-premises systems and AWS, giving local apps virtually unlimited cloud capacity with little or no rework.
      - Local storage extends into AWS while frequently used data stays fast on site.
    takeaway: A hybrid deployment that keeps apps on site but grows their storage into AWS with a local cache runs on AWS Storage Gateway.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Option 4 is the only option that repeats the stem's word 'storage', which points at the key."
