    stem: >-
      A hotel group runs a booking app on a fleet of Linux EC2 instances that must all read and write the same files at the same time.
      Storage should grow and shrink by itself as files change.
      Which service fits?
    options:
      - id: a
        text: Amazon EBS
        why: An EBS volume attaches to one instance at a time and keeps a fixed size until someone changes it.
      - id: b
        text: Amazon EC2 instance store
        why: Instance store serves only the instance on its host and loses its data on a stop, so the fleet cannot share it.
      - id: c
        text: Amazon S3
        why: S3 stores objects in buckets, and it is no shared Linux file system that instances mount and edit in place.
      - id: d
        text: Amazon EFS
        correct: true
        why: EFS is an elastic NFS file system that many Linux instances share at once, growing and shrinking with the files.
    evidence:
      - Thousands of concurrent NFS connections let many EC2 instances share files, and every change is visible to all of them at once, with no manual syncing.
      - It grows to petabytes and shrinks as files change, without disrupting applications.
    takeaway: Many Linux instances sharing one self-scaling file system points to Amazon EFS.
