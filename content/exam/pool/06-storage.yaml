    stem: >-
      A genomics lab stores a large dataset in Amazon S3, and nobody can predict which files researchers will open next month.
      The lab wants each object kept at the lowest suitable cost without writing lifecycle rules.
      Which storage class fits?
    options:
      - id: a
        text: S3 Standard-IA
        why: Standard-IA charges for each retrieval, which hurts when some files turn out to be read often.
      - id: b
        text: S3 Intelligent-Tiering
        correct: true
        why: Intelligent-Tiering watches access and moves each object to its cheapest suitable tier with no rules to manage.
      - id: c
        text: S3 Glacier Deep Archive
        why: Deep Archive takes hours to return data, which suits files that are almost never read, unlike this dataset.
      - id: d
        text: S3 Standard
        why: Standard keeps every object at the frequent-access price, even the files nobody opens for months.
    evidence:
      - 'S3 Intelligent-Tiering: for unknown or shifting access, S3 tracks use and moves each object to its cheapest suitable tier, with no lifecycle rules to manage.'
      - Good for data lakes and large datasets whose usage changes.
    takeaway: Unknown or shifting access patterns fit S3 Intelligent-Tiering, which moves objects between tiers by itself.
