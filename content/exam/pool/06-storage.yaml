  - id: q-5ww78a
    version: 1
    status: live
    type: single
    pool: exam
    concept: s3-presigned-urls
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "2.3"
    level: 2
    stem: >-
      A small publishing house keeps manuscripts in a private Amazon S3 bucket.
      It wants a freelance editor to download one manuscript over the next few days, without editing the bucket policy.
      What should it do?
    options:
      - id: a
        text: Generate a presigned URL for the object
        correct: true
        why: A presigned URL gives the editor time-limited access to that one object and leaves the bucket policy unchanged.
      - id: b
        text: Turn off S3 Block Public Access for the bucket
        why: Lifting the block would still need a public policy and would expose far more than a single manuscript.
      - id: c
        text: Add the editor as a principal in the bucket policy
        why: This edits the bucket policy, which the publishing house wants to leave alone.
      - id: d
        text: Switch on static website hosting for the bucket
        why: Website hosting does not open private objects to anyone, and it would not limit access to a few days.
    evidence:
      - Presigned URLs grant expiring access without touching the bucket policy.
      - Sharing a file briefly with an outside party fits a presigned URL.
    takeaway: Short-lived access to one private object, with the bucket policy left alone, calls for an S3 presigned URL.
    history: []
