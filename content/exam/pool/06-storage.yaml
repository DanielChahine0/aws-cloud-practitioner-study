      - id: d
        text: Amazon S3
        why: S3 stores whole objects in buckets, and it does not attach to an instance as a block volume.
    evidence:
      - They live apart from the host on durable SSD or HDD media, so data survives stops, starts and terminations.
      - EBS volumes are virtual hard drives that attach to instances like external drives.
    takeaway: Amazon EBS gives EC2 persistent block volumes whose data outlives instance stops and terminations.
