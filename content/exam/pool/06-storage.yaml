    stem: >-
      A school district's backup software writes each night to an on-site library of magnetic cartridges.
      The district wants to keep that software and its routine unchanged, but hold the backups in AWS instead of on site.
      Which option fits?
    options:
      - id: a
        text: Volume Gateway in cached mode
        why: Cached mode presents iSCSI block volumes to local apps, which this backup software does not write to.
      - id: b
        text: Amazon S3 File Gateway
        why: S3 File Gateway appears as a file share, while the backup software expects cartridge hardware.
      - id: c
        text: Tape Gateway
        correct: true
        why: Tape Gateway shows the software virtual tapes that it stores in Amazon S3, so the backup routine stays as it is.
      - id: d
        text: Volume Gateway in stored mode
        why: Stored mode keeps block volumes on site and backs them up as EBS snapshots, which the software cannot use as a cartridge library.
    evidence:
      - 'Tape Gateway: virtual tapes in Amazon S3 that backup software treats as tape hardware, with rarely used data movable to a cheaper class.'
      - Tape backup software points to Tape Gateway, which is for backup and archiving with no file-level access for daily work.
    takeaway: Tape backup software that should keep running against cloud storage points to Tape Gateway.
