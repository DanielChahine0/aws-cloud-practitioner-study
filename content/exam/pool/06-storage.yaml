  - id: q-kcs1h9
    version: 1
    status: live
    type: single
    pool: exam
    concept: incremental-backups
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      A news website takes an Amazon EBS snapshot of a large volume every night.
      Each nightly snapshot takes less time and adds less storage cost than the very first one did.
      What explains this?
    options:
      - id: a
        text: Snapshots are kept in Amazon S3 across several Availability Zones
        why: This is where snapshots live, and it says nothing about why later ones are quicker and cheaper than the first.
      - id: b
        text: Each later snapshot stores only the blocks that changed
        correct: true
        why: After a full first snapshot, each later one saves only changed blocks and points back to the earlier ones.
      - id: c
        text: EBS replicates each volume within its Availability Zone
        why: Replication inside the zone protects the live volume, and it does not shrink the work or cost of each backup.
      - id: d
        text: One snapshot can be used to create many new volumes
        why: Creating volumes from a snapshot is a way to use backups, and it does not explain why later backups cost less.
    evidence:
      - The first snapshot is a full baseline of all blocks in use.
      - Later ones store only changed blocks and reference earlier ones, forming a chain for point-in-time recovery.
    takeaway: After a full first snapshot, each EBS snapshot stores only the changed blocks, which keeps backups fast and cheap.
    history: []
    verified:
      keyHash: f20868649d51
      fullHash: 6e057ce03309
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
