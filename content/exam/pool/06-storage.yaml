  - id: q-q23t56
    version: 1
    status: live
    type: single
    pool: exam
    concept: s3-bucket-policies
    note: m06/amazon-s3-demonstration
    task: "2.3"
    level: 3
    stem: >-
      A regional clinic wants a partner laboratory's AWS account to upload test results into Amazon S3 storage that the clinic owns, on an ongoing basis.
      A condition must keep the clinic in full control of every uploaded object.
      What should the clinic use?
    options:
      - id: a
        text: An identity-based policy on the clinic's IAM users
        why: A policy on the clinic's own users only sets what those users may do, so it grants nothing to identities in the laboratory's account.
      - id: b
        text: An S3 bucket policy
        correct: true
        why: A bucket policy can name the partner account as principal, allow uploads and add a condition on object ownership.
      - id: c
        text: A presigned URL for each upload
        why: A presigned URL expires, so it suits brief one-off access rather than lasting uploads from a partner account.
      - id: d
        text: S3 Block Public Access settings
        why: Block Public Access only stops public access, so it grants nothing to the partner laboratory.
    evidence:
      - Bucket policies are JSON documents controlling who may reach the objects inside.
      - The demo's policy lets another AWS account upload while the bucket owner keeps full control.
    takeaway: Lasting, conditional access to a bucket for another AWS account is written as a resource-based S3 bucket policy.
