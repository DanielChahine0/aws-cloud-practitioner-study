  - id: q-1vsm4q
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-apis
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 1
    stem: >-
      Whether a user clicks through the AWS Management Console, types an AWS CLI command or runs code built on an AWS SDK, how is a resource launch or change carried out underneath?
    options:
      - id: a
        text: Each tool sends a request to an AWS API
        correct: true
        why: Every action on AWS is an API request, and all three tools call the same APIs to carry it out.
      - id: b
        text: Each tool can launch and stop Amazon EC2 instances
        why: All three can launch and stop instances, but that says what they do, not how the change is carried out.
      - id: c
        text: Each tool is free, and only the resources it creates are billed
        why: The tools carry no charge of their own, but that does not explain how a change is carried out.
      - id: d
        text: Each tool can work with resources in many AWS Regions
