        correct: true
        why: SNS pushes each message to all of its subscribers immediately, so billing, the warehouse and the list each get a copy.
      - id: c
        text: Each message waits in a queue until a receiver polls for it
        why: Holding a message until a receiver polls for it is how Amazon SQS works, while SNS pushes messages out instead of parking them.
      - id: d
        text: A single receiver processes each message, then deletes it
        why: One receiver taking and deleting each message describes Amazon SQS, while SNS hands every subscriber the message.
      - id: e
