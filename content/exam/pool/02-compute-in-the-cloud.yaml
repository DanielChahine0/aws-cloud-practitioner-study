  - id: q-natmhz
    version: 1
    status: live
    type: single
    pool: exam
    concept: amazon-ec2-auto-scaling
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 2
    stem: >-
      A newly opened pet supply retailer cannot predict when traffic to its online store will spike.
      It turns on Amazon EC2 Auto Scaling for the instances behind the store.
      Which benefit of the AWS Cloud does this give the retailer?
    options:
      - id: a
        text: Its capacity follows demand, so it pays only for what it needs
        correct: true
        why: Auto Scaling adds instances as traffic rises and removes them as it falls, which is elasticity with no forecast needed.
      - id: b
        text: Its requests are spread evenly over the instances already running
        why: Spreading requests over running instances is the job of Elastic Load Balancing, not of Auto Scaling.
      - id: c
        text: Its hourly compute rate drops in return for a long-term commitment
        why: A lower rate for a commitment comes from a pricing option such as Savings Plans, not from Auto Scaling.
      - id: d
        text: Its store can reach shoppers abroad from Regions close to them
        why: Serving shoppers from nearby Regions is global reach, which Auto Scaling does not provide.
    evidence:
      - "A new store cannot predict its traffic spikes: let Auto Scaling follow demand."
      - It adds instances as demand and key metrics rise and decommissions them as demand falls, keeping the desired number running every minute.
      - It improves availability, and you pay only for the EC2 instances it runs, while they run.
    takeaway: Amazon EC2 Auto Scaling gives elasticity, so capacity follows unpredictable demand and only running instances are paid for.
    history: []
    verified:
      keyHash: 833fa902eef9
      fullHash: 8ed606219dc1
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-1ehpn8
    version: 1
    status: retired
    type: single
    pool: exam
    concept: loose-coupling
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    stem: >-
      An online travel agency's booking component calls its invoicing component directly.
      Whenever invoicing goes down, bookings start failing as well.
      Which design change follows the AWS principle that keeps this kind of failure from spreading?
    options:
      - id: a
        text: Have booking leave invoicing requests in a message queue
        correct: true
        why: A queue lets booking keep sending while invoicing is down, so the invoicing failure stays contained.
      - id: b
        text: Run booking and invoicing together on one larger instance
        why: Merging both parts onto one instance couples them even more tightly, so one failure still stops both.
      - id: c
        text: Put booking and invoicing behind one shared load balancer
        why: A load balancer only spreads requests over instances, and booking still waits on invoicing and fails with it.
      - id: d
        text: Give booking and invoicing each a larger instance size
        why: Bigger instances can still go down, and booking would still fail with invoicing through the direct call.
    evidence:
      - "**Loosely coupled**: a message queue sits between them, so A keeps sending while B is down and messages wait until B handles them."
      - Loose coupling contains failures instead of letting them cascade, and it is the target for AWS architectures.
    takeaway: Loose coupling through a queue keeps one component's failure from cascading into the components that call it.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 2 is the only one that separates the two components; the other three keep them coupled.)"
  - id: q-ghtbn0
    version: 1
    status: retired
    type: multi
    pool: exam
    concept: monolithic-vs-microservices
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    select: 2
    stem: >-
      An online learning platform is replacing its monolithic application with a microservices design.
      Which outcomes come from this change itself?
    options:
      - id: a
        text: Each service can fail while the rest of the app keeps working
        correct: true
        why: Microservices are loosely coupled, so a failure in one part stays contained instead of stopping the whole platform.
      - id: b
        text: Each service can be changed and released on its own schedule
        correct: true
        why: Loosely coupled services can be updated on their own, which is the flexibility the change brings.
      - id: c
        text: Each service can be resized to more CPU and memory when needed
        why: Resizing an instance's CPU and memory is vertical scaling, which a monolith on EC2 can use just as well.
      - id: d
        text: Each service is billed only for the time its instances are running
        why: Amazon EC2 bills only running instances with either design, so this does not come from the change.
      - id: e
        text: Each service can share a physical host with other customers' instances
        why: Multi-tenancy on EC2 hosts applies to any instance, so it is not an outcome of splitting the application.
    evidence:
      - Microservices loosely couple those parts, so the rest keep working and talking when one fails, adding availability, resilience and flexibility.
      - A traditional monolith tightly couples its database logic, web servers, user interface and business logic, so one failure can take down the whole application.
    takeaway: Microservices loosely couple an application's parts, so one failure stays contained and each part stays flexible.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Options 1 and 3 are the only ones about service independence; 2, 4 and 5 describe instance traits.)"
