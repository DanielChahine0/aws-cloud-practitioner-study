  - id: q-aks2ht
    version: 1
    status: live
    type: single
    pool: exam
    concept: vertical-scaling
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 1
    stem: >-
      What is it called when a running Amazon EC2 instance is changed to a larger size with more CPU and memory?
    options:
      - id: a
        text: Scaling up
        correct: true
        why: Giving one existing instance more CPU and memory is vertical scaling, also called scaling up.
      - id: b
        text: Scaling out
        why: Scaling out adds more instances to share the work rather than making one instance bigger.
      - id: c
        text: Scaling in
        why: Scaling in removes surplus instances after demand falls, which is the opposite of adding power.
      - id: d
        text: Load balancing
        why: Load balancing spreads requests across instances and never changes the size of any instance.
    evidence:
      - "**Scaling up (vertical)**: give running instances more power."
      - "**Scaling up (vertical scaling)**: making a running instance more powerful."
    takeaway: Giving one instance more CPU or memory is vertical scaling, also called scaling up.
    history: []
    verified:
      keyHash: 67c76e54a79d
      fullHash: 0c5f8a370c51
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-7mwqks
    version: 1
    status: live
    type: single
    pool: exam
    concept: scalability
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 1
    stem: >-
      Which cloud concept is about planning ahead so that a system can grow to handle more users and more work as resources are added over time?
    options:
      - id: a
        text: Scalability
        correct: true
        why: Scalability is the long-term ability to take on more load by adding resources, which is what the stem describes.
      - id: b
        text: Elasticity
        why: Elasticity is the automatic, moment-to-moment growing and shrinking of resources, not long-term planning.
      - id: c
        text: High availability
        why: High availability is about staying in service without a single point of failure, not about growth.
      - id: d
        text: Fault tolerance
        why: Fault tolerance is about continuing to work when a part fails, not about planning for more users.
    evidence:
      - "Scalability looks ahead: long-term capacity planning so a system can absorb more users or work by adding resources."
    takeaway: Scalability is planned, long-term growth by adding resources, unlike elasticity's automatic real-time changes.
    history: []
    verified:
      keyHash: 5138663bae1b
      fullHash: 2e7390d42010
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-gr9qmt
    version: 1
    status: live
    type: single
    pool: exam
    concept: elasticity
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 3
    stem: >-
      A ticketing website sees traffic surge for a short time whenever seats for a popular show go on sale, then fall back.
      The company wants capacity to grow during each rush and shrink right after it, with no staff stepping in.
      Which benefit of the AWS Cloud is this?
    options:
      - id: a
        text: Elasticity
        correct: true
        why: Elasticity adds resources automatically when a rush starts and removes them when it ends, so each moment costs only what it needs.
      - id: b
        text: Scalability
        why: Scalability is long-term planning for growth, not automatic adjustment during each short sales rush.
      - id: c
        text: Global reach
        why: Global reach is about serving users in many places, not about following short bursts of demand.
      - id: d
        text: Economies of scale
        why: Economies of scale lower prices through AWS's size and do not grow or shrink the site's capacity.
    evidence:
      - "Elasticity reacts in the moment: resources scale out automatically when demand spikes and back in when it falls, so each moment costs only what it needs."
    takeaway: Automatic growth during a spike and shrinkage right after it is elasticity, not long-term scalability.
    history: []
    verified:
      keyHash: 22227fcdeb92
      fullHash: 2f1789c1e3ff
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-4wt1y9
    version: 1
    status: live
    type: single
    pool: exam
    concept: horizontal-scaling
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 3
    stem: >-
      A bike rental shop's booking site runs on one Amazon EC2 instance and slows down on sunny weekends, when many riders book at the same moment.
      A more powerful server would leave each single booking just as slow as before.
      Which approach lets the site serve more riders at once?
    options:
      - id: a
        text: Scaling out
        correct: true
        why: Scaling out adds instances that handle bookings in parallel, so many riders are served at the same time.
      - id: b
        text: Scaling up
        why: Scaling up gives the one instance more power, and a faster server would not finish any booking sooner.
      - id: c
        text: Scaling in
        why: Scaling in removes surplus instances after a rush, which would lower capacity during the busy weekends.
      - id: d
        text: Load balancing
        why: Load balancing only spreads requests over existing instances, and with one instance there is nothing to spread over.
    evidence:
      - "**Scaling out (horizontal)**: more instances share the work in parallel."
      - "More customers arrive, but a bigger server cannot serve any one faster: scale out."
    takeaway: When many users arrive at once, scaling out adds parallel capacity that a bigger single server cannot.
    history: []
