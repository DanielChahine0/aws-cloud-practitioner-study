    concept: multi-tenancy
    note: m02/introduction-to-amazon-ec2
    task: "2.1"
    level: 2
    stem: >-
      An accounting firm learns that its Amazon EC2 instances share a physical host with other customers' instances.
      Under the AWS shared responsibility model, how are the tenants on that host kept isolated from one another?
    options:
      - id: a
        text: AWS isolates them through the hypervisor it runs on the host
        correct: true
        why: AWS manages the hypervisor that shares the host while isolating each tenant, so isolation is AWS's duty.
      - id: b
        text: AWS isolates them by keeping each in its own Availability Zone
        why: Tenants that share one host sit in the same zone, so zones cannot be what keeps them apart.
      - id: c
        text: The firm isolates them through the security groups it configures
        why: The firm's security groups filter traffic to its own instances, but they do not separate tenants on a host.
      - id: d
        text: The firm isolates them through the guest OS that it patches
        why: The guest OS runs inside one instance, so patching it cannot keep other tenants on the host apart.
    evidence:
      - "Many EC2 instances, which are virtual machines (VMs), share one physical host: multi-tenancy."
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
    takeaway: In multi-tenancy, AWS keeps the customers' instances that share a host isolated, so tenant isolation is AWS's responsibility.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 4 is the only accurate account of how instances on a shared host are isolated.)"
