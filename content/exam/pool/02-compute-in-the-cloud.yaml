      - id: d
        text: Spread instances over several Availability Zones for availability
        why: Spreading over zones keeps the app up, but it does not trim the size or cost of any instance.
    evidence:
      - Bigger sizes cost more, so pick the smallest that performs well and switch later if needed.
    takeaway: Rightsizing starts at the smallest instance size that performs well, since the size can change later.
