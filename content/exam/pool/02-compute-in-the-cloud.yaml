  - id: q-ns52vg
    version: 1
    status: live
    type: single
    pool: exam
    concept: loose-coupling
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    stem: >-
      An online florist's checkout service hands each order straight to its receipt service, so whenever the receipt service crashes, checkouts fail as well.
      The team places a message queue between the two services.
      What does this change give the florist?
    options:
      - id: a
        text: Orders are held until the receipt service is able to take them
        correct: true
        why: The queue keeps each order while the receipt service is down, so checkout keeps sending and no longer fails with it.
      - id: b
        text: Receipt requests are spread across several healthy receipt instances
        why: Spreading requests across healthy instances is what Elastic Load Balancing does, and a queue adds no such routing.
      - id: c
        text: More receipt instances start up automatically as orders pile up
        why: Starting instances as demand grows is Amazon EC2 Auto Scaling, which the florist did not add with the queue.
      - id: d
        text: Buyers are sent a text message and an email when a receipt is ready
        why: Texting and emailing buyers is a fan-out by Amazon SNS, while a queue only holds messages for a consumer to read.
    evidence:
      - "**Loosely coupled**: a message queue sits between them, so A keeps sending while B is down and messages wait until B handles them."
      - Loose coupling contains failures instead of letting them cascade, and it is the target for AWS architectures.
    takeaway: A queue between components loosely couples them, so one component's failure no longer cascades into the component that calls it.
