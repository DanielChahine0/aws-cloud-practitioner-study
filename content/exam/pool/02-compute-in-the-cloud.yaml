        why: Matching events to rules that choose targets describes Amazon EventBridge, not the plain fan-out of SNS to its subscribers.
    evidence:
      - "SNS is publish-subscribe: publishers send a message to a topic, and subscribers such as web servers, email addresses and Lambda functions receive it."
      - Amazon SNS pushes each message to topic subscribers immediately, including people by push, SMS and email.
    takeaway: In publish-subscribe, a sender publishes once to an SNS topic and every subscriber of that topic gets the message immediately.
