questions:
  - id: q-fpj00r
    version: 1
    status: live
    type: multi
    pool: exam
    concept: compute-as-a-service
    note: m02/introduction-to-amazon-ec2
    task: "1.1"
    level: 2
    select: 2
    stem: >-
      A small online bookstore is weighing a purchase of its own servers against renting virtual servers on Amazon EC2.
      Its owner worries about waiting weeks for hardware and about paying for spare machines after the holiday rush ends.
      Which traits of renting compute as a service address these two worries?
    options:
      - id: a
        text: Instances can be running within minutes of a request
        correct: true
        why: AWS keeps capacity running, so the bookstore no longer waits weeks for hardware to arrive and be installed.
      - id: b
        text: Unneeded instances can be released when demand drops
        correct: true
        why: The bookstore is never locked into machines it no longer needs once the holiday rush is over.
      - id: c
        text: Each instance runs an operating system the customer picks
        why: Choosing the operating system is true of EC2, but it does nothing about hardware waits or spare machines.
      - id: d
        text: The hypervisor on each physical host is managed by AWS
        why: AWS does run the hypervisor, but that neither shortens hardware waits nor removes spare machines.
      - id: e
        text: Instance types offer different mixes of CPU and memory
        why: Instance types do vary, but choosing among them does not address either of the owner's worries.
    evidence:
      - AWS keeps huge capacity running, so instances are usable within minutes.
      - Usage can swing widely, and you are never locked into servers you no longer need.
    takeaway: Renting servers as a service gives fast provisioning and lets a business drop capacity it no longer needs.
    history: []
    verified:
      keyHash: 249a72096386
      fullHash: ef4739f63e75
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-m7e3n0
    version: 1
    status: live
    type: single
    pool: exam
    concept: on-premises-vs-cloud
    note: m02/introduction-to-amazon-ec2
    task: "1.1"
    level: 2
    stem: >-
      A regional clinic plans to open a new patient portal next month.
      Its IT lead warns that physical servers would take weeks to arrive and be installed.
      Which benefit of running the portal on Amazon EC2 answers this concern most directly?
    options:
      - id: a
        text: Speed of deployment, since instances can be running within minutes
        correct: true
        why: Launching instances in minutes removes the delivery and installation wait the IT lead is worried about.
      - id: b
        text: Global reach, since the portal can serve patients in other countries
        why: Reaching other countries does not shorten the wait for servers before next month's opening.
      - id: c
        text: High availability, since instances can run in several Availability Zones
        why: Spreading instances across zones keeps the portal up, but the concern here is how long servers take to arrive.
      - id: d
        text: Elasticity, since the portal's capacity can shrink during quiet nights
        why: Shrinking capacity at night trims cost later, but it does nothing about the hardware delivery delay.
    evidence:
      - Owning means upfront purchases, delivery waits, installation and fixed capacity.
      - AWS keeps huge capacity running, so instances are usable within minutes.
    takeaway: Launching EC2 instances in minutes removes the purchase, delivery and installation delays of physical servers.
    history: []
