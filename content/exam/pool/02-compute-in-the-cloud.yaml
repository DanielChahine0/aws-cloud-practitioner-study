      Which benefit of this move addresses that incident?
    options:
      - id: a
        text: Each part can crash while the other parts keep serving
        correct: true
        why: Microservices loosely couple the site's parts, so a comment fault stays contained while search and recipes keep working.
      - id: b
        text: Each part can scale on its own as its own load changes
        why: Scaling parts separately is a real gain of microservices, but it would not have kept the site up during the comment fault.
      - id: c
        text: Each part can be updated without redeploying the rest
        why: Shipping one part's changes alone adds flexibility, but it does nothing to stop a comment fault from spreading to search.
