  - id: q-4gb228
    version: 1
    status: live
    type: multi
    pool: exam
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "2.1"
    level: 2
    select: 2
    stem: >-
      A dental practice runs its scheduling software on Amazon EC2 and uses no other AWS service.
      Under the AWS shared responsibility model, which tasks does AWS take on in this setup?
    options:
      - id: a
        text: Maintaining the physical hosts that the instances run on
        correct: true
        why: The physical hosts belong to AWS, which runs and maintains them for every EC2 customer.
      - id: b
        text: Running the hypervisor that keeps instances on a host apart
        correct: true
        why: AWS manages the hypervisor and the isolation it gives, so the practice has no duty for it.
      - id: c
        text: Choosing the operating system and software for the instances
        why: On EC2 the practice picks the operating system and fully controls the software, so this duty stays with it.
      - id: d
        text: Deciding which requests are allowed to reach the instances
        why: The practice decides what traffic gets in and whether access is public or private, so AWS does not.
      - id: e
        text: Patching the database engine behind an Amazon RDS instance
        why: AWS does patch Amazon RDS engines, but the practice runs no RDS database, so this is not part of its setup.
    evidence:
      - You choose the OS (Windows or Linux, across up to thousands of instances), fully control the software, and decide which requests get in and whether access is public or private.
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
    takeaway: On EC2, AWS manages the physical hosts and the hypervisor, while the customer controls the OS, software and access rules.
    history: []
    verified:
      keyHash: 1fc632f072cb
      fullHash: e37b616401c2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
