      - id: c
        text: Fault tolerance
        why: Fault tolerance keeps a system running through failures, which is unrelated to getting storage quickly.
      - id: d
        text: Co-location hosting
        why: Co-location means placing your own servers in a shared facility, which still needs a hardware order.
    evidence:
      - "On-demand delivery: resources within seconds, whenever needed."
      - "On-demand delivery: resources in seconds, scaled up or down without long setup, the idea AWS began with."
    takeaway: On-demand delivery means IT resources arrive within seconds of a request, with no hardware buying cycle.
