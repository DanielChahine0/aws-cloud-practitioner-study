      - id: b
        text: AWS stops billing for a server as soon as it is deprovisioned
        correct: true
        why: Billing stops as soon as a server is deprovisioned, so the firm pays nothing for servers it no longer runs.
      - id: c
        text: AWS takes over the racking, powering and cooling of the servers
        why: AWS does run the physical layer, but that is true whether the firm keeps its servers or releases them.
      - id: d
        text: AWS lets the firm run its servers in a Region close to its clients
        why: A nearby Region cuts delay for clients, but it has no effect on what the firm pays in the quiet months.
    evidence:
      - "You provision resources when demand appears and deprovision them as fast when it fades, by hand or automatically through configuration."
      - "Billing for a resource ends the moment it is deprovisioned."
    takeaway: Provisioning for a peak and deprovisioning afterwards keeps costs low, because billing stops as soon as a resource is released.
