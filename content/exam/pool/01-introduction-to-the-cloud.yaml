  - id: q-127xhr
    version: 1
    status: retired
    type: multi
    pool: exam
    concept: high-availability
    note: m01/introduction-to-aws-global-infrastructure
    task: "1.1"
    level: 2
    select: 2
    stem: >-
      A regional clinic's appointment system must keep working with little downtime when a server or a whole data center fails.
      Which actions support high availability for this system?
    options:
      - id: a
        text: Keep the system in one data center with strong physical security
        why: However secure one data center is, its outage would still stop the system, so it gives no protection from that failure.
      - id: b
        text: Run the application in more than one Availability Zone
        correct: true
        why: Copies in other AZs can take over when one fails, so patients see little or no downtime.
      - id: c
        text: Restore the system by hand from a nightly backup after an outage
        why: A manual restore leaves patients without the system until it finishes, which is long downtime rather than minimal downtime.
      - id: d
        text: Keep a standby copy ready to take over if the main one fails
        correct: true
        why: A standby that takes over when the main component fails is what keeps downtime minimal.
      - id: e
        text: Host the system in the Region nearest to most of its patients
        why: A nearby Region cuts delay for patients, but on its own it does not keep the system up when a data center fails.
    evidence:
      - "Spread resources and replicate data across several AZs so one AZ's outage does not stop applications."
      - "High availability: minimal downtime, because a standby takes over when one component fails."
    takeaway: High availability comes from spreading resources and data across several AZs so one failure causes little downtime.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Options 4 and 5 are the only two about redundancy and failover, forming the one coherent pair.)"
