questions:
  - id: q-s8v4v8
    version: 1
    status: live
    type: single
    pool: exam
    concept: cloud-computing-definition
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      A city library's staff open its catalog servers and file storage from any branch, or from home, through a web browser, with no equipment kept in each building.
      Which part of the AWS definition of cloud computing does this way of reaching the resources reflect?
    options:
      - id: a
        text: On-demand delivery
        why: On-demand delivery is about getting resources within seconds, while the library's need is reaching them from any place.
      - id: b
        text: IT resources
        why: IT resources names what is delivered, such as servers and storage, rather than the way staff reach them.
      - id: c
        text: Over the internet
        correct: true
        why: Using servers and storage remotely through web-based access, from any location, is the over the internet part.
      - id: d
        text: Pay-as-you-go pricing
        why: Pay-as-you-go pricing covers how the library is billed, which says nothing about how staff reach the resources.
    evidence:
      - "Cloud computing: IT resources, on demand, over the internet, billed pay-as-you-go."
      - "Over the internet: remote use through web-based services, not local hardware, from anywhere."
    takeaway: In the cloud computing definition, over the internet means resources are used remotely through web services rather than local hardware.
    history: []
    verified:
      keyHash: c88b61e07e0b
      fullHash: 90550ccf1360
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
