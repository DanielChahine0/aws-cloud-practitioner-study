      - id: c
        text: A cost that rises and falls with the resources consumed
        correct: true
        why: A variable expense follows consumption, which is how an AWS bill behaves from month to month.
      - id: d
        text: A cost agreed in exchange for committing to a long term
        why: A long-term commitment locks in spending ahead of time, rather than letting it follow actual use.
    evidence:
      - "Fixed costs are paid up front for data centers and servers whether or not you use them, while variable costs on AWS follow only what you actually consume."
      - "Variable expense: a cost that follows consumption, like an AWS bill."
    takeaway: A variable expense follows consumption, as an AWS bill does, while a fixed expense stays the same whatever the usage.
