  - id: q-h8ep9a
    version: 1
    status: live
    type: multi
    pool: exam
    concept: benefits-of-the-aws-cloud
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 2
    select: 2
    stem: >-
      A meal-kit delivery startup wants to avoid a large upfront hardware purchase, and it has no reliable way to tell how many orders it will get next year.
      Which benefits of the AWS Cloud address these two concerns?
    options:
      - id: a
        text: Trade fixed expense for variable expense
        correct: true
        why: Paying each month for what is used, instead of buying hardware upfront, is the trade fixed expense for variable expense benefit.
      - id: b
        text: Benefit from massive economies of scale
        why: Economies of scale lower unit prices through bulk buying, which neither removes the upfront purchase nor answers the unknown order volume.
      - id: c
        text: Stop guessing capacity
        correct: true
        why: Provisioning for today and scaling with real demand means the startup need not predict next year's order volume.
      - id: d
        text: Increase speed and agility
        why: Speed and agility is about quick, disposable test environments, which addresses neither the upfront purchase nor the unknown demand.
      - id: e
        text: Go global in minutes
        why: Going global is about deploying near users in other countries, which touches neither the upfront cost nor the order forecast.
    evidence:
      - "On AWS, spending follows usage and capacity follows demand."
      - "On AWS the bill follows monthly usage, so you start small, spending matches consumption for more financial flexibility, and billing and budgeting tools help you save."
      - "On AWS you provision for today and scale with real demand in minutes, not weeks or months, keeping performance optimal without over- or under-provisioning."
    takeaway: Avoiding upfront hardware spend and coping with unknown demand point to the variable expense and stop guessing capacity benefits.
    history: []
    verified:
      keyHash: 9bb5360e805b
      fullHash: 70240af24a2d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
