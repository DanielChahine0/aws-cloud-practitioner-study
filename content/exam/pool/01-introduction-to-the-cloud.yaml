  - id: q-rrfr87
    version: 1
    status: live
    type: single
    pool: exam
    concept: data-center
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      A small engineering startup needs its servers in a building with redundant power, cooling and security.
      It has no staff to build such a facility or keep it running.
      How does the AWS Cloud meet this need?
    options:
      - id: a
        text: It lets the startup cache copies of popular content at sites close to its users
        why: Edge locations speed up delivery to users, but they give the startup no facility to house its servers.
      - id: b
        text: It lets the startup pick the geographic area where its customers are concentrated
        why: Choosing a Region near customers cuts delay, but on its own it says nothing about who runs the facility.
      - id: c
        text: It lets the startup use AWS data centers that it neither owns nor maintains
        correct: true
        why: AWS runs the server buildings with their power, cooling and security, so the startup uses them without upkeep.
      - id: d
        text: It lets the startup define a private virtual network inside its own account
        why: A virtual network organizes resources in software, but it does not supply or run the physical facility.
    evidence:
      - "Data center: a server building with redundant power, cooling and security."
      - "Firms once ran their own or co-located, but AWS lets them use data centers they do not own, trading upkeep and repetitive chores for innovation."
    takeaway: A benefit of the AWS Cloud is using data centers with redundant power, cooling and security without owning or maintaining them.
