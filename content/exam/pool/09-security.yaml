questions:
  - id: q-v2kmh0
    version: 1
    status: live
    type: single
    pool: exam
    concept: authentication
    note: m09/introduction-to-security-on-aws
    task: "2.2"
    level: 2
    stem: "A bike rental shop's staff app asks each employee for a username and password before it shows anything. Which security idea does that check carry out?"
    options:
      - id: a
        text: "Authentication"
        correct: true
        why: "The password check confirms who the employee is, which is the job of authentication before any rights apply."
      - id: b
        text: "Authorization"
        why: "Authorization comes after sign-in and limits what a known employee may do, so it is a later step than this check."
      - id: c
        text: "Encryption at rest"
        why: "Encryption at rest scrambles stored data and plays no part in confirming who is signing in."
      - id: d
        text: "Log auditing"
        why: "Log auditing reviews records of past activity rather than checking a person's credentials at sign-in."
    evidence:
      - "Authentication checks credentials, like a username and password, to prove identity."
    takeaway: "Checking credentials such as a password to confirm who someone is counts as authentication."
    history: []
    verified:
      keyHash: 0bc91517c99f
      fullHash: d78901a362c5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-zgfxd3
    version: 1
    status: live
    type: single
    pool: exam
    concept: authorization
    note: m09/introduction-to-security-on-aws
    task: "2.2"
    level: 2
    stem: "A regional clinic must keep each patient's lab results private to meet its privacy duties. Once a patient has signed in, the portal shows only that patient's own results. Which core security concept does that second step apply?"
    options:
      - id: a
        text: "Authentication"
        why: "Authentication already happened at sign-in; it proves who the patient is but sets no limit on what they open."
      - id: b
        text: "Authorization"
        correct: true
        why: "Authorization applies the rights granted to a known identity, so it keeps each patient to their own results."
      - id: c
        text: "Encryption in transit"
        why: "Encryption in transit protects results while they cross the network, but it does not decide who may view them."
      - id: d
        text: "Log auditing"
        why: "Auditing reviews records of past activity afterward, so it does not decide which results a patient may open now."
    evidence:
      - "Authorization then uses granted rights to limit that identity's actions."
      - "Both guard users' personal data, keeping trust and blocking identity theft, fraud and misuse."
    takeaway: "Once identity is proven, authorization decides which actions and data that identity may reach."
    history: []
    verified:
      keyHash: c428051ce34a
      fullHash: 06b92f0d4d81
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-52kd7e
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-security-controls
    note: m09/introduction-to-security-on-aws
    task: "2.2"
    level: 1
    stem: "AWS groups its security controls by the goal each one serves. Which set names those goals?"
    options:
      - id: a
        text: "Prevent, protect, and detect and respond"
        correct: true
        why: "The controls stop incidents through access management, shield networks, apps and data, and catch and handle incidents that occur."
      - id: b
        text: "Plan, build, and test and deploy"
        why: "These are stages of shipping software, which describe a delivery process rather than the aims of security controls."
      - id: c
        text: "Encrypt, archive, and back up and restore"
        why: "Encryption and backups are individual protections, so this list mixes tools with tasks instead of naming control goals."
      - id: d
        text: "Monitor, alert, and scale and recover"
        why: "Monitoring and scaling are operational tasks for health and capacity, not the goals AWS sets for its security controls."
    evidence:
      - "Controls prevent incidents by access management, protect networks, apps and data, and detect and respond to incidents."
    takeaway: "AWS security controls serve three goals: prevent incidents, protect resources, and detect and respond to incidents."
