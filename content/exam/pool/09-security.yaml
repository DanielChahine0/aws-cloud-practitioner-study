  - id: q-q9hrgk
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: aws-shield-standard
    note: m09/protecting-networks-and-applications
    task: "2.2"
    level: 2
    stem: "A small travel agency serves its booking site through Amazon CloudFront. It pays for no security subscriptions and has written no firewall rules of its own. Which statements describe the protection the site already has?"
    options:
      - id: a
        text: "AWS Shield Standard comes at no extra charge"
        correct: true
        why: "Shield Standard is free, so the agency has it on its CloudFront site without paying for any subscription."
      - id: b
        text: "AWS Shield Standard works without any setup"
        correct: true
        why: "Shield Standard is automatic and built into CloudFront, so the agency's site is covered although its team configured nothing."
      - id: c
        text: "AWS Shield Advanced gives in-depth attack diagnostics"
        why: "Shield Advanced does offer in-depth diagnostics, but it is a paid tier, and the agency pays for no subscriptions."
      - id: d
        text: "AWS Shield Advanced mitigates sophisticated attacks"
        why: "Shield Advanced does handle sophisticated DDoS attacks, but only for customers who pay for it, which the agency does not."
      - id: e
        text: "AWS WAF refuses requests from IPs in a web ACL"
        why: "AWS WAF does block IP addresses listed in a web ACL, but the agency has written no such rules, so this is not in place."
    evidence:
      - "AWS Shield Standard: free, automatic, real-time defense against common DDoS attacks, built into ELB, CloudFront and Route 53."
      - "AWS Shield Advanced: paid, with in-depth diagnostics and detection and mitigation of sophisticated DDoS attacks, integrating with CloudFront, Route 53 and ELB."
    takeaway: "Shield Standard gives customers free, automatic DDoS defense on services such as CloudFront."
