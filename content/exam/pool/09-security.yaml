    concept: aws-kms
    note: m09/protecting-data
    task: "2.2"
    level: 3
    stem: "A law firm wants to generate the cryptographic material that locks and unlocks its case files, decide which IAM roles may use it, and switch it off for a while during an audit. Which service fits?"
    options:
      - id: a
        text: "AWS Key Management Service"
        correct: true
        why: "AWS KMS creates and controls cryptographic keys, lets the firm set who may use them, and can disable a key temporarily."
      - id: b
        text: "AWS Certificate Manager"
        why: "ACM manages SSL/TLS certificates for connections, not general-purpose keys that encrypt stored files."
      - id: c
        text: "AWS Secrets Manager"
        why: "Secrets Manager stores and rotates secrets such as passwords and API keys rather than creating encryption keys."
      - id: d
        text: "AWS Identity and Access Management"
        why: "IAM decides which identities may act in the account, but it does not generate or hold the keys that lock the files."
    evidence:
      - "AWS Key Management Service (AWS KMS): creates and controls cryptographic keys, the random digit strings that lock and unlock data."
      - "You set which IAM users and roles may manage keys and where they are used, keys never leave KMS, and a key can be disabled temporarily."
      - "ACM is for certificates, and AWS KMS for general-purpose encryption keys."
    takeaway: "Creating, controlling and temporarily disabling encryption keys is the job of AWS KMS."
    history: []
    verified:
      keyHash: 348cda0f829a
