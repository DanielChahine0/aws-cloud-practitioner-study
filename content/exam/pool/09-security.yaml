  - id: q-xbg1xd
    version: 1
    status: live
    type: single
    pool: exam
    concept: data-encryption
    note: m09/protecting-data
    task: "2.2"
    level: 1
    stem: "What does encrypting a set of data achieve?"
    options:
      - id: a
        text: "It can be read only by holders of the right key"
        correct: true
        why: "Encryption locks data so that only someone holding the correct key can unlock and read it."
      - id: b
        text: "It can never be turned back into readable form"
        why: "Data that can never be restored describes one-way hashing, while encrypted data can be decrypted with its key."
      - id: c
        text: "It is hidden by swapping values for stand-in tokens"
        why: "Swapping values for stand-ins is tokenization, which protects data without using encryption keys."
      - id: d
        text: "It is reachable only after a second sign-in factor"
        why: "A second sign-in factor guards access to an account and does nothing to make the data itself unreadable."
    evidence:
      - "Encryption is a lock: only holders of the right key can read data such as customers' phone and card details."
      - "Hashing and salting, used for stored passwords, are one-way and cannot be reversed."
      - "Tokenization and masking protect data without keys."
    takeaway: "Encryption makes data unreadable to anyone who lacks the key that unlocks it."
    history: []
    verified:
      keyHash: d2c60d5df68f
      fullHash: 6b060985617c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-4y3z97
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: encryption-at-rest
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: "An insurance broker keeps data in several AWS services and wants to know where AWS already encrypts the stored data at rest without any setup from its team. Which data is protected that way?"
    options:
      - id: a
        text: "Objects uploaded to an Amazon S3 bucket"
        correct: true
        why: "S3 sets up encryption on each new bucket, so every object the broker uploads is stored encrypted with no extra work."
      - id: b
        text: "Items stored in an Amazon DynamoDB table"
        correct: true
        why: "DynamoDB protects every table with KMS-managed keys on its side, so stored items are already encrypted for the broker."
      - id: c
        text: "Snapshots taken of an Amazon EBS volume"
        why: "EBS snapshots support encryption at rest, but the team has to choose it, so it is not already in place for them."
      - id: d
        text: "Files on an Amazon EC2 instance's boot volume"
        why: "An EC2 boot volume is an EBS volume, which the team has to choose to encrypt, so its files are not protected without setup."
      - id: e
        text: "Records in a database installed on Amazon EC2"
        why: "A database the broker installs on EC2 keeps its records on EBS volumes, which stay unencrypted until the team turns encryption on."
    evidence:
      - "Amazon S3: new buckets have encryption configured, and uploads are encrypted at rest automatically."
      - "Amazon DynamoDB: all table data is encrypted at rest server-side with AWS KMS keys."
      - "Amazon EBS: volumes and snapshots, boot and data volumes alike, can be encrypted at rest."
    takeaway: "S3 uploads and DynamoDB table data are encrypted at rest by default, while EBS encryption is an option to turn on."
    history: []
    verified:
      keyHash: b217c5845c40
      fullHash: ca7bed51e85e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-dgj69n
    version: 1
    status: live
    type: single
    pool: exam
    concept: encryption-in-transit
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: "A local newspaper's subscription page collects card details in a browser form and sends them to its payment backend. What keeps the card details protected on the way?"
    options:
      - id: a
        text: "An SSL/TLS-encrypted connection"
        correct: true
        why: "TLS verifies the server with a certificate and then encrypts the connection, which protects data while it travels."
      - id: b
        text: "A strong account password policy"
        why: "A password policy strengthens how users sign in, but it does not encrypt anything moving across the network."
      - id: c
        text: "Multi-factor authentication on sign-in"
        why: "An extra sign-in factor protects account access and leaves the traffic itself unencrypted."
      - id: d
        text: "A hashed and salted copy of the number"
        why: "Hashing is one-way, so the backend could never recover the card details it needs to charge."
    evidence:
      - "SSL and its successor TLS use certificates to verify identity, then encrypt the connection."
      - "MFA and strong passwords protect access, not data in transit."
    takeaway: "Data moving between a browser and a server is protected in transit by an SSL/TLS-encrypted connection."
    history: []
    verified:
      keyHash: bf0aa7de0461
      fullHash: 9430e624cf61
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
