  - id: q-sek56h
    version: 1
    status: live
    type: single
    pool: exam
    concept: aws-iam
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: "A pet supply store creates a new IAM user for a stock clerk and attaches no policies to it yet. The clerk then tries to open an Amazon S3 bucket and is refused. Which IAM behavior explains the refusal?"
    options:
      - id: a
        text: "Default deny"
        correct: true
        why: "IAM refuses every action until a policy allows it, so a user with no policies cannot open any bucket."
      - id: b
        text: "Least privilege"
        why: "Least privilege guides what an admin chooses to allow; it is a principle, not the mechanism that refused this request."
      - id: c
        text: "A permission boundary"
        why: "A permission boundary caps the most an identity can hold, and none was set here, so it did not cause the refusal."
      - id: d
        text: "Role-based access control"
        why: "Role-based access control ties access to a person's job, which is a design choice and not what blocked the new user."
    evidence:
      - "Default deny is the mechanism: a new identity has zero permissions, not even to launch an EC2 instance or create an S3 bucket, until explicitly allowed."
      - "Not the same thing: a permission boundary caps the most permissions an identity can hold, and role-based access control ties access to a person's job in the organization."
    takeaway: "IAM denies by default, so a new identity can do nothing until a policy allows it."
    history: []
    verified:
      keyHash: 4d4f31e63440
      fullHash: 243d4361df86
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-v1at29
    version: 1
    status: live
    type: multi
    select: 2
    pool: exam
    concept: aws-account-root-user
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: "A furniture maker has just opened a new AWS account and signed in as the root user for the first time. Which steps protect that root user, as AWS advises?"
    options:
      - id: a
        text: "Give it a strong password"
        correct: true
        why: "AWS advises a strong password on the root user, since that identity can do anything in the account."
      - id: b
        text: "Turn on MFA for its sign-in"
        correct: true
        why: "Turning on MFA right after the first sign-in adds a second proof the root user must present."
      - id: c
        text: "Apply an account password policy"
        why: "Password policies set rules for IAM user passwords, but they never apply to the root user's password."
      - id: d
        text: "Attach a least-privilege policy"
        why: "The root user can do anything and cannot be restricted, so an attached policy would not protect or limit it."
      - id: e
        text: "Add it to a restricted IAM group"
        why: "Groups pass their permissions to IAM users, and the root user cannot be restricted that way, so this protects nothing."
    evidence:
      - "Give it a strong password and turn on multi-factor authentication (MFA) right after the first root login."
      - "Password policies set account-wide rules for IAM user passwords, such as minimum length, required character types, expiration and preventing reuse, but they never apply to the root user password."
      - "Every new AWS account comes with a root user, the owner, who can do anything and cannot be restricted."
    takeaway: "Protect the root user with a strong password and MFA, since policies, groups and password policies never restrict it."
    history: []
    verified:
      keyHash: 2881b1f77271
      fullHash: 6113df46afe4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-10
  - id: q-n3n8dx
    version: 1
    status: live
    type: single
    pool: exam
    concept: multi-factor-authentication
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: "Which access control requires a user to present a password plus a one-time code from a phone app at sign-in?"
    options:
      - id: a
        text: "Multi-factor authentication"
        correct: true
        why: "MFA asks for two or more kinds of proof, such as a password plus a one-time code from a phone app."
      - id: b
        text: "Account password policies"
        why: "A password policy sets rules such as minimum length for IAM user passwords, yet it still asks for one kind of proof."
      - id: c
        text: "Single sign-on through federation"
        why: "Single sign-on gives one login for many connected accounts, which reduces logins rather than adding a second proof."
      - id: d
        text: "Short-term credentials from a role"
        why: "Assuming a role grants temporary permissions and does not by itself make the user present a one-time code."
