    concept: amazon-elasticache-high-availability
    note: m07/in-memory-caching-services
    task: "3.2"
    level: 2
    stem: >-
      The cafe wants its Amazon ElastiCache cache to keep serving orders even if an outage takes down one of the isolated locations inside its Region.
      Which ElastiCache feature supports that?
    options:
      - id: a
        text: Larger nodes with more memory
        why: Bigger nodes add capacity, but they fail along with the location they sit in.
      - id: b
        text: Multi-AZ replication of nodes
        correct: true
        why: Placing the primary and its replicas in separate Availability Zones lets a replica take over when one zone fails.
      - id: c
        text: TLS encryption to the nodes
        why: TLS protects data in transit but does nothing to keep the cache running through a zone outage.
      - id: d
        text: Encryption at rest on the nodes
        why: Encrypting stored data protects it from being read, not from going offline in a zone outage.
    evidence:
      - Primary and replicas in separate AZs survive a zone outage
    takeaway: Multi-AZ replication places ElastiCache primary and replica nodes in different zones to survive a zone outage.
