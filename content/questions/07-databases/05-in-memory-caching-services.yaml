        why: Encryption at rest is true of ElastiCache, but it protects data rather than restoring a failed primary.
      - id: d
        text: Cache capacity can be resized with demand
        why: Resizing is true of ElastiCache, but it answers changing demand, not the loss of the primary node.
    evidence:
      - "**Replica node**: a copy promoted if the primary fails."
    takeaway: When an ElastiCache primary node fails, a replica is promoted and the failed node is replaced automatically.
