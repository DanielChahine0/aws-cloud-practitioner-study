  - id: q-spcgax
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-elasticache-high-availability
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 2
    stem: >-
      One machine in the cafe's Amazon ElastiCache cluster stops working during the lunch rush.
      Which actions does ElastiCache take to keep the cache available?
    options:
      - id: a
        text: It swaps in a fresh node in its place
        correct: true
        why: ElastiCache replaces the broken node with a new one, usually within minutes, so capacity comes back.
      - id: b
        text: It promotes a replica to primary
        correct: true
        why: When the failed node was the primary, a replica takes over its role so the cache keeps serving reads.
      - id: c
        text: It encrypts its backups at rest
        why: Encryption at rest protects stored data and backups, but it does nothing to bring a failed node back.
      - id: d
        text: It uses TLS for client traffic
        why: TLS protects data moving between the app and the cache, and it plays no part in recovering from a failure.
      - id: e
        text: It sends cache misses to RDS
        why: Reading the database on a miss is the app's caching logic, not how ElastiCache recovers a failed node.
    evidence:
