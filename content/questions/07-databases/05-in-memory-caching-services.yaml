questions:
  - id: q-cse1r3
    version: 1
    status: live
    type: single
    pool: practice
    concept: database-performance-bottlenecks
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe's online menu became popular, and its Amazon RDS database now slows down because thousands of visitors keep loading the same menu, which changes only once a season.
      Which change best relieves the database?
    options:
      - id: a
        text: Increase the storage allocated to the database
        why: More storage gives room for data but does not cut the flood of identical menu reads.
      - id: b
        text: Add a Multi-AZ standby for the database
        why: A standby waits to take over on failure and does not answer the repeated menu reads.
      - id: c
        text: Put a caching layer in front of the database
        correct: true
        why: Repeated reads of rarely changing data are what a cache absorbs, so the database stops answering the same query.
      - id: d
        text: Turn on Performance Insights for the database
        why: Performance Insights shows where the load comes from but does not take any reads off the database.
    evidence:
      - Read-heavy traffic for data that rarely changes is common, and a caching layer is one of the best remedies.
    takeaway: Heavy repeated reads of data that rarely changes are a classic case for adding a cache in front of the database.
    history: []
    verified:
      keyHash: a82630395546
      fullHash: 742b49786618
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-vv6me8
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: database-performance-bottlenecks
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 1
    stem: >-
      Which conditions commonly turn a relational database into a bottleneck as an application grows?
    options:
      - id: a
        text: A flood of read requests
        correct: true
        why: Growth sends far more reads to the database, and answering them all strains the back end.
      - id: b
        text: Heavy queries on large datasets
        correct: true
        why: Complex queries over big tables take a lot of work each time, which slows the database.
      - id: c
        text: A steady trickle of small writes
        why: A light, even stream of small writes is easy work and is not the growth pattern that bottlenecks a database.
      - id: d
        text: Rare reports on small tables
        why: Occasional queries over little data put almost no load on the database, so they do not slow it.
      - id: e
        text: Reads that a cache answers first
        why: Reads served from a cache never reach the database, so they take load off it rather than adding any.
    evidence:
      - Growth brings read floods and heavy queries on big datasets, bottlenecking relational back ends like Amazon RDS.
    takeaway: Read floods and heavy queries on big datasets are what usually slow a growing relational database.
    history: []
    verified:
      keyHash: 38a5fda4a57f
      fullHash: a01edc494401
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1q7mfh
    version: 1
    status: live
    type: single
    pool: practice
    concept: in-memory-caching
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 1
    stem: >-
      What mainly makes Amazon ElastiCache answer reads so much faster than a disk-based database?
    options:
      - id: a
        text: It keeps the hot data in RAM
        correct: true
        why: Memory is read far faster than disk, so keeping frequently used data in RAM cuts latency.
      - id: b
        text: It uses faster solid state disks
        why: Even fast disks are still disks, so they would not give the cache its memory speed.
      - id: c
        text: It serves copies from edge locations
        why: Edge locations belong to a content delivery network, not to what makes the cache fast.
      - id: d
        text: It spreads reads over replica databases
        why: Spreading reads over database copies is what read replicas do, not the source of the cache's speed.
    evidence:
      - A cache keeps hot data in RAM, which reads hundreds to thousands of times faster than disk.
    takeaway: An in-memory cache is fast because it serves frequently used data from RAM instead of disk.
    history: []
    verified:
      keyHash: eab7e931b360
      fullHash: c21dfba09d2c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-5a4qmz
    version: 1
    status: live
    type: single
    pool: practice
    concept: in-memory-caching
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 2
    stem: >-
      A cafe developer suggests dropping the Amazon RDS database and keeping all order records only in an in-memory cache, since the cache is faster.
      Why is this a poor plan?
    options:
      - id: a
        text: A cache does not scale the database's storage
        why: This is true, but with the database dropped there is no database storage left to scale, so it is not the problem.
      - id: b
        text: A cache lacks lasting storage and rich queries
        correct: true
        why: Order records need durable storage and flexible queries, which a cache does not provide, so it can only sit beside the database.
      - id: c
        text: A cache is not meant for storing secrets
        why: This is true, but order records are not secrets, so it gives no reason against the plan.
      - id: d
        text: A cache may need resizing as demand shifts
        why: This is true of a node-based cache, but resizing is routine upkeep and not why the database must stay.
    evidence:
      - Lacking a database's lasting storage and rich queries, a cache complements the database, never replaces it.
    takeaway: A cache complements a database for fast repeat reads but never replaces its durable storage and queries.
    history: []
    verified:
      keyHash: 52008236bf1a
      fullHash: e76176afeb48
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-vxdn07
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-elasticache
    note: m07/in-memory-caching-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's loyalty app keeps reading the same session data, and the team wants a fully managed in-memory store that works with its existing Redis OSS tools.
      Which service fits?
    options:
      - id: a
        text: DynamoDB Accelerator (DAX)
        why: DAX is an in-memory layer built only for DynamoDB, so it does not work with the team's Redis OSS tools.
      - id: b
        text: Amazon RDS read replicas
        why: Read replicas are disk-based copies of a relational database, not an in-memory store that speaks Redis OSS.
      - id: c
        text: Amazon DynamoDB
        why: DynamoDB is a serverless NoSQL database for lasting data, not a Redis OSS compatible in-memory store.
      - id: d
        text: Amazon ElastiCache
        correct: true
        why: ElastiCache is the managed in-memory service that supports Redis OSS, so the existing tools keep working.
    evidence:
      - Fully managed caching compatible with Redis OSS, Valkey and Memcached, so existing tools keep working.
      - "Use cases: session data, faster queries, game leaderboards."
    takeaway: A managed in-memory store compatible with Redis OSS, Valkey or Memcached points to Amazon ElastiCache.
