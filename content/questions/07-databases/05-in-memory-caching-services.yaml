      Read traffic to the cafe's in-memory data store swings without warning between quiet afternoons and sudden promotions, and the team wants capacity to follow demand by itself rather than adding or removing nodes by hand.
      Which option fits?
    options:
      - id: a
        text: Amazon ElastiCache Serverless
        correct: true
        why: The serverless option scales the in-memory store with demand by itself, so no one resizes nodes.
      - id: b
        text: DynamoDB Accelerator (DAX)
        why: DAX is an in-memory layer for DynamoDB only, and it is not the option that scales itself with no nodes to manage.
      - id: c
        text: Amazon RDS read replicas
        why: Read replicas are extra database copies that someone must add, not in-memory capacity that follows demand.
      - id: d
        text: Amazon DynamoDB auto scaling
        why: DynamoDB auto scaling adjusts a NoSQL table's throughput, not the capacity of an in-memory store.
    evidence:
      - You resize the cache with demand, or let the serverless option scale itself, while AWS runs the infrastructure.
    takeaway: When cache demand is unpredictable and no one wants to manage nodes, ElastiCache Serverless scales itself.
