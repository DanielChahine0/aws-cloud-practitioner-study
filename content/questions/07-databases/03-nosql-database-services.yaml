    type: match
    pool: practice
    concept: key-value-data-model
    note: m07/nosql-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe stores each loyalty member in a key-value table.
      Match each part of the table to what it holds for the cafe.
    pairs:
      - left: Key
        right: The member ID that picks out one member's record
        why: The unique key names a single item, so the member ID is what finds that member.
      - left: Attribute
        right: A name and value such as favorite drink set to oat latte
        why: Attributes are name-value pairs that carry the details stored for an item.
      - left: Item
        right: One member's whole record with all of its details
        why: An item is one record, made up of its key and the attributes that belong to it.
    evidence:
      - "**Key-value pair**: a unique key plus an item's attributes."
      - "**Item and attribute**: a DynamoDB record and its name-value pairs, with values such as numbers, sets or documents."
    takeaway: A key-value table holds items, each named by a unique key and described by name-value attributes.
