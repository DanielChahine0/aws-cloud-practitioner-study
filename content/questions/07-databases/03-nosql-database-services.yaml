    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-auto-scaling
    note: m07/nosql-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's NoSQL orders table uses provisioned capacity, and traffic jumps during promotions and drops at night.
      Which option keeps the table's throughput matched to real use?
    options:
      - id: a
        text: Amazon EC2 Auto Scaling
        why: EC2 Auto Scaling adds and removes EC2 instances, not the throughput of a DynamoDB table.
      - id: b
        text: Amazon DynamoDB auto scaling
        correct: true
        why: DynamoDB auto scaling moves provisioned throughput toward a target use, steady at peaks and cheaper when quiet.
      - id: c
        text: Amazon DynamoDB global tables
        why: Global tables copy a table to other Regions for worldwide users and do not adjust its provisioned throughput.
      - id: d
        text: DynamoDB Accelerator (DAX)
        why: DAX caches frequent reads in memory, which eases load but leaves the table's provisioned throughput fixed.
    evidence:
      - "**Auto scaling with provisioned capacity**: throughput automatically follows real use toward your target utilization, steady at peaks, cheaper when quiet."
    takeaway: Unpredictable traffic on a provisioned DynamoDB table points to DynamoDB auto scaling, not EC2 Auto Scaling.
