    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      What problem does DynamoDB auto scaling solve compared with setting read and write capacity by hand?
    options:
      - id: a
        text: Waste when quiet and slowdowns at peaks
        correct: true
        why: Hand-set capacity is either wasted when quiet or too small at peaks, and auto scaling avoids both.
      - id: b
        text: Lost data when one storage facility goes down
        why: Keeping copies in several facilities protects against an outage, which is not a capacity problem.
      - id: c
        text: Slow answers for app users in faraway countries
        why: Serving a table to users worldwide is the job of global tables, not of auto scaling.
      - id: d
        text: Exposed data while it moves across the network
        why: DynamoDB encrypts data in transit automatically, which has nothing to do with capacity.
    evidence:
      - Auto scaling avoids the waste or slow peaks of hand-set read/write capacity.
    takeaway: DynamoDB auto scaling avoids both wasted capacity and slow peaks that come with hand-set read and write capacity.
