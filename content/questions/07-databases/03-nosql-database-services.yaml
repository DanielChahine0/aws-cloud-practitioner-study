  - id: q-wnq3cs
    version: 1
    status: live
    type: single
    pool: practice
    concept: flexible-schema
    note: m07/nosql-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe keeps loyalty members in a DynamoDB table and starts saving birthdays for the members who share one.
      A relational table would need a new birthday column on every row.
      What does the flexible schema of the cafe's table do instead?
    options:
      - id: a
        text: Items are still found through an indexed primary key
        why: The primary key stays indexed whatever the schema, so this is not what takes the place of a new column.
      - id: b
        text: Items are spread over many servers and SSDs
        why: Spreading data over many servers is how DynamoDB stores data at scale, not how it takes on a new field.
      - id: c
        text: Items gain an attribute only where one is written
        correct: true
        why: Items can differ in attributes, so only the members who share a birthday gain one and no row-wide column appears.
      - id: d
        text: Items are encrypted at rest and in transit
        why: Encryption protects every item at rest and in transit, which has nothing to do with how birthdays are added.
    evidence:
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
      - Relational databases (MySQL, say), long the default, need a set schema and SQL.
    takeaway: With a flexible schema an attribute can be added to some items only, leaving the rest untouched.
    history: []
    verified:
      keyHash: 7e45b20657e6
      fullHash: b8c393496c21
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
