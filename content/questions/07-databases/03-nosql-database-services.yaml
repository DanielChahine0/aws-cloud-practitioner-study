  - id: q-wnq3cs
    version: 1
    status: draft
    type: single
    pool: practice
    concept: flexible-schema
    note: m07/nosql-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe keeps loyalty members in a NoSQL table with a flexible schema and starts saving birthdays for the members who share one.
      Which items end up holding a birthday attribute?
    options:
      - id: a
        text: Every member item, with blanks for the rest
        why: A flexible schema has no shared column list, so items without a birthday never gain an empty one.
      - id: b
        text: Only the items of members who shared one
        correct: true
        why: Items can differ in attributes, so only the members who share a birthday gain that attribute.
      - id: c
        text: Only the items created after the change
        why: Older members who share a birthday gain it too, and newer members who skip it never do.
      - id: d
        text: None until the table design is altered
        why: A flexible schema needs no table-wide change, so an attribute can be added to single items right away.
    evidence:
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
    takeaway: With a flexible schema an attribute can be added to some items only, leaving the rest untouched.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 2 is the only true DynamoDB behavior; option 3 describes a relational table.)"
  - id: q-hr3kg3
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: flexible-schema
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      Which statements describe what a flexible schema allows in a NoSQL table?
    options:
      - id: a
        text: Items in one table can hold different attributes
        correct: true
        why: A flexible schema lets each item carry its own set of attributes within the same table.
      - id: b
        text: The primary key is still indexed by default
        why: This is true of NoSQL, but it holds whatever the schema and is not what flexibility allows.
      - id: c
        text: Adding an attribute needs no table-wide redesign
        correct: true
        why: Attributes come and go freely on each item, so a new one never forces the table to be redesigned.
      - id: d
        text: Every item follows one shared column layout
        why: A shared column layout is the rigid schema of a relational table, the opposite of a flexible one.
      - id: e
        text: Records are linked across tables by SQL joins
        why: Joining tables with SQL belongs to the relational model and is not something a flexible schema adds.
    evidence:
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
      - The core difference is flexible versus rigid schema, not speed or scaling, and NoSQL still indexes the primary key by default.
    takeaway: A flexible schema lets items in one table differ in attributes and change them freely over time.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Options 1 and 2 both describe a flexible schema, while 3 is a hedged caveat with 'still' and 4 and 5 describe relational tables.)"
  - id: q-fqvcnk
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb
    note: m07/nosql-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's ordering app needs a serverless key-value database as its main data store, with single-digit millisecond responses and no maintenance windows.
      Which service fits?
    options:
      - id: a
        text: Amazon RDS
        why: RDS runs relational engines with a set schema and has maintenance windows for patching.
      - id: b
        text: Amazon ElastiCache
        why: ElastiCache is an in-memory cache that sits in front of a database rather than serving as the main store.
      - id: c
        text: Amazon Aurora
        why: Aurora is a relational database compatible with MySQL and PostgreSQL, not a key-value store.
      - id: d
        text: Amazon DynamoDB
        correct: true
        why: DynamoDB is a serverless NoSQL key-value database with single-digit millisecond latency and no maintenance windows.
    evidence:
      - Fully managed, serverless NoSQL for key-value and document data.
      - Single-digit millisecond latency at any scale, with no patching, upgrades, maintenance windows, downtime or cold starts.
    takeaway: A serverless key-value store with single-digit millisecond speed and no upkeep points to Amazon DynamoDB.
    history: []
    verified:
      keyHash: e232d3b893be
      fullHash: d5cdd2e3dc38
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bsrbjs
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-dynamodb
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      The cafe stores its order history in Amazon DynamoDB.
      Which DynamoDB features protect that data or keep it available?
    options:
      - id: a
        text: It encrypts data at rest and in transit
        correct: true
        why: DynamoDB encrypts data both at rest and in transit by default, which protects the order history.
      - id: b
        text: It bills per use rather than a flat fee
        why: Pay-per-use billing is true of DynamoDB, but it shapes cost rather than protecting the data.
      - id: c
        text: It keeps copies in three facilities per Region
        correct: true
        why: DynamoDB stores copies in three facilities in each Region, which keeps the orders available.
      - id: d
        text: It lets items hold different attributes
        why: A flexible schema is true of DynamoDB, but it governs record shape, not safety or availability.
      - id: e
        text: It answers in single-digit milliseconds
        why: Low latency is true of DynamoDB, but speed does not protect the data or keep it available.
    evidence:
      - "**Availability**: 99.999%, copies in three facilities per Region and in other Regions."
      - "**Encryption**: automatic at rest and in transit, with a choice of keys."
      - Data spreads over many servers and SSDs with no practical size cap, you pay per use, and security is built in.
    takeaway: DynamoDB protects data with automatic encryption and keeps it available with copies in three facilities per Region.
    history: []
    verified:
      keyHash: 68761149de1b
      fullHash: a4cd537d5a64
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-gvbz81
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-global-tables
    note: m07/nosql-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe opens shops in several countries, and its mobile app keeps loyalty data in Amazon DynamoDB.
      Which feature serves that same data to app users around the world?
    options:
      - id: a
        text: DynamoDB Accelerator (DAX)
        why: DAX adds an in-memory cache for faster reads but does not spread a table across the world.
      - id: b
        text: Amazon RDS read replicas
        why: Read replicas copy a relational RDS database, not a DynamoDB table.
      - id: c
        text: DynamoDB global tables
        correct: true
        why: Global tables are the DynamoDB feature for apps whose users are spread around the world.
      - id: d
        text: A Multi-AZ deployment
        why: Multi-AZ keeps a standby within one Region for failover rather than serving users worldwide.
    evidence:
      - "Use cases: gaming, finance and global mobile apps, served worldwide by **global tables**."
    takeaway: A DynamoDB app with users across many countries points to DynamoDB global tables.
    history: []
    verified:
      keyHash: ce31ea9d35da
      fullHash: 21576f18aa15
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-hdyvyn
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-global-tables
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      Which statement describes DynamoDB global tables?
    options:
      - id: a
        text: They cache table reads in memory for quicker answers
        why: Caching reads in memory is what DynamoDB Accelerator (DAX) does, not global tables.
      - id: b
        text: They change read and write capacity to follow traffic
        why: Following traffic with capacity changes is the job of DynamoDB auto scaling.
      - id: c
        text: They keep a table's data in more than one Region
        correct: true
        why: Global tables hold copies of a table in other Regions so worldwide apps can use it.
      - id: d
        text: They join items from many tables with SQL queries
        why: Joining tables with SQL belongs to relational databases, not to a DynamoDB feature.
    evidence:
      - "**Availability**: 99.999%, copies in three facilities per Region and in other Regions."
      - "**DynamoDB global tables**: the feature for worldwide DynamoDB apps, as on Prime Day."
    takeaway: DynamoDB global tables copy a table across Regions so apps with users worldwide can use the same data.
    history: []
    verified:
      keyHash: bf3d087b7fa5
      fullHash: 9b54acd3af8e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
