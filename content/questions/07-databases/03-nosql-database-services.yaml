  - id: q-3614kc
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-auto-scaling
    note: m07/nosql-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's NoSQL orders table uses provisioned capacity, and traffic jumps during promotions and drops at night.
      Which option keeps the table's throughput matched to real use?
    options:
      - id: a
        text: Amazon EC2 Auto Scaling
        why: EC2 Auto Scaling adds and removes EC2 instances, not the throughput of a DynamoDB table.
      - id: b
        text: Amazon DynamoDB auto scaling
        correct: true
        why: DynamoDB auto scaling moves provisioned throughput toward a target use, steady at peaks and cheaper when quiet.
      - id: c
        text: Amazon DynamoDB global tables
        why: Global tables copy a table to other Regions for worldwide users and do not adjust its provisioned throughput.
      - id: d
        text: DynamoDB Accelerator (DAX)
        why: DAX caches frequent reads in memory, which eases load but leaves the table's provisioned throughput fixed.
    evidence:
      - "**Auto scaling with provisioned capacity**: throughput automatically follows real use toward your target utilization, steady at peaks, cheaper when quiet."
    takeaway: Unpredictable traffic on a provisioned DynamoDB table points to DynamoDB auto scaling, not EC2 Auto Scaling.
    history: []
    verified:
      keyHash: 59b3c599002b
      fullHash: bdb0f2876913
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-960dte
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-auto-scaling
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      What problem does DynamoDB auto scaling solve compared with setting read and write capacity by hand?
    options:
      - id: a
        text: Waste when quiet and slowdowns at peaks
        correct: true
        why: Hand-set capacity is either wasted when quiet or too small at peaks, and auto scaling avoids both.
      - id: b
        text: Lost data when one storage facility goes down
        why: Keeping copies in several facilities protects against an outage, which is not a capacity problem.
      - id: c
        text: Slow answers for app users in faraway countries
        why: Serving a table to users worldwide is the job of global tables, not of auto scaling.
      - id: d
        text: Exposed data while it moves across the network
        why: DynamoDB encrypts data in transit automatically, which has nothing to do with capacity.
    evidence:
      - Auto scaling avoids the waste or slow peaks of hand-set read/write capacity.
    takeaway: DynamoDB auto scaling avoids both wasted capacity and slow peaks that come with hand-set read and write capacity.
    history: []
    verified:
      keyHash: c75dc88efb8f
      fullHash: 73195d72fb8f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
