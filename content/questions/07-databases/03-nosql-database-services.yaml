    concept: amazon-dynamodb
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      The cafe stores its order history in Amazon DynamoDB.
      Which DynamoDB features protect that data or keep it available?
    options:
      - id: a
        text: It encrypts data at rest and in transit
        correct: true
        why: DynamoDB encrypts data both at rest and in transit by default, which protects the order history.
      - id: b
        text: It bills per use rather than a flat fee
        why: Pay-per-use billing is true of DynamoDB, but it shapes cost rather than protecting the data.
      - id: c
        text: It keeps copies in three facilities per Region
        correct: true
        why: DynamoDB stores copies in three facilities in each Region, which keeps the orders available.
      - id: d
        text: It lets items hold different attributes
        why: A flexible schema is true of DynamoDB, but it governs record shape, not safety or availability.
      - id: e
        text: It answers in single-digit milliseconds
        why: Low latency is true of DynamoDB, but speed does not protect the data or keep it available.
    evidence:
      - "**Availability**: 99.999%, copies in three facilities per Region and in other Regions."
      - "**Encryption**: automatic at rest and in transit, with a choice of keys."
      - Data spreads over many servers and SSDs with no practical size cap, you pay per use, and security is built in.
    takeaway: DynamoDB protects data with automatic encryption and keeps it available with copies in three facilities per Region.
