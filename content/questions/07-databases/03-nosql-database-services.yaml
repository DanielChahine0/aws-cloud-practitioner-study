        why: A replica in another Region is a real global tables step, but it copies data rather than adding milk.
    evidence:
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
    takeaway: A flexible schema lets the cafe add a new attribute to just the items that need it, with no schema change first.
