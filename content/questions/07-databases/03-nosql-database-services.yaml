      A new manager opens the cafe's DynamoDB loyalty table and sees that one member's item records an allergy while another's records a home store instead.
      Which property of the table explains this?
    options:
      - id: a
        text: Its partition key gives every item a unique value
        why: The partition key identifies each item, but it does not explain why the items hold different data.
      - id: b
        text: Its global tables keep copies in other Regions
        why: Global tables serve the data worldwide, and they have nothing to do with which data each item holds.
      - id: c
        text: Its auto scaling matches throughput to real use
        why: Auto scaling adjusts capacity to traffic, and it does not decide what each item stores.
      - id: d
        text: Its flexible schema lets items carry their own data
        correct: true
        why: A NoSQL table does not force one layout, so each member's item can hold different attributes.
    evidence:
      - The core difference is flexible versus rigid schema, not speed or scaling, and NoSQL still indexes the primary key by default.
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
    takeaway: In a NoSQL table, a flexible schema lets each item hold its own set of attributes.
