questions:
  - id: q-yek13f
    version: 1
    status: live
    type: single
    pool: practice
    concept: nosql-databases
    note: m07/nosql-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe keeps loyalty profiles where one member has a favorite drink, another has a birthday, and new fields appear every few months.
      Which kind of database suits these changing records best?
    options:
      - id: a
        text: A relational database
        why: A relational table needs a set schema up front, which copes poorly with fields that keep changing.
      - id: b
        text: A NoSQL database
        correct: true
        why: A nonrelational database lets each profile carry its own attributes, so new fields need no redesign.
      - id: c
        text: A data warehouse
        why: A data warehouse is built for analytics across large datasets, not for storing each member's live profile.
      - id: d
        text: An in-memory cache
        why: A cache speeds up repeated reads in front of a database but is not where the profiles themselves belong.
    evidence:
      - Relational databases (MySQL, say), long the default, need a set schema and SQL.
      - Items can differ in attributes, which come and go freely (one customer has a favorite drink, another a birthday).
    takeaway: Records whose fields vary and change over time point to a NoSQL database rather than a fixed relational schema.
    history: []
    verified:
      keyHash: 7174a76a4ec0
      fullHash: b235806eba9e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ee9z6a
    version: 1
    status: live
    type: single
    pool: practice
    concept: nosql-databases
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      Which statement names the main difference between a NoSQL database and a relational database?
    options:
      - id: a
        text: NoSQL can answer queries quickly
        why: Speed is not the dividing line, since either kind can be fast for the right workload.
      - id: b
        text: NoSQL indexes its primary key by default
        why: This is true of NoSQL, but it does not set NoSQL apart from a relational database.
      - id: c
        text: NoSQL uses a flexible schema
        correct: true
        why: The core split is a flexible schema in NoSQL against the rigid, set schema of a relational table.
      - id: d
        text: NoSQL can grow with large workloads
        why: Scaling is not the core difference, and relational databases can also grow with demand.
    evidence:
      - The core difference is flexible versus rigid schema, not speed or scaling, and NoSQL still indexes the primary key by default.
    takeaway: NoSQL and relational databases differ mainly in schema, flexible versus rigid, rather than in speed or scaling.
    history: []
    verified:
      keyHash: 0a9f66b8fe5b
      fullHash: d59f71436032
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-sn75cr
    version: 1
    status: live
    type: single
    pool: practice
    concept: key-value-data-model
    note: m07/nosql-database-services
    task: "3.4"
    level: 1
    stem: >-
      A NoSQL database is often compared to a dictionary, where a headword leads to its definition.
      Which part of the data plays the role of the headword?
    options:
      - id: a
        text: The item's unique key
        correct: true
        why: The unique key names a single item, just as a headword names the entry that holds its definition.
      - id: b
        text: An attribute's name
        why: Attributes carry the item's values, so they play the part of the definition rather than the headword.
      - id: c
        text: An attribute's value
        why: A value such as a number or a set is the content stored under the key, like the text of a definition.
      - id: d
        text: The item as a whole
        why: The item is the full entry, the key plus its attributes, rather than the word that names it.
    evidence:
      - "NoSQL (nonrelational) databases hold key-value pairs: a unique key names an item and attributes carry its values, like a dictionary headword and definition."
    takeaway: In the key-value model a unique key names each item, much like a headword, and attributes carry its values.
    history: []
    verified:
      keyHash: f1e472de6b9e
      fullHash: db93a6eed93c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
