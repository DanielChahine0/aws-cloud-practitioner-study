  - id: q-fqvcnk
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb
    note: m07/nosql-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's ordering app needs a serverless key-value database as its main data store, with single-digit millisecond responses and no maintenance windows.
      Which service fits?
    options:
      - id: a
        text: Amazon RDS
        why: RDS runs relational engines with a set schema and has maintenance windows for patching.
      - id: b
        text: Amazon ElastiCache
        why: ElastiCache is an in-memory cache that sits in front of a database rather than serving as the main store.
      - id: c
        text: Amazon Aurora
        why: Aurora is a relational database compatible with MySQL and PostgreSQL, not a key-value store.
      - id: d
        text: Amazon DynamoDB
        correct: true
        why: DynamoDB is a serverless NoSQL key-value database with single-digit millisecond latency and no maintenance windows.
    evidence:
      - Fully managed, serverless NoSQL for key-value and document data.
      - Single-digit millisecond latency at any scale, with no patching, upgrades, maintenance windows, downtime or cold starts.
    takeaway: A serverless key-value store with single-digit millisecond speed and no upkeep points to Amazon DynamoDB.
    history: []
    verified:
      keyHash: e232d3b893be
      fullHash: d5cdd2e3dc38
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
