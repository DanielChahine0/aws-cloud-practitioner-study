  - id: q-7pzs11
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe chain pays steep license fees for a high-end commercial database behind its busy ordering system.
      It wants a MySQL-compatible relational service with similar performance at a much lower cost.
      Which service fits?
    options:
      - id: a
        text: Amazon DynamoDB
        why: DynamoDB is a NoSQL store with a flexible schema, so it is not a MySQL-compatible replacement.
      - id: b
        text: Amazon Aurora
        correct: true
        why: Aurora is MySQL-compatible and matches commercial database performance at a fraction of the cost.
      - id: c
        text: Amazon Redshift
        why: Redshift is a data warehouse for analysis, not a relational engine for live ordering traffic.
      - id: d
        text: Amazon DocumentDB
        why: DocumentDB is a MongoDB-compatible document store, not a drop-in MySQL-compatible database.
    evidence:
      - MySQL- and PostgreSQL-compatible, built to cut needless I/O (the video also lists distributed SQL, DSQL).
      - About one-tenth the cost of high-end commercial databases at similar performance, so it suits replacing pricey commercial engines.
    takeaway: Aurora gives MySQL- and PostgreSQL-compatible performance on par with commercial engines at far lower cost.
    history: []
    verified:
      keyHash: fff49d2530ef
      fullHash: 3b1a9f3094bd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-22s7z2
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 1
    stem: >-
      How does Amazon Aurora keep a database available when part of its infrastructure fails?
    options:
      - id: a
        text: It keeps six copies of the data over three AZs
        correct: true
        why: Aurora spreads six copies across three Availability Zones, so losing one AZ does not lose the data.
      - id: b
        text: It works with MySQL and PostgreSQL applications
        why: MySQL and PostgreSQL compatibility is true of Aurora but eases moves, not recovery from failures.
      - id: c
        text: It fails over to one of up to 15 Aurora Replicas
        correct: true
        why: Traffic can move to a healthy Aurora Replica without data loss when the primary has a problem.
      - id: d
        text: It costs about one-tenth of commercial engines
        why: The lower cost is true of Aurora, but price does nothing to keep the database up during a failure.
      - id: e
        text: It is built to cut out needless I/O work
        why: Cutting needless I/O is true of Aurora, but it improves speed rather than surviving a failure.
    evidence:
      - Six copies over three AZs, 99.99% availability, failover to healthy replicas without data loss, and up to 15 Aurora Replicas.
    takeaway: Aurora stays available by keeping six copies over three AZs and failing over to Aurora Replicas.
    history: []
    verified:
      keyHash: 6c4f5e165e9a
      fullHash: 3f7d12974733
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-zqewtq
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      Before a big change to its ordering system, the cafe wants a full copy of its Amazon RDS database that it can restore later or keep as an archive.
      Which RDS feature fits?
    options:
      - id: a
        text: A read replica
        why: A read replica takes read traffic off the primary, but it tracks live changes rather than freezing a copy to restore.
      - id: b
        text: A Multi-AZ standby
        why: A Multi-AZ standby takes over when the primary fails, and it is not a saved copy kept for later restores.
      - id: c
        text: A manual DB snapshot
        correct: true
        why: A manual DB snapshot is a full copy the cafe takes on demand, for point-in-time recovery or an archive.
      - id: d
        text: Performance Insights
        why: Performance Insights shows the live load on the database, and it keeps no copy of the data.
    evidence:
      - "Resilience: Multi-AZ, automated backups on your schedule, and manual DB snapshots (full copies for point-in-time recovery or archives)."
    takeaway: A manual DB snapshot gives an RDS database a full on-demand copy for later recovery or archiving.
