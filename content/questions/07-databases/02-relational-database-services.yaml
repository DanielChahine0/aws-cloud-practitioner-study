  - id: q-xs51gr
    version: 1
    status: live
    type: single
    pool: practice
    concept: sql
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe switches the relational engine behind its order tables on Amazon RDS to a different one.
      How does its reporting app keep reading the order rows after the switch?
    options:
      - id: a
        text: Through key-value reads by partition key
        why: Key-value reads by partition key suit a NoSQL table such as DynamoDB, not rows in a relational engine.
      - id: b
        text: Through graph traversals across linked nodes
        why: Traversing nodes and links is how a graph database is read, not how a relational engine returns rows.
      - id: c
        text: Through SQL queries sent to the database
        correct: true
        why: SQL is the usual interface across relational engines such as MySQL and PostgreSQL, so the app keeps querying rows the same way.
      - id: d
        text: Through document lookups in JSON form
        why: JSON document lookups fit a document database such as DocumentDB, not the cafe's relational tables.
    evidence:
      - SQL is the usual interface, on engines like MySQL, PostgreSQL and Microsoft SQL Server, and the model keeps structured data consistent and scalable.
    takeaway: SQL works across relational engines such as MySQL and PostgreSQL, so moving between them keeps the same query language.
