      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-j4gayv
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "2.1"
    level: 2
    stem: >-
      The cafe moves its order database to Amazon RDS.
      Which jobs stay with the cafe rather than with AWS?
    options:
      - id: a
        text: Patching the database engine and its operating system
        why: RDS applies patches to the engine and operating system, so this job moves to AWS.
      - id: b
        text: Encrypting the data both at rest and in transit
        correct: true
        why: Under RDS the customer still owns encryption of stored and moving data, so the cafe keeps this job.
      - id: c
        text: Running the scheduled automated database backups
        why: RDS takes automated backups on the schedule the cafe sets, so AWS carries out this job.
      - id: d
        text: Failing over to a standby when an instance fails
        why: RDS automates failover, so AWS moves traffic to the standby without the cafe stepping in.
      - id: e
        text: Maintaining the servers and storage hardware
        why: AWS runs the infrastructure under RDS, so the cafe no longer handles any hardware.
      - id: f
        text: Choosing the security measures that guard the data
        correct: true
        why: Security measures stay with the customer under RDS, so the cafe decides how the data is guarded.
    evidence:
      - AWS runs infrastructure, OS, patching and backups, while you own security measures and encryption at rest and in transit.
    takeaway: With Amazon RDS, AWS handles patching and backups while the customer keeps security and encryption.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 2 and 5 are the only customer duties for RDS; the other four are all AWS duties, so a select-2 split gives it away.)"
  - id: q-qde6tq
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's online shop records every sale and tracks bean stock in MySQL tables.
      It wants AWS to take over patching, backups and failover for this day-to-day workload.
      Which service fits?
    options:
      - id: a
        text: Amazon Redshift
        why: Redshift is a data warehouse for analysis at scale, not a store for day-to-day sales and stock.
      - id: b
        text: Amazon DynamoDB
        why: DynamoDB is a NoSQL store with a flexible schema and does not run the shop's MySQL tables.
      - id: c
        text: Amazon Neptune
        why: Neptune is a graph database built around connections, not a managed MySQL engine.
      - id: d
        text: Amazon RDS
        correct: true
        why: RDS runs MySQL for operational workloads such as e-commerce inventory and automates patching and backups.
    evidence:
      - A relational service for operational workloads, not data warehousing, that automates patching, backups, provisioning, failover and disaster recovery.
      - "Use cases: web apps, enterprise workloads, e-commerce inventories."
    takeaway: Amazon RDS runs operational relational workloads, while Amazon Redshift is meant for data warehousing.
    history: []
