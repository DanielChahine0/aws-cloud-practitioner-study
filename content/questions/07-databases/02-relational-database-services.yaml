  - id: q-xthr8d
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe's MySQL ordering app slows down under the morning rush, so the cafe moves it to Amazon Aurora for more throughput.
      Where does Aurora's extra throughput come from?
    options:
      - id: a
        text: Its continuous backups to Amazon S3
        why: Aurora does back up continuously to S3, but backups protect the data rather than speed up orders.
      - id: b
        text: Its encryption of the data at rest
        why: Aurora encrypts data at rest, but encryption guards the records and adds no throughput.
      - id: c
        text: Its point-in-time restore window
        why: Point-in-time restore through AWS Backup helps recover past data, not serve the morning rush faster.
      - id: d
        text: Its distributed storage design
        correct: true
        why: Aurora's higher MySQL throughput comes from its distributed storage, not from automatic CPU scaling.
    evidence:
      - Up to 5x MySQL and 3x PostgreSQL throughput comes from distributed storage, not automatic CPU scaling.
    takeaway: Aurora's extra throughput over standard MySQL and PostgreSQL comes from its distributed storage design.
