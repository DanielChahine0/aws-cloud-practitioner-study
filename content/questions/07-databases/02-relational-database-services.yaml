questions:
  - id: q-0xr69j
    version: 1
    status: live
    type: single
    pool: practice
    concept: relational-databases
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe keeps its orders and loyalty members in linked tables that all follow one fixed layout.
      It wants to spot members who keep ordering the same drink.
      Which kind of database fits this data?
    options:
      - id: a
        text: A NoSQL database
        why: A NoSQL store uses a flexible schema, while this data follows one fixed layout across linked tables.
      - id: b
        text: A relational database
        correct: true
        why: Related tables under a fixed schema suit transactional records like orders and loyalty members.
      - id: c
        text: A graph database
        why: A graph store centers on connections between items, not on rows in tables with a set layout.
      - id: d
        text: An in-memory cache
        why: A cache holds hot data in RAM for a short time and is not the main home for order records.
    evidence:
      - Transactional data, like the coffee shop's orders and loyalty records, usually sits in a relational database management system.
      - Tables of rows and columns follow a rigid schema and share attributes, so one query spans customers and orders.
    takeaway: Transactional records in linked tables with a fixed schema belong in a relational database.
    history: []
    verified:
      keyHash: 644ab75c2aac
      fullHash: 6010eeecbbd0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-dk1gdn
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: relational-databases
    note: m07/relational-database-services
    task: "3.4"
    level: 1
    stem: >-
      Which traits describe how a relational database organizes its data?
    options:
      - id: a
        text: Data sits in tables of rows and columns
        correct: true
        why: A relational database stores records as rows in tables, with each column holding one attribute.
      - id: b
        text: Each item may carry its own set of fields
        why: Per-item fields describe a flexible NoSQL schema, not the fixed layout of relational tables.
      - id: c
        text: Every row follows one rigid, shared schema
        correct: true
        why: Relational tables enforce a fixed schema, so every row shares the same attributes.
      - id: d
        text: Records are kept as nodes and their links
        why: Nodes joined by links describe a graph database, which models connections rather than tables.
      - id: e
        text: Data lives only in RAM for quick reads
        why: Holding data only in memory describes a cache layer, not how a relational database stores records.
    evidence:
      - Tables of rows and columns follow a rigid schema and share attributes, so one query spans customers and orders.
    takeaway: A relational database stores rows and columns in tables that all follow one rigid schema.
    history: []
    verified:
      keyHash: 9a7fe62f0ae6
      fullHash: c79bfee6061b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
