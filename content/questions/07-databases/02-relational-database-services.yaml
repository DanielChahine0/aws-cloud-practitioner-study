      fullHash: fec48057db99
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bfpgwx
    version: 1
    status: live
    type: single
    pool: practice
    concept: sql
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe's relational database on Amazon RDS links each customer record to an order history.
      The manager wants to list every customer who ordered the same latte many times.
      How should the data be retrieved?
    options:
      - id: a
        text: A lookup of each customer by primary key
        why: A key lookup returns one customer at a time and does not combine customer and order records.
      - id: b
        text: A read of copies held in a cache layer
        why: A cache returns stored copies of hot data and does not run a search across related records.
      - id: c
        text: A scan of order files exported to storage
        why: Scanning loose files skips the database and loses the links between customers and orders.
      - id: d
        text: A SQL query that joins the two tables
        correct: true
        why: One SQL query can join the customer and order tables to find repeat drink orders.
    evidence:
      - Tables of rows and columns follow a rigid schema and share attributes, so one query spans customers and orders.
      - SQL is the usual interface, on engines like MySQL, PostgreSQL and Microsoft SQL Server, and the model keeps structured data consistent and scalable.
    takeaway: A single SQL query can join related tables, such as customers and orders, in one request.
    history: []
    verified:
      keyHash: 319e32298d81
      fullHash: 29b287a5b708
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-j4gayv
    version: 1
    status: live
    type: multi
    select: 3
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "2.1"
    level: 2
    stem: >-
      The cafe runs its order database itself on Amazon EC2 and now moves it to Amazon RDS.
      Which jobs does the cafe hand over to AWS in this move?
    options:
      - id: a
        text: Patching the OS that hosts the order data
        correct: true
        why: On EC2 the cafe controlled and patched the OS, and under RDS AWS applies those patches instead.
      - id: b
        text: Choosing which staff may read the order data
        why: Who may read the data is a security measure, and those stay with the cafe under RDS just as they did on EC2.
      - id: c
        text: Taking the regular backups of the order data
        correct: true
        why: The cafe ran its own backups on EC2, and RDS takes them automatically once the database moves.
      - id: d
        text: Designing the tables that hold the order data
        why: RDS runs the database for the cafe, but what tables and columns the order data needs is still the cafe's call.
      - id: e
        text: Failing the order data over to a standby
        correct: true
        why: A self-run database on EC2 leaves failover to the cafe, while RDS automates failover for it.
      - id: f
        text: Writing the queries the order app runs on the data
        why: The order app and its queries are the cafe's own code, so writing them stays with the cafe after the move.
    evidence:
      - AWS runs infrastructure, OS, patching and backups, while you own security measures and encryption at rest and in transit.
      - A relational service for operational workloads, not data warehousing, that automates patching, backups, provisioning, failover and disaster recovery.
      - Lift-and-shift puts an on-premises database as is on Amazon EC2, keeping control of OS, memory, CPU and storage.
    takeaway: Moving a database from EC2 to Amazon RDS hands OS patching, backups and failover to AWS, while access, data design and queries stay with the cafe.
    history: []
    verified:
      keyHash: 37bc3413ce93
      fullHash: 93cd818b32f9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-qde6tq
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's online shop records every sale and tracks bean stock in MySQL tables.
      It wants AWS to take over patching, backups and failover for this day-to-day workload.
      Which service fits?
    options:
      - id: a
        text: Amazon Redshift
        why: Redshift is a data warehouse for analysis at scale, not a store for day-to-day sales and stock.
      - id: b
        text: Amazon DynamoDB
        why: DynamoDB is a NoSQL store with a flexible schema and does not run the shop's MySQL tables.
      - id: c
        text: Amazon Neptune
        why: Neptune is a graph database built around connections, not a managed MySQL engine.
      - id: d
        text: Amazon RDS
        correct: true
        why: RDS runs MySQL for operational workloads such as e-commerce inventory and automates patching and backups.
    evidence:
      - A relational service for operational workloads, not data warehousing, that automates patching, backups, provisioning, failover and disaster recovery.
      - "Use cases: web apps, enterprise workloads, e-commerce inventories."
    takeaway: Amazon RDS runs operational relational workloads, while Amazon Redshift is meant for data warehousing.
    history: []
    verified:
      keyHash: ee2d4c80f4e4
      fullHash: 5f0f57f156ff
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7pzs11
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe chain pays steep license fees for a high-end commercial database behind its busy ordering system.
      It wants a MySQL-compatible relational service with similar performance at a much lower cost.
      Which service fits?
    options:
      - id: a
        text: Amazon DynamoDB
        why: DynamoDB is a NoSQL store with a flexible schema, so it is not a MySQL-compatible replacement.
      - id: b
        text: Amazon Aurora
        correct: true
        why: Aurora is MySQL-compatible and matches commercial database performance at a fraction of the cost.
      - id: c
        text: Amazon Redshift
        why: Redshift is a data warehouse for analysis, not a relational engine for live ordering traffic.
      - id: d
        text: Amazon DocumentDB
        why: DocumentDB is a MongoDB-compatible document store, not a drop-in MySQL-compatible database.
    evidence:
      - MySQL- and PostgreSQL-compatible, built to cut needless I/O (the video also lists distributed SQL, DSQL).
      - About one-tenth the cost of high-end commercial databases at similar performance, so it suits replacing pricey commercial engines.
    takeaway: Aurora gives MySQL- and PostgreSQL-compatible performance on par with commercial engines at far lower cost.
    history: []
    verified:
      keyHash: fff49d2530ef
      fullHash: 3b1a9f3094bd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-22s7z2
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-aurora
    note: m07/relational-database-services
    task: "3.4"
    level: 1
    stem: >-
      How does Amazon Aurora keep a database available when part of its infrastructure fails?
    options:
      - id: a
        text: It keeps six copies of the data over three AZs
        correct: true
        why: Aurora spreads six copies across three Availability Zones, so losing one AZ does not lose the data.
      - id: b
        text: It works with MySQL and PostgreSQL applications
        why: MySQL and PostgreSQL compatibility is true of Aurora but eases moves, not recovery from failures.
      - id: c
        text: It fails over to one of up to 15 Aurora Replicas
        correct: true
        why: Traffic can move to a healthy Aurora Replica without data loss when the primary has a problem.
      - id: d
        text: It costs about one-tenth of commercial engines
        why: The lower cost is true of Aurora, but price does nothing to keep the database up during a failure.
      - id: e
        text: It is built to cut out needless I/O work
        why: Cutting needless I/O is true of Aurora, but it improves speed rather than surviving a failure.
    evidence:
      - Six copies over three AZs, 99.99% availability, failover to healthy replicas without data loss, and up to 15 Aurora Replicas.
    takeaway: Aurora stays available by keeping six copies over three AZs and failing over to Aurora Replicas.
    history: []
    verified:
      keyHash: 6c4f5e165e9a
      fullHash: 3f7d12974733
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-zqewtq
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds
    note: m07/relational-database-services
    task: "3.4"
    level: 2
    stem: >-
      Before a big change to its ordering system, the cafe wants a full copy of its Amazon RDS database that it can restore later or keep as an archive.
      Which RDS feature fits?
    options:
      - id: a
        text: A read replica
        why: A read replica takes read traffic off the primary, but it tracks live changes rather than freezing a copy to restore.
      - id: b
        text: A Multi-AZ standby
        why: A Multi-AZ standby takes over when the primary fails, and it is not a saved copy kept for later restores.
      - id: c
        text: A manual DB snapshot
        correct: true
        why: A manual DB snapshot is a full copy the cafe takes on demand, for point-in-time recovery or an archive.
      - id: d
        text: Performance Insights
        why: Performance Insights shows the live load on the database, and it keeps no copy of the data.
    evidence:
      - "Resilience: Multi-AZ, automated backups on your schedule, and manual DB snapshots (full copies for point-in-time recovery or archives)."
    takeaway: A manual DB snapshot gives an RDS database a full on-demand copy for later recovery or archiving.
    history: []
