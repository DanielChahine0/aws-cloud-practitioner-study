  - id: q-xzhftz
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-dynamodb-partition-key
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 1
    stem: >-
      Which statements about a DynamoDB table follow from its partition key?
    options:
      - id: a
        text: Every item must carry a value for one required attribute.
        correct: true
        why: The partition key is the one attribute each item is required to carry, while other attributes may vary.
      - id: b
        text: No foreign key links the table to any other table.
        why: This is true of DynamoDB, but it holds because DynamoDB has no foreign keys, not because of the partition key.
      - id: c
        text: A query fetches the items that match a given value.
        correct: true
        why: A DynamoDB query looks up items by their partition key value, so the key is what a query matches on.
      - id: d
        text: A scan reads back every item that the table holds.
        why: This is true, but a scan reads the whole table without using the partition key at all.
      - id: e
        text: Apps add items by calling its APIs through the AWS SDK.
        why: This is true of how apps reach DynamoDB, and it does not follow from the partition key.
    evidence:
      - Each item must carry a partition key value, while its other attributes can vary.
      - "**Partition key**: the required attribute that identifies DynamoDB items and that a query looks up."
    takeaway: The partition key is required on every DynamoDB item and is the value a query uses to find items.
    history: []
