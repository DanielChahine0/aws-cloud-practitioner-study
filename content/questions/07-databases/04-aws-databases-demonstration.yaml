questions:
  - id: q-vgr3hk
    version: 1
    status: live
    type: single
    pool: practice
    concept: foreign-keys
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 2
    stem: >-
      The cafe keeps a customers table and an orders table in Amazon RDS.
      Each order must point back to the customer who placed it so a join can list that customer's orders.
      What relates the two tables?
    options:
      - id: a
        text: A partition key
        why: A partition key identifies items in a DynamoDB table and does not tie one RDS table to another.
      - id: b
        text: A foreign key
        correct: true
        why: A foreign key in the orders table references the customers table, which is what lets the join match them.
      - id: c
        text: A DB instance identifier
        why: The identifier only names the RDS instance and says nothing about how its tables relate.
      - id: d
        text: An endpoint and port
        why: The endpoint and port tell a client where to connect, not how the tables link to each other.
    evidence:
      - SQL then created users, products and orders tables tied by foreign keys, inserted rows, and joined them to list one user's orders.
      - "**Foreign key**: the link relating one RDS table to another, absent in DynamoDB."
    takeaway: In Amazon RDS, foreign keys tie related tables together so joins can combine their rows.
    history: []
    verified:
      keyHash: 491d7d133c4e
      fullHash: 0f24e15fbb5b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-p3wbsa
    version: 1
    status: live
    type: single
    pool: practice
    concept: foreign-keys
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 1
    stem: >-
      The cafe is comparing Amazon RDS and Amazon DynamoDB for its order data.
      Which difference between the two comes down to foreign keys?
    options:
      - id: a
        text: RDS tables link to each other, and DynamoDB tables stand alone.
        correct: true
        why: Foreign keys are what link RDS tables together, and DynamoDB tables have none, so each stands alone.
      - id: b
        text: RDS queries are written in SQL, and DynamoDB has its own language.
        why: This is a real difference, but it is about the query language, not about foreign keys.
      - id: c
        text: RDS rows fill the same columns, and DynamoDB items can vary.
        why: This is a real difference, but it comes from rigid versus flexible schemas, not from foreign keys.
      - id: d
        text: RDS clients use an endpoint, and DynamoDB apps call the AWS SDK.
        why: This is a real difference in how apps connect, and it has nothing to do with foreign keys.
    evidence:
      - "**Foreign key**: the link relating one RDS table to another, absent in DynamoDB."
      - RDS links rigid tables with foreign keys, and DynamoDB tables stand alone with flexible schemas.
    takeaway: Foreign keys and joins belong to relational RDS tables, while DynamoDB tables carry no foreign keys.
    history: []
    verified:
      keyHash: 021f533e6063
      fullHash: e8d68f143f60
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-k4whk4
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-partition-key
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 2
    stem: >-
      A barista creates a DynamoDB table in the console to track loyalty members.
      Besides a table name, what must the barista set before the table can hold items?
    options:
      - id: a
        text: A foreign key
        why: Foreign keys link RDS tables, and DynamoDB tables have none to set.
      - id: b
        text: A DB instance identifier
        why: An instance identifier names an RDS instance, and DynamoDB works with tables rather than instances.
      - id: c
        text: A partition key
        correct: true
        why: A DynamoDB table is created from just a name and a partition key, which every item then uses as its identifier.
      - id: d
        text: A free tier template
        why: The free tier template is an RDS setup preset, not a setting on a DynamoDB table.
    evidence:
      - A table needs only a name (orders) and a partition key (order number, type Number), and is usable once active.
      - A DynamoDB table needs just a name and a partition key.
    takeaway: Creating a DynamoDB table takes only a table name and a partition key.
    history: []
    verified:
      keyHash: c865f81e9307
      fullHash: 2c19c7223b97
