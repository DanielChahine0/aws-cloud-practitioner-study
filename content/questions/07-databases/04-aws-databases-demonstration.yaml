      The cafe's app finds order number 5 in its DynamoDB orders table with a query instead of a scan.
      Which statement describes what the query does?
    options:
      - id: a
        text: Reads every item, then keeps the matches
        why: Reading back the whole table is what a scan does, which is the slower path the app avoids here.
      - id: b
        text: Looks up items by partition key value
        correct: true
        why: A query returns the items whose partition key matches the value the app supplies, here order number 5.
      - id: c
        text: Joins orders to users through a foreign key
        why: DynamoDB tables stand alone with no foreign keys, so a query cannot join the orders table to another.
