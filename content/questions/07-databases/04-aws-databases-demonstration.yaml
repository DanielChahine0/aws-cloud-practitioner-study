    level: 2
    stem: >-
      The cafe's DynamoDB orders table uses the pickup code printed on each receipt as its partition key and grows every week.
      Which jobs should the staff's tools handle with a query rather than a scan?
    options:
      - id: a
        text: Fetching the one order whose pickup code a customer reads out
        correct: true
        why: The pickup code is the partition key, so a query reads just the order with that value instead of every item.
      - id: b
        text: Fetching the one order whose order number a customer reads out
        why: The order number is not this table's partition key, so finding the order by it means a scan of every item.
      - id: c
        text: Counting how many pickup codes the table holds in all
        why: Counting every pickup code needs every item in the table, which is the whole-table read that a scan does.
      - id: d
        text: Fetching the notes on the order with a given pickup code
        correct: true
        why: A given pickup code is a partition key value, so a query fetches that order, notes included, and skips the rest.
      - id: e
        text: Fetching the orders whose notes mention oat milk
        why: The notes are not the partition key, so finding the orders that mention oat milk takes a scan through all the items.
    evidence:
      - "**Query**: a DynamoDB read of the items matching a partition key value."
      - A scan (Explore table items, then Run) read back everything, and a notes attribute appeared on only some items.
      - A scan returns the whole table, while a query fetches items by partition key.
    takeaway: A job that starts from one partition key value calls for a query, while jobs on other attributes or the whole table need a scan.
