  - id: q-r8dgnf
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-query
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 2
    stem: >-
      The cafe's DynamoDB orders table gets bigger every day.
      The cashier's tool fetches a single order with a query when a customer reads out their order number.
      Which fact about the table lets that query skip every other order?
    options:
      - id: a
        text: Its order items can each carry their own attributes
        why: Varying attributes are true of the table, but they do not narrow which items a read has to touch.
      - id: b
        text: Its partition key holds each order's number
        correct: true
        why: A query looks up a partition key value, and here that key is the order number, so only the matching order is read.
      - id: c
        text: Its orders are read and written through DynamoDB APIs
        why: Every DynamoDB read goes through its APIs, a scan included, so this does not explain skipping the other orders.
      - id: d
        text: Its order items have no foreign keys to other tables
        why: DynamoDB tables do stand alone, but having no foreign keys has nothing to do with which items a query reads.
    evidence:
      - "**Partition key**: the required attribute that identifies DynamoDB items and that a query looks up."
      - A query for order number 5 returned that single item, the better tool as tables grow.
    takeaway: A DynamoDB query skips the rest of the table because it looks items up by their partition key value.
    history: []
    verified:
      keyHash: fb58e2174abb
      fullHash: d536a0578c08
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
