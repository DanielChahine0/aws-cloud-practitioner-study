  - id: q-xzhftz
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-dynamodb-partition-key
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 1
    stem: >-
      Which statements about a DynamoDB table follow from its partition key?
    options:
      - id: a
        text: Every item must carry a value for one required attribute.
        correct: true
        why: The partition key is the one attribute each item is required to carry, while other attributes may vary.
      - id: b
        text: No foreign key links the table to any other table.
        why: This is true of DynamoDB, but it holds because DynamoDB has no foreign keys, not because of the partition key.
      - id: c
        text: A query fetches the items that match a given value.
        correct: true
        why: A DynamoDB query looks up items by their partition key value, so the key is what a query matches on.
      - id: d
        text: A scan reads back every item that the table holds.
        why: This is true, but a scan reads the whole table without using the partition key at all.
      - id: e
        text: Apps add items by calling its APIs through the AWS SDK.
        why: This is true of how apps reach DynamoDB, and it does not follow from the partition key.
    evidence:
      - Each item must carry a partition key value, while its other attributes can vary.
      - "**Partition key**: the required attribute that identifies DynamoDB items and that a query looks up."
    takeaway: The partition key is required on every DynamoDB item and is the value a query uses to find items.
    history: []
    verified:
      keyHash: 1f508ecabc66
      fullHash: 95e3e1d32b9d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-2njgtf
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-scan
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 2
    stem: >-
      The cafe's small DynamoDB table of seasonal drinks has an allergen attribute on only some items.
      A manager wants to read back the whole table in the console to see which drinks carry it.
      Which read fits?
    options:
      - id: a
        text: A query on one partition key value
        why: A query returns only the items matching one partition key value, so most drinks would be left out.
      - id: b
        text: A scan of the table
        correct: true
        why: A scan reads every item in the table, so the manager sees all drinks and which ones have the attribute.
      - id: c
        text: A SQL join across related tables
        why: Joins combine related RDS tables through foreign keys, and DynamoDB tables have no foreign keys to join on.
      - id: d
        text: A SQL client on the endpoint and port
        why: Connecting through an endpoint and port is how clients reach RDS, while DynamoDB is reached through its APIs.
    evidence:
      - A scan (Explore table items, then Run) read back everything, and a notes attribute appeared on only some items.
    takeaway: A DynamoDB scan reads every item in a table, which suits reviewing a whole small table.
    history: []
    verified:
      keyHash: fc7a2594ef2d
      fullHash: 60b8d7450d32
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-js422n
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-dynamodb-scan
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 1
    stem: >-
      What does a scan of a DynamoDB table return?
    options:
      - id: a
        text: The items matching one partition key value
        why: Returning items by partition key value is what a query does, not a scan.
      - id: b
        text: Rows combined from tables tied by foreign keys
        why: Combining rows through foreign keys is an RDS join, and DynamoDB has no foreign keys.
      - id: c
        text: Every item stored in the table
        correct: true
        why: A scan reads the whole table, returning each item it holds.
      - id: d
        text: Only the attributes that every item shares
        why: A scan returns whole items, including attributes that appear on only some of them.
    evidence:
      - "**Scan**: a DynamoDB read of every item in a table."
      - A scan returns the whole table, while a query fetches items by partition key.
    takeaway: A DynamoDB scan returns every item in the table, with whatever attributes each item has.
    history: []
