        text: A SQL statement sent through a database endpoint
        why: Connecting through an endpoint and sending SQL is how RDS is reached, while apps call DynamoDB's APIs.
    evidence:
      - A query for order number 5 returned that single item, the better tool as tables grow.
      - A scan returns the whole table, while a query fetches items by partition key.
    takeaway: To fetch specific items from a large DynamoDB table, query by partition key instead of scanning.
