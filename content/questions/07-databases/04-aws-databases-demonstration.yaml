  - id: q-r8dgnf
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-dynamodb-query
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 3
    stem: >-
      The cafe's DynamoDB orders table uses the order number as its partition key and gets bigger every day.
      A cashier needs to pull up a single order fast, without reading the rest of the table.
      Which read should the cashier's tool use?
    options:
      - id: a
        text: A scan of every order item
        why: A scan reads every item, which does more work as the table grows when only one order is wanted.
      - id: b
        text: A query on the order number
        correct: true
        why: The order number is the partition key, so a query on it returns just the one matching order.
      - id: c
        text: A query on the order date
        why: The order date is not the partition key, so a query cannot look an order up by it.
      - id: d
        text: A query on the customer name
        why: A query looks items up by the partition key value, and the customer name is not that key here.
    evidence:
      - A query for order number 5 returned that single item, the better tool as tables grow.
      - "Finding one order in a growing table: query the partition key instead of scanning."
    takeaway: To find one item in a growing DynamoDB table, query its partition key rather than scanning everything.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 4 is the natural partition key for orders; the other choices would not be the key.)"
  - id: q-xgk78h
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: amazon-dynamodb-query
    note: m07/aws-databases-demonstration
    task: "3.4"
    level: 1
    stem: >-
      A cashier tool fetches single orders from the cafe's growing DynamoDB orders table, keyed by order number.
      Which statements explain why a query suits this job?
    options:
      - id: a
        text: It reads only the items matching the partition key value
        correct: true
        why: A query reads just the items whose partition key matches, so the tool gets the one order it asked for.
      - id: b
        text: It reaches DynamoDB through the AWS SDK like other reads
        why: This is true, but every read, scans included, goes through the SDK, so it does not favor a query.
      - id: c
        text: It keeps its edge over a scan as the orders table grows
        correct: true
        why: Because a query skips the items that do not match, it keeps beating a scan as the orders table gets larger.
      - id: d
        text: It returns items whose other attributes can still vary
        why: This is true of DynamoDB items, but a flexible schema says nothing about why a query fits the lookup.
      - id: e
        text: It runs on a stand-alone table that has no foreign keys
        why: This is true of DynamoDB, but the lack of foreign keys does not explain why a query fits the lookup.
    evidence:
      - "**Query**: a DynamoDB read of the items matching a partition key value."
      - A query for order number 5 returned that single item, the better tool as tables grow.
    takeaway: A DynamoDB query fetches items by partition key value and suits growing tables better than a scan.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 2 and 3 are the known advantages of query over scan.)"
