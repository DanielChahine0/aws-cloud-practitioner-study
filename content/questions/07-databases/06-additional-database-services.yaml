        text: Giving each workload a separate backup schedule
        why: Backup schedules can differ within one service, so they do not explain picking three different ones.
      - id: c
        text: Giving each workload a service that AWS patches
        why: One managed service would also be patched by AWS, so upkeep does not explain using three of them.
      - id: d
        text: Giving each workload a store suited to its data
        correct: true
        why: Each kind of data sits in a service chosen for it, which is the best-fit approach AWS recommends.
    evidence:
      - AWS steers each workload to its best-fit purpose-built tool, and offers more than the course covers.
    takeaway: Using different databases for orders, sessions and relationships shows each workload placed in its best-fit engine.
    history: []
