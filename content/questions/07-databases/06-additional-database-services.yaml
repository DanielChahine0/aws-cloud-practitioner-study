  - id: q-tgjces
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-backup
    note: m07/additional-database-services
    task: "3.6"
    level: 3
    stem: >-
      The cafe copies its EBS volumes, Amazon EFS, RDS and DynamoDB, plus its on-premises server, on separate schedules set up in each service, and the overlap confuses the team.
      It wants one dashboard to set every schedule and see every restore point.
      Which service fits?
    options:
      - id: a
        text: AWS Backup
        correct: true
        why: AWS Backup unifies backup plans for these services and on-premises data in one dashboard.
      - id: b
        text: AWS Elastic Disaster Recovery
        why: Elastic Disaster Recovery replicates servers for failover, not one place to manage backups across services.
      - id: c
        text: AWS Storage Gateway
        why: Storage Gateway connects on-premises storage to AWS but does not centralize backup plans across services.
      - id: d
        text: Amazon Data Lifecycle Manager
        why: Data Lifecycle Manager automates EBS snapshots only, not backups for EFS, RDS and DynamoDB too.
    evidence:
      - Separate disk and database backup plans overlap and confuse, so it unifies them in one dashboard.
      - It covers EBS, Amazon EFS, RDS, DynamoDB and more, even on-premises data.
    takeaway: Backups scattered across many services and on premises point to AWS Backup for one central dashboard.
    history: []
    verified:
      keyHash: 1d1a25ada488
      fullHash: fc8441ae1049
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
