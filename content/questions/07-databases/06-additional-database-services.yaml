    concept: graph-databases
    note: m07/additional-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's fraud team needs to spot rings of loyalty accounts that share cards, phones and addresses by following many hops of links between them.
      Which type of database fits this job best?
    options:
      - id: a
        text: Graph database
        correct: true
        why: A graph database is built around connections, so following many hops between accounts is what it does best.
      - id: b
        text: Relational database
        why: Many hops of links mean many table joins, which grow clumsy and slow in a relational design.
      - id: c
        text: Key-value database
        why: Key-value lookups fetch one item by key and cannot follow chains of links between accounts.
      - id: d
        text: Document database
        why: Documents hold self-contained records, not the web of shared links the fraud team must trace.
    evidence:
      - A fully managed graph database for highly connected data, like social webs that are clumsy in relational tables.
      - "Use cases: social network mapping, fraud detection, search and recommendations."
    takeaway: When the answer lies in chains of links between records, such as fraud rings, use a graph database.
    history: []
