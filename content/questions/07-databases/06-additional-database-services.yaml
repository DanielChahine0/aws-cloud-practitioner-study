        why: Foreign keys can link referral rows, but a web of who referred whom is clumsy in relational tables, so this is not the best fit.
      - id: b
        text: The engine built for JSON-like documents with changing fields
        why: A document engine suits records whose fields change often, not the links between customers that referrals create.
