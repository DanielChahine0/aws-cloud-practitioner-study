questions:
  - id: q-cgtcjw
    version: 1
    status: live
    type: single
    pool: practice
    concept: purpose-built-databases
    note: m07/additional-database-services
    task: "3.4"
    level: 1
    stem: >-
      Which principle sits behind the purpose-built approach to databases on AWS?
    options:
      - id: a
        text: Pick the engine that suits each business need
        correct: true
        why: The purpose-built idea matches each database to the job it must do, since no single engine suits every need.
      - id: b
        text: Let AWS take over patching and backups
        why: Handing upkeep to AWS is the idea behind managed services, not behind choosing purpose-built engines.
      - id: c
        text: Pay only for the capacity that gets used
        why: Paying for use is a pricing idea, and it says nothing about which engine fits which data.
      - id: d
        text: Keep copies across several Availability Zones
        why: Spreading copies over zones is about resilience, not about fitting each database to its job.
    evidence:
      - Fit the database to the business need, not the data to the database, as none suits every job.
    takeaway: Purpose-built databases mean choosing the engine that fits each workload rather than forcing all data into one.
    history: []
    verified:
      keyHash: e706296ecb0f
      fullHash: a5f54ddd1920
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-tnjhy3
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: purpose-built-databases
    note: m07/additional-database-services
    task: "3.4"
    level: 2
    stem: >-
      A new developer at the cafe suggests keeping the loyalty points, the menu catalog and the web of supplier links in one relational database to keep things simple.
      Which statements reflect the purpose-built approach AWS recommends instead?
    options:
      - id: a
        text: A data set's shape decides which engine serves it best
        correct: true
        why: The three data sets differ in shape, and AWS advises fitting each one to the engine that serves it rather than forcing all into one.
      - id: b
        text: A managed engine has its OS patches applied by AWS
        why: AWS does patch a managed engine, but that holds for the one relational database too and gives no reason to split the data.
      - id: c
        text: A cache such as DAX can cut read times for DynamoDB
        why: DAX does speed up DynamoDB reads, but a cache says nothing about which database each of the three data sets belongs in.
      - id: d
        text: A managed engine can have its backups run by AWS Backup
        why: AWS Backup can protect any of these engines, but one backup tool does not decide which engine each data set should use.
      - id: e
        text: An engine like Neptune is built for one kind of workload
        correct: true
        why: Neptune is built for connected data such as the supplier links, which is why AWS steers each workload to its own engine.
    evidence:
      - Fit the database to the business need, not the data to the database, as none suits every job.
      - AWS steers each workload to its best-fit purpose-built tool, and offers more than the course covers.
      - "**Purpose-built database**: one designed for a specific workload."
    takeaway: Different data shapes call for different engines, so split workloads across best-fit databases instead of one.
    history: []
    verified:
      keyHash: c0e8a96db15d
      fullHash: 938b24879888
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-8c83x8
    version: 1
    status: live
    type: single
    pool: practice
    concept: semistructured-data
    note: m07/additional-database-services
    task: "3.4"
    level: 1
    stem: >-
      What is the term for varied, complex data that is too irregular to fit neatly into rows and columns?
    options:
      - id: a
        text: Semistructured data
        correct: true
        why: Semistructured data varies from record to record and resists a rigid table schema.
      - id: b
        text: Relational table data
        why: Relational data is the rows-and-columns kind, the very format this data does not fit.
      - id: c
        text: Fixed-width record data
        why: Fixed-width records follow a strict layout, the opposite of data that varies in shape.
      - id: d
        text: Key-value pair data
        why: Key-value data is simple lookups by key, not the complex nested data the stem describes.
    evidence:
      - Where DynamoDB handles key-value data, DocumentDB takes semistructured data too complex for rows and columns.
    takeaway: Data too varied and complex for a rigid rows-and-columns schema is called semistructured data.
    history: []
    verified:
      keyHash: 7e081eb9435a
      fullHash: bab667b2a972
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-vqd3y5
    version: 1
    status: live
    type: single
    pool: practice
    concept: semistructured-data
    note: m07/additional-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe stores its menu items as JSON-like records.
      Some carry allergens and cup sizes, seasonal drinks add extra notes, and the fields change every few weeks.
      How is this data best described?
    options:
      - id: a
        text: Semistructured data
        correct: true
        why: Records with differing, often changing fields are semistructured and suit a dynamic-schema store.
      - id: b
        text: Highly connected data
        why: The menu items are not defined by links between them, so this is not a web of relationships.
      - id: c
        text: Fixed-schema tabular data
        why: A fixed schema would break each time the menu fields change, which this data does often.
      - id: d
        text: Simple key-value data
        why: Each item holds nested, varying details, not just a single value looked up by key.
    evidence:
      - Fully managed, it stores, queries and indexes JSON-like documents with dynamic schemas, ideal when schemas change often.
      - Where DynamoDB handles key-value data, DocumentDB takes semistructured data too complex for rows and columns.
    takeaway: JSON-like records whose fields vary and change often are semistructured data, not rigid tables.
    history: []
    verified:
      keyHash: 4a434d47e78c
      fullHash: e76c98fe4434
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ywm5sp
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-documentdb
    note: m07/additional-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's catalog team already uses MongoDB drivers and code for a product catalog of JSON-like items whose fields change often.
      Which AWS database lets the team move over with few code changes?
    options:
      - id: a
        text: Amazon DocumentDB
        correct: true
        why: DocumentDB is MongoDB compatible and built for JSON-like documents with changing schemas.
      - id: b
        text: Amazon DynamoDB
        why: DynamoDB is a key-value store and does not accept the team's MongoDB drivers and code.
      - id: c
        text: Amazon Neptune
        why: Neptune is a graph database for connected data, not a home for a document catalog.
      - id: d
        text: Amazon ElastiCache
        why: ElastiCache is an in-memory cache, not a MongoDB-compatible store for the catalog.
    evidence:
      - "**MongoDB compatibility**: MongoDB APIs, drivers, tools, code and skills carry over with few changes."
      - "Use cases: content management, catalogs and inventory, user profiles and personalization."
    takeaway: A catalog of changing JSON-like documents already on MongoDB moves to DocumentDB with few code changes.
    history: []
