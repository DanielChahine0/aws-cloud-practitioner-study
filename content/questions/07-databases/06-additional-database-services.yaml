        why: This is true of DocumentDB, but it is about compute, not how storage keeps pace with growing data.
      - id: c
        text: It keeps continuous backups without extra setup
        why: This is true of DocumentDB, but backups protect data rather than make room for a growing database.
      - id: d
        text: It accepts existing MongoDB drivers and code
        why: This is true of DocumentDB, but MongoDB compatibility is about moving code over, not about storage growth.
    evidence:
      - "**Scaling**: storage grows on its own in 10 GB steps to 64 TB, compute scales either way, and it serves millions of requests per second."
    takeaway: DocumentDB storage scales automatically in 10 GB steps up to 64 TB, so it never needs manual resizing.
