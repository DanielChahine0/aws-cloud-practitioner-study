        text: The engine built for data made of many links between items
        correct: true
        why: Referrals form a web of links between customers, and AWS advises picking the engine built for that shape of data.
      - id: d
        text: The engine built for key-value items read in milliseconds
        why: Key-value items are fetched fast by their key, but that model is not built for following chains of links between customers.
    evidence:
      - Fit the database to the business need, not the data to the database, as none suits every job.
      - A fully managed graph database for highly connected data, like social webs that are clumsy in relational tables.
    takeaway: Under the purpose-built approach, the shape of the data, such as a web of referrals, decides which engine to pick.
