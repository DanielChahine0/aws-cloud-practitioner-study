    concept: amazon-dynamodb-accelerator
    note: m07/additional-database-services
    task: "3.4"
    level: 3
    stem: >-
      The cafe's ordering app reads loyalty balances from its serverless NoSQL table, and those reads slow down during the morning rush.
      The team wants a cache that comes built into that NoSQL service rather than a separate caching service it must run.
      Which option fits?
    options:
      - id: a
        text: DynamoDB Accelerator (DAX)
        correct: true
        why: DAX is the cache built into DynamoDB that sharply cuts read times for the loyalty balances.
      - id: b
        text: Amazon ElastiCache
        why: ElastiCache is a separate caching service, not the cache built into the NoSQL service itself.
      - id: c
        text: Amazon CloudFront
        why: CloudFront caches content at edge locations near users, not reads from a NoSQL table.
      - id: d
        text: Amazon RDS read replicas
        why: Read replicas offload reads from a relational database, not from a serverless NoSQL table.
    evidence:
      - "**DynamoDB Accelerator (DAX)** is a built-in cache that sharply cuts DynamoDB read times."
    takeaway: To speed up DynamoDB reads with a cache built into DynamoDB, use DAX.
