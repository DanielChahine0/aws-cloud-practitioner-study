  - id: q-4h028f
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-neptune
    note: m07/additional-database-services
    task: "3.4"
    level: 2
    stem: >-
      The cafe wants to recommend drinks based on what a customer's friends, and their friends in turn, have ordered.
      The links between customers form a dense web that must be queried in real time.
      Which AWS database fits?
    options:
      - id: a
        text: Amazon Neptune
        correct: true
        why: Neptune is a managed graph database that answers fast over highly connected data such as social links.
      - id: b
        text: Amazon DocumentDB
        why: DocumentDB stores JSON-like documents and is not tuned for walking many links between people.
      - id: c
        text: Amazon Redshift
        why: Redshift is a data warehouse for analytics, not a real-time store for friend-of-friend links.
      - id: d
        text: Amazon ElastiCache
        why: ElastiCache speeds up reads from memory but does not model or query relationships.
    evidence:
      - A fully managed graph database for highly connected data, like social webs that are clumsy in relational tables.
      - "Use cases: social network mapping, fraud detection, search and recommendations."
    takeaway: Real-time recommendations over a dense web of social links point to Neptune.
    history: []
    verified:
      keyHash: 293ae12ee115
      fullHash: 5c64a615cbd6
