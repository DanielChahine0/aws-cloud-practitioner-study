  - id: q-bqhwe9
    version: 1
    status: live
    type: single
    pool: practice
    concept: incremental-backups
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe takes its first snapshot of the menu database volume on Monday and another on Tuesday.
      Why is Tuesday's snapshot faster and cheaper than Monday's?
    options:
      - id: a
        text: It is kept in Amazon S3 across zones
        why: Monday's snapshot is stored the same way, so where it sits cannot make Tuesday's cheaper.
      - id: b
        text: It stores only the blocks that changed
        correct: true
        why: Later snapshots save just the changed blocks and point back to earlier ones for the rest.
      - id: c
        text: It can restore the whole volume alone
        why: Acting as a full copy is true of every snapshot, so it does not explain the lower cost.
      - id: d
        text: It can be copied to another Region
        why: A cross-Region copy is an extra option for any snapshot and adds cost rather than saving it.
    evidence:
      - The first snapshot is a full baseline of all blocks in use.
      - Later ones store only changed blocks and reference earlier ones, forming a chain for point-in-time recovery.
    takeaway: After the first full snapshot, each EBS snapshot stores only the blocks changed since the one before.
    history: []
    verified:
      keyHash: d37ce6478d07
      fullHash: 1819e42f5f7a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-m98nxd
    version: 1
    status: live
    type: single
    pool: practice
    concept: incremental-backups
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe has a chain of daily snapshots of one volume and deletes the oldest one to save money.
      Why can the newest snapshot still restore the whole volume?
    options:
      - id: a
        text: Each snapshot is stored redundantly in Amazon S3
        why: Redundant storage guards against hardware loss, not against a snapshot the cafe chose to delete.
      - id: b
        text: The first snapshot copied every block in use
        why: That full baseline is the one the cafe deleted, so it cannot be what the restore relies on.
      - id: c
        text: AWS keeps the blocks a remaining snapshot uses
        correct: true
        why: Deleting a snapshot frees only data no other snapshot needs, so the newest one stays complete.
      - id: d
        text: Later snapshots store only the blocks that changed
        why: Storing only changes is what makes the newest snapshot depend on older blocks, not what saves it.
    evidence:
      - Each still acts as a full copy, AWS manages the links, and deleting one frees only data no other snapshot uses.
    takeaway: Deleting an older incremental snapshot never breaks newer ones, which still restore the full volume.
    history: []
