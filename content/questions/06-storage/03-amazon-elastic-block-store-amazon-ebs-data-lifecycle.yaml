  - id: q-j1zq1t
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-data-lifecycle-manager
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe's Amazon Data Lifecycle Manager policy covers its order instances.
      The team wants backups of the data disks only, skipping each instance's boot disk.
      Which policy setting does that?
    options:
      - id: a
        text: Add cross-Region copies to the policy
        why: Cross-Region copies send snapshots to another Region, but every targeted volume is still backed up.
      - id: b
        text: Turn on fast snapshot restore in the policy
        why: Fast snapshot restore speeds up volumes made from snapshots and does not change which volumes are backed up.
      - id: c
        text: Exclude root volumes from the policy
        correct: true
        why: A policy can leave out the root volumes of the instances it covers, so only the data disks get snapshots.
      - id: d
        text: Add cross-account sharing to the policy
        why: Sharing lets another account use the snapshots, but it leaves the boot volumes inside the policy.
    evidence:
      - "Policy steps: create it (EC2 console, API, AWS CLI, SDKs or AWS CloudFormation), target volumes or instances, optionally exclude root or data volumes, set schedules, then add extras."
    takeaway: A Data Lifecycle Manager policy can target instances and exclude their root or data volumes from its snapshots.
    history: []
    verified:
      keyHash: 6baf31d903d0
      fullHash: d077fea858cd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
