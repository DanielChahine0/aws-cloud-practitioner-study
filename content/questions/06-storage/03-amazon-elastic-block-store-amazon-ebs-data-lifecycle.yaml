      The cafe wants three separate test setups, each starting with the exact data its production order volume held this morning.
      Which approach gives all three?
    options:
      - id: a
        text: Copy the morning snapshot to a second Region
        why: A cross-Region copy moves the backup elsewhere but creates no test volumes on its own.
      - id: b
        text: Create three volumes from the morning snapshot
        correct: true
        why: One snapshot can seed many new volumes, each an exact copy of the source at that moment.
      - id: c
        text: Take three fresh snapshots of the production volume
        why: New snapshots capture the volume as it stands now, not as it stood this morning.
      - id: d
        text: Share the morning snapshot with a second account
        why: Sharing grants another account use of the snapshot but sets up none of the three tests.
    evidence:
      - A snapshot can create many new volumes, each an exact copy of the source at that moment.
    takeaway: A single EBS snapshot can create many new volumes, each an exact point-in-time copy for testing or cloning.
