  - id: q-f02qh4
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-data-lifecycle-manager
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 3
    stem: >-
      The cafe chain now runs thousands of EBS volumes, and staff snapshot them by hand every week.
      Which service can create, keep and delete those snapshots on a schedule through policies?
    options:
      - id: a
        text: S3 Lifecycle
        why: S3 Lifecycle rules move or expire objects in S3 buckets and do not take EBS snapshots.
      - id: b
        text: EFS lifecycle management
        why: EFS lifecycle policies move files between EFS storage classes and do not touch EBS volumes.
      - id: c
        text: Amazon Data Lifecycle Manager
        correct: true
        why: Its policies take, retain and remove EBS snapshots on a schedule, ending the manual weekly work.
      - id: d
        text: AWS DataSync
        why: DataSync automates moving data into AWS storage and does not schedule EBS snapshots.
    evidence:
      - Snapshotting thousands of volumes by hand each week is slow and error-prone.
      - This fully managed service uses policies to create, keep and delete snapshots and EBS-backed AMIs on a schedule.
    takeaway: Policy-driven creation, retention and deletion of EBS snapshots at scale points to Amazon Data Lifecycle Manager.
    history: []
    verified:
      keyHash: 49e57c52e992
      fullHash: b619c7d2a0db
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-q27fqm
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-data-lifecycle-manager
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 1
    stem: >-
      Which actions are set up through an Amazon Data Lifecycle Manager policy?
    options:
      - id: a
        text: Copy snapshots to another AWS Region
        correct: true
        why: Cross-Region copies are one of the extra actions a policy can add to its schedule.
      - id: b
        text: Store snapshot data across several zones
        why: AWS keeps every snapshot in S3 across several Availability Zones by default, with no policy needed.
      - id: c
        text: Run snapshots during off-peak hours
        correct: true
        why: A policy schedule can place snapshots in quiet hours to limit the hit on performance.
      - id: d
        text: Keep only changed blocks in later snapshots
        why: Every EBS snapshot after the first is incremental by design, so no policy has to set this up.
      - id: e
        text: Replicate each volume inside its zone
        why: EBS replicates every volume within its Availability Zone automatically, outside any policy.
    evidence:
      - It can run snapshots off-peak to limit performance impact, purge old backups and apply one policy organization-wide, which aids compliance.
      - Extras include cross-Region copies, cross-account sharing, tags, snapshot archiving and Amazon EBS fast snapshot restore.

    takeaway: Data Lifecycle Manager policies schedule, copy and prune snapshots of resources already in AWS.
    history: []
    verified:
