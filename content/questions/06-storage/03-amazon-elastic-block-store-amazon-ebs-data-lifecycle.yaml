    type: single
    pool: practice
    concept: incremental-backups
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe starts snapshotting a new gift card volume on Monday and takes one more snapshot on Tuesday and on Wednesday.
      Which of these snapshots wrote out every block in use on the volume when it was taken?
    options:
      - id: a
        text: Only the Wednesday snapshot
        why: Wednesday's snapshot stored only the blocks changed since Tuesday and points back to older ones for the rest.
      - id: b
        text: The Monday and Tuesday snapshots
        why: Tuesday's snapshot was the second in the chain, so it stored only the blocks changed since Monday.
      - id: c
        text: Every snapshot in the chain
        why: Each snapshot acts as a full copy when restored, but only the first one stored every block itself.
      - id: d
        text: Only the Monday snapshot
        correct: true
        why: The first snapshot is the full baseline, so Monday's is the one that copied every block in use.
    evidence:
      - The first snapshot is a full baseline of all blocks in use.
      - Later ones store only changed blocks and reference earlier ones, forming a chain for point-in-time recovery.
    takeaway: Only the first EBS snapshot is a full baseline; each later one stores just the changed blocks and links back.
