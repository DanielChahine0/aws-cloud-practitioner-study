questions:
  - id: q-f73nps
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: ebs-data-lifecycle
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "2.1"
    level: 2
    stem: >-
      Under the shared responsibility model, the cafe owns the order history on its EBS volumes.
      Which of the cafe's own tasks make sure it can get that data back after a failure?
    options:
      - id: a
        text: Encrypting the sensitive data on each volume
        why: Encryption keeps the data private, but it gives the cafe no copy to recover from after a failure.
      - id: b
        text: Taking regular snapshots of each volume
        correct: true
        why: The data is the cafe's to back up, and a snapshot is the copy it restores from after a failure.
      - id: c
        text: Pruning the oldest snapshots in the chain
        why: Pruning old snapshots is the cafe's way to control cost, and it adds nothing to recovery.
      - id: d
        text: Testing that the snapshots restore correctly
        correct: true
        why: A backup the cafe never tested may fail when needed, so testing restores is how it knows recovery works.
      - id: e
        text: Deleting the volumes the cafe stops using
        why: Deprovisioning unused volumes is the cafe's job too, but it trims the bill rather than protecting data.
    evidence:
      - Your data is your job under shared responsibility, so you provision, move, deprovision and back up volumes.
      - "Your part: schedule snapshots, prune them to control cost, encrypt sensitive data, verify integrity and test restores."
    takeaway: The customer owns its EBS backups, so it must take snapshots and test that they restore before a failure strikes.
    history: []
    verified:
      keyHash: 95706c18a8dc
      fullHash: 0071eeb158c1
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-xvfy1s
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-data-lifecycle
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      Besides taking scheduled snapshots, the cafe regularly deletes the EBS volumes and old snapshots it no longer needs.
      What does the deleting achieve for the cafe?
    options:
      - id: a
        text: It keeps data through instance stops
        why: A volume keeps its data through a stop on its own, so deleting unused items adds nothing there.
      - id: b
        text: It makes later snapshots incremental
        why: Every snapshot after the first stores only changes anyway, so deleting does not cause that.
      - id: c
        text: It keeps the storage bill under control
        correct: true
        why: Volumes and snapshots cost money while they exist, so removing unused ones keeps the bill down.
      - id: d
        text: It spreads snapshots over several zones
        why: Snapshots already sit in S3 across several Availability Zones, whether or not old ones are deleted.
    evidence:
      - Lifecycle management means creating, backing up and deleting volumes and snapshots to control cost and protect data.
      - "Your part: schedule snapshots, prune them to control cost, encrypt sensitive data, verify integrity and test restores."
    takeaway: EBS lifecycle management creates, backs up and deletes volumes and snapshots to save cost and protect data.
    history: []
    verified:
      keyHash: 8c469f4bbd15
      fullHash: 471bc2bbe802
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-emk0mg
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-snapshots
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      A bad update corrupts the EBS volume that holds the cafe's order database.
      The team took regular snapshots of that volume.
      Which step brings the order data back?
    options:
      - id: a
        text: Create a new volume from the latest snapshot
        correct: true
        why: A snapshot holds the volume as it stood at one moment, so a new volume from it brings that data back.
      - id: b
        text: Take a fresh snapshot of the damaged volume
        why: A new snapshot captures the volume as it stands now, so it saves the corrupted data rather than the good data.
      - id: c
        text: Copy the latest snapshot to another Region
        why: A cross-Region copy moves the backup elsewhere, but it puts no data back on a volume the database can use.
      - id: d
        text: Delete the older snapshots in the chain
        why: Deleting old snapshots trims storage cost and does nothing to replace the corrupted data.
    evidence:
      - Restoring a volume after corruption starts from its latest snapshot.
    takeaway: To recover a corrupted EBS volume, create a new volume from its most recent snapshot.
    history: []
    verified:
      keyHash: 4909a328d9d2
      fullHash: e028b759939c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-2ajvtj
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-snapshots
    note: m06/amazon-elastic-block-store-amazon-ebs-data-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The EBS volume holding the cafe's orders lives in one Availability Zone.
      Why do its snapshots stay usable if that location goes down?
    options:
      - id: a
        text: They record the volume as of one moment
        why: Being point-in-time explains what a snapshot holds, not why it outlasts a failed Availability Zone.
      - id: b
        text: They are kept redundantly in Amazon S3
        correct: true
        why: Snapshot data is spread over several Availability Zones in S3, so losing one zone leaves it intact.
      - id: c
        text: They store only the changed blocks
        why: Storing changes keeps snapshots cheap, but it says nothing about where they survive a failure.
      - id: d
        text: They can be shared with other accounts
        why: Sharing grants access to a snapshot and does not decide which Availability Zones hold its data.
    evidence:
      - Snapshots sit in Amazon S3, redundantly across several Availability Zones.
    takeaway: EBS snapshots live in Amazon S3, spread across several Availability Zones, so they outlast a single-AZ volume.
