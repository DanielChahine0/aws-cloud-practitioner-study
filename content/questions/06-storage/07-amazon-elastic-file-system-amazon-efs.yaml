    task: "3.6"
    level: 2
    stem: >-
      The cafe stores last season's recipe photos in EFS Standard and leaves the default lifecycle policy in place.
      Nobody opens the photos for 30 days.
      Where does EFS move them next?
    options:
      - id: a
        text: EFS Infrequent Access
        correct: true
        why: By default, files idle in Standard for 30 days move to Infrequent Access.
      - id: b
        text: EFS Archive
        why: Archive is the default stop only after 90 days without access, not after 30.
      - id: c
        text: EFS One Zone-IA
        why: One Zone-IA is a single-zone class chosen up front, not where the default policy sends idle Standard files.
      - id: d
        text: EFS One Zone
        why: The default policy moves files by access between tiers, not into a single-zone class.
    evidence:
      - By default, files idle in Standard for 30 days move to IA (priced for a few reads a quarter), and after 90 days to Archive.
    takeaway: The default EFS lifecycle policy moves files idle for 30 days from Standard to Infrequent Access.
