  - id: q-qtr1qt
    version: 1
    status: live
    type: single
    pool: practice
    concept: efs-lifecycle-management
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe stores last season's recipe photos in EFS Standard and leaves the default lifecycle policy in place.
      Nobody opens the photos for 30 days.
      Where does EFS move them next?
    options:
      - id: a
        text: EFS Infrequent Access
        correct: true
        why: By default, files idle in Standard for 30 days move to Infrequent Access.
      - id: b
        text: EFS Archive
        why: Archive is the default stop only after 90 days without access, not after 30.
      - id: c
        text: EFS One Zone-IA
        why: One Zone-IA is a single-zone class chosen up front, not where the default policy sends idle Standard files.
      - id: d
        text: EFS One Zone
        why: The default policy moves files by access between tiers, not into a single-zone class.
    evidence:
      - By default, files idle in Standard for 30 days move to IA (priced for a few reads a quarter), and after 90 days to Archive.
    takeaway: The default EFS lifecycle policy moves files idle for 30 days from Standard to Infrequent Access.
    history: []
    verified:
      keyHash: 6ec1ebb253ab
      fullHash: 37115a3ffaa4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-fz2s5z
    version: 1
    status: draft
    type: single
    pool: practice
    concept: efs-lifecycle-management
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      EFS lifecycle management moves the cafe's idle staff schedules to Infrequent Access, and a schedule that a cashier opens again stays there.
      The cafe wants a reopened schedule to move back to the class it started in, with no manual step.
      Which change does that?
    options:
      - id: a
        text: Enable the optional rule that acts when a file is read
        correct: true

        why: An optional lifecycle rule sends files read in IA or Archive back to Standard, which is off by default.
      - id: b
        text: Lengthen the idle time before files move to IA
        why: A longer idle period only delays the move to IA and never brings a reopened file back.
      - id: c
        text: Move the file system to the One Zone classes
        why: One Zone classes change resilience and price, not where a file goes after it is read.
      - id: d
        text: Send idle files straight to EFS Archive instead
        why: Archive is a colder class, so this moves files further from Standard rather than back to it.
    evidence:
      - An optional rule returns files to Standard when read in IA or Archive, but by default they stay put.
      - New file systems come with preset, customizable policies that move files between classes by access.
    takeaway: To bring files read in EFS IA or Archive back to Standard, turn on the optional return rule, since the default leaves them put.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 1 is the longest and most specific, describing an 'optional rule'.)"
