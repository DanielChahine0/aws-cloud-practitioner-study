        text: EFS is a Linux file system, while EBS is a volume for apps
        why: The kind of storage is a real difference, but being a file system is not what stops the space from running out.
    evidence:
      - EBS is a single-zone drive for one instance, while EFS is a shared, Regional, self-scaling file system.
      - It grows to petabytes and shrinks as files change, without disrupting applications.
    takeaway: A full EBS volume stays full until someone resizes it, while EFS grows as files are written.
