    concept: efs-lifecycle-management
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      EFS lifecycle management moves the cafe's idle staff schedules to Infrequent Access, and a schedule that a cashier opens again stays there.
      The cafe wants a reopened schedule to move back to the class it started in, with no manual step.
      Which change does that?
    options:
      - id: a
        text: Turn on the lifecycle rule that runs when a file is read
        correct: true
        why: An optional lifecycle rule sends files read in IA or Archive back to Standard, and it is off by default.
      - id: b
        text: Lengthen the idle time before the rule moves files to IA
        why: A longer idle period only delays the move to IA and never brings a reopened file back.
      - id: c
        text: Change the rule so idle files go straight to EFS Archive
        why: Archive is a colder class, so this moves files further from Standard rather than back to it.
      - id: d
        text: Move the file system over to the One Zone storage classes
        why: One Zone classes change resilience and price, not where a file goes after it is read.
    evidence:
      - An optional rule returns files to Standard when read in IA or Archive, but by default they stay put.
      - New file systems come with preset, customizable policies that move files between classes by access.
    takeaway: To bring files read in EFS IA or Archive back to Standard, turn on the optional return rule, since the default leaves them put.
    history: []
