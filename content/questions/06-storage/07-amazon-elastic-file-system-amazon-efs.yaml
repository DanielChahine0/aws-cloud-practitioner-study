  - id: q-ewsktv
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-vs-efs
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe runs web servers in two Availability Zones, and all of them must read the same folder of menu images.
      Why does Amazon EFS suit this better than Amazon EBS?
    options:
      - id: a
        text: EFS is Regional and shared, while EBS serves one instance
        correct: true
        why: EFS is Regional and shared by many instances, while an EBS volume stays in one zone with one instance.
      - id: b
        text: EFS bills for storage used, while EBS bills for size set
        why: The billing models do differ, but pricing does not let servers in two zones share one folder.
      - id: c
        text: EFS shrinks as files are deleted, while EBS stays fixed
        why: Shrinking with deletes saves money, but it does not give servers in both zones the same folder.
      - id: d
        text: EFS is a Linux file system, while EBS holds files or databases
        why: Both can store image files, so the kind of storage alone is not why EBS fails servers in two zones.
    evidence:
      - EBS is a single-zone drive for one instance, while EFS is a shared, Regional, self-scaling file system.
    takeaway: Servers spread across zones that share files need Regional, shared EFS rather than a single-zone EBS volume.
