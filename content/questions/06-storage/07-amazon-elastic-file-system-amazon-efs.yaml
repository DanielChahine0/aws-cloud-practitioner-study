  - id: q-0pdbdz
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-vs-efs
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe stores customer photo uploads on an Amazon EBS volume, and one busy weekend the volume filled up and new uploads failed.
      The team is weighing a move to Amazon EFS.
      Which difference between the two services would keep this failure from happening again on EFS?
    options:
      - id: a
        text: EFS grows as data is written, while EBS keeps its set size
        correct: true
        why: An EBS volume never grows by itself, while EFS expands with each write, so uploads keep landing.
      - id: b
        text: EFS serves many instances, while EBS serves one instance
        why: Shared access is a real difference, but more readers and writers does not give a full drive more room.
      - id: c
        text: EFS reaches any zone in a Region, while EBS stays in one zone
        why: Regional reach is a real difference, but where the files can be opened does not change how much they can hold.
