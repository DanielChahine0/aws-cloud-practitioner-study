  - id: q-e5svh8
    version: 1
    status: live
    type: single
    pool: practice
    concept: efs-storage-classes
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe keeps old supplier contracts on Amazon EFS and opens them once a year at most.
      Slower access is fine, and the cafe wants the lowest storage price.
      Which EFS storage class fits?
    options:
      - id: a
        text: EFS Archive
        correct: true
        why: Archive is built for data read a few times a year or less and costs less than Infrequent Access.
      - id: b
        text: EFS Standard
        why: Standard gives sub-millisecond access at a higher price, which these rarely opened files do not need.
      - id: c
        text: EFS Standard-IA
        why: Infrequent Access suits files read a few times a quarter and costs more than Archive for yearly reads.
      - id: d
        text: EFS One Zone
        why: One Zone lowers cost by using a single zone but is still priced for files in regular use.
    evidence:
      - "EFS Archive: cold data read a few times a year or less that can skip Standard's sub-millisecond latency, up to 50% cheaper than Infrequent Access."
    takeaway: Cold EFS data read a few times a year or less belongs in EFS Archive, the cheapest class.
    history: []
    verified:
      keyHash: 906490edeb7b
      fullHash: dc6ef02e2ed4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-tqtfyg
    version: 1
    status: live
    type: single
    pool: practice
    concept: efs-storage-classes
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe's test team edits scratch files on Amazon EFS every day, and the files can be rebuilt if lost.
      The team is happy to give up some resilience if that lowers the storage price.
      Which EFS storage class fits?
    options:
      - id: a
        text: EFS One Zone
        correct: true
        why: One Zone keeps data in a single zone for a lower price, which suits rebuildable files in daily use.
      - id: b
        text: EFS Standard
        why: Standard spreads data across zones for top availability, which costs more than this team wants to pay.
      - id: c
        text: EFS Archive
        why: Archive is for data read a few times a year or less, not files edited every day.
      - id: d
        text: EFS Standard-IA
        why: Standard-IA is Multi-AZ and priced for rare reads, so it neither saves on resilience nor suits daily edits.
    evidence:
      - "EFS One Zone and One Zone-IA: one Availability Zone, for lower cost."
      - "EFS Standard and Standard-IA: Multi-AZ, with top durability and availability, at a higher price."
    takeaway: EFS One Zone classes trade multi-zone resilience for a lower price on data you can afford to lose access to.
    history: []
