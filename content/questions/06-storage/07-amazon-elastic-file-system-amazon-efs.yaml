  - id: q-8yk0c2
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: ebs-vs-efs
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 1
    stem: >-
      Which traits belong to Amazon EBS rather than Amazon EFS?
    options:
      - id: a
        text: Serves a single instance, much like a hard drive
        correct: true
        why: An EBS volume attaches to one instance as a drive, while EFS is shared by many at once.
      - id: b
        text: Keeps a set size until someone changes it
        correct: true
        why: EBS capacity is fixed, so a full volume stays full, while EFS grows as data is written.
      - id: c
        text: Expands on its own as more data is written
        why: Growing with writes is an EFS trait, since an EBS volume keeps the size it was given.
      - id: d
        text: Serves many instances at the very same time
        why: Concurrent access from many instances is what EFS offers, not EBS.
      - id: e
        text: Keeps data as objects inside storage buckets
        why: Objects in buckets describe Amazon S3, which is neither an EBS nor an EFS trait.
    evidence:
      - EBS is a single-zone drive for one instance, while EFS is a shared, Regional, self-scaling file system.
    takeaway: EBS is a fixed-size drive for one instance, while EFS is a shared file system that grows by itself.
