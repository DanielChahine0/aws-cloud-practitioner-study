questions:
  - id: q-s6gncn
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-efs
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe runs a fleet of Linux EC2 instances that crunch one shared sales dataset, and every instance must see new files the moment they land.
      The dataset keeps growing, and nobody wants to resize storage by hand.
      Which storage service fits?
    options:
      - id: a
        text: Amazon EFS
        correct: true
        why: EFS is a shared file system that many instances use at once, and it grows on its own as files are written.
      - id: b
        text: Amazon EBS
        why: An EBS volume serves one instance like a drive and keeps a fixed size, so the fleet cannot share it as it grows.
      - id: c
        text: Amazon EC2 instance store
        why: Instance store is local to a single host, so the other instances in the fleet never see its files.
      - id: d
        text: AWS Storage Gateway
        why: Storage Gateway links on-premises sites to cloud storage, which this all-cloud fleet does not need.
    evidence:
      - Thousands of concurrent NFS connections let many EC2 instances share files, and every change is visible to all of them at once, with no manual syncing.
      - It grows to petabytes and shrinks as files change, without disrupting applications.
    takeaway: Many cloud instances sharing one growing set of files, with no capacity planning, points to Amazon EFS.
    history: []
    verified:
      keyHash: 8b92ff5caf67
      fullHash: 98383bd572df
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-8979x3
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-efs
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe worries that a shared file system will run out of space, and also that it will pay for room it never fills.
      Which Amazon EFS traits answer these two worries?
    options:
      - id: a
        text: Capacity expands and contracts automatically as files come and go
        correct: true
        why: EFS grows and shrinks with the files stored, so it never fills up and needs no resize step.
      - id: b
        text: The bill covers only the storage in use, with no setup charge
        correct: true
        why: EFS has no minimum fee or setup cost, so the cafe pays only for the data it keeps.
      - id: c
        text: Standard classes copy data across zones within one Region
        why: Multi-zone copies protect against a zone failure, which is about resilience rather than space or cost.
      - id: d
        text: Many EC2 instances can open the same files at the same time
        why: Shared access lets a fleet work on one dataset, but it does nothing about space or paying for unused room.
      - id: e
        text: Clients reach the files over the Linux NFS file-sharing protocol
        why: The protocol decides how apps talk to EFS, not how much space there is or what the cafe pays.
    evidence:
      - It grows to petabytes and shrinks as files change, without disrupting applications.
      - No minimum fee or setup cost, and you pay only for storage used.
    takeaway: EFS scales itself up and down with your files and bills only for the storage you actually use.
    history: []
    verified:
      keyHash: 4ae545cc7774
      fullHash: 0b4b9b7b0b5d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7511c1
    version: 1
    status: live
    type: single
    pool: practice
    concept: network-file-system
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 1
    stem: >-
      Amazon EFS serves its data to clients using NFS.
      What is NFS?
    options:
      - id: a
        text: The Linux protocol for shared access to files
        correct: true
        why: NFS is the Linux file-sharing protocol, which is how EFS serves files to many instances.
      - id: b
        text: The Windows protocol for shared access to files
        why: That describes SMB, the Windows file-sharing protocol, not the one EFS uses.
      - id: c
        text: The web interface for keeping objects in buckets
        why: Buckets and objects belong to object storage such as Amazon S3, not to the NFS file protocol.
      - id: d
        text: The disk interface for attaching block volumes
        why: Attaching a block volume to one host describes Amazon EBS, not the file protocol EFS uses.
    evidence:
      - "**Network File System (NFS)**: the Linux file-sharing protocol EFS uses."
    takeaway: NFS is the Linux network file-sharing protocol that Amazon EFS speaks to its clients.
    history: []
    verified:
      keyHash: 1ac259ab336e
      fullHash: 347711b00775
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-hx4yk6
    version: 1
    status: live
    type: single
    pool: practice
    concept: network-file-system
    note: m06/amazon-elastic-file-system-amazon-efs
    task: "3.6"
    level: 2
    stem: >-
      The cafe's inventory program runs on a Linux server and saves its data with ordinary file reads and writes.
      Why can it switch to Amazon EFS without code changes?
    options:
      - id: a
        text: EFS offers a POSIX file system over the NFS protocol
        correct: true
        why: EFS uses the Linux NFS protocol and supports POSIX-compliant apps, so the program keeps its normal file calls.
      - id: b
        text: EFS grows and shrinks automatically as files change
        why: Elastic capacity removes resizing work, but it is not what lets the program keep its file calls.
      - id: c
        text: EFS Standard copies data across zones in a Region
        why: Multi-zone copies keep files available in a zone failure, which has nothing to do with code changes.
      - id: d
        text: EFS charges no minimum fee and no setup cost
        why: Pay-for-use pricing affects the bill, not whether the program can use EFS without rewriting.
    evidence:
      - EFS is a fully managed, elastic file service on the Linux NFS protocol, supporting POSIX-compliant Linux apps.
    takeaway: Because EFS speaks NFS and supports POSIX, existing Linux apps can use it as a normal file system.
    history: []
