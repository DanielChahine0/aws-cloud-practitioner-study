  - id: q-zmn8cp
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-bucket-policies
    note: m06/amazon-s3-demonstration
    task: "2.3"
    level: 2
    stem: >-
      The cafe keeps Block Public Access turned on where its sales reports sit in S3, so the object URLs stay closed to the public.
      Its accountant's AWS account still needs to read the reports.
      Which permissions setting decides exactly who can reach the objects?
    options:
      - id: a
        text: The object ownership setting
        why: Object ownership sets who owns the objects uploaded to the bucket, not which accounts may reach them.
      - id: b
        text: The Block Public Access setting
        why: Block Public Access only keeps outsiders out, and it does not name the accounts that may get in.
      - id: c
        text: The bucket policy
        correct: true
        why: With Block Public Access on, the bucket policy states exactly which accounts, such as the accountant's, may reach the reports.
      - id: d
        text: The CORS configuration
        why: CORS governs requests that web pages on other sites make to the bucket, not which accounts may read it.
    evidence:
      - With Block Public Access on, the bucket policy decides exactly who gets in.
      - "Permissions: Block Public Access, the bucket policy, object ownership and cross-origin resource sharing (CORS)."
    takeaway: When Block Public Access is on, an S3 bucket policy is what decides exactly which accounts can reach the objects.
