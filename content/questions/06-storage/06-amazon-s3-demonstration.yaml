  - id: q-vh42fg
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-object-metadata
    note: m06/amazon-s3-demonstration
    task: "3.6"
    level: 2
    stem: >-
      The cafe wants to check the size and storage class of every menu image in its bucket.
      Staff never typed those details in when they uploaded the images.
      Where do those details come from?
    options:
      - id: a
        text: User-defined metadata
        why: User-defined metadata holds only details that staff add themselves, such as tags.
      - id: b
        text: System-defined metadata
        correct: true
        why: S3 records basics such as size, creation date and storage class on its own for every object.
      - id: c
        text: The bucket policy
        why: A bucket policy controls who may reach the objects and does not describe each object.
      - id: d
        text: The object key
        why: The key only names the object within its bucket and carries no size or class details.
    evidence:
      - System-defined metadata records basics such as creation date, size and storage class.
      - User-defined metadata holds your own details, such as tags.
    takeaway: S3 records system-defined metadata like size and storage class itself, while user-defined metadata holds your own details.
    history: []
