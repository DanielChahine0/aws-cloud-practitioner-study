        why: Each EBS volume lives in one Availability Zone, where EBS replicates it.
      - id: c
        text: Across two or more Regions
        why: A volume sits in one zone of one Region, and snapshots are the way to carry its data elsewhere.
      - id: d
        text: At an edge location near its users
        why: Edge locations serve cached content, while a volume sits in one Availability Zone beside its instance.
    evidence:
      - A volume lives in one Availability Zone, and so in one Region, and snapshots carry its data elsewhere.
    takeaway: An EBS volume sits in one Availability Zone, and snapshots carry its data to other zones or Regions.
