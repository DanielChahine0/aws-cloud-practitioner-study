  - id: q-nzm8sc
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-volume-types
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 2
    stem: >-
      During the lunch rush the cafe's order database is slowed down by its EBS volume.
      The cafe cannot take the database offline.
      What should it do?
    options:
      - id: a
        text: Take an incremental snapshot of the volume
        why: EBS does back volumes up with snapshots, but a backup does not change how fast the volume performs.
      - id: b
        text: Raise the volume's IOPS by changing its type
        correct: true
        why: EBS lets you change a volume's type, size or IOPS on the fly without downtime, so the database stays up.
      - id: c
        text: Attach the volume to a bigger instance type
        why: Reattaching does keep the data, but detaching first takes the database offline, which the cafe must avoid.
      - id: d
        text: Copy the volume's data into another Region
        why: Snapshots can carry the data to another Region, but that copy does not speed up the volume in use.
    evidence:
      - "Cost and performance tuning: change type, size or IOPS on the fly without downtime."
      - "Instance type changes: reattach a volume to a bigger or smaller instance and keep the data."
    takeaway: Changing an EBS volume's type or IOPS on the fly raises performance without taking the database down.
    history: []
