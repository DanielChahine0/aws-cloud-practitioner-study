    stem: >-
      Match each kind of storage to what happens to its data.
    pairs:
      - left: Amazon EC2 instance store
        right: Erased when the instance stops or terminates
        why: Instance store is ephemeral, so a stop or termination wipes its data.
      - left: EBS volume
        right: Kept when the instance stops and starts again
        why: An EBS volume lives apart from the host, so its data is still there after a stop and a later start.
      - left: Incremental EBS snapshot
        right: Copies data to another Availability Zone or Region
        why: Snapshots carry a volume's data to other zones or Regions for recovery or migration.
    evidence:
      - Instance store does not persist, so a stop or termination erases it.
      - They live apart from the host on durable SSD or HDD media, so data survives stops, starts and terminations.
      - "Migration and disaster recovery: snapshots copy data to other Availability Zones or Regions and restore it there."
    takeaway: Instance store data is lost on stop, EBS volume data persists, and snapshots carry it elsewhere.
