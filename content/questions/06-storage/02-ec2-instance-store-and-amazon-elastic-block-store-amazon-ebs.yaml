    concept: ebs-volume-types
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 1
    stem: >-
      The cafe compares two EBS volumes of different volume types.
      Which properties differ because of the volume type itself?
    options:
      - id: a
        text: Price of the volume
        correct: true
        why: Each volume type carries a different price, so the choice of type changes the cost.
      - id: b
        text: Availability Zone of the volume
        why: Volumes do sit in different zones, but the zone is picked at creation and not set by the type.
      - id: c
        text: Performance in IOPS
        correct: true
        why: Volume types differ in performance, which is measured in IOPS.
      - id: d
        text: Instance the volume attaches to
        why: Volumes do attach to different instances, but that is the cafe's choice and not set by the type.
      - id: e
        text: Snapshots kept for backup
        why: Volumes can have different snapshots, but backups come from the cafe's schedule, not from the type.
    evidence:
      - Volume types differ in price and in performance, measured in IOPS (input/output operations per second) and tied to type and often size.
      - A volume lives in one Availability Zone, and so in one Region, and snapshots carry its data elsewhere.
    takeaway: EBS volume types trade off price against performance, which is measured in IOPS.
