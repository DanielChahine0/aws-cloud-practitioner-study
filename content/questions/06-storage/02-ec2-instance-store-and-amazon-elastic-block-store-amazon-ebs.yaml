  - id: q-faakbx
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-volumes
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 2
    stem: >-
      The EBS volume behind the cafe's order database is almost full, and orders keep coming in.
      What should the cafe do so that volume can hold more orders?
    options:
      - id: a
        text: Modify the volume to raise its IOPS
        why: Raising IOPS speeds up reads and writes but leaves the volume's capacity exactly where it was.
      - id: b
        text: Modify the volume to raise its size
        correct: true
        why: A volume never grows on its own, so the cafe modifies it to a larger size, with no downtime.
      - id: c
        text: Modify the volume to change its type
        why: A new volume type changes price and performance, not how much data the volume can hold.
      - id: d
        text: Take an incremental snapshot of the volume
        why: A snapshot backs the data up to Amazon S3 but leaves the volume just as full as before.
    evidence:
      - A volume never grows by itself, so you modify it to add capacity.
      - "Cost and performance tuning: change type, size or IOPS on the fly without downtime."
    takeaway: An EBS volume has a fixed size until you modify it, and you can enlarge it without downtime.
