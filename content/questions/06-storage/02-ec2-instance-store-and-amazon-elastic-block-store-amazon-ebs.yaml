questions:
  - id: q-11n76v
    version: 1
    status: live
    type: single
    pool: practice
    concept: ec2-instance-store
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 2
    stem: >-
      Each night a virtual server crunches the cafe's sales figures and needs fast scratch disk space for intermediate results.
      The results are thrown away once the report is built.
      Which storage fits this scratch space at no extra cost?
    options:
      - id: a
        text: Amazon Elastic Block Store
        why: An EBS volume is billed on its own and keeps data the cafe is about to discard anyway.
      - id: b
        text: Amazon EC2 instance store
        correct: true
        why: Instance store comes with many instance types and gives very fast I/O for data that can be lost.
      - id: c
        text: Amazon Elastic File System
        why: EFS is a shared network file system billed separately, which this single throwaway workload does not need.
      - id: d
        text: Amazon Simple Storage Service
        why: S3 is separately billed object storage, not fast local disk for intermediate processing results.
    evidence:
      - Being ephemeral, it suits data you can lose, such as buffers, caches and scratch space for heavy processing.
      - "Benefits: included with many instance types at no extra cost, with very low latency and high I/O because it sits on the host."
    takeaway: Temporary scratch data that needs very fast I/O fits instance store, which many instance types include at no extra cost.
    history: []
    verified:
      keyHash: 0c47adceb2b7
      fullHash: 26d3f0d4d1a0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bz0asb
    version: 1
    status: live
    type: single
    pool: practice
    concept: ec2-instance-store
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 1
    stem: >-
      Where does the data in an Amazon EC2 instance store physically live?
    options:
      - id: a
        text: On a separate volume replicated within one Availability Zone
        why: That describes an EBS volume, which lives apart from the host rather than on it.
      - id: b
        text: In a shared file system that many instances mount at once
        why: A shared file system describes Amazon EFS, while instance store serves one instance only.
      - id: c
        text: On disks attached to the host computer running the instance
        correct: true
        why: Instance store is disk physically attached to the host, which is why it is so fast and so temporary.
      - id: d
        text: In objects stored in a bucket outside the instance's host
        why: Objects in a bucket describe Amazon S3, not the local disk of the instance's host.
    evidence:
      - Instance store is disk physically attached to the instance's host, not a stand-alone service, and is the default storage on some instance types.
    takeaway: Instance store is disk on the instance's own host, so it is fast but tied to that host.
    history: []
    verified:
      keyHash: e9d73866e830
      fullHash: f5b1ec01736e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-n4kd9s
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ebs
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 3
    stem: >-
      The cafe runs its order database on one EC2 instance.
      It needs low-latency block storage for that instance whose data stays intact when the instance is stopped for maintenance.
      Which service fits?
    options:
      - id: a
        text: Amazon EC2 instance store
        why: Instance store is erased when the instance stops, so the order data would be lost.
      - id: b
        text: Amazon EFS
        why: EFS is a shared file system for many instances, not a block volume for one database server.
      - id: c
        text: Amazon S3
        why: S3 stores objects, not block storage that a database writes to like a disk.
      - id: d
        text: Amazon EBS
        correct: true
        why: An EBS volume gives one instance persistent, low-latency block storage that survives stops.
    evidence:
      - They live apart from the host on durable SSD or HDD media, so data survives stops, starts and terminations.
      - A volume gives consistent low latency, attaches to one instance at a time, and can be backed up, resized and moved to another instance.
    takeaway: A database on one instance that must survive stops needs persistent, low-latency block storage from Amazon EBS.
    history: []
    verified:
      keyHash: 3ac5d46a36e2
      fullHash: cec32142282c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-q4ba57
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-ebs
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 1
    stem: >-
      Which statements describe how Amazon EBS guards a volume's data against loss?
    options:
      - id: a
        text: A volume is replicated inside its zone.
        correct: true
        why: EBS replicates each volume inside its Availability Zone, so one failed copy does not lose the data.
      - id: b
        text: A volume attaches to one instance.
        why: This is true of EBS, but it limits how a volume is shared rather than protecting its data.
      - id: c
        text: A volume is backed up by snapshots.
        correct: true
        why: Incremental EBS snapshots keep backup copies that can be restored if a volume's data is lost.
      - id: d
        text: A volume type sets price and IOPS.
        why: This is true of EBS, but it describes cost and speed rather than any protection of the data.
      - id: e
        text: A volume can be resized while in use.
        why: This is true of EBS, but resizing changes capacity and does nothing to guard the data.
    evidence:
      - EBS replicates each volume automatically within its Availability Zone for availability and durability.
      - Back volumes up with incremental Amazon EBS snapshots.
      - A volume gives consistent low latency, attaches to one instance at a time, and can be backed up, resized and moved to another instance.
    takeaway: EBS replicates each volume inside its Availability Zone and backs volumes up with incremental snapshots.
    history: []
    verified:
      keyHash: 81dedd08a4d3
      fullHash: feb4bc64b2aa
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-tqfhs2
    version: 1
    status: live
    type: single
    pool: practice
    concept: ebs-volumes
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 2
    stem: >-
      The cafe's inventory app needs more CPU and memory, so the team moves it to a more powerful EC2 instance.
      The app's data sits on an EBS volume.
      Which EBS capability lets the app keep using that same data after the move?
    options:
      - id: a
        text: A volume can be detached and attached elsewhere
        correct: true
        why: An EBS volume can be moved to another instance, so the data follows the app to the more powerful machine.
      - id: b
        text: A volume can switch to a different volume type
        why: EBS can switch a volume's type on the fly, but a new type does not connect the volume to the new instance.
      - id: c
        text: A volume can be enlarged to hold more data
        why: EBS can enlarge a volume without downtime, but more capacity does not connect it to the new instance.
      - id: d
        text: A volume can be tuned to deliver more IOPS
        why: EBS can raise IOPS without downtime, but that only tunes speed and leaves the volume where it was.
    evidence:
      - A volume gives consistent low latency, attaches to one instance at a time, and can be backed up, resized and moved to another instance.
      - "Instance type changes: reattach a volume to a bigger or smaller instance and keep the data."
      - "Cost and performance tuning: change type, size or IOPS on the fly without downtime."
    takeaway: Reattaching an EBS volume to a different instance type keeps the data when the cafe resizes its instance.
