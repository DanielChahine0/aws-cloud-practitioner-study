    concept: data-persistence
    note: m06/ec2-instance-store-and-amazon-elastic-block-store-amazon-ebs
    task: "3.6"
    level: 2
    stem: >-
      The cafe keeps a menu image cache on an EC2 instance's instance store.
      To save money it stops the instance every night and starts it again each morning.
      Every morning the cache is empty and must be rebuilt.
      Which fact explains this?
    options:
      - id: a
        text: EBS volumes keep their data through a stop and start.
        why: This is true of EBS, but the cache sits on instance store, so it says nothing about the empty cache.
      - id: b
        text: Snapshots can copy a volume's data to another Region.
        why: This is true of EBS snapshots, but it describes backup and migration, not why the cache is gone.
      - id: c
        text: Instance store gives very low latency and high I/O.
        why: This is true of instance store, but speed does not explain why the cached images disappear overnight.
      - id: d
        text: Instance store is erased when its instance is stopped.
        correct: true
        why: Stopping the instance erases instance store, so the cache starts empty each morning.
    evidence:
      - Stopping or terminating the instance erases it, since a restarted instance usually lands on another host without that disk.
    takeaway: Instance store data does not survive a stop, so anything kept there must be safe to lose and rebuild.
