  - id: q-2cyvah
    version: 1
    status: live
    type: single
    pool: practice
    concept: object-storage
    note: m06/introduction-to-storage
    task: "3.6"
    level: 2
    stem: >-
      Customers upload photos of their latte art to the cafe's app, and the collection grows every week.
      The app saves each photo once, fetches it later by its own ID, and never edits it.
      Which type of storage fits these photos?
    options:
      - id: a
        text: Block storage
        why: Block storage splits data into blocks so small edits are quick, which photos that are never edited do not need.
      - id: b
        text: File storage
        why: File storage shares a folder hierarchy over a network, while these photos are fetched by ID with no folders.
      - id: c
        text: Object storage
        correct: true
        why: Object storage keeps each photo whole as an object with a unique ID, in flat buckets with room to keep growing.
      - id: d
        text: Ephemeral storage
        why: Ephemeral storage loses its data when the instance stops or terminates, so the uploaded photos would not last.
    evidence:
      - An object holds data, a unique ID and metadata, and any change rewrites the whole object.
      - Objects sit in flat buckets with practically unlimited room for unstructured data, and rich metadata helps search and analytics.
    takeaway: Write-once files fetched by a unique ID from an ever-growing collection point to object storage in flat buckets.
    history: []
    verified:
      keyHash: 1f548698ec20
      fullHash: cc1ec8dbd5f3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
