    level: 1
    stem: >-
      The cafe's order database updates a few small records many times a minute.
      Which trait of block storage makes it a good fit for this database?
    options:
      - id: a
        text: Each object carries its own ID and its metadata
        why: A unique ID and metadata per object describe object storage, where any change rewrites the whole object.
      - id: b
        text: Many servers share one folder tree over a network
        why: A shared folder tree describes file storage, which is not what makes block storage fast for small edits.
      - id: c
        text: An edit rewrites only the pieces it touches
        correct: true
        why: Block storage rewrites just the changed blocks, so the many small record updates stay quick.
      - id: d
        text: Flat buckets hold practically unlimited data
        why: Flat buckets with nearly unlimited room describe object storage, not how block storage handles edits.
    evidence:
      - Data is split into blocks for fast access, and an edit rewrites only changed blocks, which suits frequently updated apps and databases.
    takeaway: Block storage suits busy databases because an edit rewrites only the blocks that changed.
