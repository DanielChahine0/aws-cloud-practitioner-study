  - id: q-j3gga4
    version: 1
    status: live
    type: single
    pool: practice
    concept: point-in-time-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 1
    stem: >-
      What does point-in-time recovery let a team do?
    options:
      - id: a
        text: Restore a system as it was at a chosen earlier moment
        correct: true
        why: It brings the system back to the state it held at the moment the team picks.
      - id: b
        text: Copy each changed disk block to another location
        why: Copying changed blocks is replication, which keeps a copy current rather than going back.
      - id: c
        text: Move a server to AWS for good and retire the original
        why: A permanent move is a migration, not a return to an earlier state.
      - id: d
        text: Run a recovery drill while production keeps running
        why: A drill tests recovery but does not choose an earlier state to restore.
    evidence:
      - "**Point-in-time recovery**: restoring a system as it stood at a chosen earlier moment."
    takeaway: Point-in-time recovery restores a system to how it stood at a moment you choose in the past.
    history: []
    verified:
