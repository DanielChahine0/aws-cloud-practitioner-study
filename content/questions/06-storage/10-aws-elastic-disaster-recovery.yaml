questions:
  - id: q-akpxfz
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-elastic-disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 3
    stem: >-
      The cafe runs its ordering servers in a back office.
      It wants them copied to AWS nonstop so they can come back up in AWS within minutes if the office hardware fails.
      Which service fits?
    options:
      - id: a
        text: AWS Storage Gateway
        why: Storage Gateway links local apps to AWS storage, but it does not keep whole servers ready to recover in AWS.
      - id: b
        text: AWS Application Migration Service
        why: This service moves applications to AWS for good, rather than keeping standby replicas for a failure.
      - id: c
        text: AWS Elastic Disaster Recovery
        correct: true
        why: Its agents replicate the servers to AWS continuously, so they can be recovered in AWS within minutes.
      - id: d
        text: AWS Backup
        why: AWS Backup centralizes scheduled backups, not nonstop server replication for recovery in minutes.
    evidence:
      - Lightweight agents on source servers replicate block-level data to AWS nonstop, without Storage Gateway.
      - Exact, current replicas let servers recover in the target AWS Region within minutes, with point-in-time recovery.
    takeaway: Nonstop server replication to AWS with recovery in minutes points to AWS Elastic Disaster Recovery, not Storage Gateway.
    history: []
    verified:
      keyHash: 68ce7e2b7b8a
      fullHash: 9eb6ea35338a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bvas64
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-elastic-disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 2
    stem: >-
      The cafe's part-time IT helper built its old server recovery plan by hand, and one skipped step left a till server impossible to restore.
      The owner now protects those servers with AWS Elastic Disaster Recovery.
      Which benefit of the service guards against another skipped step?
    options:
      - id: a
        text: It protects physical, virtual and cloud servers
        why: The service does cover many kinds of servers, but that range says nothing about avoiding a missed step when setting it up.
      - id: b
        text: Its agents copy disk data to AWS nonstop
        why: Nonstop replication keeps the copy current, but the helper could still miss a step if the setup stayed by hand.
      - id: c
        text: Its console automation replaces manual work
        correct: true
        why: The console automates the setup the helper once did by hand, so no step depends on someone remembering it.
      - id: d
        text: It bills pay-per-use on low-cost storage
        why: Pay-per-use pricing on low-cost storage keeps the bill down, but it does nothing to stop a skipped setup step.
    evidence:
      - Console automation replaces error-prone manual setup.
    takeaway: Elastic Disaster Recovery automates recovery setup in its console, removing the error-prone manual steps of a hand-built plan.
    history: []
    verified:
