  - id: q-tfxmrw
    version: 1
    status: live
    type: single
    pool: practice
    concept: block-level-replication
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 1
    stem: >-
      When does block-level replication copy a server's data to the other location?
    options:
      - id: a
        text: Once each night at a set time
        why: A nightly run misses every change made since the last one, so it is a scheduled backup instead.
      - id: b
        text: Only when an admin starts a copy
        why: A manual copy waits on a person, while this replication follows each change on its own.
      - id: c
        text: Each time data on the disk changes
        correct: true
        why: It copies the changed pieces of the disk elsewhere as each change happens.
      - id: d
        text: Whenever a weekly schedule fires
        why: A weekly schedule leaves days of changes uncopied, which this replication avoids.
    evidence:
      - "**Block-level replication**: copying disk blocks elsewhere as they change."
    takeaway: Block-level replication copies disk changes to another location as they happen, not on a schedule.
    history: []
    verified:
      keyHash: 2ad5eb105624
      fullHash: 8a2bad6104aa
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
