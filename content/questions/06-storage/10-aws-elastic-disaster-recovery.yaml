    type: single
    pool: practice
    concept: block-level-replication
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 2
    stem: >-
      The cafe's point-of-sale server records new orders all day.
      The cafe wants a copy of the whole server in AWS that stays current, so a failure loses almost no orders.
      Which kind of copying fits?
    options:
      - id: a
        text: Nightly incremental snapshots of its disk volumes
        why: Nightly snapshots leave out every order taken since the last one, so the copy is not current.
      - id: b
        text: Continuous copying of its order files to Amazon S3
        why: Copying only the order files leaves the rest of the server out of the copy in AWS.
      - id: c
        text: Weekly AWS Backup jobs that copy its disk volumes
        why: Weekly backup jobs leave days of orders out of the copy in AWS.
      - id: d
        text: Continuous copying of changed blocks on its disks
        correct: true
        why: Changed disk blocks of the whole server reach AWS as they happen, so the copy stays current.
    evidence:
      - Continuous block-level replication enables recovery in minutes.
      - Exact, current replicas let servers recover in the target AWS Region within minutes, with point-in-time recovery.
      - "**Block-level replication**: copying disk blocks elsewhere as they change."
    takeaway: Continuous block-level replication keeps an up-to-date copy, so a failure loses very little data.
