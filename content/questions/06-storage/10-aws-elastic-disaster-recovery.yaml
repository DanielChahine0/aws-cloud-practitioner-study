questions:
  - id: q-akpxfz
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-elastic-disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 3
    stem: >-
      The cafe runs its ordering servers in a back office.
      It wants them copied to AWS nonstop so they can come back up in AWS within minutes if the office hardware fails.
      Which service fits?
    options:
      - id: a
        text: AWS Storage Gateway
        why: Storage Gateway links local apps to AWS storage, but it does not keep whole servers ready to recover in AWS.
      - id: b
        text: AWS Application Migration Service
        why: This service moves applications to AWS for good, rather than keeping standby replicas for a failure.
      - id: c
        text: AWS Elastic Disaster Recovery
        correct: true
        why: Its agents replicate the servers to AWS continuously, so they can be recovered in AWS within minutes.
      - id: d
        text: AWS Backup
        why: AWS Backup centralizes scheduled backups, not nonstop server replication for recovery in minutes.
    evidence:
      - Lightweight agents on source servers replicate block-level data to AWS nonstop, without Storage Gateway.
      - Exact, current replicas let servers recover in the target AWS Region within minutes, with point-in-time recovery.
    takeaway: Nonstop server replication to AWS with recovery in minutes points to AWS Elastic Disaster Recovery, not Storage Gateway.
    history: []
    verified:
      keyHash: 68ce7e2b7b8a
      fullHash: 9eb6ea35338a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bvas64
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: aws-elastic-disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 1
    stem: >-
      Which statements describe how AWS Elastic Disaster Recovery works?
    options:
      - id: a
        text: Storage Gateway caches hot data for local apps.
        why: This is true of Storage Gateway, but Elastic Disaster Recovery replicates without Storage Gateway.
      - id: b
        text: Source-server agents send block changes to AWS.
        correct: true
        why: Small agents on each source server keep replicating its block-level data to AWS.
      - id: c
        text: EBS snapshots back volumes up as increments.
        why: This is true of EBS snapshots, but it describes volume backups, not how this service protects servers.
      - id: d
        text: Recovery tests leave the production servers alone.
        correct: true
        why: Tests launch separate recovery instances and leave the live servers running.
      - id: e
        text: S3 Lifecycle moves cold objects to cheaper classes.
        why: This is true of S3 Lifecycle, but it manages object storage costs rather than server recovery.
    evidence:
      - Lightweight agents on source servers replicate block-level data to AWS nonstop, without Storage Gateway.
      - Recovery tests leave production alone, and recovery instances start fast.
    takeaway: Elastic Disaster Recovery uses source-server agents and lets you test recovery without touching production.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 2 and 5 describe Elastic Disaster Recovery; the others describe other services.)"
  - id: q-d41d6d
    version: 1
    status: draft
    type: single
    pool: practice
    concept: disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.2"
    level: 2
    stem: >-
      The cafe owner wants to limit downtime and lost orders if the back office is ever flooded.
      She would rather avoid paying for a second building full of idle servers.
      Which disaster recovery approach fits?
    options:
      - id: a
        text: Keep a copy of the servers in a leased standby site
        why: A second data center full of waiting servers is the very cost she wants to avoid.
      - id: b
        text: Keep a copy of the servers in an AWS Region
        correct: true
        why: Replicating to AWS uses low-cost storage and minimal compute, so no standby site is needed.
      - id: c
        text: Keep a copy of the servers on drives in the office
        why: Drives kept in the office share its fate in a flood and leave the latest orders at risk.
      - id: d
        text: Keep a copy of the servers on tapes in a storage unit
        why: Tapes survive the flood, but restoring from them is slow and loses every order since the last tape.
    evidence:
      - "No secondary data center: low-cost storage, minimal compute and pay-per-use pricing."
      - Less downtime and data loss, vital where uptime matters, as in healthcare.
    takeaway: Recovering to AWS cuts downtime and data loss without the cost of a standby data center.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 4 is the only one that names AWS; the others are on-premises variants of the same sentence.)"
  - id: q-mk1nmy
    version: 1
    status: live
    type: single
    pool: practice
    concept: disaster-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 2
    stem: >-
      A hospital runs a recovery drill each quarter to show regulators that its patient-record servers can be recovered.
      The servers must stay online for patients during every drill.
      Which feature of AWS Elastic Disaster Recovery makes this possible?
    options:
      - id: a
        text: Agents replicate the server disks to AWS nonstop
        why: Nonstop replication keeps the copy current, but it does not say whether a drill disturbs the live servers.
      - id: b
        text: Servers can be restored to a chosen earlier moment
        why: Point-in-time recovery picks which state to restore, not whether a drill takes the live servers offline.
      - id: c
        text: Replication uses low-cost storage and minimal compute
        why: Low-cost replication cuts the bill, but it says nothing about keeping servers online during a drill.
      - id: d
        text: Test launches run apart from the production servers
        correct: true
        why: Recovery tests leave production alone, so the hospital can drill without an outage.
    evidence:
      - Recovery tests leave production alone, and recovery instances start fast.
      - "Hospital: patient-record servers stay recoverable and tested for regulators."
    takeaway: Elastic Disaster Recovery lets you drill recovery as often as needed while production keeps running.
    history: []
