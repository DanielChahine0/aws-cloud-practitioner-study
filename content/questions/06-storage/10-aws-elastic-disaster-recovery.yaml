      A cashier records one new order on the cafe's point-of-sale server, which is protected by block-level replication to AWS.
      What gets sent to AWS as a result?
    options:
      - id: a
        text: The agent software running on the server
        why: The agent is installed once to do the copying, and it is not what one new order sends.
      - id: b
        text: The disk blocks that the order changed
        correct: true
        why: Block-level replication copies disk blocks as they change, so only the blocks this order touched travel.
      - id: c
        text: A recovery instance in the target Region
        why: A recovery instance launches only during a drill or a failover, not each time an order is saved.
      - id: d
        text: A recovery test of the protected server
        why: Recovery tests run when the cafe chooses to start one, and a new order does not trigger them.
    evidence:
      - "**Block-level replication**: copying disk blocks elsewhere as they change."
      - Lightweight agents on source servers replicate block-level data to AWS nonstop, without Storage Gateway.
      - Recovery tests leave production alone, and recovery instances start fast.
    takeaway: Block-level replication continuously sends only the disk blocks that change, keeping the copy current.
