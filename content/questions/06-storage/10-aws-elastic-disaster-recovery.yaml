  - id: q-j3gga4
    version: 1
    status: live
    type: single
    pool: practice
    concept: point-in-time-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 1
    stem: >-
      What does point-in-time recovery let a team do?
    options:
      - id: a
        text: Restore a system as it was at a chosen earlier moment
        correct: true
        why: It brings the system back to the state it held at the moment the team picks.
      - id: b
        text: Copy each changed disk block to another location
        why: Copying changed blocks is replication, which keeps a copy current rather than going back.
      - id: c
        text: Move a server to AWS for good and retire the original
        why: A permanent move is a migration, not a return to an earlier state.
      - id: d
        text: Run a recovery drill while production keeps running
        why: A drill tests recovery but does not choose an earlier state to restore.
    evidence:
      - "**Point-in-time recovery**: restoring a system as it stood at a chosen earlier moment."
    takeaway: Point-in-time recovery restores a system to how it stood at a moment you choose in the past.
    history: []
    verified:
      keyHash: 42669c84f150
      fullHash: 10ae46907539
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-eq8937
    version: 1
    status: live
    type: single
    pool: practice
    concept: point-in-time-recovery
    note: m06/aws-elastic-disaster-recovery
    task: "3.6"
    level: 2
    stem: >-
      A faulty update corrupted the cafe's order server, and the replica in AWS copied the damage within moments.
      Which capability lets the cafe bring the server back as it stood just before the update?
    options:
      - id: a
        text: Block-level replication
        why: Replication copied the corruption too, so the current replica is just as damaged.
      - id: b
        text: Failover to the replica
        why: Failing over launches the current replica, which already holds the corruption.
      - id: c
        text: Point-in-time recovery
        correct: true
        why: It restores the server as it was at a chosen earlier moment, before the bad update.
      - id: d
        text: A new recovery drill
        why: A drill only tests recovery from the current replica and does not undo the damage.
    evidence:
      - Exact, current replicas let servers recover in the target AWS Region within minutes, with point-in-time recovery.
      - "**Point-in-time recovery**: restoring a system as it stood at a chosen earlier moment."
    takeaway: When a replica copies damage, point-in-time recovery restores the server to a moment before it happened.
    history: []
    verified:
      keyHash: 330b2e05b9ef
      fullHash: 88355d21078d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
