      The cafe's tills run on a physical server in the back office, and its bookings run on a virtual machine at a hosting firm.
      Its order code runs as AWS Lambda functions, its receipts sit in Amazon S3 and its loyalty points sit in Amazon DynamoDB.
      Which of these can AWS Elastic Disaster Recovery protect?
    options:
      - id: a
        text: The tills
        correct: true
        why: The service protects physical servers, so an agent on the till server can replicate it to AWS.
      - id: b
        text: The order code
        why: Lambda functions give the cafe no server of its own to hold a replication agent, so they are not protected.
      - id: c
        text: The bookings
        correct: true
        why: The service protects virtual and cloud servers, so an agent on the virtual machine can replicate it.
      - id: d
        text: The receipts
        why: Objects in S3 are not a server's disks, so the service has nothing to replicate block by block.
      - id: e
        text: The loyalty points
        why: A DynamoDB table has no server of the cafe's own for the service to install an agent on and copy.
    evidence:
      - It protects general workloads on physical, virtual and cloud servers.
    takeaway: Elastic Disaster Recovery protects servers of any kind, physical, virtual or cloud, rather than managed data stores.
