    concept: s3-block-public-access
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "2.3"
    level: 2
    stem: >-
      A developer adds a bucket policy so that website visitors can read the cafe's menu images, yet their requests are still refused.
      What is most likely stopping them?
    options:
      - id: a
        text: S3 Access Points
        why: An Access Point adds its own entry with separate rules, but requests made straight to the bucket do not pass through it.
      - id: b
        text: S3 Versioning
        why: Versioning keeps earlier object versions and has no effect on who may read the images.
      - id: c
        text: S3 Lifecycle rules
        why: Lifecycle rules move or expire objects by schedule and do not grant or block public reads.
      - id: d
        text: S3 Block Public Access
        correct: true
        why: Block Public Access overrides any bucket policy that would open data to the public, so the reads are denied.
    evidence:
      - Block Public Access, on the account or the bucket, overrides any bucket policy that would open data to the public.
      - Public access is thus set by these settings and policies, not by object tags or static website hosting.
    takeaway: When a public bucket policy seems ignored, S3 Block Public Access is overriding it.
