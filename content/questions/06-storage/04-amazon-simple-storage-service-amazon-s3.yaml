    concept: s3-objects
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 2
    stem: >-
      The cafe's app must fetch one particular receipt image from a bucket that holds thousands of them.
      What does S3 use to tell that image apart from every other object in the bucket?
    options:
      - id: a
        text: Its metadata
        why: Metadata describes the data, and many images can share the same metadata values.
      - id: b
        text: Its Region
        why: Every object in the bucket sits in the same Region, so the Region cannot single one out.
      - id: c
        text: Its object key
        correct: true
        why: The key is the name that is unique within the bucket, so the app asks for the image by its key.
      - id: d
        text: Its bucket policy
        why: A bucket policy covers the whole bucket and all its objects, so it does not identify one image.
    evidence:
      - An object has data, metadata and a key that names it uniquely in its bucket, plus properties such as a version ID and access control details.
    takeaway: The object key is the unique name that picks out one object inside an S3 bucket.
