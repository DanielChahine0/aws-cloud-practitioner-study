    concept: s3-durability
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 2
    stem: >-
      The cafe's manager plans a nightly job that duplicates the staff video library in S3 to a second location, in case a storage device fails.
      Why is that job unnecessary for guarding against a failed device?
    options:
      - id: a
        text: S3 Versioning can bring back an object after a delete
        why: Versioning undoes accidental deletes, which is a different risk from a storage device failing.
      - id: b
        text: S3 keeps redundant copies of each object on its own
        correct: true
        why: AWS keeps redundant copies automatically, so a failed device does not lose the videos and no job is needed.
      - id: c
        text: S3 Lifecycle rules can move objects between classes
        why: Lifecycle rules change an object's storage class by the cafe's rules and make no extra copies for safety.
      - id: d
        text: S3 can encrypt each object at rest and in transit
        why: Encryption keeps the videos confidential, but it does nothing to keep them when a device fails.
    evidence:
      - For most storage classes AWS keeps redundant copies automatically, giving 11 nines (99.999999999 percent) of durability, so losing an object within a year is vanishingly unlikely.
    takeaway: S3 keeps redundant copies automatically, so the cafe need not build its own copy jobs to survive hardware failure.
