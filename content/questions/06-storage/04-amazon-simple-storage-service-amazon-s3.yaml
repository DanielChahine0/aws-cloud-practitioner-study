    stem: >-
      The cafe stores its menu images in S3 and wants to turn on versioning and logging and set access permissions for them.
      Which S3 element takes these settings?
    options:
      - id: a
        text: The bucket
        correct: true
        why: The bucket is the basic unit of access control and takes settings such as versioning, logging and permissions.
      - id: b
        text: The object
        why: An object carries a version ID, but versioning and logging are switched on for the whole bucket, not image by image.
      - id: c
        text: The Region
        why: The Region is only where the bucket lives, chosen at creation, and it takes no versioning or logging settings.
      - id: d
        text: The account
        why: The account owns the buckets, but versioning and logging are set on each bucket rather than on the account.
    evidence:
      - A bucket is the basic unit of access control, holds virtually unlimited objects and takes settings like versioning, logging and permissions.
    takeaway: Settings such as versioning, logging and permissions are set on the S3 bucket, the basic unit of access control.
