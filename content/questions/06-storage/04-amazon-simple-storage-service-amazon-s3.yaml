      The cafe's online shop shows product photos to thousands of shoppers during a holiday sale, then goes quiet again.
      The owner wants the photos to keep loading through the rush with no capacity planning by the cafe.
      Which AWS service should hold the photos?
    options:
      - id: a
        text: Amazon EBS
        why: An EBS volume is a disk attached to one instance, sized in advance, so the cafe would plan its capacity.
      - id: b
        text: Amazon EC2 instance store
        why: Instance store is temporary block storage on one host and loses the photos when the instance stops.
      - id: c
        text: Amazon S3
        correct: true
        why: AWS runs S3 as a managed service, so the photos keep loading through a traffic spike with no scaling work.
      - id: d
        text: Amazon FSx
        why: FSx runs managed file systems such as Windows File Server for the cafe's servers, not a shop's photo store.
    evidence:
