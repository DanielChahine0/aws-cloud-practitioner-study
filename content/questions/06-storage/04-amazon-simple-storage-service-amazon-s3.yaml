  - id: q-68t9dv
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-durability
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 1
    stem: >-
      Amazon S3 offers 11 nines of durability for most storage classes.
      What does that figure describe?
    options:
      - id: a
        text: The share of time the service is up and answering requests
        why: Uptime and answering requests describe availability, a different measure from durability.
      - id: b
        text: The odds that a stored object stays intact over a year
        correct: true
        why: Durability is about not losing data, and 11 nines makes losing an object within a year vanishingly unlikely.
      - id: c
        text: The share of requests served from a nearby edge location
        why: Serving content from edge locations is what Amazon CloudFront does, not a measure of S3 durability.
      - id: d
        text: The odds that data stays encrypted while in transit
        why: Encryption in transit keeps traffic confidential, which is separate from whether objects survive.
    evidence:
      - For most storage classes AWS keeps redundant copies automatically, giving 11 nines (99.999999999 percent) of durability, so losing an object within a year is vanishingly unlikely.
    takeaway: S3's 11 nines of durability measure how unlikely it is to lose a stored object in a year, not uptime.
    history: []
    verified:
      keyHash: bd8a6a2ab7f4
      fullHash: 9f4d61dac887
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
