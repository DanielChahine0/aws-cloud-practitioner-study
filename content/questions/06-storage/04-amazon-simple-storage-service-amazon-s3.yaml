questions:
  - id: q-n025b9
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-s3
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 2
    stem: >-
      The cafe wants one place to keep scanned receipts and staff training videos, with room that keeps growing and no disks to size in advance.
      Which AWS service fits?
    options:
      - id: a
        text: Amazon S3
        correct: true
        why: S3 is a managed object store for virtually unlimited unstructured content such as receipts and videos.
      - id: b
        text: Amazon Elastic Block Store (Amazon EBS)
        why: An EBS volume is a disk for one instance whose size you choose in advance, which the cafe wants to avoid.
      - id: c
        text: Amazon EC2 instance store
        why: Instance store is temporary block storage that is lost when the instance stops, so it cannot hold an archive.
      - id: d
        text: Amazon FSx
        why: FSx runs managed file systems such as Windows File Server, not an open-ended store for documents and videos.
    evidence:
      - A fully managed, highly available object store for virtually unlimited data, ideal for unstructured content like documents, images and video.
      - For the coffee shop, that means anything from receipts to staff training videos.
    takeaway: Large, growing collections of unstructured files such as receipts and videos point to Amazon S3.
    history: []
    verified:
      keyHash: b3ac0127be88
      fullHash: 38fc70dbdfde
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-y05bf8
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-s3
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 1
    stem: >-
      Which kind of storage does Amazon S3 provide?
    options:
      - id: a
        text: Block storage
        why: Block storage splits data into blocks for a disk, which describes Amazon EBS rather than S3.
      - id: b
        text: Object storage
        correct: true
        why: S3 keeps each file as a self-contained object in a bucket, which is object storage.
      - id: c
        text: File storage
        why: File storage is a shared hierarchical file system, which is what Amazon EFS and Amazon FSx offer.
      - id: d
        text: Ephemeral storage
        why: Ephemeral storage loses its data when an instance stops, while S3 keeps objects durably.
    evidence:
      - A fully managed, highly available object store for virtually unlimited data, ideal for unstructured content like documents, images and video.
    takeaway: Amazon S3 is object storage, not block storage like EBS or file storage like EFS.
    history: []
    verified:
      keyHash: 21fb7640530d
      fullHash: 1e2083cdc77b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-4gnhar
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-objects
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 2
    stem: >-
      The cafe plans to store each of its very large staff training videos as a single object in Amazon S3.
      Which fact about S3 objects tells the cafe how big one video can be?
    options:
      - id: a
        text: An object can be up to 5 TB in size
        correct: true
        why: An S3 object can hold up to 5 TB, and that limit is what decides whether one video fits as a single object.
      - id: b
        text: An object's metadata records its size
        why: Metadata does describe the object, size included, but it reports the size rather than setting how large a video may be.
      - id: c
        text: An object's key is unique in its bucket
        why: The key names the video uniquely in its bucket, but a name places no limit on how big the video can be.
      - id: d
        text: An object is kept in several Availability Zones
        why: Copies in several Availability Zones protect the video, but they do not set how large one object can be.
    evidence:
      - Objects run from a few bytes to 5 TB per upload, and buckets have no size cap.
      - An object has data, metadata and a key that names it uniquely in its bucket, plus properties such as a version ID and access control details.
      - Each object is stored durably in multiple facilities, meaning several Availability Zones, within your chosen Region.
    takeaway: A single S3 object can hold up to 5 TB, so even a very large video fits as one object.
    history: []
    verified:
      keyHash: 197982e740a4
      fullHash: b95097e9cfa7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
