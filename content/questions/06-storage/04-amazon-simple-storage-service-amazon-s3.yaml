  - id: q-1cy29n
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-versioning
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "3.6"
    level: 2
    stem: >-
      A barista deletes the current menu PDF from the cafe's S3 bucket by mistake.
      Which S3 feature, turned on beforehand, would let the cafe recover the file?
    options:
      - id: a
        text: S3 Lifecycle
        why: Lifecycle rules move objects between storage classes or expire them, and cannot undo a delete.
      - id: b
        text: S3 Block Public Access
        why: Block Public Access stops data from being made public and has no way to recover a deleted file.
      - id: c
        text: S3 Versioning
        correct: true
        why: Versioning keeps earlier versions of each object, so the menu PDF can be restored after the delete.
      - id: d
        text: S3 Intelligent-Tiering
        why: Intelligent-Tiering moves objects between storage classes by access pattern and keeps no older versions.
    evidence:
      - Versioning lets you bring back earlier versions after an accidental delete.
    takeaway: S3 Versioning keeps earlier object versions so an accidental delete can be undone.
    history: []
    verified:
      keyHash: 303eb5e36614
