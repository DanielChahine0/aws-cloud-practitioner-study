    stem: >-
      The cafe's manager reads that S3 Versioning is turned on for the recipe bucket.
      What does that setting do for the recipes?
    options:
      - id: a
        text: Moves each recipe between storage classes by rule
        why: Moving objects between storage classes by rule is what S3 Lifecycle does, not versioning.
      - id: b
        text: Grants expiring access to one private recipe
        why: Expiring access to one object comes from a presigned URL, not from versioning.
      - id: c
        text: Blocks public access to recipes despite any policy
        why: Overriding a permissive policy is the job of S3 Block Public Access, not versioning.
      - id: d
        text: Keeps older copies of each recipe for restoring
        correct: true
        why: Versioning keeps earlier versions, so a recipe can be brought back after an accidental delete.
    evidence:
      - Versioning lets you bring back earlier versions after an accidental delete.
    takeaway: S3 Versioning keeps earlier versions of each object so they can be restored later.
