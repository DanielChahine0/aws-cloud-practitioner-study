      - id: b
        text: Bucket names must be unique across all of AWS
        correct: true
        why: Another AWS customer already holds that name, and no two buckets anywhere in AWS can share one.
      - id: c
        text: A bucket is reachable from any Region if allowed
        why: This is true of buckets, but reachability has nothing to do with whether a name is free.
      - id: d
        text: A bucket holds a virtually unlimited number of objects
        why: This is true of buckets, but bucket capacity does not decide which names can be used.
    evidence:
      - Bucket names are unique across AWS, and you set the name and Region at creation.
    takeaway: S3 bucket names are global, so each name can exist only once across all of AWS.
