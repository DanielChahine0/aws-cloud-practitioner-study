    type: single
    pool: practice
    concept: s3-block-public-access
    note: m06/amazon-simple-storage-service-amazon-s3
    task: "2.3"
    level: 2
    stem: >-
      The cafe wants its menu bucket open to the public for its website, while every other bucket in its account stays blocked from public access.
      Where should the cafe turn on S3 Block Public Access?
    options:
      - id: a
        text: On the account that owns all the buckets
        why: Set on the account, Block Public Access would also override the policy that opens the menu bucket.
      - id: b
        text: On each bucket except the menu bucket
        correct: true
        why: Turning it on bucket by bucket blocks public access to the others while the menu bucket's policy still works.
      - id: c
        text: On the menu bucket and on no other bucket
        why: This would block the one bucket meant to be public and leave the others free to be opened.
      - id: d
        text: On every bucket, the menu bucket included
        why: Blocking the menu bucket too would override its public policy, so the website could not read the menu.
    evidence:
      - Block Public Access, on the account or the bucket, overrides any bucket policy that would open data to the public.
    takeaway: S3 Block Public Access can be set per bucket, so one bucket can stay public while the rest are blocked.
