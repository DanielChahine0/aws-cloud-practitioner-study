questions:
  - id: q-mx5327
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-fsx
    note: m06/amazon-fsx
    task: "3.6"
    level: 1
    stem: >-
      Which AWS service runs a choice of popular file systems as fully managed services in the AWS Cloud, with AWS taking care of the hardware, patching and backups?
    options:
      - id: a
        text: Amazon Elastic File System (Amazon EFS)
        why: EFS is a managed file system too, but it offers only NFS rather than a choice of several file systems.
      - id: b
        text: Amazon FSx
        correct: true
        why: FSx runs several file systems, such as Windows File Server and Lustre, as managed services in AWS.
      - id: c
        text: AWS Storage Gateway
        why: Storage Gateway links an on-premises site to AWS storage rather than hosting a range of file systems in the cloud.
      - id: d
        text: Amazon Elastic Block Store (Amazon EBS)
        why: EBS provides block volumes that attach to an EC2 instance, not managed shared file systems.
    evidence:
      - A fully managed, reliable and scalable service for high-performance file systems, with AWS handling hardware, patching and backups at a lower total cost of ownership (TCO).
      - Unlike NFS-focused EFS it supports several file systems, and it runs in the AWS Cloud, not on premises.
    takeaway: Amazon FSx is the managed home in AWS for several popular file systems, not just one protocol.
    history: []
    verified:
      keyHash: b60363b76e5a
      fullHash: c003a9f8648f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-gtqr36
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-fsx
    note: m06/amazon-fsx
    task: "3.6"
    level: 2
    stem: >-
      The cafe is thinking about moving its shared office files to Amazon FSx.
      Which benefits would the cafe get from that move?
    options:
      - id: a
        text: AWS looks after the file system hardware and patches
        correct: true
        why: FSx is fully managed, so the cafe no longer maintains the servers or applies patches itself.
      - id: b
        text: A local appliance in each shop caches the busiest files
        why: FSx has no on-premises cache; fast on-site access to hot files is a job for Storage Gateway.
      - id: c
        text: Storage costs shrink as rarely used data tiers down
        correct: true
        why: FSx charges for the storage in use, and cold data moves to cheaper tiers on its own.
      - id: d
        text: The file system keeps running in the cafe's own server room
        why: FSx runs in the AWS Cloud, so it does not keep the files on the cafe's premises.
      - id: e
        text: Files are saved as objects in buckets instead of folders
        why: Objects in buckets describe Amazon S3, while FSx presents real file systems with standard protocols.
    evidence:
      - A fully managed, reliable and scalable service for high-performance file systems, with AWS handling hardware, patching and backups at a lower total cost of ownership (TCO).
      - "Benefits: standard protocols for existing tools, self-adjusting capacity, and paying only for used storage as cold data tiers down."
    takeaway: FSx removes file server upkeep and lowers storage cost by tiering cold data, all inside the AWS Cloud.
    history: []
    verified:
      keyHash: fb1a40ab26b2
      fullHash: 921071a02481
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-kzcfas
    version: 1
    status: live
    type: single
    pool: practice
    concept: fsx-for-windows-file-server
    note: m06/amazon-fsx
    task: "3.6"
    level: 2
    stem: >-
      The cafe's back office runs a SQL Server database and staff virtual desktops that all reach shared folders over SMB.
      It wants to move those shared folders into AWS.
      Which service fits?
    options:
      - id: a
        text: Amazon FSx for Lustre
        why: Lustre targets compute-heavy work such as ML and HPC, not Windows shares for desktops and SQL Server.
      - id: b
        text: Amazon Elastic File System (Amazon EFS)
        why: EFS serves NFS to Linux clients and does not offer the SMB shares these Windows workloads use.
      - id: c
        text: Amazon FSx for Windows File Server
        correct: true
        why: This FSx option gives Windows Server storage over SMB, built for SQL Server moves and virtual desktops.
      - id: d
        text: Amazon FSx for OpenZFS
        why: OpenZFS serves ZFS storage over NFS, which does not match Windows workloads that expect SMB.
    evidence:
      - "FSx for Windows File Server: Windows Server storage with SMB, Microsoft Active Directory, data deduplication and steady sub-millisecond latency."
      - "Uses: Windows file server and SQL Server moves, hybrid workloads and virtual desktops."
    takeaway: Windows workloads such as SQL Server and virtual desktops that rely on SMB shares fit FSx for Windows File Server.
    history: []
    verified:
      keyHash: 90210cab8a12
      fullHash: 49d52c5791e8
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1e8gkg
    version: 1
    status: live
    type: single
    pool: practice
    concept: fsx-for-windows-file-server
    note: m06/amazon-fsx
    task: "3.6"
    level: 3
    stem: >-
      The cafe is closing its server room.
      Its office shares use SMB with Microsoft Active Directory permissions, and it wants them run fully in the AWS Cloud with no device left on site.
      Which service fits?
    options:
      - id: a
        text: Amazon S3 File Gateway
        why: This gateway offers SMB but mainly bridges an on-site location to the cloud, which the cafe no longer has.
      - id: b
        text: Amazon FSx for Windows File Server
        correct: true
        why: It hosts managed Windows shares with SMB and Active Directory entirely in the AWS Cloud.
      - id: c
        text: Amazon Elastic Block Store (Amazon EBS)
        why: EBS volumes attach to one instance and offer no SMB shares or Active Directory support.
      - id: d
        text: Amazon Elastic File System (Amazon EFS)
        why: EFS is an NFS file system for Linux, so it cannot serve SMB shares with Active Directory.
    evidence:
      - "FSx for Windows File Server: Windows Server storage with SMB, Microsoft Active Directory, data deduplication and steady sub-millisecond latency."
      - For Windows shares, EFS (NFS, Linux) and EBS (no SMB or Active Directory) fall short, and the SMB-capable gateways mainly bridge sites to the cloud.
    takeaway: Cloud-hosted Windows shares with SMB and Active Directory point to FSx for Windows File Server, not a gateway.
    history: []
    verified:
      keyHash: d55089ef1ada
      fullHash: d26630646163
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
