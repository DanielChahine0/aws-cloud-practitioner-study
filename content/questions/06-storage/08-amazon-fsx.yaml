    type: single
    pool: practice
    concept: fsx-for-netapp-ontap
    note: m06/amazon-fsx
    task: "3.6"
    level: 3
    stem: >-
      The cafe's data team runs a mix of Windows and Linux servers that must work on the same files.
      It wants one managed file system with rich data management that also supports business continuity.
      Which FSx option fits?
    options:
      - id: a
        text: Amazon FSx for Windows File Server
        why: This option is built around Windows Server and SMB, not a shared platform for both Windows and Linux.
      - id: b
        text: Amazon FSx for OpenZFS
        why: OpenZFS serves ZFS storage over NFS and is not the option aimed at mixed Windows and Linux use.
      - id: c
        text: Amazon FSx for Lustre
        why: Lustre is tuned for speed in ML and HPC jobs, not for data management across mixed servers.
      - id: d
        text: Amazon FSx for NetApp ONTAP
        correct: true
        why: ONTAP brings its data management to both Windows and Linux, including business continuity.
    evidence:
      - "FSx for NetApp ONTAP: ONTAP data management for Windows and Linux, for migrations, modern apps and business continuity."
      - SMB and Active Directory point to FSx for Windows File Server, mixed Windows and Linux to ONTAP, NFS on ZFS to OpenZFS, and ML or HPC to Lustre.
    takeaway: When Windows and Linux must share one managed file system, FSx for NetApp ONTAP is the fit.
