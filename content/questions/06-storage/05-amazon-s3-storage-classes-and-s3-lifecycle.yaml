    stem: >-
      The cafe wants old receipts in Amazon S3 to be deleted for good once compliance no longer requires keeping them.
      What should the cafe set up to do that?
    options:
      - id: a
        text: An S3 Lifecycle expiration action
        correct: true
        why: An expiration action permanently deletes the receipts once compliance stops requiring them.
      - id: b
        text: An S3 Lifecycle transition action
        why: A transition action moves the receipts to another storage class but keeps them stored.
      - id: c
        text: An S3 Versioning setting
