  - id: q-63f9nw
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-standard
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 3
    stem: >-
      The cafe's ordering website loads its product images from Amazon S3 thousands of times every day, and each page must show them quickly.
      Which storage class fits these images best?
    options:
      - id: a
        text: S3 Standard
        correct: true
        why: Standard gives fast retrieval at an affordable price for busy content such as a dynamic website.
      - id: b
        text: S3 Standard-IA
        why: Standard-IA charges per GiB retrieved, which adds up quickly for images read thousands of times a day.
      - id: c
        text: S3 Glacier Flexible Retrieval
        why: This archive class takes minutes to hours to return data, far too slow for a live web page.
      - id: d
        text: S3 Glacier Deep Archive
        why: Deep Archive is the slowest class to return data, which no page visitor would wait for.
    evidence:
      - "S3 Standard: the general-purpose default when no class is named, with fast retrieval at an affordable price, for apps, games, dynamic websites, content distribution and big data analytics."
      - "S3 Standard-IA: data used less often but needed fast, with S3 Standard's durability, throughput and latency, cheaper storage and a per-GiB retrieval fee, for backups and disaster recovery files."
    takeaway: Data read often and needed fast belongs in S3 Standard, since infrequent-access classes add retrieval fees on every read.
