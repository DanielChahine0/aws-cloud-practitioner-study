  - id: q-m0bknd
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-intelligent-tiering
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 3
    stem: >-
      The cafe is building a data lake of sales records, and nobody can yet say which files analysts will read often or for how long.
      The team wants storage costs to follow actual use without writing any rules.
      Which storage class fits?
    options:
      - id: a
        text: S3 Intelligent-Tiering
        correct: true
        why: Intelligent-Tiering tracks each object's use and moves it to the cheapest suitable tier with no rules to manage.
      - id: b
        text: S3 Standard
        why: Standard keeps every object at its frequent-access rate, even files that analysts stop reading.
      - id: c
        text: S3 Standard-IA
        why: Standard-IA adds a retrieval fee on each read, which hurts if some files turn out to be busy.
      - id: d
        text: S3 Glacier Instant Retrieval
        why: This class suits rarely read archives, not a dataset whose usage is still unknown and shifting.
    evidence:
      - "S3 Intelligent-Tiering: for unknown or shifting access, S3 tracks use and moves each object to its cheapest suitable tier, with no lifecycle rules to manage."
      - Good for data lakes and large datasets whose usage changes.
    takeaway: When access patterns are unknown or changing, S3 Intelligent-Tiering moves objects between tiers by itself.
