questions:
  - id: q-7kq2k0
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-storage-classes
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 1
    stem: >-
      Which statement explains what mainly decides the price of keeping an object in Amazon S3?
    options:
      - id: a
        text: The class sets the rate, retrieval fees and minimum stay
        correct: true
        why: The class is the main price lever, since it fixes the per-GB rate, retrieval charges and any minimum duration.
      - id: b
        text: A bucket can hold objects in several different classes
        why: Mixing classes in one bucket is true, but it does not say what sets the price of an object.
      - id: c
        text: S3 Standard applies when an upload names no other class
        why: Standard being the default is true, but it does not explain what drives the price of storage.
      - id: d
        text: Lifecycle transitions keep objects in the same bucket
        why: Transitions do stay in one bucket, but that describes how objects move, not what sets their price.
    evidence:
      - "Cost depends mainly on the class: per-GB storage rate, retrieval charges and minimum storage duration (none for S3 Standard, 180 days for S3 Glacier Deep Archive)."
      - One bucket can mix classes, chosen per object by access pattern.
      - Transitions happen within the same bucket, with no manual copying between buckets.
    takeaway: In Amazon S3 the storage class is the main lever on price, through its storage rate, retrieval fees and minimum duration.
    history: []
    verified:
      keyHash: eead993e2aa7
      fullHash: 16a6e3084f19
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-jqzvqw
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: s3-storage-classes
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe keeps menu photos that its app loads all day and old supplier invoices that nobody opens in the same Amazon S3 bucket.
      Which facts let it pay less to store the invoices than the photos?
    options:
      - id: a
        text: A class is picked for each object rather than for the whole bucket
        correct: true
        why: Because the class is set per object, the idle invoices can sit in a cheaper class beside the busy photos.
      - id: b
        text: Each class sets its own mix of speed, resiliency and price
        correct: true
        why: Classes weigh speed against price differently, so the invoices can trade speed they never use for a lower rate.
      - id: c
        text: The bucket's Region affects the price of the objects stored in it
        why: Region does affect price, but photos and invoices in one bucket share a Region, so it cannot set them apart.
      - id: d
        text: S3 Standard is the class used when an upload names no other class
        why: The default only says what happens when no class is chosen, and it would price both kinds the same.
      - id: e
        text: S3 Outposts brings S3 storage to an on-premises Outposts setup
        why: Outposts is about keeping data on premises, which does nothing to lower the invoices' storage price.
    evidence:
      - One bucket can mix classes, chosen per object by access pattern.
      - Each class balances performance, access, resiliency and cost, and some target data residency, unpredictable access or archiving.
      - The bucket's Region affects price too, though the class is a primary driver.
    takeaway: Storage classes are chosen per object by access pattern, so one bucket can mix classes that balance speed and cost differently.
