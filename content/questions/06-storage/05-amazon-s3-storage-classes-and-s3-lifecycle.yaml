    concept: s3-lifecycle
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe sets an S3 Lifecycle rule that moves each order receipt to S3 Glacier Deep Archive right after upload.
      Staff still look up receipts often in the weeks that follow.
      What problem does this rule cause?
    options:
      - id: a
        text: Staff lose quick access to receipts still in use
        correct: true
        why: Archiving this early sends receipts staff still read into a class with a default 12-hour retrieval.
      - id: b
        text: Receipts are deleted while staff still need them
        why: Deleting too early comes from an expiration action, and this rule is a transition that keeps the receipts.
      - id: c
        text: Receipts keep paying the S3 Standard storage rate
        why: The rule moves the receipts out of S3 Standard at once, so they stop paying its rate.
      - id: d
        text: Receipts get copied into a separate archive bucket
        why: Lifecycle transitions change the class within the same bucket, with no copy to another bucket.
    evidence:
      - Rules should follow the access curve, since archiving too early blocks quick access and expiring too early deletes needed data.
      - "S3 Glacier Deep Archive: the lowest-cost class, for data touched perhaps once or twice a year, with a default 12-hour retrieval."
    takeaway: Lifecycle rules should follow how data is really used, since archiving objects too early blocks quick access to them.
