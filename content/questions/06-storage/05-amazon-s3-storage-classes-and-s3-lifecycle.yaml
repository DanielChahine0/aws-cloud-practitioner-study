    concept: s3-intelligent-tiering
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 1
    stem: >-
      How does S3 Intelligent-Tiering decide which access tier each object sits in?
    options:
      - id: a
        text: S3 watches how each object is used and moves it to its cheapest suitable tier
        correct: true
        why: Intelligent-Tiering monitors use per object and shifts it between tiers without any rules from you.
      - id: b
        text: You write lifecycle rules that move objects to new tiers once they reach a set age
        why: Age-based rules are S3 Lifecycle, which Intelligent-Tiering removes the need to manage.
      - id: c
        text: You pick a tier for every object at upload time, and it stays there until you change it
        why: A fixed tier set at upload is the opposite of the automatic moves this class makes.
      - id: d
        text: S3 Storage Class Analysis reviews the bucket and moves objects to new tiers each month
        why: Storage Class Analysis only studies access patterns to suggest changes and does not move objects.
    evidence:
      - "S3 Intelligent-Tiering: for unknown or shifting access, S3 tracks use and moves each object to its cheapest suitable tier, with no lifecycle rules to manage."
    takeaway: S3 Intelligent-Tiering moves each object between its tiers based on observed use, with no lifecycle rules needed.
