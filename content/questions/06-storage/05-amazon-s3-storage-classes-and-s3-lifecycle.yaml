    concept: s3-standard-ia
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe keeps disaster recovery files in Amazon S3 that are opened only during an outage, but then they must load right away.
      The files must also stay protected across several Availability Zones, and the cafe wants the lowest storage rate that meets both needs.
      Which storage class fits?
    options:
      - id: a
        text: S3 Standard-IA
        correct: true
        why: Standard-IA stores rarely used data more cheaply while still returning it as fast as S3 Standard.
      - id: b
        text: S3 Standard
        why: Standard charges its higher storage rate for files that sit untouched almost all the time.
      - id: c
        text: S3 Glacier Flexible Retrieval
        why: Retrieval takes minutes to hours, too slow when the files are needed the moment an outage starts.
      - id: d
        text: S3 One Zone-IA
        why: One Zone-IA keeps data in a single Availability Zone, so it does not meet the multi-zone need.
    evidence:
      - "S3 Standard-IA: data used less often but needed fast, with S3 Standard's durability, throughput and latency, cheaper storage and a per-GiB retrieval fee, for backups and disaster recovery files."
      - "S3 One Zone-IA: one Availability Zone instead of Standard-IA's three, so cheaper, for secondary backups or easily recreated data without high availability needs."
    takeaway: Rarely used data that must return fast and stay multi-zone, such as recovery files, fits S3 Standard-IA.
