  - id: q-xfj8n4
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-lifecycle
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe wants old receipts in Amazon S3 to be deleted for good once compliance no longer requires keeping them.
      What should the cafe set up to do that?
    options:
      - id: a
        text: An S3 Lifecycle expiration action
        correct: true
        why: An expiration action permanently deletes the receipts once compliance stops requiring them.
      - id: b
        text: An S3 Lifecycle transition action
        why: A transition action moves the receipts to another storage class but keeps them stored.
      - id: c
        text: An S3 Versioning setting
        why: Versioning keeps earlier copies of the receipts rather than deleting them on a schedule.
      - id: d
        text: An S3 Storage Class Analysis report
        why: Storage Class Analysis studies how the receipts are accessed and never deletes any of them.
    evidence:
      - Expiration actions delete objects for good, such as when compliance no longer needs them.
      - Transition actions move objects to another class at a set age, such as Standard-IA after 30 days or Glacier Deep Archive after a year.
    takeaway: In S3 Lifecycle, transition actions move objects between classes and expiration actions delete them for good.
    history: []
    verified:
      keyHash: 69256a99f00f
      fullHash: 51577b38bdff
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
