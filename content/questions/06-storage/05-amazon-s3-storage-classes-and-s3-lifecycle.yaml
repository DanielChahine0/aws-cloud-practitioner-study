    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-lifecycle
    note: m06/amazon-s3-storage-classes-and-s3-lifecycle
    task: "3.6"
    level: 2
    stem: >-
      The cafe's daily order logs in Amazon S3 are read often for a week, rarely after a month, and can be deleted once nobody needs them.
      Which feature moves and then removes the logs on that schedule with no manual work?
    options:
      - id: a
        text: An S3 Lifecycle configuration
        correct: true
        why: Lifecycle transition actions move the logs to cheaper classes as they age, and an expiration action deletes them.
      - id: b
        text: S3 Versioning on the log bucket
        why: Versioning keeps earlier copies of objects, which adds storage rather than moving or deleting logs.
      - id: c
        text: S3 Storage Class Analysis reports
        why: Storage Class Analysis only shows when a cheaper class pays off and does not move or delete anything.
      - id: d
        text: Amazon Data Lifecycle Manager policies
        why: Data Lifecycle Manager handles EBS snapshots and AMIs, not objects stored in S3 buckets.
    evidence:
      - Lifecycle configurations automate this for an object or group of objects with two kinds of action.
      - Typical candidates are periodic logs kept a week or a month, and documents that cool off, are archived for a set period, then deleted.
    takeaway: S3 Lifecycle moves objects to cheaper classes and deletes them on an age-based schedule as interest fades.
    history: []
    verified:
