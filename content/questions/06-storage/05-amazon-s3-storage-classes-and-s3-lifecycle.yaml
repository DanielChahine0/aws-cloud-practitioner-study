    task: "3.6"
    level: 1
    stem: >-
      An object is uploaded to Amazon S3 without naming any storage class.
      Which class does it use?
    options:
      - id: a
        text: S3 Standard
        correct: true
        why: S3 Standard is the general-purpose default that applies when an upload names no class.
      - id: b
        text: S3 Intelligent-Tiering
        why: Intelligent-Tiering must be chosen on purpose for data whose access pattern is unknown.
      - id: c
        text: S3 Standard-IA
        why: Standard-IA is picked for data read less often and is not applied by default.
      - id: d
        text: S3 Glacier Instant Retrieval
        why: This archive class is chosen for rarely read data and is never the default for uploads.
    evidence:
      - "S3 Standard: the general-purpose default when no class is named, with fast retrieval at an affordable price, for apps, games, dynamic websites, content distribution and big data analytics."
    takeaway: S3 Standard is the default storage class, used whenever an upload does not name another class.
