      The cafe's IT lead is deciding which workloads deserve a Provisioned IOPS SSD volume on Amazon EBS.
      Which signs point a workload toward that volume type?
    options:
      - id: a
        text: Staff at many sites open the same files at once
        why: Many locations sharing the same files point to a shared file system such as EFS, not a faster EBS volume.
      - id: b
        text: The app is mission-critical to the business
        correct: true
        why: A workload the cafe cannot run without is the kind the top-performing EBS volume type is meant for.
      - id: c
        text: The data is static web assets for visitors
        why: Static web assets are served well from an S3 bucket, with no EBS volume involved.
      - id: d
        text: Its reads and writes need steady low latency
        correct: true
        why: A workload whose reads and writes must stay steadily fast gains the most from the top-performing EBS volume type.
      - id: e
        text: Rarely used data should tier down to cut cost
        why: Tiering cold data lowers cost in services such as S3 and EFS, which is the opposite of buying top performance.
    evidence:
      - Popular classes fill fast, so reads and writes need consistently low latency.
      - The fix is moving to Provisioned IOPS SSD, the top-performing volume type for mission-critical apps.
    takeaway: Mission-critical apps whose reads and writes need consistently low latency are the case for Provisioned IOPS SSD.
