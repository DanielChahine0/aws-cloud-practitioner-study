    concept: provisioned-iops-ssd
    note: m06/comparing-storage-services
    task: "3.6"
    level: 1
    stem: >-
      Which description fits the Provisioned IOPS SSD option for Amazon EBS?
    options:
      - id: a
        text: The EBS volume type with the lowest price
        why: Provisioned IOPS SSD is the highest-performance type, which carries a higher price rather than the lowest.
      - id: b
        text: The EBS volume type that stores data on HDD
        why: As its name says, Provisioned IOPS SSD runs on SSD media, not on HDD.
      - id: c
        text: The EBS volume type with the top performance
        correct: true
        why: Provisioned IOPS SSD is the top-performing EBS volume type, meant for mission-critical workloads.
      - id: d
        text: The EBS volume type balanced for everyday use
        why: Provisioned IOPS SSD is built for top performance in mission-critical work, not as a balanced everyday choice.

    evidence:
      - "**Provisioned IOPS SSD**: the highest-performance EBS volume type, for mission-critical workloads."
    takeaway: Provisioned IOPS SSD is the EBS volume type to choose when a mission-critical workload needs top performance.
