  - id: q-e1tr15
    version: 1
    status: live
    type: single
    pool: practice
    concept: provisioned-iops-ssd
    note: m06/comparing-storage-services
    task: "3.6"
    level: 2
    stem: >-
      The cafe's ordering database runs on EC2 and already stores its data on EBS.
      During the morning rush it slows down, and orders need consistently low latency.
      What is the best fix?
    options:
      - id: a
        text: Move the data to an Amazon S3 bucket
        why: Object storage is not built for the constant rapid rewrites that a busy database makes.
      - id: b
        text: Move the data to a Provisioned IOPS SSD volume
        correct: true
        why: Moving to the top-performing EBS volume type speeds up the database without changing services.
      - id: c
        text: Move the data to an Amazon EFS file system
        why: EFS is for files shared across many devices, not the block-level access a transactional database needs.
      - id: d
        text: Move the data to the EC2 instance store
        why: Instance store is temporary, so the order data would be lost when the instance stops.
    evidence:
      - A slow database already on EBS can be sped up by moving to a faster volume type instead of switching services.
      - The fix is moving to Provisioned IOPS SSD, the top-performing volume type for mission-critical apps.
    takeaway: A slow database on EBS gets faster by moving to Provisioned IOPS SSD rather than to another storage service.
    history: []
    verified:
      keyHash: 2aaa56f8b709
      fullHash: 24bf8465b663
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-q67804
