  - id: q-dn2qdy
    version: 1
    status: live
    type: single
    pool: practice
    concept: choosing-storage-services
    note: m06/comparing-storage-services
    task: "3.6"
    level: 2
    stem: >-
      A cafe manager suggests keeping the order database's data in Amazon S3 because S3 scales so easily.
      The database rewrites rows constantly throughout the day.
      Which fact about S3 makes it the wrong fit for this data?
    options:
      - id: a
        text: S3 bills for stored data plus data sent out
        why: The billing model is true of S3, but it does not explain why constant database rewrites fail there.
      - id: b
        text: S3 keeps data as objects rather than as blocks
        correct: true
        why: Object storage is not built for constant rapid rewrites, while a database needs the block-level access EBS gives.
      - id: c
        text: S3 serves a site's static files from a bucket
        why: Static website hosting is a true S3 feature, but it has no bearing on where a busy database should live.
      - id: d
        text: S3 handles any traffic level without scaling work
        why: Absorbing traffic is a strength of S3 and is the manager's reason, not the reason the idea fails.
    evidence:
      - S3 would not work, since object storage is not built for constant rapid rewrites, while EBS gives databases block-level access.
      - A database that rewrites data constantly should not sit on S3, because that work needs block storage such as EBS.
    takeaway: A database that rewrites data constantly needs block storage such as EBS, because object storage like S3 is not built for it.
    history: []
    verified:
      keyHash: e295e8761d46
      fullHash: 4d1ce732c1a0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-11-24
