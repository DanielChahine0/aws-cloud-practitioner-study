  - id: q-j2vgqe
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-storage-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 2
    stem: >-
      The cafe's office apps open the same recipe files all day.
      The cafe wants those files kept in AWS while the busiest ones stay quick to open from the office.
      Which service fits?
    options:
      - id: a
        text: Amazon Elastic File System (Amazon EFS)
        why: EFS runs in AWS and keeps no cache on site, so office reads would not be local.
      - id: b
        text: AWS Storage Gateway
        correct: true
        why: Storage Gateway extends office storage into AWS while caching frequently used data on site.
      - id: c
        text: Amazon FSx for Windows File Server
        why: FSx runs in the AWS Cloud without local caching, so the busy files would not stay fast on site.
      - id: d
        text: Amazon Elastic Block Store (Amazon EBS)
        why: EBS volumes attach to EC2 instances in AWS and are not reachable as office storage.
    evidence:
      - Local storage extends into AWS while frequently used data stays fast on site.
      - EFS and FSx run in AWS without an on-site cache, so neither replaces a gateway for low-latency on-premises access to hot files.
    takeaway: Storage Gateway keeps hot data cached on premises while extending storage into AWS, which EFS and FSx cannot do.
    history: []
