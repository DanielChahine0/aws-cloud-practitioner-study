  - id: q-enpnf4
    version: 1
    status: live
    type: single
    pool: practice
    concept: hybrid-cloud-storage
    note: m06/aws-storage-gateway
    task: "3.1"
    level: 2
    stem: >-
      The cafe's nightly backup job works well, and staff want to keep it exactly as it is.
      The owner still wants a copy of the critical sales data in AWS in case the office floods.
      Which hybrid storage use case is this?
    options:
      - id: a
        text: Archiving
        why: Archiving moves rarely used data to the cloud for long-term keeping, not a recovery copy of critical data.
      - id: b
        text: Local caching
        why: Caching keeps hot data fast on site, which does not protect the data if the office is lost.
      - id: c
        text: Disaster recovery
        correct: true
        why: A cloud copy of critical data, made without changing the backup routine, is the disaster recovery use case.
      - id: d
        text: Hybrid file access
        why: Hybrid access serves local file shares backed by AWS, which is about daily use rather than recovery.
    evidence:
      - "Disaster recovery: critical data gets a cloud copy without changing backup routines."
    takeaway: Hybrid storage adds a cloud copy for disaster recovery while existing backup routines stay the same.
    history: []
    verified:
      keyHash: d67c496812ca
      fullHash: bdb90669066f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
