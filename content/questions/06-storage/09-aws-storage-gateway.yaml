questions:
  - id: q-5gkcbf
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-storage-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 2
    stem: >-
      The cafe still runs its office servers on site, and their local disks keep filling up.
      It wants those servers to gain almost limitless cloud capacity while their apps keep running unchanged.
      Which service fits?
    options:
      - id: a
        text: AWS Transfer Family
        why: Transfer Family moves files over transfer protocols, but it does not extend the servers' own local storage into AWS.
      - id: b
        text: AWS Storage Gateway
        correct: true
        why: Storage Gateway links the on-site servers to AWS storage, so local apps gain cloud capacity with little rework.
      - id: c
        text: AWS Snow Family
        why: Snow devices carry data offline in bulk, which does not give the servers ongoing access to cloud capacity.
      - id: d
        text: Amazon EBS
        why: EBS volumes attach to EC2 instances in AWS, not to the servers sitting in the cafe's office.
    evidence:
      - A hybrid storage service bridging on-premises systems and AWS, giving local apps virtually unlimited cloud capacity with little or no rework.
    takeaway: Storage Gateway lets on-premises apps keep working while their storage stretches into AWS.
    history: []
    verified:
      keyHash: 4c0ebbd52549
      fullHash: bd712e70fb2a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-rvkvw5
    version: 1
    status: live
    type: multi
    select: 3
    pool: practice
    concept: aws-storage-gateway
    note: m06/aws-storage-gateway
    task: "3.1"
    level: 1
    stem: >-
      The cafe is planning where AWS Storage Gateway itself will run, apart from the storage it presents to local apps.
      In which forms can the gateway be deployed?
    options:
      - id: a
        text: As a virtual machine on an on-site host
        correct: true
        why: Storage Gateway can run as a virtual machine on the cafe's existing on-site hosts.
      - id: b
        text: As a container running on Amazon ECS
        why: Storage Gateway is not offered as an ECS container; it deploys as a virtual machine, a hardware appliance or an EC2 instance.
      - id: c
        text: As a hardware appliance in the back office
        correct: true
        why: A physical appliance is one of the deployment forms, useful when the cafe has no spare virtualization host.
      - id: d
        text: As a function running on AWS Lambda
        why: Storage Gateway is not offered as a Lambda function; it needs a virtual machine, a hardware appliance or an EC2 instance.
      - id: e
        text: As an instance running on Amazon EC2
        correct: true
        why: Storage Gateway can also run on an EC2 instance inside AWS.
    evidence:
      - It deploys as a virtual machine, a hardware appliance or an Amazon EC2 instance.
    takeaway: Storage Gateway deploys as a virtual machine, a hardware appliance or an EC2 instance.
