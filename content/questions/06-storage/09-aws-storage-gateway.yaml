    concept: volume-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 2
    stem: >-
      The cafe's inventory server mounts its storage as iSCSI volumes.
      The owner wants most of the data held in AWS, with only the frequently used part kept on site.
      Which option fits?
    options:
      - id: a
        text: Volume Gateway in stored volume mode
        why: Stored mode keeps the whole dataset on site, which is the opposite of holding most of it in AWS.
      - id: b
        text: Volume Gateway in cached volume mode
        correct: true
        why: Cached mode keeps the main dataset in AWS and caches only the hot data locally.
      - id: c
        text: Amazon S3 File Gateway with an SMB share
        why: A file share over SMB does not give the server the iSCSI block volumes it mounts.
      - id: d
        text: Tape Gateway with a virtual tape library
        why: Virtual tapes serve backup software, not a server that mounts live block volumes.
    evidence:
      - "Cached volume mode keeps the main dataset in the cloud and hot data cached locally."
    takeaway: iSCSI volumes with only hot data on site point to Volume Gateway in cached volume mode.
