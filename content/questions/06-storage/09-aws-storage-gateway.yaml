    version: 1
    status: live
    type: single
    pool: practice
    concept: volume-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 1
    stem: >-
      Volume Gateway in stored volume mode keeps all of the data on site.
      How does it protect that data in AWS?
    options:
      - id: a
        text: It copies files to Amazon EFS
        why: EFS is a separate file system in AWS, and stored mode does not copy data into it.
      - id: b
        text: It writes virtual tapes to S3
        why: Virtual tapes are the Tape Gateway approach for backup software, not the stored mode backup.
      - id: c
        text: It takes async EBS snapshots
        correct: true
        why: Stored mode backs up the local volumes to AWS asynchronously as EBS snapshots.
      - id: d
        text: It syncs objects with DataSync
        why: DataSync is a separate transfer service, not how stored mode backs up its volumes.
    evidence:
      - Stored volume mode keeps everything local and backs it up asynchronously as EBS snapshots.
    takeaway: Stored volume mode keeps data local and backs it up to AWS as asynchronous EBS snapshots.
