    concept: tape-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 3
    stem: >-
      The cafe chain's backup software writes each week's records to physical cartridges that staff carry offsite.
      The owner wants to stop handling the cartridges but keep the same backup software.
      Which gateway option fits?
    options:
      - id: a
        text: Volume Gateway in cached volume mode
        why: Cached mode serves apps that mount iSCSI volumes, not backup software expecting cartridge hardware.
      - id: b
        text: Amazon S3 File Gateway
        why: S3 File Gateway serves a file share over NFS or SMB, which cartridge backup software does not write to.
      - id: c
        text: Tape Gateway
        correct: true
        why: Tape Gateway looks like tape hardware to the backup software and stores virtual tapes in Amazon S3.
      - id: d
        text: Volume Gateway in stored volume mode
        why: Stored mode keeps block volumes on site with EBS snapshot backups, and it does not pose as tape hardware.
    evidence:
      - "Tape Gateway: virtual tapes in Amazon S3 that backup software treats as tape hardware, with rarely used data movable to a cheaper class."
      - Tape backup software points to Tape Gateway, which is for backup and archiving with no file-level access for daily work.
    takeaway: Tape backup software that must keep running unchanged points to Tape Gateway and its virtual tapes.
