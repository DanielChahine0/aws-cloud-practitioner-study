  - id: q-fbqbb5
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-file-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 3
    stem: >-
      Cafe staff save recipe documents to a shared drive in the office over SMB and want to keep that habit.
      The owner wants the documents stored in AWS, where its analytics services can reach them.

      Which gateway option fits?
    options:
      - id: a
        text: Volume Gateway in cached volume mode
        why: Cached mode presents iSCSI block volumes, not an SMB file share whose files land in AWS as objects.
      - id: b
        text: Tape Gateway
        why: Tape Gateway serves backup software with virtual tapes and gives no file-level access for daily work.
      - id: c
        text: Volume Gateway in stored volume mode
        why: Stored mode keeps block volumes on site and backs them up as EBS snapshots, which is no SMB file share.
      - id: d
        text: Amazon S3 File Gateway
        correct: true
        why: S3 File Gateway looks like a normal SMB file server locally and stores each file in S3 as an object.
    evidence:
      - "Amazon S3 File Gateway: appears locally as a normal file server using NFS or SMB."
      - Files land in Amazon S3 as objects, recent data stays cached, and AWS services can reach the files.
    takeaway: A local NFS or SMB file share whose files must live in S3 points to S3 File Gateway.
    history: []
    verified:
      keyHash: 9055bc3c17e8
      fullHash: 5dae2381eec5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-j9zb5p
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-file-gateway
    note: m06/aws-storage-gateway
    task: "3.6"
    level: 1
    stem: >-
      Staff write files to a gateway share that appears on site as a normal NFS or SMB file server.
      In what form does AWS keep those files?
    options:
      - id: a
        text: As objects in Amazon S3
        correct: true
        why: Each file written to the share lands in Amazon S3 as an object that AWS services can reach.
      - id: b
        text: As snapshots of Amazon EBS volumes
        why: EBS snapshots back up Volume Gateway stored volumes, not the files written to a file share.
      - id: c
        text: As virtual tapes in a tape library
        why: Virtual tapes are how Tape Gateway stores backups, not how the file share keeps files.
      - id: d
        text: As files in Amazon FSx
        why: FSx is a separate managed file system in AWS, and the file share does not write into it.
    evidence:
      - Files land in Amazon S3 as objects, recent data stays cached, and AWS services can reach the files.
    takeaway: S3 File Gateway turns each file on its local share into an object in Amazon S3.
