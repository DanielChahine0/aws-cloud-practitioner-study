    task: "3.6"
    level: 1
    stem: >-
      Match each hybrid storage use case or benefit to what it gives an on-premises business.
    pairs:
      - left: Disaster recovery
        right: A cloud copy of critical data with the same backup routine
        why: Disaster recovery adds a copy in AWS without changing how backups run.
      - left: Archiving
        right: Long-term keeping of rarely used data in the cloud
        why: Archiving moves data that is seldom read out of local storage and into AWS.
      - left: Local caching
        right: Fast on-site access to frequently used data
        why: Caching keeps hot data close to local apps while the rest lives in AWS.
      - left: Lower on-premises costs
        right: Less local storage hardware to buy and run
        why: Shifting capacity into AWS reduces how much storage must be kept on site.
    evidence:
      - "Disaster recovery: critical data gets a cloud copy without changing backup routines."
      - "Archiving: rarely used data moves to the cloud for long-term keeping."
      - "Benefits: intact workflows, central management for access, security and compliance, local caching of hot data, and lower on-premises storage costs."
    takeaway: Hybrid storage serves disaster recovery and archiving, and it caches hot data locally while cutting on-site storage costs.
