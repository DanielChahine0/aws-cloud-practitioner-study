  - id: q-gr51v3
    version: 1
    status: live
    type: multi
    pool: practice
    concept: heterogeneous-database-migration
    note: m12/database-migrations
    task: "3.4"
    level: 2
    select: 3
    stem: >-
      The cafe group lists the database moves it plans across its shops.
      Which moves are heterogeneous migrations?
    options:
      - id: a
        text: MySQL to Amazon RDS for MySQL
        why: The engine stays MySQL on both ends, which makes this a homogeneous move.
      - id: b
        text: A commercial engine to Amazon Aurora
        correct: true
        why: The target runs a different engine from the commercial source, so the move is heterogeneous.
      - id: c
        text: PostgreSQL to Amazon RDS for PostgreSQL
        why: Both ends run PostgreSQL, so the engine does not change and the move is homogeneous.
      - id: d
        text: MySQL to Amazon RDS for PostgreSQL
        correct: true
        why: The engine changes from MySQL to PostgreSQL, which is what makes a move heterogeneous.
      - id: e
        text: A commercial engine to the same engine on Amazon EC2
        why: The same engine runs on both ends, so this move is homogeneous even though the host changes.
      - id: f
        text: A commercial engine to Amazon RDS for MySQL
        correct: true
        why: The commercial source and the MySQL target are different engines, so the move is heterogeneous.
    evidence:
      - "Heterogeneous: a new engine, such as legacy commercial to Amazon Aurora, which is harder and may need app changes."
      - "Homogeneous: the same engine on both ends, so fairly simple."
    takeaway: A database move is heterogeneous whenever the target engine differs from the source, whatever the host.
    history: []
    verified:
      keyHash: decef42dbe5b
      fullHash: 7e2ce37bc8ab
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
