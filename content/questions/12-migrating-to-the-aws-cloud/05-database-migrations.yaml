  - id: q-av1csk
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-database-migration-service
    note: m12/database-migrations
    task: "1.3"
    level: 3
    stem: >-
      The cafe wants to move its NoSQL loyalty database and its sales data warehouse to AWS.
      Both sources must stay live, and the team wants to be able to fall back to the originals.
      Which service fits?
    options:
      - id: a
        text: AWS SCT
        why: AWS SCT converts schemas and code objects to a new engine, but it does not move the data itself.
      - id: b
        text: AWS DataSync
        why: DataSync transfers files and storage data online, not live databases that keep serving during the move.
      - id: c
        text: AWS DMS
        correct: true
        why: AWS DMS moves NoSQL databases and data warehouses while the source stays live, and allows a fall back.
      - id: d
        text: AWS Application Migration Service
        why: Application Migration Service replicates whole applications, not database data with an option to fall back.
    evidence:
      - It moves relational and NoSQL databases, data warehouses and analytics workloads to AWS.
      - You can fall back to the original or replicate into other Regions or Availability Zones.
    takeaway: AWS DMS moves relational, NoSQL and warehouse data with the source live and a path back to the original.
    history: []
    verified:
      keyHash: c293fdcde744
      fullHash: a8ce80e18125
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
