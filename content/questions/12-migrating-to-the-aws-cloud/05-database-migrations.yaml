    stem: >-
      In which of these cafe database moves is AWS SCT needed?
    options:
      - id: a
        text: Copying a MySQL database to Amazon RDS for MySQL
        why: The engine stays MySQL, so the schema and code carry over without conversion.
      - id: b
        text: Moving from a commercial engine to an open source one
        correct: true
        why: Changing engines means the schema and code objects must be converted, which is the work AWS SCT does.
      - id: c
        text: Keeping a same-engine replica in sync in another Region
        why: Ongoing replication between same-engine databases is a job for AWS DMS, with nothing to convert.
      - id: d
        text: Shipping archived receipt files to AWS on a device
        why: Offline file transfer uses the Snow Family and involves no database schema conversion.
    evidence:
      - AWS SCT helps heterogeneous moves by converting schema and code, saving weeks or months.
    takeaway: AWS SCT is needed when a database changes engines, such as commercial to open source.
