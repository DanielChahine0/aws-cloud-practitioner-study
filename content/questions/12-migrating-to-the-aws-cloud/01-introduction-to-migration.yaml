  - id: q-twp24b
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-assess-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 3
    stem: >-
      Before committing to AWS, the cafe owner wants a cost-backed business case showing whether moving is worth it.
      Which service fits this first phase of the migration?
    options:
      - id: a
        text: AWS Application Discovery Service
        why: Discovery Service inventories servers and their links to shape the plan in mobilize, not the business case.
      - id: b
        text: Migration Evaluator
        correct: true
        why: Migration Evaluator supports the assess phase by turning findings into a cost-backed business case.
      - id: c
        text: AWS Application Migration Service
        why: Application Migration Service moves apps in the last phase, after the business case is settled.
      - id: d
        text: AWS DataSync
        why: DataSync moves data during the last phase and does not judge whether to migrate.
    evidence:
      - "**Assess**: gauge readiness, set outcomes, goals and the need to move, then weigh findings into a business case (Migration Evaluator)."
    takeaway: The assess phase builds the business case, and Migration Evaluator is its tool.
    history: []
    verified:
      keyHash: 2af227003c3b
      fullHash: df378340f621
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-my7waj
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: migration-assess-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe has just started the assess phase of its move to AWS.
      Which tasks belong in this phase?
    options:
      - id: a
        text: Gauge how ready the cafe is to run on AWS
        correct: true
        why: Checking readiness is the opening work of the assess phase.
      - id: b
        text: Map which apps depend on the payment database
        why: Mapping app dependencies feeds the migration plan, which is mobilize work.
      - id: c
        text: Set the goals and reasons for making the move
        correct: true
        why: Assess sets the outcomes, goals and need to move before any plan is written.
      - id: d
        text: Validate the ordering app once it runs in AWS
        why: Validating a moved app happens in the migrate and modernize phase.
      - id: e
        text: Close the skill gaps of the staff running the move
        why: Closing readiness gaps is part of mobilize, after the business case exists.
    evidence:
      - "**Assess**: gauge readiness, set outcomes, goals and the need to move, then weigh findings into a business case (Migration Evaluator)."
    takeaway: Assess checks readiness and sets the goals and reasons to move, ending in a business case.
