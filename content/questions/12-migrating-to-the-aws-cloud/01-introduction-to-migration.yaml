    stem: >-
      The cafe's migration plan is done, and it is time to move the ordering app's servers into AWS.
      Which service carries out this move?
    options:
      - id: a
        text: AWS Application Migration Service
        correct: true
        why: Application Migration Service moves apps to AWS, which is the work of the migrate and modernize phase.
      - id: b
