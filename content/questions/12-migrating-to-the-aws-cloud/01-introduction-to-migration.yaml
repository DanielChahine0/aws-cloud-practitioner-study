  - id: q-7tgb80
    version: 1
    status: live
    type: single
    pool: practice
    concept: migrate-and-modernize-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 3
    stem: >-
      The cafe's migration plan is done, and it is time to move the ordering app's servers into AWS.
      Which service carries out this move?
    options:
      - id: a
        text: AWS Application Migration Service
        correct: true
        why: Application Migration Service moves apps to AWS, which is the work of the migrate and modernize phase.
      - id: b
        text: AWS Application Discovery Service
        why: Discovery Service maps servers to shape the plan in mobilize, and the plan is already done.
      - id: c
        text: Migration Evaluator
        why: Migration Evaluator builds the business case in assess and does not move any servers.
      - id: d
        text: AWS Schema Conversion Tool (AWS SCT)
        why: AWS SCT converts database schemas between engines and does not move the app servers.
    evidence:
      - "Last-phase tools: Application Migration Service, AWS Database Migration Service (AWS DMS), Migration Hub, and DataSync, Transfer Family or the Snow Family for data."
    takeaway: Moving the apps themselves is the migrate and modernize phase, done with tools such as Application Migration Service.
    history: []
    verified:
      keyHash: 185bff7f9d3e
      fullHash: b5e6da6070a8
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
