    stem: >-
      The cafe runs no servers of its own, and its loyalty app is hosted by a provider other than AWS.
      A consultant says the cafe therefore has nothing to migrate.
      Which fact shows the consultant is wrong?
    options:
      - id: a
        text: A migration can start from another cloud, not only from on premises
        correct: true
        why: Because a migration can start from another cloud, moving the loyalty app into AWS still counts.
      - id: b
        text: A migration often runs in stages, not only as one single move
        why: This is true, but running in stages says nothing about whether an app hosted elsewhere can move.
      - id: c
        text: A migration covers databases and other IT resources, not only apps
        why: This is true, but it widens what moves rather than where a move may start from.
      - id: d
        text: A migration takes planning and upkeep, not only the move itself
        why: This is true, but planning and upkeep do not show that an app off premises can still move.
    evidence:
      - Moving apps, databases and other IT resources from on premises or another cloud to AWS.
    takeaway: A move into AWS from another cloud provider counts as a cloud migration, just like a move from on premises.
