  - id: q-zzcs5j
    version: 1
    status: live
    type: single
    pool: practice
    concept: migrate-and-modernize-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe is ready to move its apps, but its small IT team has never architected anything in AWS.
      How can the migrate and modernize phase still go ahead?
    options:
      - id: a
        text: Work with specialists or competency partners on each app
        correct: true
        why: This phase can run alone or with specialists and competency partners, who bring the missing skills.
      - id: b
        text: Use Migration Evaluator to build a cost-backed business case
        why: The business case is assess work and gives the team no help architecting its apps.
      - id: c
        text: Use AWS Application Discovery Service to map app dependencies
        why: Mapping dependencies shapes the plan in mobilize and does not supply architecture skills.
      - id: d
        text: Track the status of every app's move in AWS Migration Hub
        why: Tracking progress shows how the move is going but adds no architecture skills to the team.
    evidence:
      - "**Migrate and modernize**: architect, migrate and validate each app, alone or with specialists and competency partners."
    takeaway: A team that lacks skills can still migrate and modernize by working with specialists or competency partners.
    history: []
