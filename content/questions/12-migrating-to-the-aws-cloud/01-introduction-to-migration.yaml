questions:
  - id: q-mj8gyy
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-migration
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe has several AWS projects on its list this year.
      Which project counts as a cloud migration?
    options:
      - id: a
        text: Building a brand-new menu app in AWS with no earlier version
        why: A new app built in AWS has nothing on premises or elsewhere to move, so it is not a migration.
      - id: b
        text: Adding more storage to an ordering app that already runs in AWS
        why: The app already runs in AWS, so growing its storage moves nothing into AWS.
      - id: c
        text: Moving the stock database from a back-office server into AWS
        correct: true
        why: Shifting a database from an on-premises server into AWS is exactly what a cloud migration is.
      - id: d
        text: Linking the back-office server to AWS with a private network line
        why: A network link connects the two sites, but the server and its workloads stay on premises.
    evidence:
      - Moving apps, databases and other IT resources from on premises or another cloud to AWS.
    takeaway: Cloud migration means moving IT resources from on premises or another cloud into AWS.
    history: []
    verified:
      keyHash: bbf2daeae2bb
      fullHash: 80386df99043
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-p2kt6z
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-migration
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe owner expects the work to be over for good once the ordering system and stock database run in AWS.
      Which idea corrects this expectation?
    options:
      - id: a
        text: Migration Evaluator turns findings into a cost-backed business case
        why: This is true of the assess phase, but it says nothing about whether the work ends after the move.
      - id: b
        text: Migration repeats planning, moving and upkeep in iterative stages
        correct: true
        why: Migration is iterative rather than one and done, so planning and upkeep continue after the systems run in AWS.
      - id: c
        text: Application Discovery Service maps how servers depend on each other
        why: This is true of the mobilize phase, but it does not address what happens after the move.
      - id: d
        text: Application Migration Service moves app servers from on premises into AWS
        why: This describes a tool for the move itself, not whether work continues once the move is done.
    evidence:
      - It takes planning, the move and upkeep, often in iterative stages AWS supports.
      - Migration is iterative, not one and done.
    takeaway: A cloud migration is an iterative effort of planning, moving and upkeep rather than a one-time event.
    history: []
    verified:
      keyHash: b5055c6c50e2
      fullHash: 5b75deffd907
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-098xht
    version: 1
    status: live
    type: single
    pool: practice
    concept: three-phase-migration-process
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe owner has just approved the business case for moving to AWS.
      What happens next in the three-phase process?
    options:
      - id: a
        text: Readiness is gauged and goals for the move are set
        why: Gauging readiness and setting goals is assess work, which ends with the approved business case.
      - id: b
        text: Each app is architected, moved and validated
        why: Moving and validating apps is the last phase, which waits until a plan exists.
      - id: c
        text: The organization is readied and the plan is written
        correct: true
        why: Mobilize comes right after assess, readying the organization and writing the migration plan.
      - id: d
        text: Findings are weighed to see whether moving pays off
        why: Weighing findings into a business case is assess work, and the case is already approved.
    evidence:
      - "Order: assess, mobilize, migrate and modernize."
    takeaway: A large migration runs assess, then mobilize, then migrate and modernize.
    history: []
    verified:
      keyHash: bf5d2c47a2e9
      fullHash: 4211510a75d9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-egvebm
    version: 1
    status: live
    type: match
    pool: practice
    concept: three-phase-migration-process
    note: m12/introduction-to-migration
    task: "1.3"
    level: 1
    stem: >-
      The cafe is moving its systems to AWS in phases.
      Match each phase to the main thing it produces.
    pairs:
      - left: Assess
        right: A business case for moving
        why: Assess gauges readiness and weighs the findings into a business case.
      - left: Mobilize
        right: A migration plan built around app dependencies
        why: Mobilize readies the organization and writes the plan around how apps depend on each other.
      - left: Migrate and modernize
        right: Apps that are moved and validated in AWS
        why: The last phase architects, moves and validates each app.
    evidence:
      - Assess yields the business case; mobilize, the plan.
      - "**Migrate and modernize**: architect, migrate and validate each app, alone or with specialists and competency partners."
    takeaway: Assess yields the business case, mobilize yields the plan, and the last phase moves and validates each app.
    history: []
    verified:
      keyHash: 3bed09201a04
