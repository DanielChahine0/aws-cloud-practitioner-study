  - id: q-vq0mfk
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-mobilize-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe is in the mobilize phase, and the managers who will run its systems have never worked with AWS.
      Which task of this phase deals with that?
    options:
      - id: a
        text: Closing readiness gaps before the move starts
        correct: true
        why: Mobilize readies the organization by closing readiness gaps, such as missing AWS skills.
      - id: b
        text: Gauging readiness to set the goals of the move
        why: Gauging readiness is assess work, done before mobilize, and it measures gaps rather than closing them.
      - id: c
        text: Validating each app once it is running in AWS
        why: Validating apps happens in the migrate and modernize phase and does not build staff skills.
      - id: d
        text: Weighing findings into a cost-backed business case
        why: The business case is assess work and does nothing to prepare the managers.
    evidence:
      - "**Mobilize**: ready the organization and resources, write the plan around app dependencies, close readiness gaps and pick strategies (Application Discovery Service, Migration Hub)."
    takeaway: Mobilize readies the organization, which includes closing readiness gaps such as missing skills.
