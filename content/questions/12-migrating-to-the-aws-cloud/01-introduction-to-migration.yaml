  - id: q-jkkxf7
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-mobilize-phase
    note: m12/introduction-to-migration
    task: "1.3"
    level: 2
    stem: >-
      The cafe's business case is approved.
      Now it needs an inventory of its back-office servers and how each connects to the loyalty database, so the plan can group them.
      Which service helps with this step?
    options:
      - id: a
        text: Migration Evaluator
        why: Migration Evaluator builds the business case in assess, which the cafe already has.
      - id: b
        text: AWS Database Migration Service (AWS DMS)
        why: AWS DMS moves the database in the last phase and does not map server dependencies.
      - id: c
        text: AWS Transfer Family
        why: Transfer Family moves files over transfer protocols and does not inventory servers.
      - id: d
        text: AWS Application Discovery Service
        correct: true
        why: Discovery Service inventories servers and their connections, which the mobilize plan is built around.
    evidence:
      - "**Mobilize**: ready the organization and resources, write the plan around app dependencies, close readiness gaps and pick strategies (Application Discovery Service, Migration Hub)."
    takeaway: Mobilize writes the plan around app dependencies, which Application Discovery Service helps uncover.
    history: []
    verified:
      keyHash: 9574f6d3e950
      fullHash: 8d9ff758baeb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
