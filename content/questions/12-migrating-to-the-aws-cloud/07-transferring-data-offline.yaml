questions:
  - id: q-vvf3qr
    version: 1
    status: live
    type: single
    pool: practice
    concept: offline-data-transfer
    note: m12/transferring-data-offline
    task: "1.3"
    level: 3
    stem: >-
      The cafe's roastery sits in a remote valley with no internet service and no Direct Connect link.
      Years of roasting logs there must reach AWS.
      Which approach fits?
    options:
      - id: a
        text: Ship the data to AWS on a physical device
        correct: true
        why: With no network path at all, carrying the data on a device is the only way it can reach AWS.
      - id: b
        text: Upload the data across the public internet
        why: An upload needs internet service, and the roastery has none to send the logs over.
      - id: c
        text: Keep the data on a local device at the roastery
        why: A local device keeps the logs safe on site, but the data never reaches AWS that way.
      - id: d
        text: Move the data over a dedicated private link
        why: A dedicated link is what Direct Connect provides, and the roastery has no such link.
    evidence:
      - "Triggers: thin bandwidth, remote sites without internet or Direct Connect, or petabytes that ship faster than they upload."
    takeaway: When a site has no internet or Direct Connect path, offline transfer on a physical device is the way to move its data.
    history: []
    verified:
      keyHash: 4d4c1b470716
      fullHash: 3b7eeb803977
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bc8c0w
    version: 1
    status: draft
    type: multi
    select: 3
    pool: practice
    concept: offline-data-transfer
    note: m12/transferring-data-offline
    task: "1.3"
    level: 1
    stem: >-
      Which conditions point a migration toward moving data offline instead of over the network?
    options:
      - id: a
        text: Very limited network bandwidth
        correct: true
        why: Thin bandwidth makes a large upload crawl, so shipping a device can finish sooner.
      - id: b
        text: A site with no internet or Direct Connect
        correct: true
        why: Without any network path, a physical device is the only way to carry the data out.
      - id: c
        text: Petabytes that would take too long to upload
        correct: true
        why: At petabyte scale, shipping the data on devices can beat even a good network.
      - id: d
        text: A fast link with spare bandwidth to use
        why: A fast link with room to spare can carry the data online, so there is no need to ship a device.
      - id: e
        text: A few gigabytes that upload in minutes
        why: A small amount that uploads quickly is well suited to an online move, not a shipped device.
      - id: f
        text: Data that must sync with AWS all the time
        why: Ongoing sync is an online transfer need, which an offline device does not fit.
    evidence:
      - "Triggers: thin bandwidth, remote sites without internet or Direct Connect, or petabytes that ship faster than they upload."
      - Many customers prefer online moves; offline means sending data on a physical device when DataSync falls short.
      - Being offline, they do not fit online transfer needs.
    takeaway: Thin bandwidth, no connectivity or huge volume are the signals to move data offline.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 1, 2 and 4 are the classic Snowball cases; 3, 5 and 6 are clear reasons to upload online instead.)"
  - id: q-71ted3
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-snow-family
    note: m12/transferring-data-offline
    task: "1.3"
    level: 3
    stem: >-
      The cafe chain keeps a huge archive of store camera footage at an old warehouse where internet service is unreliable.
      It wants to move the whole archive to AWS once and then close the warehouse.
      Which AWS service fits?
    options:
      - id: a
        text: AWS Snow Family
        correct: true
        why: Snow Family devices carry large data sets to AWS physically, so the weak internet does not matter.
      - id: b
        text: AWS Storage Gateway
        why: Storage Gateway links a site to cloud storage over the network, which the weak internet cannot support.
      - id: c
        text: AWS DataSync
        why: DataSync copies data across the network, so the unreliable internet would slow or stall the move.
      - id: d
        text: AWS Transfer Family
        why: Transfer Family runs managed file transfers over network protocols, not on shipped devices.
    evidence:
      - AWS Snow Family devices with NVMe storage for multi-petabyte moves from on-premises sites where internet may be unavailable.
    takeaway: A one-time bulk move from a poorly connected site points to the offline devices of the AWS Snow Family.
    history: []
    verified:
      keyHash: 2c0ace80d7db
      fullHash: 512eade3ce69
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
