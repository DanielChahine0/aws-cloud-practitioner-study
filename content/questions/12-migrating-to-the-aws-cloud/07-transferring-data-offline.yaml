      - id: b
        text: AWS Storage Gateway
        why: Storage Gateway links a site to cloud storage over the network, which the weak internet cannot support.
      - id: c
        text: AWS DataSync
        why: DataSync copies data across the network, so the unreliable internet would slow or stall the move.
      - id: d
        text: AWS Transfer Family
        why: Transfer Family runs managed file transfers over network protocols, not on shipped devices.
    evidence:
      - AWS Snow Family devices with NVMe storage for multi-petabyte moves from on-premises sites where internet may be unavailable.
    takeaway: A one-time bulk move from a poorly connected site points to the offline devices of the AWS Snow Family.
