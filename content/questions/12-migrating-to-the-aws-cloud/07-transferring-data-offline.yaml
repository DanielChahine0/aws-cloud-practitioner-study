  - id: q-n6bsjs
    version: 1
    status: live
    type: single
    pool: practice
    concept: offline-data-transfer
    note: m12/transferring-data-offline
    task: "1.3"
    level: 2
    stem: >-
      The cafe chain's head office has a working internet link, but its archive of security video runs to petabytes.
      Uploading it would take far longer than the deadline allows.
      Which AWS offering fits?
    options:
      - id: a
        text: AWS DataSync
        why: DataSync automates transfers over the network, which is the path that is too slow for petabytes here.
      - id: b
        text: AWS Transfer Family
        why: Transfer Family moves files over network protocols, so it still faces the slow upload.
      - id: c
        text: AWS Snow Family
        correct: true
        why: Petabytes that ship faster than they upload call for an offline transfer on a Snow Family device.
      - id: d
        text: AWS Direct Connect
        why: Direct Connect is a dedicated network link, so the petabytes would still have to travel over a connection.
    evidence:
      - "Triggers: thin bandwidth, remote sites without internet or Direct Connect, or petabytes that ship faster than they upload."
    takeaway: Even with a working link, petabytes that would ship faster than they upload call for an offline transfer.
