        why: Snowball Edge Storage Optimized is an NVMe device built to move multi-petabyte data sets offline.
      - id: d
        text: A dedicated physical network link from a data center to AWS
        why: This describes AWS Direct Connect, a network link rather than hardware that is shipped.
    evidence:
      - AWS Snow Family devices with NVMe storage for multi-petabyte moves from on-premises sites where internet may be unavailable.
    takeaway: Snowball Edge Storage Optimized is an NVMe device for offline moves of multi-petabyte data.
