  - id: q-vvf3qr
    version: 1
    status: live
    type: single
    pool: practice
    concept: offline-data-transfer
    note: m12/transferring-data-offline
    task: "1.3"
    level: 3
    stem: >-
      The cafe's roastery sits in a remote valley with no internet service and no Direct Connect link.
      Years of roasting logs there must reach AWS.
      Which approach fits?
    options:
      - id: a
        text: Ship the data to AWS on a physical device
        correct: true
        why: With no network path at all, carrying the data on a device is the only way it can reach AWS.
      - id: b
        text: Upload the data across the public internet
        why: An upload needs internet service, and the roastery has none to send the logs over.
      - id: c
        text: Keep the data on a local device at the roastery
        why: A local device keeps the logs safe on site, but the data never reaches AWS that way.
      - id: d
        text: Move the data over a dedicated private link
        why: A dedicated link is what Direct Connect provides, and the roastery has no such link.
    evidence:
      - "Triggers: thin bandwidth, remote sites without internet or Direct Connect, or petabytes that ship faster than they upload."
    takeaway: When a site has no internet or Direct Connect path, offline transfer on a physical device is the way to move its data.
    history: []
    verified:
      keyHash: 4d4c1b470716
      fullHash: 3b7eeb803977
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bc8c0w
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: offline-data-transfer
    note: m12/transferring-data-offline
    task: "1.3"
    level: 2
    stem: >-
      The cafe chain is moving data from several of its sites to AWS.
      Which sites should send their data on a physical device instead of over the network?
    options:
      - id: a
        text: A bakery with a thin link that must transfer years of stored files
        correct: true
        why: Thin bandwidth would make this one-time bulk upload crawl, so a shipped device gets the bakery's files to AWS sooner.
      - id: b
        text: A kiosk with a thin link that must send a few small files each day
        why: A few small files a day fit even a thin link, and an ongoing daily need is an online transfer, not a device.
      - id: c
        text: A warehouse with a working link that must move petabytes of footage
        correct: true
        why: Petabytes can ship faster than they upload even over a working link, so the warehouse should send a device.
      - id: d
        text: A shop with a fast link that must move new files to AWS every night
        why: A nightly copy over a fast link is an ongoing online need that DataSync serves, which a shipped device does not fit.
      - id: e
        text: A supplier with a working link that must exchange files over SFTP
        why: SFTP exchanges with a supplier are an online transfer that Transfer Family handles, not a shipped device.
      - id: f
        text: A head office with a fast link whose database must keep serving
        why: Copying a database that keeps serving points to AWS DMS over the fast link, not to an offline device.
    evidence:
      - "Triggers: thin bandwidth, remote sites without internet or Direct Connect, or petabytes that ship faster than they upload."
      - Many customers prefer online moves; offline means sending data on a physical device when DataSync falls short.
      - Being offline, they do not fit online transfer needs.
    takeaway: Thin bandwidth, no connectivity or huge volume are the signals to move data offline.
    history: []
    verified:
      keyHash: 2e52ea364dba
      fullHash: 98ed0608be7d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
