  - id: q-qna4rv
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-snowball-edge-storage-optimized
    note: m12/transferring-data-offline
    task: "1.3"
    level: 2
    stem: >-
      The cafe has a fast internet link and wants its sales files copied to Amazon S3 every night, with no end date.
      A team member suggests a Snowball Edge Storage Optimized device.
      Why is that a poor fit?
    options:
      - id: a
        text: The device stores data on NVMe drives
        why: NVMe storage is true of the device but makes it fast, so it is not why a nightly sync fails.
      - id: b
        text: The device moves data offline by shipping
        correct: true
        why: The device is shipped to move data offline, so it cannot run an ongoing nightly sync over the network.
      - id: c
        text: The device also serves rugged edge computing
        why: Edge computing is a true extra use of the device, but it says nothing about a nightly network sync.
      - id: d
        text: The device is part of the AWS Snow Family
        why: Belonging to the Snow Family is true, but the family name does not explain the poor fit.
    evidence:
      - Being offline, they do not fit online transfer needs.
      - AWS Snow Family devices with NVMe storage for multi-petabyte moves from on-premises sites where internet may be unavailable.
    takeaway: Snowball Edge Storage Optimized moves data offline, so it does not fit ongoing online transfer needs.
