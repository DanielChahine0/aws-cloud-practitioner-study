    stem: >-
      The cafe's partner coffee farm is far from any network and wants to process its crop sensor data on site.
      It needs hardware that is rugged and secure enough for field conditions.
      Which option fits?
    options:
      - id: a
        text: A CloudFront edge location
        why: An edge location caches content near users over the network, and the farm cannot reach one.
      - id: b
        text: An EC2 instance in a Region
        why: An instance in a Region needs a network link to receive the data, which the farm lacks.
      - id: c
        text: A Snowball Edge device
        correct: true
        why: A Snowball Edge device runs compute on site and is built to be rugged and secure for edge work.
      - id: d
        text: An AWS Global Accelerator endpoint
        why: Global Accelerator routes traffic over the AWS network, which does not help a site with no network.
    evidence:
      - They bring strong compute, large capacity and gigabytes per second, and also serve rugged, secure edge computing.
    takeaway: Rugged, secure compute at a disconnected site is edge computing on a Snowball Edge device, not a CloudFront edge location.
