      The cafe's IT lead reads about rugged AWS devices with NVMe storage that are shipped to a site, filled with data and sent back to AWS.
      Which AWS offering are these devices part of?
    options:
      - id: a
        text: AWS Outposts
        why: Outposts places AWS hardware in a data center to run workloads there, not to be shipped back with data.
      - id: b
        text: AWS Snow Family
        correct: true
        why: Shipped NVMe devices that carry data to AWS belong to the Snow Family, the AWS devices for offline transfer.
      - id: c
        text: AWS Transfer Family
        why: Transfer Family is a managed service for file transfers over network protocols, with no devices.
      - id: d
        text: AWS Storage Gateway
        why: Storage Gateway is a hybrid storage service that works over the network, not a device family.
    evidence:
      - AWS Snow Family devices with NVMe storage for multi-petabyte moves from on-premises sites where internet may be unavailable.
    takeaway: Rugged devices shipped to a site to carry data to AWS are part of the AWS Snow Family.
