questions:
  - id: q-ey44rx
    version: 1
    status: live
    type: single
    pool: practice
    concept: online-data-transfer
    note: m12/transferring-data-online
    task: "1.3"
    level: 2
    stem: >-
      The cafe plans to move its on-premises order database to AWS over the network.
      Which service should carry the database part of the move?
    options:
      - id: a
        text: AWS Transfer Family
        why: Transfer Family moves files over protocols such as SFTP, not a live database.
      - id: b
        text: AWS DMS
        correct: true
        why: Database moves go to AWS DMS, while DataSync covers most other kinds of data.
      - id: c
        text: AWS DataSync
        why: DataSync suits most non-database data, but databases are routed to AWS DMS.
      - id: d
        text: AWS Direct Connect
        why: Direct Connect only provides the network path and does not migrate anything.
    evidence:
      - Databases use AWS DMS; DataSync suits most other data.
    takeaway: In an online move, databases go through AWS DMS and most other data goes through DataSync.
    history: []
    verified:
      keyHash: d9f6d041060c
      fullHash: c672ef31f564
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-5b7fde
    version: 1
    status: live
    type: match
    pool: practice
    concept: online-data-transfer
    note: m12/transferring-data-online
    task: "1.3"
    level: 2
    stem: >-
      The cafe is planning several online transfers into AWS.
      Match each need to the service that fits it.
    pairs:
      - left: Copy the shared drive of recipes and photos into Amazon S3 on a schedule
        right: AWS DataSync
        why: DataSync runs scheduled, managed moves from on-premises storage into AWS storage.
      - left: Let a supplier drop invoice files into Amazon S3 over SFTP
        right: AWS Transfer Family
        why: Transfer Family gives a managed SFTP endpoint that writes straight into Amazon S3.
      - left: Get a private, higher-bandwidth line from the office to its VPC
        right: AWS Direct Connect
        why: Direct Connect is a dedicated private link that adds bandwidth but manages no move.
      - left: Move the order database to AWS
        right: AWS Database Migration Service (AWS DMS)
        why: Databases are moved with AWS DMS rather than with a file transfer service.
    evidence:
      - Databases use AWS DMS; DataSync suits most other data.
      - Direct Connect is a link, not a migration manager.
    takeaway: Pick the online tool by the need - DataSync for bulk data, Transfer Family for protocols, Direct Connect for the link.
    history: []
    verified:
      keyHash: aa1598d65dc5
      fullHash: 664038936c2e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-56y53s
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-datasync
    note: m12/transferring-data-online
    task: "1.3"
    level: 3
    stem: >-
      The cafe wants to copy its large on-premises file share into Amazon S3 over the network.
      It wants the copy to run at night, cap its bandwidth use and produce a report of each run.
      Which service fits?
    options:
      - id: a
        text: AWS Snow Family
        why: Snow Family ships physical devices for offline moves, not scheduled network copies.
      - id: b
        text: AWS Storage Gateway
        why: Storage Gateway links on-premises apps to cloud storage rather than running copy tasks.
      - id: c
        text: AWS DataSync
        correct: true
        why: DataSync runs online moves into Amazon S3 and lets tasks be scheduled, throttled and reported.
      - id: d
        text: AWS Transfer Family
        why: Transfer Family serves protocol-based file exchange, not scheduled bulk copy tasks.
    evidence:
      - Automates and speeds large, secure moves from on-premises storage into AWS storage like Amazon S3.
      - It handles instances, encryption and network tuning, and lets you throttle, schedule, filter and report on tasks.
    takeaway: A scheduled, throttled online copy from on-premises storage into AWS with reports points to DataSync.
    history: []
    verified:
      keyHash: 6d6e0cb73339
      fullHash: 7b77218eef4d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7q4gqy
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-datasync
    note: m12/transferring-data-online
    task: "3.6"
    level: 1
    stem: >-
      Which tasks does AWS DataSync take off the customer's hands during a data move?
    options:
      - id: a
        text: Encrypting the data while it moves
        correct: true
        why: DataSync handles encryption for the transfer so the customer does not set it up.
      - id: b
        text: Tuning the network for the transfer
        correct: true
        why: DataSync handles network tuning to speed up the move into AWS storage.
      - id: c
        text: Shipping a storage device to AWS
        why: Shipping a device is an offline approach, while DataSync moves data over the network.
      - id: d
        text: Laying a private line to the VPC
        why: A private line comes from Direct Connect, which DataSync can use but does not provide.
      - id: e
        text: Hosting an SFTP endpoint for partners
        why: An SFTP endpoint for outside partners comes from Transfer Family, not DataSync.
    evidence:
      - It handles instances, encryption and network tuning, and lets you throttle, schedule, filter and report on tasks.
    takeaway: DataSync itself manages encryption, network tuning and the transfer instances during a move.
