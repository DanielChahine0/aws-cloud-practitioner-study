  - id: q-r5vaxh
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-transfer-family
    note: m12/transferring-data-online
    task: "3.8"
    level: 2
    stem: >-
      The cafe's coffee supplier can only send its daily invoices over SFTP.
      The cafe wants them to land in Amazon S3 without running its own file server.
      Which service fits?
    options:
      - id: a
        text: AWS Direct Connect
        why: Direct Connect is a private network line and does not accept files over SFTP.
      - id: b
        text: AWS Transfer Family
        correct: true
        why: Transfer Family offers a managed SFTP endpoint that stores the files in Amazon S3.
      - id: c
        text: AWS DataSync
        why: DataSync moves the cafe's own storage into AWS rather than taking partner SFTP uploads.
      - id: d
        text: AWS Snow Family
        why: Snow Family moves data on shipped devices, not daily uploads from a supplier.
    evidence:
      - Fully managed file transfer in and out of Amazon S3 and Amazon EFS over FTP, SFTP, FTPS and other transfer protocols.
      - It adds encryption and authentication with less infrastructure to manage.
    takeaway: Partners sending files over SFTP into Amazon S3 without a self-run server points to Transfer Family.
    history: []
    verified:
      keyHash: 94d66d55b730
      fullHash: 915c5fc7db0b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-74qh3z
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-transfer-family
    note: m12/transferring-data-online
    task: "1.3"
    level: 1
    stem: >-
      AWS Transfer Family moves files in and out of which AWS storage services?
    options:
      - id: a
        text: Amazon EFS
        correct: true
        why: Transfer Family can read and write files in Amazon EFS file systems.
      - id: b
        text: Amazon EBS
        why: Amazon EBS volumes attach to instances and are not a Transfer Family destination.
      - id: c
        text: Amazon S3
        correct: true
        why: Transfer Family can read and write objects in Amazon S3 buckets.
      - id: d
        text: Amazon DynamoDB
        why: DynamoDB stores items in NoSQL tables, so it is not a place where Transfer Family lands files.
      - id: e
        text: Amazon EC2 instance store
        why: Instance store is temporary storage on a host and is not a Transfer Family target.
    evidence:
      - Fully managed file transfer in and out of Amazon S3 and Amazon EFS over FTP, SFTP, FTPS and other transfer protocols.
    takeaway: Transfer Family exchanges files with Amazon S3 and Amazon EFS over standard file protocols.
    history: []
    verified:
