  - id: q-wpax40
    version: 1
    status: live
    type: single
    pool: practice
    concept: transfer-protocols
    note: m12/transferring-data-online
    task: "3.8"
    level: 2
    stem: >-
      The cafe's bookkeeper sends monthly reports to AWS using FTPS through AWS Transfer Family.
      Which part of this setup is FTPS?
    options:
      - id: a
        text: The storage that keeps the reports
        why: The reports are kept in a storage service such as Amazon S3, not in FTPS.
      - id: b
        text: The rules the files follow in transit
        correct: true
        why: FTPS is a transfer protocol, the rule set that governs how the files move.
      - id: c
        text: The service that manages the upload
        why: Transfer Family is the managed service, and it speaks FTPS rather than being it.
      - id: d
        text: The private network line from the office
        why: A private line would be Direct Connect, which is a path and not a protocol.
    evidence:
      - Fully managed file transfer in and out of Amazon S3 and Amazon EFS over FTP, SFTP, FTPS and other transfer protocols.
      - "**Transfer protocol**: A rule set for how data moves between places."
    takeaway: FTP, SFTP and FTPS are transfer protocols, the rules for moving files, which Transfer Family speaks.
