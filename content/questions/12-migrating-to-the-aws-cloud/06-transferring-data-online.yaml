  - id: q-prt2n9
    version: 1
    status: live
    type: single
    pool: practice
    concept: transfer-protocols
    note: m12/transferring-data-online
    task: "3.8"
    level: 1
    stem: >-
      What is a transfer protocol?
    options:
      - id: a
        text: A private path that carries data between places
        why: A private path is a network link such as Direct Connect, which carries data but sets no rules for it.
      - id: b
        text: A schedule for when data moves between places
        why: A schedule only sets the timing of a move, while a protocol sets the rules the data follows.
      - id: c
        text: A rule set for how data moves between places
        correct: true
        why: A transfer protocol defines the rules that data follows as it moves from one place to another.
      - id: d
        text: A storage area that holds data between places
        why: A storage area keeps data at rest, while a protocol governs how the data travels.
    evidence:
      - "**Transfer protocol**: A rule set for how data moves between places."
    takeaway: A transfer protocol is the set of rules data follows as it moves, such as FTP, SFTP or FTPS.
    history: []
    verified:
      keyHash: 5fb10c2faa8f
      fullHash: 7a97fafd11f5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
