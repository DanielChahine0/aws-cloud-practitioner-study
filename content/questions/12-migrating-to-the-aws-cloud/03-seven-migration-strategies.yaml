    concept: migration-strategy-relocate
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 2
    stem: >-
      The cafe already runs its ordering system in containers on its own servers.
      It wants those same containers running on a cloud host instead.
      Which strategy describes this move?
    options:
      - id: a
        text: Relocate
        correct: true
        why: The containers already exist on premises, so moving them to a cloud host is a relocation.
      - id: b
        text: Repurchase
        why: Repurchase replaces licensed software with SaaS, but the cafe keeps its own ordering system.
      - id: c
        text: Retire
        why: Retire switches an app off, yet the cafe wants its ordering system to keep running.
      - id: d
        text: Refactor
        why: Refactor writes new code, while the cafe only wants its existing containers on a new host.
    evidence:
      - "**Relocate**: Moving existing VMs or containers to the cloud."
    takeaway: When VMs or containers already exist on premises and simply move to a cloud host, the strategy is relocate.
