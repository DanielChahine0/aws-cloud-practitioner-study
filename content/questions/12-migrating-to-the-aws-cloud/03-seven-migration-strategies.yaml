    stem: >-
      The cafe is sorting its apps before the move to AWS.
      Which apps fit the retain strategy?
    options:
      - id: a
        text: The old rota app, which nobody at the cafe uses any more
        why: An app nobody uses is switched off under retire, not kept running.
      - id: b
        text: The ordering app, which would need major refactoring to move
        correct: true
        why: A business-critical app like ordering that needs major refactoring can stay where it is for now under retain.
      - id: c
        text: The accounts app, whose license will be swapped for SaaS
        why: Swapping a license for SaaS is repurchase, which replaces the app rather than keeping it.
      - id: d
        text: The stock app, which is only months away from being deprecated
        correct: true
        why: Apps months from deprecation stay in the source environment under retain and are retired in place later.
      - id: e
        text: The legacy till app, which must move fast so the chain can scale
        why: A legacy app that must scale fast is a rehost candidate, which moves it to AWS.
    evidence:
      - "Business-critical apps stay in the source environment for now: those needing major refactoring, work that can wait, or apps months from deprecation"
    takeaway: Retain keeps critical apps in place for now, such as those needing major refactoring or nearing deprecation.
