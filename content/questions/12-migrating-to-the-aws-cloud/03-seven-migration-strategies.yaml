questions:
  - id: q-t1n5be
    version: 1
    status: live
    type: match
    pool: practice
    concept: seven-migration-strategies
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 1
    stem: >-
      Match each migration strategy to what happens to an application under it.
    pairs:
      - left: Rehost
        right: The app moves to AWS as it is, with no changes at first
        why: Rehost carries the app across untouched, often by turning its servers into VMs.
      - left: Replatform
        right: The app gets a few cloud optimizations but keeps its code
        why: Replatform adds small tweaks for a real gain without new code or a new architecture.
      - left: Refactor
        right: The app is rebuilt with new code and cloud-built features
        why: Refactor rewrites the app to unlock features, scale or performance it lacks today.
      - left: Repurchase
        right: The app's licensed software is swapped for a SaaS product
        why: Repurchase drops the traditional license and buys a SaaS package, often from a new vendor.
    evidence:
      - Rehost changes nothing, replatform adds small optimizations, and refactor writes new code at the highest upfront cost.
      - Repurchase trades licensed software for SaaS, often from a new vendor.
    takeaway: The seven Rs differ by how much each app changes, from none for rehost to new code for refactor.
    history: []
    verified:
      keyHash: 18916a72d104
      fullHash: 58513912fd09
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-hqj9aq
    version: 1
    status: live
    type: single
    pool: practice
    concept: seven-migration-strategies
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 2
    stem: >-
      The cafe runs a point-of-sale system, a loyalty app, an old reporting tool and a staff rota site, and they differ widely.
      The owner assumes they must all move to AWS with one shared strategy.
      Which idea corrects this assumption?
    options:
      - id: a
        text: Discovery reviews the current apps before any strategy is picked
        why: Discovery comes first, but it says nothing about whether every app must then take the same strategy.
      - id: b
        text: Unused apps often make up over 10 percent of a portfolio
        why: This is true of many portfolios, but it does not say whether the apps that move must share one strategy.
      - id: c
        text: Strategies are picked app by app, then combined into one plan
        correct: true
        why: Each app gets its own strategy by its goals and complexity, and the strategies combine into one tailored plan.
      - id: d
        text: A tailored plan aims to lower the risk and disruption of the move
        why: Lower risk is a goal of the plan, but this does not say that different apps may take different strategies.
    evidence:
      - Each app gets one of seven paths, chosen by complexity, goals, time, resources, starting point and future plans.
      - Organizations often combine them into a tailored plan with less risk and disruption.
    takeaway: Each app gets its own migration strategy, and the strategies combine into one tailored plan.
    history: []
    verified:
      keyHash: cfad3ddfada9
      fullHash: 1bd1752d06e0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-hamxsz
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-strategy-relocate
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 1
    stem: >-
      Which migration strategy moves virtual machines or containers that already run on premises over to a cloud host?
    options:
      - id: a
        text: Replatform
        why: Replatform adds cloud optimizations to an app, which is more than shifting existing VMs to a new host.
      - id: b
        text: Relocate
        correct: true
        why: Relocate takes VMs or containers that already run on premises and moves them onto a cloud host.
      - id: c
        text: Retain
        why: Retain keeps the app in its current environment, so nothing moves to a cloud host.
      - id: d
        text: Refactor
        why: Refactor rebuilds the app with new code, while this stem only moves existing VMs or containers.
    evidence:
      - "**Relocate**: Moving existing VMs or containers to the cloud."
    takeaway: Relocate moves VMs or containers that already exist on premises onto a cloud host.
    history: []
    verified:
