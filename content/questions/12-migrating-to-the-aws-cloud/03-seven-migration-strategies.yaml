  - id: q-6gkne0
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-strategy-rehost
    note: m12/seven-migration-strategies
    task: "1.3"
    level: 2
    stem: >-
      The cafe chain is buying several new shops and must get its whole set of legacy apps onto AWS quickly so it can scale.
      Which strategy fits most of those apps?
    options:
      - id: a
        text: Refactor
        why: Rebuilding with new code takes the most planning and staff effort, which slows a move that must be fast.
      - id: b
        text: Repurchase
        why: Shopping for SaaS replacements for every legacy app is slow to adopt and does not suit a fast move.
      - id: c
        text: Retain
        why: Keeping the apps in place would not get them onto AWS, which the chain needs to scale.
      - id: d
        text: Rehost
        correct: true
        why: Moving the apps as they are is the quickest path for a large legacy estate that must scale fast.
    evidence:
      - "Legacy estate that must scale fast: rehost."
    takeaway: A large legacy estate that must move and scale fast mostly uses rehost, lift and shift.
