  - id: q-2bja5g
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-caf-business-perspective
    note: m12/aws-cloud-adoption-framework
    task: "1.3"
    level: 2
    stem: >-
      The cafe's owner wants a written case for funding the cloud move, with cloud initiatives ranked by how much they help sales and IT spending tied to key results.
      Which AWS CAF perspective covers this work?
    options:
      - id: a
        text: Governance
        why: Governance aligns IT and business strategy and measures investments, but it does not build the business case.
      - id: b
        text: Platform
        why: Platform designs architecture and target-state patterns, not the case for spending.
      - id: c
        text: Business
        correct: true
        why: The Business perspective builds the business case, ranks cloud initiatives and ties IT spend to results.
      - id: d
        text: Operations
        why: Operations runs and recovers workloads day to day, not business case planning.
    evidence:
      - IT serves business needs and IT spending ties to key business results; build the business case, rank cloud initiatives, align goals
    takeaway: Building the business case and ranking cloud initiatives by business results belongs to the AWS CAF Business perspective.
