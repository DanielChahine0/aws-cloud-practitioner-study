questions:
  - id: q-25g85f
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cloud-adoption-framework
    note: m12/aws-cloud-adoption-framework
    task: "1.3"
    level: 3
    stem: >-
      Before moving its ordering systems to AWS, the cafe finds that its developers, analysts and managers each picture the move differently.
      Which AWS guidance is built to align those views and field the right team for the migration?
    options:
      - id: a
        text: AWS Well-Architected Framework
        why: Well-Architected judges workload designs against pillars; it does not align teams around a migration.
      - id: b
        text: AWS Cloud Adoption Framework
        correct: true
        why: AWS CAF merges the views of different roles so the whole team is aligned for a quick, smooth move.
      - id: c
        text: AWS Migration Hub
        why: Migration Hub tracks a migration's progress; it does not reconcile how different roles see the move.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor checks an existing account against best practices, not team alignment before a move.
    evidence:
      - AWS Professional Services built AWS CAF to merge those views, align everyone, field the right team and make the move quick and smooth.
      - Developers, architects and analysts see migration differently, and newcomers may miss a role.
    takeaway: When roles disagree on how to approach a migration, AWS CAF is the guidance that aligns them and staffs the move.
    history: []
    verified:
      keyHash: bf8bdf39bd7b
      fullHash: 18fa900d5621
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bjz62j
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-cloud-adoption-framework
    note: m12/aws-cloud-adoption-framework
    task: "1.3"
    level: 1
    stem: >-
      AWS CAF links cloud adoption to four business outcomes.
      Which of these are among them?
    options:
      - id: a
        text: Reduced business risk
        correct: true
        why: Lowering business risk is one of the four outcomes AWS CAF ties to cloud adoption.
      - id: b
        text: Reduced staffing costs
        why: Cutting staff costs is not one of the four outcomes AWS CAF names for cloud adoption.
      - id: c
        text: Increased revenue
        correct: true
        why: Raising revenue is one of the four outcomes AWS CAF names for cloud adoption.
      - id: d
        text: Increased market share
        why: Market share is not among the four outcomes; AWS CAF names revenue, not share of the market.
      - id: e
        text: Improved brand awareness
        why: AWS CAF names improved ESG performance as an outcome, not improved brand awareness.
    evidence:
      - "AWS CAF ties cloud adoption to four business outcomes: reduced business risk, improved ESG performance, increased revenue and increased operational efficiency."
    takeaway: AWS CAF frames cloud adoption around lower risk, better ESG, more revenue and greater operational efficiency.
