    concept: aws-caf-action-plan
    note: m12/aws-cloud-adoption-framework
    task: "1.3"
    level: 1
    stem: >-
      An AWS CAF review finds skill and process gaps in each of the six perspectives.
      What are those gaps collected into, so they can steer change management?
    options:
      - id: a
        text: A target-state design
        why: The Platform perspective sets a detailed target state, which describes architecture rather than collecting gaps.
      - id: b
        text: A business case
        why: The Business perspective builds the business case for the move, which does not gather perspective gaps.
      - id: c
        text: An action plan
        correct: true
        why: Gaps found per perspective feed the AWS CAF Action Plan, which then guides change management.
      - id: d
        text: A ranked initiative list
        why: The Business perspective ranks cloud initiatives, which orders the work rather than gathering skill gaps.
    evidence:
      - Skill and process gaps found per perspective feed the AWS CAF Action Plan, which guides change management.
    takeaway: Skill and process gaps from each perspective feed the AWS CAF Action Plan.
