    concept: aws-migration-and-modernization-competency-partners
    note: m12/migration-services-and-tools
    task: "4.3"
    level: 3
    stem: >-
      The cafe has no staff with migration experience and wants to hire an outside firm that AWS has vetted for help in the mobilize phase.
      Where should the owners look?
    options:
      - id: a
        text: AWS Professional Services migration consultants
        why: Professional Services is consulting from AWS itself, not a list of outside firms vetted by phase.
      - id: b
        text: AWS Trusted Advisor best-practice checks
        why: Trusted Advisor checks an account against best practices; it does not point to outside migration firms.
      - id: c
        text: AWS Marketplace listings of third-party software and data products
        why: Marketplace is a catalog of third-party software and data, not a list of migration specialists by phase.
      - id: d
        text: AWS Migration and Modernization Competency Partners
        correct: true
        why: These partners are listed by migration phase or kind of help, so the cafe can find one for mobilize.
    evidence:
      - "The AWS Competency Partner Program lists migration partners by phase or kind of help: see [AWS Migration and Modernization Competency Partners](https://aws.amazon.com/migration/partner-solutions/)."
      - Competency partners fill expertise gaps.
    takeaway: To hire an outside firm for a migration phase you lack skills for, look to the Migration and Modernization Competency Partners.
    history: []
