  - id: q-hqrbcw
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-migration-hub
    note: m12/migration-services-and-tools
    task: "1.3"
    level: 3
    stem: >-
      Midway through the cafe's move to AWS, the owners want one place that lists every workstream and how far along each one is.
      Which service should they open?
    options:
      - id: a
        text: Migration Evaluator
        why: Migration Evaluator prices the move for a business case up front; it does not track workstreams midway.
      - id: b
        text: AWS Application Discovery Service
        why: Discovery Service inventories servers and their links, not the live status of each workstream.
      - id: c
        text: AWS Application Migration Service
        why: Application Migration Service replicates the apps themselves, while another service tracks overall progress.
      - id: d
        text: AWS Migration Hub
        correct: true
        why: Migration Hub is the central place to plan, run and track every workstream and its progress.
    evidence:
      - "Leaders want live status for every workstream: AWS Migration Hub."
      - The team needs every task and its progress in one view
    takeaway: To see every migration task and its progress in one place, use AWS Migration Hub.
