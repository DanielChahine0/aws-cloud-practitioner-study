    stem: >-
      The cafe worries that tracking its migration in AWS Migration Hub will add to its AWS bill.
      What does Migration Hub itself charge?
    options:
      - id: a
        text: A charge for each server it tracks
        why: Migration Hub has no per-server fee; the hub itself is free.
      - id: b
        text: A charge for each task it tracks
        why: Migration Hub has no per-task fee; tracking any number of tasks there is free.
      - id: c
        text: A flat monthly charge
        why: Migration Hub carries no subscription; the hub itself costs nothing.
      - id: d
        text: No charge for the hub
        correct: true
        why: Migration Hub is free, so tracking the move there adds no charge of its own.
    evidence:
      - Migration Hub is free and spans mobilize through migrate and modernize.
    takeaway: AWS Migration Hub itself is free, so tracking a migration there adds no charge of its own.
