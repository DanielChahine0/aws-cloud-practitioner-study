  - id: q-jtbkqe
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-application-discovery-service
    note: m12/migration-services-and-tools
    task: "1.3"
    level: 3
    stem: >-
      The cafe's ordering app has run on the same back-room machines for years, and no one remembers which servers and databases it talks to.
      Before planning the move, which service maps those servers and their connections automatically?
    options:
      - id: a
        text: AWS Application Discovery Service
        correct: true
        why: Discovery Service inventories on-premises servers, databases and links, which is exactly the missing map.
      - id: b
        text: AWS Migration Hub
        why: Migration Hub gives one view of migration tasks and progress, but this gap is an unknown inventory.
      - id: c
        text: Migration Evaluator
        why: Migration Evaluator prices the move for a business case rather than mapping what the app depends on.
      - id: d
        text: AWS Application Migration Service
        why: Application Migration Service replicates apps to AWS, which is premature while dependencies are unknown.
    evidence:
      - "Nobody knows which servers an app relies on: AWS Application Discovery Service."
      - An automatic inventory of on-premises servers, databases and links, feeding a detailed migration plan
    takeaway: Unknown servers and dependencies before a move point to Application Discovery Service, which inventories them automatically.
    history: []
    verified:
      keyHash: 0e68e98558c6
      fullHash: a7d9d22483f6
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
