      Migration Evaluator is the tool of the assess phase.
      What does it do that fits this phase?
    options:
      - id: a
        text: It maps on-premises servers and their links
        why: Mapping servers and links feeds the mobilize plan and is Application Discovery Service's job.
      - id: b
        text: It replicates apps to AWS with little downtime
        why: Replicating apps is the move itself, done by Application Migration Service in the last phase.
      - id: c
        text: It prices the move so the spend can be approved
        correct: true
        why: Migration Evaluator projects cloud costs into a business case, which is what assess must produce.
      - id: d
        text: It tracks every migration task in one view
        why: Tracking every task and its progress is Migration Hub's job, from mobilize onward.
    evidence:
      - Assess
      - "A data-driven business case: current versus target state, a readiness plan, projected cloud costs"
    takeaway: Migration Evaluator belongs to the assess phase, where readiness is checked and the cost case is made.
