    stem: >-
      The cafe's plan is approved, and it now wants its point-of-sale servers running in AWS with as little downtime as possible.
      Which service replicates them there?
    options:
      - id: a
        text: AWS Database Migration Service (AWS DMS)
        why: AWS DMS replicates databases, but the task here is getting the point-of-sale servers themselves onto AWS.
      - id: b
        text: AWS Application Migration Service
        correct: true
        why: Application Migration Service replicates apps to AWS with minimal downtime once a team is ready to move.
      - id: c
        text: AWS Elastic Disaster Recovery
        why: Elastic Disaster Recovery replicates servers for recovery after a failure, not for a planned move.
      - id: d
        text: AWS Migration Hub
        why: Migration Hub tracks the migration's tasks and progress, while another service does the replication.
    evidence:
      - Apps replicated to AWS faster, for less and with minimal downtime, optionally modernized
      - You are ready to move the apps themselves
    takeaway: When the team is ready to move the apps themselves with minimal downtime, AWS Application Migration Service does the moving.
