questions:
  - id: q-mva2k2
    version: 1
    status: live
    type: single
    pool: practice
    concept: migration-evaluator
    note: m12/migration-services-and-tools
    task: "1.3"
    level: 2
    stem: >-
      The cafe's owners plan to run Migration Evaluator against the servers in their back closet.
      What will it hand them?
    options:
      - id: a
        text: An automatic inventory of servers, databases and their links
        why: Mapping servers and their links is the work of Application Discovery Service, not Migration Evaluator.
      - id: b
        text: A business case with projected costs for the target state
        correct: true
        why: Migration Evaluator compares the current and target states and projects the cloud costs the owners would pay.
      - id: c
        text: A single view of every migration task and its progress
        why: One view of tasks and progress comes from Migration Hub, which tracks the move rather than pricing it.
      - id: d
        text: Replicated copies of the apps, running on AWS with little downtime
        why: Replicating the apps onto AWS is what Application Migration Service does once the move begins.
    evidence:
      - "Finance wants projected AWS costs before approving: Migration Evaluator."
      - "A data-driven business case: current versus target state, a readiness plan, projected cloud costs"
    takeaway: When a move must be justified with projected costs before approval, Migration Evaluator builds that business case.
    history: []
    verified:
      keyHash: 5b8de61e76dc
      fullHash: d0f4adc4fcd8
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
