      - id: d
        text: Live completion status for each workstream
        why: Tracking the progress of every task in one view is what Migration Hub provides.
      - id: e
        text: Replicated copies of apps running on AWS
        why: Replicating apps to AWS is the job of Application Migration Service during the move.
    evidence:
