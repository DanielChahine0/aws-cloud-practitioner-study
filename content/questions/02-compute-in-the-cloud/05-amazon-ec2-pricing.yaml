    concept: savings-plans
    note: m02/amazon-ec2-pricing
    task: "4.1"
    level: 2
    stem: >-
      The cafe plans to move its order system between EC2 instance families as it grows, and it also runs AWS Lambda functions.
      It wants one discount that keeps covering all of this compute.
      Which statements about AWS Savings Plans explain why they fit?
    options:
      - id: a
        text: Their discount applies across instance families and sizes.
        correct: true
        why: A Savings Plan keeps applying when the order system moves to another family or size.
      - id: b
        text: Their discount also reaches serverless compute such as Lambda.
        correct: true
        why: Savings Plans cover serverless services such as Lambda, so the cafe's functions share the discount.
      - id: c
        text: They accept all upfront, partial upfront or no upfront payment.
        why: The payment choices are true of Savings Plans, but they do not explain covering both kinds of compute.
      - id: d
        text: They run for a term of one or three years.
        why: The term length is true of Savings Plans, but it says nothing about which compute the discount covers.
      - id: e
        text: They suit critical workloads that want a predictable bill.
        why: Steady, critical use does fit Savings Plans, but that is not why one discount spans families and Lambda.
    evidence:
      - A Savings Plan applies whatever the Region, tenancy, OS, family or size, while an RI stays within its family and Region.
      - "Savings Plans flex across families, Regions and serverless services, and RIs do not."
    takeaway: A Savings Plan discount follows compute across families, sizes and serverless services such as Lambda.
