        why: Partial upfront is a real RI choice, but it still takes some cash when the term begins.
      - id: d
        text: Per-second billing, the way On-Demand use is charged
        why: Per-second billing is how On-Demand works, not a way to pay for a Reserved Instance term.
    evidence:
      - Savings Plans and RIs both accept all upfront, partial upfront or no upfront payment.
    takeaway: Reserved Instances can be paid all upfront, partial upfront or no upfront to suit the cash plan.
