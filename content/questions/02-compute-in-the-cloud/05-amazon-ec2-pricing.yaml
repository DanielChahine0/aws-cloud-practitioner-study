questions:
  - id: q-y78t9a
    version: 1
    status: live
    type: single
    pool: practice
    concept: on-demand-instances
    note: m02/amazon-ec2-pricing
    task: "4.1"
    level: 2
    stem: >-
      The cafe is trying a new seasonal ordering app and has no idea yet how much compute it will use.
      It wants to avoid any long-term commitment while it finds out.
      Which pricing option fits?
    options:
      - id: a
        text: Amazon EC2 On-Demand Instances
        correct: true
        why: On-Demand asks for no commitment and is how the cafe can learn the app's baseline usage first.
      - id: b
        text: Amazon EC2 Reserved Instances
        why: A reservation locks the cafe into a multi-year term before it knows what the app needs.
      - id: c
        text: AWS Savings Plans
        why: A Savings Plan commits to an hourly spend for a term, which the cafe cannot size yet.
      - id: d
        text: Amazon EC2 Dedicated Hosts
        why: A whole physical server costs more and answers licensing or compliance needs the app does not have.
    evidence:
      - On-Demand bills per hour or second, by instance type and OS, and is where most customers learn their baseline usage.
      - "Match the model to the usage: unknown means On-Demand, steady means Savings Plans or RIs, and interruptible but never critical means Spot."
    takeaway: When usage is new or unknown, On-Demand lets you run with no commitment and learn your baseline first.
    history: []
    verified:
      keyHash: 8325fea9434d
      fullHash: 0a8833ff1a85
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ct0qs3
    version: 1
    status: live
    type: single
    pool: practice
    concept: on-demand-instances
    note: m02/amazon-ec2-pricing
    task: "4.1"
    level: 1
    stem: >-
      Which statement describes how Amazon EC2 On-Demand Instances are billed?
    options:
      - id: a
        text: A committed hourly spend held for a set term of years
        why: That describes a Savings Plan, which trades a spend commitment for a lower rate.
      - id: b
        text: A deep discount on spare capacity that AWS may take back
        why: That describes Spot Instances, which AWS can reclaim when it needs the capacity.
      - id: c
        text: A per-second or per-hour charge with no term attached
        correct: true
        why: On-Demand charges only for the time an instance runs and asks for no term or upfront payment.
      - id: d
        text: A charge for a whole physical server kept for one customer
        why: That describes a Dedicated Host, which reserves an entire server rather than billing per use.
    evidence:
      - On-Demand bills per hour or second, by instance type and OS, and is where most customers learn their baseline usage.
      - "**On-Demand Instances**: pay-while-running compute with no commitment."
    takeaway: On-Demand bills per hour or second for the time an instance runs, with no commitment of any kind.
    history: []
    verified:
      keyHash: 5ae3b24ca89e
      fullHash: 27f7bf6c2e97
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-9k5c7n
    version: 1
    status: live
    type: single
    pool: practice
    concept: savings-plans
    note: m02/amazon-ec2-pricing
    task: "4.1"
    level: 2
    stem: >-
      The cafe runs steady compute all year across Amazon EC2 for its website, AWS Fargate for its order queue and AWS Lambda for receipts.
      It wants one discount that covers all three.
      Which pricing option fits?
    options:
      - id: a
        text: Reserved Instances
        why: A reservation discounts only EC2 in one family and Region, so Fargate and Lambda get nothing.
      - id: b
        text: Savings Plans
        correct: true
        why: A Savings Plan applies its lower rate across EC2, Fargate and Lambda for one steady spend commitment.
      - id: c
        text: Spot Instances
        why: Spot discounts only interruptible EC2 capacity and does not reach Fargate or Lambda at all.
      - id: d
        text: Capacity Reservations
        why: A Capacity Reservation holds EC2 capacity at the On-Demand rate and gives no discount.
    evidence:
      - "Steady usage across EC2, Fargate and Lambda: one Savings Plan."
      - "Savings Plans flex across families, Regions and serverless services, and RIs do not."
    takeaway: One Savings Plan can discount steady use across EC2, Fargate and Lambda together.
    history: []
    verified:
      keyHash: bc30d95633d8
      fullHash: 29803afb4356
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
