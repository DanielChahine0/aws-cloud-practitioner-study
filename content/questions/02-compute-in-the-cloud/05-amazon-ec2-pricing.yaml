        why: Reserved Instances give their discount for a term commitment that stays inside one family and Region.
    evidence:
      - "**Reserved Instances (RIs)**: discounts for a 1- or 3-year term in one family and Region."
    takeaway: Reserved Instances trade a 1- or 3-year term in one family and Region for a lower EC2 rate.
