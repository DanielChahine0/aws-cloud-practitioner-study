questions:
  - id: q-sm5zv8
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-apis
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 2
    stem: >-
      The cafe's manager stops one EC2 instance by clicking in the AWS Management Console, and the IT lead stops another by typing an AWS CLI command.
      Why do the click and the typed command end up doing identical work?
    options:
      - id: a
        text: Both tools first check who is making the request
        why: Checking the caller's identity decides whether a request is allowed, not why a click and a command stop the instance the same way.
      - id: b
        text: Both tools call the same underlying AWS APIs
        correct: true
        why: Every AWS task, including stopping an instance, is an API request no matter which tool sends it.
      - id: c
        text: Both tools send requests over an encrypted link
        why: Encrypting the connection protects the request in transit, but it does not explain why the click and the command have the same effect.
      - id: d
        text: Both tools act on resources in a chosen Region
        why: Choosing a Region decides where the instance lives, not why the two tools act on it in the same way.
    evidence:
      - Every AWS task, from launching to stopping or changing an instance, is an API request.
      - The console, the AWS CLI and the AWS SDK all call the same APIs.
    takeaway: Console clicks, CLI commands and SDK code all turn into the same AWS API calls underneath.
    history: []
    verified:
      keyHash: 29bf0c1a62e8
      fullHash: 03fbfebd30de
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-c2jr2a
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-apis
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 1
    stem: >-
      In AWS, what is an application programming interface (API)?
    options:
      - id: a
        text: A set of permissions that controls who may act
        why: Permissions that control who may act are IAM policies, which decide access rather than define how calls are made.
      - id: b
        text: A set of templates that declare resources as code
        why: Templates that declare resources are AWS CloudFormation templates, which themselves rely on the APIs to build.
      - id: c
        text: A set of entry points for managing resources
        correct: true
        why: An API defines fixed entry points that software uses to provision, configure and manage resources.
      - id: d
        text: A set of data centers in one geographic area
        why: Data centers grouped in one geographic area describe AWS Global Infrastructure, not a way to manage resources.
    evidence:
      - An application programming interface (API) gives fixed entry points to provision, configure and manage resources.
    takeaway: An AWS API is the fixed set of entry points that every tool uses to manage resources.
    history: []
    verified:
      keyHash: df4d82d6f446
      fullHash: bff66dbeb066
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-fhrmv8
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-management-console
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 2
    stem: >-
      The cafe's owner has no technical background and wants to look over this month's AWS bill once, by pointing and clicking.
      Which way of working with AWS fits best?
    options:
      - id: a
        text: AWS CLI
        why: The CLI expects typed commands, which suits scripting more than a one-time look by a non-technical owner.
      - id: b
        text: AWS SDK
        why: The SDK is for calling AWS from application code, which the owner does not write.
      - id: c
        text: AWS CloudShell
        why: CloudShell opens a command terminal, which still requires typing CLI commands.
      - id: d
        text: AWS Management Console
        correct: true
        why: The console is a visual browser interface that suits bills, non-technical tasks and one-time checks.
    evidence:
      - Best for learning, test environments, bills, monitoring, non-technical tasks and one-time manual setups.
    takeaway: Visual, one-off and non-technical work such as checking a bill fits the AWS Management Console.
