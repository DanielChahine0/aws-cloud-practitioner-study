    type: single
    pool: practice
    concept: aws-cloudshell
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 2
    stem: >-
      The cafe's shift lead works from a shared computer where no software can be installed, yet needs to run a few AWS CLI commands.
      What should the shift lead use?
    options:
      - id: a
        text: The AWS SDK for Python
        why: The SDK must be added to a project and called from code, which the locked-down computer cannot support.
      - id: b
        text: AWS CloudFormation
        why: CloudFormation deploys resources from templates, and it is not a terminal for running CLI commands.
      - id: c
        text: AWS CloudShell
        correct: true
        why: CloudShell is a terminal that AWS manages in the cloud with the CLI ready, so nothing needs installing.
      - id: d
        text: AWS Systems Manager
        why: Systems Manager manages and patches nodes, and it is not a terminal that comes with the CLI set up.
    evidence:
      - AWS CloudShell is an AWS-managed cloud terminal with the AWS CLI ready.
    takeaway: AWS CloudShell gives a ready-made cloud terminal with the AWS CLI, so no local install is needed.
