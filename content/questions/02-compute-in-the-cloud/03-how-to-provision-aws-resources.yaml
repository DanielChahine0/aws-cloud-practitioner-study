      The cafe's loyalty app is written in Java, and its own code must list the cafe's EC2 instances each night.
      Which tool lets the app make those calls?
    options:
      - id: a
        text: The AWS Management Console
        why: The console is a visual interface for people, so the app's code cannot call AWS through it.
      - id: b
        text: AWS CloudShell
        why: CloudShell is a terminal for typing commands, not a library that Java code can use.
      - id: c
        text: The AWS SDK
        correct: true
        why: The SDK gives Java code libraries that call the AWS APIs directly from within the app.
      - id: d
        text: The AWS CLI
        why: The CLI runs typed commands at a shell prompt rather than calls from inside Java application code.
    evidence:
      - The AWS Software Development Kit (AWS SDK) lets code in languages like Python, C++, Java and .NET call AWS, with AWS docs and sample code.
    takeaway: When an application's own code must call AWS, use the AWS SDK for its language.
