  - id: q-brb8vd
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-management-console
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 2
    stem: >-
      Every week the cafe's staff launch the same production servers by clicking through the AWS Management Console.
      What problem does this habit invite?
    options:
      - id: a
        text: The launches will bypass the AWS APIs entirely
        why: Console clicks still become API requests, so clicking does not skip the APIs at all.
      - id: b
        text: Some launches may miss a setting by mistake
        correct: true
        why: Repeating the same screens by hand is slow and makes it easy to miss a checkbox now and then.
      - id: c
        text: The servers will be billed even while stopped
        why: Only running instances are billed, whichever tool launched them, so stopped servers cost nothing here.
      - id: d
        text: The console will block a repeated server launch
        why: The console lets staff launch the same kind of server as often as they like, so nothing is blocked.
    evidence:
      - Repeating its screens for every production launch is slow and invites slips like a missed checkbox.
    takeaway: Clicking through the console for repeated production launches is slow and prone to missed settings.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 2 is the only true statement; 1, 3 and 4 are false about console launches and billing.)"
  - id: q-azhc3p
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cli
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 3
    stem: >-
      The cafe's IT lead wants to launch the same set of test instances every Monday by running a script of typed commands in the terminal app of a macOS laptop, with no browser involved.
      Which tool fits?
    options:
      - id: a
        text: AWS CLI
        correct: true
        why: The CLI turns API calls into text commands on macOS that can be scripted and repeated the same way each week.
      - id: b
        text: AWS SDK
        why: The SDK is for calling AWS from application code in a language like Java, not a script of shell commands.
      - id: c
        text: AWS Management Console
        why: The console is clicked through by hand, so it cannot run the weekly launch as a script.
      - id: d
        text: AWS CloudShell
        why: CloudShell opens in a web browser, and the stem rules out using a browser for this weekly launch.
    evidence:
      - The AWS Command Line Interface (AWS CLI) issues API calls as text commands on Windows, macOS or Linux, so repetitive work can be scripted, and automation keeps deployments predictable.
    takeaway: Repeated work scripted as typed commands on your own machine points to the AWS CLI.
