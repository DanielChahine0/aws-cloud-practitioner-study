        why: Guided visual workflows belong to the console, which relies on manual clicks.
      - id: b
        text: It runs scriptable commands
        correct: true
        why: Typed commands can be saved in a script and rerun, and that automation keeps deployments consistent.
      - id: c
        text: It ships as libraries for .NET
        why: Language libraries for .NET describe the AWS SDK, not the command line tool.
      - id: d
        text: It tracks billing on a phone
        why: Checking billing from a phone is a job for the console's mobile app, not the CLI.
    evidence:
      - The AWS Command Line Interface (AWS CLI) issues API calls as text commands on Windows, macOS or Linux, so repetitive work can be scripted, and automation keeps deployments predictable.
    takeaway: The AWS CLI turns API calls into commands you can script, so repeated deployments run the same way.
