  - id: q-brb8vd
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-management-console
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 2
    stem: >-
      Every week the cafe's staff launch the same production servers by clicking through the AWS Management Console.
      What problem does this habit invite?
    options:
      - id: a
        text: Each launch still turns into an AWS API call
        why: Console clicks do become API requests, but that is how every tool works and not a problem with the habit.
      - id: b
        text: Each launch relies on staff ticking every box
        correct: true
        why: Repeating the same screens by hand is slow and makes it easy to miss a checkbox now and then.
      - id: c
        text: Each launch goes into the Region staff choose
        why: Picking a Region is a normal part of any launch, and it is not what makes weekly clicking risky.
      - id: d
        text: Each launch shows up later on the AWS bill
        why: Running servers cost money whichever tool launched them, so the bill is not a drawback of clicking.
    evidence:
      - Repeating its screens for every production launch is slow and invites slips like a missed checkbox.
    takeaway: Clicking through the console for repeated production launches is slow and prone to missed settings.
    history: []
