  - id: q-azhc3p
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cli
    note: m02/how-to-provision-aws-resources
    task: "3.1"
    level: 3
    stem: >-
      The cafe's IT lead wants to launch the same set of test instances every Monday by running a script of typed commands in the terminal app of a macOS laptop, with no browser involved.
      Which tool fits?
    options:
      - id: a
        text: AWS CLI
        correct: true
        why: The CLI turns API calls into text commands on macOS that can be scripted and repeated the same way each week.
      - id: b
        text: AWS SDK
        why: The SDK is for calling AWS from application code in a language like Java, not a script of shell commands.
      - id: c
        text: AWS Management Console
        why: The console is clicked through by hand, so it cannot run the weekly launch as a script.
      - id: d
        text: AWS CloudShell
        why: CloudShell opens in a web browser, and the stem rules out using a browser for this weekly launch.
    evidence:
      - The AWS Command Line Interface (AWS CLI) issues API calls as text commands on Windows, macOS or Linux, so repetitive work can be scripted, and automation keeps deployments predictable.
    takeaway: Repeated work scripted as typed commands on your own machine points to the AWS CLI.
    history: []
    verified:
      keyHash: ebc3e8eca405
      fullHash: 9ba3578b3912
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
