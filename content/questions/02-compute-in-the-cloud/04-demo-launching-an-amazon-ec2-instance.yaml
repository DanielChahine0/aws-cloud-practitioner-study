questions:
  - id: q-mdxy1n
    version: 1
    status: live
    type: match
    pool: practice
    concept: launching-ec2-instances
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "3.3"
    level: 1
    stem: >-
      Match each setting chosen while launching an EC2 instance to the job it does.
    pairs:
      - left: AMI
        right: Supplies the operating system and bundled software
        why: The image decides which OS and software the new instance starts with.
      - left: Instance type
        right: Sets the CPU and memory the instance gets
        why: The instance type picks the hardware capacity behind the instance.
      - left: Storage
        right: Provides the disk volume the instance uses
        why: The storage setting attaches the volume that acts as the instance's disk.
      - left: Key pair
        right: Lets an administrator sign in to the instance
        why: The key pair holds the keys used to log in to the running instance.
      - left: Network settings
        right: Controls which traffic can reach the instance
        why: Network settings decide what traffic, such as web requests, is allowed in.
    evidence:
      - "Each setting has a job: AMI for software, instance type for hardware, storage for disk, key pair for login, network settings for traffic."
    takeaway: Every launch setting covers one area - software, hardware, disk, login or traffic.
    history: []
    verified:
      keyHash: d59f20ac3a94
      fullHash: 6bac788243f2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-zrkp7p
    version: 1
    status: live
    type: single
    pool: practice
    concept: launching-ec2-instances
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "3.1"
    level: 2
    stem: >-
      The cafe launched an EC2 instance to host its menu page, but browsers on the internet cannot load it.
      Which launch setting should the team check first?
    options:
      - id: a
        text: Instance type
        why: The instance type sets CPU and memory, not whether web requests are let in.
      - id: b
        text: Network settings
        correct: true
        why: Network settings decide whether HTTP traffic from the internet may reach the instance.
      - id: c
        text: Storage volume
        why: The storage volume gives the instance a disk and has no say over incoming traffic.
      - id: d
        text: Instance name
        why: The name only helps the team find the instance later and does not affect access.
    evidence:
      - "**Network settings**: allow HTTP from the internet."
    takeaway: Whether web visitors can reach an instance depends on the traffic its network settings allow.
    history: []
    verified:
      keyHash: 89fb8d44fcaa
      fullHash: 7662899b06e2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pt59pb
    version: 1
    status: live
    type: single
    pool: practice
    concept: ec2-key-pairs
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "2.3"
    level: 1
    stem: >-
      The cafe's IT lead launched an EC2 instance and set up SSH sign-in during the launch flow.
      Which item does the IT lead hold on to in order to sign in to that instance later?
    options:
      - id: a
        text: The public IP address
        why: The public IP address shows where to connect but does not prove who is signing in.
      - id: b
        text: The public key
        why: The public key is placed on the instance itself, so it is not the item the IT lead keeps.
      - id: c
        text: The private key
        correct: true
        why: The IT lead keeps the private key and presents it to sign in to the instance.
      - id: d
        text: The image ID
        why: The image ID only names the AMI the instance was launched from and plays no part in signing in.
    evidence:
      - "**Key pair**: a public key on the instance and a private key you keep for logging in, created at launch or reused."
    takeaway: A key pair splits into a public key on the instance and a private key the user keeps to log in.
    history: []
    verified:
      keyHash: dacd77881984
      fullHash: 77efda0de21e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
