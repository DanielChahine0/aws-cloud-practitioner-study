    stem: >-
      Ahead of the holiday rush, the cafe needs several more web servers that run the same OS, software and setup as its current one.
      Which approach achieves this?
    options:
      - id: a
        text: Use the same key pair for every server
        why: A shared key pair only changes who can log in, not what software each server runs.
      - id: b
        text: Launch every server from one AMI
        correct: true
        why: Servers launched from the same image start with the same OS, software and setup.
      - id: c
        text: Pick the same instance type for each
        why: A matching instance type gives equal hardware but does not copy the software setup.
      - id: d
        text: Give each one the same size EBS volume
        why: Equal disk space per server does not make their software and setup the same.
    evidence:
      - "Identical servers for scaling out: launch them from one AMI."
    takeaway: Launching every new server from a single AMI keeps a scaled-out fleet identical.
