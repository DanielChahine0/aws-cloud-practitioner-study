  - id: q-vkhksk
    version: 1
    status: live
    type: single
    pool: practice
    concept: ec2-key-pairs
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "3.3"
    level: 2
    stem: >-
      The cafe already made a key pair when it launched its first EC2 instance.
      It now launches a second instance and wants to sign in with the same private key.
      What can it do?
    options:
      - id: a
        text: Select the existing key pair at launch
        correct: true
        why: A key pair can be reused at launch, so the same private key works on both instances.
      - id: b
        text: Create a new key pair at launch
        why: A new key pair comes with a new private key, so the old private key would not sign in.
      - id: c
        text: Pick the same instance type as before
        why: Matching the instance type copies the hardware size, not the key used to sign in.
      - id: d
        text: Use the same AMI as the first one
        why: The AMI supplies the OS and software, while the sign-in key comes from the key pair setting.
    evidence:
      - "**Key pair**: a public key on the instance and a private key you keep for logging in, created at launch or reused."
    takeaway: An existing key pair can be picked again at launch instead of creating a new one.
    history: []
    verified:
