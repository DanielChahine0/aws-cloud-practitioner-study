    task: "3.3"
    level: 2
    stem: >-
      The cafe launches an EC2 instance from a generic Amazon Linux AMI and wants Nginx installed and running as soon as it boots, without anyone logging in.
      Which launch setting handles this?
    options:
      - id: a
        text: Key pair
        why: A key pair lets someone sign in by hand, which the cafe wants to avoid.
      - id: b
        text: Instance type
        why: The instance type picks CPU and memory but cannot install software.
      - id: c
        text: Storage
        why: The storage setting sizes the disk and does not run any setup commands.
      - id: d
        text: User data
        correct: true
        why: User data runs a script at launch, so it can install and start Nginx automatically.
    evidence:
      - "**User data**: a launch script, here installing and starting Nginx, which the generic AMI lacks."
      - "A generic Linux instance must serve web pages: install Nginx with user data."
    takeaway: To add software a generic AMI lacks at first boot, put the install steps in user data.
