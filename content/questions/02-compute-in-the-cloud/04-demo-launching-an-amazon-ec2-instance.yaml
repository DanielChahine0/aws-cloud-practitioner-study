  - id: q-s7cy7d
    version: 1
    status: live
    type: multi
    pool: practice
    concept: amazon-machine-image
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "3.3"
    level: 1
    select: 3
    stem: >-
      The cafe picks an Amazon Machine Image (AMI) for a new EC2 instance.
      Which items does it choose as separate launch settings, apart from the AMI?
    options:
      - id: a
        text: The operating system
        why: The operating system comes inside the AMI, so it is not chosen separately.
      - id: b
        text: The instance size
        correct: true
        why: The AMI does not set size, which comes from the instance type chosen at launch.
      - id: c
        text: Preinstalled software
        why: Software baked into the image arrives with the AMI and needs no separate choice.
      - id: d
        text: The network settings
        correct: true
        why: The AMI does not set networking, so traffic rules are chosen separately at launch.
      - id: e
        text: Launch permissions
        why: Launch permissions are part of the AMI and control who may launch from it.
      - id: f
        text: The key pair
        correct: true
        why: The key pair is a launch setting, created at launch or reused, not part of the image.
    evidence:
      - An AMI holds the OS, architecture, storage layout, preinstalled software and launch permissions.
      - It does not set size or networking, and it is no data store or backup, since instance data typically lives on volumes like Amazon EBS.
      - "**Key pair**: a public key on the instance and a private key you keep for logging in, created at launch or reused."
    takeaway: An AMI brings the OS, software and launch permissions, while size, networking and the key pair are chosen at launch.
    history: []
    verified:
      keyHash: a5ef868cb1ed
      fullHash: fc817d82ebaf
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-sxarw4
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-machine-image
    note: m02/demo-launching-an-amazon-ec2-instance
    task: "3.3"
    level: 2
    stem: >-
      The cafe's manager plans to rely on the web server's AMI as the backup for its daily order records.
      Why is this a poor plan?
    options:
      - id: a
        text: An AMI cannot be shared with other accounts
        why: Launch permissions let an AMI be shared, and sharing has nothing to do with keeping order records.
      - id: b
        text: An AMI holds setup, not the data instances write
        correct: true
        why: An AMI captures how an instance is set up, while order data lives on volumes such as Amazon EBS.
      - id: c
        text: An AMI cannot include any preinstalled software
        why: An AMI can bundle preinstalled software, and that is not why it fails to protect order records.
      - id: d
        text: An AMI works only for Amazon Linux instances
        why: AMIs exist for many operating systems, and the OS choice is not why it fails as a backup.
    evidence:
      - It does not set size or networking, and it is no data store or backup, since instance data typically lives on volumes like Amazon EBS.
      - An AMI is a configuration template, not a backup.
    takeaway: An AMI captures how an instance is set up, so business data needs its own storage and backups.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 3 is the only true statement about AMIs; options 1, 2 and 4 are false.)"
  - id: q-qtsy84
