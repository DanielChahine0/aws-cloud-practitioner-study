  - id: q-psfav6
    version: 1
    status: draft
    type: single
    pool: practice
    concept: ec2-instance-sizing
    note: m02/amazon-ec2-instance-types
    task: "1.4"
    level: 2
    stem: >-
      The cafe has already matched an EC2 instance family to its order system's bottleneck.
      Which size choice within that family keeps the cost of that server in check?
    options:
      - id: a
        text: Pick the largest size so it never needs a change
        why: Bigger sizes cost more, and the size can be switched later anyway, so buying the largest wastes money.
      - id: b
        text: Pick a size with spare room for future growth
        why: Paying now for capacity the order system does not yet use raises cost when the size can grow later.
      - id: c
        text: Pick the smallest size that performs well
        correct: true
        why: Larger sizes cost more, so the smallest one that meets the need saves money and can grow later.
      - id: d
        text: Pick the size with the most memory on offer
        why: The most memory comes with the biggest and costliest sizes, which the order system may not need.
    evidence:
      - Bigger sizes cost more, so pick the smallest that performs well and switch later if needed.
      - Size trades performance for cost, and nothing is permanent.
    takeaway: Start with the smallest EC2 size that performs well, since larger sizes cost more and you can resize later.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 4 is the only rightsizing best practice; options 1 to 3 all describe overprovisioning.)"
