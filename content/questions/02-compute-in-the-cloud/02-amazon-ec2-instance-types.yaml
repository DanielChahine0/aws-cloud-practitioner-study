    type: single
    pool: practice
    concept: ec2-instance-types
    note: m02/amazon-ec2-instance-types
    task: "3.3"
    level: 1
    stem: >-
      When you choose an instance type for an Amazon EC2 server, what are you mainly deciding?
    options:
      - id: a
        text: The blend of processor, memory, storage and network capacity
        correct: true
        why: Each type bundles its own mix of CPU, memory, storage and networking, and that mix is what you pick.
      - id: b
        text: The operating system and software the server starts with
        why: The starting software comes from the machine image, not from the instance type you pick.
      - id: c
        text: The billing commitment the server runs under
        why: How you pay is a separate pricing choice, so the type does not set your commitment.
      - id: d
        text: The Region whose data center hosts the server
        why: Location is chosen apart from the type, and any type choice leaves the Region open.
    evidence:
      - Like coffee machines suited to different drinks, instance families each mix CPU, memory, storage and networking differently.
      - "**Instance family**: types sharing one resource mix."
    takeaway: An EC2 instance type sets how much CPU, memory, storage and networking a server gets.
    history: []
    verified:
      keyHash: ebdd96b93ba7
      fullHash: 5fdac274f75a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
