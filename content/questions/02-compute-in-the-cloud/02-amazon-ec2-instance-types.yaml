    stem: >-
      The cafe has already matched an EC2 instance family to its order system's bottleneck and now wants to keep that server's monthly bill low.
      Which fact should guide the size it picks within that family?
    options:
      - id: a
        text: Every size in a family shares one resource mix
        why: True, but a shared resource mix says nothing about which size keeps the server's bill down.
      - id: b
        text: A type name encodes both family and size
        why: The name only labels the family and size, and it does not tell the cafe which size saves money.
      - id: c
        text: Larger sizes in a family are priced higher
        correct: true
        why: Because larger sizes cost more, the cafe should pick the smallest size that still performs well.
      - id: d
        text: A stopped instance is not charged
        why: True, but stopping the server says nothing about which size to run while it is serving orders.
    evidence:
      - Bigger sizes cost more, so pick the smallest that performs well and switch later if needed.
      - Size trades performance for cost, and nothing is permanent.
    takeaway: Start with the smallest EC2 size that performs well, since larger sizes cost more and you can resize later.
