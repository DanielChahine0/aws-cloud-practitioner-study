    stem: >-
      The cafe's developer spots an instance type name on the EC2 launch page and wants to know what it reveals.
      Which details can be read straight from that name?
    options:
      - id: a
        text: The resource mix it offers
        correct: true
        why: The front part of a type name marks the family, which sets the server's resource mix.
      - id: b
        text: The software it boots with
        why: The starting software comes from the machine image picked at launch, not from the type name.
      - id: c
        text: The place it runs in
        why: A type name is the same in every Region, so it says nothing about where the server runs.
      - id: d
        text: The scale of its capacity
        correct: true
        why: The last part of a type name marks the size, which sets how large the server is in its family.
      - id: e
        text: The way it is billed
        why: The same type can be bought On-Demand or with a commitment, so the name cannot show it.
    evidence:
      - Type names encode family and size.
    takeaway: An EC2 type name packs in two facts, the family and the size, and nothing about price or place.
