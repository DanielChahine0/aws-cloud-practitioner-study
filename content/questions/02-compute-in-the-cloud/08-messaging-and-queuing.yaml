    concept: event-driven-architecture
    note: m02/messaging-and-queuing
    task: "3.8"
    level: 2
    stem: >-
      When a customer places an order in the cafe's delivery app, payment, a kitchen alert, a stock check and driver dispatch must all start at once.
      Which design fits this setup?
    options:
      - id: a
        text: Each service reacts on its own to an order-placed event
        correct: true
        why: Each service reacts independently to the same order event, so all four start at once, which is an event-driven design.
      - id: b
        text: Each service polls one shared queue and takes orders in turn
        why: A queue hands each order to a single consumer, so only one of the four services would get each order.
      - id: c
        text: The ordering service calls each of the other services in sequence
        why: Direct calls in sequence tightly couple the services and start them one after another, not all at once.
      - id: d
        text: A load balancer sends each order to one of the four services
        why: A load balancer picks one target per request, so one order would start only one of the four services.
    evidence:
      - "**Food delivery example**: one meal order must trigger payment, a restaurant alert, an inventory check and driver dispatch at once."
      - EventBridge routes events like "order placed" to each service, copes with peaks, keeps services independent and holds events for a service that is down until it recovers.
    takeaway: In an event-driven design, one event such as an order can trigger several independent services at once.
    history: []
    verified:
      keyHash: cf3db95a36e7
      fullHash: 9e217f5f6329
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
