    concept: amazon-eventbridge
    note: m02/messaging-and-queuing
    task: "3.8"
    level: 3
    stem: >-
      The cafe's app, several AWS services and a third-party payment tool each send a notice whenever something happens, such as a new order.
      Each notice must be filtered and reshaped, then forwarded to only the services that need it.
      Which service fits?
    options:
      - id: a
        text: Amazon EventBridge
        correct: true
        why: EventBridge takes in notices from custom apps, AWS services and third-party tools, then filters, transforms and delivers them.
      - id: b
        text: Amazon Simple Queue Service (Amazon SQS)
        why: SQS holds messages for a consumer to pick up later, but it does not filter, reshape and route them to many services.
      - id: c
        text: Amazon Simple Notification Service (Amazon SNS)
        why: SNS pushes each message to its topic subscribers, but it does not reshape the messages from third-party tools first.
      - id: d
        text: Amazon Kinesis Data Streams
        why: Kinesis Data Streams ingests streaming data for apps to read, not filtering, reshaping and routing notices between services.
    evidence:
      - "EventBridge is serverless: custom apps, AWS services or third-party software feed it events, and it forwards them to the applications that need them."
      - "It handles the event pipeline end to end: intake, filtering, transformation and delivery."
    takeaway: When events from many sources need filtering, transforming and routing to several services, choose EventBridge.
    history: []
