        why: This is true of a queue, but it describes what a message holds rather than a benefit of the decoupling.
      - id: d
        text: A consumer deletes each message once it is processed
        why: This is true of SQS, but it is a step in handling messages, not a benefit the cafe gains from loose coupling.
      - id: e
        text: Amazon SNS does not hold messages for later delivery
        why: This is true of SNS, but it is about a different service and names no benefit of the cafe's queue.
    evidence:
      - "**Loosely coupled**: a message queue sits between them, so A keeps sending while B is down and messages wait until B handles them."
      - Loose coupling contains failures instead of letting them cascade, and it is the target for AWS architectures.
    takeaway: Loosely coupled components fail independently and keep sending while a receiver is unavailable.
