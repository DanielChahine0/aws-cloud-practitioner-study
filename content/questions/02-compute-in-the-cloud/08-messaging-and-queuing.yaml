questions:
  - id: q-218dgn
    version: 1
    status: live
    type: single
    pool: practice
    concept: messaging-and-queuing
    note: m02/messaging-and-queuing
    task: "3.8"
    level: 2
    stem: >-
      The cafe's ordering app hands each order straight to its kitchen app, and orders get dropped whenever the kitchen app is busy or offline.
      Which service lets the ordering app keep sending orders while the kitchen app is unavailable?
    options:
      - id: a
        text: Amazon SQS
        correct: true
        why: An SQS queue holds each order until the kitchen app picks it up, so the ordering app never waits for it.
      - id: b
        text: Amazon SNS
        why: SNS pushes messages to subscribers but does not park them for later, so an offline kitchen app misses them.
      - id: c
        text: Elastic Load Balancing
        why: ELB spreads requests over running instances, and it has nowhere to hold orders while the kitchen app is down.
      - id: d
        text: Amazon EC2 Auto Scaling
        why: Auto Scaling changes how many instances run, but it does not hold orders while the kitchen app is unavailable.
    evidence:
      - If the barista is busy or on break, the cashier is stuck and orders slow down or get dropped.
      - Posting orders to an order board removes that dependency, and buffering messages this way is called messaging and queuing.
      - It moves any volume of messages between components without losing them, and the receiver need not be available at send time.
    takeaway: Messaging and queuing puts a buffer such as an SQS queue between sender and receiver, so the sender never waits on the receiver.
    history: []
    verified:
      keyHash: 1b36297180a1
      fullHash: 4415bafaaa46
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
