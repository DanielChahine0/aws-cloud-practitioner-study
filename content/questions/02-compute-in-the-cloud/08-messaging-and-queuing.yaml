  - id: q-ammqvf
    version: 1
    status: live
    type: single
    pool: practice
    concept: loose-coupling
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    stem: >-
      The cafe's ordering app calls its receipt app directly, and whenever the receipt app crashes the ordering app starts failing too.
      Which design change keeps the ordering app working while the receipt app is down?
    options:
      - id: a
        text: Put a message queue between the two apps
        correct: true
        why: With a queue in between, the ordering app keeps sending and the messages wait until the receipt app recovers.
      - id: b
        text: Run the ordering app in two Availability Zones
        why: Two Availability Zones protect the ordering app from a data center outage, but it still calls the crashed receipt app directly.
      - id: c
        text: Scale the ordering app with EC2 Auto Scaling
        why: Auto Scaling adds ordering capacity as demand rises, but every new instance still fails when the receipt app is down.
      - id: d
        text: Take regular backups of the receipt app data
        why: Backups let the receipt app's data be restored later, but they do not stop the direct calls from failing now.
    evidence:
      - "**Tightly coupled**: components talk directly, so a failure or change in one hurts the others or the whole system, as when Application B goes down and Application A starts failing."
      - "**Loosely coupled**: a message queue sits between them, so A keeps sending while B is down and messages wait until B handles them."
    takeaway: A queue between components loosely couples them, so one component failing does not drag the other down.
    history: []
    verified:
      keyHash: c9900ccd593b
      fullHash: 871bc367c2b9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
