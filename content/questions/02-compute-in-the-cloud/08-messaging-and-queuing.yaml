  - id: q-ynmr52
    version: 1
    status: live
    type: single
    pool: practice
    concept: monolithic-vs-microservices
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    stem: >-
      The cafe's website bundles its menu pages, payment logic and database code into one application, and a payment bug takes the whole site offline.
      Which design would keep the menu pages up when payments fail?
    options:
      - id: a
        text: Split its parts into separate microservices
        correct: true
        why: Microservices keep the menu pages separate from payments, so they keep running when payments fail.
      - id: b
        text: Run several copies of it behind a load balancer
        why: Every copy carries the same payment bug, so the load balancer has no healthy copy left to send visitors to.
      - id: c
        text: Place it in an Auto Scaling group across two zones
        why: Auto Scaling adds more copies of the same coupled application, and each one fails on the payment bug.
      - id: d
        text: Keep a standby copy of it ready in a second Region
        why: The standby copy holds the same payment bug, so switching to it still takes the whole site down.
    evidence:
      - A traditional monolith tightly couples its database logic, web servers, user interface and business logic, so one failure can take down the whole application.
      - Microservices loosely couple those parts, so the rest keep working and talking when one fails, adding availability, resilience and flexibility.
    takeaway: Breaking a monolith into loosely coupled microservices lets the rest of an application run when one part fails.
    history: []
    verified:
      keyHash: 80c6013ba3ff
      fullHash: c2cb13cf8cfb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
