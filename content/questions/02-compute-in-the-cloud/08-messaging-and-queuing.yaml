    type: single
    pool: practice
    concept: messaging-and-queuing
    note: m02/messaging-and-queuing
    task: "3.8"
    level: 1
    stem: >-
      Which description matches the idea of messaging and queuing?
    options:
      - id: a
        text: Applications pass data through a holding area read later
        correct: true
        why: Messaging and queuing puts a buffer between applications, so data waits there until the receiver handles it.
      - id: b
        text: Applications pass data through direct calls that wait
        why: Direct calls that wait for a reply are a tightly coupled handoff, not a buffer between applications.
      - id: c
        text: Applications pass requests through a balancer to servers
        why: Spreading requests across servers is load balancing, which does not hold data for a receiver to read later.
      - id: d
        text: Applications pass data through copies in a second Region
        why: Copying data to another Region protects against outages but does not buffer data between applications.
    evidence:
      - "**Messaging and queuing**: passing messages between applications through a buffer."
    takeaway: Messaging and queuing passes messages between applications through a buffer instead of a direct handoff.
