    concept: loose-coupling
    note: m02/messaging-and-queuing
    task: "1.2"
    level: 2
    stem: >-
      The cafe's ordering app sends every order to its kitchen app through a message queue, and during the lunch rush the kitchen app crashes.
      Which things happen before the kitchen app comes back?
    options:
      - id: a
        text: The ordering app keeps taking new orders
        correct: true
        why: The queue accepts each order, so the ordering app keeps working instead of failing along with the kitchen app.
      - id: b
        text: The kitchen app works through the backlog
        why: Working through the waiting orders needs a running kitchen app, so it only starts once the app is back.
      - id: c
        text: New orders wait in the queue for the kitchen
        correct: true
        why: Each order the ordering app sends stays in the queue until the kitchen app is back to handle it.
      - id: d
        text: The ordering app retries until the kitchen replies
        why: The ordering app hands each order to the queue and moves on, so it never waits on a reply from the kitchen app.
      - id: e
        text: The kitchen app takes the next order off the queue
        why: A crashed kitchen app takes nothing off the queue, so every order stays there until the app is back.
    evidence:
      - "**Loosely coupled**: a message queue sits between them, so A keeps sending while B is down and messages wait until B handles them."
      - Loose coupling contains failures instead of letting them cascade, and it is the target for AWS architectures.
    takeaway: Loosely coupled components fail independently and keep sending while a receiver is unavailable.
