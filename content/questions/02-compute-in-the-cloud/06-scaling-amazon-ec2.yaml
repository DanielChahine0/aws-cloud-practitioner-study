      - id: b
        text: High availability
        why: High availability removes single points of failure and does not plan for more customers.
      - id: c
        text: Scalability
        correct: true
        why: Planning ahead so the system can take on more users by adding resources is scalability.
      - id: d
        text: Agility
        why: Agility is about adapting fast to change, such as redeploying quickly, not long-term capacity planning.
    evidence:
      - "Scalability looks ahead: long-term capacity planning so a system can absorb more users or work by adding resources."
      - "**Scalability**: the ability to take on more load by adding resources, planned long term."
    takeaway: Long-term planning to absorb more users by adding resources is scalability, not elasticity.
