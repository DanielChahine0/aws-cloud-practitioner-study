questions:
  - id: q-2a69xq
    version: 1
    status: live
    type: single
    pool: practice
    concept: scalability
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 1
    stem: >-
      Which statement describes scalability as a benefit of the AWS Cloud?
    options:
      - id: a
        text: Resources grow and shrink on their own as demand moves minute to minute
        why: Automatic, moment-to-moment growing and shrinking is elasticity, not long-term planning.
      - id: b
        text: Resources are added over time, planned ahead, to take on growing load
        correct: true
        why: Scalability is forward-looking capacity planning that absorbs more work by adding resources.
      - id: c
        text: Resources stay in service when any single instance in the system fails
        why: Staying up with no single point of failure is high availability, a different idea.
      - id: d
        text: Resources are billed only for the time that the application code runs
        why: Paying only for run time is a pricing trait and says nothing about growth planning.
    evidence:
      - "Scalability looks ahead: long-term capacity planning so a system can absorb more users or work by adding resources."
    takeaway: Scalability is planned, long-term growth that lets a system take on more load by adding resources.
    history: []
