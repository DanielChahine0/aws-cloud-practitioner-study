  - id: q-r3t870
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ec2-auto-scaling
    note: m02/scaling-amazon-ec2
    task: "3.3"
    level: 2
    stem: >-
      The cafe's Auto Scaling group has a minimum capacity of 4, a desired capacity of 6 and a maximum capacity of 12.
      A holiday promotion drives demand far above normal.
      Which setting limits how many instances the group can run during the promotion?
    options:
      - id: a
        text: The minimum capacity of 4
        why: The minimum of 4 is the floor for quiet times, so it limits how few instances run, not how many.
      - id: b
        text: The desired capacity of 6
        why: The desired capacity of 6 is the count it aims for at current load, and the group can rise above it.
      - id: c
        text: The maximum capacity of 12
        correct: true
        why: The group scales out between its minimum and maximum, and the maximum of 12 is the ceiling that caps cost.
      - id: d
        text: The instance type of its instances
        why: The instance type sets each instance's CPU and memory, not how many instances the group may run.
    evidence:
      - "**Minimum capacity**: the floor, launched as soon as the group is created (4 in the example)."
      - "**Desired capacity**: the count it aims to hold for the current load, defaulting to the minimum if unset (6)."
      - "**Maximum capacity**: the ceiling that prevents over-scaling and caps cost (12), with scaling between minimum and maximum."
    takeaway: An Auto Scaling group never runs more instances than its maximum capacity, which caps cost.
    history: []
    verified:
      keyHash: f0c2b8cf0206
      fullHash: e37b67ac6b63
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
