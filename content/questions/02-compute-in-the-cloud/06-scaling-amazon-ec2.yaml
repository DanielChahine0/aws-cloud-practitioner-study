  - id: q-nefwh9
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ec2-auto-scaling
    note: m02/scaling-amazon-ec2
    task: "3.3"
    level: 2
    stem: >-
      One instance in the cafe's Auto Scaling group fails during the breakfast rush.
      What does Amazon EC2 Auto Scaling do about the failure?
    options:
      - id: a
        text: It raises the group's maximum capacity
        why: The maximum is a fixed ceiling the cafe sets, and Auto Scaling works within it rather than raising it.
      - id: b
        text: It launches a replacement instance
        correct: true
        why: Auto Scaling keeps the desired number of instances running, so it starts a new instance in place of the failed one.
      - id: c
        text: It routes orders to the remaining instances
        why: Spreading requests over the instances that remain is the job of Elastic Load Balancing, not Auto Scaling.
      - id: d
        text: It resizes the remaining instances to a larger type
        why: Auto Scaling changes how many instances run, not their size, so it does not scale the others up.
    evidence:
      - It adds instances as demand and key metrics rise and decommissions them as demand falls, keeping the desired number running every minute.
