  - id: q-7rdbwh
    version: 1
    status: live
    type: single
    pool: practice
    concept: elasticity
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 3
    stem: >-
      The cafe's menu site gets a rush every lunch hour and is nearly idle overnight.
      The cafe wants capacity to follow these swings automatically so each hour costs only what it needs.
      Which benefit does the cafe want?
    options:
      - id: a
        text: Elasticity
        correct: true
        why: Elasticity scales out when demand spikes and back in when it falls, so each moment costs only what it needs.
      - id: b
        text: Scalability
        why: Scalability is long-term capacity planning, not automatic hour-by-hour adjustment.
      - id: c
        text: Economies of scale
        why: Economies of scale lower unit prices through huge volume, but do not shrink capacity overnight.
      - id: d
        text: High availability
        why: High availability keeps the site up through failures but does not track daily demand.
    evidence:
      - "Elasticity reacts in the moment: resources scale out automatically when demand spikes and back in when it falls, so each moment costs only what it needs."
    takeaway: Automatic, real-time growing and shrinking with demand is elasticity, while scalability is planned growth.
    history: []
    verified:
      keyHash: 7ac2a9f26d0a
      fullHash: 507805c4007a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-46vkkx
    version: 1
    status: live
    type: single
    pool: practice
    concept: elasticity
    note: m02/scaling-amazon-ec2
    task: "1.1"
    level: 1
    stem: >-
      How does elasticity on AWS help a business control its compute costs?
    options:
      - id: a
        text: Capacity is planned years ahead to absorb expected growth
        why: Long-term planning for growth is scalability, which does not cut cost during quiet hours.
      - id: b
        text: Capacity is copied across Availability Zones to survive failures
        why: Redundant copies across zones give high availability, which adds cost rather than trimming it.
      - id: c
        text: Capacity is removed automatically as demand falls
        correct: true
        why: Elastic resources scale back in as demand drops, so the business stops paying for unused capacity.
      - id: d
        text: Capacity is added to a running instance as more CPU and memory
        why: Giving one instance more power is vertical scaling and does not shrink spending when demand drops.
    evidence:
      - "Elasticity reacts in the moment: resources scale out automatically when demand spikes and back in when it falls, so each moment costs only what it needs."
      - Buying for the peak wastes money and buying for the average leaves customers waiting, so capacity should track demand hour by hour.
    takeaway: Elasticity saves money by shrinking resources automatically when demand falls, not by sizing for a fixed peak.
    history: []
    verified:
      keyHash: 7a162906b4fe
      fullHash: 74dbb7f1d342
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bxvsy0
    version: 1
    status: live
    type: single
    pool: practice
    concept: vertical-scaling
    note: m02/scaling-amazon-ec2
    task: "3.3"
    level: 1
    stem: >-
      What does it mean to scale up an Amazon EC2 workload?
    options:
      - id: a
        text: Adding more instances that share the work in parallel
        why: Adding parallel instances is scaling out, which is horizontal scaling.
      - id: b
        text: Giving a running instance more power to handle work
        correct: true
        why: Scaling up is vertical scaling, which makes an existing instance more powerful.
      - id: c
        text: Removing extra instances after a busy period ends
        why: Removing surplus instances as demand falls is scaling in.
      - id: d
        text: Placing copies of an instance in another zone
        why: Copies across Availability Zones add redundancy rather than more power per instance.
    evidence:
      - "**Scaling up (vertical)**: give running instances more power."
    takeaway: Scaling up, or vertical scaling, means making a running instance more powerful.
    history: []
    verified:
      keyHash: 7c4670b658c5
      fullHash: 78961566bcd4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
