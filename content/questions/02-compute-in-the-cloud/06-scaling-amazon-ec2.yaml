    task: "1.1"
    level: 2
    stem: >-
      The cafe plans to open locations in several new cities over the next few years.
      It is mapping out how its ordering system will add resources to absorb the extra customers.
      Which cloud benefit is the cafe planning around?
    options:
      - id: a
        text: Elasticity
