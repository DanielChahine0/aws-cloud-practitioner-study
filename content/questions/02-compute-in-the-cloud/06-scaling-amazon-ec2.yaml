    stem: >-
      The cafe is launching an online store and cannot predict when its traffic spikes will hit.
      It wants servers added as demand rises and removed as it falls, without anyone watching.
      Which AWS service should the cafe use?
    options:
      - id: a
        text: Elastic Load Balancing
        why: A load balancer spreads requests across instances but does not add or remove them.
      - id: b
        text: Amazon CloudWatch
        why: CloudWatch collects the metrics that trigger scaling but does not launch instances itself.
      - id: c
        text: Amazon EC2 Auto Scaling
        correct: true
        why: EC2 Auto Scaling adds instances as demand rises and decommissions them as it falls.
      - id: d
        text: Amazon Lightsail
        why: Lightsail offers simple, predictably priced hosting and does not follow demand automatically.
    evidence:
      - It adds instances as demand and key metrics rise and decommissions them as demand falls, keeping the desired number running every minute.
      - "A new store cannot predict its traffic spikes: let Auto Scaling follow demand."
    takeaway: To add and remove EC2 instances automatically with unpredictable demand, use Amazon EC2 Auto Scaling.
