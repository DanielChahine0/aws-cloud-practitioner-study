  - id: q-0sxzy0
    version: 1
    status: live
    type: single
    pool: practice
    concept: elastic-load-balancing
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 2
    stem: >-
      The cafe runs third-party software on its own EC2 instance to hand each incoming order to one of its servers.
      It is tired of patching, upgrading and handling failover for that software.
      Which AWS service does the same job while AWS takes over the upkeep?
    options:
      - id: a
        text: Amazon EC2 Auto Scaling
        why: Auto Scaling adjusts the number of instances but does not route requests between them.
      - id: b
        text: Amazon CloudFront
        why: CloudFront caches content close to viewers and is not a managed replacement for a load balancer in front of instances.
      - id: c
        text: AWS Global Accelerator
        why: Global Accelerator speeds up the network path to an application rather than replacing the cafe's load balancer.
      - id: d
        text: Elastic Load Balancing
        correct: true
        why: ELB is the managed load balancer, so AWS handles its patches, upgrades and failover once it is set up.
    evidence:
      - "Third-party load balancers run on AWS, but you then own their upkeep: upgrades, patches, maintenance and failover."
      - "Elastic Load Balancing (ELB) is AWS's managed option: set it up once and AWS does that upkeep."
    takeaway: ELB is the managed load balancer, so AWS does the patching, upgrades and failover that a self-run one needs.
    history: []
    verified:
      keyHash: 40e1d30e064f
      fullHash: d6f31e9ece63
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-vyvg99
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: elastic-load-balancing
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 2
    stem: >-
      The cafe's ordering front end keeps losing track of its back-end servers as they come and go.
      The cafe puts ELB between the two tiers.
      Which traits of ELB fix this problem?
    options:
      - id: a
        text: AWS handles its patches and failover
        why: This is true of ELB, but it removes upkeep work and does not stop the front end from tracking back ends.
      - id: b
        text: Front ends reach it at one Regional address
        correct: true
        why: With one Regional address to call, the front end no longer needs a list of back-end servers.
      - id: c
        text: It adds back-end servers as demand rises
        why: ELB never adds or removes instances, since setting the instance count is the job of Auto Scaling.
      - id: d
        text: It handles internal and external traffic
        why: This is true of ELB, but the kind of traffic it takes does nothing for the front end's tracking problem.
      - id: e
        text: New back ends tell it when they are ready
        correct: true
        why: A new back end signs in with ELB, unseen by the front end, so the front end never has to learn about it.
    evidence:
      - ELB is Regional, so front ends need only its single URL, and it passes each request to the back-end instance with the fewest outstanding requests.
      - A new back-end instance just tells ELB it is ready, unseen by the front end, so each tier scales on its own and the architecture is decoupled.
    takeaway: ELB decouples tiers because front ends call one Regional address and new back ends register with ELB, not with the front end.
    history: []
    verified:
      keyHash: 774c0a913d78
      fullHash: 494c4174f8be
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-aa5vr6
    version: 1
    status: live
    type: match
    pool: practice
    concept: load-balancing-routing-methods
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 1
    stem: >-
      Match each ELB routing method to how it chooses a server.
    pairs:
      - left: Round Robin
        right: Works through the servers in a fixed rotation
        why: Round Robin cycles through the servers in a fixed order.
      - left: Least Connections
        right: Picks the server holding the fewest live sessions
        why: Least Connections sends the request to the least busy server by open connections.
      - left: IP Hash
        right: Sends a given client to one server every time
        why: IP Hash ties a client IP address to one server so its requests land there each time.
      - left: Least Response Time
        right: Picks the server with the lowest latency now
        why: Least Response Time favors the quickest server to cut latency.
    evidence:
      - "**Round Robin**: routing that cycles through servers in order."
      - "**IP Hash**: routing that pins each client IP address to one server."
      - "**Least Response Time**: routing toward the fastest-responding server to cut latency."
    takeaway: ELB can route in turn, by fewest connections, by client IP or by fastest response.
    history: []
    verified:
