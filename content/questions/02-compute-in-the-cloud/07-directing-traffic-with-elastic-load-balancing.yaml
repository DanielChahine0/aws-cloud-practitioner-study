questions:
  - id: q-evjyyh
    version: 1
    status: live
    type: single
    pool: practice
    concept: load-balancing
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 2
    stem: >-
      The cafe's ordering site runs on several EC2 instances.
      During the lunch rush one instance is swamped while the others barely work.
      What should sit in front of the instances so the requests are shared out?
    options:
      - id: a
        text: An Auto Scaling group
        why: An Auto Scaling group changes how many instances run, but it does not choose which one gets each request.
      - id: b
        text: A load balancer
        correct: true
        why: A load balancer takes each incoming request and picks an instance for it, so no instance is swamped while others idle.
      - id: c
        text: An Amazon Machine Image
        why: An AMI is a template for launching instances and plays no part in sending requests to them.
      - id: d
        text: An Availability Zone
        why: An Availability Zone is a place where instances run, not a component that splits traffic between them.
    evidence:
      - A load balancer receives incoming requests and decides which instance serves each one.
      - On AWS a load balancer plays the host, so no EC2 instance sits idle or overloaded.
    takeaway: When some instances are overloaded and others idle, a load balancer in front spreads requests across them.
    history: []
    verified:
      keyHash: 148b556e7afb
      fullHash: 45a1a83b97fd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-0n46s7
    version: 1
    status: live
    type: single
    pool: practice
    concept: load-balancing
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 1
    stem: >-
      Why does spreading incoming requests over several servers improve performance?
    options:
      - id: a
        text: The hourly cost stays flat as traffic grows
        why: ELB grows with traffic at no extra hourly cost, but that is a cost benefit, not why spreading speeds things up.
      - id: b
        text: Front ends need only one address to call
        why: A single entry point simplifies the front end, but it does not explain why spreading requests helps performance.
      - id: c
        text: No single resource has to do all the work
        correct: true
        why: When the work is shared, no single resource is overloaded, so performance holds up.
      - id: d
        text: AWS handles the patching and the failover
        why: AWS-run upkeep lightens management, but it does not explain why spreading requests helps performance.
    evidence:
      - Spreading a workload keeps any one resource from carrying it all, which boosts performance.
    takeaway: Load balancing improves performance by keeping any one resource from carrying the whole workload.
    history: []
    verified:
      keyHash: 0442f5d1a64e
