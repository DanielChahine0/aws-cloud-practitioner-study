      fullHash: 8d3422705096
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-jrdpck
    version: 1
    status: live
    type: single
    pool: practice
    concept: load-balancing-routing-methods
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 2
    stem: >-
      The cafe's loyalty app keeps each customer's session on one server, so a returning customer's device must keep landing on that same server.
      Which routing method should the load balancer use?
    options:
      - id: a
        text: Round Robin
        why: Round Robin moves through the servers in turn, so a customer's requests would land on different servers.
      - id: b
        text: Least Connections
        why: Least Connections picks whichever server is least busy, which can change from one request to the next.
      - id: c
        text: IP Hash
        correct: true
        why: IP Hash ties each client IP address to one server, so a customer keeps reaching the same one.
      - id: d
        text: Least Response Time
        why: Least Response Time picks the quickest server at that moment, not the same server each time.
    evidence:
      - "**IP Hash**: routing that pins each client IP address to one server."
    takeaway: To keep each client on the same server by IP address, route with IP Hash.
