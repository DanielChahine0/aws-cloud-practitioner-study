  - id: q-bk419k
    version: 1
    status: live
    type: single
    pool: practice
    concept: elastic-load-balancing-with-auto-scaling
    note: m02/directing-traffic-with-elastic-load-balancing
    task: "3.3"
    level: 2
    stem: >-
      The cafe's menu site runs on a fleet of servers behind ELB and gets a rush every Saturday morning.
      Which service decides how many servers are running during the rush?
    options:
      - id: a
        text: Amazon EC2 Auto Scaling
        correct: true
        why: Auto Scaling sets the instance count, adding instances for the rush and removing them afterward.
      - id: b
        text: Elastic Load Balancing
        why: ELB only spreads traffic across the instances that exist and never adds or removes any.
      - id: c
        text: AWS Compute Optimizer
        why: Compute Optimizer recommends better instance sizes but does not add or remove instances for the rush.
      - id: d
        text: AWS Lambda
        why: Lambda runs code in response to events and does not manage how many EC2 instances run.
    evidence:
      - "They are separate services with complementary jobs: Auto Scaling sets how many instances run, and ELB spreads traffic across them."
      - ELB never adds, removes or resizes instances itself.
    takeaway: In an ELB plus Auto Scaling setup, Auto Scaling sets the instance count and ELB only routes traffic.
