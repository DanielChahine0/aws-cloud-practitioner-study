        text: Isolated instances sharing one physical host
        correct: true
        why: Several virtual machines run side by side on one host while being kept apart from each other.
      - id: d
        text: Launching several instances from one image
        why: Starting instances from an image of OS and software describes an AMI, not hosts shared by tenants.
    evidence:
      - "Many EC2 instances, which are virtual machines (VMs), share one physical host: multi-tenancy."
    takeaway: Multi-tenancy means many isolated EC2 instances run on the same physical host.
