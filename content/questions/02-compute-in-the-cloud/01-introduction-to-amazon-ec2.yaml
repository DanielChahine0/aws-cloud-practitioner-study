        why: Resizing an instance is vertical scaling, which is true but says nothing about the shared host.
      - id: d
        text: It can run either Windows or Linux
        why: The cafe picks the OS on any instance, so this is true but is not what sharing a host means.
    evidence:
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
      - The course also calls the sharers tenants, or users, kept apart for security and performance.
    takeaway: Sharing an EC2 host is safe because AWS keeps each tenant's instance isolated from the others.
