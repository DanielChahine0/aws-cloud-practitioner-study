  - id: q-406m7n
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-tenancy
    note: m02/introduction-to-amazon-ec2
    task: "3.3"
    level: 1
    stem: >-
      Which description matches multi-tenancy on Amazon EC2?
    options:
      - id: a
        text: Renting servers on demand instead of buying them
        why: Renting servers on demand is Compute as a Service, not the sharing of one host.
      - id: b
        text: Resizing the CPU and memory of several instances
        why: Changing instances' CPU and memory is vertical scaling, not hosts shared by tenants.
      - id: c
        text: Isolated instances sharing one physical host
        correct: true
        why: Several virtual machines run side by side on one host while being kept apart from each other.
      - id: d
        text: Launching several instances from one image
        why: Starting instances from an image of OS and software describes an AMI, not hosts shared by tenants.
    evidence:
      - "Many EC2 instances, which are virtual machines (VMs), share one physical host: multi-tenancy."
    takeaway: Multi-tenancy means many isolated EC2 instances run on the same physical host.
    history: []
    verified:
      keyHash: eeaf52756b63
      fullHash: fdde8552df6d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
