  - id: q-988mvs
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "3.3"
    level: 2
    stem: >-
      The cafe stops its test EC2 instance every evening and starts it again each morning.
      Which fact about EC2 makes this habit cut the cafe's bill?
    options:
      - id: a
        text: Only running instances are billed
        correct: true
        why: Stopping the instance overnight ends its charges until it runs again in the morning.
      - id: b
        text: A terminated instance is deleted
        why: This is true, but the cafe only stops the instance, so deletion plays no part in the saving.
      - id: c
        text: Instances are usable within minutes
        why: Fast launches are true of EC2, but speed does not lower what the idle hours cost.
      - id: d
        text: The cafe picks each instance's OS
        why: Choosing Windows or Linux is true of EC2 but has no effect on overnight charges.
    evidence:
      - Only running instances are billed.
      - A stopped instance can be restarted later, a terminated one is deleted, and neither restarts by itself unless configured to.
    takeaway: Stopping an EC2 instance when it is idle saves money, because only running instances are billed.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: Option 3 'billed' repeats the stem's 'bill', and it is the only option about charges."
