questions:
  - id: q-ra04ca
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "3.3"
    level: 1
    stem: >-
      Which AWS service rents out resizable virtual servers on demand, so a business never has to buy server hardware?
    options:
      - id: a
        text: AWS Lambda
        why: Lambda runs code in response to events and hands out no virtual server to manage.
      - id: b
        text: Amazon EC2
        correct: true
        why: EC2 provides virtual servers called instances that you rent on demand and can resize.
      - id: c
        text: AWS Fargate
        why: Fargate runs containers without any server for you to see, rather than renting out virtual servers.
      - id: d
        text: Amazon EKS
        why: EKS runs Kubernetes for containers and is not the service that rents out virtual servers.
    evidence:
      - Compute is processing power for applications, data and calculations, rented on demand as virtual machines with no hardware to own.
    takeaway: Amazon EC2 is the AWS service for on-demand, resizable virtual servers that replace owned hardware.
    history: []
    verified:
      keyHash: b6487fad73fe
      fullHash: 7037119ea2c3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-c494w6
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "2.1"
    level: 2
    stem: >-
      The cafe wants to install a new loyalty program on its point-of-sale EC2 instances without waiting on AWS.
      Under the split of duties between AWS and the cafe, which fact lets the cafe do this itself?
    options:
      - id: a
        text: AWS manages the physical host under each instance
        why: This is true, but AWS looking after the hardware says nothing about who installs programs on the instances.
      - id: b
        text: AWS runs the hypervisor on each physical host
        why: This is true, but the hypervisor sits below the instances and has no part in installing the cafe's program.
      - id: c
        text: The cafe controls the software on each instance
        correct: true
        why: The cafe fully controls the software on its instances, so it can install the loyalty program on its own.
      - id: d
        text: The cafe decides which requests reach each instance
        why: This is true, but controlling incoming requests is about access, not about installing a new program.
    evidence:
      - You choose the OS (Windows or Linux, across up to thousands of instances), fully control the software, and decide which requests get in and whether access is public or private.
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
    takeaway: On EC2 the customer controls the OS and software on its instances, while AWS manages the host, hypervisor and isolation.
    history: []
    verified:
      keyHash: "58243e392401"
      fullHash: a3a4770b3768
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
