questions:
  - id: q-ra04ca
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "3.3"
    level: 1
    stem: >-
      Which AWS service rents out resizable virtual servers on demand, so a business never has to buy server hardware?
    options:
      - id: a
        text: AWS Lambda
        why: Lambda runs code in response to events and hands out no virtual server to manage.
      - id: b
        text: Amazon EC2
        correct: true
        why: EC2 provides virtual servers called instances that you rent on demand and can resize.
      - id: c
        text: AWS Fargate
        why: Fargate runs containers without any server for you to see, rather than renting out virtual servers.
      - id: d
        text: Amazon EKS
        why: EKS runs Kubernetes for containers and is not the service that rents out virtual servers.
    evidence:
      - Compute is processing power for applications, data and calculations, rented on demand as virtual machines with no hardware to own.
    takeaway: Amazon EC2 is the AWS service for on-demand, resizable virtual servers that replace owned hardware.
    history: []
    verified:
      keyHash: b6487fad73fe
      fullHash: 7037119ea2c3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-c494w6
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-ec2
    note: m02/introduction-to-amazon-ec2
    task: "2.1"
    level: 2
    stem: >-
      The cafe runs its point-of-sale program on several EC2 instances.
      Under the split of duties between AWS and the cafe, which item does the cafe itself control?
    options:
      - id: a
        text: The physical host under each instance
        why: AWS manages the host machine, so the cafe never touches the hardware its instances run on.
      - id: b
        text: The hypervisor on each physical host
        why: AWS runs the hypervisor that shares the host's resources, so it is not the cafe's to control.
      - id: c
        text: The software installed on each instance
        correct: true
        why: The cafe picks the OS and fully controls the software on its instances, including the sales program.
      - id: d
        text: The isolation between instances on a host
        why: AWS keeps tenants on a shared host apart, so the cafe does not manage that isolation itself.
    evidence:
      - You choose the OS (Windows or Linux, across up to thousands of instances), fully control the software, and decide which requests get in and whether access is public or private.
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
    takeaway: On EC2 the customer controls the OS and software on its instances, while AWS manages the host, hypervisor and isolation.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 4 is the odd one out, the only customer-side item among three AWS-side ones.)"
  - id: q-rjqabt
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: on-premises-vs-cloud
    note: m02/introduction-to-amazon-ec2
    task: "1.1"
    level: 2
    stem: >-
      The cafe is opening a second shop and needs servers for a new ordering website.
      Which gains does launching EC2 instances give the cafe that buying its own servers lacks?
    options:
      - id: a
        text: It can skip paying upfront for server hardware
        correct: true
        why: Renting instances removes the upfront hardware purchase that owning servers requires.
      - id: b
        text: It can pick Windows or Linux for each server
        why: The cafe chooses the OS on EC2, but it could also choose it on servers it bought.
      - id: c
        text: It can start using new servers within minutes
        correct: true
        why: AWS keeps large capacity running, so new instances are ready almost at once with no delivery wait.
      - id: d
        text: It can decide which requests reach each server
        why: EC2 lets the cafe control incoming requests, but owned servers allow that control too.
      - id: e
        text: It can install any software it likes on each server
        why: The cafe fully controls software on EC2, yet it controls software on owned servers as well.
    evidence:
      - Owning means upfront purchases, delivery waits, installation and fixed capacity.
      - AWS keeps huge capacity running, so instances are usable within minutes.
    takeaway: EC2 replaces upfront hardware buying and long delivery waits with servers that are ready within minutes.
    history: []
    verified:
      keyHash: f8f126e1068e
      fullHash: 64d4730076c2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bnxxvb
    version: 1
    status: live
    type: single
    pool: practice
    concept: on-premises-vs-cloud
    note: m02/introduction-to-amazon-ec2
    task: "1.4"
    level: 2
    stem: >-
      The cafe added servers for the holiday rush, and in January half of them sit idle.
      Which advantage of EC2 over bought servers helps the cafe most in January?
    options:
      - id: a
        text: It can have new instances running within minutes
        why: Fast launches helped during the rush, but in January the cafe needs fewer servers, not more.
      - id: b
        text: It can terminate the surplus instances
        correct: true
        why: The cafe can drop the unneeded instances, while bought servers stay a cost after the rush.
      - id: c
        text: It can pick Windows or Linux for each instance
        why: Choosing the OS is true of EC2 but does nothing about the half of the servers left idle.
      - id: d
        text: It can reach instances through AWS Systems Manager
        why: Systems Manager eases access to instances but does not cut the number the cafe pays for.
    evidence:
      - Usage can swing widely, and you are never locked into servers you no longer need.
    takeaway: EC2 lets capacity shrink after a peak, while bought servers stay a cost long after the demand is gone.
