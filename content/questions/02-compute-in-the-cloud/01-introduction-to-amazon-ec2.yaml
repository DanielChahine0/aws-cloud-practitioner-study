    task: "1.1"
    level: 2
    stem: >-
      The cafe is opening a second shop and needs servers for a new ordering website.
      Which gains does launching EC2 instances give the cafe that buying its own servers lacks?
    options:
      - id: a
        text: It can skip paying upfront for server hardware
        correct: true
        why: Renting instances removes the upfront hardware purchase that owning servers requires.
      - id: b
        text: It can pick Windows or Linux for each server
        why: The cafe chooses the OS on EC2, but it could also choose it on servers it bought.
      - id: c
        text: It can start using new servers within minutes
        correct: true
        why: AWS keeps large capacity running, so new instances are ready almost at once with no delivery wait.
      - id: d
        text: It can decide which requests reach each server
        why: EC2 lets the cafe control incoming requests, but owned servers allow that control too.
      - id: e
        text: It can install any software it likes on each server
        why: The cafe fully controls software on EC2, yet it controls software on owned servers as well.
    evidence:
      - Owning means upfront purchases, delivery waits, installation and fixed capacity.
      - AWS keeps huge capacity running, so instances are usable within minutes.
    takeaway: EC2 replaces upfront hardware buying and long delivery waits with servers that are ready within minutes.
