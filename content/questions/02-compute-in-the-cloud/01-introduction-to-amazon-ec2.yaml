  - id: q-b320ma
    version: 1
    status: live
    type: single
    pool: practice
    concept: hypervisor
    note: m02/introduction-to-amazon-ec2
    task: "3.3"
    level: 1
    stem: >-
      Which software on an EC2 host splits its resources among virtual machines and keeps them apart from each other?
    options:
      - id: a
        text: The Amazon Machine Image
        why: An AMI is the OS and software an instance starts from, not host software that shares resources.
      - id: b
        text: The guest operating system
        why: Each VM's own OS runs inside one instance and cannot divide the host among other VMs.
      - id: c
        text: The hypervisor
        correct: true
        why: The hypervisor runs on the host, hands its resources out to the VMs and isolates them.
      - id: d
        text: AWS Systems Manager
        why: Systems Manager manages instances and gives access to them, but it is not host software dividing resources among VMs.
    evidence:
      - A hypervisor on the host shares resources among them while isolating them, and AWS manages host, hypervisor and isolation.
    takeaway: The hypervisor is the host software that shares resources among VMs and keeps them isolated.
    history: []
