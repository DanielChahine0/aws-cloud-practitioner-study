      What does the term Compute as a Service describe?
    options:
      - id: a
        text: Splitting one host's resources among many VMs
        why: Sharing a host's resources among VMs is the hypervisor's job, not the service model itself.
      - id: b
        text: Changing a server's CPU and memory as needs grow
        why: Changing CPU and memory is vertical scaling, which is not what the term Compute as a Service names.
      - id: c
        text: Renting servers on demand instead of buying them
        correct: true
        why: Compute as a Service means getting servers from a provider when you need them, with nothing to buy.
      - id: d
        text: Starting a server from an image of OS and software
        why: Starting from an image of OS and software describes an AMI, not the service model.
    evidence:
      - "**Compute as a Service**: renting servers on demand."
    takeaway: Compute as a Service means renting servers on demand rather than buying and running your own.
