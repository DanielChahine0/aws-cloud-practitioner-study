  - id: q-jmg705
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds-read-replicas
    note: m11/cost-optimization
    task: "3.4"
    level: 3
    stem: >-
      The cafe's Amazon RDS menu database gets far more lookups than updates.
      The team wants to spread those lookups across extra database copies instead of moving the primary to a larger instance class.
      Which option fits?
    options:
      - id: a
        text: Multi-AZ deployment
        why: A Multi-AZ standby waits to take over on failure and does not serve the menu lookups.
      - id: b
        text: Read replicas
        correct: true
        why: Replicas serve the lookups side by side, so the primary avoids a bigger, costlier instance.
      - id: c
        text: Storage autoscaling
        why: Storage autoscaling grows disk space with demand but adds no copies to share the lookups.
      - id: d
        text: DB snapshots
        why: A snapshot is a backup copy kept for restores, not a running copy that answers lookups.
    evidence:
      - Read replicas scale reads horizontally, sparing the primary a bigger, costlier instance.
    takeaway: Read replicas spread read traffic across copies so the primary database need not scale up to a pricier class.
