questions:
  - id: q-rctwga
    version: 1
    status: live
    type: single
    pool: practice
    concept: cost-optimization
    note: m11/cost-optimization
    task: "1.4"
    level: 2
    stem: >-
      The cafe's ordering system runs on Amazon EC2, keeps orders in Amazon RDS inside a VPC, and stores receipts in Amazon S3.
      The team has already rightsized the EC2 instances, yet the bill is still higher than planned.
      What should the team review next?
    options:
      - id: a
        text: The EC2 instances and their instance types
        why: The instances already fit their load, so a second pass over them leaves the rest of the design unchecked.
      - id: b
        text: The IAM users and their permission policies
        why: IAM carries no charge of its own, so reviewing users and policies cannot shrink the bill.
      - id: c
        text: The RDS database and the S3 receipt store
        correct: true
        why: The design also spans a database and storage, and each of them can hold savings the EC2 work never touched.
      - id: d
        text: The VPC route tables and security groups
        why: Route tables and security groups carry no charge of their own, so they hold no savings to find.
    evidence:
      - Solutions usually combine services, so look for savings across the design (here EC2, RDS in a VPC, and S3).
    takeaway: Cost optimization reviews every service in a design, not only the compute layer.
    history: []
    verified:
      keyHash: 87915e8be2cd
      fullHash: e68b7327ff9c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-x48rw3
    version: 1
    status: live
    type: single
    pool: practice
    concept: cost-optimization
    note: m11/cost-optimization
    task: "1.4"
    level: 2
    stem: >-
      Over the year, the cafe made many small cost tweaks across its AWS design.
      Besides the savings, what do such tweaks often bring?
    options:
      - id: a
        text: A designated technical account manager
        why: A designated technical account manager comes with Enterprise Support, not from trimming costs.
      - id: b
        text: Better performance and reliability
        correct: true
        why: Small tweaks add up, and trimming waste often leaves a workload faster and sturdier as well as cheaper.
      - id: c
        text: Free data transfer from the internet
        why: Data arriving from the internet is free whether or not the cafe tunes anything, so the tweaks do not bring it.
      - id: d
        text: Round-the-clock customer service
        why: Customer service around the clock comes with every Support plan, not from cost tweaks.
    evidence:
      - Small tweaks add up and often improve performance and reliability too.
    takeaway: Small cost tweaks add up and often lift performance and reliability along with savings.
