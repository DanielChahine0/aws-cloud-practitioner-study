    task: "1.4"
    level: 1
    stem: >-
      What does AWS Compute Optimizer do?
    options:
      - id: a
        text: It flags resources that are larger than the workloads they run need
        correct: true
        why: Compute Optimizer spots overprovisioned compute so it can be rightsized to cut waste.
      - id: b
        text: It charts past spend over time and forecasts what future spend will be
        why: That describes AWS Cost Explorer, which reports on spend rather than sizing compute.
      - id: c
        text: It sends an alert when spend nears or passes a budget you set
        why: That describes AWS Budgets, which watches spend thresholds rather than instance sizes.
      - id: d
        text: It estimates the monthly cost of an architecture before it is built
        why: That describes AWS Pricing Calculator, which plans costs rather than reviewing running compute.
    evidence:
      - AWS Compute Optimizer, a cost-minded sidekick, flags overprovisioned instances.
      - Rightsize EC2 with AWS Compute Optimizer, and RDS with storage autoscaling.
    takeaway: AWS Compute Optimizer flags overprovisioned compute, which feeds rightsizing.
