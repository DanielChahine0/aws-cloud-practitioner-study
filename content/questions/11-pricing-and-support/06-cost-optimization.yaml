  - id: q-ccabvz
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-rds-read-replicas
    note: m11/cost-optimization
    task: "3.4"
    level: 3
    stem: >-
      The cafe's Amazon RDS database slows each morning as many loyalty app users browse the menu, and almost none of them change any data.
      The team wants to avoid moving the primary to a larger, pricier instance class.
      Which option fits?
    options:
      - id: a
        text: Amazon RDS read replicas
        correct: true
        why: Read replicas take the menu reads across extra copies, so the primary can stay at its current size.
      - id: b
        text: Amazon RDS Multi-AZ deployment
        why: A Multi-AZ standby waits to take over on failure and does not serve the morning reads.
      - id: c
        text: Amazon RDS storage autoscaling
        why: Storage autoscaling resizes storage and does nothing for a primary overloaded by reads.
      - id: d
        text: Amazon RDS DB snapshots
        why: Snapshots are point-in-time backups and take no read traffic off the primary.
    evidence:
      - Read replicas scale reads horizontally, sparing the primary a bigger, costlier instance.
    takeaway: A read-heavy RDS load scales out with read replicas instead of a costlier, larger primary.
    history: []
    verified:
      keyHash: 487db8ce05ff
      fullHash: 02929eb1b7b5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
