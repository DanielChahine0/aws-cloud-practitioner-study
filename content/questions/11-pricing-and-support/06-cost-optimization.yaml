  - id: q-qzq1yp
    version: 1
    status: live
    type: single
    pool: practice
    concept: vpc-endpoints
    note: m11/cost-optimization
    task: "3.5"
    level: 2
    stem: >-
      The cafe's EC2 instances copy receipt files to Amazon S3 every night.
      The team wants that traffic to stay off the public internet and to trim its transfer charges.
      Which component fits?
    options:
      - id: a
        text: A VPC endpoint
        correct: true
        why: A VPC endpoint links the VPC privately to S3, keeping traffic off the internet and trimming transfer costs.
      - id: b
        text: An internet gateway
        why: An internet gateway sends the copies over the public internet, which the team wants to avoid.
      - id: c
        text: A NAT gateway
        why: A NAT gateway lets private instances reach out toward the internet rather than giving a private path to S3.
      - id: d
        text: A virtual private gateway
        why: A virtual private gateway carries traffic from approved outside networks, not from the VPC to S3.
    evidence:
      - VPC endpoints connect a VPC privately to supported services, and one used for S3 trims transfer costs, notably out-of-Region.
    takeaway: A VPC endpoint gives a VPC a private path to S3 that also trims data transfer costs.
    history: []
    verified:
      keyHash: f1255fa9e3d1
      fullHash: d5dedfdabe83
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pdvabf
    version: 1
    status: live
    type: single
    pool: practice
    concept: vpc-endpoints
    note: m11/cost-optimization
    task: "4.1"
    level: 1
    stem: >-
      Why can a VPC endpoint for Amazon S3 lower an AWS bill?
    options:
      - id: a
        text: It keeps traffic on a private path that trims transfer charges
        correct: true
        why: The endpoint keeps S3 traffic private and off the internet, which cuts data transfer costs.
      - id: b
        text: It moves stored objects into a cheaper storage class as their access drops
        why: That is S3 Intelligent-Tiering, a storage class choice rather than a network path.
      - id: c
        text: It compresses objects when they are uploaded to the bucket
        why: Compression on upload is a separate step, such as a Lambda function, not an endpoint feature.
      - id: d
        text: It deletes old object versions after a set period
        why: That is an S3 lifecycle policy, which expires data rather than routing traffic.
    evidence:
      - VPC endpoints connect a VPC privately to supported services, and one used for S3 trims transfer costs, notably out-of-Region.
      - Keep cross-AZ and internet traffic low, and use VPC endpoints for S3.
    takeaway: A VPC endpoint for S3 saves money on data transfer, not on storage.
    history: []
    verified:
      keyHash: 5ae3bee2eea5
      fullHash: 96872787eef7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-x2r88h
    version: 1
    status: live
    type: single
    pool: practice
    concept: cost-optimization
    note: m11/cost-optimization
    task: "1.4"
    level: 2
    stem: >-
      A cafe developer proposes shrinking every resource to its smallest size, even if orders slow down at the morning peak.
      Cost optimization on AWS instead aims for the right balance among which goals?
    options:
      - id: a
        text: Cost, storage and data transfer
        why: Storage and data transfer are drivers on the bill, not goals that cost optimization weighs against cost.
      - id: b
        text: Cost, security and regulatory compliance
        why: Security and compliance are real design concerns, but cost optimization weighs the bill against speed and running effort.
      - id: c
        text: Cost, performance and efficiency
        correct: true
        why: The goal is the right mix of cost, performance and operational efficiency, so the morning peak cannot be sacrificed.
      - id: d
        text: Cost, agility and innovation
        why: Agility and innovation are cloud benefits, but the balance cost optimization seeks is cost against performance and efficiency.
    evidence:
      - Aim for the right balance of cost, performance and operational efficiency.
    takeaway: Cost optimization balances cost against performance and operational efficiency rather than chasing the lowest bill.
