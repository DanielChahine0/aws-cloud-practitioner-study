  - id: q-zm6nd9
    version: 1
    status: live
    type: single
    pool: practice
    concept: rightsizing
    note: m11/cost-optimization
    task: "1.4"
    level: 2
    stem: >-
      Monitoring shows that the cafe's inventory server on Amazon EC2 sits mostly idle on CPU and memory all day.
      Which step stops the cafe paying for computing power the server never uses?
    options:
      - id: a
        text: Switch it to a smaller instance type
        correct: true
        why: Measured use shows the server is oversized, so a type that fits the real load drops the unused power from the bill.
      - id: b
        text: Buy a Reserved Instance at its current size
        why: A reservation lowers the rate but still pays for the same oversized instance and its idle power.
      - id: c
        text: Move it onto a Dedicated Host
        why: A Dedicated Host adds physical isolation at a higher price and does nothing about the idle power.
      - id: d
        text: Add a second instance behind a load balancer
        why: A second instance doubles computing power that is already mostly idle, which raises the bill.
    evidence:
      - "Rightsizing: measure real workload needs and resize to fit."
    takeaway: Rightsizing uses measured usage to shrink an oversized instance to one that fits the real load.
    history: []
    verified:
      keyHash: f6c5a25dd423
      fullHash: 62a1eac4510a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-v166dn
    version: 1
    status: live
    type: single
    pool: practice
    concept: rightsizing
    note: m11/cost-optimization
    task: "1.4"
    level: 2
    stem: >-
      The cafe's Amazon RDS database holds a recipe archive that grows in fits and starts.
      The team wants the database's allocated space to grow along with the archive instead of buying a large amount up front.
      Which feature fits?
    options:
      - id: a
        text: Amazon RDS storage autoscaling
        correct: true
        why: Storage autoscaling grows the database's storage as the archive does, so the cafe skips a big up-front allocation.
      - id: b
        text: Amazon RDS Multi-AZ deployment
        why: A Multi-AZ standby protects against failure and adds a second copy to pay for, not a storage fit.
      - id: c
        text: Amazon RDS read replicas
        why: Read replicas take read traffic off the primary and do not size its storage to the archive.
      - id: d
        text: Amazon RDS DB snapshots
        why: Snapshots back up the database at a point in time and leave its storage allocation unchanged.
    evidence:
      - Rightsize databases too; storage autoscaling matches storage to demand.
    takeaway: Rightsizing applies to databases too, and RDS storage autoscaling keeps storage in step with demand.
    history: []
    verified:
      keyHash: 5e6029fe551a
      fullHash: f242b9c1eb79
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-3m5qtk
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-compute-optimizer
    note: m11/cost-optimization
    task: "4.2"
    level: 3
    stem: >-
      The cafe suspects that several of its EC2 instances are bigger than their workloads need.
      It wants a service that points out exactly which instances are overprovisioned.
      Which service fits?
    options:
      - id: a
        text: AWS Compute Optimizer
        correct: true
        why: Compute Optimizer compares each instance with its real use and flags the ones that are oversized.
      - id: b
        text: AWS Cost Explorer
        why: Cost Explorer charts and forecasts spend, but it does not judge each instance's size against its load.
      - id: c
        text: AWS Budgets
        why: Budgets alerts the cafe when spend nears a limit and does not name which instances are too large.
      - id: d
        text: AWS Pricing Calculator
        why: The calculator estimates costs for a planned design and never looks at the cafe's running instances.
    evidence:
      - AWS Compute Optimizer, a cost-minded sidekick, flags overprovisioned instances.
      - "Overprovisioned instances: AWS Compute Optimizer."
    takeaway: To find oversized EC2 instances by name, use AWS Compute Optimizer rather than a spend chart or budget.
    history: []
    verified:
      keyHash: b2ae8e985de8
      fullHash: ffa6f157ada4
