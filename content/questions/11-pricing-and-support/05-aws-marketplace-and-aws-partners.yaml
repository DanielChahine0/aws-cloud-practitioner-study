  - id: q-6mvwks
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-partner-network
    note: m11/aws-marketplace-and-aws-partners
    task: "4.3"
    level: 3
    stem: >-
      The cafe wants to hire an outside consulting firm that works with AWS to add machine learning menu suggestions to its app.
      Where should it look for that firm?
    options:
      - id: a
        text: AWS Partner Network
        correct: true
        why: The APN is the community of outside consulting and technology firms that customers can hire for AWS projects.
      - id: b
        text: AWS Professional Services
        why: This team is part of AWS itself, so it is not the outside firm the cafe wants to hire.
      - id: c
        text: AWS re:Post
        why: This is a community question-and-answer site, not a place to engage a firm for a project.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor runs automated account checks and does not connect the cafe with consultants.
    evidence:
      - Customers can hire partners, like a retailer adding ML personalization.
    takeaway: To hire an outside firm that builds on AWS, look to the AWS Partner Network rather than AWS's own consultants.
