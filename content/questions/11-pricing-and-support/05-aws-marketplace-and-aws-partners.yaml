  - id: q-xmgxrd
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-partner-funding
    note: m11/aws-marketplace-and-aws-partners
    task: "4.3"
    level: 2
    stem: >-
      A small firm that builds AWS ordering systems for cafes has joined the AWS Partner Network.
      It plans a campaign to market and sell its system alongside AWS, but it lacks the budget to run it.
      Which partner benefit fits?
    options:
      - id: a
        text: Funding through partner programs
        correct: true
        why: Partner programs provide funding so partners can build, market and sell their solutions with AWS.
      - id: b
        text: Webinars and in-person partner events
        why: Events offer networking and updates with AWS experts, not backing for a marketing and sales campaign.
      - id: c
        text: Partner-centered training and certification
        why: Training builds the firm's skills but does not pay for marketing or selling its solution.
      - id: d
        text: Volume discounts for partners
        why: Volume discounts lower what the firm pays AWS, rather than backing a campaign to market and sell.
    evidence:
      - Funding, via partner programs, to build, market and sell with AWS.
    takeaway: AWS Partner funding, delivered through partner programs, helps partners build, market and sell with AWS.
    history: []
    verified:
      keyHash: 97800418a4d6
