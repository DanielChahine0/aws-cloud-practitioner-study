questions:
  - id: q-s038yb
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-marketplace
    note: m11/aws-marketplace-and-aws-partners
    task: "4.3"
    level: 3
    stem: >-
      The cafe wants to buy a ready-made inventory tool from an outside vendor, try it first and have the charges land on its AWS bill.
      Where should it shop?
    options:
      - id: a
        text: AWS Marketplace
        correct: true
        why: Marketplace is the catalog for finding, trying and buying third-party software, billed with the AWS account.
      - id: b
        text: AWS Partner Network
        why: The partner community is where the cafe hires firms for help, not a store for packaged software.
      - id: c
        text: AWS Professional Services
        why: This is consulting from AWS itself, so it sells project work rather than a vendor's inventory tool.
      - id: d
        text: AWS Service Catalog
        why: Service Catalog lists products a company has approved internally, not a store of outside vendors' tools.
    evidence:
      - It spans discovery, trial, purchase, deployment and management, with pricing and reviews per listing.
      - Buying is simpler, deploying and scaling are quick, and charges join your AWS bill.
    takeaway: To find, try and buy third-party software billed through your AWS account, go to AWS Marketplace.
    history: []
    verified:
      keyHash: a1d9d9b503b3
      fullHash: 3f1dfcde263a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1v72k1
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-marketplace
    note: m11/aws-marketplace-and-aws-partners
    task: "2.4"
    level: 2
    stem: >-
      The cafe needs a firewall product from a security vendor.
      It wants the firewall protecting the ordering app soon, and it wants to pay through its existing AWS account instead of a separate vendor account.
      Which AWS Marketplace benefits match those two goals?
    options:
      - id: a
        text: Charges for listings are added to the AWS bill
        correct: true
        why: Marketplace purchases join the AWS bill, so the cafe does not set up a separate payment with the vendor.
      - id: b
        text: Compliance-ready software is quicker than an in-house build
        correct: true
        why: Ready security software gets the ordering app protected sooner than building a firewall itself would.
      - id: c
        text: Listings include prebuilt image recognition models
        why: Prebuilt ML models are a real Marketplace offering, but they do nothing for a quick firewall or for billing.
      - id: d
        text: The catalog also sells datasets for analytics
        why: Datasets are sold in Marketplace too, yet they do not speed up the firewall or change how the cafe pays.
      - id: e
        text: Listings can be browsed by industry, like healthcare
        why: Industry views help buyers find tools, but they meet neither the speed goal nor the payment goal.
    evidence:
      - Buying is simpler, deploying and scaling are quick, and charges join your AWS bill.
      - Compliance-ready software is quicker than an in-house build or working from documentation.
      - Pricing can be free, pay-as-you-go or annual.
    takeaway: Marketplace security tools arrive compliance-ready and bill through the AWS account, saving time over an in-house build.
    history: []
    verified:
      keyHash: c551d1cf6146
      fullHash: c7d129871e37
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
