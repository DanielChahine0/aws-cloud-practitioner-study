  - id: q-gn5az9
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-budgets
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 3
    stem: >-
      The cafe owner has set a ceiling for monthly AWS spend and wants an email as soon as charges get close to it.
      Which tool fits?
    options:
      - id: a
        text: AWS Cost Explorer
        why: Cost Explorer can forecast spend, but it does not send a warning when a limit is near.
      - id: b
        text: AWS Pricing Calculator
        why: The calculator estimates costs before deploying and has no view of live charges.
      - id: c
        text: AWS Budgets
        correct: true
        why: Budgets is built to warn when spend approaches or passes a limit the owner sets.
      - id: d
        text: AWS Cost and Usage Report
        why: The report delivers detailed cost files to a bucket but raises no alert on a limit.
    evidence:
      - Budgets and Cost Explorer both forecast, but only Budgets sends threshold alerts.
      - "A monthly cost limit needing notifications: AWS Budgets."
    takeaway: A spending limit that must trigger a notification points to AWS Budgets.
