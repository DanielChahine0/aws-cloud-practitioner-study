    concept: aws-budgets
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 2
    stem: >-
      The cafe signed a one-term spending commitment for its ordering servers.
      The owner wants an email whenever the cafe falls short of making full use of it.
      Which tool fits?
    options:
      - id: a
        text: AWS Budgets
        correct: true
        why: Budgets can track Savings Plans and Reserved Instance utilization and send an alert when it drops.
      - id: b
        text: AWS Cost Explorer
        why: Cost Explorer charts usage and forecasts spend, but it sends no alert when use falls short.
      - id: c
        text: AWS Pricing Calculator
        why: The calculator prices a design ahead of time and cannot watch how a commitment is used.
      - id: d
        text: AWS Cost and Usage Report
        why: The report delivers detailed cost files to a bucket but raises no alert when use falls short.
    evidence:
      - Only AWS Budgets alerts on thresholds.
      - Custom budgets by service, cost category or tag, including Savings Plans and Reserved Instance utilization or coverage
    takeaway: AWS Budgets can watch Savings Plans and Reserved Instance utilization and warn when it drops.
