questions:
  - id: q-2hznsw
    version: 1
    status: live
    type: single
    pool: practice
    concept: consolidated-billing
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 2
    stem: >-
      Each of the cafe's shops runs in its own AWS account, and the owner gets a separate bill from each one.
      What lets the head office pay a single bill that covers every shop?
    options:
      - id: a
        text: AWS Budgets
        why: Budgets warns when spend nears a limit, but each shop would still get its own bill.
      - id: b
        text: Consolidated billing
        correct: true
        why: Linking the shop accounts to a primary account sends one bill for all of them to head office.
      - id: c
        text: AWS Cost Explorer
        why: Cost Explorer charts past spend; it does not merge the separate bills into one.
      - id: d
        text: Cost allocation tags
        why: Tags group costs inside a bill by label, but they do not join bills from separate accounts.
    evidence:
      - With consolidated billing, subaccounts (by team, project, department or any split) link to a primary account that alone receives the bill and sees all spend.
    takeaway: Consolidated billing links many accounts to one primary account that pays a single bill.
    history: []
    verified:
      keyHash: 5116efa13d20
      fullHash: 8497a25e7eb9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-q4crdt
    version: 1
    status: draft
    type: single
    pool: practice
    concept: consolidated-billing
    note: m11/aws-pricing-and-billing-services
    task: "4.1"
    level: 1
    stem: >-
      The cafe's catering team and loyalty-app team each run their own AWS account.
      The owner wants a single bill that also shows each team's spend.
      What should the owner set up?
    options:
      - id: a
        text: Setting a budget alert for each account
        why: AWS Budgets warns near a limit, but each account would still get its own separate bill.
      - id: b
        text: Linking both accounts to one primary account
        correct: true
        why: With consolidated billing, the primary account alone receives the bill and sees every linked account's spend.
      - id: c
        text: Tagging each team's resources by project
        why: Tags help split costs within reports, but they do not merge two accounts into one bill.
      - id: d
        text: Estimating each account in Pricing Calculator
        why: The calculator prices designs before deployment and has no part in who receives the bill.
    evidence:
      - With consolidated billing, subaccounts (by team, project, department or any split) link to a primary account that alone receives the bill and sees all spend.
    takeaway: Linking accounts to one primary account gives one bill that still shows the spend of each linked account.
