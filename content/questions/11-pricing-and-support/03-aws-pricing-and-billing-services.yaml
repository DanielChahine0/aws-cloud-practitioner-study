  - id: q-g27561
    version: 1
    status: live
    type: single
    pool: practice
    concept: cost-allocation-tags
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 2
    stem: >-
      The cafe labeled its resources with a project tag for catering and another for the loyalty app.
      In Cost Explorer, the owner cannot group costs by that tag yet.
      What step is missing?
    options:
      - id: a
        text: Move each project into its own linked account
        why: Separate accounts would split costs by account, but the tag itself would still not appear in Cost Explorer.
      - id: b
        text: Activate the tag in the billing console
        correct: true
        why: A tag shows up in Cost Explorer only after it is activated as a cost allocation tag.
      - id: c
        text: Search for all resources carrying the tag
        why: A tag search finds related resources, but it does not make the tag usable for grouping costs.
      - id: d
        text: Filter a new budget by the project tag
        why: A budget can use tags for alerts, but it does not make an inactive tag appear in Cost Explorer.
    evidence:
      - AWS cost allocation tags come in two types, AWS-generated and user-defined, and you must activate each before it appears in Cost Explorer or on a cost allocation report.
    takeaway: A tag must be activated as a cost allocation tag before Cost Explorer can group costs by it.
    history: []
    verified:
      keyHash: 55ce831f402f
      fullHash: 6e8c70f799ff
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-419np7
    version: 1
    status: live
    type: single
    pool: practice
    concept: cost-allocation-tags
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 1
    stem: >-
      The cafe's owner added a tag named project to its resources to split costs between catering and the loyalty app.
      Which type of cost allocation tag is it?
    options:
      - id: a
        text: AWS-generated
        why: AWS-generated tags are added by AWS itself, while this tag was created and named by the owner.
      - id: b
        text: Service-linked
        why: Service-linked describes a kind of IAM role that a service uses, not a kind of cost allocation tag.
      - id: c
        text: User-defined
        correct: true
        why: A tag the customer creates and names is a user-defined cost allocation tag.
      - id: d
        text: Resource-based
        why: Resource-based describes policies attached to a resource such as a bucket, not a kind of tag.
    evidence:
      - AWS cost allocation tags come in two types, AWS-generated and user-defined, and you must activate each before it appears in Cost Explorer or on a cost allocation report.
    takeaway: A tag the customer creates is user-defined, while AWS-generated tags are the ones AWS adds itself.
    history: []
    verified:
      keyHash: 1c2db032c553
      fullHash: 6044b202d57e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
