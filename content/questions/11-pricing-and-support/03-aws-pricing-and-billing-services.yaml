    stem: >-
      The cafe runs separate AWS accounts for its bakery, its catering arm and its loyalty app.
      The owner wants to turn on consolidated billing so that only one account receives the bill.
      Which service sets this up?
    options:
      - id: a
        text: AWS Organizations
        correct: true
        why: Organizations links the accounts under a primary account, which alone receives the combined bill.
      - id: b
        text: AWS Billing and Cost Management
        why: The billing dashboard links to consolidated billing features, but it does not group the accounts itself.
      - id: c
        text: AWS Cost Explorer
        why: Cost Explorer charts spend by linked account once billing is combined, but it does not combine it.
