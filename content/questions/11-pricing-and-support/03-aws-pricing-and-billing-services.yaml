      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 3 is consolidated billing, the only option that combines accounts; the others act per account.)"
  - id: q-x003qz
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-billing-and-cost-management-dashboard
    note: m11/aws-pricing-and-billing-services
    task: "4.2"
    level: 2
    stem: >-
      The cafe's company card expired, and the owner also needs to download last month's AWS invoice for the bookkeeper.
      Where should the owner go to handle both tasks?
    options:
      - id: a
        text: AWS Cost and Usage Report
        why: The report drops detailed cost files into an S3 bucket; it cannot change the card that pays.
      - id: b
        text: AWS Health Dashboard
        why: This dashboard reports events affecting the account's resources, not invoices or payment cards.
      - id: c
        text: AWS Pricing Calculator
        why: The calculator estimates planned designs and has no access to past invoices or payment cards.
      - id: d
        text: AWS Billing and Cost Management
        correct: true
        why: The billing dashboard holds invoices and payment methods, so both tasks happen there.
    evidence:
      - The dashboard is the first stop for charges and payments.
      - Monthly forecast, top services by cost, charges, usage, reports, invoices, payment methods
    takeaway: Invoices, payment methods and a first look at charges live in the Billing and Cost Management dashboard.
