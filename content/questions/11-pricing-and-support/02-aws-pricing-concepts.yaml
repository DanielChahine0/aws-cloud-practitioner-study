  - id: q-t67nm6
    version: 1
    status: live
    type: match
    pool: practice
    concept: cost-drivers
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 1
    stem: >-
      Match each main AWS cost driver to the way it is usually measured on the bill.
    pairs:
      - left: Compute
        right: Processing power over time, per hour or second
        why: Compute bills for the time an instance runs, from launch until it is stopped.
      - left: Storage
        right: Gigabytes provisioned or used, and for how long
        why: Storage bills for the amount of data kept or capacity provisioned over a period, typically per gigabyte.
      - left: Data transfer
        right: Outbound gigabytes pooled across services, at falling rates
        why: Only data sent out of AWS is billed, pooled across services per gigabyte, with the rate dropping as volume grows.
    evidence:
      - "Compute (EC2, Lambda, ECS): processing power over time, per hour or second, from launch until you stop the instance, unless a reservation fixed the price."
      - "Storage (S3, EBS): the amount provisioned or used and for how long, typically per gigabyte, across options for keeping, reaching, securing and analyzing data."
      - "Data transfer: inbound and most same-Region traffic is free, with exceptions, while outbound data is pooled across services and billed per gigabyte at falling rates."
    takeaway: Compute bills by running time, storage by gigabytes kept over time, and data transfer by pooled gigabytes sent out.
    history: []
    verified:
      keyHash: 2e8944d46524
      fullHash: 14bc1b80e0c1
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-j7qwcp
    version: 1
    status: live
    type: multi
    select: 3
    pool: practice
    concept: cost-drivers
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 2
    stem: >-
      The cafe's AWS bill rose this month, and the owner lists five things that changed.
      Each change added cost, but which changes raised the bill through the three main cost drivers?
    options:
      - id: a
        text: The ordering app moved to a larger instance type
        correct: true
        why: Compute is a main driver, and a larger instance buys more processing power for each hour it runs.
      - id: b
        text: Twice as many order photos were kept in S3
        correct: true
        why: Storage is a main driver, billed for the amount of data kept and how long it is kept.
      - id: c
        text: Customers downloaded more menu files from AWS
        correct: true
        why: Downloads leave AWS as outbound data transfer, a main driver billed per gigabyte.
      - id: d
        text: The cafe subscribed to AWS Shield Advanced
        why: Shield Advanced adds a paid protection fee, which is a service subscription rather than compute, storage or outbound transfer.
      - id: e
        text: The cafe bought a paid product in AWS Marketplace
        why: A Marketplace purchase adds a third-party software charge, not a compute, storage or outbound transfer cost.
    evidence:
      - The three main drivers are compute, storage and outbound data transfer.
      - Inbound transfer is usually free, and outbound is billed per gigabyte.
    takeaway: A rising AWS bill traces back to the three main drivers - compute, storage and outbound data transfer.
    history: []
    verified:
      keyHash: 3a86a676c453
      fullHash: 6f679edac507
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7x2h7v
    version: 1
    status: live
    type: single
    pool: practice
    concept: outbound-data-transfer
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 2
    stem: >-
      Which of the cafe's weekly data movements is billed as outgoing transfer even though the data never goes out to the internet?
    options:
      - id: a
        text: Price lists uploaded from the internet into S3
        why: Data arriving in AWS from the internet carries no transfer charge at all.
      - id: b
        text: Sales records copied to S3 in another Region
        correct: true
        why: Data leaving for another Region is billed as outgoing transfer, even though it stays inside AWS.
      - id: c
        text: Orders sent from customers' phones into AWS
        why: Orders arriving in AWS from the internet are incoming transfer, which costs nothing.
      - id: d
        text: Sales reports sent from AWS to the accountant
        why: This transfer is billed, but the report goes out to the internet, which the stem rules out.
    evidence:
      - "Incoming data transfer costs are nothing for data coming from the internet into AWS, while outgoing data transfer costs apply to data leaving for the internet or for another Region."
    takeaway: Outgoing transfer charges cover data sent to another Region as well as data sent to the internet.
    history: []
    verified:
      keyHash: f96ec424083a
      fullHash: d0fb10d7d732
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
