  - id: q-tcayh8
    version: 1
    status: live
    type: single
    pool: practice
    concept: s3-pricing
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 2
    stem: >-
      The cafe has Amazon S3 automatically keep a copy of each new receipt in a second Region as a backup.
      Which S3 cost component covers making those copies?
    options:
      - id: a
        text: Requests and retrieval
        why: This component covers reading and fetching objects, not keeping automatic copies elsewhere.
      - id: b
        text: Replication between buckets
        correct: true
        why: Automatically copying each new object to another location is replication, its own S3 cost component.
      - id: c
        text: Management and analytics
        why: This component covers features that inspect and organize stored data, not copying it elsewhere.
      - id: d
        text: S3 Object Lambda processing
        why: Object Lambda charges for processing data as it is read, which the backup copies do not use.
    evidence:
      - "S3 has six cost components: storage, requests and retrieval, transfer and acceleration, management and analytics, replication, and S3 Object Lambda processing."
    takeaway: Automatic copies of S3 objects kept in another location are billed under the S3 replication cost component.
    history: []
    verified:
      keyHash: 59fa79fb78df
      fullHash: 95d328a6ebce
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
