questions:
  - id: q-k7v3m3
    version: 1
    status: live
    type: single
    pool: practice
    concept: save-when-you-commit
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 2
    stem: >-
      The cafe's order database server runs at the same load around the clock, and the owner expects that to continue long into the future.
      Which pricing approach gives this workload the biggest discount?
    options:
      - id: a
        text: Paying as you go with nothing paid upfront
        why: Paying as you go suits uncertain loads, but it gives up the discount a steady, long-lived server could earn.
      - id: b
        text: Agreeing to a set level of usage over a term
        correct: true
        why: A steady load that will last well into the future is exactly what a usage commitment rewards with a large discount.
      - id: c
        text: Moving into cheaper tiers as total volume grows
        why: Volume tiers reward growth in usage, while this one server runs at a flat load that does not climb.
      - id: d
        text: Billing by the second only while the server runs
        why: Billing only while running helps a server that often stops, but this one runs around the clock and never pauses.
    evidence:
      - "Save when you commit: a usage commitment, usually 1 or 3 years, earns big discounts on steady workloads."
    takeaway: A steady, long-lived workload earns its biggest discount from a usage commitment, usually 1 or 3 years.
    history: []
    verified:
      keyHash: e7ea91228d4c
      fullHash: 3747ede5b2b7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-mxay78
    version: 1
    status: live
    type: single
    pool: practice
    concept: save-when-you-commit
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 1
    stem: >-
      Which customer action earns a lower price under the save-when-you-commit principle?
    options:
      - id: a
        text: Agreeing to a usage level for a fixed term
        correct: true
        why: This principle rewards a customer who agrees to a level of usage over a term, usually 1 or 3 years.
      - id: b
        text: Growing total usage into a cheaper pricing tier
        why: A cheaper tier from growing volume belongs to the pay-less-by-using-more principle, not to a time agreement.
      - id: c
        text: Choosing a Region where the service costs less
        why: Prices do vary by Region, but picking a cheaper Region is not the agreement this principle rewards.
      - id: d
        text: Stopping instances in hours they are not needed
        why: Stopping idle instances cuts pay-as-you-go charges, but it involves no agreement over a term.
    evidence:
      - "Save when you commit: a usage commitment, usually 1 or 3 years, earns big discounts on steady workloads."
      - Committing and using more sound alike, but one rewards a time commitment, the other sheer volume.
    takeaway: Save when you commit trades a usage commitment over a term, usually 1 or 3 years, for a lower price.
    history: []
    verified:
      keyHash: e41233c3cff2
      fullHash: 60cbb82a30ad
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-6ew4wn
    version: 1
    status: live
    type: single
    pool: practice
    concept: pay-less-by-using-more
    note: m11/aws-pricing-concepts
    task: "1.4"
    level: 3
    stem: >-
      The cafe signs no contract, but as it opens new shops its stored photos and menus grow fast.
      It notices the price per gigabyte dropping as the total climbs.
      Which pricing principle explains the drop?
    options:
      - id: a
        text: Save when you commit
        why: This principle needs a usage commitment over a term, and the cafe signed none.
      - id: b
        text: Pay less by using more
        correct: true
        why: Growing volume moves the cafe into cheaper tiers, so the unit price falls with no commitment needed.
      - id: c
        text: Pay as you go
        why: Paying as you go explains paying only for what is used, not why the unit price falls as usage grows.
      - id: d
        text: Free inbound transfer
        why: Free inbound data covers uploads into AWS, not a falling price per gigabyte for stored data.
    evidence:
      - "Pay less by using more: economies of scale lower the unit price as usage grows, and some services use tiered pricing."
      - Committing and using more sound alike, but one rewards a time commitment, the other sheer volume.
    takeaway: A unit price that falls as volume grows, with no term signed, is pay less by using more, not a commitment discount.
    history: []
    verified:
      keyHash: 3bc7a499473c
      fullHash: "209178567943"
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-kr6re1
    version: 1
    status: live
    type: single
    pool: practice
    concept: pay-less-by-using-more
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 1
    stem: >-
      Which situation is an example of the pay-less-by-using-more principle?
    options:
      - id: a
        text: A Savings Plan prices steady compute below On-Demand
        why: A Savings Plan lowers the price in return for a term of committed use, so it shows save when you commit.
      - id: b
        text: An instance stops billing once it has been stopped
        why: Paying only while a resource runs is pay as you go, not a lower unit price from higher volume.
      - id: c
        text: Stored data reaches a tier with a cheaper unit price
        correct: true
        why: Tiered pricing lowers the price per unit as usage grows, which is exactly paying less by using more.
      - id: d
        text: Data arriving from the internet carries no transfer fee
        why: Free inbound transfer applies at any volume, so it does not depend on using more.
    evidence:
      - "Pay less by using more: economies of scale lower the unit price as usage grows, and some services use tiered pricing."
    takeaway: With tiered pricing, each unit gets cheaper as total usage grows, thanks to AWS economies of scale.
    history: []
