    concept: save-when-you-commit
    note: m11/aws-pricing-concepts
    task: "4.1"
    level: 2
    stem: >-
      Each of the cafe's workloads runs at a flat load today.
      The loyalty app is being rebuilt next month, the menu site moves to a new host in spring, and the kitchen display goes when the old ovens are replaced.
      The till system will keep running as it is for years.
      On which workload does a usage commitment pay off?
    options:
      - id: a
        text: The loyalty app
        why: The loyalty app is rebuilt next month, so a commitment term would outlast the workload it covers.
      - id: b
        text: The menu site
        why: The menu site leaves in spring, well before a commitment term ends, leaving the cafe paying for unused commitment.
      - id: c
        text: The till system
        correct: true
        why: The till system stays steady for years, which is the long, flat use a usage commitment rewards with a big discount.
      - id: d
        text: The kitchen display
        why: The kitchen display ends with the old ovens, so committing to it for a term risks paying for use that stops.
    evidence:
      - "Save when you commit: a usage commitment, usually 1 or 3 years, earns big discounts on steady workloads."
    takeaway: A usage commitment pays off on a workload that stays steady for the whole term, not one due to end or change soon.
