        why: Requests are a separate S3 cost component, while outbound data is billed on its volume in gigabytes.
      - id: b
        text: Per hour or per second of processing time
        why: Billing by running time fits compute, not the amount of data sent out of AWS.
      - id: c
        text: Per gigabyte provisioned, for as long as it is kept
        why: Billing for capacity kept over time fits storage, not data that is sent out.
      - id: d
        text: Per gigabyte, pooled across all services
        correct: true
        why: Outbound data from all services is pooled and billed per gigabyte, with the rate dropping as volume grows.
    evidence:
      - "Data transfer: inbound and most same-Region traffic is free, with exceptions, while outbound data is pooled across services and billed per gigabyte at falling rates."
    takeaway: Outbound data is pooled across services and billed per gigabyte, with lower rates at higher volume.
