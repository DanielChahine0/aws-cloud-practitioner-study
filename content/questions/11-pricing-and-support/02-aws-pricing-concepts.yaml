    stem: >-
      The cafe sends a nightly sales extract out of AWS to an analytics firm.
      Besides the number of gigabytes, what else sets the price of that transfer?
    options:
      - id: a
        text: The instance type that runs the export
        why: The instance type shapes compute cost, not the price of the gigabytes that leave AWS.
      - id: b
        text: The storage class that holds the extract
        why: The storage class shapes storage and retrieval cost, not the transfer price of the nightly extract.
      - id: c
        text: The hour of the night the export runs
        why: Outbound data is priced by volume and destination, and the hour the extract leaves plays no part.
      - id: d
        text: Where the extract is delivered to
        correct: true
        why: Outbound transfer is priced by volume and by where it goes, such as another Region or the internet.
    evidence:
      - "Data transfer: sending data out for analytics is outbound, priced by volume and by the destination Region or internet source."
    takeaway: Outbound transfer is priced by how much data leaves and by where it goes, such as another Region or the internet.
