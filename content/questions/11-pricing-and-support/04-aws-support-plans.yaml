      The cafe's manager is comparing AWS Business Support+ with the other Support plans on a price sheet.
      Which statements describe Business Support+?
    options:
      - id: a
        text: It includes a designated technical account manager.
        why: A designated technical account manager comes with Enterprise Support, a plan above Business Support+.
      - id: b
        text: It answers a down critical system in under 30 minutes.
        correct: true
        why: Business Support+ promises a response in under 30 minutes when a business-critical system is down.
      - id: c
        text: It includes round-the-clock monitoring of workloads.
        why: Round-the-clock workload monitoring belongs to Unified Operations alone, not to Business Support+.
      - id: d
        text: It is the free plan that every AWS customer gets.
        why: The free plan every customer gets is Basic Support, while Business Support+ is a paid plan above it.
      - id: e
        text: It is the lowest plan AWS advises for production.
        correct: true
        why: AWS calls Business Support+ the minimum plan it recommends for running production workloads.
    evidence:
      - AWS calls Business Support+ the minimum plan it recommends for production workloads.
      - With Business Support+, a business-critical or mission-critical system that is down gets a response in under 30 minutes.
    takeaway: Business Support+ is the production minimum AWS recommends, with an under 30 minute response to a critical outage.
