questions:
  - id: q-4q1fzt
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-support-plans
    note: m11/aws-support-plans
    task: "4.3"
    level: 2
    stem: >-
      The cafe has used the free Basic Support plan for a year and now moves up to a paid Support plan.
      Which fact explains why the cafe still has re:Post and the health alerts it used on Basic Support?
    options:
      - id: a
        text: AWS recommends Business Support+ for production
        why: True, but where AWS sets its production floor does not explain why Basic features carry over.
      - id: b
        text: Each plan includes everything in the plan below it
        correct: true
        why: Plans are cumulative, so the paid plan keeps the Basic help and adds tools, personal help and speed.
      - id: c
        text: Technical cases need a plan above Basic Support
        why: True, but this explains what the cafe gains by moving up, not why it keeps its Basic features.
      - id: d
        text: Unified Operations alone has 24/7 workload monitoring
        why: True, but a feature unique to the top plan says nothing about keeping the Basic features.
    evidence:
      - Support exists for every customer, and each plan includes the one below plus more tools, personal help and speed.
    takeaway: AWS Support plans are cumulative, so a higher plan keeps everything below it and adds more.
    history: []
    verified:
      keyHash: 17b150da30d1
      fullHash: d5e0af858bf3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bp85g6
    version: 1
    status: live
    type: match
    pool: practice
    concept: aws-support-plans
    note: m11/aws-support-plans
    task: "4.3"
    level: 1
    stem: >-
      Match each AWS Support plan named in the exam guide to the feature that sets it apart.
    pairs:
      - left: Basic Support
        right: Free for every customer, with re:Post and health alerts
        why: Basic costs nothing and still gives forums, re:Post and the Personal Health Dashboard.
      - left: AWS Business Support+
        right: The minimum plan AWS recommends for production
        why: AWS names Business Support+ as its recommended floor for production workloads.
      - left: AWS Enterprise Support
        right: Includes a designated technical account manager
        why: Enterprise Support is the plan the exam guide ties to a designated TAM.
      - left: AWS Unified Operations
        right: The only plan with 24/7 workload monitoring
        why: Unified Operations alone adds round-the-clock monitoring of the customer's workloads.
    evidence:
      - AWS calls Business Support+ the minimum plan it recommends for production workloads.
      - Enterprise Support includes a designated technical account manager.
      - Unified Operations is the only plan that includes 24/7 workload monitoring.
    takeaway: Basic is free, Business Support+ is the production floor, Enterprise adds a TAM and Unified Operations adds 24/7 monitoring.
    history: []
    verified:
      keyHash: 2dbec49efe09
      fullHash: fcb94cf0d06a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-mm3keg
    version: 1
    status: live
    type: single
    pool: practice
    concept: technical-account-manager
    note: m11/aws-support-plans
    task: "4.3"
    level: 1
    stem: >-
      Which AWS role serves as a customer's main AWS contact, watching its environment and advising on services, architecture, cost and AWS programs?
    options:
      - id: a
        text: AWS solutions architect
        why: A solutions architect helps design apps but is not described as the customer's main ongoing contact.
      - id: b
        text: Incident Management Engineer
        why: This engineer responds to outages on Unified Operations rather than acting as the main advisory contact.
      - id: c
        text: Technical account manager
        correct: true
        why: A TAM is the main AWS contact who monitors the environment and advises on services, cost and programs.
      - id: d
        text: AWS Professional Services consultant
        why: Professional Services runs scoped consulting projects, not an ongoing main-contact role.
    evidence:
      - A TAM, your main AWS contact, monitors your environment and advises on services, architecture, cost and AWS programs, such as combining services in one app.
    takeaway: A technical account manager is the customer's main AWS contact who monitors and advises on an ongoing basis.
    history: []
