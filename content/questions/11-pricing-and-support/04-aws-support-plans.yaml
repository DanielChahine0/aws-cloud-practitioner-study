        text: Delivery of a paid, scoped migration project
        why: Project-based migration work is what AWS Professional Services delivers, not the TAM.
      - id: e
        text: Answers to posts on a public community site
        why: Community answers come from AWS re:Post, not from the chain's own TAM.
