      Late at night, a cafe developer wants to learn how to call Amazon S3 from the ordering app's code, working alone without contacting AWS.
      Which self-support resource fits best?
    options:
      - id: a
        text: AWS whitepapers
        why: Whitepapers are technical documents on broad topics and architectures, not a guide to calling a service from code.
      - id: b
        text: AWS SDK guides
        correct: true
        why: SDK guides show how to use AWS services from application code, and the developer can follow them alone.
      - id: c
        text: AWS Knowledge Center
        why: The Knowledge Center answers frequent questions in short articles and videos, not a full guide to coding against a service.
      - id: d
        text: AWS Prescriptive Guidance
        why: Prescriptive Guidance gives patterns for migration, optimization and modernization work, not a coding guide for one service.
    evidence:
      - "Self-support: user guides, SDK guides, blog posts and whitepapers."
    takeaway: To use an AWS service from application code on your own, the SDK guides are the self-support resource to open.
