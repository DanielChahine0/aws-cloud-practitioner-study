  - id: q-bjnab5
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-business-support-plus
    note: m11/aws-support-plans
    task: "4.3"
    level: 2
    stem: >-
      The cafe is on AWS Business Support+, and its business-critical online ordering system goes down.
      How soon does its plan promise a response?
    options:
      - id: a
        text: In under 30 minutes
        correct: true
        why: Business Support+ promises a response in under 30 minutes for a down business-critical system.
      - id: b
        text: In under 15 minutes
        why: An under 15 minute response for a down critical system comes with Enterprise Support, not Business Support+.
      - id: c
        text: In under 5 minutes
        why: An under 5 minute response from an Incident Management Engineer comes only with Unified Operations.
      - id: d
        text: With no promised time
        why: Only the free Basic plan gives no incident response, and the cafe pays for Business Support+.
    evidence:
      - With Business Support+, a business-critical or mission-critical system that is down gets a response in under 30 minutes.
      - With Enterprise Support, a business-critical or mission-critical system that is down gets a response in under 15 minutes.
      - With Unified Operations, an Incident Management Engineer responds in under 5 minutes when a business-critical or mission-critical system is down.
    takeaway: On Business Support+, a down business-critical system gets a response in under 30 minutes.
    history: []
    verified:
      keyHash: 331076839f09
      fullHash: 547f06b000e1
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
