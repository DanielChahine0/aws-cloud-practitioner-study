  - id: q-mtt3wd
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudtrail-insights
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      One night the cafe's account suddenly makes far more delete calls than it ever does.
      Which CloudTrail feature would flag this jump?
    options:
      - id: a
        text: CloudTrail Insights
        correct: true
        why: Insights learns the usual API volume and error rates and flags a sharp swing like this one.
      - id: b
        text: CloudTrail event history
        why: Event history lists the calls, but it does not compare them to a normal level or flag a spike.
      - id: c
        text: Log file integrity validation
        why: Integrity validation checks whether log files were tampered with, not whether call volume is unusual.
      - id: d
        text: CloudTrail logs in Amazon S3
        why: Log files in S3 store each delete call, but they do not compare volume to a normal level or flag a spike.
    evidence:
      - Studies management events for normal API volume and error rates, and flags deviations once enabled on a trail or event data store
    takeaway: A sudden swing in API call volume or errors is what CloudTrail Insights is built to flag.
    history: []
    verified:
