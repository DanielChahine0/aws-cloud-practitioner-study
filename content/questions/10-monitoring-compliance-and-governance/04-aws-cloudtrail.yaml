        text: The console checks each sign-in through IAM
        why: Checking who signs in controls access, but it does not explain why the change itself can be recorded.
      - id: b
        text: The console sends each click as an API call
        correct: true
        why: Every action on AWS, a console click included, is an API call, and API calls are what can be logged centrally.
