  - id: q-5dadmr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cloudtrail
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 3
    stem: >-
      A security group rule on the cafe's loyalty database vanished overnight.
      The manager wants to know which user removed it, at what time and from which IP address.
      Which service answers this?
    options:
      - id: a
        text: AWS CloudTrail
        correct: true
        why: CloudTrail records each API call with the caller, the time, the source IP and the result.
      - id: b
        text: AWS Config
        why: AWS Config tracks resource settings and checks them against rules, not the caller and source IP of each request.
      - id: c
        text: AWS Control Tower
        why: Control Tower sets up and governs a multi-account environment, so it does not answer who made one call.
      - id: d
        text: Amazon CloudWatch
        why: CloudWatch watches metrics and application logs, not the identity behind each API request.
    evidence:
      - "Who called, when, from which IP, and the result: a new state or a denial."
    takeaway: To learn who made a change, when and from where, look to CloudTrail's record of API calls.
