  - id: q-75t2c9
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudtrail-logs
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 3
    stem: >-
      The cafe already sends its ordering app's own error messages to CloudWatch Logs.
      Its auditor now wants stored files recording every API call in the account, kept longer than 90 days.
      What should the cafe set up?
    options:
      - id: a
        text: A trail that writes CloudTrail logs
        correct: true
        why: A trail delivers files of API events with no 90-day cap, which is the record the auditor asks for.
      - id: b
        text: A new log group in CloudWatch Logs
        why: Another log group would still hold app output, since CloudWatch Logs watches app internals, not API calls.
      - id: c
        text: A CloudWatch alarm on the app errors
        why: An alarm reacts to app errors and stores nothing about who called which API.
      - id: d
        text: A search of CloudTrail event history
        why: Event history stops at 90 days, so it cannot meet the longer retention the auditor wants.
    evidence:
      - CloudWatch Logs watches app internals, while CloudTrail records API activity.
      - The files holding events, sent to S3 or CloudWatch Logs, no 90-day cap, usable as PCI or HIPAA proof
    takeaway: App output belongs in CloudWatch Logs, while a lasting record of API calls comes from CloudTrail logs.
