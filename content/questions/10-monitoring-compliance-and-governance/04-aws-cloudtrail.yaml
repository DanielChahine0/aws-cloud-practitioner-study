questions:
  - id: q-v9q3c2
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-auditing
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      What about the way AWS works lets one service log all of an account's activity in a single place?
    options:
      - id: a
        text: Each action is sent as an API request
        correct: true
        why: Because each action is an API request, one service can log all of them in a single place.
      - id: b
        text: IAM grants each user only needed rights
        why: Least privilege limits who can change things, but it is not what lets all activity be logged in one place.
      - id: c
        text: Accounts can be grouped into one organization
        why: Grouping accounts helps manage them together, yet it is not what makes each action something a service can log.
      - id: d
        text: Resources can carry tags naming their owner
        why: Tags label resources for tracking and cost, but they do not turn activity into a record kept in one place.
    evidence:
      - On AWS every action is an API call, so all can be logged centrally.
    takeaway: On AWS every action is an API call, which is what lets all activity be logged in one place.
    history: []
    verified:
      keyHash: 936816d10c81
      fullHash: 0080d3ddbb4d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-31vngx
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-auditing
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      In the cafe's old back-office server room, a staffer once changed a setting by mistake and nobody could ever trace it.
      After the move to AWS, what makes a slip like that traceable?
    options:
      - id: a
        text: Each action on AWS goes through an API call
        correct: true
        why: Even an accidental change is an API request on AWS, so it lands in the central activity record.
      - id: b
        text: AWS takes care of the physical server hardware
        why: AWS does run the hardware, but that shift in duties does not record who changed a setting.
      - id: c
        text: IAM can limit each staffer to only needed rights
        why: Tighter permissions can make slips less likely, but they leave no trace of a slip that still happens.
      - id: d
        text: Staff sign in with multi-factor authentication
        why: A second sign-in factor proves who logged in, yet on its own it does not record the setting they altered.
    evidence:
      - On premises, changes can slip by unrecorded, even accidental ones.
      - On AWS every action is an API call, so all can be logged centrally.
    takeaway: Changes that slip by unrecorded on premises become traceable on AWS because each one is a loggable API call.
    history: []
    verified:
      keyHash: 67c4865fc8d1
      fullHash: ed6cd4e0829a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-5dadmr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cloudtrail
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 3
    stem: >-
      A security group rule on the cafe's loyalty database vanished overnight.
      The manager wants to know which user removed it, at what time and from which IP address.
      Which service answers this?
    options:
      - id: a
        text: AWS CloudTrail
        correct: true
        why: CloudTrail records each API call with the caller, the time, the source IP and the result.
      - id: b
        text: AWS Config
        why: AWS Config tracks resource settings and checks them against rules, not the caller and source IP of each request.
      - id: c
        text: AWS Control Tower
        why: Control Tower sets up and governs a multi-account environment, so it does not answer who made one call.
      - id: d
        text: Amazon CloudWatch
        why: CloudWatch watches metrics and application logs, not the identity behind each API request.
    evidence:
      - "Who called, when, from which IP, and the result: a new state or a denial."
    takeaway: To learn who made a change, when and from where, look to CloudTrail's record of API calls.
    history: []
    verified:
      keyHash: c20113ab94d5
      fullHash: 7fe5fdf12106
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1f4v6b
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-cloudtrail
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      The cafe's manager opens one AWS CloudTrail event about a deleted security group rule.
      Which statements describe details stored inside that event?
    options:
      - id: a
        text: It names the identity that made the call
        correct: true
        why: Each event records who called, which is how the manager traces the deletion to a person or role.
      - id: b
        text: It notes the IP address the call came from
        correct: true
        why: Each event records the source IP, which shows where the deletion request was sent from.
      - id: c
        text: It stays in event history free for 90 days
        why: That is how long event history keeps the event, not a detail written inside the event itself.
      - id: d
        text: It can be copied to Amazon S3 by a trail
        why: A trail can deliver events to S3, but where the event can go is not a detail it stores.
      - id: e
        text: It can feed Insights once a trail enables it
        why: Insights studies management events once enabled, which is a use of the event rather than its content.
    evidence:
      - "Who called, when, from which IP, and the result: a new state or a denial."
      - Single actions (API or console calls); event history shows 90 days of management events per Region, free, searchable, downloadable, unchangeable
    takeaway: A CloudTrail record names who called, when, from which IP and with what result.
