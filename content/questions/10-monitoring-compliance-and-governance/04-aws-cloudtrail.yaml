  - id: q-31vngx
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-auditing
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      In the cafe's old back-office server room, a staffer once changed a setting by mistake and nobody could ever trace it.
      After the move to AWS, what makes a slip like that traceable?
    options:
      - id: a
        text: Each action on AWS goes through an API call
        correct: true
        why: Even an accidental change is an API request on AWS, so it lands in the central activity record.
      - id: b
        text: AWS takes care of the physical server hardware
        why: AWS does run the hardware, but that shift in duties does not record who changed a setting.
      - id: c
        text: IAM can limit each staffer to only needed rights
        why: Tighter permissions can make slips less likely, but they leave no trace of a slip that still happens.
      - id: d
        text: Staff sign in with multi-factor authentication
        why: A second sign-in factor proves who logged in, yet on its own it does not record the setting they altered.
    evidence:
      - On premises, changes can slip by unrecorded, even accidental ones.
      - On AWS every action is an API call, so all can be logged centrally.
    takeaway: Changes that slip by unrecorded on premises become traceable on AWS because each one is a loggable API call.
