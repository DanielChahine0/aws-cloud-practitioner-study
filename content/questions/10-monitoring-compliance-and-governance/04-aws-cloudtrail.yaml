  - id: q-dkpd60
    version: 1
    status: live
    type: single
    pool: practice
    concept: log-file-integrity-validation
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      An auditor asks the cafe to prove that nobody altered its CloudTrail log files after they were delivered.
      What should the cafe do?
    options:
      - id: a
        text: Enable CloudTrail Insights to watch the trail's activity
        why: Insights flags unusual API volume or error rates, which says nothing about edits to a log file.
      - id: b
        text: Turn on log file integrity validation for the trail
        correct: true
        why: Integrity validation shows whether a delivered log file was changed, which is the proof the auditor wants.
      - id: c
        text: Send the trail's log files to CloudWatch Logs as well
        why: A second copy in CloudWatch Logs adds a place to read events, but it does not prove a file is unchanged.
      - id: d
        text: Deliver the trail's log files to a separate account
        why: A separate log account blocks root-level edits, but it does not prove after the fact that no file changed.
    evidence:
      - Integrity validation exposes tampering, and a separate log account blocks root-level edits.
    takeaway: To prove CloudTrail log files were not altered after delivery, turn on log file integrity validation.
    history: []
    verified:
      keyHash: a3e555e11770
      fullHash: 5fea97cfee65
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-xbe8wj
    version: 1
    status: live
    type: single
    pool: practice
    concept: log-file-integrity-validation
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      What does CloudTrail log file integrity validation do?
    options:
      - id: a
        text: It reveals whether a log file was changed after delivery
        correct: true
        why: Validation detects tampering after delivery, so an edited or deleted log file shows up as altered.
      - id: b
        text: It flags API call volume that strays from the usual level
        why: Spotting unusual API volume is the job of CloudTrail Insights, not of integrity validation.
      - id: c
        text: It keeps 90 days of management events free to search
        why: A free 90-day searchable view is event history, which does not check log files for tampering.
      - id: d
        text: It sends log files to Amazon S3 with no 90-day cap
        why: Delivering log files to S3 is what a trail does, while validation only checks whether a file changed.
    evidence:
      - Integrity validation exposes tampering, and a separate log account blocks root-level edits.
      - "**Log file integrity validation**: reveals tampered logs."
    takeaway: Integrity validation detects tampering with delivered log files, unlike Insights, event history or delivery to S3.
    history: []
    verified:
      keyHash: bfdc01b9ab61
      fullHash: 2787f0f15d31
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
