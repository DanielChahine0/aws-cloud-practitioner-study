  - id: q-gahgvh
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudtrail-insights
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      What baseline does CloudTrail Insights measure activity against before it raises a flag?
    options:
      - id: a
        text: Typical call volume and error rates
        correct: true
        why: Insights builds a baseline of normal call volume and error rates from management events and flags deviations.
      - id: b
        text: CPU and memory metrics from each instance
        why: Instance metrics are what CloudWatch tracks, and Insights looks at API activity instead.
      - id: c
        text: Resource settings against compliance rules
        why: Checking settings against rules is the work of AWS Config, not of CloudTrail Insights.
      - id: d
        text: Each log file against its original digest
        why: Checking a log file against its original is integrity validation, which finds tampering, not unusual activity.
    evidence:
      - Studies management events for normal API volume and error rates, and flags deviations once enabled on a trail or event data store
      - "**CloudTrail Insights**: spots abnormal API activity."
    takeaway: CloudTrail Insights compares API activity to its normal volume and error rates and flags what strays.
