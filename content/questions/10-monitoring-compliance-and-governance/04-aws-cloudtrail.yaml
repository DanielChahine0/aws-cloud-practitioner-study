    concept: log-file-integrity-validation
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      What does CloudTrail log file integrity validation do?
    options:
      - id: a
        text: It reveals whether a log file was changed after delivery
        correct: true
        why: Validation detects tampering after delivery, so an edited or deleted log file shows up as altered.
      - id: b
        text: It flags API call volume that strays from the usual level
        why: Spotting unusual API volume is the job of CloudTrail Insights, not of integrity validation.
      - id: c
        text: It keeps 90 days of management events free to search
        why: A free 90-day searchable view is event history, which does not check log files for tampering.
      - id: d
        text: It sends log files to Amazon S3 with no 90-day cap
        why: Delivering log files to S3 is what a trail does, while validation only checks whether a file changed.
    evidence:
      - Integrity validation exposes tampering, and a separate log account blocks root-level edits.
      - "**Log file integrity validation**: reveals tampered logs."
    takeaway: Integrity validation detects tampering with delivered log files, unlike Insights, event history or delivery to S3.
