  - id: q-g3h4hw
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudtrail-logs
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 2
    stem: >-
      The cafe takes card payments, and its PCI auditors want a record of API activity that reaches back well past 90 days.
      What should the cafe keep for them?
    options:
      - id: a
        text: CloudTrail event history
        why: Event history only reaches back 90 days, which falls short of what the auditors ask for.
      - id: b
        text: CloudTrail logs in Amazon S3
        correct: true
        why: Log files in S3 have no 90-day cap and can serve as proof for PCI audits.
      - id: c
        text: CloudTrail Insights on the trail
        why: Insights flags unusual API patterns, but it is not the stored record of every call an auditor reviews.
      - id: d
        text: Amazon CloudWatch alarms
        why: Alarms react when a metric crosses a threshold, and they keep no lasting record of API calls.
    evidence:
      - The files holding events, sent to S3 or CloudWatch Logs, no 90-day cap, usable as PCI or HIPAA proof
      - Event history is free for 90 days, while S3 logs serve long audits.
    takeaway: For audits that look back beyond 90 days, keep CloudTrail log files in S3.
