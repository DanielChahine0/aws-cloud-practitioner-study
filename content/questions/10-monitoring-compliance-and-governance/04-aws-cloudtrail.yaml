    pool: practice
    concept: cloud-auditing
    note: m10/aws-cloudtrail
    task: "2.2"
    level: 1
    stem: >-
      What about the way AWS works lets one service log all of an account's activity in a single place?
    options:
      - id: a
        text: Each action is sent as an API request
        correct: true
        why: Because each action is an API request, one service can log all of them in a single place.
      - id: b
        text: IAM grants each user only needed rights
        why: Least privilege limits who can change things, but it is not what lets all activity be logged in one place.
      - id: c
        text: Accounts can be grouped into one organization
        why: Grouping accounts helps manage them together, yet it is not what makes each action something a service can log.
      - id: d
        text: Resources can carry tags naming their owner
        why: Tags label resources for tracking and cost, but they do not turn activity into a record kept in one place.
    evidence:
      - On AWS every action is an API call, so all can be logged centrally.
    takeaway: On AWS every action is an API call, which is what lets all activity be logged in one place.
