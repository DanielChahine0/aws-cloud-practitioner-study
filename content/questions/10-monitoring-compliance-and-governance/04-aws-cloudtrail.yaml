    task: "2.2"
    level: 3
    stem: >-
      Last week someone changed a security group in the cafe's account.
      The admin never created a trail, and she wants to look up that change today at no charge.
      Where should she look?
    options:
      - id: a
        text: CloudTrail event history
        correct: true
        why: Event history shows recent management events in each Region for free, with no trail to set up.
      - id: b
        text: CloudTrail logs in Amazon S3
        why: Log files only reach S3 once a trail delivers them, and the admin never created one.
      - id: c
        text: CloudTrail Insights
        why: Insights flags unusual API volume or error rates once enabled, rather than listing a single past change.
      - id: d
        text: CloudWatch Logs
        why: CloudWatch Logs holds what applications write about themselves, not the account's API calls.
    evidence:
      - Single actions (API or console calls); event history shows 90 days of management events per Region, free, searchable, downloadable, unchangeable
    takeaway: For a recent management event with no trail set up, the free event history is the place to search.
