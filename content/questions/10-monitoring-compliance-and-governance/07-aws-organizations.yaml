    concept: organizational-units
    note: m10/aws-organizations
    task: "2.2"
    level: 1
    stem: >-
      In AWS Organizations, what is an OU?
    options:
      - id: a
        text: The container at the very top
        why: That describes the root, which is made with the organization and holds every OU and account.
      - id: b
        text: A logical group of accounts
        correct: true
        why: An OU gathers accounts, and can hold nested OUs, so they can be managed together.
      - id: c
        text: The account that owns the whole setup
        why: That describes the management account, which creates and governs the organization.
      - id: d
        text: A cap on what accounts can do
        why: That describes an SCP, which is attached to an OU or a member account to limit permissions.
    evidence:
      - "**Organizational unit (OU)**: a logical group of accounts."
    takeaway: An OU is a logical group of accounts, distinct from the root, the management account and SCPs.
