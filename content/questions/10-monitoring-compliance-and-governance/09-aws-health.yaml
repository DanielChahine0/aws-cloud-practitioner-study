  - id: q-ftj5hf
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-health
    note: m10/aws-health
    task: "4.3"
    level: 1
    stem: >-
      Which job does AWS Health do?
    options:
      - id: a
        text: Lists an account's resources with their settings
        why: Keeping a record of resources and their settings is AWS Config's job; AWS Health is no resource catalog.
      - id: b
        text: Checks an account against best practices
        why: Best-practice checks across cost, security and more come from AWS Trusted Advisor, not AWS Health.
      - id: c
        text: Records the API calls made in an account
        why: AWS CloudTrail records who called which API; AWS Health does not track user actions.
      - id: d
        text: Reports AWS events affecting an account
        correct: true
        why: AWS Health is the main source of service events, planned changes and account notices touching your resources.
    evidence:
      - AWS Health is the main feed of events affecting your resources.
      - It is no resource catalog.
    takeaway: AWS Health reports AWS-side events, such as service issues and planned changes, that affect your resources.
