  - id: q-5qhfh9
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-health-api
    note: m10/aws-health
    task: "4.3"
    level: 2
    stem: >-
      The cafe's in-house operations tool must read AWS Health events through code, but the cafe pays AWS only for the services it uses and nothing more.
      What must the cafe do before the tool can use the AWS Health API?
    options:
      - id: a
        text: Turn on AWS CloudTrail in each Region
        why: CloudTrail logs API activity in the account, and turning it on does not unlock the AWS Health API.
      - id: b
        text: Start recording changes with AWS Config
        why: Config records resource settings over time, which has no bearing on access to the AWS Health API.
      - id: c
        text: Sign up for a premium AWS Support plan
        correct: true
        why: Programmatic access to AWS Health requires a premium Support plan, which the cafe does not pay for yet.
      - id: d
        text: Join the account to AWS Organizations
        why: Organizations groups accounts for central management but does not grant use of the AWS Health API.
    evidence:
      - Its API needs AWS Premium Support.
    takeaway: The AWS Health API is available only with a paid AWS Support plan, not with Basic Support.
    history: []
    verified:
      keyHash: cdac258eac06
      fullHash: 636d61899e50
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-p2n273
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-health-api
    note: m10/aws-health
    task: "4.3"
    level: 2
    stem: >-
      The cafe's developer is writing a script that checks every hour for AWS service issues and planned maintenance reaching the cafe's resources, then posts them to the team chat.
      Which should the script use?
    options:
      - id: a
        text: AWS Health API
        correct: true
        why: The AWS Health API gives code programmatic access to the same events, so a script can fetch them.
      - id: b
        text: AWS Trusted Advisor
        why: Trusted Advisor checks the account against best practices; it does not report AWS service issues or maintenance.
      - id: c
        text: AWS CloudTrail
        why: CloudTrail logs the API calls people make in the account, not AWS service issues or maintenance.
      - id: d
        text: Amazon CloudWatch
        why: CloudWatch tracks the cafe's own metrics and logs, not AWS-side service issues or planned maintenance.
    evidence:
      - "**AWS Health API**: programmatic access."
    takeaway: When code, not a person, needs AWS Health events, it uses the AWS Health API.
