questions:
  - id: q-jsjgpe
    version: 1
    status: live
    type: single
    pool: practice
    concept: regulatory-compliance
    note: m10/compliance
    task: "2.2"
    level: 1
    stem: >-
      In the cloud, what does it mean for a business to be compliant?
    options:
      - id: a
        text: Its apps meet the uptime targets it has promised.
        why: Meeting uptime targets is about availability, and it is not what being compliant means.
      - id: b
        text: Its resources and data meet the rules that bind it.
        correct: true
        why: Compliance is the bar of meeting each internal policy, standard and regulation that applies to the business.
      - id: c
        text: Its spending meets the budget its owners have set.
        why: Staying within a budget is cost control, which says nothing about meeting policies or regulations.
      - id: d
        text: Its setup meets the provider's best-practice advice.
        why: Best-practice advice covers cost, performance and security, and following it does not prove the rules are met.
    evidence:
      - "It is a security and data-protection bar: your resources and data must satisfy each internal policy, industry standard and regulation that binds you."
    takeaway: Compliance means your resources and data satisfy every policy, standard and regulation that applies to you.
    history: []
    verified:
      keyHash: 5419c192ca5e
      fullHash: e2c7654afc44
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7pa6cg
    version: 1
    status: live
    type: single
    pool: practice
    concept: regulatory-compliance
    note: m10/compliance
    task: "2.2"
    level: 2
    stem: >-
      An auditor will visit the cafe next month to confirm it meets the rules for card payments.
      What will the auditor check the cafe against?
    options:
      - id: a
        text: Reviews, ratings and complaints
        why: Customer feedback measures satisfaction and gives an auditor no proof that the payment rules are met.
      - id: b
        text: Costs, budgets and forecasts
        why: Spending figures are business plans, not proof that the cafe follows a regulation.
      - id: c
        text: Documents, records and inspections
        correct: true
        why: An audit checks compliance by reviewing documents and records and by inspecting the setup.
      - id: d
        text: Uptime, latency and error rates
        why: Performance figures show how well the apps run, not whether the cafe's data and systems meet the payment rules.
    evidence:
      - Audits check this against documents, records and inspections.
    takeaway: A compliance audit checks a business against its documents, records and inspections.
    history: []
    verified:
      keyHash: 0446e059b5bd
      fullHash: 2777d1fadb59
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pqa5sg
    version: 1
    status: live
    type: single
    pool: practice
    concept: hipaa
    note: m10/compliance
    task: "2.2"
    level: 1
    stem: >-
      Which statement describes HIPAA?
    options:
      - id: a
        text: An EU regulation that protects consumer data
        why: That describes GDPR, the rule set for EU consumer data, not HIPAA.
      - id: b
        text: A US law that applies to healthcare apps
        correct: true
        why: HIPAA is the US Health Insurance Portability and Accountability Act, which binds healthcare workloads.
      - id: c
        text: An AWS portal that stores audit reports
        why: That describes AWS Artifact, a service, while HIPAA is a law that a workload must follow.
      - id: d
        text: A security checklist that AWS publishes
        why: AWS publishes whitepapers such as an auditing checklist, but HIPAA is a US law, not an AWS document.
    evidence:
      - "**HIPAA**: US Health Insurance Portability and Accountability Act of 1996."
    takeaway: HIPAA is the US healthcare law, while GDPR covers EU consumer data.
    history: []
    verified:
      keyHash: a2bcfbeb88db
      fullHash: b31a11fc0e37
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
