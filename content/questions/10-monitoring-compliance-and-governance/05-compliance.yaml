        why: The manager set this rule for this cafe alone, so it is an internal policy, which compliance must satisfy as well.
    evidence:
      - "It is a security and data-protection bar: your resources and data must satisfy each internal policy, industry standard and regulation that binds you."
      - "Rules follow the workload: GDPR for EU consumer data, HIPAA for US healthcare apps."
    takeaway: Compliance covers government regulations such as GDPR, industry standards such as card payment rules, and a business's internal policies.
