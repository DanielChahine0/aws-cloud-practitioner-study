  - id: q-wrbkwg
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-artifact
    note: m10/compliance
    task: "2.2"
    level: 3
    stem: >-
      The cafe's bank asks for proof that the AWS data centers hosting the cafe's apps
      passed independent security audits.
      Which service gives the cafe those documents at no cost?
    options:
      - id: a
        text: AWS Config
        why: Config records how the cafe's own resources are set up, not audits of AWS's data centers.
      - id: b
        text: AWS Audit Manager
        why: Audit Manager helps the cafe collect evidence about its own usage, not AWS's own audit reports.
      - id: c
        text: AWS Artifact
        correct: true
        why: Artifact is a free portal that hands over AWS's own audit reports whenever they are needed.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor checks the cafe's account against best practices and does not supply AWS audit reports.
    evidence:
      - A free portal that hands you AWS's own audit reports whenever needed and lets you handle certain online agreements.
    takeaway: For AWS's own audit reports on demand and at no cost, go to AWS Artifact.
    history: []
    verified:
      keyHash: 6469bdcbc9ee
      fullHash: 28fee31cf2ce
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-9bx6yz
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-artifact
    note: m10/compliance
    task: "2.2"
    level: 1
    stem: >-
      Which tasks can a team handle in AWS Artifact?
    options:
      - id: a
        text: Download third-party audit reports
        correct: true
        why: Artifact hands out AWS's own audit reports whenever a team needs them.
      - id: b
        text: Sign and track online agreements
        correct: true
        why: Artifact lets a team read, sign and track certain agreements with AWS.
      - id: c
        text: Group accounts into units
        why: Grouping accounts is the job of AWS Organizations, not Artifact.
      - id: d
        text: Apply SCPs across accounts
        why: Service control policies are set in AWS Organizations, which Artifact does not replace.
      - id: e
        text: Create users for the account
        why: Users are created in IAM, and Artifact has no part in that.
    evidence:
      - A free portal that hands you AWS's own audit reports whenever needed and lets you handle certain online agreements.
      - It does not group accounts or set SCPs (AWS Organizations) or create users (IAM).
    takeaway: AWS Artifact does two things, reports and agreements, and leaves accounts and users to Organizations and IAM.
    history: []
    verified:
      keyHash: 48b0c38b6398
      fullHash: "57731116e564"
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
