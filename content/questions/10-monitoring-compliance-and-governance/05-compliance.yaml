    version: 1
    status: live
    type: single
    pool: practice
    concept: hipaa
    note: m10/compliance
    task: "2.2"
    level: 2
    stem: >-
      The cafe's owner opens a second business in the US that runs an app for booking
      appointments at medical clinics and storing patient notes.
      Which regulation does that app most clearly fall under?
    options:
      - id: a
        text: GDPR
        why: GDPR covers EU consumer data, and this app serves US clinics and their patients.
      - id: b
        text: HIPAA
        correct: true
        why: A US healthcare app that holds patient data falls under HIPAA.
      - id: c
        text: PCI
        why: The PCI rules cover payment card data, and this app books appointments and stores patient notes.
      - id: d
        text: Data sovereignty laws
        why: Those laws require data to stay in its country, and the stem names a healthcare app, not a location rule.
    evidence:
      - "Rules follow the workload: GDPR for EU consumer data, HIPAA for US healthcare apps."
    takeaway: Which rules apply depends on the workload, and US healthcare apps answer to HIPAA.
