    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-artifact-agreements
    note: m10/compliance
    task: "2.2"
    level: 3
    stem: >-
      The cafe runs several accounts under AWS Organizations and must accept legal terms
      from AWS that cover all of them, then keep track of what it accepted.
      Where does it do this?
    options:
      - id: a
        text: AWS Artifact Reports
        why: Reports holds outside audits of AWS, not the agreements a customer signs with AWS.
      - id: b
        text: AWS Artifact Agreements
        correct: true
        why: Agreements is where a customer reads, signs and tracks agreements, for one account or across an organization.
      - id: c
        text: AWS Organizations
        why: Organizations groups the accounts but is not where agreements with AWS are signed.
      - id: d
        text: AWS Customer Compliance Center
        why: The compliance portal offers stories and whitepapers, and no agreement is signed there.
    evidence:
      - "**Agreements**: where you read, sign and track your agreements with AWS, for a single account or across AWS Organizations, including HIPAA ones."
    takeaway: Signing and tracking agreements with AWS, even across an organization, happens in AWS Artifact Agreements.
    history: []
    verified:
