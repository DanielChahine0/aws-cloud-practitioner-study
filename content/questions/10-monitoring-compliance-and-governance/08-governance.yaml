  - id: q-yqtcbv
    version: 1
    status: live
    type: single
    pool: practice
    concept: bring-your-own-license
    note: m10/governance
    task: "1.4"
    level: 2
    stem: >-
      The cafe already paid a vendor for Microsoft licenses on its back-office servers and is moving them to EC2 Dedicated Hosts.
      It wants to keep using those licenses rather than pay AWS for new ones.
      Which approach fits?
    options:
      - id: a
        text: License-included instances
        why: With license-included instances AWS supplies and charges for the license, so the cafe would pay again.
      - id: b
        text: Reserved Instances
        why: Reserved Instances discount compute for a term commitment, but they do not reuse licenses the cafe owns.
      - id: c
        text: Savings Plans
        why: Savings Plans lower compute rates for a spending commitment, which has nothing to do with existing licenses.
      - id: d
        text: Bring your own license
        correct: true
        why: BYOL reuses licenses bought from a vendor on EC2 Dedicated Hosts, often far cheaper than licenses bought through AWS.
    evidence:
      - BYOL reuses vendor-bought licenses (Microsoft, say) on EC2 Dedicated Hosts or Amazon WorkSpaces, flexibly and often far cheaper than AWS-bought ones.
      - "Microsoft licenses moving to EC2 Dedicated Hosts: BYOL plus License Manager."
    takeaway: Reusing licenses you already own on Dedicated Hosts is BYOL, often cheaper than AWS-supplied licenses.
    history: []
    verified:
      keyHash: 73a39f22d39c
      fullHash: 7a9de065575c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
