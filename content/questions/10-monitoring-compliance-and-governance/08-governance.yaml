    stem: >-
      Across all its branch accounts, the cafe wants governance that stops a nonconforming deployment before it goes live and also finds and fixes resources that have already drifted out of line.
      Which one meets both needs?
    options:
      - id: a
        text: Service control policies
        why: An SCP caps what an account's users and roles may do, but it does not find and fix resources already out of line.
      - id: b
        text: AWS Config rules
        why: Config rules flag and can fix drifted resources, but they check settings after the fact rather than stop a deployment.
      - id: c
        text: AWS Control Tower controls
        correct: true
        why: Control Tower controls block nonconforming deployments and also catch and fix noncompliant accounts and resources.
      - id: d
        text: IAM permission policies
        why: An IAM policy allows or denies actions for one identity, and it does not find or fix drifted resources.
    evidence:
      - "**Controls (guardrails)**: high-level rules, like road crash barriers, that block nonconforming deployments and catch and fix noncompliant accounts and resources."
    takeaway: Control Tower controls both prevent nonconforming deployments and detect and fix drift, which SCPs or Config rules alone do not.
