questions:
  - id: q-2eddfb
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-governance
    note: m10/governance
    task: "2.2"
    level: 1
    stem: >-
      What does governance mean for an AWS deployment?
    options:
      - id: a
        text: An approach that bills each team only for the resources it uses
        why: That describes pay-as-you-go pricing, not the rules that keep work aligned with goals.
      - id: b
        text: An approach that adds capacity automatically as customer demand grows
        why: That describes elasticity, which matches capacity to demand rather than setting rules for how work is done.
      - id: c
        text: An approach that keeps the work efficient and in line with company aims
        correct: true
        why: Governance is the set of rules that keeps a deployment efficient and in line with business goals.
      - id: d
        text: An approach that keeps applications running when a single component fails
        why: That describes high availability, which keeps service up rather than steering how teams build.
    evidence:
      - Governance means rules that keep building and running a deployment efficient and aligned with business goals.
    takeaway: Governance is the rule set that keeps cloud work efficient and aligned with business goals.
    history: []
    verified:
      keyHash: 63c97eeb0a08
      fullHash: 7e3d10a4bbf0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-emkm99
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-governance
    note: m10/governance
    task: "2.2"
    level: 2
    stem: >-
      The cafe grew from one AWS account to many, and new teams now launch services every week.
      The owner sees accounts, costs and settings drifting away from what the business wants.
      What does the cafe most need to add?
    options:
      - id: a
        text: Elasticity
        why: Elasticity matches capacity to demand, but it sets no rules to keep teams aligned with business goals.
      - id: b
        text: Governance
        correct: true
        why: Growth makes accounts and services harder to keep in check, and governance supplies the rules that keep them aligned.
      - id: c
        text: High availability
        why: High availability keeps services running through failures, which does not address drifting accounts and settings.
      - id: d
        text: Scalability
        why: Scalability lets the cafe grow its capacity, but the problem here is control over that growth.
    evidence:
      - Growth makes accounts, services and licenses harder to keep in check.
      - Governance means rules that keep building and running a deployment efficient and aligned with business goals.
    takeaway: As accounts and teams multiply, governance rules keep cloud work efficient and aligned with the business.
    history: []
    verified:
      keyHash: c0666b87c5d8
      fullHash: 0bfc81b5aba7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-7tfvm6
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-control-tower
    note: m10/governance
    task: "2.2"
    level: 3
    stem: >-
      The cafe's head office opens an AWS account for each new franchise location.
      It wants every one of those accounts to meet its approved security and compliance rules, overseen from one place.
      Which service fits?
    options:
      - id: a
        text: AWS CloudTrail
        why: CloudTrail records API calls for later review, but it does not set up or govern new accounts.
      - id: b
        text: AWS License Manager
        why: License Manager tracks software licenses, not the compliance of each new account.
      - id: c
        text: AWS Service Catalog
        why: Service Catalog offers approved resources inside accounts, while governing account creation is another service's job.
      - id: d
        text: AWS Control Tower
        correct: true
        why: Control Tower applies security and compliance rules to every account from one place and issues compliant accounts.
    evidence:
      - "A government agency wants each new account to meet approved requirements: Control Tower, not CloudTrail (records API calls) or License Manager (licenses)."
      - "It is Cloud Town's control room: one place to apply security, operations and compliance rules to every account and organization, however many."
    takeaway: To make every new account meet approved rules from one place, use AWS Control Tower.
    history: []
    verified:
      keyHash: 4c5a511a41ac
      fullHash: 41ef06714c6d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-rwjfcg
    version: 1
    status: live
    type: match
    pool: practice
    concept: aws-control-tower
    note: m10/governance
    task: "2.2"
    level: 1
    stem: >-
      Match each part of AWS Control Tower to the job it does.
    pairs:
      - left: Landing zone
        right: Holds every governed OU, account, user and resource
        why: The landing zone is the outer multi-account boundary that everything under compliance rules sits inside.
      - left: Account Factory
        right: Creates each new account from one template
        why: Account Factory builds new accounts from a single configurable template.
      - left: Controls (guardrails)
        right: Blocks and fixes noncompliant deployments
        why: Controls are high-level rules that stop nonconforming deployments and correct noncompliant resources.
      - left: Dashboard
        right: Shows a running summary of compliance status
        why: The dashboard gives an ongoing visual view of accounts, controls and compliance status.
    evidence:
      - "**Landing zone**: the outer, best-practice multi-account boundary; every OU, account, user and resource you want under compliance rules lives inside it."
      - "**Account Factory**: stamps out each new account from one configurable template."
      - "**Dashboard**: an ongoing visual summary of provisioned accounts, controls and compliance status."
    takeaway: Control Tower combines a landing zone, Account Factory, controls and a dashboard to govern many accounts.
    history: []
    verified:
      keyHash: 74a70a47ec74
      fullHash: 5d333ec9f539
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
