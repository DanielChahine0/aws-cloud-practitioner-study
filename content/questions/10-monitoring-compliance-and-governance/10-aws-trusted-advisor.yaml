  - id: q-8nxfvs
    version: 1
    status: live
    type: single
    pool: practice
    concept: service-limits
    note: m10/aws-trusted-advisor
    task: "4.3"
    level: 2
    stem: >-
      As the cafe opens new branches, a Trusted Advisor check shows its use of one service has reached a soft limit.
      Where does the cafe go to have that limit raised?
    options:
      - id: a
        text: The AWS Health Dashboard
        why: The Health Dashboard reports AWS events affecting the account; it does not raise limits.
      - id: b
        text: The AWS Artifact portal
        why: Artifact hands out AWS's audit reports and agreements, not increases to service limits.
      - id: c
        text: The Service Quota console
        correct: true
        why: Soft limits are raised through the Service Quota console, which lets the cafe ask for more.
      - id: d
        text: The AWS Budgets dashboard
        why: Budgets tracks spending against a plan, and a budget change does not lift a service limit.
    evidence:
      - Many are soft limits, raised through the Service Quota console
      - Usage near or at a limit
    takeaway: When Trusted Advisor shows usage at a soft limit, ask for more through the Service Quota console.
