    note: m10/aws-trusted-advisor
    task: "4.3"
    level: 2
    stem: >-
      Trusted Advisor warns that one of the cafe's EBS volumes is held back from its full speed by the throughput of the EC2 instance it is attached to.
      Which check category raised this warning?
    options:
      - id: a
