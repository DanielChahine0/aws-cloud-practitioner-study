questions:
  - id: q-7w1h2h
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-config
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 3
    stem: >-
      To keep spending down, the cafe lets its developers launch only a short, approved list of EC2 instance types.
      Which service keeps checking every running instance against that guideline and flags any that break it?
    options:
      - id: a
        text: AWS Trusted Advisor
        why: Trusted Advisor compares the account with general best practices, not with the cafe's own instance list.
      - id: b
        text: AWS Config
        correct: true
        why: Config evaluates each instance's configuration against the cafe's own rule and reports any that fail it.
      - id: c
        text: AWS Control Tower
        why: Control Tower sets up and governs a multi-account environment rather than checking each instance's settings.
      - id: d
        text: AWS CloudTrail
        why: CloudTrail logs the API call that launched an instance but never judges its type against a rule.
    evidence:
      - "Developers must use only an approved, low-cost list of EC2 types: AWS Config."
      - Configuration guidelines point to Config, even when cost is mentioned.
    takeaway: A configuration guideline to check resources against points to AWS Config, even when the reason behind it is cost.
    history: []
    verified:
      keyHash: c2afe3c75e56
      fullHash: 534eea4d567d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-zzxv59
    version: 1
    status: live
    type: match
    pool: practice
    concept: aws-config
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 2
    stem: >-
      The cafe's cloud team uses AWS Config for several jobs.
      Match each job with the kind of Config use it is.
    pairs:
      - left: Confirm every register server still matches the setup the cafe approved
        right: Desired-state check
        why: Comparing each server with the setup the cafe chose is a desired-state check.
      - left: Work out why the menu app stopped loading this morning
        right: Troubleshooting
        why: Config's history of configurations helps trace a fault in the menu app back to its cause.
      - left: Track how the order network's settings changed over the past month
        right: Change management
        why: Config records each change to a resource's configuration, which gives the history change management needs.
      - left: Keep checking firewall and access protections all year, not just once
        right: Ongoing security audit
        why: Config keeps watching resources, so protection checks run continually rather than at one point in time.
    evidence:
      - "Uses: desired-state checks, ongoing security audits, troubleshooting, change management."
      - AWS Config records configurations, tracks changes and checks them against your rules.
    takeaway: AWS Config serves desired-state checks, ongoing security audits, troubleshooting and change management.
    history: []
    verified:
      keyHash: 9a2be8b001d1
      fullHash: 596a3580ca87
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-98zx2j
    version: 1
    status: live
    type: single
    pool: practice
    concept: config-rules
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 1
    stem: >-
      In AWS Config, what is a Config rule?
    options:
      - id: a
        text: A cap on the API actions that one member account may use
        why: That describes a service control policy in AWS Organizations, not a standard Config evaluates.
      - id: b
        text: A prebuilt mapping of resources to an outside regulation
        why: That describes an AWS Audit Manager framework, which supports proving compliance to auditors.
      - id: c
        text: A standard that resources are checked against
        correct: true
        why: A Config rule states the configuration a resource should have, and Config tests resources against it.
      - id: d
        text: A permission policy that is attached to an IAM user
        why: An IAM policy grants or denies access; it does not define a configuration to evaluate.
    evidence:
      - "**Config rule**: a standard Config checks resources against."
      - Firms set configuration rules per resource and must audit against them.
    takeaway: A Config rule is the configuration standard that AWS Config evaluates each resource against.
    history: []
    verified:
      keyHash: a83d69a1bbc1
      fullHash: 88e82f2edd9b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-6whd9b
    version: 1
    status: live
    type: single
    pool: practice
    concept: config-rules
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 2
    stem: >-
      The cafe has a Config rule that every S3 bucket holding receipts must have versioning turned on.
      A new receipts bucket is created with versioning off.
      What does AWS Config do with this bucket?
    options:
      - id: a
        text: It marks the bucket as noncompliant and alerts the team.
        correct: true
        why: Config evaluates the bucket against the rule, marks it noncompliant and alerts the cafe about it.
      - id: b
        text: It blocks the bucket from being created in the first place.
        why: Config evaluates resources that already exist; it does not stop a bucket from being created.
      - id: c
        text: It records the API call that created the bucket in a trail.
        why: Recording the API call in a trail is AWS CloudTrail's job, not how Config treats a failing bucket.
      - id: d
        text: It places the bucket's settings in an audit-ready report.
        why: Building audit-ready reports is AWS Audit Manager's job, not what Config does with a failing bucket.
    evidence:
      - It alerts you to noncompliant resources and can fix them automatically.
      - It reports pass and fail and keeps watching so settings stay put, as compliance is ongoing.
    takeaway: A resource that breaks a Config rule is reported as failing and flagged, and Config keeps checking it over time.
    history: []
    verified:
      keyHash: 9b7ff2e37c05
      fullHash: 3372cb2b0e29
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-873xfj
    version: 1
    status: live
    type: single
    pool: practice
    concept: automated-remediation
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 2
    stem: >-
      A developer at the cafe changes a storage setting so that it no longer meets a rule the cafe set for that resource.
      The cafe wants the setting put back to the compliant value without anyone stepping in.
      Which capability does this?
    options:
      - id: a
        text: AWS CloudTrail log file integrity validation
        why: Integrity validation shows whether log files were tampered with; it never changes a resource setting.
      - id: b
        text: AWS Config automated remediation
        correct: true
        why: Automated remediation applies a fix that brings the noncompliant setting back into compliance on its own.
      - id: c
        text: AWS Audit Manager prebuilt frameworks
        why: A framework maps resources to a standard for audit proof; it does not repair a resource.
      - id: d
        text: AWS Trusted Advisor best-practice checks
        why: Trusted Advisor recommends improvements but does not restore a setting against the cafe's own rule.
    evidence:
      - It alerts you to noncompliant resources and can fix them automatically.
      - Config checks configurations against your rules and can auto-fix.
    takeaway: AWS Config automated remediation puts a noncompliant resource back into compliance without manual work.
    history: []
    verified:
      keyHash: 9997eab1d004
      fullHash: c127a8379b5c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-r4x2s9
    version: 1
    status: live
    type: single
    pool: practice
    concept: automated-remediation
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 1
    stem: >-
      What does automated remediation do in AWS Config?
    options:
      - id: a
        text: It collects proof of working controls for an auditor.
        why: Collecting audit proof is the job of AWS Audit Manager, not of a fix applied by Config.
      - id: b
        text: It records each API call made in the account.
        why: Recording API calls is what AWS CloudTrail does, and it changes no resource.
      - id: c
        text: It restores noncompliant resources to compliance.
        correct: true
        why: Remediation applies a fix to a resource that fails a rule so that it complies again.
      - id: d
        text: It serves AWS's own reports from outside auditors.
        why: AWS Artifact serves those reports, which describe AWS rather than fixing your resources.
    evidence:
      - "**Automated remediation**: fixes that restore compliance."
    takeaway: Automated remediation is a fix that Config applies to bring a resource that fails a rule back into compliance.
    history: []
    verified:
      keyHash: 2832e85a6ea0
      fullHash: cba4cf4317c9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-cqg9g7
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-audit-manager
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 3
    stem: >-
      The cafe's bank asks it to prove, with reports ready for the bank's examiners, that its payment controls actually work.
      Which service gathers the proof and tests those controls?
    options:
      - id: a
        text: AWS Config
        why: Config checks resource settings against rules but does not build audit reports proving controls work.
      - id: b
        text: AWS CloudTrail
        why: CloudTrail records API calls, which is one log, not a tested set of controls with reports.
      - id: c
        text: AWS Audit Manager
        correct: true
        why: Audit Manager collects evidence, tests whether controls work and builds reports ready for auditors.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor checks the account against best practices and offers no audit reports or control tests.
    evidence:
      - It tests whether controls (policies, procedures, activities) work, runs stakeholder reviews and builds audit-ready reports.
      - Regulated firms must also prove it, as a financial firm must show it handles money safely.
    takeaway: When a firm must prove its controls work with audit-ready reports, AWS Audit Manager fits, not AWS Config.
    history: []
    verified:
      keyHash: 0da29499daea
      fullHash: ca40e9027df4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-yg53ry
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: aws-audit-manager
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 1
    stem: >-
      Which tasks does AWS Audit Manager perform?
    options:
      - id: a
        text: Test whether controls such as policies work
        correct: true
        why: Audit Manager tests whether the policies, procedures and activities being audited actually work.
      - id: b
        text: Restore settings that drift from the rules
        why: Fixing settings is AWS Config's remediation, and Audit Manager only has read-only access.
      - id: c
        text: Support a firm's internal risk assessments
        correct: true
        why: Audit Manager supports the internal risk assessments a firm runs on its own controls.
      - id: d
        text: Record the API calls made in an account
        why: Recording API calls is the job of AWS CloudTrail, not of Audit Manager.
      - id: e
        text: Spot signs of threats in account activity
        why: Watching activity for threats is the job of Amazon GuardDuty, not of Audit Manager.
    evidence:
      - It tests whether controls (policies, procedures, activities) work, runs stakeholder reviews and builds audit-ready reports.
      - Read-only access protects audit integrity, and it supports internal risk assessments.
    takeaway: AWS Audit Manager tests whether controls work and supports internal risk assessments, all through read-only access.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 2 and 5 fit AWS Audit Manager; 1 is AWS Config, 3 is GuardDuty and 4 is CloudTrail.)"
  - id: q-c8d2s6
