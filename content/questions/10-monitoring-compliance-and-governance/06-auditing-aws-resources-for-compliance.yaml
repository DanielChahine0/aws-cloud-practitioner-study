      The cafe takes card payments and must show it meets the PCI regulations.
      For its audit, it wants a starting point that maps its own resources to that standard.
      What should it use?
    options:
      - id: a
        text: A managed AWS Config rule
        why: A Config rule checks one setting on a resource; it does not map the cafe's resources to a regulation.
      - id: b
        text: An AWS Audit Manager framework
        correct: true
        why: A prebuilt framework maps the cafe's resources to a standard or regulation, ready to use.
      - id: c
        text: An AWS Organizations service control policy
        why: A service control policy caps the actions an account may take and maps nothing to a regulation.
      - id: d
        text: An AWS Artifact compliance report
        why: An Artifact report covers AWS's own controls, not a mapping of the cafe's resources to PCI.
    evidence:
      - Prebuilt frameworks map your resources to standards and regulations.
    takeaway: A prebuilt Audit Manager framework maps a firm's resources to a standard such as PCI as an audit starting point.
