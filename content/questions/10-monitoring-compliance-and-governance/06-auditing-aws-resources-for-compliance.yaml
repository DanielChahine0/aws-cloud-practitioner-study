    concept: automated-evidence-collection
    note: m10/auditing-aws-resources-for-compliance
    task: "2.2"
    level: 2
    stem: >-
      Before each compliance review, the cafe's finance and IT teams spend weeks pulling together screenshots and logs as proof that their controls work.
      Which approach cuts most of this manual work?
    options:
      - id: a
        text: Use AWS CloudTrail to share API call history
        why: Sharing API call history still leaves the teams assembling proof for every other control by hand.
      - id: b
        text: Use AWS Artifact to share AWS's own reports
        why: Artifact reports describe AWS's controls, not the cafe's, so the teams still gather their own proof.
      - id: c
        text: Use AWS Audit Manager to gather the proof
        correct: true
        why: Audit Manager collects evidence automatically and continually across teams, so no one gathers it by hand.
      - id: d
        text: Use AWS Config to record resource settings
        why: Config records and checks settings but does not gather proof of controls across the teams.
    evidence:
      - Audit Manager is fully managed, audits usage continually and automates evidence collection across teams.
    takeaway: AWS Audit Manager replaces manual, team-by-team proof gathering with continual automated evidence collection.
    history: []
