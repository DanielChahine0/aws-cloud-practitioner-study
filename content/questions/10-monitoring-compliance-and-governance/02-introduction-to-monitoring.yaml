    stem: >-
      Match each cafe situation to the monitoring response that fits it.
    pairs:
      - left: The EC2 instance behind the ordering site is overloaded
        right: An automatic action adds more capacity
        why: An overloaded instance can be relieved without people by having EC2 Auto Scaling add capacity.
      - left: Customer wait times run long at the counter
        right: The owner receives an alert
        why: The owner wants to be warned when waits grow too long so someone can step in.
      - left: The owner wants to review the week's sales totals
        right: A report of tracked metrics is produced
        why: Totals over a week call for a summary of gathered metrics, not an urgent warning.
    evidence:
      - "An overloaded EC2 instance: EC2 Auto Scaling launches another."
      - It can trigger automatic actions or alert people.
      - The owner cannot watch all day, so wants a report (coffees sold, average wait, stock-outs) and an alert when waits run long.
    takeaway: Monitoring can respond to a problem with an automatic action or by alerting people, and reports cover routine review.
