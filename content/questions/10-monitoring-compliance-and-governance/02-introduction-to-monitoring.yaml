  - id: q-tnm6rq
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-monitoring
    note: m10/introduction-to-monitoring
    task: "2.2"
    level: 2
    stem: >-
      The cafe's owner is too busy serving customers to keep an eye on the ordering app.
      She wants a daily summary of order totals and wait times, and a warning on her phone when waits grow too long.
      Which practice is she setting up?
    options:
      - id: a
        text: Governance
        why: Governance sets rules for how accounts and resources are built, not summaries and warnings about how the app runs.
      - id: b
        text: Monitoring
        correct: true
        why: Monitoring gathers values such as wait times, judges them over time and alerts someone when they go wrong.
      - id: c
        text: Compliance
        why: Compliance is about meeting policies, standards and laws, not tracking how fast orders move.
      - id: d
        text: Auditing
        why: Auditing checks records against requirements after the fact, not live wait times with a warning.
    evidence:
      - "The loop: watch, gather metrics, judge them over time, then act."
      - It can trigger automatic actions or alert people.
    takeaway: Collecting values such as wait times, reviewing them and alerting when they go wrong is monitoring.
