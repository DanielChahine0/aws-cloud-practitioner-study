  - id: q-ysx6r8
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudwatch-logs
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 2
    stem: >-
      Last week one of the cafe's smart espresso machines brewed decaf when a customer ordered regular.
      The machines send their event records to AWS.
      Where should the team search to find out what happened?
    options:
      - id: a
        text: CloudWatch dashboards
        why: A dashboard displays metric graphs, not the searchable event records needed to trace one brew.
      - id: b
        text: CloudWatch Logs
        correct: true
        why: CloudWatch Logs stores log files centrally so the team can search and filter last week's entries.
      - id: c
        text: CloudWatch alarms
        why: An alarm reacts to a metric threshold going forward; it holds no record of past events.
      - id: d
        text: CloudWatch metrics
        why: A metric holds numeric values over time, not the detailed record of what each brew did.
    evidence:
      - "A machine brewed decaf: search CloudWatch Logs."
      - "**CloudWatch Logs**: central log storage and search."
    takeaway: To dig into what a system did in the past, search the detailed records kept in CloudWatch Logs.
    history: []
