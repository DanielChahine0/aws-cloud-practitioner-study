  - id: q-d4z2zh
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudwatch-alarms
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 2
    stem: >-
      Each espresso machine needs cleaning after a set number of shots, and the cafe already tracks the shot count in Amazon CloudWatch.
      The manager wants a text message the moment a machine reaches that number.
      Which CloudWatch feature should the cafe set up?
    options:
      - id: a
        text: A CloudWatch dashboard
        why: A dashboard shows the count on screen, but someone has to look at it; it sends nothing.
      - id: b
        text: A CloudWatch Logs search
        why: A log search finds past records on request, so it cannot react the moment a count is hit.
      - id: c
        text: A CloudWatch alarm
        correct: true
        why: An alarm acts when a metric crosses a threshold and can send the text through Amazon SNS.
      - id: d
        text: A CloudWatch metric
        why: The metric already counts the shots; on its own it measures and never notifies anyone.
    evidence:
      - An alarm can notify through SNS or scale EC2 automatically.
      - "Machines due for cleaning: a custom metric plus an alarm."
    takeaway: To react when a metric crosses a threshold, such as texting a manager, set a CloudWatch alarm.
    history: []
    verified:
      keyHash: c2d149e0aad9
      fullHash: 039327b8c30d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-q09wnt
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: cloudwatch-alarms
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 1
    stem: >-
      Which responses can an Amazon CloudWatch alarm set off on its own when its metric crosses a threshold?
    options:
      - id: a
        text: Send a text to the manager through Amazon SNS
        correct: true
        why: Alarms can notify people, for example by sending a text message through SNS.
      - id: b
        text: Show several metrics together on one dashboard
        why: CloudWatch can do this, but it is the job of a dashboard, not a response an alarm sets off.
      - id: c
        text: Add Amazon EC2 instances to handle the load
        correct: true
        why: Alarms can change resources as well as notify, such as scaling out EC2 capacity.
      - id: d
        text: Keep log files in one place for later search
        why: CloudWatch Logs stores and searches log files; that is not an action an alarm triggers.
      - id: e
        text: Record a value over time as a custom metric
        why: Recording a value is what a metric does; the alarm watches that metric rather than creating it.
    evidence:
      - An alarm can notify through SNS or scale EC2 automatically.
    takeaway: A CloudWatch alarm can either notify people, such as through SNS, or change resources, such as scaling EC2.
