        text: Add Amazon EC2 instances to handle the load
        correct: true
        why: Alarms can change resources as well as notify, such as scaling out EC2 capacity.
      - id: d
        text: Keep log files in one place for later search
        why: CloudWatch Logs stores and searches log files; that is not an action an alarm triggers.
      - id: e
        text: Record a value over time as a custom metric
        why: Recording a value is what a metric does; the alarm watches that metric rather than creating it.
    evidence:
      - An alarm can notify through SNS or scale EC2 automatically.
    takeaway: A CloudWatch alarm can either notify people, such as through SNS, or change resources, such as scaling EC2.
