questions:
  - id: q-fccp9e
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-cloudwatch
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 3
    stem: >-
      The cafe runs its ordering app on Amazon EC2 and keeps its till server in the back office.
      The owner wants to see CPU use and app performance for both, live, in one place.
      Which service fits?
    options:
      - id: a
        text: AWS CloudTrail
        why: CloudTrail records who made which API call, not live CPU or app performance numbers.
      - id: b
        text: AWS Config
        why: Config tracks how resource settings change over time, not live performance figures.
      - id: c
        text: Amazon CloudWatch
        correct: true
        why: CloudWatch watches AWS resources, their apps and on-premises servers in real time from one hub.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor gives best-practice checks, not a live feed of server performance.
    evidence:
      - Amazon CloudWatch is a single real-time hub for watching AWS resources, the apps on them, and on-premises servers.
      - Choose it for performance numbers and thresholds, not for who called an API.
    takeaway: Live performance numbers for AWS and on-premises servers in one place point to CloudWatch, not CloudTrail or Config.
    history: []
    verified:
      keyHash: 0cb2e95423b3
      fullHash: de3610444855
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-z9amra
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-cloudwatch
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 1
    stem: >-
      Which job is the main use of Amazon CloudWatch?
    options:
      - id: a
        text: Recording which user made each API call
        why: Recording who called which API is the auditing job of AWS CloudTrail, not CloudWatch.
      - id: b
        text: Troubleshooting running infrastructure
        correct: true
        why: CloudWatch gathers metrics, alarms and logs so teams can find and fix infrastructure faults.
      - id: c
        text: Checking accounts against best practices
        why: Best-practice checks across an account are what AWS Trusted Advisor provides, not CloudWatch.
      - id: d
        text: Tracking how resource settings change
        why: A history of resource setting changes is kept by AWS Config, not by CloudWatch.
    evidence:
      - It also aids visualizing, automating and proactive monitoring; the core use is infrastructure troubleshooting.
      - Choose it for performance numbers and thresholds, not for who called an API.
    takeaway: CloudWatch's core job is helping teams troubleshoot running infrastructure, not auditing API calls or settings.
    history: []
    verified:
      keyHash: 7955ad4c7774
      fullHash: bc7c25745315
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ngy0ky
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudwatch-metrics
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 2
    stem: >-
      The cafe wants Amazon CloudWatch to hold a running count of the shots each espresso machine pulls, so it can see the number climb day by day.
      Which CloudWatch feature holds that count?
    options:
      - id: a
        text: A metric
        correct: true
        why: A metric is a value tracked over time, and it can be the cafe's own count of shots per machine.
      - id: b
        text: A dashboard
        why: A dashboard only displays metrics that already exist; it does not hold a new tracked value itself.
      - id: c
        text: A log group
        why: Logs hold text records for searching, not a single value tracked over time for charting.
      - id: d
        text: An alarm
        why: An alarm watches a value and acts at a threshold; it needs the count to exist first rather than holding it.
    evidence:
      - "**Metric**: a value tracked over time for a resource or process, such as EC2 CPU use or coffees sold."
    takeaway: A CloudWatch metric is a value tracked over time, and it can be the business's own count, such as shots per machine.
    history: []
    verified:
      keyHash: 9ee1cca2fc6d
      fullHash: 8d588d5fafe3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-v17rke
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudwatch-metrics
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 1
    stem: >-
      What is a metric in Amazon CloudWatch?
    options:
      - id: a
        text: A threshold that starts an action when crossed
        why: That describes an alarm, which watches a metric rather than being one.
      - id: b
        text: A console page that refreshes on its own
        why: That describes a dashboard, which displays metrics rather than being one.
      - id: c
        text: A store of log files that can be searched
        why: That describes CloudWatch Logs, which keeps text records rather than tracked values.
      - id: d
        text: A value tracked over time for a resource
        correct: true
        why: A metric is a measured value over time, such as an instance's CPU use.
    evidence:
      - "**Metric**: a value tracked over time for a resource or process, such as EC2 CPU use or coffees sold."
      - Metrics measure, alarms react, dashboards display, Logs keeps searchable detail.
    takeaway: A CloudWatch metric is a value measured over time, the raw input that alarms and dashboards build on.
    history: []
