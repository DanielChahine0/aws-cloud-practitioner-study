        text: Cached copies of pages near customers
        why: Keeping copies of pages close to customers is a content delivery job, while CloudWatch only watches how the app and server run.
      - id: e
        text: Sharper forecasts of what customers buy
        why: Predicting purchases belongs to other AWS services, while CloudWatch watches how the app and server run.
    evidence:
      - One integrated view replaces siloed monitoring.
      - Faster fixes (lower MTTR) and better TCO free developers for business work.
      - Content delivery, purchase prediction and architecture design are other services' jobs, not CloudWatch's.
    takeaway: CloudWatch replaces siloed monitoring with one view and speeds up fixes, but it does not deliver content or design architectures.
