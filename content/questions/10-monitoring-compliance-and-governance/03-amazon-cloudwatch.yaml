    stem: >-
      The cafe's IT lead is making the case for Amazon CloudWatch to watch the ordering app and the back-office server.
      Which benefits can the lead promise the owner?
    options:
      - id: a
        text: One view in place of siloed tools
        correct: true
        why: CloudWatch pulls monitoring of the app and the server into one integrated view, replacing tools that each watch a single part.
      - id: b
        text: Faster page loads for distant customers
        why: Speeding up delivery to faraway customers is a content delivery job, not something watching the app gives.
      - id: c
        text: Shorter time to find and fix faults
        correct: true
        why: With metrics, alarms and logs in one place, the team finds and fixes faults faster, lowering MTTR.
