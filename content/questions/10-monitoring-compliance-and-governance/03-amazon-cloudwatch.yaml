  - id: q-5hey0f
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudwatch-dashboards
    note: m10/amazon-cloudwatch
    task: "2.2"
    level: 2
    stem: >-
      The cafe's shift lead opens a separate console page for each espresso machine to check its shot count.
      She wants all the counts on one screen that keeps itself up to date.
      Which Amazon CloudWatch feature fits?
    options:
      - id: a
        text: CloudWatch alarms
        why: An alarm reacts to a single threshold; it does not lay out every machine's count on one screen.
      - id: b
        text: CloudWatch dashboards
        correct: true
        why: A dashboard is a custom console page that shows many metrics in one view and refreshes itself.
      - id: c
        text: CloudWatch Logs
        why: Logs store and search text records, which does not give a live view of counts side by side.
      - id: d
        text: CloudWatch metrics
        why: The shot counts already are metrics; on their own they do not gather every machine onto one screen.
    evidence:
      - "**CloudWatch dashboard**: a self-refreshing console page of metrics."
    takeaway: When many metrics should sit on one self-refreshing screen, build a CloudWatch dashboard.
