    options:
      - id: a
        text: It keeps cached copies of content at edge locations
        why: Caching content at edge locations describes CloudFront, not Global Accelerator.
      - id: b
        text: It translates domain names into numeric IP addresses
        why: Translating names into addresses is DNS work, which Route 53 handles.
      - id: c
        text: It carries traffic over the private AWS network
        correct: true
        why: Global Accelerator moves traffic off crowded public routes onto the AWS private global network.
      - id: d
        text: It spreads requests across instances in one Region
        why: Spreading requests inside one Region is load balancing, not the global routing Global Accelerator offers.
    evidence:
      - Global Accelerator moves app traffic off crowded public routes onto the AWS private global network for better availability, performance and security.
    takeaway: Global Accelerator speeds apps by moving traffic off the public internet onto the AWS private global network.
