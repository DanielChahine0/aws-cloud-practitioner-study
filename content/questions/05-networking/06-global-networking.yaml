questions:
  - id: q-4zwsa2
    version: 1
    status: live
    type: single
    pool: practice
    concept: edge-networking
    note: m05/global-networking
    task: "3.2"
    level: 1
    stem: >-
      Which description matches the idea of edge networking?
    options:
      - id: a
        text: Placing compute and storage close to where users and data are
        correct: true
        why: Edge networking moves processing and storage toward the people and places that create and use the data.
      - id: b
        text: Copying data across several Availability Zones in one Region
        why: Spreading copies across Availability Zones is about resilience inside a Region, not about moving work toward users.
      - id: c
        text: Linking an on-premises data center to AWS over a private line
        why: A private line to a data center is a hybrid connection, not a way of placing compute near end users.
      - id: d
        text: Splitting a private network in the cloud into isolated subnets
        why: Subnets organize resources inside a VPC and do not bring computing any closer to users.
    evidence:
      - Edge networking pushes compute and storage toward where data is created and used, giving user-facing apps secure, speedy networking.
    takeaway: Edge networking places compute and storage near users and data sources so user-facing apps respond quickly.
    history: []
    verified:
      keyHash: 4b8b9c206d88
      fullHash: fdf31c7af964
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-jtdh3r
    version: 1
    status: live
    type: single
    pool: practice
    concept: edge-networking
    note: m05/global-networking
    task: "3.5"
    level: 2
    stem: >-
      Customers far from the Region that hosts the cafe's ordering app complain that pages respond slowly.
      Which approach cuts this delay?
    options:
      - id: a
        text: Running the app across more Availability Zones
        why: Extra Availability Zones add resilience inside the same Region, but distant customers still face a long network trip.
      - id: b
        text: Processing and caching content at the edge
        correct: true
        why: Handling work near the customers shortens each trip, which is how edge networking lowers latency.
      - id: c
        text: Linking the cafe's office to AWS over a private line
        why: A private line helps traffic from the cafe's own office, not the trip from faraway customers to the app.
      - id: d
        text: Moving the app's database to a larger instance
        why: A larger database server can speed queries, but the network distance to distant customers stays the same.
    evidence:
      - Processing or caching near users lowers latency and keeps the organization in control of its infrastructure.
    takeaway: When distance causes lag, edge networking helps by processing or caching near the users.
    history: []
    verified:
      keyHash: f82c155c57d6
      fullHash: c37cfb3b51eb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
