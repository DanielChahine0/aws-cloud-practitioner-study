    concept: amazon-route-53
    note: m05/global-networking
    task: "3.5"
    level: 3
    stem: >-
      The cafe owns several domain names, each registered with a different outside registrar.
      It wants to move all of them into one AWS service that also answers DNS queries for them.
      Which service fits?
    options:
      - id: a
        text: AWS Global Accelerator
        why: Global Accelerator steers app traffic over the AWS network, but it does not register or hold domain names.
      - id: b
        text: Elastic Load Balancing
        why: A load balancer spreads requests across targets and has no role in managing domain registrations.
      - id: c
        text: Amazon CloudFront
        why: CloudFront caches content near customers and does not take over domains from other registrars.
      - id: d
        text: Amazon Route 53
        correct: true
        why: Route 53 is the AWS DNS service, and it can register domains and take over records from other registrars.
    evidence:
      - It also runs health checks, registers new domains and takes over DNS records from other registrars, so all your domains live in one place.
    takeaway: To gather domains from many registrars in one place and serve their DNS, pick Route 53.
