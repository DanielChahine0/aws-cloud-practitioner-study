  - id: q-r8ed0z
    version: 1
    status: live
    type: single
    pool: practice
    concept: route-53-routing-policies
    note: m05/global-networking
    task: "3.5"
    level: 2
    stem: >-
      The cafe runs its ordering app in a North American Region and in the Dublin Region.
      It wants Route 53 to send customers in Ireland to Dublin purely because of the country they are in.
      Which routing policy fits?
    options:
      - id: a
        text: Latency-based routing
        why: Latency-based routing picks whichever endpoint answers fastest, not the one tied to the customer's country.
      - id: b
        text: Weighted round robin routing
        why: Weighted round robin splits traffic by set shares and ignores where each customer is.
      - id: c
        text: Geolocation routing
        correct: true
        why: Geolocation routing chooses the endpoint by where the customer is, such as Ireland going to Dublin.
      - id: d
        text: Geoproximity routing
        why: Geoproximity weighs the distance between users and resources rather than the country the user is in.
    evidence:
      - Geolocation routes by where the customer is, so North America goes to a North American Region and Ireland to the Dublin Region.
    takeaway: Routing customers to a Region by the place they are in is the job of Route 53 geolocation routing.
    history: []
    verified:
      keyHash: 3ccd3d6f8058
      fullHash: 58e8ca3d7de3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
