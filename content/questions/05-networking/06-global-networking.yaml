  - id: q-a7gr7y
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-global-accelerator
    note: m05/global-networking
    task: "3.5"
    level: 3
    stem: >-
      The cafe's ordering app runs in two Regions.
      The cafe wants fixed IP addresses for the app and fast failover to the healthy Region if one goes down, with traffic kept on the AWS network.
      Which service fits?
    options:
      - id: a
        text: Amazon Route 53
        why: Route 53 answers DNS queries and runs health checks, but it does not give the app fixed IP addresses.
      - id: b
        text: Amazon CloudFront
        why: CloudFront caches content near customers rather than steering app traffic between Regions on fixed addresses.
      - id: c
        text: AWS Direct Connect
        why: Direct Connect links an on-premises site to AWS and does not route public customers to a healthy Region.
      - id: d
        text: AWS Global Accelerator
        correct: true
        why: Global Accelerator gives static IP addresses and fails over quickly to healthy endpoints over the AWS network.
    evidence:
      - The assessment adds static IP addresses and a best-endpoint choice based on endpoint health, user location and your policies.
      - Fast failover when one app location fails is the clue that separates it from Route 53 (DNS, domains, health checks) and CloudFront (content caching).
    takeaway: Static IP addresses plus fast failover between app locations point to Global Accelerator.
    history: []
