      Nothing in this traffic can be cached, and play stutters when it crosses crowded public internet routes.
      Which service fits?
    options:
      - id: a
        text: Amazon CloudFront
        why: CloudFront speeds delivery by caching content near users, which does not help traffic that cannot be cached.
      - id: b
        text: Elastic Load Balancing
        why: A load balancer spreads requests across servers within a Region and does not change the route players' traffic takes.
      - id: c
        text: AWS Global Accelerator
        correct: true
        why: Global Accelerator moves app traffic off crowded public routes onto the AWS private global network for steadier performance.
      - id: d
        text: Amazon Route 53
        why: Route 53 resolves the game's name to an address, but the traffic still crosses the same public routes afterward.
    evidence:
