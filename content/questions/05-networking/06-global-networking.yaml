  - id: q-1ep4q6
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-cloudfront
    note: m05/global-networking
    task: "3.2"
    level: 1
    stem: >-
      In the analogy of a truck fleet that parks copies of goods in local depots, what does the single main warehouse stand for in Amazon CloudFront?
    options:
      - id: a
        text: The edge location
        why: Edge locations are the local depots that hold copies, not the single main warehouse.
      - id: b
        text: The origin server
        correct: true
        why: The main warehouse is the origin server, where the original content lives before CloudFront copies it.
      - id: c
        text: The DNS resolver
        why: A DNS resolver looks up addresses and plays no part in storing the content being delivered.
      - id: d
        text: The load balancer
        why: A load balancer spreads requests across servers and is not the home of the original content.
    evidence:
      - "Analogy: a global truck fleet parks copies of your content in local depots, so requests stop trekking to the single main warehouse (your origin server)."
    takeaway: CloudFront keeps copies at edge locations so requests no longer travel all the way to the origin server.
