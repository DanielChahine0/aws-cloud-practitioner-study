    stem: >-
      The cafe's website is hosted in one Region, yet customers around the world load its menu photos and recipe videos.
      It wants copies of that content served from locations near each customer.
      Which service fits?
    options:
      - id: a
        text: Amazon CloudFront
        correct: true
        why: CloudFront is a CDN that serves copies of content from edge locations close to each customer.
      - id: b
        text: AWS Global Accelerator
        why: Global Accelerator routes traffic over the AWS network to healthy endpoints but does not keep cached copies.
      - id: c
        text: Amazon Route 53
        why: Route 53 resolves the site's name to an address but does not store or deliver the photos and videos.
      - id: d
        text: AWS CloudFormation
        why: CloudFormation builds resources from templates and has nothing to do with delivering content to visitors.
    evidence:
      - CloudFront is a CDN (content delivery network) that securely serves static and dynamic web content from edge locations near customers, for faster loads, lower cost and reliability.
    takeaway: Serving cached copies of web content from edge locations near customers is CloudFront's role as a CDN.
