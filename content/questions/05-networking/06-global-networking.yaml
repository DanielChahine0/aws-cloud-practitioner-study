  - id: q-jwsjm1
    version: 1
    status: live
    type: single
    pool: practice
    concept: domain-name-system
    note: m05/global-networking
    task: "3.5"
    level: 1
    stem: >-
      What job does DNS perform on the internet?
    options:
      - id: a
        text: It encrypts traffic between a browser and a web server
        why: Encrypting traffic in transit is the work of protocols such as HTTPS, not of name lookups.
      - id: b
        text: It spreads incoming requests across several servers
        why: Spreading requests across servers is load balancing, which happens after the address is already known.
      - id: c
        text: It looks up the IP address that matches a website
        correct: true
        why: DNS acts like a phone book, turning the names people type into the addresses computers connect to.
      - id: d
        text: It assigns private IP address ranges to the subnets
        why: Address ranges for subnets are set when a VPC is designed, not looked up through DNS.
    evidence:
      - DNS is the internet's phone book, turning names people read into IP (Internet Protocol) addresses computers use.
    takeaway: DNS works like a phone book, translating human-readable names into the IP addresses computers use.
    history: []
    verified:
      keyHash: d0435b9f5b1c
      fullHash: c37bdd57e409
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-79pgbm
    version: 1
    status: live
    type: single
    pool: practice
    concept: domain-name-system
    note: m05/global-networking
    task: "3.5"
    level: 2
    stem: >-
      A diner types the cafe's web address into a browser.
      Which component does the browser hand that name to first?
    options:
      - id: a
        text: The company's DNS server
        why: The company's DNS server answers with the address, but only after the resolver asks it.
      - id: b
        text: A domain name registrar
        why: A registrar records who owns a domain, and the browser does not ask it to look up the name.
      - id: c
        text: A customer DNS resolver
        correct: true
        why: The browser hands the name to the customer DNS resolver, which then queries the company's DNS server.
      - id: d
        text: A CloudFront edge location
        why: An edge location serves content only after the name has been resolved to an address.
    evidence:
      - "Resolution: the browser hands the name to a customer DNS resolver, which asks the company's DNS server, which replies with the IP address (192.0.2.0 for AnyCompany)."
    takeaway: In a DNS lookup the browser asks a customer DNS resolver, which queries the company's DNS server for the IP address.
