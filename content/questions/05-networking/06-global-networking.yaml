    task: "3.5"
    level: 1
    stem: >-
      Match each Route 53 routing policy to how it picks an endpoint.
    pairs:
      - left: Weighted round robin
        right: Splits traffic among endpoints by shares you set
        why: Weighted round robin hands out requests in the proportions assigned to each endpoint.
      - left: Latency-based
        right: Sends users to the endpoint with the lowest delay
        why: Latency-based routing favors the endpoint that responds fastest for that user.
      - left: Geolocation
        right: Picks the endpoint tied to the user's country
        why: Geolocation routing maps the user's location, such as a country, to a chosen Region.
    evidence:
      - "Routing policies: weighted round robin, latency-based, geolocation and geoproximity."
      - Geolocation routes by where the customer is, so North America goes to a North American Region and Ireland to the Dublin Region.
    takeaway: Route 53 policies pick endpoints by set shares, by lowest latency, or by the user's location.
