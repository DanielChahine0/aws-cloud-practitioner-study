    concept: amazon-route-53
    note: m05/global-networking
    task: "3.5"
    level: 1
    stem: >-
      Which tasks can Amazon Route 53 carry out?
    options:
      - id: a
        text: Register new domain names
        correct: true
        why: Route 53 can register fresh domains, so names and DNS records sit in the same service.
      - id: b
        text: Cache images at edge locations
        why: Caching content near users is what CloudFront does, not the DNS service.
      - id: c
        text: Run health checks on endpoints
        correct: true
        why: Route 53 checks whether endpoints are healthy so it can avoid sending users to a failed one.
      - id: d
        text: Serve videos from near viewers
        why: Serving videos from locations near viewers is CloudFront's content delivery, not DNS work.
      - id: e
        text: Give an app static IP addresses
        why: Static IP addresses for an app come from Global Accelerator, not from Route 53.
    evidence:
      - It also runs health checks, registers new domains and takes over DNS records from other registrars, so all your domains live in one place.
    takeaway: Besides answering DNS queries, Route 53 registers domains and runs health checks on endpoints.
