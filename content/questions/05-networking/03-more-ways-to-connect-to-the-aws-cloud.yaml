    stem: >-
      Which traffic rule does a NAT gateway give instances in a private subnet?
    options:
      - id: a
        text: Outside hosts can reach in, but the instances cannot reach out
        why: This reverses the rule, since a NAT gateway allows outbound starts and blocks inbound ones.
      - id: b
        text: The instances and outside hosts can both start connections
        why: Two-way starts would expose the private instances, which a NAT gateway prevents.
      - id: c
        text: The instances can reach out, but outside hosts cannot get in
        correct: true
        why: A NAT gateway lets private instances start outside connections while outsiders cannot start ones to them.
      - id: d
        text: Neither the instances nor outside hosts can start connections
        why: A NAT gateway exists to let private instances reach out, so it does not block both directions.
    evidence:
      - "**NAT gateway**: private instances can start outside connections, but outsiders cannot start ones to them."
    takeaway: A NAT gateway is one-way for starting connections, letting private instances out and keeping outsiders from getting in.
