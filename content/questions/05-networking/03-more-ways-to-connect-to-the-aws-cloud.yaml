    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 1
    stem: >-
      Which statements describe AWS PrivateLink?
    options:
      - id: a
        text: It reaches services with no public IP address.
        correct: true
        why: PrivateLink keeps the connection private, so no public IP address is needed to reach the service.
      - id: b
        text: It joins many VPCs through one central hub.
        why: A central hub for many VPCs and on-premises networks is AWS Transit Gateway, not PrivateLink.
      - id: c
        text: It lets you pick exactly which targets are reachable.
        correct: true
        why: With PrivateLink you choose exactly what is reachable, which keeps traffic protected and rules simple.
      - id: d
        text: It peers with hubs of its kind in other Regions.
        why: Inter-Region peering between hubs is a feature of AWS Transit Gateway, and PrivateLink is not a hub.
      - id: e
        text: It lets private instances call out but not be called.
        why: Letting private instances start outside connections while blocking calls in describes a NAT gateway.
    evidence:
      - It needs no public IP, NAT device, internet gateway, VPN or Direct Connect, and you pick exactly what is reachable, so traffic stays protected and rules simple.
    takeaway: PrivateLink needs no public IP and lets you choose exactly which services a VPC can reach.
