  - id: q-071q34
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-privatelink
    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 3
    stem: >-
      The cafe's ordering app runs in its VPC and must call a bakery supplier's stock service that lives in another VPC.
      The cafe wants to reach only that one service, with no public IP addresses on either side.
      Which service fits?
    options:
      - id: a
        text: AWS Transit Gateway
        why: Transit Gateway is a hub that joins whole networks, rather than exposing one chosen service privately.
      - id: b
        text: NAT gateway
        why: A NAT gateway lets private instances call out to outside hosts, which sends traffic beyond the VPC.
      - id: c
        text: AWS Direct Connect
        why: Direct Connect is a dedicated line from an on-premises network, not private access to one service in a VPC.
      - id: d
        text: AWS PrivateLink
        correct: true
        why: PrivateLink gives private access to a chosen service in another VPC as if it were local, with no public IP.
    evidence:
      - "For resources: highly available, scalable private access from a VPC to services as if they were inside it, including other VPCs, other clouds and on-premises networks."
      - It needs no public IP, NAT device, internet gateway, VPN or Direct Connect, and you pick exactly what is reachable, so traffic stays protected and rules simple.
    takeaway: Private access to one chosen service in another VPC, with no public IP, points to AWS PrivateLink.
    history: []
    verified:
      keyHash: b671b25adba1
      fullHash: 4726cd54168c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
