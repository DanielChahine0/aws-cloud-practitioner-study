    concept: aws-direct-connect
    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 3
    stem: >-
      The cafe chain is moving years of security camera video and nightly backups to AWS, and will keep some apps on premises for good.
      Its shared internet links already jam during transfers.
      Which service fits?
    options:
      - id: a
        text: AWS Site-to-Site VPN
        why: Site-to-Site VPN runs over shared links, so it does not add the bandwidth these large transfers need.
      - id: b
        text: AWS Direct Connect
        correct: true
        why: Direct Connect gives a dedicated private line with more bandwidth for huge transfers and lasting hybrid apps.
      - id: c
        text: AWS Client VPN
        why: Client VPN connects individual people, and it does not raise bandwidth for bulk data moves.
      - id: d
        text: AWS PrivateLink
        why: PrivateLink gives a VPC private access to services, not a dedicated line from the cafe's network.
    evidence:
      - Shared links can jam, so Direct Connect gives a dedicated private line from your network to a VPC (via a Direct Connect location and a virtual private gateway), cutting costs and raising bandwidth.
      - "Fits: latency-sensitive apps like video streaming (no internet hop), huge transfers (analytics, backups, broadcast media) and hybrid apps across AWS and on premises."
    takeaway: Huge transfers and lasting hybrid apps that outgrow shared links call for a dedicated Direct Connect line.
    history: []
