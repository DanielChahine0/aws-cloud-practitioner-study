questions:
  - id: q-ghgse6
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-client-vpn
    note: m05/more-ways-to-connect-to-the-aws-cloud
    task: "3.5"
    level: 3
    stem: >-
      The cafe's bookkeeper and shift planners now work from home on their own laptops.
      Each of them needs a secure way into the cafe's VPC, and the cafe wants to avoid sizing any hardware for it.
      Which service fits?
    options:
      - id: a
        text: AWS Site-to-Site VPN
        why: Site-to-Site VPN joins whole locations such as an office to the VPC, not individual people on laptops.
      - id: b
        text: AWS Client VPN
        correct: true
        why: Client VPN is the managed VPN for individual remote users, and it scales with demand with no hardware to plan.
      - id: c
        text: AWS Direct Connect
        why: Direct Connect is a dedicated line from a network to AWS, far beyond what a few home workers need.
      - id: d
        text: AWS PrivateLink
        why: PrivateLink gives a VPC private access to services, not a way for remote people to sign in to the VPC.
    evidence:
      - "For people: a fully managed, elastic VPN linking remote staff (and on-premises networks) to AWS that scales with demand."
      - It needs no hardware or user-count guessing and adds strong authentication.
    takeaway: When individual people working remotely need secure access to AWS, the answer is AWS Client VPN.
    history: []
    verified:
      keyHash: 5680dbe91f36
      fullHash: 03e20e646ecf
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
