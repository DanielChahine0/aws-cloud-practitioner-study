    stem: >-
      The cafe's payment instances sit in a private subnet and must call a card processor's API out on the internet.
      No one on the internet may start a connection to those instances.
      Which component fits?
    options:
      - id: a
        text: Amazon API Gateway
        why: API Gateway creates and publishes the cafe's own APIs, and it does not let private instances call out to the internet.
      - id: b
        text: Internet gateway
        why: An internet gateway gives two-way internet access, so outsiders could start connections to the instances.
      - id: c
        text: NAT gateway
        correct: true
        why: A NAT gateway lets private instances start outside connections while outsiders cannot start ones to them.
      - id: d
        text: AWS Site-to-Site VPN
        why: Site-to-Site VPN links a site to a VPC over encryption, and it does not give private instances a way out to the internet.
    evidence:
      - "**NAT gateway**: private instances can start outside connections, but outsiders cannot start ones to them."
    takeaway: Calling an outside API from a private subnet while staying closed to inbound starts is the job of a NAT gateway.
