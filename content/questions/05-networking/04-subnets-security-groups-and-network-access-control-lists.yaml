    pool: practice
    concept: security-groups
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 3
    stem: >-
      The cafe's web server and its reporting server sit in the same subnet.
      The web server should accept only HTTPS, while the reporting server needs a different port open.
      Which control lets the cafe set these rules separately for each server?
    options:
      - id: a
        text: A network ACL
        why: A network ACL applies to the whole subnet, so it cannot give two instances in it different rules.
      - id: b
        text: A security group
        correct: true
        why: A security group filters traffic for one instance, so each server can have its own port rules.
      - id: c
        text: An internet gateway
        why: An internet gateway links the VPC to the internet and holds no per-server port rules.
      - id: d
        text: A NAT gateway
        why: A NAT gateway lets private instances start outside connections and does not set port rules per server.
    evidence:
      - Instances in one subnet may need different rules about who may contact them and on which ports, which calls for instance-level control.
      - You open it with allow rules, such as accepting only HTTPS on a web server, with separate inbound and outbound rules, and anything not allowed stays blocked.
    takeaway: When instances in one subnet need different port rules, use security groups, which work per instance.
