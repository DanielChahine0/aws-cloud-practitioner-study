  - id: q-xspwy0
    version: 1
    status: live
    type: single
    pool: practice
    concept: network-acls
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.4"
    level: 2
    stem: >-
      The cafe creates a custom network ACL for its new payments subnet and links the two, but nobody has added any rules to it yet.
      What happens to traffic at the edge of that subnet?
    options:
      - id: a
        text: Packets in both directions are turned away
        correct: true
        why: A custom network ACL passes nothing until allow rules are added, so every packet in and out of the subnet is rejected.
      - id: b
        text: Packets in both directions are let through
        why: Letting everything through is how the default network ACL behaves, not a newly created custom one.
      - id: c
        text: Inbound packets are turned away, outbound let through
        why: Blocking inbound while passing outbound describes a new security group, not a custom network ACL with no rules.
      - id: d
        text: Inbound packets are let through, outbound turned away
        why: A custom network ACL with no rules has nothing that admits inbound packets, so they are rejected as well.
    evidence:
      - "A custom network ACL starts the other way round: nothing passes until you add allow rules."
      - Every AWS account comes with a default network ACL that lets everything through until you edit its rules.
    takeaway: A new custom network ACL blocks all traffic both ways until you add allow rules, unlike the allow-all default one.
    history: []
    verified:
      keyHash: 0a9e13bf5ddc
      fullHash: 968e8557e875
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
