        correct: true
        why: A security group is stateful, so it remembers the request and lets the matching reply back in.
    evidence:
      - "**Stateful**: it remembers an outgoing request and lets the matching reply back in whatever the inbound rules say."
      - "**Stateless**: it has no memory, so even the reply to a request that already left is checked from scratch."
    takeaway: Stateful filtering, which security groups use, lets replies to remembered requests in without an inbound rule.
