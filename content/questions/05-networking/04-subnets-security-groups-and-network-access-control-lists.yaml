  - id: q-0xxnwk
    version: 1
    status: live
    type: single
    pool: practice
    concept: packets
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      A customer's order request reaches the cafe's VPC as packets and crosses into the subnet that holds the ordering servers.
      What does the check at that crossing look at in each packet?
    options:
      - id: a
        text: The order items inside it
        why: The check never looks at what a packet carries, so the order items play no part in it.
      - id: b
        text: The sender and how it communicates
        correct: true
        why: Each packet is judged only on who sent it and how it is trying to communicate.
      - id: c
        text: The earlier request it answers
        why: The subnet check keeps no memory of earlier requests, so it judges each packet on its own.
      - id: d
        text: The encryption applied to it
        why: The check looks at whether the sender is approved, not at whether the packet was encrypted.
    evidence:
      - A packet is one unit of data on a network, and a customer's request arrives as packets through the internet gateway.
      - Each packet crossing a subnet edge, in either direction, is judged by that subnet's network ACL on who sent it and how it is trying to communicate.
      - The check looks only at whether the sender is approved, never at what the packet carries.
    takeaway: A packet crossing a subnet edge is judged on its sender and how it communicates, never on the data it carries.
    history: []
    verified:
      keyHash: e81a2a23c54a
      fullHash: 7c5732d908cd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pzhg1s
    version: 1
    status: live
    type: match
    pool: practice
    concept: packets
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      A packet travels from the cafe's order server in one subnet to its inventory server in another subnet of the same VPC.
      Match each check along the way, in order, with the control that makes it.
    pairs:
      - left: First check
        right: Security group of the sending instance
        why: The sending instance's security group is the first control, and it lets outbound traffic go by default.
      - left: Second check
        right: Network ACL of the sending subnet
        why: The sending subnet's network ACL applies its own outbound list whatever the security group decided.
      - left: Third check
        right: Network ACL of the receiving subnet
        why: The receiving subnet's network ACL checks the packet as it crosses into that subnet.
      - left: Fourth check
        right: Security group of the receiving instance
        why: The receiving instance's security group is the last check before the packet arrives.
    evidence:
      - "Outbound leg: A's security group lets it out by default, subnet 1's network ACL applies its own outbound list no matter what the security group decided, then subnet 2's network ACL and B's security group check it on the way in."
    takeaway: A packet between subnets passes the sender's security group, both network ACLs and then the receiver's security group.
    history: []
    verified:
      keyHash: 6199bc9945df
      fullHash: baf86872819c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-hwpxt3
    version: 1
    status: live
    type: single
    pool: practice
    concept: network-acls
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "2.4"
    level: 3
    stem: >-
      The cafe wants one rule that turns away traffic from a known bad address range before it enters any instance in its ordering subnet.
      The rule must explicitly deny that range for the whole subnet.
      Which control fits?
    options:
      - id: a
        text: A security group
        why: A security group works per instance and supports allow rules only, so it cannot hold a deny rule.
      - id: b
        text: An internet gateway
        why: An internet gateway connects the VPC to the internet and does not filter senders with rules.
      - id: c
        text: A network ACL
        correct: true
        why: A network ACL guards the whole subnet edge and supports deny rules as well as allow rules.
      - id: d
        text: A route table
        why: A route table decides where subnet traffic goes, not which senders are turned away.
    evidence:
      - "Picture the network ACL as the subnet's border guard: a virtual firewall judging everything that enters or leaves the whole subnet."
      - Network ACLs work at the subnet level, are stateless, and support both allow and deny rules.
    takeaway: To deny traffic for a whole subnet, use a network ACL, since security groups allow rules only and work per instance.
