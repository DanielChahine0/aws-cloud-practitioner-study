  - id: q-3jft13
    version: 1
    status: live
    type: single
    pool: practice
    concept: stateless-packet-filtering
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The network ACL on the cafe's menu subnet admits a customer's request on its inbound list.
      Nothing on its outbound list matches the reply.
      What happens to the reply?
    options:
      - id: a
        text: It leaves because the request was admitted
        why: A stateless filter keeps no memory of the request, so admission earns the reply nothing.
      - id: b
        text: It leaves because outbound traffic is open
        why: A network ACL checks outbound packets against its own list, and here nothing matches the reply.
      - id: c
        text: It is rejected by the final deny rule
        correct: true
        why: The reply is checked from scratch, and the final explicit deny rule rejects it when no rule matches.
      - id: d
        text: It is held until the security group decides
        why: The network ACL decides on its own lists, whatever the security group allows.
    evidence:
      - "**Stateless**: it has no memory, so even the reply to a request that already left is checked from scratch."
      - Its inbound and outbound lists are separate and may differ, so being admitted does not guarantee the reply can leave.
      - Each network ACL also ends in an explicit deny rule that rejects any packet no other rule matched.
    takeaway: A stateless filter checks every reply from scratch, so a reply needs its own matching rule to leave the subnet.
    history: []
    verified:
      keyHash: c2afc6f391c0
      fullHash: 8b9e79e82814
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-a7aq0a
    version: 1
    status: live
    type: single
    pool: practice
    concept: stateless-packet-filtering
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 1
    stem: >-
      Which description fits stateless packet filtering?
    options:
      - id: a
        text: Every packet is checked in both directions with no memory of earlier traffic
        correct: true
        why: Stateless filtering keeps no record, so each packet, replies included, is checked against the rules.
      - id: b
        text: Replies to allowed requests are passed without being checked against rules
        why: Letting replies through because a request was allowed is stateful filtering, not stateless.
      - id: c
        text: Only the contents of each packet are inspected against the allow list
        why: Packet filtering judges the sender and how it communicates, never what the packet carries.
      - id: d
        text: Packets are checked once on arrival and never again on the way out
        why: A stateless filter checks traffic leaving as well as arriving, each time from scratch.
    evidence:
      - "**Stateless packet filtering**: checking every packet in both directions with no memory of earlier traffic."
    takeaway: Stateless filtering, as network ACLs do, checks every packet in both directions with no memory of earlier traffic.
    history: []
