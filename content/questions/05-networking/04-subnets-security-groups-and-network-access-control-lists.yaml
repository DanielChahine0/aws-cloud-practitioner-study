  - id: q-7jxytm
    version: 1
    status: live
    type: match
    pool: practice
    concept: network-acls
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The cafe is planning the network ACL for the subnet that runs its catering orders.
      Match each catering situation with the network ACL behavior that explains it.
    pairs:
      - left: Turning away one abusive address range while other senders still get in
        right: Deny rules can sit beside allow rules
        why: A network ACL holds deny rules as well as allow rules, so one range can be refused while the rest are admitted.
      - left: A packet that none of the catering subnet's rules mention
        right: A final deny rule rejects the packet
        why: Every network ACL ends in an explicit deny rule, which rejects a packet that no earlier rule matched.
      - left: Two catering servers that each need their own port rules
        right: One rule list covers the whole subnet
        why: A network ACL judges traffic at the subnet edge, so it cannot give two servers in that subnet different rules.
      - left: The network ACL the account came with, before any edits
        right: Every packet passes in both directions
        why: The default network ACL lets all traffic in and out until the cafe changes its rules.
    evidence:
      - Network ACLs work at the subnet level, are stateless, and support both allow and deny rules.
      - Each network ACL also ends in an explicit deny rule that rejects any packet no other rule matched.
      - Every AWS account comes with a default network ACL that lets everything through until you edit its rules.
    takeaway: A network ACL sets one subnet-wide list of allow and deny rules, ends in a catch-all deny, and allows everything only in its default form.
