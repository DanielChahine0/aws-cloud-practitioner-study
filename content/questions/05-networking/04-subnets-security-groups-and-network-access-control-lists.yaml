  - id: q-aa71rs
    version: 1
    status: live
    type: single
    pool: practice
    concept: security-groups
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The cafe launches a new web server and leaves its security group exactly as it came at launch.
      The server can fetch software updates, but customers cannot load the site.
      What explains this?
    options:
      - id: a
        text: Its security group holds allow rules only
        why: True of every security group, but having only allow rules does not by itself shut customers out.
      - id: b
        text: Its security group blocks all inbound traffic
        correct: true
        why: A security group starts by blocking every inbound sender, so customers stay out until an allow rule opens a port.
      - id: c
        text: Its subnet's default network ACL lets all traffic through
        why: True, but a network ACL that passes everything cannot be what keeps customers out.
      - id: d
        text: Its security group remembers the server's outgoing requests
        why: True, and it is why the updates come back, but it does not explain why customers are refused.
    evidence:
      - Out of the box it blocks every inbound port and sender address and lets all outbound traffic go.
      - You open it with allow rules, such as accepting only HTTPS on a web server, with separate inbound and outbound rules, and anything not allowed stays blocked.
    takeaway: A new security group blocks all inbound traffic and allows all outbound, so a web server needs an allow rule before customers get in.
