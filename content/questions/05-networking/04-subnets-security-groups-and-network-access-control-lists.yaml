  - id: q-bnkz4w
    version: 1
    status: live
    type: single
    pool: practice
    concept: stateful-packet-filtering
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The cafe's ordering instance sends a request to a supplier's price service.
      Its security group has no inbound rule that matches the supplier's reply.
      What happens to the reply at the security group?
    options:
      - id: a
        text: It is let in because the request was remembered
        correct: true
        why: A stateful security group remembers the outgoing request and lets its reply in whatever the inbound rules say.
      - id: b
        text: It is blocked because no inbound rule matches
        why: That would be a stateless check, but the security group recognizes the reply to its own request.
      - id: c
        text: It is blocked until an explicit deny rule is removed
        why: Security groups support allow rules only, so there is no deny rule to remove.
      - id: d
        text: It is let in only if the packet content is approved
        why: The security group does not read packet content; it passes the reply because it saw the request.
    evidence:
      - "**Stateful**: it remembers an outgoing request and lets the matching reply back in whatever the inbound rules say."
    takeaway: A stateful security group remembers allowed requests, so their replies return without matching an inbound rule.
    history: []
    verified:
      keyHash: 7ae2372aa40b
      fullHash: 24487c923818
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-8ztmh0
    version: 1
    status: live
    type: single
    pool: practice
    concept: stateful-packet-filtering
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 1
    stem: >-
      Which term names filtering that remembers earlier decisions so that replies to allowed requests pass automatically?
    options:
      - id: a
        text: Stateless packet filtering
        why: Stateless filtering keeps no memory and checks each reply from scratch against the rules.
      - id: b
        text: Explicit deny rule
        why: An explicit deny rule rejects unmatched packets at the end of a network ACL and remembers nothing.
      - id: c
        text: Stateful packet filtering
        correct: true
        why: Stateful filtering keeps track of allowed requests and lets their replies through without a new check.
      - id: d
        text: Default network ACL
        why: The default network ACL allows all traffic until edited, and it still keeps no memory of requests.
    evidence:
      - "**Stateful packet filtering**: remembering earlier decisions so replies to allowed requests pass automatically."
    takeaway: Stateful packet filtering remembers allowed requests and passes their replies, which is how security groups work.
    history: []
    verified:
      keyHash: dab3c35e90db
      fullHash: 6bcd109720bb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
