      fullHash: 8fad444d8dd0
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-segn0a
    version: 1
    status: live
    type: single
    pool: practice
    concept: subnets
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 1
    stem: >-
      What sets a public subnet apart from a private subnet in a VPC?
    options:
      - id: a
        text: Access to the internet gateway
        correct: true
        why: Subnets exist largely to control gateway access, and only public subnets may use the internet gateway.
      - id: b
        text: A larger block of IP addresses
        why: The size of a subnet's address range does not decide whether the public can reach what it holds.
      - id: c
        text: A separate Availability Zone
        why: Public and private subnets can share an Availability Zone, so the zone does not make a subnet public.
      - id: d
        text: A security group on each instance
        why: Every instance gets a security group at launch, in a private subnet just as in a public one.
    evidence:
      - "A main reason to have subnets is to decide who gets to the gateways: public subnets can use the internet gateway, private ones cannot."
    takeaway: Public subnets can use the internet gateway and private subnets cannot, which is how subnets control who reaches the internet.
