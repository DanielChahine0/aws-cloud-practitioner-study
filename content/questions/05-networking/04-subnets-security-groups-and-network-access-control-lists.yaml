questions:
  - id: q-ezcwsp
    version: 1
    status: live
    type: single
    pool: practice
    concept: subnets
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The cafe keeps its ordering website in a public subnet and its loyalty database in a private subnet of the same VPC.
      The website must look up members' order histories in that database.
      What makes this possible?
    options:
      - id: a
        text: Rules can let one subnet talk to another
        correct: true
        why: Rules between subnets let the public website query the private database without exposing it to the internet.
      - id: b
        text: An internet gateway links the VPC to the internet
        why: The internet gateway carries traffic to and from the internet, not lookups between the cafe's own subnets.
      - id: c
        text: A subnet groups resources by security needs
        why: Grouping explains why the website and database sit apart, not how the website reaches the database.
      - id: d
        text: A private subnet cannot use the internet gateway
        why: This keeps the database off the internet, but it does not let the website reach the database.
    evidence:
      - Rules can let subnets talk to each other, for example public EC2 instances querying private databases.
    takeaway: A public subnet's instances can query a private subnet's database when rules let the two subnets talk.
    history: []
