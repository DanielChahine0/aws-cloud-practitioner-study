    concept: stateful-packet-filtering
    note: m05/subnets-security-groups-and-network-access-control-lists
    task: "3.5"
    level: 2
    stem: >-
      The cafe's ordering instance sends a request to a supplier's price service.
      Its security group has no inbound rule that matches the supplier's reply.
      What happens to the reply at the security group?
    options:
      - id: a
        text: It is let in because the request was remembered
        correct: true
        why: A stateful security group remembers the outgoing request and lets its reply in whatever the inbound rules say.
      - id: b
        text: It is blocked because no inbound rule matches
        why: That would be a stateless check, but the security group recognizes the reply to its own request.
      - id: c
        text: It is blocked until an explicit deny rule is removed
        why: Security groups support allow rules only, so there is no deny rule to remove.
      - id: d
        text: It is let in only if the packet content is approved
        why: The security group does not read packet content; it passes the reply because it saw the request.
    evidence:
      - "**Stateful**: it remembers an outgoing request and lets the matching reply back in whatever the inbound rules say."
    takeaway: A stateful security group remembers allowed requests, so their replies return without matching an inbound rule.
