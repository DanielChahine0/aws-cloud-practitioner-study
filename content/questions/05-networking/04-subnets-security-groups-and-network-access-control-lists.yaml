      The cafe wants a control that lets the file back in because it remembers the request, with no inbound rule written for it.
      Which control works this way?
    options:
      - id: a
        text: A network ACL
        why: A network ACL is stateless, so the returning file would need its own inbound rule to get in.
      - id: b
        text: A route table
        why: A route table only decides where subnet traffic goes and keeps no memory of requests.
      - id: c
        text: A NAT gateway
        why: A NAT gateway lets private instances start outside connections, but it is not the filter that remembers requests.
      - id: d
