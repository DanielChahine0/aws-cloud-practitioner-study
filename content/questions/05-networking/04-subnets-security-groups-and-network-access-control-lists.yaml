      - id: d
        text: Default network ACL
        why: The default network ACL allows all traffic until edited, and it still keeps no memory of requests.
    evidence:
      - "**Stateful packet filtering**: remembering earlier decisions so replies to allowed requests pass automatically."
    takeaway: Stateful packet filtering remembers allowed requests and passes their replies, which is how security groups work.
