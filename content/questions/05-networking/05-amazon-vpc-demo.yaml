  - id: q-93wjef
    version: 1
    status: draft
    type: single
    pool: practice
    concept: public-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe already has a route table that sends 0.0.0.0/0 traffic to the internet gateway attached to its VPC, and one subnet uses it.
      It adds a second subnet in another Availability Zone for its menu site.
      Which step gives the new subnet that same path to the internet gateway?
    options:
      - id: a
        text: Turn on the subnet's auto-assign public IPv4 setting
        why: This hands launched servers public addresses, but it adds no 0.0.0.0/0 route, so the subnet still has no path to the gateway.
      - id: b
        text: Associate the subnet with the existing route table
        correct: true
        why: The new subnet only gets the 0.0.0.0/0 route once it is explicitly associated with the table that holds it.
      - id: c
        text: Give the subnet a range inside the VPC's CIDR block
        why: Every subnet needs a range from the VPC's block, but an address range carries no route to the internet gateway.
      - id: d
        text: Spread the menu servers across both of the subnets
        why: Using two AZs keeps the site reachable during an outage, but it does not route the new subnet's traffic to the gateway.
    evidence:
      - On the Subnet associations tab, explicitly associate both public subnets with this table.
      - A subnet only becomes public when its associated route table sends 0.0.0.0/0 traffic to an attached internet gateway.
    takeaway: Each public subnet must be explicitly associated with the route table that sends 0.0.0.0/0 to the internet gateway.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: Option 1 repeats the stem's words 'route table' and 'existing', which points at the key."
  - id: q-8nm6qc
    version: 1
    status: draft
    type: single
    pool: practice
    concept: public-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      A new staff member creates a subnet for the cafe's menu site and names it public-menu.
      The VPC has an attached internet gateway, and the subnet's route table holds only the local route.
      Customers on the web cannot reach the servers launched there. What explains this?
    options:
      - id: a
        text: The subnet sits in a single Availability Zone
        why: Every subnet lives in one AZ, public ones included, so its zone does not cut it off from the web.
      - id: b
        text: The internet gateway serves the whole VPC
        why: That is true of every attached gateway, and the public subnets of the same VPC still reach the web through it.
      - id: c
        text: The subnet's route table has no route to the gateway
        correct: true
        why: A subnet becomes public only when its route table sends 0.0.0.0/0 to the attached gateway, whatever the subnet is called.
      - id: d
        text: The subnet's range sits inside the VPC's range
        why: Every subnet takes its range from the VPC's block, public ones included, so this does not block web traffic.
    evidence:
      - Naming a subnet "public" does not make it public, because it still needs an attached internet gateway and a route to it.
      - Attaching alone does not yet tell instances how to reach the internet.
    takeaway: A subnet's name does not make it public; it needs a route to an attached internet gateway.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 1 is the only fact that decides whether a subnet is private; the others are true of every subnet.)"
  - id: q-kndvw3
    version: 1
    status: draft
    type: single
    pool: practice
    concept: private-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe's VPC is open to the web for its menu site, and its order database sits in a private subnet of that same VPC.
      What keeps the database's subnet cut off from the internet?
    options:
      - id: a
        text: Its route table has no 0.0.0.0/0 route
        correct: true
        why: Without a route that sends outside traffic to the internet gateway, the private subnet has no path to the internet.
      - id: b
        text: Its CIDR block is a slice of the VPC's range
        why: Every subnet takes a slice of the VPC's range, including the public subnets that do reach the internet.
      - id: c
        text: It sits in a single Availability Zone
        why: The public subnets each sit in one Availability Zone too, so the zone does not decide whether the internet is reachable.
      - id: d
        text: Its name tag labels it as a private subnet
        why: A subnet's name tag is only a label and has no effect on where its traffic can go.
    evidence:
      - The public subnets now reach the internet through the gateway, while the private subnets lack that route and stay private.
    takeaway: A private subnet stays private because its route table has no 0.0.0.0/0 route to the internet gateway.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 2, no 0.0.0.0/0 route, is what makes a subnet private; the others hold for any subnet.)"
