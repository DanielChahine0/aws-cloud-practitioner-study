    stem: >-
      The cafe's admin wants to change where traffic leaving its private subnets is sent.
      Which part of the VPC holds the rules the admin should edit?
    options:
      - id: a
        text: The network ACL on the subnets
        why: A network ACL filters which traffic may enter or leave a subnet, but it does not decide where that traffic goes.
      - id: b
        text: The route table for the subnets
        correct: true
        why: A route table holds the routes that decide where the traffic of its associated subnets is sent.
      - id: c
        text: The servers' security groups
        why: Security groups filter traffic to and from each server, and they hold no rules about where traffic is sent.
      - id: d
        text: The VPC's internet gateway
        why: An internet gateway is a doorway to the internet that routes can point at, and it holds no routing rules itself.
    evidence:
