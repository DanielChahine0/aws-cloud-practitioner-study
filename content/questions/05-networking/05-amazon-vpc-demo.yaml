    concept: private-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe places its two private subnets for the order database in two different Availability Zones.
      What does this placement give the database servers?
    options:
      - id: a
        text: They stay reachable if one location goes down
        correct: true
        why: Spreading subnets over two AZs is a high availability practice, so one AZ failing does not take everything down.
      - id: b
        text: Their auto-assign public IP setting stays turned off
        why: Private subnets keep this setting off wherever they sit, so it is not something the two-AZ placement adds.
      - id: c
        text: They have no route out to the internet gateway
        why: Private subnets lack that route in any single AZ too, so the placement is not what keeps them off the internet.
      - id: d
        text: Each subnet still has to be associated with a single route table
        why: Every subnet needs a route table association no matter where it sits, so this is not a benefit of the placement.
    evidence:
      - Placing subnets in two AZs is a best practice for high availability, keeping instances reachable if one AZ suffers an outage.
    takeaway: Putting private subnets in two AZs keeps their resources reachable when one AZ fails.
