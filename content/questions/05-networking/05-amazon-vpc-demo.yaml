  - id: q-tg3f55
    version: 1
    status: live
    type: match
    pool: practice
    concept: route-tables
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 1
    stem: >-
      Match each part of the cafe's public route table setup to what it does.
    pairs:
      - left: Route table
        right: Holds the set of rules that decide where traffic is sent
        why: A route table is a collection of routes that directs the traffic of the subnets tied to it.
      - left: Local route
        right: Keeps traffic flowing between resources inside the VPC
        why: Every new route table starts with this one route so resources in the VPC can talk to each other.
      - left: 0.0.0.0/0 route
        right: Directs internet-bound traffic out through the attached gateway
        why: This route points all non-local traffic at the internet gateway, which is what makes a subnet public.
      - left: Subnet association
        right: Picks which network segments of the VPC follow those rules
        why: Associating the public subnets with the table is what applies its routes to them.
    evidence:
      - A route table holds rules, called routes, that decide where network traffic is sent, and every subnet must be associated with one.
      - Its Routes tab starts with a single local route that keeps traffic inside the VPC.
      - Choose Edit routes, then Add route, with destination 0.0.0.0/0 and the internet gateway as target.
    takeaway: A route table holds routes, starts with a local route, and only applies to the subnets associated with it.
    history: []
