    concept: public-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe launches its menu web servers into a subnet whose route table already sends 0.0.0.0/0 traffic to the internet gateway.
      It wants every new server there to come up with an internet-facing address, with no manual step.
      Which part of the subnet's configuration should the cafe change?
    options:
      - id: a
        text: Its auto-assign public IPv4 setting
        correct: true
        why: Turning this on gives every resource launched in the subnet its own public IPv4 address.
      - id: b
        text: Its explicit route table association
        why: The subnet already routes to the gateway, and an association applies routes without handing out any addresses.
      - id: c
        text: Its custom network ACL's inbound rules
        why: A network ACL filters traffic in and out of the subnet; it does not give servers public addresses.
      - id: d
        text: Its IPv4 CIDR range within the VPC
        why: The range sets which private addresses servers get and leaves them without public ones.
    evidence:
      - In the same settings, auto-assign public IPv4 address is switched on for public subnets so their resources receive public addresses.
      - Auto-assign public IPv4 belongs on public subnets only.
    takeaway: Public subnets turn on auto-assign public IPv4 so the resources launched there get public addresses.
