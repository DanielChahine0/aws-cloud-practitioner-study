        text: Move it into the first subnet's Availability Zone
        why: The zone a subnet sits in does not decide whether it is public; the missing piece is the route to the gateway.
      - id: d
        text: Give it a larger CIDR block in the VPC range
        why: A bigger address block holds more servers but gives none of them a path to the internet gateway.
    evidence:
      - Naming a subnet "public" does not make it public, because it still needs an attached internet gateway and a route to it.
      - On the Subnet associations tab, explicitly associate both public subnets with this table.
      - A subnet only becomes public when its associated route table sends 0.0.0.0/0 traffic to an attached internet gateway.
    takeaway: A subnet's name and public addresses do not make it public; associating it with a route to the internet gateway does.
