      The cafe already has a route table that sends 0.0.0.0/0 traffic to the internet gateway attached to its VPC, and one subnet uses it.
      It adds a second subnet in another Availability Zone for its menu site.
      Which step gives the new subnet that same path to the internet gateway?
    options:
      - id: a
        text: Turn on the subnet's auto-assign public IPv4 setting
        why: This hands launched servers public addresses, but it adds no 0.0.0.0/0 route, so the subnet still has no path to the gateway.
      - id: b
        text: Associate the subnet with the existing route table
        correct: true
        why: The new subnet only gets the 0.0.0.0/0 route once it is explicitly associated with the table that holds it.
      - id: c
        text: Give the subnet a range inside the VPC's CIDR block
        why: Every subnet needs a range from the VPC's block, but an address range carries no route to the internet gateway.
      - id: d
        text: Spread the menu servers across both of the subnets
        why: Using two AZs keeps the site reachable during an outage, but it does not route the new subnet's traffic to the gateway.
    evidence:
      - On the Subnet associations tab, explicitly associate both public subnets with this table.
      - A subnet only becomes public when its associated route table sends 0.0.0.0/0 traffic to an attached internet gateway.
    takeaway: Each public subnet must be explicitly associated with the route table that sends 0.0.0.0/0 to the internet gateway.
