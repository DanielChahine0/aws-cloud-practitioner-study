  - id: q-5n7f3k
    version: 1
    status: live
    type: single
    pool: practice
    concept: cidr-blocks
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      After building its VPC, the cafe moves on to security groups that say where traffic to its order servers may come from.
      Which kind of value from the VPC setup do those rules reuse to describe the allowed sources?
    options:
      - id: a
        text: Availability Zone names
        why: Zone names say where subnets are placed and do not describe which addresses traffic may come from.
      - id: b
        text: Route table targets
        why: A target such as the internet gateway says where routed traffic goes, not which sources a security group admits.
      - id: c
        text: CIDR address ranges
        correct: true
        why: Security groups reuse CIDR notation, the same form used for the VPC's block, to say where traffic may come from or go to.
      - id: d
        text: Subnet name tags
        why: A name tag only labels a subnet and carries no address range that a traffic rule could match.
    evidence:
      - Next comes traffic filtering through security groups and network ACLs, and security groups reuse CIDR notation to define where traffic may come from or go to.
    takeaway: CIDR notation sets a VPC's address pool and is reused by security groups to say where traffic may come from or go to.
    history: []
