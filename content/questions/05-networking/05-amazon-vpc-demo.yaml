questions:
  - id: q-n0p73n
    version: 1
    status: live
    type: single
    pool: practice
    concept: cidr-blocks
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 1
    stem: >-
      When you create a VPC in the console, which value you enter sets the pool of private IP addresses its resources can be given?
    options:
      - id: a
        text: Its CIDR block
        correct: true
        why: The CIDR block is the address range that decides which private IP addresses resources in the VPC can receive.
      - id: b
        text: Its Region
        why: The Region is also chosen at creation, but it sets where the VPC lives, not which addresses it hands out.
      - id: c
        text: Its name tag
        why: A name tag such as My VPC only labels the VPC and has no effect on the addresses inside it.
      - id: d
        text: Its tenancy setting
        why: Tenancy decides whether instances run on shared or dedicated hardware, not which private addresses they get.
    evidence:
      - Enter a CIDR (classless inter-domain routing) range, also called a CIDR block, which sets the pool of private IP addresses resources in the VPC can be given.
      - This is also when you settle on the Region best placed for your resources.
    takeaway: A VPC's CIDR block defines the range of private IP addresses its resources can be assigned.
    history: []
    verified:
      keyHash: 035cf7ed9ec4
      fullHash: e9f978810230
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-mjg84m
    version: 1
    status: live
    type: single
    pool: practice
    concept: cidr-blocks
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe builds a VPC for its ordering system, and every order server in it receives its own private IP address.
      Which part of the setup decides the pool those private addresses come from?
    options:
      - id: a
        text: The CIDR block entered for the VPC
        correct: true
        why: The VPC's CIDR block sets the pool of private addresses its resources can be given, so it decides what each server gets.
      - id: b
        text: The subnets' auto-assign public IPv4 setting
        why: This setting decides whether resources also get public addresses; it does not shape their private ones.
      - id: c
        text: The local route in the VPC's route table
        why: The local route lets resources inside the VPC reach each other but hands out no addresses.
      - id: d
        text: The internet gateway attached to the VPC
        why: The gateway gives the VPC a path to the internet and plays no part in choosing private addresses.
    evidence:
      - Enter a CIDR (classless inter-domain routing) range, also called a CIDR block, which sets the pool of private IP addresses resources in the VPC can be given.
      - The demo uses the IPv4 range 10.0.0.0/16, so every resource gets a unique private address beginning with 10.0.
    takeaway: Every resource in a VPC gets its own private address from inside the VPC's CIDR block.
    history: []
    verified:
      keyHash: 2ab97b5c9555
      fullHash: 745ca2235291
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-947fcx
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: public-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 1
    stem: >-
      Which conditions together turn a subnet into a public subnet?
    options:
      - id: a
        text: An internet gateway is attached to the subnet's VPC
        correct: true
        why: Without an attached internet gateway the VPC has no path to the internet at all.
      - id: b
        text: Its route table sends 0.0.0.0/0 traffic to that gateway
        correct: true
        why: That route is what sends the subnet's internet-bound traffic out through the gateway.
      - id: c
        text: Its route table keeps the local route for 10.0.0.0/16
        why: Every route table starts with the local route, which only keeps traffic inside the VPC, so private subnets have it too.
      - id: d
        text: Its CIDR block sits inside the VPC's own address range
        why: Every subnet's range sits inside the VPC's range, private ones included, so this makes nothing public.
      - id: e
        text: Its auto-assign public IPv4 setting is turned on
        why: The setting hands out public addresses, but without a route to an attached gateway the subnet still cannot reach the internet.
    evidence:
      - Naming a subnet "public" does not make it public, because it still needs an attached internet gateway and a route to it.
      - A subnet only becomes public when its associated route table sends 0.0.0.0/0 traffic to an attached internet gateway.
    takeaway: A subnet is public only when an attached internet gateway exists and its route table sends 0.0.0.0/0 there.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 5 says 'that gateway', which points back to option 3 and ties the pair together.)"
  - id: q-hdypgs
    version: 1
    status: draft
    type: single
    pool: practice
    concept: public-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe launches its menu web servers into a public subnet.
      It wants every new server to come up with an internet-facing address, with no manual step.
      What should be switched on for that subnet?
    options:
      - id: a
        text: Its auto-assign public IPv4 setting
        correct: true
        why: Turning this on gives every resource launched in the public subnet its own public IPv4 address.
      - id: b
        text: The local route in the subnet's route table
        why: The local route only carries traffic inside the VPC and hands out no addresses.
      - id: c
        text: A custom network ACL on the subnet
        why: A network ACL filters traffic in and out of the subnet; it does not give servers public addresses.
      - id: d
        text: A larger CIDR range for the subnet
        why: A bigger range adds more private addresses but leaves the servers without public ones.
    evidence:
      - In the same settings, auto-assign public IPv4 address is switched on for public subnets so their resources receive public addresses.
      - Auto-assign public IPv4 belongs on public subnets only.
    takeaway: Public subnets turn on auto-assign public IPv4 so the resources launched there get public addresses.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: The stem asks what to 'switch on', which fits only option 3, a 'setting'; options 2 and 4 cannot be switched on."
  - id: q-gea5ar
    version: 1
    status: live
    type: single
    pool: practice
    concept: private-subnets
    note: m05/amazon-vpc-demo
    task: "3.5"
    level: 2
    stem: >-
      The cafe's customer database must sit in a private subnet that the internet cannot reach.
      How should that subnet be set up?
    options:
      - id: a
        text: Keep auto-assign public IP off and leave out a route to the internet gateway
        correct: true
        why: With no public addresses and no route to the gateway, the database has no path to or from the internet.
      - id: b
        text: Turn auto-assign public IP on and leave out a route to the internet gateway
        why: Switching the setting on hands every resource a public address, which a private subnet avoids.
      - id: c
        text: Keep auto-assign public IP off and add a route to the internet gateway
        why: A route to the gateway is what gives a subnet its path to the internet, so the database would no longer be private.
      - id: d
        text: Turn auto-assign public IP on and add a route to the internet gateway
        why: Both choices together build a public subnet, the opposite of what the database needs.
    evidence:
      - Under Actions, Edit subnet settings, auto-assign public IP stays off for private subnets, since turning it on would hand every resource there a public IP.
      - The public subnets now reach the internet through the gateway, while the private subnets lack that route and stay private.
    takeaway: A private subnet keeps auto-assign public IP off and has no route to the internet gateway.
    history: []
    verified:
      keyHash: 4bdcc98e781a
      fullHash: 1fd3361d5651
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
