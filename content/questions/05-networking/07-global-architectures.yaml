questions:
  - id: q-k5ncm7
    version: 1
    status: live
    type: single
    pool: practice
    concept: direct-connect-failover
    note: m05/global-architectures
    task: "3.5"
    level: 2
    stem: >-
      The cafe's roasting plant sends its order data to a VPC over a single AWS Direct Connect line.
      The owners worry that a road crew could cut that cable one day.
      What can stand by so the plant still reaches the VPC if the line goes down?
    options:
      - id: a
        text: AWS Site-to-Site VPN
        correct: true
        why: An encrypted VPN tunnel from the plant to the VPC can carry the traffic while the cut Direct Connect line is repaired.
      - id: b
        text: AWS Transit Gateway
        why: A transit gateway is a hub joining networks, but it is not itself a second path from the plant if the only line is cut.
      - id: c
        text: AWS Global Accelerator
        why: Global Accelerator speeds application traffic for users to endpoints, not a backup link from the plant's data center.
      - id: d
        text: A NAT gateway
        why: A NAT gateway lets private instances start outbound connections, so it gives the plant no path into the VPC.
    evidence:
      - Direct Connect is a physical cable that can be cut, so a VPN often stands by as its failover, or a second Direct Connect line does.
    takeaway: A VPN connection, or a second Direct Connect line, can take over when the primary Direct Connect cable fails.
    history: []
    verified:
      keyHash: 44ee02f44f23
