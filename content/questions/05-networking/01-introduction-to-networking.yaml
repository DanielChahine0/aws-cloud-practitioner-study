  - id: q-k063nx
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-vpc
    note: m05/introduction-to-networking
    task: "3.5"
    level: 2
    stem: >-
      The cafe's owner worries that resources run by other AWS customers could reach the cafe's ordering system.
      Which trait of Amazon VPC answers that worry?
    options:
      - id: a
        text: It sits inside a single AWS Region that you pick.
        why: Picking a Region sets where the VPC lives, but other customers also run resources in that same Region.
      - id: b
        text: It is a logically isolated part of the AWS Cloud.
        correct: true
        why: A VPC is logically isolated from the rest of the AWS Cloud, which keeps other customers' resources away from the ordering system.
      - id: c
        text: It is split into subnets that are IP address ranges.
        why: Subnets organize resources inside the VPC, but splitting the VPC is not what keeps other customers out.
      - id: d
        text: It can hold subnets in more than one Availability Zone.
        why: Spreading across Availability Zones protects against a failed location, not against other customers' resources.
    evidence:
      - Amazon VPC gives you a logically isolated part of the AWS Cloud with a virtual network you design.
      - A VPC is your own logically isolated network in the AWS Cloud.
    takeaway: Amazon VPC keeps your resources apart from other customers because it is a logically isolated part of the AWS Cloud.
    history: []
