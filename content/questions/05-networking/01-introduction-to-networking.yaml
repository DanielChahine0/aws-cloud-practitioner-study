questions:
  - id: q-vs17ax
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-networking
    note: m05/introduction-to-networking
    task: "3.5"
    level: 1
    stem: >-
      Once the cafe moves its apps to AWS, what does the term networking cover there?
    options:
      - id: a
        text: The users and permissions that control who can sign in
        why: Deciding who can sign in is identity and access work, not the infrastructure that hosts and links workloads.
      - id: b
        text: The infrastructure and services that host your workloads
        correct: true
        why: In AWS, networking means the infrastructure and services hosting the cafe's workloads so they can share data.
      - id: c
        text: The disks and buckets that keep your files for later reads
        why: Keeping files for later reads is storage, a separate idea from the infrastructure that links and hosts workloads.
      - id: d
        text: The bills and budgets that track what each team spends
        why: Tracking spend by team is billing work and says nothing about how the cafe's workloads are hosted or linked.
    evidence:
      - Networking links devices to share data and resources, and in AWS it means the infrastructure and services hosting your workloads.
    takeaway: In AWS, networking means the infrastructure and services that host your workloads and let them share data.
    history: []
    verified:
