  - id: q-37ctkm
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-networking
    note: m05/introduction-to-networking
    task: "3.5"
    level: 2
    stem: >-
      The cafe links its tills, its kitchen screens and the office computer so they can pass order data to each other and share one printer.
      Which idea describes this linking?
    options:
      - id: a
        text: Storage
        why: Storage keeps data for later reads, while the cafe here is linking devices so they can exchange data and a printer.
      - id: b
        text: Compute
        why: Compute is the processing power that runs code, not the links that let the tills and screens share data.
      - id: c
        text: Networking
        correct: true
        why: Networking links devices so they can share data and resources, just as the tills, screens and printer do here.
      - id: d
        text: Analytics
        why: Analytics draws insight from data after it is gathered, and it does not connect the cafe's devices to each other.
    evidence:
      - Networking links devices to share data and resources, and in AWS it means the infrastructure and services hosting your workloads.
      - "**Networking**: devices linked to exchange data and resources."
    takeaway: Networking is linking devices so they can exchange data and share resources, such as tills sharing orders and a printer.
    history: []
    verified:
