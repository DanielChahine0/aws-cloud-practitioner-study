    concept: internet-gateway
    note: m05/organizing-aws-cloud-resources
    task: "3.5"
    level: 2
    stem: >-
      The cafe's menu servers in its VPC must take requests from customers on the web and send the answers back to them.
      The cafe wants the piece that carries this traffic to be managed for it and to grow with visits on its own.
      Which component fits?
    options:
      - id: a
        text: A NAT gateway
        why: A NAT gateway lets instances start connections outward, but it turns away the requests that customers start from the web.
      - id: b
        text: A virtual private gateway
        why: A virtual private gateway admits traffic only from an approved company network, so web customers could not reach the menu servers.
      - id: c
        text: An internet gateway
        correct: true
        why: An internet gateway is a managed, highly available part of the VPC that scales out by itself and carries web traffic in both directions.
      - id: d
        text: AWS Direct Connect
        why: Direct Connect is a dedicated line from the cafe's own data center, not a path for customers browsing from the public web.
    evidence:
      - The assessment adds that it is a managed, highly available VPC part that scales horizontally and carries traffic both ways.
      - An internet gateway joins a VPC to the internet, and you must attach one before public traffic can flow in or out.
    takeaway: An internet gateway is a managed, horizontally scaling VPC component that carries internet traffic both in and out.
