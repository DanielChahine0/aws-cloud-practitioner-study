  - id: q-yf0jze
    version: 1
    status: live
    type: single
    pool: practice
    concept: virtual-private-gateway
    note: m05/organizing-aws-cloud-resources
    task: "3.5"
    level: 2
    stem: >-
      Picture the cafe moved into a corporate office tower, where visitors must badge in at the lobby before they can buy coffee.
      If the tower is a VPC that admits traffic only from the chain's approved company network, which component plays the lobby badge check?
    options:
      - id: a
        text: An internet gateway
        why: An internet gateway is an open front door for anyone on the internet, so it checks no badges at all.
      - id: b
        text: A NAT gateway
        why: A NAT gateway lets instances inside reach out to the internet, and it does not decide who may come in.
      - id: c
        text: A public subnet
        why: A public subnet is an area of the VPC that faces the internet, not the entry that checks who may come in.
      - id: d
        text: A virtual private gateway
        correct: true
        why: A virtual private gateway admits traffic only from an approved network, like a lobby that lets in only badge holders.
    evidence:
      - "Coffee shop: the shop now sits inside a corporate office building, and you must badge in before buying coffee."
      - A VPC with only private resources skips the internet gateway and uses a virtual private gateway, which admits traffic only from an approved network.
    takeaway: A virtual private gateway works like a lobby badge check, letting only an approved network into a private-only VPC.
