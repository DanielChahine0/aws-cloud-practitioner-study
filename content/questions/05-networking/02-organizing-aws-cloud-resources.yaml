  - id: q-e6zj28
    version: 1
    status: live
    type: single
    pool: practice
    concept: vpn
    note: m05/organizing-aws-cloud-resources
    task: "3.5"
    level: 2
    stem: >-
      The cafe links its head office to a private VPC with a VPN that enters through a virtual private gateway.
      The owner asks what the VPN itself adds to keep the supplier invoices safe on the way.
      Which answer fits?
    options:
      - id: a
        text: It shares its network with other users' traffic.
        why: Sharing a network with others is a trade-off of a VPN, and it adds nothing to keeping the invoices safe.
      - id: b
        text: It travels over the public internet to the VPC.
        why: Crossing the public internet is the route the VPN takes, not the protection it adds to the invoices.
      - id: c
        text: It encrypts the traffic against interception.
        correct: true
        why: The VPN encrypts the traffic so no one along the way can intercept or read the invoices.
      - id: d
        text: It lands in the VPC at the virtual private gateway.
        why: The virtual private gateway is the entry point on the AWS side, so landing there is not what the VPN adds.
    evidence:
      - "**VPN**: encrypts traffic against interception or monitoring."
      - The internet is like the public road to the coffee shop, and a VPN is an encrypted tunnel along it that hides your traffic from ISPs and snoopers.
    takeaway: Of the pair, the virtual private gateway admits the traffic and the VPN is what encrypts it against interception.
