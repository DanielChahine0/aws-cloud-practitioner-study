    concept: aws-amplify
    note: m13/aws-specialized-services
    task: "3.8"
    level: 3
    stem: >-
      A small team at the cafe wants to build a mobile ordering app with both a frontend and a backend, adding sign-in, APIs, storage and hosting with little infrastructure work.
      Which service fits best?
    options:
      - id: a
        text: AWS Amplify
        correct: true
        why: Amplify speeds up full-stack web and mobile apps and adds sign-in, APIs, storage and hosting with little setup.
      - id: b
        text: AWS AppSync
        why: AppSync builds a GraphQL data API, which covers only one piece of the app the team needs.
      - id: c
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk deploys a web app onto managed capacity, but it does not add mobile sign-in, storage and hosting as a toolkit.
      - id: d
        text: AWS CodePipeline
        why: CodePipeline automates releases of code changes, but it does not give the app sign-in, storage or hosting.
    evidence:
      - "**AWS Amplify**: speeds up building, deploying and running secure, scalable full-stack (frontend plus backend) web and mobile apps, adding sign-in, APIs, storage and hosting with little infrastructure work."
    takeaway: A full-stack web or mobile app that needs sign-in, APIs, storage and hosting with little setup points to AWS Amplify.
