  - id: q-r1a2ty
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-x-ray
    note: m13/aws-specialized-services
    task: "3.8"
    level: 2
    stem: >-
      Checkout in the cafe's online ordering app has become slow, and the developers cannot tell which backend call causes the delay.
      Which service helps them trace requests and find the bottleneck?
    options:
      - id: a
        text: AWS CloudTrail
        why: CloudTrail records who made which API calls in the account, which audits activity but does not trace slow app requests.
      - id: b
        text: AWS X-Ray
        correct: true
        why: X-Ray traces each request through the app, so the developers can see which call is the bottleneck.
      - id: c
        text: AWS CodePipeline
        why: CodePipeline ships code changes through release stages, so it cannot show where a running request slows down.
      - id: d
        text: AWS CodeBuild
        why: CodeBuild compiles and tests code before release, not requests while the app is serving customers.
    evidence:
      - "**AWS X-Ray**: monitors and traces requests so developers can visualize app behavior, find bottlenecks, debug faster and tune efficiency and reliability."
    takeaway: When developers must see where requests slow down inside an app, AWS X-Ray traces them to the bottleneck.
    history: []
    verified:
      keyHash: aaae09bb5094
      fullHash: 450550d49572
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
