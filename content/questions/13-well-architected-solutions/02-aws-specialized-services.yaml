    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-codepipeline
    note: m13/aws-specialized-services
    task: "3.8"
    level: 1
    stem: >-
      Which job does AWS CodePipeline handle?
    options:
      - id: a
        text: Tracing requests to find the slow calls in an app
        why: Following requests to spot slow calls is what X-Ray does, not a release pipeline.
      - id: b
        text: Joining many data sources behind one GraphQL API
        why: Merging data sources into one GraphQL API is the job of AppSync, not CodePipeline.
      - id: c
        text: Adding sign-in, storage and hosting to a web app
        why: Giving a web or mobile app sign-in, storage and hosting is the Amplify toolkit, not release automation.
      - id: d
        text: Moving each commit through build, test and deploy
        correct: true
        why: CodePipeline is managed CI/CD that takes each change through build, test and deploy stages automatically.
    evidence:
      - "**AWS CodePipeline**: managed CI/CD that spots repository changes and runs build, test and deploy stages, shipping fixes reliably with no servers to provision."
      - CI/CD (continuous integration and continuous delivery) builds, tests and ships each committed change automatically for fast, dependable releases.
    takeaway: CodePipeline is managed CI/CD, automating how each code change is built, tested and deployed.
