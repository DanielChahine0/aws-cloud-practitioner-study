  - id: q-ghxqsw
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-codepipeline
    note: m13/aws-specialized-services
    task: "3.8"
    level: 3
    stem: >-
      The cafe's developers want every commit to the loyalty app repository to move through build, test and deploy stages on its own, with no servers to set up.
      Which service runs that whole release flow?
    options:
      - id: a
        text: AWS CodeBuild
        why: CodeBuild compiles and tests code, but it covers only the build step, not the full release through deployment.
      - id: b
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk runs a web app on managed capacity, but it does not watch the repository and chain release stages.
      - id: c
        text: AWS CodePipeline
        correct: true
        why: CodePipeline notices each repository change and carries it through the build, test and deploy stages without servers.
      - id: d
        text: AWS X-Ray
        why: X-Ray traces requests in a running app, so it helps debugging rather than shipping each commit.
    evidence:
      - "**AWS CodePipeline**: managed CI/CD that spots repository changes and runs build, test and deploy stages, shipping fixes reliably with no servers to provision."
      - CodeBuild does CI builds and CodePipeline the whole release, but only X-Ray visualizes and debugs app behavior.
    takeaway: CodeBuild handles only the build step, while CodePipeline automates the whole release from commit to deploy.
    history: []
    verified:
      keyHash: d4f1b279a005
      fullHash: a13b573a0e3e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
