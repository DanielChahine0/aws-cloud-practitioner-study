    stem: >-
      Office staff at the cafe need one desktop accounting app on their modest laptops.
      They want to open just that app in a browser with nothing installed, rather than a full desktop.
      Which service fits?
    options:
      - id: a
        text: Amazon WorkSpaces
        why: WorkSpaces gives each person a complete persistent desktop, which is more than one streamed app.
      - id: b
        text: Amazon WorkSpaces Secure Browser
        why: Secure Browser suits web-only work, but the staff need a desktop app rather than websites.
      - id: c
        text: Amazon AppStream 2.0
        correct: true
        why: AppStream 2.0 streams a desktop app to a browser on any device, so nothing is installed and modest hardware is enough.
      - id: d
        text: Amazon EC2
        why: EC2 gives raw virtual servers the cafe would have to set up and manage, not one app streamed to staff browsers.
    evidence:
      - "**Amazon AppStream 2.0**: streams desktop and SaaS apps (even desktop apps made SaaS with no code changes) to a browser on any device, so nothing is installed and modest hardware suffices."
      - WorkSpaces gives a full desktop, AppStream 2.0 streams apps (the course's pick for staff SaaS access) and Secure Browser suits web-only work.
    takeaway: Streaming a single desktop app to a browser with nothing installed points to AppStream 2.0, not a full WorkSpaces desktop.
