    concept: aws-iot-core
    note: m13/aws-specialized-services
    task: "3.8"
    level: 2
    stem: >-
      The cafe fits its refrigerators with temperature sensors that send readings online so staff can watch them and change settings remotely.
      Which service securely links these devices to the cafe's cloud apps?
    options:
      - id: a
        text: Amazon Kinesis Data Streams
        why: Kinesis Data Streams carries streaming data, but it does not authenticate devices or manage them remotely.
      - id: b
        text: Amazon SNS
        why: SNS pushes notifications to subscribers, not a secure link for sensor devices to report and take commands.
      - id: c
        text: AWS IoT Core
        correct: true
        why: IoT Core securely connects devices to cloud apps, with mutual authentication and encryption, and acts on their data.
      - id: d
        text: AWS Lambda
        why: Lambda runs code in response to events, but it is not the service that connects and secures the sensors.
    evidence:
      - "**AWS IoT Core**: managed service that securely links devices to cloud apps and simplifies ingesting, processing and acting on their data, using mutual authentication, end-to-end encryption and a choice of protocols."
    takeaway: Sensor devices that report data and take commands remotely connect to the cloud securely through AWS IoT Core.
    history: []
    verified:
      keyHash: 2f5b8b04a5a4
      fullHash: 601d8e2e3e6d
