      - id: b
        text: Amazon SES
        why: SES sends email from applications, so it cannot take phone calls or route them to staff.
      - id: c
        text: Amazon SNS
        why: SNS pushes notifications to subscribers, which does not handle live calls and chats with routing.
      - id: d
        text: Amazon Connect
        correct: true
        why: Connect is a cloud contact center for calls and chats, with routing, recording and analytics built in.
    evidence:
      - "**Amazon Connect**: AI-powered cloud contact center for calls and chats, with call routing, recording, analytics and AWS integrations."
      - Calls, routing and analytics mean Amazon Connect; SES is email only and WorkSpaces is a desktop.
    takeaway: Customer calls and chats that need routing, recording and analytics point to Amazon Connect.
