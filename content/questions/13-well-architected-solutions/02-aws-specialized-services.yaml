        why: Compiling, testing and packaging code is CodeBuild's managed CI, not Amplify's app toolkit.
      - id: d
        text: It traces requests so developers can find slow backend calls
        why: Tracing requests to find bottlenecks is X-Ray, which watches a running app rather than building one.
    evidence:
      - AppSync just builds GraphQL data APIs, whereas Amplify is the broad full-stack web and mobile toolkit.
      - "**AWS Amplify**: Full-stack web and mobile app toolkit."
    takeaway: AWS Amplify is the broad full-stack web and mobile toolkit, while AppSync only builds GraphQL data APIs.
