questions:
  - id: q-ghxqsw
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-codepipeline
    note: m13/aws-specialized-services
    task: "3.8"
    level: 3
    stem: >-
      The cafe's developers want every commit to the loyalty app repository to move through build, test and deploy stages on its own, with no servers to set up.
      Which service runs that whole release flow?
    options:
      - id: a
        text: AWS CodeBuild
        why: CodeBuild compiles and tests code, but it covers only the build step, not the full release through deployment.
      - id: b
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk runs a web app on managed capacity, but it does not watch the repository and chain release stages.
      - id: c
        text: AWS CodePipeline
        correct: true
        why: CodePipeline notices each repository change and carries it through the build, test and deploy stages without servers.
      - id: d
        text: AWS X-Ray
        why: X-Ray traces requests in a running app, so it helps debugging rather than shipping each commit.
    evidence:
      - "**AWS CodePipeline**: managed CI/CD that spots repository changes and runs build, test and deploy stages, shipping fixes reliably with no servers to provision."
      - CodeBuild does CI builds and CodePipeline the whole release, but only X-Ray visualizes and debugs app behavior.
    takeaway: CodeBuild handles only the build step, while CodePipeline automates the whole release from commit to deploy.
    history: []
    verified:
      keyHash: d4f1b279a005
      fullHash: a13b573a0e3e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-11gfe3
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-codepipeline
    note: m13/aws-specialized-services
    task: "3.8"
    level: 1
    stem: >-
      Which job does AWS CodePipeline handle?
    options:
      - id: a
        text: Tracing requests to find the slow calls in an app
        why: Following requests to spot slow calls is what X-Ray does, not a release pipeline.
      - id: b
        text: Joining many data sources behind one GraphQL API
        why: Merging data sources into one GraphQL API is the job of AppSync, not CodePipeline.
      - id: c
        text: Adding sign-in, storage and hosting to a web app
        why: Giving a web or mobile app sign-in, storage and hosting is the Amplify toolkit, not release automation.
      - id: d
        text: Moving each commit through build, test and deploy
        correct: true
        why: CodePipeline is managed CI/CD that takes each change through build, test and deploy stages automatically.
    evidence:
      - "**AWS CodePipeline**: managed CI/CD that spots repository changes and runs build, test and deploy stages, shipping fixes reliably with no servers to provision."
      - CI/CD (continuous integration and continuous delivery) builds, tests and ships each committed change automatically for fast, dependable releases.
    takeaway: CodePipeline is managed CI/CD, automating how each code change is built, tested and deployed.
    history: []
    verified:
      keyHash: 34399482f021
      fullHash: abaa9b2c589f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-r1a2ty
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-x-ray
    note: m13/aws-specialized-services
    task: "3.8"
    level: 2
    stem: >-
      Checkout in the cafe's online ordering app has become slow, and the developers cannot tell which backend call causes the delay.
      Which service helps them trace requests and find the bottleneck?
    options:
      - id: a
        text: AWS CloudTrail
        why: CloudTrail records who made which API calls in the account, which audits activity but does not trace slow app requests.
      - id: b
        text: AWS X-Ray
        correct: true
        why: X-Ray traces each request through the app, so the developers can see which call is the bottleneck.
      - id: c
        text: AWS CodePipeline
        why: CodePipeline ships code changes through release stages, so it cannot show where a running request slows down.
      - id: d
        text: AWS CodeBuild
        why: CodeBuild compiles and tests code before release, not requests while the app is serving customers.
    evidence:
      - "**AWS X-Ray**: monitors and traces requests so developers can visualize app behavior, find bottlenecks, debug faster and tune efficiency and reliability."
    takeaway: When developers must see where requests slow down inside an app, AWS X-Ray traces them to the bottleneck.
    history: []
    verified:
      keyHash: aaae09bb5094
      fullHash: 450550d49572
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
