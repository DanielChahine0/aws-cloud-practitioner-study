        text: Herb planters that water themselves from soil and weather data
        correct: true
        why: Planters that measure soil and adjust watering to the weather are an IoT solution for IoT Core.
      - id: d
        text: A smoke alarm that senses smoke and beeps loudly in the kitchen
        why: The alarm senses smoke, but it neither shares data online nor takes remote control, so it is not IoT.
      - id: e
        text: A catering web form that emails staff online when it is sent
        why: The email comes from an ordinary web form without a sensing device, so it does not count as IoT.
    evidence:
      - IoT needs a sensing physical device, managed with AWS IoT Core; a plain app or software feature does not count.
      - "A camera that alerts your phone, a remote pet feeder or irrigation tuned to weather and soil: IoT solutions on AWS IoT Core."
    takeaway: IoT requires a physical device with sensors that shares data online; plain apps and software features are not IoT.
