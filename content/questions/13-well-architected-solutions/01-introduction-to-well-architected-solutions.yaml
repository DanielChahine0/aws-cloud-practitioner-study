  - id: q-kwkhet
    version: 1
    status: live
    type: match
    pool: practice
    concept: purpose-built-services
    note: m13/introduction-to-well-architected-solutions
    task: "3.8"
    level: 2
    stem: >-
      Match each cafe need to the group of purpose-built AWS services made for it.
    pairs:
      - left: Sending fridge temperature readings to a cloud app
        right: IoT
        why: Linking physical devices with sensors, such as fridges, to cloud apps is the job of IoT services.
      - left: Giving staff a managed desktop they reach from anywhere
        right: End-user computing
        why: Managed cloud desktops for staff are what end-user computing services provide.
      - left: Releasing app updates automatically after each change
        right: Development
        why: Automating how app changes are built, tested and released is the job of development services.
      - left: Answering customer calls and chats from one cloud center
        right: Business
        why: Handling customer calls and chats is customer service work, which the business group supports with a cloud contact center.
    evidence:
      - "Next: development, business, end-user computing and IoT services."
    takeaway: Beyond core building blocks, AWS offers purpose-built services for development, business, end-user computing and IoT.
    history: []
