  - id: q-wfye2v
    version: 1
    status: live
    type: single
    pool: practice
    concept: sustainability-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      The cafe resizes receipt images a few minutes each hour on an EC2 instance that runs nonstop.
      To cut energy use and carbon, which change fits the Sustainability pillar?
    options:
      - id: a
        text: Move the job to AWS Lambda
        correct: true
        why: Lambda runs only when the job does, avoiding an always-on instance and its energy use.
      - id: b
        text: Move the job to a larger EC2 instance
        why: A larger instance that still runs nonstop uses more energy, not less.
      - id: c
        text: Move the job to Amazon Lightsail
        why: A Lightsail server is still always on between jobs, so the idle energy use remains.
      - id: d
        text: Move the job to an EC2 Reserved Instance
        why: A Reserved Instance changes the price, but the instance still runs nonstop and uses energy while idle.
    evidence:
      - "**Sustainability**: energy-efficient, lower-impact designs that avoid always-on resources, like Lambda over a nonstop EC2 instance or a smaller RDS instance, cutting cost, energy and carbon."
    takeaway: Replacing always-on resources with serverless ones like Lambda is a Sustainability improvement.
