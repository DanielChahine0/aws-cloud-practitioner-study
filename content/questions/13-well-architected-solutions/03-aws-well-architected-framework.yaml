    type: single
    pool: practice
    concept: security-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      The cafe's loyalty database stores customer emails.
      The owner wants each staff role to have only the permissions it needs and the data encrypted at rest and in transit.
      Which pillar guides these choices?
    options:
      - id: a
        text: Security
        correct: true
        why: Least-privilege permissions and encryption build protection into the design, which is the Security pillar.
      - id: b
        text: Reliability
        why: Reliability plans recovery from failures and does not decide who may read the customer emails.
      - id: c
        text: Operational Excellence
        why: Operational Excellence improves how systems are run and released, not how the data is protected.
      - id: d
        text: Performance Efficiency
        why: Performance Efficiency fits resource size to the workload and does not cover permissions or encryption.
    evidence:
      - "**Security**: protection built in, with least-privilege access, intact data and guarded systems."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: Least-privilege access and encryption of data point to the Security pillar.
