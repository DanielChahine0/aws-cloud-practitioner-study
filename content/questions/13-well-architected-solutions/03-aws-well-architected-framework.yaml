questions:
  - id: q-52v54j
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-well-architected-framework
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 1
    stem: >-
      What does the AWS Well-Architected Framework give a team that builds on AWS?
    options:
      - id: a
        text: A free service that reviews a workload and suggests fixes
        why: That describes the AWS Well-Architected Tool, whose question-based review applies the framework rather than being it.
      - id: b
        text: A six-pillar method for designing and judging designs
        correct: true
        why: The framework is a consistent, six-pillar way to design an architecture and assess how well it holds up.
      - id: c
        text: A phased plan for moving a business into the cloud
        why: A migration plan is a different kind of guidance and does not score a design against pillars.
      - id: d
        text: A pricing model that rewards a steady usage commitment
        why: A pricing model lowers a bill, while the framework is a method for judging the architecture itself.
    evidence:
      - "**AWS Well-Architected Framework**: AWS's six-pillar method for designing and judging architectures."
      - The framework aims past merely working, at secure, high-performing, resilient and efficient designs, with one consistent method for any workload.
    takeaway: The Well-Architected Framework is a six-pillar method for designing and judging architectures, not a service.
    history: []
    verified:
      keyHash: 2294b529d76a
      fullHash: c6644e7b8867
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-z7gd70
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-well-architected-framework
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      The cafe's online ordering site already works well, yet the owner still reviews it against the Well-Architected pillars every few months.
      Why does the framework encourage this?
    options:
      - id: a
        text: Regions hold several AZs, so a site can run in more than one
        why: This is true of AWS infrastructure, but it says nothing about why a working design gets reviewed again.
      - id: b
        text: AWS runs the data centers, so the cafe never buys its own servers
        why: This is true of the cloud model, but it is not the reason the framework asks for repeat reviews.
      - id: c
        text: Workloads change, so sizes and processes drift from what fits
        correct: true
        why: As the ordering site's workload becomes clearer and changes, the pillars push the owner to refine, resize and trim waste.
      - id: d
        text: AWS secures the hardware, so the cafe guards only its own layer
        why: This is true under the shared responsibility model, but it does not explain revisiting the design.
    evidence:
      - Needs change, so the pillars keep asking you to refine processes, resize as the workload becomes clearer and trim waste.
    takeaway: A working design still gets revisited, because changing needs call for refining, resizing and cutting waste.
    history: []
    verified:
      keyHash: 47c618d25acb
      fullHash: d6e7c7ae2a5a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-f17dmz
    version: 1
    status: live
    type: single
    pool: practice
    concept: operational-excellence-pillar
    note: m13/aws-well-architected-framework
    task: "1.2"
    level: 2
    stem: >-
      Staff push menu updates to the cafe's site by hand, so each release follows different steps and the test and live setups drift apart.
      The owner adds an automated release pipeline so every release runs the same way.
      Which pillar does this change serve?
    options:
      - id: a
        text: Performance Efficiency
        why: Performance Efficiency sizes resources to the workload, not how releases are run.
      - id: b
        text: Operational Excellence
        correct: true
        why: Automating releases through a pipeline improves how the cafe runs and changes its systems, which is Operational Excellence.
      - id: c
        text: Security
        why: Security covers access and data protection, and a release pipeline is not mainly a protection measure.
      - id: d
        text: Cost Optimization
        why: Cost Optimization lowers spend, while the pipeline's aim here is safer, repeatable releases.
    evidence:
      - "Hand-run releases causing outages and drifting environments: a CI/CD pipeline such as AWS CodePipeline (Operational Excellence)."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: Automating releases to stop hand-run outages and drift is an Operational Excellence improvement.
    history: []
    verified:
      keyHash: 9f26751eb764
      fullHash: f90fd7e6e56a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
