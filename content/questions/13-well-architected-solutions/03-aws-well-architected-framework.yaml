      - id: b
        text: Giving every identity only the permissions it needs
        correct: true
        why: Least-privilege access limits what each identity can do, a core Security practice.
      - id: c
        text: Releasing changes through an automated pipeline
        why: Automated releases improve how systems are run, which is Operational Excellence.
      - id: d
        text: Encrypting data at rest and while it is in transit
        correct: true
        why: Encryption keeps data protected and intact, which the Security pillar asks for.
      - id: e
        text: Planning automated recovery when a component fails
        why: Planning recovery from failures is the heart of the Reliability pillar, not Security.
      - id: f
        text: Updating runbooks after each software release
        why: Keeping runbooks current as releases go out improves how systems are run, which is Operational Excellence.
    evidence:
      - "**Security**: protection built in, with least-privilege access, intact data and guarded systems."
      - "Pillar cues: automated releases point to Operational Excellence, least privilege and encryption to Security, multiple AZs and recovery to Reliability."
    takeaway: The Security pillar builds in protection through least-privilege access and encryption at rest and in transit.
