    concept: aws-knowledge-center
    note: m09/additional-security-resources
    task: "2.4"
    level: 3
    stem: >-
      The cafe's admin gets an access error each time she attaches a new IAM policy, and wants to find a question someone already asked about that same problem, with its answer.
      Which resource fits best?
    options:
      - id: a
        text: AWS Security Blog
        why: The blog posts expert tips on security topics rather than answers to specific troubleshooting questions.
      - id: b
        text: AWS Security Center
        why: The Security Center is the general site for learning about AWS security, not a set of answered problems.
      - id: c
        text: AWS Knowledge Center
        correct: true
        why: The Knowledge Center collects common questions with answers and troubleshooting help, like this error.
      - id: d
        text: AWS Security Documentation
        why: The documentation describes each product's security features rather than walking through reported errors.
    evidence:
      - "[Knowledge Center](https://repost.aws/search/content?globalSearch=security): Q&A, troubleshooting."
    takeaway: For an answered question about a specific problem, turn to the AWS Knowledge Center's Q&A and troubleshooting content.
