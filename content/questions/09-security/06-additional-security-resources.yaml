  - id: q-vphv2b
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-knowledge-center
    note: m09/additional-security-resources
    task: "4.3"
    level: 1
    stem: >-
      Which kinds of content does the AWS Knowledge Center offer?
    options:
      - id: a
        text: Answers to commonly asked questions
        correct: true
        why: The Knowledge Center is built around questions and their answers.
      - id: b
        text: Calls with a technical account manager
        why: A technical account manager comes with a higher AWS Support plan, not with the Knowledge Center.
      - id: c
        text: Help with troubleshooting problems
        correct: true
        why: Troubleshooting help for common issues is a core part of the Knowledge Center.
      - id: d
        text: Automated checks of account settings
        why: Automated best-practice checks of an account come from AWS Trusted Advisor, not the Knowledge Center.
      - id: e
        text: Downloadable reports on AWS compliance
        why: AWS's own compliance reports are served through AWS Artifact, not the Knowledge Center.
    evidence:
      - "[Knowledge Center](https://repost.aws/search/content?globalSearch=security): Q&A, troubleshooting."
    takeaway: The AWS Knowledge Center offers Q&A and troubleshooting help for common problems.
