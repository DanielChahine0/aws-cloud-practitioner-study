questions:
  - id: q-c709zr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-security-documentation
    note: m09/additional-security-resources
    task: "2.4"
    level: 2
    stem: >-
      The cafe's developer must set up encryption for its Amazon S3 receipts bucket and its Amazon RDS order database, and has heard the two services handle it differently.
      Which resource organizes AWS security guidance service by service?
    options:
      - id: a
        text: AWS Security Blog
        why: The blog shares expert tips in articles, not a reference set arranged by each product.
      - id: b
        text: AWS Security Documentation
        correct: true
        why: This documentation is arranged by product, so the developer can open the S3 and RDS sections separately.
      - id: c
        text: AWS Knowledge Center
        why: The Knowledge Center answers common questions and troubleshooting cases, not full per-service guides.
      - id: d
        text: AWS Trust and Safety Center
        why: The Trust and Safety Center is for reporting suspected abuse of AWS, not for configuring a service.
    evidence:
      - Each service differs, so read its docs.
      - "[AWS Security Documentation](https://docs.aws.amazon.com/security/): by product."
    takeaway: AWS Security Documentation is sorted by product, so it is the place to look up one service's own security settings.
    history: []
    verified:
      keyHash: d53de01be15d
      fullHash: 4434b604944a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-r28fgr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-security-documentation
    note: m09/additional-security-resources
    task: "2.4"
    level: 1
    stem: >-
      Why should the cafe read the security guidance for Amazon S3 and for AWS Lambda separately, rather than reuse one checklist for both?
    options:
      - id: a
        text: Services differ in their security features
        correct: true
        why: Services differ in their security features, so each one's own documentation is the reliable source.
      - id: b
        text: AWS secures the physical data centers
        why: This is true, but physical security is the same for every service and does not explain reading separate guidance.
      - id: c
        text: Regions are isolated from one another
        why: Region isolation is true, but it concerns where resources run, not why S3 and Lambda need separate guidance.
      - id: d
        text: Accounts pay only for the services they use
        why: Pay-as-you-go billing is true, but it says nothing about how security settings differ between services.
    evidence:
      - Each service differs, so read its docs.
      - "[AWS Security Documentation](https://docs.aws.amazon.com/security/): by product."
    takeaway: Security features differ between AWS services, so read each service's own security documentation.
    history: []
    verified:
      keyHash: "373256559968"
      fullHash: dcb154380160
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-n0gezf
    version: 1
