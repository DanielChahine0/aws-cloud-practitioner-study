questions:
  - id: q-k2rayx
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-encryption
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: >-
      The cafe wants loyalty members' phone numbers scrambled so that only staff holding the right key can turn them back into readable text.
      Which technique fits?
    options:
      - id: a
        text: Hashing
        why: A hash is one-way, so even the cafe could never turn the phone numbers back into text.
      - id: b
        text: Encryption
        correct: true
        why: Encryption locks the numbers so that only a holder of the right key can read them again.
      - id: c
        text: Masking
        why: Masking hides data without any key, so there is no key for staff to unlock it with.
      - id: d
        text: Multi-factor authentication
        why: MFA protects who can sign in, but it does not scramble the phone numbers themselves.
    evidence:
      - "Encryption is a lock: only holders of the right key can read data such as customers' phone and card details."
      - Hashing and salting, used for stored passwords, are one-way and cannot be reversed.
    takeaway: Encryption is reversible only with the right key, unlike one-way hashing or keyless masking.
    history: []
    verified:
      keyHash: eaf7b1516d82
      fullHash: 805c0bf024f9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-bn8cq7
    version: 1
    status: draft
    type: single
    pool: practice
    concept: data-encryption
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: >-
      The cafe wants one key to encrypt customers' card details and a different key to decrypt them.
      Which statement fits this plan?
    options:
      - id: a
        text: Separate keys can split encrypting and decrypting.
        correct: true
        why: Encryption can use one key for both steps or a separate key for each, so this plan works.
      - id: b
        text: Hashing lets the cafe read the card details back.
        why: Hashing is one-way and cannot be reversed, so it could never give the card details back.
      - id: c
        text: Masking hides card details using a pair of keys.
        why: Masking protects data without any keys, so it does not use a pair of keys.
      - id: d
        text: SSL/TLS keys protect card details kept in a database.
        why: SSL/TLS encrypts a connection for data on the move, not card details stored in a database.
    evidence:
      - One key can lock and unlock, or separate encryption and decryption keys can split the work.
      - Hashing and salting, used for stored passwords, are one-way and cannot be reversed.
      - Tokenization and masking protect data without keys.
    takeaway: Encryption can use one key to encrypt and decrypt, or separate keys for each step.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 2 is the only true statement; the others misdescribe hashing, masking and TLS.)"
  - id: q-1ts5ye
    version: 1
    status: draft
    type: single
    pool: practice
    concept: encryption-at-rest
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: >-
      The cafe stores its customer profiles in an Amazon DynamoDB table and has changed no security settings.
      Which statement describes how the profiles sitting in that table are protected?
    options:
      - id: a
        text: The profiles sit on an encrypted EBS volume.
        why: The profiles live in a DynamoDB table, not on an EBS volume, so EBS encryption does not apply.
      - id: b
        text: The profiles are encrypted only while moving to an app.
        why: DynamoDB also encrypts the table data sitting at rest, not only data on the move.
      - id: c
        text: The profiles are encrypted at rest with AWS KMS keys.
        correct: true
        why: DynamoDB encrypts all table data at rest on the server side using AWS KMS keys, with no setting to change.
      - id: d
        text: The profiles stay unencrypted until someone turns it on.
        why: DynamoDB needs no setting change, because all table data is already encrypted at rest.
    evidence:
      - "**Amazon DynamoDB**: all table data is encrypted at rest server-side with AWS KMS keys."
    takeaway: DynamoDB encrypts every table at rest by default, using AWS KMS keys on the server side.
