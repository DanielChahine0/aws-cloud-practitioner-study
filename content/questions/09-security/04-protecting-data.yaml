      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 3 is the only true statement: DynamoDB encrypts at rest by default with KMS keys.)"
  - id: q-v89tg9
    version: 1
    status: live
    type: multi
    select: 3
    pool: practice
    concept: encryption-at-rest
    note: m09/protecting-data
    task: "2.2"
    level: 2
    stem: >-
      The cafe is listing which of its data needs protection while it sits idle in storage.
      Which items are data at rest?
    options:
      - id: a
        text: Customer records held in the cafe's database
        correct: true
        why: Records sitting in a database are idle, which makes them data at rest.
      - id: b
        text: Order records on their way from the database to the app
        why: Records moving from a database to an app are data in transit, not at rest.
      - id: c
        text: An Amazon EBS snapshot of the cafe's server
        correct: true
        why: A stored EBS snapshot is idle data, and EBS snapshots can be encrypted at rest.
      - id: d
        text: A phone number passing between services for a text
        why: A number travelling between services to send a text is moving, so it is in transit.
      - id: e
        text: A secret recipe file saved in an Amazon S3 bucket
        correct: true
        why: A file saved in an S3 bucket is stored, and S3 encrypts uploads at rest automatically.
      - id: f
        text: A menu page travelling to a browser over HTTPS
        why: A page delivered to a browser over HTTPS is moving across the network, so it is in transit.
    evidence:
      - "**At rest**: idle data, such as records in a database."
      - "**Amazon EBS**: volumes and snapshots, boot and data volumes alike, can be encrypted at rest."
      - "**Amazon S3**: new buckets have encryption configured, and uploads are encrypted at rest automatically."
    takeaway: Data at rest is idle data in storage, such as database records, EBS snapshots and S3 files.
    history: []
    verified:
      keyHash: 012565e848c0
      fullHash: 638c63574f4c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-xn81x8
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-kms
    note: m09/protecting-data
    task: "2.2"
    level: 3
    stem: >-
      The cafe wants to create the random digit strings that lock its stored data and decide which IAM roles may use them.
      Which service fits?
    options:
      - id: a
        text: AWS Secrets Manager
        why: Secrets Manager stores secrets such as passwords, not the encryption keys the cafe wants to create.
      - id: b
        text: AWS Certificate Manager (ACM)
        why: ACM manages SSL/TLS certificates, not general-purpose keys for stored data.
      - id: c
        text: AWS Key Management Service (AWS KMS)
        correct: true
        why: AWS KMS creates and controls cryptographic keys and sets which IAM users and roles may use them.
      - id: d
        text: Amazon Macie
        why: Macie finds sensitive data in S3, but it does not create or control encryption keys.
    evidence:
      - "**AWS Key Management Service (AWS KMS)**: creates and controls cryptographic keys, the random digit strings that lock and unlock data."
      - You set which IAM users and roles may manage keys and where they are used, keys never leave KMS, and a key can be disabled temporarily.
    takeaway: To create encryption keys and control who may use them, choose AWS KMS.
    history: []
    verified:
      keyHash: 7ee1e394231a
      fullHash: 76fd9e46727b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
