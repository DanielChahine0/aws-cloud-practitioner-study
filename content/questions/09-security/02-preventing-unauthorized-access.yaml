  - id: q-6k3ehf
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-iam
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 3
    stem: >-
      The cafe uses a single AWS account and wants fine-grained control over which identities exist in it and what each one may do.
      Which service provides this?
    options:
      - id: a
        text: AWS IAM Identity Center
        why: Identity Center centralizes workforce sign-in across many accounts and apps through an outside identity source.
      - id: b
        text: IAM Access Analyzer
        why: Access Analyzer reviews access that already exists rather than creating identities and their permissions.
      - id: c
        text: AWS Organizations
        why: Organizations groups multiple accounts together, not the identities inside one account.
      - id: d
        text: AWS Identity and Access Management (IAM)
        correct: true
        why: IAM creates identities and controls exactly what each may do, covering both authentication and authorization.
    evidence:
      - AWS Identity and Access Management (IAM) gives fine-grained control over identities and what each may do, covering authentication and authorization.
    takeaway: IAM is the service that creates identities and decides what each one may do in an account.
    history: []
    verified:
      keyHash: 4f2529ed089d
      fullHash: c8457adfb800
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-jv41dv
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-iam
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      Minutes after the cafe creates an IAM user for a new barista, the barista tries to launch an EC2 instance and is refused.
      Why?
    options:
      - id: a
        text: Each IAM user has its own sign-in credentials
        why: This is true, and the barista did sign in, so it does not explain the refused launch.
      - id: b
        text: New identities hold no permissions until allowed
        correct: true
        why: Default deny gives a new identity zero permissions, so the launch fails until something allows it.
      - id: c
        text: MFA can add a second check at console sign-in
        why: MFA guards the sign-in, which already worked, so it does not explain why the launch was refused.
      - id: d
        text: Roles hand out permissions for a limited time
        why: This is true of roles, but the barista used an IAM user, so it does not explain the refusal.
    evidence:
      - "**Default deny** is the mechanism: a new identity has zero permissions, not even to launch an EC2 instance or create an S3 bucket, until explicitly allowed."
    takeaway: IAM denies by default, so a new identity can do nothing until a policy grants it.
    history: []
    verified:
      keyHash: 1f65ed15e2e5
      fullHash: b27b2177edb7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1pzk2a
    version: 1
    status: live
    type: single
    pool: practice
    concept: principle-of-least-privilege
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      A cafe intern needs to see the names of the files in the weekly reports bucket.
      Which grant follows the principle of least privilege?
    options:
      - id: a
        text: Full access to every bucket in the account
        why: Access to every bucket goes far beyond seeing one bucket's file names.
      - id: b
        text: Listing access to the reports bucket
        correct: true
        why: Allowing only the listing of that one bucket gives exactly what the intern needs and nothing more.
      - id: c
        text: Administrator access to the whole account
        why: Admin rights trade safety for convenience and grant far more than the task needs.
      - id: d
        text: Read and write access to the reports bucket
        why: Write access is more than viewing requires, so it grants extra permissions.
    evidence:
      - "**Least privilege** is the guiding principle: allow only what a person or system needs."
      - "Example: Allow `s3:ListBucket` on one reports bucket lets a user view that bucket and nothing else."
    takeaway: Least privilege means granting the narrowest access that still lets the person do the task.
    history: []
    verified:
      keyHash: efc65b1a6da5
      fullHash: 25945813b6cd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-kw6059
    version: 1
    status: live
    type: single
    pool: practice
    concept: principle-of-least-privilege
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: >-
      Which idea guides access decisions by saying a person or system should be allowed only what it needs?
    options:
      - id: a
        text: Default deny
        why: Default deny is the mechanism that refuses everything until allowed, not the rule for what to allow.
      - id: b
        text: Permission boundary
        why: A permission boundary caps the most an identity can hold rather than guiding what it should get.
      - id: c
        text: Role-based access control
        why: Role-based access control ties access to a person's job rather than stating the need-only rule.
      - id: d
        text: Least privilege
        correct: true
        why: Least privilege is the guiding principle of granting only the access that is needed.
    evidence:
      - "**Least privilege** is the guiding principle: allow only what a person or system needs."
      - "Not the same thing: a permission boundary caps the most permissions an identity can hold, and role-based access control ties access to a person's job in the organization."
    takeaway: Least privilege is the principle of granting only needed access, while default deny is how IAM behaves.
    history: []
    verified:
      keyHash: "1739287778e3"
      fullHash: 0aa9e09f4db5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-4tgatq
    version: 1
    status: live
    type: single
    pool: practice
    concept: access-keys
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe's developer runs AWS CLI scripts from a laptop under an IAM user.
      Which long-term credential signs those programmatic requests?
    options:
      - id: a
        text: An Amazon EC2 key pair
        why: A key pair is for connecting to an instance, not for signing AWS CLI or API requests.
      - id: b
        text: A console password with MFA
        why: A console password signs in to the web console and does not sign CLI requests.
      - id: c
        text: An access key ID and secret access key
        correct: true
        why: Access keys are the long-term credential pair that signs programmatic CLI and API requests.
      - id: d
        text: A secret stored in AWS Secrets Manager
        why: Secrets Manager can hold a credential, but the stored secret is not what signs CLI calls.
    evidence:
      - Access keys are long-term credentials, an access key ID plus a secret access key, that sign programmatic requests to the AWS CLI or API, and AWS advises temporary credentials from roles instead and never creating them for the root user.
    takeaway: Programmatic AWS CLI and API calls are signed with access keys, an access key ID plus a secret access key.
    history: []
    verified:
      keyHash: 34dec2d9818e
      fullHash: 4effeb2e0d94
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
