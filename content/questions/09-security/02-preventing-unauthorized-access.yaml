    stem: >-
      The cafe wants one password length rule for every staff IAM user, including staff it adds next season, without setting it person by person.
      Where does the cafe set an IAM password policy so that it reaches all of them?
    options:
      - id: a
        text: In the AWS account's IAM settings
        correct: true
        why: A password policy is one account-wide setting, so every IAM user password follows it, new users included.
      - id: b
        text: On an IAM group the staff belong to
        why: Groups pass permission policies on to members, but a password policy is an account setting, not a group attachment.
      - id: c
        text: In a secret kept in AWS Secrets Manager
        why: Secrets Manager stores and rotates app secrets, and it does not hold the rules for IAM user passwords.
      - id: d
        text: On an IAM role the staff assume
        why: A role hands out temporary permissions with no long-term password, so it carries no password rules.
    evidence:
      - Password policies set account-wide rules for IAM user passwords, such as minimum length, required character types, expiration and preventing reuse, but they never apply to the root user password.
    takeaway: An IAM password policy is one account-wide setting, so it covers every IAM user password without per-user setup.
