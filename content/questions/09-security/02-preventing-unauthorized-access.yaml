questions:
  - id: q-ezgpvt
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-account-root-user
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe owner signs in with the email address and password used to open the cafe's AWS account.
      That identity can do anything in the account and no policy can limit it.
      Which identity is the owner using?
    options:
      - id: a
        text: IAM user
        why: An IAM user starts with no permissions and can be limited by policies, unlike this identity.
      - id: b
        text: IAM role
        why: A role is assumed for temporary permissions, not signed in to with the account's opening email.
      - id: c
        text: Root user
        correct: true
        why: The root user comes with every new account, has full access and cannot be restricted.
      - id: d
        text: Federated user
        why: A federated user signs in through an outside identity source, not the email that opened the account.
    evidence:
      - Every new AWS account comes with a root user, the owner, who can do anything and cannot be restricted.
    takeaway: The identity created with the account, with unlimited and unrestrictable power, is the AWS account root user.
    history: []
    verified:
      keyHash: 353e0f6fb1a0
      fullHash: df54dd8727af
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ej90bp
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-account-root-user
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: >-
      The cafe owner has already given the root user a strong password and turned on MFA.
      What else does AWS advise for the root user from then on?
    options:
      - id: a
        text: Give it a long and strong password
        why: AWS does advise a strong password, but the owner has already set one, so it is not the further step.
      - id: b
        text: Turn on MFA for its sign-in
        why: AWS does advise MFA for the root user, but the owner has already turned it on.
      - id: c
        text: Keep it out of daily work
        correct: true
        why: Even when secured, the root user stays out of everyday tasks, which IAM identities handle instead.
      - id: d
        text: Cover it with the password policy
        why: An account password policy sets rules for IAM user passwords only and never applies to the root user.
    evidence:
      - Even then, keep the root user out of daily work and use IAM identities instead.
      - Give it a strong password and turn on multi-factor authentication (MFA) right after the first root login.
    takeaway: Even a secured root user stays out of daily work, while IAM identities handle routine tasks.
    history: []
    verified:
      keyHash: 9392f6dbc5b7
      fullHash: a497cd5d80fd
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-y02gsw
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-factor-authentication
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      A thief learned the cafe manager's AWS password yet the sign-in failed, because the login also asked for a code from the manager's phone app.
      Which protection stopped the thief?
    options:
      - id: a
        text: An account password policy
        why: A password policy sets rules for the password itself, and the thief already had that password.
      - id: b
        text: Multi-factor authentication
        correct: true
        why: MFA demands a second kind of proof, so a stolen password alone is not enough to sign in.
      - id: c
        text: AWS IAM Identity Center
        why: Identity Center gives staff one login across accounts, but a single login does not ask for a phone code.
      - id: d
        text: AWS Secrets Manager rotation
        why: Rotating a stored secret changes it over time, but it adds no second check at sign-in.
    evidence:
      - MFA requires at least two kinds of proof, such as the password plus a one-time code from a phone app.
    takeaway: MFA asks for a second kind of proof, so a stolen password by itself cannot open the account.
    history: []
    verified:
      keyHash: 633481e3c14f
      fullHash: 1c747a4c3a32
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-2x97cr
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-factor-authentication
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: >-
      The cafe turns on multi-factor authentication for its staff IAM users.
      What extra step do they now face at console sign-in?
    options:
      - id: a
        text: Changing the password after a set time
        why: Password expiry comes from an account password policy, not from turning on MFA.
      - id: b
        text: Picking an account from a single sign-on portal
        why: A sign-on portal for many accounts comes from IAM Identity Center, not from MFA.
      - id: c
        text: Typing a one-time code from a phone app
        correct: true
        why: MFA asks for a second kind of proof, such as a one-time code from a phone app, beyond the password.
      - id: d
        text: Switching to a role for temporary permissions
        why: Assuming a role swaps permissions for a while, and turning on MFA does not make users do it.
    evidence:
      - MFA requires at least two kinds of proof, such as the password plus a one-time code from a phone app.
    takeaway: MFA means two different kinds of proof, such as a password and a one-time code from a device.
    history: []
