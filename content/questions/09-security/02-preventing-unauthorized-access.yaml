  - id: q-hcqv80
    version: 1
    status: live
    type: single
    pool: practice
    concept: iam-password-policies
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe wants every staff console login secret to have a minimum length, mixed character types and no reuse of old ones.
      What should it set up?
    options:
      - id: a
        text: Multi-factor authentication
        why: MFA adds a second proof at sign-in but sets no rules for how passwords are built.
      - id: b
        text: AWS Secrets Manager
        why: Secrets Manager stores and rotates application secrets, not the rules for staff sign-in passwords.
      - id: c
        text: An IAM password policy
        correct: true
        why: A password policy sets account-wide rules for IAM user passwords, including length, character types and reuse.
      - id: d
        text: An IAM role
        why: A role grants temporary permissions with no long-term password, so it sets no password rules.
    evidence:
      - Password policies set account-wide rules for IAM user passwords, such as minimum length, required character types, expiration and preventing reuse, but they never apply to the root user password.
    takeaway: Rules on IAM user password length, character types, expiry and reuse come from an account password policy.
    history: []
    verified:
      keyHash: 218072c6ee93
      fullHash: 15ef4880d670
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
