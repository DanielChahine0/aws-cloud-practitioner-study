  - id: q-yjv1nr
    version: 1
    status: live
    type: single
    pool: practice
    concept: cross-account-iam-roles
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe keeps a development account and a production account.
      Developers with IAM users in development sometimes need to deploy in production, and the cafe wants to avoid creating a second IAM user for each of them.
      What fits?
    options:
      - id: a
        text: An IAM group in the production account
        why: A group only holds IAM users, so each developer would still need a user in production.
      - id: b
        text: An IAM role in the production account
        correct: true
        why: Developers assume the role from their own account and get temporary credentials in production.
      - id: c
        text: A managed policy in the production account
        why: A policy must attach to an identity in production, so each developer would still need one there.
      - id: d
        text: A service control policy on the production account
        why: A service control policy sets limits for accounts in an organization and grants nobody access.
    evidence:
      - With cross-account IAM roles, users in one AWS account assume a role in another account and get temporary credentials there, so nobody needs a separate IAM user in each account.
    takeaway: Cross-account IAM roles let users from one account work in another without a second IAM user there.
    history: []
    verified:
      keyHash: a7c225186e07
      fullHash: 4100d569642f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
