  - id: q-y25y31
    version: 1
    status: live
    type: single
    pool: practice
    concept: iam-access-reports
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 3
    stem: >-
      The cafe suspects its marketing role holds permissions it never uses.
      It wants to see which services and actions that role actually tried to use, so it can remove the rest.
      Which feature fits?
    options:
      - id: a
        text: AWS Config
        why: Config tracks resource configurations over time, not which permissions an identity used.
      - id: b
        text: IAM access reports
        correct: true
        why: Access reports show last accessed information for each user, role or policy so unused permissions can go.
      - id: c
        text: AWS CloudTrail
        why: CloudTrail records API activity event by event rather than summarizing unused permissions per role.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor gives broad best-practice checks, not per-role last accessed details.
    evidence:
      - IAM access reports show last accessed information, meaning which services and actions each user, role or policy actually tried to use, so you can remove unused permissions and keep least privilege.
    takeaway: To trim unused permissions, check IAM access reports for what each identity actually tried to use.
    history: []
    verified:
      keyHash: 16b3127c0858
      fullHash: 00bc28c5df13
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
