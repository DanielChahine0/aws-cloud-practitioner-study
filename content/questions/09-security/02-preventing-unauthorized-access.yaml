    concept: iam-policies
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe wants a policy that lets its finance staff work with the invoices bucket while every other bucket stays out of reach.
      Which fact about an IAM policy makes that narrow scope possible?
    options:
      - id: a
        text: It can take effect through an IAM group
        why: Attaching to a group decides who gets the policy, not which buckets the policy reaches.
      - id: b
        text: It can name one target as its Resource
        correct: true
        why: The Resource element names what the calls target, and it can be as narrow as the one invoices bucket.
      - id: c
        text: It can allow any API call as its Action
        why: The Action part lists which calls are allowed, not which bucket those calls may target.
      - id: d
        text: It can hold both Allow and Deny rules
        why: The Effect decides whether calls are allowed or denied, not which buckets those calls may reach.
    evidence:
      - A policy, written in JSON, holds allow or deny rules for AWS services and resources, scoped as wide as every S3 bucket or as narrow as one.
      - Each statement sets an **Effect** (only Allow or Deny), an **Action** (any AWS API call) and a **Resource** (what the call targets).
    takeaway: An IAM policy's Resource can be scoped as narrowly as one bucket, so access reaches only that target.
