    type: single
    pool: practice
    concept: access-keys
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe owner plans to create access keys for the root user so a nightly script can call AWS.
      Which fact should change this plan?
    options:
      - id: a
        text: Access keys sign requests to the AWS CLI or API
        why: This is true and is why the owner wants keys, so it gives no reason to change the plan.
      - id: b
        text: Each access key pairs an ID with a secret key
        why: This describes what an access key is made of, not why the root user should not get one.
      - id: c
        text: Roles give scripts temporary credentials instead
        correct: true
        why: AWS advises temporary role credentials over long-term access keys, and never keys for the root user.
      - id: d
        text: AWS Secrets Manager can store and rotate API keys
        why: Storing root keys in Secrets Manager still leaves long-term root keys, which AWS advises against.
    evidence:
      - Access keys are long-term credentials, an access key ID plus a secret access key, that sign programmatic requests to the AWS CLI or API, and AWS advises temporary credentials from roles instead and never creating them for the root user.
    takeaway: Avoid long-term access keys where you can, never create them for the root user, and prefer role credentials.
    history: []
