  - id: q-8nfs68
    version: 1
    status: live
    type: single
    pool: practice
    concept: custom-policies
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe needs a policy for its kitchen staff IAM group that allows reading only the recipes bucket.
      No prebuilt policy fits, and the cafe wants to adjust the rules itself later.
      Which policy type fits?
    options:
      - id: a
        text: An AWS managed policy
        why: AWS writes and maintains these, so the cafe could not edit one to fit its own rules.
