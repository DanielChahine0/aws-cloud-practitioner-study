    version: 1
    status: live
    type: single
    pool: practice
    concept: cross-account-iam-roles
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: >-
      When users in one AWS account work in another account through a cross-account role, what do they no longer need?
    options:
      - id: a
        text: A permissions policy on the role
        why: The role still needs a policy, since its permissions come from what is attached to it.
      - id: b
        text: An identity in their home account
        why: Users still sign in to their own account first, and from there they assume the role.
      - id: c
        text: Permission to assume the role
        why: Users must still be allowed to assume the role before they can get its credentials.
      - id: d
        text: A separate IAM user in each account
        correct: true
        why: Assuming the role gives temporary credentials in the other account, so no extra IAM user is needed there.
    evidence:
      - With cross-account IAM roles, users in one AWS account assume a role in another account and get temporary credentials there, so nobody needs a separate IAM user in each account.
      - "**IAM role**: an identity someone assumes for temporary permissions, with no long-term username or password."
    takeaway: Cross-account roles give temporary credentials in another account, so nobody needs an IAM user in each one.
