  - id: q-33vwnc
    version: 1
    status: live
    type: single
    pool: practice
    concept: iam-policies
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 2
    stem: >-
      The cafe wrote a JSON policy that allows listing the reports bucket, yet staff still cannot list it.
      Which fact about policies explains this?
    options:
      - id: a
        text: A policy has no effect until it is attached
        correct: true
        why: A policy does nothing until it is attached to a user, group or role, so staff gain nothing yet.
      - id: b
        text: A policy can hold both Allow and Deny rules
        why: This is true, but the policy only allows, so mixing rule types does not explain the problem.
      - id: c
        text: A policy can cover just a single S3 bucket
        why: This is true, and the policy is scoped to the reports bucket, which is the one staff want to list.
      - id: d
        text: A policy is written as a JSON document
        why: This is true of every policy, so it does not explain why this one grants nothing yet.
    evidence:
      - It only takes effect once attached to a user, group or role.
      - A policy, written in JSON, holds allow or deny rules for AWS services and resources, scoped as wide as every S3 bucket or as narrow as one.
    takeaway: An IAM policy grants nothing until it is attached to a user, group or role.
    history: []
    verified:
      keyHash: 1e6070eeeba9
      fullHash: f3b233a5c676
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-365mpn
    version: 1
    status: live
    type: match
    pool: practice
    concept: iam-policies
    note: m09/preventing-unauthorized-access
    task: "2.3"
    level: 1
    stem: >-
      Match each part of an IAM policy statement to what it holds.
    pairs:
      - left: Effect
        right: Allow or Deny
        why: The Effect element can only be Allow or Deny, deciding whether the statement grants or blocks.
      - left: Action
        right: The API call, such as s3:ListBucket
        why: The Action element names the AWS API calls the statement covers.
      - left: Resource
        right: The target of the call, such as one bucket
        why: The Resource element names what the call acts on, from one bucket to every bucket.
    evidence:
      - Each statement sets an **Effect** (only Allow or Deny), an **Action** (any AWS API call) and a **Resource** (what the call targets).
    takeaway: Every IAM policy statement pairs an Effect with the Actions it covers and the Resources they target.
    history: []
