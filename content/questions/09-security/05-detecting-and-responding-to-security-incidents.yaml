  - id: q-rnmh2h
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-guardduty
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.4"
    level: 3
    stem: >-
      The cafe wants a service that keeps watching its AWS account and network traffic around the clock.
      It should raise an alert if, for example, an instance starts talking to an address known to be malicious.
      Which service fits?
    options:
      - id: a
        text: Amazon Inspector
        why: Inspector scans workloads for vulnerable software rather than watching live account and network activity.
      - id: b
        text: Amazon Macie
        why: Macie looks for sensitive data stored in Amazon S3, not for suspicious network activity.
      - id: c
        text: Amazon GuardDuty
        correct: true
        why: GuardDuty continuously analyzes account and network activity and uses threat intelligence such as bad IP lists.
      - id: d
        text: AWS Security Hub
        why: Security Hub collects findings from other services into one view instead of analyzing traffic itself.
    evidence:
      - Continuously analyzes account metadata and network activity for threats.
      - Mixes threat intelligence, like known malicious IP addresses, with anomaly detection and ML for accuracy.
    takeaway: Ongoing threat detection from account and network activity, including known bad IPs, points to Amazon GuardDuty.
    history: []
    verified:
