    concept: aws-security-hub
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.2"
    level: 3
    stem: >-
      The cafe gets findings from several AWS services and from a partner tool, each in its own format.
      The owner wants all of them in one place, in one format, to judge the cafe's overall posture and compliance.
      Which service fits?
    options:
      - id: a
        text: AWS Trusted Advisor
        why: Trusted Advisor runs its own best-practice checks rather than merging findings from other services and partners.
      - id: b
        text: Amazon CloudWatch
        why: CloudWatch monitors resource and app metrics instead of gathering security findings into one view.
      - id: c
        text: Amazon Detective
        why: Detective investigates a single incident's root cause rather than summing up overall posture.
      - id: d
        text: AWS Security Hub
        correct: true
        why: Security Hub pulls findings from AWS and partner services into one format and one view of posture and compliance.
    evidence:
      - Pulls findings from AWS and partner services into one format and one view of security and compliance.
    takeaway: To see findings from many AWS and partner sources in one view, use AWS Security Hub.
