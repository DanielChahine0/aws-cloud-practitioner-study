  - id: q-cymwtj
    version: 1
    status: draft
    type: single
    pool: practice
    concept: security-incident-response
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.2"
    level: 2
    stem: >-
      The cafe already locks down access and patches its servers.
      Why should it still run detection services on top of those safeguards?
    options:
      - id: a
        text: Least privilege limits what each identity may do
        why: Least privilege is true and useful, but it is part of the prevention the cafe already has, not a reason to detect.
      - id: b
        text: Prevention can miss flaws nobody knows about yet
        correct: true
        why: Prevention can miss flaws nobody knows about yet, so the cafe must detect and respond quickly.
      - id: c
        text: Default deny refuses every action until allowed
        why: Default deny is true of IAM, but it is another safeguard and does not explain why detection is still needed.
      - id: d
        text: Encryption keeps stolen data unreadable without a key
        why: Encryption is true protection for data, but it prevents harm rather than explaining why detection is needed.
    evidence:
      - Prevention can miss unknown software flaws, so detect and react fast.
    takeaway: Prevention alone can miss unknown flaws, so detecting and responding fast is part of security.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 2 is the only limitation; the other three are named security principles stated as strengths.)"
