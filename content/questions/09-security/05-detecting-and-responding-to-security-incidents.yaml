  - id: q-s20x65
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-guardduty
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.4"
    level: 1
    stem: >-
      How does Amazon GuardDuty keep its findings accurate?
    options:
      - id: a
        text: It ranks each finding by severity and pairs it with a fix
        why: Ranking findings by severity with a fix for each is what Amazon Inspector does, and it does not explain GuardDuty's accuracy.
      - id: b
        text: It blends known bad IP lists with anomaly detection and ML
        correct: true
        why: GuardDuty pairs known malicious IP addresses with anomaly detection and ML to sharpen accuracy.
      - id: c
        text: It gathers logs itself and charts activity with graph analytics
        why: Gathering logs and charting activity with graph analytics describes Amazon Detective, not GuardDuty.
      - id: d
        text: It merges partner tool findings into one shared format
        why: Merging findings from AWS and partner services into one format is the job of AWS Security Hub.
    evidence:
      - Mixes threat intelligence, like known malicious IP addresses, with anomaly detection and ML for accuracy.
    takeaway: GuardDuty combines threat intelligence with anomaly detection and ML to spot threats accurately.
