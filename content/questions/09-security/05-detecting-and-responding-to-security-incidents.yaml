  - id: q-x35wp5
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-detective
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.4"
    level: 3
    stem: >-
      A threat alert has already fired for one of the cafe's accounts.
      The security lead now wants to walk back through what happened over the past week to find where it started.
      Which service fits?
    options:
      - id: a
        text: Amazon Detective
        correct: true
        why: Detective traces the root cause after detection, charting resource and user activity over a chosen window.
      - id: b
        text: Amazon GuardDuty
        why: GuardDuty raised the kind of alert the cafe already has but lacks interactive views for investigating it.
      - id: c
        text: AWS Security Hub
        why: Security Hub shows overall posture and compliance rather than deep forensics across a stretch of time.
      - id: d
        text: Amazon Inspector
        why: Inspector looks for software vulnerabilities ahead of time instead of investigating an incident.
    evidence:
      - After detection, it traces the root cause across your accounts.
      - GuardDuty detects threats but lacks Detective's interactive investigation views.
    takeaway: Once a threat is found, Amazon Detective is the tool for tracing back to its root cause.
    history: []
