  - id: q-jfx7gr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-security-hub
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.2"
    level: 1
    stem: >-
      What does AWS Security Hub call the actionable groups it sorts findings into?
    options:
      - id: a
        text: Alarms
        why: Alarms are CloudWatch metric thresholds, not the groups Security Hub builds from findings.
      - id: b
        text: Insights
        correct: true
        why: Security Hub organizes its findings into actionable groups that it calls insights.
      - id: c
        text: Config rules
        why: Config rules are standards AWS Config checks resources against, not Security Hub groupings.
      - id: d
        text: Event history
        why: Event history is CloudTrail's searchable view of past events rather than a Security Hub feature.
    evidence:
      - Sorts them into actionable groups called insights, and automated remediation shortens time to resolution (TTR).
    takeaway: Security Hub groups related findings into actionable insights so teams know what to fix first.
