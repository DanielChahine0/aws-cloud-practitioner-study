questions:
  - id: q-zjaktz
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-inspector
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.2"
    level: 3
    stem: >-
      The cafe worries that the EC2 instances behind its till system run software packages with known flaws.
      It wants those instances checked automatically, with each problem ranked by how serious it is.
      Which service fits?
    options:
      - id: a
        text: Amazon GuardDuty
        why: GuardDuty watches account and network activity for threats, not the software installed on the instances.
      - id: b
        text: Amazon Inspector
        correct: true
        why: Inspector scans EC2 instances for vulnerable software and ranks each finding by severity with a fix.
      - id: c
        text: Amazon Detective
        why: Detective investigates the root cause of an issue after detection rather than scanning for software flaws.
      - id: d
        text: AWS Trusted Advisor
        why: Trusted Advisor checks the account against broad best practices, not each instance's software for known flaws.
    evidence:
      - Automatically scans EC2, containers and Lambda for vulnerabilities and best-practice gaps, like open EC2 access or vulnerable software.
      - Ranks findings by severity, each with a fix, in the console or API.
    takeaway: Scanning workloads for vulnerable software and ranking the results by severity is the job of Amazon Inspector.
    history: []
    verified:
      keyHash: 5923db241c9d
      fullHash: cdf6be348ce2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-yks4a3
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-inspector
    note: m09/detecting-and-responding-to-security-incidents
    task: "2.2"
    level: 1
    stem: >-
      Which statement describes what Amazon Inspector hands the team after a scan?
    options:
      - id: a
        text: Findings ranked by severity, each paired with a fix
        correct: true
        why: Inspector orders its findings by severity and pairs each one with a fix, viewable in the console or API.
      - id: b
        text: Findings sorted into actionable groups called insights
        why: Sorting findings into actionable groups called insights is what AWS Security Hub does, not Inspector.
      - id: c
        text: Charts of user activity over a time window you set
        why: Charting resource and user activity over a chosen window is how Amazon Detective investigates, not Inspector.
      - id: d
        text: Alerts on calls from known malicious IP addresses
        why: Matching activity against known malicious IP addresses is part of how Amazon GuardDuty spots threats.
    evidence:
      - Ranks findings by severity, each with a fix, in the console or API.
    takeaway: Inspector's findings come ranked by severity, and each carries a fix to apply.
