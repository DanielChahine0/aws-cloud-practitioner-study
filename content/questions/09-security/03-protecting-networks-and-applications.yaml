  - id: q-x3wtyb
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-waf
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 1
    stem: >-
      In AWS WAF, what holds the rules that decide which IP addresses get their requests refused?
    options:
      - id: a
        text: A route table
        why: A route table steers traffic between subnets and does not block requests in AWS WAF.
      - id: b
        text: An IAM policy
        why: An IAM policy grants or denies permissions to identities, not to web requests.
      - id: c
        text: A security group
        why: A security group filters traffic for an instance and is separate from AWS WAF.
      - id: d
        text: A web ACL
        correct: true
        why: AWS WAF checks each request against its web access control list of blocked addresses.
    evidence:
      - "**AWS WAF**: a web application firewall that refuses requests from IP addresses blocked in its web ACL (web access control list)."
    takeaway: AWS WAF decides which requests to refuse using its web ACL.
    history: []
