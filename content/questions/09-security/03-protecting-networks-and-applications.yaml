  - id: q-wdc48t
    version: 1
    status: live
    type: single
    pool: practice
    concept: ddos-attacks
    note: m09/protecting-networks-and-applications
    task: "2.2"
    level: 2
    stem: >-
      A rival rents one powerful server and floods the cafe's ordering site from it until real customers get no answer.
      Which kind of attack is this?
    options:
      - id: a
        text: A denial of service (DoS) attack
        correct: true
        why: The flood comes from one machine, which makes it a DoS attack rather than a distributed one.
      - id: b
        text: A distributed denial of service (DDoS) attack
        why: A DDoS attack uses many compromised computers, but this flood comes from a single server.
      - id: c
        text: A UDP flood attack
        why: A UDP flood tricks a public service into replying to a forged address, which this rival did not do.
      - id: d
        text: A stolen credential attack
        why: The rival never signs in to anything and only exhausts the site's capacity with traffic.
    evidence:
      - A denial of service (DoS) attack exhausts an app's capacity so real customers get no answer.
      - One machine is not enough, so a distributed (DDoS) attack adds many infected computers, or zombie bots, whose owners have no idea.
    takeaway: A flood from one machine is a DoS attack, and it becomes a DDoS attack when many compromised machines join in.
    history: []
