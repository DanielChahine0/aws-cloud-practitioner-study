  - id: q-xtx60w
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-waf
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 3
    stem: >-
      The cafe's web app keeps getting malicious requests from a handful of known IP addresses.
      The cafe wants its web app to refuse every request from those addresses.
      Which service fits?
    options:
      - id: a
        text: AWS Shield Standard
        why: Shield Standard absorbs common DDoS floods automatically and keeps no list of IP addresses to refuse.
      - id: b
        text: Amazon GuardDuty
        why: GuardDuty flags suspicious activity but does not turn away web requests by address.
      - id: c
        text: AWS WAF
        correct: true
        why: AWS WAF refuses requests from IP addresses that its web ACL blocks.
      - id: d
        text: Amazon Inspector
        why: Inspector checks workloads for software flaws and does not filter incoming requests.
    evidence:
      - "**AWS WAF**: a web application firewall that refuses requests from IP addresses blocked in its web ACL (web access control list)."
    takeaway: Turning away web requests from known bad IP addresses is a job for AWS WAF.
    history: []
    verified:
