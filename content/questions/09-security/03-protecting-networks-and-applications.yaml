    concept: aws-firewall-manager
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 3
    stem: >-
      The cafe group runs one AWS account per cafe, all in one organization.
      Its security lead wants to set AWS WAF rules and security group rules once and have them enforced in every account.
      Which service fits?
    options:
      - id: a
        text: AWS WAF
        why: AWS WAF applies web ACL rules but does not push them across every account in the organization.
      - id: b
        text: AWS Firewall Manager
        correct: true
        why: Firewall Manager centrally sets and enforces WAF and security group rules across the organization's accounts.
      - id: c
        text: AWS Shield Advanced
        why: Shield Advanced adds paid DDoS mitigation and does not manage firewall rules across accounts.
      - id: d
        text: AWS Shield Standard
        why: Shield Standard gives automatic DDoS protection and has no rules for the cafe to manage.
    evidence:
      - AWS Firewall Manager centrally configures and enforces firewall rules, such as AWS WAF rules, security group rules and AWS Network Firewall firewalls, across the accounts in your organization.
    takeaway: Managing firewall rules from one place across an organization's accounts points to Firewall Manager.
    history: []
