    task: "2.4"
    level: 3
    stem: >-
      The cafe wants protection against common DDoS attacks on its site.
      It wants this at no added cost and with zero setup work.
      Which option fits?
    options:
      - id: a
        text: AWS Shield Advanced
        why: Shield Advanced is a paid service, so it adds cost the cafe wants to avoid.
      - id: b
        text: AWS WAF
        why: AWS WAF filters requests with web ACL rules that the cafe would have to set up.
      - id: c
        text: Amazon GuardDuty
        why: GuardDuty looks for threats in account activity and is not a built-in DDoS defense.
      - id: d
        text: AWS Shield Standard
        correct: true
        why: Shield Standard is free and defends against common DDoS attacks automatically.
    evidence:
      - "**AWS Shield Standard**: free, automatic, real-time defense against common DDoS attacks, built into ELB, CloudFront and Route 53."
    takeaway: Free, automatic defense against common DDoS attacks is AWS Shield Standard.
