  - id: q-9zfvr8
    version: 1
    status: live
    type: single
    pool: practice
    concept: udp-flood-attacks
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 2
    stem: >-
      Bots send small forecast requests to a public weather service and put the cafe server's address on them as the sender.
      Why does the cafe's server end up overwhelmed?
    options:
      - id: a
        text: The weather service forwards each small bot request to the cafe's server
        why: The service answers the requests itself, and small forwarded requests alone would not swamp the server.
      - id: b
        text: The weather service sends its large replies to the cafe's server
        correct: true
        why: The forged sender address makes the service aim its big replies at the cafe, which stalls sorting them.
      - id: c
        text: The bots open half-finished connections on the cafe's server
        why: Half-open connections describe a different flood, while here the bots never contact the cafe directly.
      - id: d
        text: The bots send large forecast files straight to the cafe's server
        why: The bots send only small requests, and the large data comes from the fooled public service.
    evidence:
      - Bots ask a helpful public service, like the National Weather Service, for forecasts, forging your address as the sender.
      - Small requests trigger big replies, so your server stalls sorting unwanted data.
    takeaway: A UDP flood forges the victim's address so a public service answers small requests with big replies aimed at the victim.
    history: []
    verified:
      keyHash: 3cb18e85976e
      fullHash: ec3b0ae4fbc8
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
