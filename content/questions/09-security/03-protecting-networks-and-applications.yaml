questions:
  - id: q-9v0w33
    version: 1
    status: live
    type: single
    pool: practice
    concept: ddos-attacks
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 1
    stem: >-
      What sets a distributed denial of service (DDoS) attack apart from a plain denial of service (DoS) attack?
    options:
      - id: a
        text: A single machine floods the app with requests.
        why: A flood from a single machine describes a plain DoS attack, which is the very thing a DDoS goes beyond.
      - id: b
        text: Many infected machines flood the app together.
        correct: true
        why: A DDoS spreads the flood across many infected machines whose owners do not know they take part.
      - id: c
        text: A fake email tricks staff into giving passwords.
        why: That describes phishing, which steals credentials and does not flood the app with requests at all.
      - id: d
        text: Malware locks the files until a ransom is paid.
        why: That describes ransomware, which holds data for payment rather than flooding the app with requests.
    evidence:
      - One machine is not enough, so a distributed (DDoS) attack adds many infected computers, or zombie bots, whose owners have no idea.
      - A denial of service (DoS) attack exhausts an app's capacity so real customers get no answer.
    takeaway: A DDoS attack is a DoS attack launched from many compromised machines at once.
    history: []
    verified:
      keyHash: fc5dcfbd5a88
      fullHash: 1dcc71b6f96a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-dgncfp
    version: 1
    status: live
    type: single
    pool: practice
    concept: ddos-attacks
    note: m09/protecting-networks-and-applications
    task: "2.2"
    level: 2
    stem: >-
      At lunch, the cafe's ordering site stops answering real customers.
      The logs show a wave of junk requests from thousands of home computers whose owners never meant to send them.
      What is the cafe facing?
    options:
      - id: a
        text: A DDoS attack
        correct: true
        why: Many unknowing infected computers exhausting the site's capacity is exactly a DDoS attack.
      - id: b
        text: A DoS attack
        why: A plain DoS comes from one source, while these requests arrive from thousands of machines.
      - id: c
        text: A phishing attack
        why: Phishing tricks people out of their credentials and does not flood the site with requests.
      - id: d
        text: A ransomware attack
        why: Ransomware locks data for payment rather than burying the site in junk requests.
    evidence:
      - A denial of service (DoS) attack exhausts an app's capacity so real customers get no answer.
      - One machine is not enough, so a distributed (DDoS) attack adds many infected computers, or zombie bots, whose owners have no idea.
    takeaway: Junk traffic from many unknowing infected machines that starves real customers is a DDoS attack.
    history: []
    verified:
      keyHash: 2867b005ea50
      fullHash: 9d6196a71e22
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-yxt2n9
    version: 1
    status: live
    type: single
    pool: practice
    concept: udp-flood-attacks
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 1
    stem: >-
      Which attack forges the victim's address on requests to a public service so that the service buries the victim in replies?
    options:
      - id: a
        text: A SYN flood
        why: A SYN flood opens half-finished connections straight to the victim instead of bouncing replies off a public service.
      - id: b
        text: A UDP flood
        correct: true
        why: A UDP flood fakes the victim as the sender, so the public service's replies all land on the victim.
      - id: c
        text: An HTTP flood
        why: An HTTP flood sends masses of web requests straight to the victim's site rather than redirecting replies.
      - id: d
        text: A ping flood
        why: A ping flood fires echo requests directly at the victim and does not use a public service to swamp it.
    evidence:
      - Bots ask a helpful public service, like the National Weather Service, for forecasts, forging your address as the sender.
    takeaway: A UDP flood forges the victim's address so a public service floods the victim with replies.
    history: []
    verified:
      keyHash: 7ed7c13bb4d2
      fullHash: 24ae3c7aafd4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-hgw6m0
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: udp-flood-attacks
    note: m09/protecting-networks-and-applications
    task: "2.4"
    level: 2
    stem: >-
      The cafe's web server slows to a crawl while it sorts through masses of weather forecasts it never asked for.
      Which statements explain how this UDP flood swamps the server?
    options:
      - id: a
        text: The requests to the weather service name the cafe as sender.
        correct: true
        why: Forging the cafe as the sender is what sends the weather service's replies to the cafe's server.
      - id: b
        text: Each small request to the service draws a much larger reply.
        correct: true
        why: The size gap turns little effort from the bots into a heavy load of replies on the cafe's server.
      - id: c
        text: The owners of the bots do not know their machines take part.
        why: Unaware owners are true of zombie bots, but that does not explain how the replies swamp the server.
      - id: d
        text: Security groups can drop forecast data sent on other protocols.
        why: Security groups are a defense that can drop the forecast data, so they do not explain how the flood works.
      - id: e
        text: Shield Standard protects ELB, CloudFront and Route 53 for free.
        why: Shield Standard is a free defense against common DDoS attacks, not part of how this flood swamps the server.
    evidence:
      - Bots ask a helpful public service, like the National Weather Service, for forecasts, forging your address as the sender.
      - Small requests trigger big replies, so your server stalls sorting unwanted data.
    takeaway: A UDP flood pairs a forged sender address with small requests that trigger big replies.
    history: []
    verified:
      keyHash: ad53b6352b1b
      fullHash: 55d494e5472b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
