questions:
  - id: q-chzy6w
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-elastic-beanstalk
    note: m03/additional-compute-services
    task: "3.3"
    level: 3
    stem: >-
      The cafe's developer has a Python ordering site and wants to hand over the code and a few settings.
      AWS should then create the instances, the load balancer, the scaling and the health checks, while the developer can still tune those resources later.
      Which service fits?
    options:
      - id: a
        text: AWS Lambda
        why: Lambda runs separate functions when events fire, so there are no instances or load balancer for the developer to tune.
      - id: b
        text: AWS Elastic Beanstalk
        correct: true
        why: Elastic Beanstalk takes the code and settings, builds the EC2 environment with scaling and health checks, and leaves its resources open to change.
      - id: c
        text: AWS Batch
        why: AWS Batch schedules and sizes compute for queued heavy jobs, not a web site that serves customers all day.
      - id: d
        text: Amazon Lightsail
        why: Lightsail sells a simple server bundle at a set monthly price, without building scaling and health checks around the code.
    evidence:
      - Give this fully managed service code and settings, and it builds the EC2 setup, scaling, load balancing and health checks.
      - You can save configurations to redeploy and still control every resource.
    takeaway: Hand over code and settings, get a scaled web environment you still control; that is Elastic Beanstalk.
    history: []

  - id: q-fxhezq
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: aws-elastic-beanstalk
    note: m03/additional-compute-services
    task: "3.1"
    level: 2
    select: 2
    stem: >-
      The cafe is weighing AWS Elastic Beanstalk as the way to deploy its new booking API.
      Which statements about this deployment method are true?
    options:
      - id: a
        text: It sets up the EC2 capacity, scaling and health checks from the uploaded code
        correct: true
        why: The service turns the cafe's code and settings into a running environment, so the team skips building it by hand.
      - id: b
        text: It runs the API only as short functions that start when an event arrives
        why: Running code as functions per event describes AWS Lambda, while Elastic Beanstalk deploys onto instances.
      - id: c
        text: It lets the team store a configuration and reuse it for the next deployment
        correct: true
        why: Saved configurations let the cafe redeploy the same environment, and the team keeps control of every resource.
      - id: d
        text: It installs AWS racks inside the cafe's own building to host the API
        why: Placing AWS hardware on premises is what AWS Outposts does, not a deployment service in the cloud.
      - id: e
        text: It charges the cafe one fixed monthly price for a bundled server plan
        why: A predictable monthly bundle describes Amazon Lightsail, while Elastic Beanstalk uses the AWS resources it creates.
    evidence:
      - Give this fully managed service code and settings, and it builds the EC2 setup, scaling, load balancing and health checks.
      - You can save configurations to redeploy and still control every resource.
    takeaway: Elastic Beanstalk builds the environment from your code, and you can save its configuration and keep control.
    history: []

  - id: q-rrj9rq
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-batch
    note: m03/additional-compute-services
    task: "3.3"
    level: 3
    stem: >-
      Each night, the cafe chain's data team runs thousands of demand simulations side by side, each one heavy on compute.
      The team wants a managed service to queue the jobs and size a fleet of EC2 instances to fit them.
      Which service fits?
    options:
      - id: a
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk deploys and scales a web application, not a queue of heavy jobs that run and finish.
      - id: b
        text: Amazon Lightsail
        why: Lightsail offers a small server at a set monthly price, far from a fleet sized for thousands of jobs.
      - id: c
        text: AWS Lambda
        why: Lambda runs short functions in response to events, and it does not schedule heavy jobs across an EC2 fleet.
      - id: d
        text: AWS Batch
        correct: true
        why: AWS Batch schedules the simulation jobs and scales the EC2 resources to match the work, all as a managed service.
    evidence:
      - A fully managed service for heavy compute such as huge datasets, simulations and complex math.
      - It schedules jobs and scales resources to fit them across a fleet such as EC2 instances.
    takeaway: Many heavy jobs that need scheduling across a fleet point to AWS Batch, not to Lambda's event-driven functions.
    history: []

  - id: q-zk6qrc
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-batch
    note: m03/additional-compute-services
    task: "3.3"
    level: 1
    stem: >-
      Which AWS service plans when compute-heavy jobs run and grows or shrinks the resources beneath them to fit the workload?
    options:
      - id: a
        text: AWS Batch
        correct: true
        why: AWS Batch is the managed service that schedules batch jobs and scales the compute they need.
      - id: b
        text: Amazon EC2 Auto Scaling
        why: EC2 Auto Scaling adds and removes instances as demand changes, but it does not plan when jobs run.
      - id: c
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk scales a deployed web application, and it has no notion of queued jobs to schedule.
      - id: d
        text: Amazon Lightsail
        why: Lightsail is a simple hosting bundle for small sites, with no job scheduling at all.
    evidence:
      - It schedules jobs and scales resources to fit them across a fleet such as EC2 instances.
    takeaway: AWS Batch both schedules heavy jobs and scales the compute under them.
    history: []

  - id: q-rh30a1
    version: 1
    status: draft
    type: single
    pool: practice
    concept: batch-computing
    note: m03/additional-compute-services
    task: "3.3"
    level: 2
    stem: >-
      The cafe is listing its computing work to see which parts count as batch computing.
      Which item on the list is an example of batch computing?
    options:
      - id: a
        text: Showing the menu page to each guest who opens the site
        why: Serving pages as guests arrive is interactive work answered one request at a time, not a large job run in bulk.
      - id: b
        text: Converting a year of recipe videos into new formats at once
        correct: true
        why: Transcoding a large set of videos is heavy work that splits into many jobs run in parallel, which is batch computing.
      - id: c
        text: Checking one customer's loyalty points when they tap the app
        why: A single lookup on demand is a small real-time request, not a large compute-heavy job.
      - id: d
        text: Keeping a small blog online on one low-cost server all month
        why: Hosting a low-traffic site is steady serving work, the kind of job a simple hosting bundle covers.
    evidence:
      - It fits parallel work like genomics, media transcoding and ML training.
      - "**Batch computing**: running large, compute-heavy jobs, often in parallel."
    takeaway: Batch computing means large, compute-heavy jobs run in bulk, often in parallel, such as transcoding media.
    history: []

  - id: q-7wek7w
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: batch-computing
    note: m03/additional-compute-services
    task: "3.3"
    level: 1
    select: 2
    stem: >-
      The cafe's owner hears the data team mention batch computing at a planning meeting.
      Which descriptions match that term?
    options:
      - id: a
        text: Splitting a large workload into many jobs that run side by side
        correct: true
        why: Batch work is often broken into parallel jobs so a large workload finishes sooner.
      - id: b
        text: Answering each customer request the moment it reaches the app
        why: Handling requests one by one as they arrive is interactive serving, not batch work.
      - id: c
        text: Working through heavy tasks such as simulations or model training
        correct: true
        why: Simulations and model training are compute-heavy jobs, the typical load of batch computing.
      - id: d
        text: Keeping one small server online for a site with few visitors
        why: A single server for light traffic is simple hosting, with no large jobs to process.
      - id: e
        text: Running AWS hardware inside the cafe's own data center
        why: AWS hardware on premises describes a hybrid setup, which says nothing about how jobs are run.
    evidence:
      - "**Batch computing**: running large, compute-heavy jobs, often in parallel."
      - A fully managed service for heavy compute such as huge datasets, simulations and complex math.
    takeaway: Batch computing is large, compute-heavy work, often split into jobs that run in parallel.
    history: []

  - id: q-wz0hrz
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-lightsail
    note: m03/additional-compute-services
    task: "3.3"
    level: 3
    stem: >-
      The cafe's owner wants a small recipe blog with a predictable monthly bill.
      The owner wants no load balancer or scaling setup and would rather avoid the full AWS Management Console.
      Which service fits?
    options:
      - id: a
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk builds load-balanced, auto-scaled environments, which is more setup than a small blog needs and has no set monthly price.
      - id: b
        text: Amazon Lightsail
        correct: true
        why: Lightsail bundles a virtual private server with storage and networking for a predictable monthly price, made for small sites.
      - id: c
        text: Amazon EC2
        why: Raw EC2 leaves setup and scaling to the owner and is managed through the full console, the opposite of this wish.
      - id: d
        text: AWS Outposts
        why: Outposts puts AWS infrastructure in the customer's own data center, far beyond a small blog's needs.
    evidence:
      - "A cost-effective bundle: virtual private servers (VPSs) plus storage, databases and networking, for a predictable monthly price."
      - It fits blogs, small or low-traffic sites, and dev and test.
    takeaway: A small site with a predictable monthly bill and little setup points to Lightsail, not Elastic Beanstalk.
    history: []

  - id: q-q8pksw
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-lightsail
    note: m03/additional-compute-services
    task: "3.3"
    level: 1
    stem: >-
      What does an Amazon Lightsail plan give a customer?
    options:
      - id: a
        text: A function runtime that bills only for each request it handles
        why: Billing per request for running functions describes AWS Lambda, not a Lightsail plan.
      - id: b
        text: A fleet of instances that is scheduled to work through queued jobs
        why: Scheduling queued jobs across a fleet is what AWS Batch does.
      - id: c
        text: A virtual private server with storage, databases and networking
        correct: true
        why: Each Lightsail plan packs a VPS together with the storage, database and network pieces it needs, for one steady monthly fee.
      - id: d
        text: AWS-managed racks installed inside the customer's own data center
        why: Racks in the customer's data center describe AWS Outposts, the hybrid option.
    evidence:
      - "A cost-effective bundle: virtual private servers (VPSs) plus storage, databases and networking, for a predictable monthly price."
    takeaway: A Lightsail plan packs a VPS with its storage, database and network pieces for one steady monthly fee.
    history: []

  - id: q-a16vhy
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-outposts
    note: m03/additional-compute-services
    task: "3.1"
    level: 3
    stem: >-
      A rule says the cafe chain's payment records must stay inside its own data center.
      The chain still wants to run AWS compute and storage there, using the same tools and APIs it uses in the cloud.
      Which service fits?
    options:
      - id: a
        text: AWS Snow Family
        why: Snow Family devices carry data offline to AWS, rather than running AWS services in the data center for good.
      - id: b
        text: AWS Storage Gateway
        why: Storage Gateway links on-premises systems to storage in AWS, so it does not run AWS compute locally.
      - id: c
        text: AWS Outposts
        correct: true
        why: Outposts brings AWS compute, storage and networking into the chain's own data center with the same tools and APIs.
      - id: d
        text: Amazon Lightsail
        why: Lightsail hosts small sites inside AWS, so the payment records would leave the chain's data center.
    evidence:
      - A fully managed hybrid cloud offering that brings AWS compute, storage and networking into your data center.
      - AWS services run locally with the same tools and APIs as in the cloud.
      - It fits compliance, data residency, low latency, remote sites and legacy app modernization.
    takeaway: Data that must stay on site, with AWS services running beside it, points to Outposts.
    history: []

  - id: q-haawrq
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-outposts
    note: m03/additional-compute-services
    task: "3.3"
    level: 2
    stem: >-
      The cafe's roastery runs software that controls its roasting machines and needs very fast responses from servers on the factory floor.
      The team wants AWS services to run right there.
      Which compute service fits?
    options:
      - id: a
        text: AWS Batch
        why: AWS Batch schedules heavy jobs on compute in the cloud, so the roastery would still wait on a distant network.
      - id: b
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk deploys apps onto EC2 in an AWS Region, not onto hardware at the roastery.
      - id: c
        text: Amazon Lightsail
        why: Lightsail servers live in AWS, so the machines would still reach them over a longer network path.
      - id: d
        text: AWS Outposts
        correct: true
        why: Outposts places AWS infrastructure on premises, so the control software gets low latency to the machines.
    evidence:
      - It fits compliance, data residency, low latency, remote sites and legacy app modernization.
      - Outposts is the only one of the four on premises.
    takeaway: When AWS services must run on site for low latency, Outposts is the on-premises choice.
    history: []
