  - id: q-rh30a1
    version: 1
    status: live
    type: single
    pool: practice
    concept: batch-computing
    note: m03/additional-compute-services
    task: "3.3"
    level: 2
    stem: >-
      Each night, the cafe re-encodes its whole library of recipe videos into new formats.
      The heavy work is split into many pieces that run side by side and finish by morning.
      Which term describes this kind of work?
    options:
      - id: a
        text: Edge computing
        why: Edge computing handles data on a rugged device out in the field, not a large overnight run of encoding work.
      - id: b
        text: Serverless computing
        why: Serverless computing describes servers that AWS runs out of sight, not the shape of a large compute-heavy workload.
      - id: c
        text: Batch computing
        correct: true
        why: Encoding a whole video library is a large, compute-heavy workload run in parallel pieces, which is batch computing.
      - id: d
        text: End-user computing
        why: End-user computing gives staff remote desktops and apps, not heavy processing that runs overnight.
    evidence:
      - It fits parallel work like genomics, media transcoding and ML training.
      - "**Batch computing**: running large, compute-heavy jobs, often in parallel."
    takeaway: Batch computing means large, compute-heavy jobs run in bulk, often in parallel, such as transcoding media.
    history: []
    verified:
      keyHash: 6421d9053929
      fullHash: 87895571b649
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

