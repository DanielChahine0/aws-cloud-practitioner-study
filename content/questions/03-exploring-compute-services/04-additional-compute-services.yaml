  - id: q-a16vhy
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-outposts
    note: m03/additional-compute-services
    task: "3.1"
    level: 2
    stem: >-
      A rule says the cafe chain's payment records must stay on its own premises.
      The chain still wants to use AWS services on those records, so it picks AWS Outposts.
      What does Outposts give the chain?
    options:
      - id: a
        text: An appliance at its site that links local storage to AWS storage
        why: Linking local storage to AWS storage describes AWS Storage Gateway, which puts copies of the records in AWS.
      - id: b
        text: A rugged device at its site that collects data and ships it to AWS
        why: Shipping data to AWS on a device describes AWS Snow Family, which moves the records off the premises.
      - id: c
        text: A dedicated line from its site that carries traffic privately to AWS
        why: A private line into AWS describes AWS Direct Connect, and the records would still be handled in an AWS Region.
      - id: d
        text: AWS-managed racks at its site that run AWS compute and storage
        correct: true
        why: Outposts brings AWS compute, storage and networking into the chain's own data center, so the records never leave.
    evidence:
      - A fully managed hybrid cloud offering that brings AWS compute, storage and networking into your data center.
      - AWS services run locally with the same tools and APIs as in the cloud.
      - It fits compliance, data residency, low latency, remote sites and legacy app modernization.
    takeaway: Outposts runs AWS compute and storage inside your own data center, so data that must stay on site can stay there.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"

  - id: q-haawrq
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-outposts
    note: m03/additional-compute-services
    task: "3.3"
    level: 3
    stem: >-
      The cafe's roastery runs software that controls its roasting machines and needs very fast responses from nearby servers.
      The team wants AWS compute services to run on the roastery floor itself.
      Which service fits?
    options:
      - id: a
        text: AWS Direct Connect
        why: Direct Connect gives a private link into an AWS Region, but the servers still sit far from the roastery floor.
      - id: b
        text: AWS Storage Gateway
        why: Storage Gateway connects on-premises storage to AWS, so it does not run AWS compute services at the roastery.
      - id: c
        text: AWS Outposts
        correct: true
        why: Outposts places AWS infrastructure on premises, so the control software gets low latency to the machines.
      - id: d
        text: AWS Lambda
        why: Lambda functions run in an AWS Region, so the machines would still reach them over a longer network path.
    evidence:
      - It fits compliance, data residency, low latency, remote sites and legacy app modernization.
      - Outposts is the only one of the four on premises.
    takeaway: When AWS services must run on site for low latency, Outposts is the on-premises choice.
