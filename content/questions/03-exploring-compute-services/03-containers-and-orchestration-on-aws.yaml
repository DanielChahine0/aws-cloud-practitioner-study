      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-gb7f1t
    version: 1
    status: draft
    type: single
    pool: practice
    concept: containers-vs-virtual-machines
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe wants to fit many small services onto each host and have new copies ready within moments during the lunch rush.
      Which property lets containers do this better than virtual machines?
    options:
      - id: a
        text: Packing the runtime and libraries with the code
        why: A virtual machine also holds the app's runtime and libraries, so bundling them is not what makes a container lighter.
      - id: b
        text: Pulling their images from a managed registry
        why: Where the images are kept says nothing about how much of each host a running copy takes or how fast it boots.
      - id: c
        text: Sharing the operating system of the host
        correct: true
        why: With no operating system of its own to boot, each container is light, so more fit on a host and they start quickly.
      - id: d
        text: Being scheduled across a cluster by an orchestrator
        why: An orchestrator places and scales copies, but each copy is no lighter or faster to boot because of it.
    evidence:
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
      - A VM runs its own full OS on a hypervisor, making it heavier and slower to start.
    takeaway: Containers start faster and pack more densely than VMs because they share the host's operating system instead of booting their own.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-kvwxsd
