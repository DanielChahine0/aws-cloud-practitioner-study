        why: How a copy is billed changes the invoice, not how much of the host's memory and CPU each copy takes up.
      - id: b
        text: Each one boots a full operating system of its own
        correct: true
        why: A virtual machine runs its own complete operating system on the hypervisor, so every copy carries that extra weight.
      - id: c
        text: Each one carries its own libraries and settings
        why: Containers also carry their own libraries and settings, so this does not explain why the virtual machines are heavier.
      - id: d
        text: Each one is restarted when a health check fails
        why: Restarting after a failed health check is about recovery, and it adds nothing to the resources a running copy uses.
    evidence:
      - A VM runs its own full OS on a hypervisor, making it heavier and slower to start.
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
    takeaway: A virtual machine is heavier than a container because each one runs a full operating system instead of sharing the host's.
