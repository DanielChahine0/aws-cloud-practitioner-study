  - id: q-15e87q
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-ecr
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 3
    stem: >-
      The cafe builds a new image of its ordering service every week.
      It needs a managed, secure place to keep each version so its orchestrator can pull the right one.
      Which service fits?
    options:
      - id: a
        text: Amazon ECR
        correct: true
        why: ECR is the fully managed registry that keeps images in repositories for orchestrators to pull.
      - id: b
        text: Amazon ECS
        why: ECS pulls images and runs them, but it relies on a registry such as ECR to keep them.
      - id: c
        text: Amazon EKS
        why: EKS runs Kubernetes clusters that pull images, and it is no image store itself.
      - id: d
        text: AWS Fargate
        why: Fargate supplies the compute that runs containers, and it keeps no image versions.
    evidence:
      - A fully managed registry to keep, manage and deploy images, stored securely in repositories.
      - Orchestrators pull images from it, and you push and pull with standard tools and CLIs.
    takeaway: Storing and versioning container images is the job of the registry, Amazon ECR, which orchestrators pull from.
    history: []
  - id: q-ca33xj
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: amazon-ecr
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 1
    select: 2
    stem: >-
      The cafe is about to push its first images to Amazon ECR.
      Which statements about Amazon ECR are accurate?
    options:
      - id: a
        text: The images it stores follow Open Container Initiative standards
        correct: true
        why: ECR expects images that meet the Open Container Initiative standards.
      - id: b
        text: Orchestrators such as Amazon ECS pull images from it
        correct: true
        why: ECR is where orchestrators fetch images from when they start containers.
      - id: c
        text: It schedules containers and scales them with traffic
        why: Scheduling and scaling containers is orchestration, the job of ECS or EKS.
      - id: d
        text: It supplies the servers that the containers run on
        why: The compute under containers comes from EC2 or Fargate, while ECR only stores images.
      - id: e
        text: It needs its own special tool for every push and pull
        why: ECR works with the standard container tools and command line interfaces.
    evidence:
      - Orchestrators pull images from it, and you push and pull with standard tools and CLIs.
      - Images must meet Open Container Initiative (OCI) standards.
    takeaway: Amazon ECR stores OCI images for orchestrators to pull, and it neither runs nor scales containers.
    history: []
  - id: q-a3pe53
    version: 1
    status: draft
    type: single
    pool: practice
    concept: aws-fargate
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 3
    stem: >-
      The cafe runs its containers with Amazon ECS and wants to stop patching and sizing the servers under them.
      It also wants to pay only for the resources its containers use.
      Which option fits?
    options:
      - id: a
        text: AWS Fargate
        correct: true
        why: Fargate is the serverless launch type, so AWS runs the servers and the cafe pays only for the resources used.
      - id: b
        text: Amazon EC2
        why: The EC2 launch type gives full control, but the cafe would keep managing the instances under its containers.
      - id: c
        text: AWS Lambda
        why: Lambda runs code as functions on demand, and it is no launch type for the cafe's ECS containers.
      - id: d
        text: Amazon Lightsail
        why: Lightsail offers simple hosting at a set monthly price, and it is no launch type for ECS containers.
    evidence:
      - "Fargate: serverless, so AWS runs the servers while ECS or EKS orchestrates, and you pay only for resources used."
    takeaway: To run ECS or EKS containers without managing servers, choose the serverless Fargate launch type.
    history: []
  - id: q-c901hx
    version: 1
    status: draft
    type: match
    pool: practice
    concept: aws-fargate
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe is planning four container workloads.
      Match each workload to the orchestrator and launch type that suits it.
    pairs:
      - left: A new web app whose traffic rises and falls
        right: Amazon ECS with AWS Fargate
        why: Fargate removes server care and charges only for what is used, which suits uneven traffic with a streamlined orchestrator.
      - left: An app that needs particular hardware or networking
        right: Amazon ECS with Amazon EC2
        why: The EC2 launch type lets the cafe choose and control the instances, which the special hardware needs.
      - left: Kubernetes work with no servers for the team to run
        right: Amazon EKS with AWS Fargate
        why: EKS keeps Kubernetes, and Fargate takes the servers off the team's hands.
      - left: Large, complex workloads that need fine instance tuning
        right: Amazon EKS with Amazon EC2
        why: EKS gives extra control for big setups, and EC2 allows the deep instance tuning they ask for.
    evidence:
      - "EC2: you manage the VMs under your containers, for full control plus upkeep."
      - "Fargate: serverless, so AWS runs the servers while ECS or EKS orchestrates, and you pay only for resources used."
    takeaway: Pick Fargate when nobody should manage servers, and EC2 when the workload needs control over its instances.
    history: []
