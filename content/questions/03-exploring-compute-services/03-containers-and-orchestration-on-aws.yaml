questions:
  - id: q-pbjmvk
    version: 1
    status: live
    type: single
    pool: practice
    concept: containers
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe's ordering app works on a developer's laptop, then breaks on the test server because a library there is a different version.
      Which approach makes the app behave the same wherever it runs?
    options:
      - id: a
        text: Package the app as a container image
        correct: true
        why: A container carries the code together with its runtime, libraries and settings, so every host runs the same environment.
      - id: b
        text: Move the app to a larger instance type
        why: A bigger instance adds CPU and memory, but the library mismatch between the machines stays exactly as it was.
      - id: c
        text: Add the servers to an Auto Scaling group
        why: An Auto Scaling group changes how many servers run, while each server still carries its own mismatched library.
      - id: d
        text: Run the test copy on a Dedicated Host
        why: A Dedicated Host changes who shares the hardware, and it does nothing to align the software the app depends on.
    evidence:
      - A container packs code, runtime, dependencies and configuration into one isolated unit that runs the same anywhere.
    takeaway: When an app fails only because environments differ, packaging it as a container gives every host the same environment.
    history: []
    verified:
      keyHash: 37285be865bf
      fullHash: 176209583ffa
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-nddyse
    version: 1
    status: live
    type: multi
    pool: practice
    concept: containers
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    select: 2
    stem: >-
      The cafe's menu service must behave the same on a developer's laptop, on the test server and in production.
      Which properties of a container make that happen?
    options:
      - id: a
        text: It shares the kernel of the host it runs on
        why: Using the host's kernel keeps a container light, but it does nothing to make the service match across machines.
      - id: b
        text: It packs the runtime and libraries with the code
        correct: true
        why: With the runtime and libraries inside the container, every machine runs the service against the same versions.
      - id: c
        text: It boots faster than a full virtual machine
        why: A quick start helps during a rush, yet a service that starts fast can still break on a host with different software.
      - id: d
        text: It carries the settings that the service reads
        correct: true
        why: Because the settings travel inside the container, the laptop, the test server and production all read the same ones.
      - id: e
        text: It is restarted by an orchestrator after a crash
        why: Restarting a failed container keeps it running, but it leaves any difference between the machines in place.
    evidence:
      - A container packs code, runtime, dependencies and configuration into one isolated unit that runs the same anywhere.
    takeaway: A container behaves the same on every host because it carries its runtime, dependencies and configuration with the code.
    history: []
    verified:
      keyHash: f398a3a4e76b
      fullHash: 280ca2291867
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-gb7f1t
    version: 1
    status: live
    type: single
    pool: practice
    concept: containers-vs-virtual-machines
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe wants to fit many small services onto each server and have new copies ready within moments during the lunch rush.
      Which property lets containers do this better than virtual machines?
    options:
      - id: a
        text: Packing the runtime and libraries with the code
        why: A virtual machine also holds the app's runtime and libraries, so bundling them is not what makes a container lighter.
      - id: b
        text: Pulling their images from a managed registry
        why: Where the images are kept says nothing about how much of each host a running copy takes or how fast it boots.
      - id: c
        text: Sharing the operating system of the host
        correct: true
        why: With no operating system of its own to boot, each container is light, so more fit on a host and they start quickly.
      - id: d
        text: Being scheduled across hosts by an orchestrator
        why: An orchestrator places and scales copies, but each copy is no lighter or faster to boot because of it.
    evidence:
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
      - A VM runs its own full OS on a hypervisor, making it heavier and slower to start.
    takeaway: Containers start faster and pack more densely than VMs because they share the host's operating system instead of booting their own.
    history: []
    verified:
      keyHash: 8dc0e8e89c43
      fullHash: 59583660ad46
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
