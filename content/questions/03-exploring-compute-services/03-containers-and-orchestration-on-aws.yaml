      - id: d
        text: Scaling the containers with traffic
        correct: true
        why: Scaling adds copies as orders climb at lunch and removes them when the rush is over.
    evidence:
      - Containers do not scale themselves, so orchestrators run their lifecycle across a cluster, scale them with traffic, and handle recovery, monitoring and updates.
    takeaway: An orchestrator scales containers with traffic, alongside its recovery, monitoring and update duties.
