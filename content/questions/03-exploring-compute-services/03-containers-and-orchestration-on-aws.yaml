  - id: q-w2w9fc
    version: 1
    status: draft
    type: single
    pool: practice
    concept: container-orchestration
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe began with a handful of containers on a single EC2 instance and now runs thousands across many instances.
      Its staff spend their days restarting failed containers and adding more by hand when orders spike.
      Which fact about containers explains why the cafe now needs an orchestrator?
    options:
      - id: a
        text: They rely on their host for the operating system
        why: Using the host's operating system is what keeps containers light, and it has nothing to do with restarts or scaling.
      - id: b
        text: They rely on a registry to keep their images
        why: A registry stores images for later runs, while the staff's burden is keeping the running containers healthy and sized.
      - id: c
        text: They rely on a launch type for their compute
        why: The launch type supplies the compute under the containers, and it does not restart them or add copies.
      - id: d
        text: They rely on another tool to scale and recover
        correct: true
        why: Containers neither scale nor heal themselves, so at this size an orchestrator must take over recovery and scaling.
    evidence:
      - That breaks down once a few containers on one host become thousands on many.
      - Containers do not scale themselves, so orchestrators run their lifecycle across a cluster, scale them with traffic, and handle recovery, monitoring and updates.
    takeaway: Containers cannot scale or recover on their own, so once they multiply across many hosts an orchestrator must manage them.
