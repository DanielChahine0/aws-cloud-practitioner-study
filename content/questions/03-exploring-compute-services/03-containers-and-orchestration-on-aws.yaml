questions:
  - id: q-pbjmvk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: containers
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe's ordering app works on a developer's laptop, then breaks on the test server because a library there is a different version.
      Which approach makes the app behave the same wherever it runs?
    options:
      - id: a
        text: Ship the app inside a container with its libraries
        correct: true
        why: A container carries the code together with its runtime, libraries and settings, so every host runs the same environment.
      - id: b
        text: Move the app onto a larger EC2 instance type
        why: A bigger instance adds CPU and memory, but the library mismatch between the machines stays exactly as it was.
      - id: c
        text: Put the app servers in an Auto Scaling group
        why: An Auto Scaling group changes how many servers run, while each server still carries its own mismatched library.
      - id: d
        text: Run the test copy of the app on a Dedicated Host
        why: A Dedicated Host changes who shares the hardware, and it does nothing to align the software the app depends on.
    evidence:
      - A container packs code, runtime, dependencies and configuration into one isolated unit that runs the same anywhere.
    takeaway: When an app fails only because environments differ, packaging it as a container gives every host the same environment.
    history: []
  - id: q-nddyse
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: containers
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 1
    select: 2
    stem: >-
      The cafe is packaging its menu service as a container for the first time.
      Which items travel inside that container together with the service's code?
    options:
      - id: a
        text: The runtime the code needs
        correct: true
        why: The runtime is part of what a container bundles, so the code finds the same runtime on every host.
      - id: b
        text: The libraries the code depends on
        correct: true
        why: Dependencies are packed into the container, which is what keeps the service from breaking on a new host.
      - id: c
        text: A full guest operating system
        why: A container shares the operating system of its host, while a full guest operating system belongs to a virtual machine.
      - id: d
        text: The hypervisor that hosts it
        why: A hypervisor is the layer under virtual machines, and it is never packed inside a container.
      - id: e
        text: The physical server it runs on
        why: The container is a software package, so the hardware under it stays outside and can change from host to host.
    evidence:
      - A container packs code, runtime, dependencies and configuration into one isolated unit that runs the same anywhere.
      - "Container: a portable, isolated package of an app with all it needs to run."
    takeaway: A container bundles code with its runtime, dependencies and configuration, while the host supplies the operating system.
    history: []
  - id: q-gb7f1t
    version: 1
    status: draft
    type: single
    pool: practice
    concept: containers-vs-virtual-machines
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe wants to fit many small services onto each host and have new copies ready within moments during the lunch rush.
      Why do containers suit this better than virtual machines?
    options:
      - id: a
        text: They share the operating system of their host
        correct: true
        why: Sharing the host's operating system keeps each container light, so more fit on a host and they start quickly.
      - id: b
        text: They each boot a complete operating system
        why: Booting a complete operating system is what makes a virtual machine heavier and slower, the opposite of this need.
      - id: c
        text: They each run on a hypervisor of their own
        why: The hypervisor is the layer under virtual machines, and it adds weight rather than explaining why containers start fast.
      - id: d
        text: They need no configuration files to run
        why: Containers still rely on configuration, so skipping it is no reason they start faster.
    evidence:
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
    takeaway: Containers start faster and pack more densely than VMs because they share the host's operating system.
    history: []
  - id: q-kvwxsd
    version: 1
    status: draft
    type: match
    pool: practice
    concept: containers-vs-virtual-machines
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 1
    stem: >-
      The cafe's new developer is sorting out the words used for ways to run its apps.
      Match each term to its description.
    pairs:
      - left: Container
        right: Uses its host's operating system and starts quickly
        why: A container leaves the operating system to its host, which keeps it light and quick to launch.
      - left: Virtual machine
        right: Boots its own complete operating system and starts more slowly
        why: A virtual machine carries a full operating system of its own, which makes it heavier to start.
      - left: Hypervisor
        right: Layer that lets each virtual machine have its own operating system
        why: The hypervisor sits under the virtual machines and lets every one of them run a separate operating system.
    evidence:
      - Containers share the host's OS, so they are lighter, start faster and use resources better.
      - A VM runs its own full OS on a hypervisor, making it heavier and slower to start.
    takeaway: Containers borrow the host's operating system, while each VM brings its own on top of a hypervisor.
    history: []
  - id: q-w2w9fc
    version: 1
    status: draft
    type: single
    pool: practice
    concept: container-orchestration
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe began with a handful of containers on a single EC2 instance and now runs thousands across many instances.
      Its staff spend their days restarting failed containers and adding more by hand when orders spike.
      What does the cafe need?
    options:
      - id: a
        text: A container orchestration service
        correct: true
        why: An orchestrator runs container lifecycles across a cluster, replaces failed ones and scales them with traffic.
      - id: b
        text: A container image registry service
        why: A registry keeps the images the cafe builds, but it never restarts or scales the running containers.
      - id: c
        text: A larger instance type for each host
        why: Bigger hosts still leave every restart and every scaling step to the cafe's staff.
      - id: d
        text: A hypervisor for each container host
        why: A hypervisor runs virtual machines, and it does nothing to watch over or scale containers.
    evidence:
      - That breaks down once a few containers on one host become thousands on many.
      - Containers do not scale themselves, so orchestrators run their lifecycle across a cluster, scale them with traffic, and handle recovery, monitoring and updates.
    takeaway: Once containers multiply across many hosts, an orchestrator takes over their health, scaling and updates.
    history: []
  - id: q-fqhfca
    version: 1
    status: draft
    type: single
    pool: practice
    concept: container-orchestration
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 1
    stem: >-
      Which job does container orchestration take over from the team that runs the containers?
    options:
      - id: a
        text: Keeping containers healthy and scaling them with demand
        correct: true
        why: Orchestration manages the lifecycle of many containers, including recovery and scaling as traffic changes.
      - id: b
        text: Storing and versioning the images that containers start from
        why: Keeping and versioning images is the work of a container registry, a separate tool from the orchestrator.
      - id: c
        text: Bundling the code and its libraries into one portable package
        why: Bundling the app is what building a container image does, before any orchestrator gets involved.
      - id: d
        text: Running each workload on its own complete operating system
        why: A complete operating system per workload describes virtual machines, which orchestration does not provide.
    evidence:
      - "Container orchestration: automated lifecycle, scaling and health management for many containers."
    takeaway: Orchestration automates the lifecycle, health and scaling of many containers, separate from building or storing images.
    history: []
  - id: q-ph0mv3
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-ecs
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 3
    stem: >-
      The cafe's small team has never used Kubernetes and has no plan to.
      It wants a streamlined AWS orchestrator that fits closely with other AWS services to run its Docker containers.
      Which service fits?
    options:
      - id: a
        text: Amazon ECS
        correct: true
        why: ECS is the streamlined orchestrator built around AWS, and it runs Docker containers with no Kubernetes knowledge needed.
      - id: b
        text: Amazon EKS
        why: EKS runs Kubernetes, which brings extra control the team has said it does not want to learn.
      - id: c
        text: AWS Fargate
        why: Fargate supplies serverless compute under an orchestrator, and it does not orchestrate the containers itself.
      - id: d
        text: Amazon ECR
        why: ECR stores container images, so the team would still need an orchestrator to run them.
    evidence:
      - ECS is the streamlined, integrated orchestrator, for Docker containers and others.
    takeaway: For a streamlined, AWS-integrated orchestrator without Kubernetes, choose Amazon ECS.
    history: []
  - id: q-yb17kn
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-ecs
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 2
    stem: >-
      The cafe keeps its images in Amazon ECR, runs them with Amazon ECS and chooses AWS Fargate as the launch type.
      Which part of that setup does Amazon ECS handle?
    options:
      - id: a
        text: It orchestrates the running containers
        correct: true
        why: ECS is the orchestrator here, so it schedules, scales and manages the containers that Fargate runs.
      - id: b
        text: It keeps and versions the container images
        why: Keeping and versioning images is the job of ECR in this setup, not of the orchestrator.
      - id: c
        text: It supplies the servers that run the containers
        why: With the Fargate launch type, AWS supplies the compute through Fargate, while ECS only orchestrates.
      - id: d
        text: It runs a Kubernetes cluster for the cafe
        why: Running Kubernetes is what Amazon EKS does, while ECS is a separate AWS orchestrator.
    evidence:
      - "AWS groups them as orchestration (ECS, EKS), registry (ECR) and compute (EC2, Fargate, where containers actually run)."
      - "In practice: push images to ECR, pick ECS or EKS, then pick EC2 or Fargate."
    takeaway: In an AWS container setup, ECR stores images, ECS orchestrates them and Fargate or EC2 supplies the compute.
    history: []
  - id: q-seqbtr
    version: 1
    status: draft
    type: single
    pool: practice
    concept: amazon-eks
    note: m03/containers-and-orchestration-on-aws
    task: "3.3"
    level: 3
    stem: >-
      The cafe chain already runs Kubernetes in its own data center and wants a hybrid setup that keeps the same Kubernetes tooling while AWS manages the service.
      Which service fits?
    options:
      - id: a
        text: Amazon EKS
        correct: true
        why: EKS is the fully managed AWS service for Kubernetes, and it suits large or hybrid setups that want that control.
      - id: b
        text: Amazon ECS
        why: ECS is a separate AWS orchestrator, so the chain would have to leave its Kubernetes tooling behind.
      - id: c
        text: AWS Fargate
        why: Fargate only supplies serverless compute under ECS or EKS, and it is no Kubernetes orchestrator by itself.
      - id: d
        text: AWS Lambda
        why: Lambda runs functions on demand, which leaves the chain's Kubernetes workloads with nowhere to go.
    evidence:
      - EKS runs Kubernetes, the open source platform automating container deployment, scaling and management.
      - EKS suits large-scale or hybrid setups that want extra control and flexibility.
    takeaway: Teams already on Kubernetes, or running large or hybrid setups, point to Amazon EKS.
    history: []
