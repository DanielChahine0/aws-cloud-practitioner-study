questions:
  - id: q-aftqd7
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-lambda
    note: m03/aws-lambda
    task: "3.3"
    level: 2
    stem: >-
      The cafe wants a short piece of code to tag each pastry photo a customer uploads to its app.
      The owner has no staff to provision, patch or scale servers.
      Which compute service fits best?
    options:
      - id: a
        text: Amazon EC2
        why: EC2 hands the cafe virtual servers that it must provision, patch and scale itself, which it cannot staff.
      - id: b
        text: AWS Lambda
        correct: true
        why: Lambda runs the uploaded code each time a photo event arrives, with no servers for the cafe to manage.
      - id: c
        text: Amazon Lightsail
        why: Lightsail still gives the cafe a server to keep running and patched, even between photo uploads.
      - id: d
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk deploys an app onto instances in the cafe's account, rather than running a function per upload.
    evidence:
      - Instead, you deploy a function holding your code, and it runs whenever its trigger fires.
      - Lambda plugs easily into other AWS services, so whole apps can run without managing servers.
    takeaway: Short, event-driven code with no servers to look after points to AWS Lambda.
    history: []
    verified:
      keyHash: 85eb395ff1e0
      fullHash: 317e73869a5b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-snsj5r
    version: 1
    status: live
    type: multi
    pool: practice
    concept: aws-lambda
    note: m03/aws-lambda
    task: "2.1"
    level: 2
    select: 3
    stem: >-
      The cafe moves its order-confirmation code onto AWS Lambda.
      Under the shared responsibility model, which tasks does AWS take on?
    options:
      - id: a
        text: Writing and fixing the function's code
        why: The code belongs to the cafe, so keeping it correct stays the cafe's job.
      - id: b
        text: Patching the environment the code runs in
        correct: true
        why: AWS patches, updates and secures the environment beneath a Lambda function.
      - id: c
        text: Granting the function its IAM permissions
        why: The cafe decides which IAM roles and permissions let the function reach other services.
      - id: d
        text: Adding capacity when order volume jumps
        correct: true
        why: Lambda scales up and down by itself as triggers grow, so the cafe adds no capacity.
      - id: e
        text: Choosing the event source for the function
        why: Setting the event source is one of the cafe's own setup steps, so AWS does not pick it.
      - id: f
        text: Allocating resources to each function run
        correct: true
        why: AWS allocates the resources for each run, so the cafe never sizes hosts for the function.
    evidence:
      - AWS patches, updates and secures the underlying environment and allocates its resources.
      - It is highly available and scales up or down by itself, from one trigger to thousands.
      - You own the code and the IAM roles and permissions the function uses to reach other services.
    takeaway: With Lambda, AWS patches, scales and resources the platform, while you own your code, triggers and IAM permissions.
    history: []
    verified:
      keyHash: cdb48fdb5b87
      fullHash: 201125ffcb99
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-096x8d
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-lambda
    note: m03/aws-lambda
    task: "3.3"
    level: 2
    stem: >-
      The cafe's month-end stock reconciliation is one job that runs for several hours and cannot be broken into smaller pieces.
      Which trait of AWS Lambda makes it a poor fit for this job?
    options:
      - id: a
        text: AWS, not the cafe, controls the servers underneath
        why: Handing server upkeep to AWS removes work from the cafe and does not stop a long job from finishing.
      - id: b
        text: Its memory size sets both its speed and its price
        why: Memory only tunes how fast and how costly a run is, so it does not block a multi-hour job.
      - id: c
        text: Each run is stopped after 15 minutes at most
        correct: true
        why: A run cannot pass 15 minutes, so an unsplittable job lasting hours can never finish in one run.
      - id: d
        text: It scales by itself from one trigger to thousands
        why: Automatic scaling handles many runs at once, which does not matter for one long job.
    evidence:
      - A run lasts 15 minutes at most, so work that cannot be split into such chunks may fit elsewhere.
    takeaway: Lambda suits short, event-driven jobs, because one run stops at 15 minutes.
    history: []
    verified:
      keyHash: d62dbf009387
      fullHash: 5e086e7edbde
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-ffkrg4
    version: 1
    status: draft
    type: single
    pool: practice
    concept: lambda-triggers
    note: m03/aws-lambda
    task: "3.3"
    level: 1
    stem: >-
      In AWS Lambda, what is the name for the event, such as a file upload or a new queue message, that makes a function run?
    options:
      - id: a
        text: Runtime
        why: A runtime passes the event to the code once a run has started, and it does not cause the run.
      - id: b
        text: Blueprint
        why: A blueprint is a ready-made template for a function's code, and it never starts a run.
      - id: c
        text: Execution role
        why: An execution role grants the function access to other services, and it never starts a run.
      - id: d
        text: Trigger
        correct: true
        why: A trigger is the event, such as an upload or a queue message, that invokes the function.
    evidence:
      - Instead, you deploy a function holding your code, and it runs whenever its trigger fires.
      - They range from simple events, like an upload or a finished classification, to heavier ones like a live data stream or resizing one image into several resolutions.
    takeaway: A Lambda trigger is the event that starts a function, from a file upload to a data stream.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-aax7kk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: lambda-triggers
    note: m03/aws-lambda
    task: "3.3"
    level: 2
    stem: >-
      The cafe's tills drop each order into an Amazon SQS queue, and a Lambda function prints the kitchen ticket.
      In this setup, what starts each run of the function?
    options:
      - id: a
        text: The developer saving a new version of the code
        why: Saving code updates the function, but it is not the event that starts each ticket run.
      - id: b
        text: The cafe granting the function access to the queue
        why: Granting access lets the function read the queue, but it happens once and starts no runs.
      - id: c
        text: The function finishing the run before it
        why: One run ending does not invoke the next one, since each run waits for its own event.
      - id: d
        text: A new order message landing in the queue
        correct: true
        why: Each new SQS message is the event that invokes the function, so it is the trigger.
    evidence:
      - Each new SQS message invokes a function built from an SQS blueprint.
    takeaway: When a queue feeds Lambda, each new message is the trigger that invokes the function.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-w0fp96
    version: 1
    status: live
    type: single
    pool: practice
    concept: lambda-runtimes
    note: m03/aws-lambda
    task: "3.3"
    level: 1
    stem: >-
      Which Lambda component works for one programming language, handing a function the invocation event and context, then passing the function's reply back to Lambda?
    options:
      - id: a
        text: Event source
        why: An event source is where the invoking event comes from, and it does not hand the event to the code.
      - id: b
        text: Execution role
        why: An execution role grants access to other services, and it carries no events or replies.
      - id: c
        text: Runtime
        correct: true
        why: A runtime is the per-language go-between that feeds the function its event and returns the reply.
      - id: d
        text: CloudWatch Logs
        why: CloudWatch Logs records each run after the fact, and it does not pass data into the function.
    evidence:
      - "Each runtime is a go-between for one language: it hands your function the invocation event and context details, then returns the function's reply to Lambda."
    takeaway: A Lambda runtime is the per-language bridge that feeds a function its event and returns its reply.
    history: []
    verified:
      keyHash: 923029ba5834
      fullHash: 7edeb78c04fc
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-5zkc17
    version: 1
    status: draft
    type: single
    pool: practice
    concept: lambda-runtimes
    note: m03/aws-lambda
    task: "3.3"
    level: 2
    stem: >-
      The cafe's developer wants to write a function in a language outside Lambda's built-in set.
      The developer wants to keep both that language and Lambda.
      What should the developer do?
    options:
      - id: a
        text: Rewrite the code in Python before uploading it
        why: Rewriting in Python keeps Lambda but gives up the language the developer wants to keep.
      - id: b
        text: Move the code onto an Amazon EC2 instance
        why: EC2 can run any language, but moving there means leaving Lambda, which the developer wants to keep.
      - id: c
        text: Build a custom runtime for the language
        correct: true
        why: Lambda accepts runtimes you build yourself, so a language outside the built-in set can still run there.
      - id: d
        text: Start from a blueprint written in the language
        why: A blueprint presets code for a runtime Lambda already has, so it adds no new language.
    evidence:
      - "The course says Lambda supports any language: Java, Python and Node.js come built in, and you can build a custom runtime."
    takeaway: When no built-in Lambda runtime covers a language, a custom runtime fills the gap.
    history: []
