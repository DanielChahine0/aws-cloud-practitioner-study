  - id: q-8t8v26
    version: 1
    status: live
    type: single
    pool: practice
    concept: lambda-functions
    note: m03/aws-lambda
    task: "3.3"
    level: 1
    stem: >-
      When you start using AWS Lambda, what becomes a Lambda function?
    options:
      - id: a
        text: The event source you connect to it
        why: An event source is the trigger that invokes a function, not the function itself.
      - id: b
        text: The memory size you allocate to it
        why: Memory size is a setting of the function that tunes performance and price, not the function.
      - id: c
        text: The code you upload to the service
        correct: true
        why: Lambda turns the code you upload into a function that it runs when triggered.
      - id: d
        text: The log group that records its runs
        why: A log group in CloudWatch Logs only records what each run did.
    evidence:
      - 1) Upload code, which becomes a function.
    takeaway: A Lambda function is simply your uploaded code, ready to run when its trigger fires.
