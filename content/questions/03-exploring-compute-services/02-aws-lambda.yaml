  - id: q-m4941x
    version: 1
    status: live
    type: match
    pool: practice
    concept: lambda-functions
    note: m03/aws-lambda
    task: "3.3"
    level: 2
    stem: >-
      The cafe is setting up a Lambda function that reads order messages from a queue.
      Match each piece of the setup to the part it plays.
    pairs:
      - left: Lambda function
        right: The cafe's own code that runs each time an order arrives
        why: The function is the uploaded code itself, which Lambda runs on each trigger.
      - left: Execution role
        right: The IAM identity whose permissions let the code read the order queue
        why: An execution role grants the function access to other services, such as the queue.
      - left: Blueprint
        right: A ready-made template the cafe can start the code from
        why: A blueprint presets code and a runtime, so the cafe does not start from a blank function.
      - left: CloudWatch Logs
        right: The record that shows each order was handled
        why: CloudWatch Logs keeps a log of every run, which confirms each message was processed.
    evidence:
      - Each new SQS message invokes a function built from an SQS blueprint.
      - An execution role lets the function read the queue.
      - The queue emptied almost at once, and CloudWatch logs confirmed each message was processed.
    takeaway: A Lambda function is your code, given access by an execution role, often started from a blueprint and logged per run.
    history: []
    verified:
      keyHash: e9f356c541b6
      fullHash: 8bf083f664f5
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-kbhg01
    version: 1
    status: draft
    type: single
    pool: practice
    concept: lambda-pricing
    note: m03/aws-lambda
    task: "4.1"
    level: 1
    stem: >-
      Which setting chosen for an AWS Lambda function sets the price of each millisecond it runs?
    options:
      - id: a
        text: The trigger that invokes it
        why: The trigger decides when a run starts, and it does not change what each millisecond costs.
      - id: b
        text: The runtime its code uses
        why: The runtime only picks the language bridge, and the course ties the price to another setting.
      - id: c
        text: The memory allocated to it
        correct: true
        why: Lambda bills run time per millisecond at a price set by the memory allocated to the function.
      - id: d
        text: The execution role it has
        why: The execution role only grants access to other services, and it has no effect on price.
    evidence:
      - 4) You pay for compute time only, per millisecond, priced by allocated memory.
    takeaway: Lambda compute is billed per millisecond of run time, at a rate set by the memory you allocate.
    history: []
    review:
      attempts: 2
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-dvjppr
    version: 1
    status: draft
    type: single
    pool: practice
    concept: lambda-pricing
    note: m03/aws-lambda
    task: "4.1"
    level: 2
    stem: >-
      The cafe runs several jobs on AWS.
      Which job gains the most from AWS Lambda billing only for the time its code runs?
    options:
      - id: a
        text: Serving a stock database at full load day and night
        why: A job that is busy every hour leaves no idle time, so paying only for run time saves nothing.
      - id: b
        text: Sending receipts as orders arrive, with none overnight
        correct: true
        why: Receipts run only when orders arrive, so the quiet overnight hours add nothing to the bill.
      - id: c
        text: Running a stock audit that takes hours in one go
        why: One run stops at 15 minutes, so an unbroken job lasting hours cannot run on Lambda at all.
      - id: d
        text: Hosting an old app that needs full control of its server
        why: Lambda gives the cafe no server to control, so this app needs a different compute service.
    evidence:
      - 3) Code runs only on events, while Lambda handles servers and scaling.
      - 4) You pay for compute time only, per millisecond, priced by allocated memory.
    takeaway: With Lambda's pay-per-use billing, only the time code spends running adds to the compute bill.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
