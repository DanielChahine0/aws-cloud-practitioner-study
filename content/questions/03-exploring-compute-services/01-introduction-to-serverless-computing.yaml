  - id: q-43kfy4
    version: 1
    status: live
    type: single
    pool: practice
    concept: managed-services
    note: m03/introduction-to-serverless-computing
    task: "2.1"
    level: 3
    stem: >-
      The cafe sets up a database service on AWS, and its team must choose the server size and storage up front.
      After that, AWS patches and operates the service day to day.
      Which service model does this describe?
    options:
      - id: a
        text: An unmanaged service
        why: An unmanaged service would leave patching and daily operation with the cafe, but AWS does that work here.
      - id: b
        text: A managed service
        correct: true
        why: A managed service takes over the daily operation while leaving some provisioning, such as server size, with the customer.
      - id: c
        text: A fully managed service
        why: A fully managed service leaves no servers to provision, yet here the cafe has to pick the server size itself.
      - id: d
        text: An on-premises service
        why: An on-premises service runs on the cafe's own hardware, so AWS would not be patching or operating it.
    evidence:
      - "Managed: AWS absorbs much of the operational overhead, though some provisioning or configuration may remain yours depending on the service."
      - "Fully managed, like serverless Lambda: there are no servers for you to provision or manage, and AWS also covers scaling and availability."
    takeaway: A managed service removes daily operations, but some provisioning, like choosing server size, can still fall to the customer.
    history: []
    verified:
      keyHash: ac4029f1875e
      fullHash: 8e4ac57029c3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-mntxx3
    version: 1
    status: live
    type: single
    pool: practice
    concept: managed-services
    note: m03/introduction-to-serverless-computing
    task: "1.4"
    level: 2
    stem: >-
      The cafe's two-person tech team is deciding whether to run a message queue on EC2 instances it manages or to use a managed queue service instead.
      What does the managed option trade?
    options:
      - id: a
        text: More control in return for more upkeep
        why: That is the trade of running the queue on its own EC2 instances, the opposite direction from a managed service.
      - id: b
        text: Less control in return for faster speed
        why: The managed option is not chosen for speed; what the team gives up control for is less operational work.
      - id: c
        text: Less control in return for less upkeep
        correct: true
        why: Moving toward managed means handing AWS the day-to-day running in return for fewer settings the team can change.
      - id: d
        text: More upkeep in return for lower speed
        why: A managed service takes upkeep away from the team rather than adding it, and speed is not what is traded.
    evidence:
      - Each step toward managed trades control for convenience, so pick what your app needs.
      - Managed services cut infrastructure work, though some setup may remain.
    takeaway: Choosing a managed service swaps some control and customization for less operational effort.
