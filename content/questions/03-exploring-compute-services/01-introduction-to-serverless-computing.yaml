questions:
  - id: q-816djf
    version: 1
    status: live
    type: single
    pool: practice
    concept: unmanaged-services
    note: m03/introduction-to-serverless-computing
    task: "2.1"
    level: 2
    stem: >-
      The cafe hosts its online ordering site on Amazon EC2 instances.
      A security fix comes out for the firmware in the physical servers beneath those instances.
      Who is expected to apply it?
    options:
      - id: a
        text: The cafe's tech team
        why: The cafe looks after what runs on its instances, while the physical servers under them belong to AWS.
      - id: b
        text: The cafe's IT contractor
        why: A contractor can only take on the cafe's own share, and the physical servers under EC2 are outside that share.
      - id: c
        text: AWS's operations staff
        correct: true
        why: Even with an unmanaged service like EC2, AWS runs the physical layer, so firmware on the host servers is its job.
      - id: d
        text: The cafe and AWS jointly
        why: The physical layer is not split between the two, since AWS alone runs the hardware beneath EC2 instances.
    evidence:
      - You get fine control, but patching, scaling and the OS are yours while AWS runs the hardware.
      - "Unmanaged, like EC2: AWS covers the physical layer, while each instance's OS, network setup and apps are yours to set up, secure and maintain."
    takeaway: Even on an unmanaged service like EC2, AWS keeps the physical layer, while the customer handles everything on each instance.
    history: []
    verified:
      keyHash: 6808d24a33b7
      fullHash: b8d0cf028190
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-k7zz5h
