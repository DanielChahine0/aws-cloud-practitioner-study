  - id: q-byjscg
    version: 1
    status: live
    type: single
    pool: practice
    concept: serverless-computing
    note: m03/introduction-to-serverless-computing
    task: "3.3"
    level: 1
    stem: >-
      A developer tells the cafe's owner that the new app will run on machines the cafe never sees or touches.
      AWS will provision, scale and maintain all of them.
      Which term names this approach?
    options:
      - id: a
        text: Hybrid deployment
        why: A hybrid deployment links in-house resources with the cloud, so the cafe would still see and run some servers.
      - id: b
        text: Serverless computing
        correct: true
        why: Serverless computing runs apps on hidden servers that AWS provisions, scales and maintains for the customer.
      - id: c
        text: Edge networking
        why: Edge networking places compute and storage near users, which says nothing about who looks after the servers.
      - id: d
        text: Container orchestration
        why: Container orchestration manages the lifecycle of containers, and it does not by itself hide the servers beneath them.
    evidence:
      - The servers hosting your app are hidden and out of reach.
      - AWS handles provisioning, maintenance, scaling and high availability.
    takeaway: Serverless computing means running apps on servers you never see, while AWS provisions, scales and maintains them.
