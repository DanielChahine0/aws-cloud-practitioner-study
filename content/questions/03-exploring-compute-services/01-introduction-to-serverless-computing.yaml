  - id: q-hbhw20
    version: 1
    status: live
    type: single
    pool: practice
    concept: fully-managed-services
    note: m03/introduction-to-serverless-computing
    task: "2.1"
    level: 2
    stem: >-
      The cafe runs its order-confirmation logic on AWS Lambda, a fully managed service.
      A weekend promotion is expected to bring a large rush of orders.
      Who makes sure the logic has enough capacity for the rush?
    options:
      - id: a
        text: The cafe's developers
        why: The developers own the function code, but capacity under a fully managed service is not part of their share.
      - id: b
        text: The cafe's ops staff
        why: With a fully managed service there are no servers for the cafe to provision, so its ops staff have nothing to add.
      - id: c
        text: AWS on its own
        correct: true
        why: Under a fully managed service like Lambda, AWS alone covers scaling, so the extra orders get capacity without the cafe acting.
      - id: d
        text: The cafe and AWS jointly
        why: Scaling is not shared here, since a fully managed service puts it wholly with AWS.
    evidence:
      - "Fully managed, like serverless Lambda: there are no servers for you to provision or manage, and AWS also covers scaling and availability."
    takeaway: With a fully managed service like Lambda, AWS handles scaling for demand spikes, so the customer provisions no capacity.
