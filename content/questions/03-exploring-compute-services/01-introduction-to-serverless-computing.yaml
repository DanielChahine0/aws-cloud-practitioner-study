    stem: >-
      A customer runs its workloads on Amazon EC2 instances.
      Which tasks belong to the customer rather than to AWS?
    options:
      - id: a
        text: Updating the operating system
        correct: true
        why: The operating system on each EC2 instance is set up, secured and kept current by the customer.
      - id: b
        text: Maintaining the host servers
        why: The physical layer under EC2 is run by AWS, so host maintenance is not the customer's work.
      - id: c
        text: Configuring the network setup
        correct: true
        why: With an unmanaged service, the network setup of each instance is part of the customer's share.
      - id: d
        text: Guarding the building entrances
        why: Physical security of the facilities belongs to AWS under every service model.
      - id: e
        text: Installing the web application
        correct: true
        why: The apps that run on an EC2 instance are the customer's to set up, secure and maintain.
      - id: f
        text: Replacing failed disk drives
        why: Broken hardware under an instance is part of the physical layer, so AWS swaps it out.
    evidence:
      - "Unmanaged, like EC2: AWS covers the physical layer, while each instance's OS, network setup and apps are yours to set up, secure and maintain."
    takeaway: With EC2, the customer owns each instance's operating system, network setup and applications, and AWS owns the physical layer.
