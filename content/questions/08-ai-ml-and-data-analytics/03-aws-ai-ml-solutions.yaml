    stem: >-
      The cafe has no data scientists, and it wants to start sorting customer reviews by mood next week.
      Which approach gets it there fastest?
    options:
      - id: a
        text: Amazon SageMaker AI
        why: SageMaker AI asks the team to build and train its own model, which needs ML skill the cafe lacks.
      - id: b
        text: Amazon Comprehend
        correct: true
        why: Comprehend comes pre-trained to read sentiment in text, so the cafe can sort reviews by mood with no ML staff.
      - id: c
        text: Amazon Personalize
        why: Personalize is pre-trained too, but it makes per-customer picks rather than reading the mood of a review.
      - id: d
        text: Amazon Polly
        why: Polly is a ready-made service, but it turns text into speech and judges nothing about how a review feels.
    evidence:
      - Ready-made and fastest to deploy; later tiers add customization and need more skill.
      - "**Amazon Comprehend**: Text insights, such as sentiment."
    takeaway: A team with no ML skill that needs review sentiment fast fits a pre-trained AI service such as Comprehend.
