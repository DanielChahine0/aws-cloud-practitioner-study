      - id: c
        text: Raw data goes in, and cleaned data comes out.
        why: Cleaning prepares data ahead of training and is not what a model does when it runs.
      - id: d
        text: Sales data goes in, and a fixed rule comes out.
        why: Producing a fixed rule is the job of a developer in classical programming, not a model.
    evidence:
      - "Inference: the model gets new data, like a fresh order, and predicts or decides."
      - "**Inference**: Applying a trained model to new data."
    takeaway: Inference takes new data into a trained model and returns a prediction or decision.
