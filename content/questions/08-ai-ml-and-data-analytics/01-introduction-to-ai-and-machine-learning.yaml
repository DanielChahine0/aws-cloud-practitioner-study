questions:
  - id: q-gmg2z6
    version: 1
    status: live
    type: single
    pool: practice
    concept: artificial-intelligence
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 1
    stem: >-
      Which term names the wide field of computer systems built to carry out
      tasks that normally take a person?
    options:
      - id: a
        text: Machine learning
        why: Machine learning is one narrower branch of this field, not the whole field itself.
      - id: b
        text: Artificial intelligence
        correct: true
        why: AI is the umbrella field for computer systems that perform humanlike tasks.
      - id: c
        text: Natural language processing
        why: NLP covers understanding human language, which is only one humanlike task.
      - id: d
        text: Classical programming
        why: Classical programming hand-codes fixed rules and is not a field of humanlike systems.
    evidence:
      - "AI: the broad field of computer systems that do humanlike tasks."
    takeaway: AI is the broad umbrella for computer systems that perform tasks people normally do.
    history: []
    verified:
      keyHash: 401a58910371
      fullHash: 467ebf021f50
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-am3hnv
    version: 1
    status: live
    type: single
    pool: practice
    concept: artificial-intelligence
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 2
    stem: >-
      The cafe manager reads that the new pastry recommender is built with
      machine learning and asks why that also makes it an AI system. Which
      statement explains it?
    options:
      - id: a
        text: AI kiosks can also take spoken counter orders.
        why: True of conversational AI, but it says nothing about why an ML recommender counts as AI.
      - id: b
        text: AI services on AWS offer pre-built models too.
        why: True of AWS, but pre-built models do not explain how ML relates to the AI field.
      - id: c
        text: ML is one branch inside the wider field of AI.
        correct: true
        why: ML is the part of AI where machines learn tasks from data, so the recommender is also AI.
      - id: d
        text: AI can forecast new hits from social trends.
        why: True of predictive AI, but a forecasting use does not place ML inside the AI field.
    evidence:
      - "AI: the broad field of computer systems that do humanlike tasks."
      - "ML: AI where machines learn complex jobs from data, not spelled-out instructions."
    takeaway: Machine learning is a subset of AI, so an ML recommender is also an AI system.
    history: []
    verified:
      keyHash: 63920374cd4a
      fullHash: 51f1f94e4acf
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-mkqfj1
    version: 1
    status: live
    type: single
    pool: practice
    concept: machine-learning
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 2
    stem: >-
      The cafe wants each regular to get a snack suggestion shaped by that
      person's own past orders, with the system working out the patterns from
      sales records on its own. Which approach fits?
    options:
      - id: a
        text: Classical programming
        why: Hand-written rules give every customer the same pairing and never learn from the records.
      - id: b
        text: Natural language processing
        why: NLP lets a system understand human speech, which does not tailor snacks from order history.
      - id: c
        text: Machine learning
        correct: true
        why: ML learns patterns from data instead of written rules, so it can tailor each suggestion.
      - id: d
        text: Image recognition
        why: Image recognition identifies what is in pictures, and these suggestions come from sales records.
    evidence:
      - "ML: AI where machines learn complex jobs from data, not spelled-out instructions."
      - "Pastry suggestions from each customer's history: an ML recommendation engine, a headline ML use case."
    takeaway: Suggestions tailored per customer from learned patterns in sales data point to machine learning.
    history: []
    verified:
      keyHash: 547b87b79211
      fullHash: 1fb6b4be638c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
