      The cafe wants a counter kiosk where customers say their orders out loud,
      and the kiosk grasps what they mean and suggests an extra add-on. Which AI
      capability lets it understand the spoken order?
    options:
      - id: a
        text: Social trend forecasting
        why: Forecasting predicts future hits from trends and history and does not interpret what a customer says.
      - id: b
        text: Natural language processing
        correct: true
        why: NLP lets the kiosk make sense of human speech so it can take the order and offer add-ons.
      - id: c
        text: Real-time language translation
        why: Translation converts words from one language to another, but grasping an order's meaning is NLP.
      - id: d
        text: Image recognition with cameras
        why: Image recognition works on pictures, and this kiosk has to understand spoken words.
    evidence:
      - A counter kiosk could take spoken orders, enter them in the register for baristas and use natural language processing (NLP) to offer an extra shot or the new seasonal latte.
      - "A kiosk taking spoken orders: conversational AI with NLP."
    takeaway: Understanding customers' spoken words is the job of natural language processing.
