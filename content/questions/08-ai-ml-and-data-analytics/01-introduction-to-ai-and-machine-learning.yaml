  - id: q-1x20c9
    version: 1
    status: live
    type: single
    pool: practice
    concept: ml-model-training
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 2
    stem: >-
      The cafe feeds years of past sales records into an ML system so it can
      uncover buying patterns and produce a model. Which stage is this?
    options:
      - id: a
        text: Inference
        why: Inference uses an existing model on new data, while this step builds the model from history.
      - id: b
        text: Training
        correct: true
        why: Training searches historical data for patterns and outputs a model, which is this step.
      - id: c
        text: Data cleaning
        why: Cleaning prepares the records before training, and it does not search them for patterns or output a model.
      - id: d
        text: Deployment
        why: Deployment puts a finished model into use, and it does not search sales history for patterns.
    evidence:
      - "Training: ML finds hidden customer-sales patterns in lots of history and outputs a model."
    takeaway: Training is the stage where ML finds patterns in historical data and produces a model.
    history: []
