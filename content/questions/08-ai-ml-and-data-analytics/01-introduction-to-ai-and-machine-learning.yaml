        why: ML is the part of AI where machines learn tasks from data, so the recommender is also AI.
      - id: d
        text: AI can forecast new hits from social trends.
        why: True of predictive AI, but a forecasting use does not place ML inside the AI field.
    evidence:
      - "AI: the broad field of computer systems that do humanlike tasks."
      - "ML: AI where machines learn complex jobs from data, not spelled-out instructions."
    takeaway: Machine learning is a subset of AI, so an ML recommender is also an AI system.
