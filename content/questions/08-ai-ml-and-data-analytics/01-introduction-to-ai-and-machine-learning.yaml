    stem: >-
      The cafe wants a machine learning system to suggest snacks. Which
      statements explain why it must first collect clean sales data?
    options:
      - id: a
        text: Inference applies a trained model to new order data.
        why: True, but inference uses a model that already exists and does not explain the need for clean data.
      - id: b
        text: ML learns its patterns from data, not written rules.
        correct: true
        why: ML learns how to do a job from data rather than from spelled-out instructions, so it needs data first.
      - id: c
        text: Amazon SageMaker AI can train a model on sales data.
        why: True, but naming the tool that trains a model does not explain why its data must be clean.
      - id: d
        text: An ML model is only as accurate as its data.
        correct: true
        why: A model learns from its data, so poor or messy data leads to poor predictions.
      - id: e
        text: Pre-built AI services can translate text data.
        why: True, but a pre-built translation service has nothing to do with the cafe's own sales data.
    evidence:
      - "ML: AI where machines learn complex jobs from data, not spelled-out instructions."
      - ML is only as accurate as its data.
    takeaway: ML learns from data rather than written rules, so its accuracy rests on the quality of that data.
