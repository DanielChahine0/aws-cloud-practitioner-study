    stem: >-
      The cafe plans to train a demand model on sales records, social posts and
      customer feedback forms. What has to happen to that data before training
      starts?
    options:
      - id: a
        text: It is searched for hidden buying patterns.
        why: Searching for patterns is what training itself does, so it cannot come before training.
      - id: b
        text: It is gathered, cleaned and formatted.
        correct: true
        why: Training data needs collecting, cleaning and formatting, since a model is only as good as its data.
      - id: c
        text: It is turned into a model that predicts demand.
        why: Producing the model is the output of training, not a step that comes before it.
      - id: d
        text: It is fed to Amazon SageMaker AI for training.
        why: SageMaker AI can train custom models, but feeding data in is training, not the step before it.
    evidence:
      - Training data (sales, social posts, sensors, feedback forms) must be gathered, cleaned and formatted first.
      - ML is only as accurate as its data.
    takeaway: Training data must be gathered, cleaned and formatted before training, because data quality limits accuracy.
