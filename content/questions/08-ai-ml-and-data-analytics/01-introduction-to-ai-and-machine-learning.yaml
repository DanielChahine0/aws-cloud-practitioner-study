      During ML inference, what goes into the model and what comes out?
    options:
      - id: a
        text: New data goes in, and a prediction comes out.
        correct: true
        why: Inference hands fresh data to a trained model, which returns a prediction or decision.
      - id: b
        text: Past data goes in, and a new model comes out.
