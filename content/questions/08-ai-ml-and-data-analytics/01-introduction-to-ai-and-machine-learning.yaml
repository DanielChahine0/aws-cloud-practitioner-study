  - id: q-nqp995
    version: 1
    status: live
    type: single
    pool: practice
    concept: classical-programming
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 3
    stem: >-
      The cafe's register always offers a blueberry muffin to anyone who buys a
      mocha, because a developer wrote that pairing into the code after looking
      at last year's sales. Which approach does the register use?
    options:
      - id: a
        text: Machine learning
        why: ML would learn patterns itself and could fit the offer to each customer, not apply one coded pairing.
      - id: b
        text: Classical programming
        correct: true
        why: A developer hard-coded one fixed rule from past sales, which is classical programming.
      - id: c
        text: Conversational AI
        why: Conversational AI adapts to a customer's replies, while this register follows one set rule.
      - id: d
        text: Model inference
        why: Inference applies a trained model to new data, but no model was trained here.
    evidence:
      - Classical programming hard-codes a rule from past pairings (a cheese Danish with every caramel latte), ignoring the individual customer and product.
      - A fixed pairing rule is classical programming, while per-customer suggestions come from ML.
    takeaway: A fixed pairing rule written into code from past sales is classical programming, not ML.
    history: []
    verified:
      keyHash: b32c564a9263
      fullHash: d62e477af01b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

