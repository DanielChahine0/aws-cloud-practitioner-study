    concept: ml-inference
    note: m08/introduction-to-ai-and-machine-learning
    task: "3.7"
    level: 3
    stem: >-
      A customer places an order in the cafe app, and the cafe's already-built
      model uses that order to suggest a pastry right away. Which ML stage is
      happening?
    options:
      - id: a
        text: Training
        why: Training builds the model from history, and this model already exists before the order arrives.
      - id: b
        text: Data cleaning
        why: Cleaning prepares data before training, and it makes no suggestion for a live order.
      - id: c
        text: Data gathering
        why: Gathering collects records ahead of training, and it makes no suggestion for a live order.
      - id: d
        text: Inference
        correct: true
        why: Inference feeds new data, such as this order, into a trained model to get a prediction.
    evidence:
      - "Inference: the model gets new data, like a fresh order, and predicts or decides."
      - Training builds a model from history, and inference applies it to new data.
    takeaway: Using an existing model on a fresh order to make a suggestion is inference, not training.
