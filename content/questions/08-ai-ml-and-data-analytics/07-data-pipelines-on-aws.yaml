  - id: q-8vc8kr
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-redshift
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 3
    stem: >-
      The cafe chain wants one store for years of structured sales records from every branch, organized for business intelligence reports at petabyte scale.
      Which service fits?
    options:
      - id: a
        text: Amazon S3
        why: S3 is the usual data lake for raw data of any shape, not a warehouse organized for business intelligence.
      - id: b
        text: Amazon Redshift
        correct: true
        why: Redshift is a managed data warehouse for structured or semistructured data at petabyte scale, built for reporting.
      - id: c
        text: Amazon DynamoDB
        why: DynamoDB is a key-value database for fast app lookups, not a warehouse for analytical reports.
      - id: d
        text: Amazon ElastiCache
        why: ElastiCache keeps data in memory to speed up reads, not years of records for business intelligence.
    evidence:
      - S3 is the lake for raw data of any shape, while Redshift is the warehouse for structured or semistructured data.
      - "**Amazon Redshift**: Managed data warehouse."
    takeaway: Structured data pooled for business intelligence at large scale belongs in the Amazon Redshift data warehouse.
    history: []
    verified:
      keyHash: 7408418cd740
      fullHash: 2cf8088a3d82
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-nsq3kp
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: amazon-redshift
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 1
    stem: >-
      Which statements describe Amazon Redshift?
    options:
      - id: a
        text: It handles frequent, heavy SQL on big datasets.
        correct: true
        why: Columnar storage and massively parallel processing let Redshift run frequent, heavy SQL on large datasets.
      - id: b
        text: It runs SQL in place and bills for each query.
        why: Querying data where it lives with per-query billing describes Amazon Athena, not Redshift.
      - id: c
        text: It is a managed warehouse for business reports.
        correct: true
        why: Redshift is the pipeline's managed data warehouse, built for structured data used in business intelligence.
      - id: d
        text: It is the usual lake for raw data of any shape.
        why: An elastic object store used as the data lake for raw data describes Amazon S3, not Redshift.
      - id: e
        text: It queries data on premises or in other clouds.
        why: Serverless SQL over sources on premises or in other clouds describes Amazon Athena, not Redshift.
    evidence:
      - Athena queries data where it lives and bills per query, while Redshift handles frequent, heavy SQL.
      - S3 is the lake for raw data of any shape, while Redshift is the warehouse for structured or semistructured data.
    takeaway: Redshift is both the pipeline's data warehouse and a fast engine for heavy, frequent SQL on large datasets.
    history: []
    verified:
      keyHash: b23c3f0e950b
      fullHash: cb095dbfb1eb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
