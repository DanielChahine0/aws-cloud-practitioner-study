    concept: amazon-redshift
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 3
    stem: >-
      The cafe chain wants one store for years of structured sales records from every branch, organized for business intelligence reports at petabyte scale.
      Which service fits?
    options:
      - id: a
        text: Amazon S3
        why: S3 is the usual data lake for raw data of any shape, not a warehouse organized for business intelligence.
      - id: b
        text: Amazon Redshift
        correct: true
        why: Redshift is a managed data warehouse for structured or semistructured data at petabyte scale, built for reporting.
      - id: c
        text: Amazon DynamoDB
        why: DynamoDB is a key-value database for fast app lookups, not a warehouse for analytical reports.
      - id: d
        text: Amazon ElastiCache
        why: ElastiCache keeps data in memory to speed up reads, not years of records for business intelligence.
    evidence:
      - S3 is the lake for raw data of any shape, while Redshift is the warehouse for structured or semistructured data.
      - "**Amazon Redshift**: Managed data warehouse."
    takeaway: Structured data pooled for business intelligence at large scale belongs in the Amazon Redshift data warehouse.
