  - id: q-a0tbg2
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-data-firehose
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 3
    stem: >-
      The cafe wants readings from every espresso machine collected and landed in its data lake for long-term trend analysis.
      A few seconds of delay is fine, and nobody wants to build the delivery step.
      Which service fits?
    options:
      - id: a
        text: Amazon Kinesis Data Streams
        why: It suits instant reads by several apps, which this long-term analysis does not need, and it leaves delivery to the cafe.
      - id: b
        text: Amazon Data Firehose
        correct: true
        why: Firehose is fully managed and delivers streaming data in near real time into lakes, warehouses or analytics tools.
      - id: c
        text: AWS DataSync
        why: DataSync copies files between storage systems, not continuous readings streamed from machines.
      - id: d
        text: AWS Glue
        why: Glue transforms data after it is stored, so it does not collect the machine readings in the first place.
    evidence:
      - Kinesis Data Streams is real time with many readers, while Firehose is near real time with managed delivery.
      - "Gathering every smart home device's data for long-term analysis: Data Firehose."
    takeaway: Near-real-time streaming that must land in a store with no delivery code to manage points to Amazon Data Firehose.
    history: []
    verified:
