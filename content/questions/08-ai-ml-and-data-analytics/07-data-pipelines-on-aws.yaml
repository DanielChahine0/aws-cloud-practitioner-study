questions:
  - id: q-pebdjx
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-kinesis-data-streams
    note: m08/data-pipelines-on-aws
    task: "3.7"
    level: 3
    stem: >-
      The cafe wants to take in kiosk orders as the first step of its data pipeline.
      A live stock board and a fraud analytics app must both read every order the moment it lands, with no lag.
      Which service should ingest the order data?
    options:
      - id: a
        text: Amazon Kinesis Data Streams
        correct: true
        why: Kinesis Data Streams ingests data in real time and lets several apps, such as the stock board and the fraud check, read one stream at once.
      - id: b
        text: Amazon Data Firehose
        why: Firehose delivers data in near real time to a destination, so it adds the small lag the cafe cannot accept.
      - id: c
        text: Amazon Simple Queue Service (Amazon SQS)
        why: A queue hands each message to one consumer for processing, rather than letting two readers see every order live.
      - id: d
        text: AWS Glue
        why: Glue runs transform jobs on data already stored, so it cannot ingest orders for live reads at the moment they land.
    evidence:
      - Kinesis Data Streams is real time with many readers, while Firehose is near real time with managed delivery.
      - "Live stock data feeding instant trades: Kinesis Data Streams."
    takeaway: When several apps must read the same events the moment they happen, ingest them with Kinesis Data Streams.
    history: []
    verified:
      keyHash: 37a510e04623
      fullHash: f00c91910968
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
