      - id: b
        text: Amazon Athena
        why: Athena runs SQL queries on data that is already stored, so it does not ingest or deliver streams.
      - id: c
        text: Amazon Kinesis Data Streams
        why: Kinesis Data Streams is built for real-time reads by many apps, and it does not manage delivery into a destination store.
      - id: d
        text: Amazon Data Firehose
        correct: true
        why: Firehose captures streaming data and delivers it in near real time to destinations such as lakes and warehouses.
    evidence:
      - "**Amazon Data Firehose**: Managed near-real-time ingestion and delivery."
      - Kinesis Data Streams is real time with many readers, while Firehose is near real time with managed delivery.
    takeaway: Amazon Data Firehose is the managed, near-real-time service that ingests streams and delivers them to a store.
