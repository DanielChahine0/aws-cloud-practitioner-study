        why: It is the serverless real-time ingestion service, and its on-demand mode provisions and scales capacity for you.
      - id: d
        text: Amazon Simple Queue Service (Amazon SQS)
        why: SQS decouples parts of an application with message queues rather than ingesting analytics data in real time.
    evidence:
      - "**Amazon Kinesis Data Streams**: Serverless real-time ingestion."
    takeaway: Kinesis Data Streams is the serverless, real-time way to ingest large volumes of app and sensor events.
