    task: "3.7"
    level: 3
    stem: >-
      The cafe's small analytics team has no big data specialists.
      It wants to clean and reshape nightly sales files with a visual job builder and built-in scheduling.
      Which service fits?
    options:
      - id: a
        text: Amazon EMR
        why: EMR suits complex jobs and custom framework settings run by people with big data expertise, which this team lacks.
      - id: b
        text: Amazon Athena
        why: Athena queries data with SQL, but it does not build and schedule transformation jobs.
      - id: c
        text: AWS Glue
        correct: true
        why: Glue is managed ETL with a visual job builder and scheduling, a simple way to prepare data without specialists.
      - id: d
        text: Amazon Data Firehose
        why: Firehose ingests and delivers streaming data rather than running scheduled jobs on stored sales files.
    evidence:
      - Glue suits a simplified approach, while EMR suits complex jobs, big data expertise and custom configurations.
      - "**AWS Glue**: Managed ETL service."
    takeaway: For simple, managed data preparation without big data experts, choose AWS Glue over Amazon EMR.
