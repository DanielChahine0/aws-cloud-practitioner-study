    stem: >-
      Which serverless service ingests terabytes of events from apps and sensors in real time, and can run in an on-demand mode that scales itself?
    options:
      - id: a
        text: Amazon Data Firehose
        why: Firehose works in near real time and focuses on delivering data to a destination, not on real-time reads.
      - id: b
        text: AWS Glue
        why: Glue prepares and transforms data that is already stored, so it is not the ingestion step.
      - id: c
        text: Amazon Kinesis Data Streams
        correct: true
        why: It is the serverless real-time ingestion service, and its on-demand mode provisions and scales capacity for you.
      - id: d
        text: Amazon Simple Queue Service (Amazon SQS)
        why: SQS decouples parts of an application with message queues rather than ingesting analytics data in real time.
    evidence:
      - "**Amazon Kinesis Data Streams**: Serverless real-time ingestion."
    takeaway: Kinesis Data Streams is the serverless, real-time way to ingest large volumes of app and sensor events.
