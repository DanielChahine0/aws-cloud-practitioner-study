questions:
  - id: q-jvhyc4
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-analytics
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 1
    stem: >-
      What does data analytics do with a business's raw historical data?
    options:
      - id: a
        text: Turns it into insights and trends
        correct: true
        why: Analysts study the past records to find patterns and insights the business can act on.
      - id: b
        text: Trains a model to generate new content
        why: Generating new content is the work of generative AI, not of analysing past records.
      - id: c
        text: Converts it to one format before loading
        why: Reformatting before loading is the transform step of ETL, which only prepares data for analysis.
      - id: d
        text: Keeps it in one central store as-is
        why: Pooling data unchanged in one place describes a data lake, which holds data rather than analysing it.
    evidence:
      - "Data analytics: analysts turn raw history into insights and trends."
    takeaway: Data analytics means analysts turning past raw data into insights and trends.
    history: []
    verified:
      keyHash: 3ae0606c7d35
      fullHash: 29031ca1bdba
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pngbbd
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-analytics
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 2
    stem: >-
      The cafe asks its bank for a loan to open a second shop.
      The bank decides with traditional data analytics rather than an AI model, because it must later tell the owner exactly why the request was declined.
      What makes traditional analytics the better fit here?
    options:
      - id: a
        text: It writes new text and images from prompts
        why: Creating new content from prompts is what generative AI does, and it does not explain a loan outcome.
      - id: b
        text: Its reasoning is easy for people to follow
        correct: true
        why: Analysts can trace and state how past records led to the result, which a declined loan must be explained by.
      - id: c
        text: It finds patterns in huge unlabeled datasets
        why: Mining huge unlabeled datasets is a machine learning strength, and it does not make a decision easy to explain.
      - id: d
        text: It works with no clean or prepared data
        why: Analytics and AI/ML both rely on plenty of clean, easy-to-reach data, so this is not an advantage here.
    evidence:
      - "Explaining a loan decision: traditional analytics."
      - "Still vital: explaining loan decisions, hypothesis tests on clinical trials, insurance risk models regulators can understand and approve, and cheaper, more efficient work on small datasets."
    takeaway: When people must follow and explain a decision, such as a declined loan, traditional analytics still beats AI/ML.
    history: []
    verified:
      keyHash: 5b6113213b0c
      fullHash: 786746f6aeb2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-mw658d
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-lakes
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 2
    stem: >-
      The cafe's till sales, app logins and website browsing records sit in separate systems and in different formats.
      The owner wants all of it pooled in one central place.
      What should the cafe set up?
    options:
      - id: a
        text: A data lake
        correct: true
        why: A data lake gathers data from many systems and formats into one central store, which is the goal here.
      - id: b
        text: An ETL job
        why: An ETL job reshapes and moves data, but it is not itself the central place that holds everything.
      - id: c
        text: A zero-ETL setup
        why: Zero-ETL uses data where it already sits, while this data is still scattered across systems.
      - id: d
        text: A BI dashboard
        why: A dashboard charts data for people to read, and it does not pool raw data from many systems.
    evidence:
      - "Purchases, logins and browsing leave data scattered across systems and formats, and a data lake, pictured as a huge reservoir, gathers it all."
    takeaway: Data scattered across many systems and formats is pooled in a data lake.
    history: []
    verified:
      keyHash: ffc8c37954c7
      fullHash: 7e5789df9f4b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-xzb5ex
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-lakes
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 1
    stem: >-
      Which description fits a data lake?
    options:
      - id: a
        text: A central store that pools data from many systems
        correct: true
        why: A data lake brings a business's scattered data together in one central store.
      - id: b
        text: An automated line that ingests, processes and serves data
        why: An automated ingest, process and serve line is a data pipeline, which moves data rather than holding it.
      - id: c
        text: A dashboard that charts sales trends for managers
        why: A sales dashboard is a business intelligence view on top of data, not the store that holds it.
      - id: d
        text: A step that reformats data before it is loaded
        why: Reformatting before loading is the transform step of ETL, not a place where data is kept.
    evidence:
      - "Purchases, logins and browsing leave data scattered across systems and formats, and a data lake, pictured as a huge reservoir, gathers it all."
      - A data lake centralizes scattered data.
    takeaway: A data lake is one central store that gathers data from all of a business's systems.
    history: []
