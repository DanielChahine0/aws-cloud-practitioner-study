  - id: q-x772cs
    version: 1
    status: live
    type: single
    pool: practice
    concept: etl
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 1
    stem: >-
      In an ETL process, when is the data transformed?
    options:
      - id: a
        text: After it is loaded
        why: Transforming after loading is ELT, which reverses the order of the last two steps.
      - id: b
        text: Before it is loaded
        correct: true
        why: ETL extracts the data, transforms it into one format and only then loads it into the warehouse.
      - id: c
        text: Never; it is used as-is
        why: Using data with no transform step is zero-ETL, not ETL.
      - id: d
        text: Only when a report runs
        why: ETL reshapes the data during the process itself, not each time someone opens a report.
    evidence:
      - "ETL: extract and store, transform to one format, load into a warehouse or analytics platform."
    takeaway: ETL transforms data into one format before it is loaded into the warehouse.
    history: []
    verified:
      keyHash: d92ee228eb03
      fullHash: eceb926f1251
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-swcapk
    version: 1
    status: live
    type: single
    pool: practice
    concept: etl
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 2
    stem: >-
      The cafe's till exports CSV files and its app writes JSON, but its analytics platform reads only one format.
      The data must already be in that format when it arrives on the platform.
      Which order of steps fits?
    options:
      - id: a
        text: Convert the data, then load it
        correct: true
        why: Converting first and loading second is ETL, so the data reaches the platform already in its one format.
      - id: b
        text: Load the data, then convert it
        why: Loading first and converting later is ELT, so the data would reach the platform in its mixed formats.
      - id: c
        text: Load the data and never convert it
        why: Skipping the conversion leaves the CSV and JSON mix in place, which the platform cannot read.
      - id: d
        text: Leave the data where it is now
        why: Using data in place only works when it is already usable, and this data is in the wrong formats.
    evidence:
      - "ETL: extract and store, transform to one format, load into a warehouse or analytics platform."
      - ETL transforms before loading, ELT after, and zero-ETL not at all.
    takeaway: When data must reach the platform already in one format, transform first with ETL.
    history: []
    verified:
      keyHash: 9ec0f86f4a09
      fullHash: 451b4b1deb89
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-y66658
    version: 1
    status: live
    type: single
    pool: practice
    concept: elt
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 3
    stem: >-
      The cafe wants its order records in the warehouse right away, before its analysts have decided which views they need.
      Each view will need the records shaped differently.
      Which approach fits?
    options:
      - id: a
        text: ETL
        why: ETL reshapes the records before loading, which means fixing one shape before the analysts know their views.
      - id: b
        text: Zero-ETL
        why: Zero-ETL never reshapes the data, but each view here needs the records shaped differently.
      - id: c
        text: ELT
        correct: true
        why: ELT loads the records first and transforms them later, as the analysts settle on each view.
      - id: d
        text: Reverse ETL
        why: Reverse ETL pushes warehouse data back out to business apps, and it does not load the new order records in.
    evidence:
      - "ELT: load first, transform as needed; needs and infrastructure decide."
      - ETL transforms before loading, ELT after, and zero-ETL not at all.
    takeaway: Loading raw data first and reshaping it later on demand is ELT.
    history: []
    verified:
      keyHash: 27adf31cbcbe
      fullHash: 8cbcf46e6464
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-jqjpjv
    version: 1
    status: draft
    type: single
    pool: practice
    concept: elt
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 1
    stem: >-
      A team must choose between ELT and ETL for a new pipeline.
      What should decide that choice?
    options:
      - id: a
        text: Whether the data is already usable in place
        why: Data that is already usable in place points to zero-ETL, not to a choice between ELT and ETL.
      - id: b
        text: Whether the data sits in an S3 data lake
        why: A data lake can feed either approach, so where the data is stored does not settle the order of steps.
      - id: c
        text: What its needs and infrastructure call for
        correct: true
        why: Whether to load first and transform later comes down to the team's needs and its infrastructure.
      - id: d
        text: Whether a pipeline automates each run
        why: A pipeline makes either approach repeat reliably, so automation does not decide between them.
    evidence:
      - "ELT: load first, transform as needed; needs and infrastructure decide."
    takeaway: The choice of ELT over ETL comes down to the team's needs and infrastructure.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 4 is the vague, hedged catch-all while the others are specific conditions.)"
  - id: q-z4gbe2
    version: 1
    status: live
    type: single
    pool: practice
    concept: zero-etl
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 2
    stem: >-
      The cafe's sales records are already in a format its analytics tool reads, and they already sit where the tool reads from.
      What should the cafe do with the records?
    options:
      - id: a
        text: Reshape the records, then load them
        why: Reshaping and then loading is ETL, which adds needless work for records that are already usable and in place.
      - id: b
        text: Load the records, then reshape them
        why: Loading and later reshaping is ELT, though nothing here needs moving or reshaping.
      - id: c
        text: Copy the records into a data lake
        why: A copy in a new central store adds work, since the tool can already read the records where they are.
      - id: d
        text: Use the records in place, as-is
        correct: true
        why: This is zero-ETL, which uses data as-is when it is already usable and in place, like these records.
    evidence:
      - "Zero-ETL: skip it when data is already usable and in place."
    takeaway: When data is already usable and in place, zero-ETL skips the transform and load work.
    history: []
    verified:
      keyHash: 1e7c2551a531
      fullHash: 2ab0127f31fa
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-dn1rh9
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: zero-etl
    note: m08/introduction-to-data-analytics
    task: "3.7"
    level: 1
    stem: >-
      Which conditions make zero-ETL a fit?
    options:
      - id: a
        text: The data is usable without any reshaping
        correct: true
        why: Zero-ETL skips the transform step, which works only when the data needs no reshaping.
      - id: b
        text: The data gets reshaped once it has loaded
        why: Reshaping data after loading is ELT, so the transform step is still there rather than skipped.
      - id: c
        text: The data already sits where the tool reads it
        correct: true
        why: Zero-ETL skips moving the data, which works only when it is already in place for the tool.
      - id: d
        text: The data is reshaped to one format first
        why: Reshaping data to one format before loading is ETL, so the transform step is still there.
      - id: e
        text: A pipeline copies the data over to the tool
        why: Copying data over to the tool means it was not already in place, which zero-ETL relies on.
    evidence:
      - "Zero-ETL: skip it when data is already usable and in place."
    takeaway: Zero-ETL fits only when data is both already usable and already in place.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Options 1 and 3 describe zero-ETL; 2, 4 and 5 describe ETL and ELT pipelines.)"
