    task: "3.7"
    level: 1
    stem: >-
      The theory behind deep learning has existed for decades, yet it became practical only recently.
      What held it back for so long?
    options:
      - id: a
        text: It waited on experts to hand-code every rule
        why: Deep learning learns from data rather than written rules, so hand-coded rules were never what it lacked.
      - id: b
        text: It waited on hardware strong enough to train it
        correct: true
        why: The theory was ready long ago but waited on hardware strong enough to train layered networks.
      - id: c
        text: It waited on AWS to offer ready-made models
        why: Pre-built AI services came long after the theory and are not what made layered networks trainable.
      - id: d
        text: It waited on cloud Regions near its users
        why: Where the cloud sits affects latency for users, not whether a layered network can be trained at all.
    evidence:
      - ML subset with decades-old theory that needed modern hardware; neural networks pass summaries through layers of artificial neurons (math functions) to form a model, cracking harder problems like computer vision and NLP.
    takeaway: Deep learning rests on decades-old theory that only became practical once modern hardware could run it.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (knowledge: Option 4 is the only true historical claim; options 1 and 3 are not real limits on ML and 2 describes the older approach.)"
