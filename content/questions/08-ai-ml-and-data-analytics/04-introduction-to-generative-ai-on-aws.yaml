      - id: c
        text: Classical programming
        why: Fixed hand-coded rules can fill in templates but do not create genuinely new text.
      - id: d
        text: Predictive machine learning
        why: Predictive ML forecasts from past patterns, such as which drinks will sell, rather than writing original stories.
    evidence:
      - Deep learning producing original content and ideas (conversations, stories, images, music), powered by foundation models (FMs), huge models pre-trained on massive data.
