      The cafe wants one model to write menu text, answer customer chats and summarize reviews, where a classic ML model would handle only one of those jobs.
      Which trait of a foundation model makes this possible?
    options:
      - id: a
        text: It is offered through one Amazon Bedrock API
        why: One API is how Bedrock serves its models, but access does not explain why one model can do three jobs.
      - id: b
        text: It adapts to many tasks after one training
        correct: true
        why: A single foundation model, trained once on massive data, serves many different jobs, such as these three.
      - id: c
        text: It forms its model through neuron layers
        why: Layered neurons are how deep learning builds any model, including one-task models, so this is not the reason.
      - id: d
        text: It can be adapted privately with cafe data
        why: Private adaptation tailors a model to the cafe, but it is not what lets one model cover many jobs.
    evidence:
      - One FM adapts to many tasks, while classic ML models do one.
      - One FM, trained once on massive data, serves many jobs.
    takeaway: A foundation model is trained once on massive data and then adapts to many tasks, unlike a one-task ML model.
