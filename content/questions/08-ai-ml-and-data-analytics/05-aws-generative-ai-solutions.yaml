    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 1
    stem: >-
      What makes a generative AI model multimodal?
    options:
      - id: a
        text: It runs the same model in several Regions
        why: Running in several Regions is about where a model is hosted, not the kinds of content it makes.
      - id: b
        text: It writes text in several human languages
        why: Text in many languages is still one content type, so that alone is not multimodal.
      - id: c
        text: It is trained by several teams at one time
        why: Who trains a model says nothing about the content types it can generate.
      - id: d
        text: It can generate several types of content
        correct: true
        why: Multimodal means generating more than one content type, such as both text and images.
    evidence:
      - "Multimodal: Generating several content types."
    takeaway: A multimodal generative model produces more than one type of content, such as text and images.
