    task: "3.7"
    level: 2
    stem: >-
      The cafe has no ML specialists.
      It wants to browse ready-made solutions for vision, language and tabular data, adapt one to its sales records and deploy it in a few clicks.
      Which option fits?
    options:
      - id: a
        text: Amazon SageMaker AI
        why: SageMaker AI on its own is for building and training your own models, which needs the ML skills the cafe lacks.
      - id: b
        text: Amazon SageMaker JumpStart
        correct: true
        why: JumpStart is the model hub with vision, language and tabular solutions to fine-tune and deploy in a few clicks.
      - id: c
        text: Amazon Q Business
        why: Q Business answers staff questions from company data; it does not offer models to tune and deploy.
      - id: d
        text: Amazon Bedrock
        why: Bedrock serves managed foundation models through an API, not a catalog of tabular solutions to deploy.
    evidence:
      - Hub in SageMaker AI; vision, NLP, tabular solutions to fine-tune and deploy in clicks
      - "Amazon SageMaker JumpStart: SageMaker AI model hub."
    takeaway: A quick start from ready-made models inside SageMaker AI, with little ML expertise, points to SageMaker JumpStart.
