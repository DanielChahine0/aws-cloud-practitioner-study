  - id: q-7qae75
    version: 1
    status: live
    type: single
    pool: practice
    concept: fine-tuning
    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 1
    stem: >-
      What does fine-tuning a model mean?
    options:
      - id: a
        text: Training a brand-new model from scratch on your data
        why: Fine-tuning starts from a model that is already trained rather than from nothing.
      - id: b
        text: Further training a pre-trained model on your own data
        correct: true
        why: Fine-tuning takes a pre-trained model and adjusts it with your own data for your domain.
      - id: c
        text: Adding instructions and examples to each prompt you send
        why: Shaping each prompt is prompt engineering; it leaves the model's learned weights unchanged.
      - id: d
        text: Running a trained model to make predictions on new input
        why: Making predictions with a finished model is inference, which does not adapt the model.
    evidence:
      - "Fine-tuning: Adapting a pre-trained model with your data."
    takeaway: Fine-tuning adapts a pre-trained model with your own data instead of training a model from scratch.
    history: []
    verified:
      keyHash: 54b642ed194b
      fullHash: 17452f4968a7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-wp13bg
    version: 1
    status: draft
    type: single
    pool: practice
    concept: fine-tuning
    note: m08/aws-generative-ai-solutions
    task: "3.7"
    level: 2
    stem: >-
      The cafe found a pre-trained language model that writes decent product text, but it misses the cafe's own drink names and tone.
      The cafe wants the model itself to learn them from its large set of past menu descriptions, while keeping what the model already knows.
      What should it do?
    options:
      - id: a
        text: Compare it with other models in JumpStart
        why: JumpStart can compare models, but comparing them teaches none of them the cafe's drink names or tone.
      - id: b
        text: Run the menu set through Amazon Comprehend
        why: Comprehend pulls key phrases and sentiment from text, but the language model itself learns nothing from it.
      - id: c
        text: Fine-tune the pre-trained model with the menu set
        correct: true
        why: Fine-tuning adapts the existing model with the cafe's own data so it learns that domain.
      - id: d
        text: Serve the model unchanged through Amazon Bedrock
        why: Bedrock can host and serve models, but an unchanged model still lacks the cafe's own drink names and tone.
    evidence:
      - "Fine-tuning: Adapting a pre-trained model with your data."
      - Deploys without expertise, domain fine-tuning, model comparison
    takeaway: To fit a pre-trained model to your own domain, fine-tune it with your data rather than start over.
    history: []
    review:
      attempts: 4
      lastFailure: "critic: Option 3 repeats the stem's 'pre-trained' model, which no distractor does."
  - id: q-7f9y5e
