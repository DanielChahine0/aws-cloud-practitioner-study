  - id: q-cypn6t
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-pipelines
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 2
    stem: >-
      The cafe's app keeps its order history in Amazon DynamoDB and suggests pastries from a model that needs retraining on fresh orders.
      Its analysts also want to query that same order data.
      Which setup keeps both groups supplied with fresh orders, hands-off?
    options:
      - id: a
        text: Point Athena and SageMaker AI at the DynamoDB table
        why: DynamoDB is fast for app reads and writes, but scanning all of it for training is impractical.
      - id: b
        text: Export the orders to S3 by hand when a group asks
        why: Manual exports are neither hands-off nor repeatable, so the model and analysts wait on someone each time.
      - id: c
        text: Run a scheduled pipeline that fills a second DynamoDB table
        why: A second DynamoDB table has the same problem, since scanning all of it for training is still impractical.
      - id: d
        text: Run a scheduled pipeline that fills an S3 data lake
        correct: true
        why: One scheduled pipeline into the S3 data lake feeds the model's retraining and the analysts' queries from the same data.
    evidence:
      - Customer history sits in Amazon DynamoDB, great for fast reads and writes but impractical to scan in full for training, so the data must move to a data lake.
      - One scheduled pipeline feeds both Athena analysis and SageMaker AI training from the same S3 data.
    takeaway: Retraining and analysis on the same data are best served by one scheduled pipeline into a shared S3 data lake.
