  - id: q-7hpd9n
    version: 1
    status: live
    type: match
    pool: practice
    concept: data-pipelines
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 1
    stem: >-
      The cafe's ordering app keeps customer history and suggests pastries from a recommendation model.
      An automated pipeline moves that history so analysts can query it and the model can be retrained.
      Match each stage of the pipeline to the AWS service that handles it.
    pairs:
      - left: Hold the app's customer history for fast reads and writes
        right: Amazon DynamoDB
        why: DynamoDB is the app's store, quick for single reads and writes but poor for full training scans.
      - left: Aggregate incoming changes and deliver them onward
        right: Amazon Data Firehose
        why: Firehose gathers the streamed changes in near real time and delivers them to the data lake.
      - left: Keep all analytics and ML data in one data lake
        right: Amazon S3
        why: The S3 data lake is the shared home that many consumers read from.
      - left: Retrain the recommendation model on the lake's data
        right: Amazon SageMaker AI
        why: SageMaker AI pulls the S3 data so ML engineers can retrain the model.
    evidence:
      - "**2 Store app data**: DynamoDB keeps the customer history."
      - "**5 Deliver data**: Firehose writes it to the S3 data lake, which holds all the company's ML and analytics data for many consumers."
      - "**8 Train model**: Amazon SageMaker AI pulls that same S3 data so ML engineers can retrain the recommendation model."
    takeaway: A pipeline moves data from the app store through ingestion into an S3 lake that both analytics and model training read.
    history: []
