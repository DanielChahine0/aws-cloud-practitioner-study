  - id: q-ahb2x6
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-glue-data-catalog
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 1
    stem: >-
      In a data pipeline that ends in an Amazon S3 data lake, what job does an AWS Glue Data Catalog table do?
    options:
      - id: a
        text: It gathers streamed changes and delivers them to S3
        why: Gathering and delivering streamed changes is Amazon Data Firehose's step, not the catalog table's.
      - id: b
        text: It converts incoming JSON records into .csv files
        why: Reshaping records in flight is done by an AWS Lambda function that Firehose invokes.
      - id: c
        text: It notes the data's schema and its place in S3
        correct: true
        why: A catalog table records the structure of the data and where it sits, so queries can find it.
      - id: d
        text: It pulls the lake's data to retrain a model
        why: Pulling the lake's data for retraining is Amazon SageMaker AI's step, not the catalog table's.
    evidence:
      - "**6 Catalog data**: an AWS Glue Data Catalog table notes the data's schema and where it sits in S3, so ad hoc queries can find it."
    takeaway: A Glue Data Catalog table holds a dataset's schema and S3 location so query tools can find and read it.
    history: []
