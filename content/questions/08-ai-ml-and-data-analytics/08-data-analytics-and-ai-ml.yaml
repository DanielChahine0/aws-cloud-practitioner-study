  - id: q-6hrb51
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-athena
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 1
    stem: >-
      How does Amazon Athena learn the structure of the data it queries in an S3 data lake?
    options:
      - id: a
        text: It reads an AWS Glue Data Catalog table
        correct: true
        why: Athena looks up the catalog table, which holds the data's schema and S3 location.
      - id: b
        text: It runs standard SQL against the files in S3
        why: Running SQL is what Athena does with the data, but it says nothing about how it learns the layout.
      - id: c
        text: It queries the data without loading it first
        why: Querying in place is true of Athena, yet it does not explain where the structure comes from.
      - id: d
        text: It queries the same data SageMaker AI trains on
        why: Sharing the S3 data with SageMaker AI is true, but SageMaker AI does not describe its structure.
    evidence:
      - "**7 Perform data analytics**: data scientists query S3 in place with standard SQL in Amazon Athena, which reads the catalog table to recognize the structure."
    takeaway: Athena reads a Glue Data Catalog table to recognize the schema of the S3 data it queries.
