  - id: q-749yxz
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-glue-data-catalog
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 2
    stem: >-
      The cafe's sales records now land in an S3 data lake as .csv files.
      Its analysts want to run ad hoc SQL queries, but the query tool cannot tell how the files are laid out.
      What should the cafe add to the pipeline?
    options:
      - id: a
        text: An Amazon Kinesis Data Streams stream
        why: A stream carries changes into the pipeline but does not describe the layout of files already in S3.
      - id: b
        text: An AWS Glue Data Catalog table
        correct: true
        why: A catalog table records the files' schema and S3 location, which the query tool reads to see the layout.
      - id: c
        text: An Amazon Data Firehose stream
        why: Firehose delivers records to S3 but leaves no description of their structure for queries.
      - id: d
        text: An AWS Lambda function
        why: A function can reshape records in flight, yet it does not tell later queries how the data is laid out.
    evidence:
      - "**6 Catalog data**: an AWS Glue Data Catalog table notes the data's schema and where it sits in S3, so ad hoc queries can find it."
      - "**7 Perform data analytics**: data scientists query S3 in place with standard SQL in Amazon Athena, which reads the catalog table to recognize the structure."
    takeaway: Ad hoc queries on an S3 data lake rely on a Glue Data Catalog table to learn the data's schema and location.
    history: []
    verified:
      keyHash: 0d0ad0468de4
      fullHash: a0eaa6da63ab
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-8snpzv
    version: 1
    status: live
    type: single
    pool: practice
    concept: amazon-athena
    note: m08/data-analytics-and-ai-ml
    task: "3.7"
    level: 3
    stem: >-
      The cafe's analysts want to ask questions of the order files in its S3 data lake using standard SQL.
      They want to query the files right where they sit, without setting up or running a data warehouse.
      Which service fits?
    options:
      - id: a
        text: Amazon Redshift
        why: Redshift is a data warehouse the cafe would have to set up and run, which the analysts want to avoid.
      - id: b
        text: Amazon EMR
        why: EMR runs big data processing clusters rather than serving quick SQL queries on files in place.
      - id: c
        text: Amazon Athena
        correct: true
        why: Athena runs standard SQL directly against the data where it sits in S3, with nothing to load first.
      - id: d
        text: Amazon RDS
        why: RDS hosts a relational database that would need the order data loaded into it before any query.
    evidence:
      - "**7 Perform data analytics**: data scientists query S3 in place with standard SQL in Amazon Athena, which reads the catalog table to recognize the structure."
    takeaway: To run standard SQL on data in S3 without loading it anywhere, use Amazon Athena.
