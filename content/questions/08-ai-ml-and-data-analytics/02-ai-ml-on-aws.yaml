    concept: aws-ai-ml-stack
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 1
    stem: >-
      Which list orders the tiers of the AWS AI/ML stack from the most ready-made to the most custom?
    options:
      - id: a
        text: ML frameworks and infrastructure, ML services, AI services
        why: This runs the stack backward, from the most custom tier up to the ready-made one.
      - id: b
        text: ML services, ML frameworks and infrastructure, AI services
        why: Pre-trained AI services are the most ready-made tier, so they belong first rather than last.
      - id: c
        text: AI services, ML services, ML frameworks and infrastructure
        correct: true
        why: Pre-trained AI services come first, managed custom models in ML services next, and fully custom frameworks last.
      - id: d
        text: ML frameworks and infrastructure, AI services, ML services
        why: Frameworks and infrastructure are the fully custom tier, so they belong last, not ahead of the ready-made tier.
    evidence:
      - "Tiers run from ready-made (AI services) to your own models (SageMaker AI) to fully custom."
      - "**AWS AI/ML stack**: AI services, ML services, and ML frameworks and infrastructure."
    takeaway: The AWS AI/ML stack runs from pre-trained AI services, through ML services, to fully custom frameworks and infrastructure.
