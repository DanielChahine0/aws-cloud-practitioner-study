  - id: q-jk7gka
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-ml-services
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 3
    stem: >-
      The cafe's small data team wants to build and train its own model that forecasts pastry demand from past sales.
      They want AWS to handle the servers, tooling and monitoring for them.
      Which option fits?
    options:
      - id: a
        text: Amazon EC2 accelerated computing instances
        why: These give raw ML hardware the team must set up and run itself, which is the fully custom tier they want to avoid.
      - id: b
        text: Amazon Comprehend
        why: Comprehend is a pre-trained service for reading sentiment in text, not a place to train a demand model.
      - id: c
        text: Amazon SageMaker AI
        correct: true
        why: SageMaker AI lets the team create and train a custom model while AWS manages the infrastructure, tools and monitoring.
      - id: d
        text: Amazon Polly
        why: Polly is a ready-made voice service that reads text aloud and cannot learn to forecast sales.
    evidence:
      - "ML services: for more customization, you create, train and ship custom models in Amazon SageMaker AI while AWS manages infrastructure, tools and workflows, with experiments, data visuals, debugging and monitoring in one place."
      - "ML frameworks and infrastructure: fully custom work for specialized needs, on purpose-built chips with popular frameworks or ML-optimized EC2."
    takeaway: A custom model with AWS managing the platform points to SageMaker AI, not self-managed ML instances or pre-trained AI services.
