    stem: >-
      The cafe wants a model that estimates what a sack of coffee beans will cost
      next month, so it can time its bulk orders. Which kind of machine learning
      job is this?
    options:
      - id: a
        text: Making a decision
        why: Deciding picks an action, such as where to route a caller, while this job estimates a future cost.
      - id: b
        text: Predicting a value
        correct: true
        why: Estimating the coming price of the beans is prediction, the ML job behind forecasts of prices of goods.
      - id: c
        text: Detecting an anomaly
        why: Anomaly detection flags rare events such as fraud, while this job puts a figure on a future price.
      - id: d
        text: Recommending a product
        why: A recommendation suggests an item to a customer, while the cafe here wants a price it can plan around.
    evidence:
      - ML predicts (stock trends, prices of goods), decides (routing a caller by spoken request) and detects anomalies (online-banking fraud).
    takeaway: Estimating a future figure, such as the price of goods, is the predicting kind of ML business use.
