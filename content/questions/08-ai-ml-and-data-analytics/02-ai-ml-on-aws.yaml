questions:
  - id: q-fxtx9s
    version: 1
    status: live
    type: single
    pool: practice
    concept: ai-ml-business-use-cases
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 2
    stem: >-
      The cafe wants a model that flags a card payment when it breaks that customer's normal spending pattern.
      Which kind of machine learning job is this?
    options:
      - id: a
        text: Predicting a future price
        why: A prediction estimates a number ahead of time, such as next month's bean price, not whether one payment is odd.
      - id: b
        text: Detecting an anomaly
        correct: true
        why: Spotting a payment that breaks a customer's normal pattern is anomaly detection, the same job as catching banking fraud.
      - id: c
        text: Routing a spoken request
        why: Routing decides where a caller should go based on what they say, which has nothing to do with odd payments.
      - id: d
        text: Recommending a related item
        why: A recommendation suggests what a customer might buy next, rather than judging whether one payment looks unusual.
    evidence:
      - ML predicts (stock trends, prices of goods), decides (routing a caller by spoken request) and detects anomalies (online-banking fraud).
    takeaway: Flagging a transaction that breaks a normal pattern is anomaly detection, one of the core jobs ML does for a business.
    history: []
