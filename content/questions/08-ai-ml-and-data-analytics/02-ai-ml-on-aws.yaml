questions:
  - id: q-fxtx9s
    version: 1
    status: live
    type: single
    pool: practice
    concept: ai-ml-business-use-cases
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 2
    stem: >-
      The cafe wants a model that flags a card payment when it breaks that customer's normal spending pattern.
      Which kind of machine learning job is this?
    options:
      - id: a
        text: Predicting a future price
        why: A prediction estimates a number ahead of time, such as next month's bean price, not whether one payment is odd.
      - id: b
        text: Detecting an anomaly
        correct: true
        why: Spotting a payment that breaks a customer's normal pattern is anomaly detection, the same job as catching banking fraud.
      - id: c
        text: Routing a spoken request
        why: Routing decides where a caller should go based on what they say, which has nothing to do with odd payments.
      - id: d
        text: Recommending a related item
        why: A recommendation suggests what a customer might buy next, rather than judging whether one payment looks unusual.
    evidence:
      - ML predicts (stock trends, prices of goods), decides (routing a caller by spoken request) and detects anomalies (online-banking fraud).
    takeaway: Flagging a transaction that breaks a normal pattern is anomaly detection, one of the core jobs ML does for a business.
    history: []
    verified:
      keyHash: 394957ecb4d0
      fullHash: b6415a518e2a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-yxxh59
    version: 1
    status: draft
    type: multi
    select: 3
    pool: practice
    concept: ai-ml-business-use-cases
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 1
    stem: >-
      Which kinds of work can machine learning take on for a business?
    options:
      - id: a
        text: Predicting values such as future prices
        correct: true
        why: Prediction is a core ML job, such as estimating where stock trends or prices of goods will head.
      - id: b
        text: Hard-coding rules such as a fixed pastry pairing
        why: A hand-written rule is classical programming, the opposite of a model that learns its job from data.
      - id: c
        text: Making decisions such as routing a caller
        correct: true
        why: ML can decide where to send a caller by understanding what they asked for out loud.
      - id: d
        text: Detecting anomalies such as account fraud
        correct: true
        why: ML can learn normal behavior and flag the rare events, such as fraud, that do not fit it.
      - id: e
        text: Following scripts such as a rule-based phone menu
        why: A rule-based menu runs fixed steps someone wrote, so it learns nothing from data and is not ML work.
    evidence:
      - ML predicts (stock trends, prices of goods), decides (routing a caller by spoken request) and detects anomalies (online-banking fraud).
      - ML predicts, decides and detects anomalies.
    takeaway: Business uses of ML fall into predicting values, making decisions and detecting anomalies.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Options 1 and 2 are both fixed rules or scripts, leaving the three ML-style items as the set.)"
  - id: q-710dgr
    version: 1
    status: live
    type: match
    pool: practice
    concept: aws-ai-ml-stack
    note: m08/ai-ml-on-aws
    task: "3.7"
    level: 2
    stem: >-
      Match each cafe project to the tier of the AWS AI/ML stack it belongs in.
    pairs:
      - left: Read the daily specials aloud with a voice model that is ready to use
        right: AI services
        why: A pre-trained model that does one set job, like text to speech, sits in the AI services tier.
      - left: Build and train its own sales model while AWS runs the tooling
        right: ML services
        why: Creating a custom model on a managed platform such as SageMaker AI is the ML services tier.
      - left: Tune a fully custom model on purpose-built chips it sets up itself
        right: ML frameworks and infrastructure
        why: Specialized work on chosen frameworks and ML hardware the team manages is the bottom, fully custom tier.
    evidence:
      - "AI services: managed, pre-trained models for set jobs, such as Amazon Polly (text to speech) and Amazon Comprehend (text and sentiment)."
      - "ML services: for more customization, you create, train and ship custom models in Amazon SageMaker AI while AWS manages infrastructure, tools and workflows, with experiments, data visuals, debugging and monitoring in one place."
      - "ML frameworks and infrastructure: fully custom work for specialized needs, on purpose-built chips with popular frameworks or ML-optimized EC2."
    takeaway: The more a project needs its own model and its own hardware choices, the further down the AI/ML stack it sits.
    history: []
    verified:
      keyHash: 53d4febdb9cd
      fullHash: f014d9c7e795
