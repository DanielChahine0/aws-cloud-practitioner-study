      - id: b
        text: Proximity
        why: The stem says both Regions sit equally near the cafe's customers, so distance is a tie.
      - id: c
        text: Feature availability
        why: Every service the cafe uses runs in both Regions, so this factor gives no reason to prefer one.
      - id: d
        text: Pricing
        correct: true
        why: Energy costs and tax incentives shape each Region's own rates, which is the one factor still differing.
    evidence:
      - AWS pricing is transparent and granular, yet each Region has its own rates.
    takeaway: When compliance, proximity and services tie, a Region's own rates, shaped by local costs and taxes, can decide.
