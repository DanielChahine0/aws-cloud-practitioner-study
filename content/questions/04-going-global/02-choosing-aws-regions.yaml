  - id: q-2jhv42
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: gdpr
    note: m04/choosing-aws-regions
    task: "3.2"
    level: 1
    stem: >-
      What does GDPR require of an online shop in the EU that handles personal data?
    options:
      - id: a
        text: Let shoppers choose which Region stores their data
        why: GDPR covers consent and access to personal data, but the choice of Region stays with the shop, not its shoppers.
      - id: b
        text: Get shoppers' consent before collecting personal data
        correct: true
        why: GDPR makes the shop get people's agreement before it gathers their personal data.
      - id: c
        text: Keep shoppers' personal data inside the shop's home country
        why: Keeping data inside one country is what data sovereignty laws may force, not a duty GDPR sets here.
      - id: d
        text: Meet PCI rules for every card payment shoppers make
        why: PCI rules govern payment card handling, a separate standard from the EU privacy law on personal data.
      - id: e
        text: Let shoppers see and erase the data held on them
        correct: true
        why: GDPR gives people the right to see the data held about them and to have it removed.
    evidence:
      - Under GDPR, the EU privacy law, an EU online shop must get consent before collecting personal data and let people see or erase it.
      - Data sovereignty laws may force data to stay in the country, which touches both compliance and cost.
    takeaway: GDPR requires consent before collecting personal data and lets people see or erase what is held.
