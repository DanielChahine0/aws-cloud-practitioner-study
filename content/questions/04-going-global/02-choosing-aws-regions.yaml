  - id: q-wnmrtr
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-govcloud-regions
    note: m04/choosing-aws-regions
    task: "3.2"
    level: 2
    stem: >-
      The cafe wins a contract to run meal ordering for a US federal agency, and the agency requires strict physical, operational and personnel controls on the hosting site.
      Where should the cafe run this workload?
    options:
      - id: a
        text: AWS GovCloud Regions
        correct: true
        why: These Regions carry the strict controls built for US federal bodies and the contractors working for them.
      - id: b
        text: A standard AWS Region
        why: A standard Region lacks the extra physical, operational and personnel controls the agency requires.
      - id: c
        text: AWS Outposts on premises
        why: Outposts puts AWS hardware in the cafe's own site, which does not supply the agency-grade controls.
      - id: d
        text: Amazon CloudFront edge locations
        why: Edge locations cache content near users and are not where a federal workload is hosted.
    evidence:
      - AWS GovCloud Regions carry strict physical, operational and personnel controls for US government bodies and contractors.
      - US government workload -> AWS GovCloud Regions.
    takeaway: A US government workload, or a contractor's, needing strict controls belongs in AWS GovCloud Regions.
    history: []
