questions:
  - id: q-vs9t9x
    version: 1
    status: live
    type: single
    pool: practice
    concept: region-selection
    note: m04/choosing-aws-regions
    task: "3.2"
    level: 2
    stem: >-
      The cafe's new ordering app will serve customers who live mostly in Singapore, and no law limits where its data may be kept.
      Which Region selection factor most directly points the cafe to the Singapore Region?
    options:
      - id: a
        text: Compliance
        why: No law restricts where the data lives here, so compliance does not pick the Region.
      - id: b
        text: Proximity
        correct: true
        why: Hosting near the customers in Singapore cuts the delay and keeps the app responsive.
      - id: c
        text: Feature availability
        why: Nothing in the scenario says a needed service is missing from any candidate Region.
      - id: d
        text: Pricing
        why: The choice here is driven by where the customers are, not by comparing Regional rates.
    evidence:
      - Customers mostly in Singapore -> the Singapore Region, not Virginia.
      - A distant Region adds delay, which can hurt user satisfaction and overall efficiency.
    takeaway: With no legal limits on data location, placing the Region close to most users lowers latency.
    history: []
    verified:
      keyHash: 6ff290bdc913
      fullHash: b8f0e46d57da
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-b3he22
    version: 1
    status: live
    type: single
    pool: practice
    concept: region-selection
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 1
    stem: >-
      When weighing the factors for choosing an AWS Region, which factor should a business check first because it can settle the choice on its own?
    options:
      - id: a
        text: Proximity
        why: Distance to users matters, but it is weighed after any legal rule on data location.
      - id: b
        text: Pricing
        why: Regional rates are compared only once the legally allowed Regions are known.
      - id: c
        text: Compliance
        correct: true
        why: A law on where data may live can rule out every other Region before anything else is weighed.
      - id: d
        text: Feature availability
        why: Service availability has no fixed rank and cannot override a legal requirement.
    evidence:
      - Check compliance first, since a legal rule can settle the Region alone, but most businesses have none and move on to the rest.
      - Compliance comes first and can decide alone; the other three have no fixed ranking.
    takeaway: Compliance is checked first because a data location law can decide the Region by itself.
    history: []
