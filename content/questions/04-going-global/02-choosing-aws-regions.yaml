    concept: regional-pricing
    note: m04/choosing-aws-regions
    task: "3.2"
    level: 1
    stem: >-
      Which local conditions help set the AWS rates in a given Region?
    options:
      - id: a
        text: Energy and operating costs
        correct: true
        why: The cost of running and powering facilities in that place feeds into the Region's rates.
      - id: b
        text: Local taxes and tax incentives
        correct: true
        why: Taxes and incentives differ from place to place and shape what each Region charges.
      - id: c
        text: Software licensing fees
        why: Licensing is an on-premises concern and is not one of the local conditions behind Regional rates.
      - id: d
        text: Server hardware specs
        why: Hardware specs are an on-premises concern, since AWS picks and runs the hardware in every Region.
      - id: e
        text: Uptime and performance levels
        why: Uptime and performance are broadly equal across Regions, so they do not explain differing rates.
    evidence:
      - AWS pricing is transparent and granular, yet each Region has its own rates.
      - Uptime and performance are broadly equal across Regions, and licensing or hardware specs are on-premises concerns.
    takeaway: Regional AWS rates follow local operating and energy costs plus local taxes and tax incentives.
