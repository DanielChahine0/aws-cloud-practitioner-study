  - id: q-w2pk5v
    version: 1
    status: live
    type: single
    pool: practice
    concept: gdpr
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 2
    stem: >-
      The cafe opens an online shop selling coffee beans to customers across the EU.
      Which regulation requires it to get consent before collecting their personal data?
    options:
      - id: a
        text: HIPAA
        why: HIPAA is a US law about health information, not EU shoppers' personal data.
      - id: b
        text: PCI
        why: PCI covers payment card handling and is not the EU privacy law on consent.
      - id: c
        text: GDPR
        correct: true
        why: The EU privacy law makes an online shop ask for consent before collecting personal data.
      - id: d
        text: Data sovereignty laws
        why: These laws are about keeping data inside a country, not about collecting consent.
    evidence:
      - Under GDPR, the EU privacy law, an EU online shop must get consent before collecting personal data and let people see or erase it.
      - EU online retailer -> GDPR compliance.
    takeaway: An online shop selling to EU customers must follow GDPR, starting with consent before collecting personal data.
