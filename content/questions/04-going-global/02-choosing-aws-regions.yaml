  - id: q-2jhv42
    version: 1
    status: draft
    type: multi
    select: 2
    pool: practice
    concept: gdpr
    note: m04/choosing-aws-regions
    task: "3.2"
    level: 1
    stem: >-
      What does GDPR require of an online shop in the EU that handles personal data?
    options:
      - id: a
        text: Ask for consent before gathering personal data
        correct: true
        why: GDPR makes the shop get people's agreement before it gathers their personal data.
      - id: b
        text: Store all personal data in AWS GovCloud Regions
        why: GovCloud Regions serve US government bodies and contractors, not EU privacy rules.
      - id: c
        text: Allow people to view or delete their own data
        correct: true
        why: GDPR gives people the right to see the data held about them and to have it removed.
      - id: d
        text: Handle personal data under HIPAA health rules
        why: Health record rules come from HIPAA, a US law, rather than from the EU privacy law.
      - id: e
        text: Delete personal data after each completed order
        why: GDPR lets people ask for erasure, but it does not force the shop to wipe data after every order.
    evidence:
      - Under GDPR, the EU privacy law, an EU online shop must get consent before collecting personal data and let people see or erase it.
    takeaway: GDPR requires consent before collecting personal data and lets people see or erase what is held.
    history: []
