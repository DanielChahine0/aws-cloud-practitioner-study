    stem: >-
      The cafe's new app is built around an AWS capability that launched only recently.
      Before it picks a Region, what should the cafe confirm about each candidate Region?
    options:
      - id: a
        text: Whether its laws allow the app's data to live there
        why: Data location laws matter for compliance, but the stem's concern is a newly launched service, not a legal rule.
      - id: b
        text: Whether it sits close to most of the app's customers
        why: Distance to users shapes latency, but nearness does not tell the cafe whether the new service runs there.
