    concept: aws-govcloud-regions
    note: m04/choosing-aws-regions
    task: "2.2"
    level: 1
    stem: >-
      Which trait sets AWS GovCloud Regions apart from standard AWS Regions?
    options:
      - id: a
        text: Walls that keep data from crossing into other Regions
        why: Every Region is isolated from the others, so this trait does not set GovCloud Regions apart.
      - id: b
        text: Rates shaped by local operating costs and taxes
        why: Each Region has its own rates, so local pricing is shared by standard Regions and GovCloud alike.
      - id: c
        text: Extra physical, operational and personnel controls
        correct: true
        why: GovCloud Regions add strict controls on site, operations and staff for US government bodies and contractors.
      - id: d
        text: Data bound by the laws of the host country
        why: Data in any Region follows the host country's laws, so this is not unique to GovCloud Regions.
    evidence:
      - AWS GovCloud Regions carry strict physical, operational and personnel controls for US government bodies and contractors.
      - "Isolation is a security feature: each Region is walled off from all others, and data crosses that line only with your explicit permission."
    takeaway: AWS GovCloud Regions stand out from standard Regions by adding strict controls for US government work.
