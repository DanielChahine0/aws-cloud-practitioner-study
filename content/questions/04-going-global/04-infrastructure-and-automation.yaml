  - id: q-2yjc4y
    version: 1
    status: live
    type: single
    pool: practice
    concept: infrastructure-as-code
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      Infrastructure as code is called declarative.
      Which statement explains what that word says about the way the cafe's definitions are written?
    options:
      - id: a
        text: They are kept in source control as a blueprint
        why: IaC files do live in source control, but that is where they are kept, not what declarative means.
      - id: b
        text: They name the end state and leave out the steps
        correct: true
        why: Declarative means stating what should exist and leaving how to build it to the tooling.
      - id: c
        text: They can rebuild the same setup in other Regions
        why: Rebuilding anywhere is a benefit of IaC, but it does not describe the declarative way of writing it.
      - id: d
        text: They are carried out by tools calling AWS APIs
        why: Tools do turn definitions into API calls, but that is how they run, not what declarative means.
    evidence:
      - IaC is declarative, so teams can version, review and automate deployments.
      - "**Declarative**: Stating what should exist, not how to build it."
      - Infrastructure as code (IaC) stores the architecture as a source-controlled blueprint that tools rebuild anywhere, identically and easily.
    takeaway: IaC is declarative, so definitions say what should exist and tools work out how to build it.
    history: []
