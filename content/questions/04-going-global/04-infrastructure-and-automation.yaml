  - id: q-dv03bv
    version: 1
    status: live
    type: single
    pool: practice
    concept: programmatic-access
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      The cafe's developer reaches AWS only through AWS CLI commands in a terminal on her laptop and AWS SDK calls in the loyalty app's code, never through a browser.
      What is this way of using AWS called?
    options:
      - id: a
        text: Console access
        why: Console access means working in the browser-based AWS Management Console, which the developer avoids.
      - id: b
        text: CloudShell access
        why: AWS CloudShell is a terminal opened in the browser, and the developer never works through a browser.
      - id: c
        text: Infrastructure as code
        why: IaC declares a whole architecture in templates, not individual CLI commands and SDK calls.
      - id: d
        text: Programmatic access
        correct: true
        why: Using AWS through code, with the AWS CLI or SDKs, is programmatic access.
    evidence:
      - "**Programmatic access**: Using AWS through code, with the AWS CLI or SDKs."
    takeaway: Programmatic access means driving AWS through code, using the AWS CLI or the AWS SDKs.
    history: []
