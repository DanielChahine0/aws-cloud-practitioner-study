  - id: q-kyqdw6
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudformation-templates
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 2
    stem: >-
      The cafe writes a CloudFormation template that lists a load balancer, two EC2 instances and a database, with no build steps.
      Once the cafe submits it, how do those resources get created?
    options:
      - id: a
        text: It reuses the template across accounts and Regions
        why: Reuse across accounts and Regions is a real benefit, but it does not say how this stack gets built.
      - id: b
        text: It provisions and configures them through AWS APIs
        correct: true
        why: CloudFormation reads what the template declares and provisions and configures it through AWS APIs.
      - id: c
        text: It frees the team's time to focus on its apps
        why: Saving the team time is a result of using CloudFormation, not the way the resources get built.
      - id: d
        text: It handles multi-tier stacks with tangled dependencies
        why: CloudFormation does cope with complex stacks, but that says what it can handle, not how it builds them.
    evidence:
      - Its templates are text files declaring what to build, not how, and it provisions and configures it all through AWS APIs.
      - CloudFormation models and sets up AWS resources from code, freeing time for apps.
      - It handles simple to complex multi-tier apps with intricate dependencies and, once learned, speeds deployment.
    takeaway: A template only declares what to build, and CloudFormation provisions it through AWS APIs.
