questions:
  - id: q-pgw2dj
    version: 1
    status: live
    type: single
    pool: practice
    concept: infrastructure-as-code
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      Which approach keeps a whole architecture as a declared blueprint in source control that tools rebuild the same way in any Region?
    options:
      - id: a
        text: Manual console provisioning
        why: Clicking through the console builds one resource at a time and stores no blueprint to rebuild from.
      - id: b
        text: Infrastructure as code
        correct: true
        why: IaC saves the architecture as versioned code that tools rebuild identically wherever needed.
      - id: c
        text: Scripted CLI automation
        why: CLI scripts list steps to run rather than declare a whole architecture, and they grow hard to maintain.
      - id: d
        text: Programmatic SDK calls
        why: SDK calls let app code perform single steps such as saving data, not rebuild an entire architecture.
    evidence:
      - Infrastructure as code (IaC) stores the architecture as a source-controlled blueprint that tools rebuild anywhere, identically and easily.
    takeaway: IaC turns the architecture into source-controlled code that rebuilds identically anywhere.
    history: []
    verified:
      keyHash: 8d21bb7454c7
      fullHash: e5de59d4ad71
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-gvkk1n
    version: 1
    status: live
    type: single
    pool: practice
    concept: infrastructure-as-code
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 2
    stem: >-
      The cafe is opening in several new Regions and builds each one with infrastructure as code.
      Its team wants to peer review every change to the setup and keep earlier versions of it.
      What about infrastructure as code makes that possible?
    options:
      - id: a
        text: It provisions and configures each resource through AWS APIs
        why: Calling AWS APIs is how resources get built, but it does not give the team anything to review or version.
      - id: b
        text: It handles multi-tier apps with intricate dependencies
        why: Handling complex dependencies is true of IaC, yet it says nothing about reviewing or versioning the setup.
      - id: c
        text: It speeds up deployments once the team has learned it
        why: Faster deployments are a benefit, but speed is not what lets the team review changes or keep old versions.
      - id: d
        text: It keeps the setup as a declarative, source-controlled file
        correct: true
        why: A declarative file under source control is something the team can review line by line and keep versions of.
    evidence:
      - IaC is declarative, so teams can version, review and automate deployments.
      - Infrastructure as code (IaC) stores the architecture as a source-controlled blueprint that tools rebuild anywhere, identically and easily.
    takeaway: IaC keeps the setup as a declarative, source-controlled file, which is what lets a team review and version it.
    history: []
    verified:
      keyHash: e5d9dc1a424e
      fullHash: 12971bdc578d
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-7pn04g
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-cloudformation
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 3
    stem: >-
      The cafe's ordering system runs on EC2 instances behind a load balancer with Auto Scaling in one Region.
      It wants an identical copy in a second Region, built from a text file that declares every resource.
      Which service fits?
    options:
      - id: a
        text: AWS Elastic Beanstalk
        why: Elastic Beanstalk runs uploaded app code on a managed platform rather than building a declared resource stack.
      - id: b
        text: AWS Config
        why: Config records and evaluates resource settings, but it does not provision anything.
      - id: c
        text: AWS CloudFormation
        correct: true
        why: CloudFormation reads one template and provisions the same stack in another Region.
      - id: d
        text: AWS Systems Manager
        why: Systems Manager helps operate existing resources rather than creating a stack from a template.
    evidence:
      - Copying Region A's setup to Region B -> one CloudFormation template.
      - One template across accounts or Regions gives identical environments from one command, with fewer errors and more resilience.
    takeaway: Copying a declared multi-resource stack to another Region is a job for one CloudFormation template.
    history: []
    verified:
      keyHash: f71300fed1ed
      fullHash: ab05c029dc33
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-stdqhj
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: aws-cloudformation
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      Which statements describe what AWS CloudFormation does?
    options:
      - id: a
        text: It provisions and configures resources through AWS APIs.
        correct: true
        why: CloudFormation turns the template into AWS API calls that create and configure each resource.
      - id: b
        text: It records resource settings and tracks how they change.
        why: Recording and tracking resource settings is what AWS Config does, not CloudFormation.
      - id: c
        text: It builds matching environments across accounts and Regions.
        correct: true
        why: Running the same template in each account or Region yields matching environments with fewer errors.
      - id: d
        text: It turns uploaded code into a running, auto-scaled web app.
        why: Turning uploaded code into a running web environment is AWS Elastic Beanstalk, not CloudFormation.
      - id: e
        text: It manages nodes centrally and automates their patching.
        why: Central node management and patching belong to AWS Systems Manager, not CloudFormation.
    evidence:
      - Its templates are text files declaring what to build, not how, and it provisions and configures it all through AWS APIs.
      - One template across accounts or Regions gives identical environments from one command, with fewer errors and more resilience.
    takeaway: CloudFormation provisions resources from code through AWS APIs and gives consistent environments across accounts and Regions.
    history: []
    verified:
      keyHash: edcaf7436a60
      fullHash: 4a4892ef61db
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-2w2z0q
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudformation-templates
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 1
    stem: >-
      What does an AWS CloudFormation template contain?
    options:
      - id: a
        text: A record of the API calls made in an account
        why: A record of API calls is an AWS CloudTrail log, not a template that builds anything.
      - id: b
        text: The allow and deny rules attached to an identity
        why: Allow and deny rules for an identity make up an IAM policy, not a template.
      - id: c
        text: A text declaration of the resources to build
        correct: true
        why: A template is a text file that declares what resources should exist for CloudFormation to create.
      - id: d
        text: A history of how resource settings have changed
        why: A history of resource setting changes comes from AWS Config, not from a template.
    evidence:
      - "**CloudFormation template**: A text document declaring the resources to build."
      - Its templates are text files declaring what to build, not how, and it provisions and configures it all through AWS APIs.
    takeaway: A CloudFormation template is a text file that declares what to build, leaving the how to CloudFormation.
    history: []
    verified:
      keyHash: 5a7cf818a2b3
      fullHash: f4180ef08463
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-gt9ahj
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloudformation-templates
    note: m04/infrastructure-and-automation
    task: "3.1"
    level: 2
    stem: >-
      The cafe already builds its loyalty app stack from a CloudFormation template in its main account.
      It now needs an identical environment in a separate testing account with as few mistakes as possible.
      What should it do?
    options:
      - id: a
        text: Script the test account's EBS backups with the CLI
        why: The CLI suits scripted routine jobs like EBS backups, but backups do not build the test environment.
      - id: b
        text: Deploy the same template in the test account
        correct: true
        why: Reusing one template across accounts produces an identical environment from one command.
      - id: c
        text: Keep the template in source control for review
        why: Source control keeps the template versioned and reviewable, yet storing it builds nothing in the test account.
      - id: d
        text: Check the test account's costs in the console
        why: The console suits billing dashboards, but checking costs creates none of the resources the test account needs.
    evidence:
      - One template across accounts or Regions gives identical environments from one command, with fewer errors and more resilience.
    takeaway: Reusing one template in another account or Region gives an identical environment with fewer errors.
    history: []
