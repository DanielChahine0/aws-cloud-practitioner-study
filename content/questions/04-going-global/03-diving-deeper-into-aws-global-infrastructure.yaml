questions:
  - id: q-1xez0y
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-az-deployment
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      The cafe's ordering app runs in one Availability Zone, and its customer data must stay inside a single Region.
      Which design keeps the app running if that Availability Zone fails?
    options:
      - id: a
        text: A multi-Region architecture
        why: Copying the app to a second Region would move customer data outside the one Region it must stay in.
      - id: b
        text: A multi-AZ deployment
        correct: true
        why: Spreading the app across Availability Zones in the same Region rides out one AZ failing and keeps data in that Region.
      - id: c
        text: An edge location cache
        why: Edge locations cache content for speed and are not a place to run the app or its data as a backup.
      - id: d
        text: An AWS Outposts rack
        why: Outposts runs AWS services in the cafe's own building, which adds no backup Availability Zone.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
      - "**Multi-Region** goes one step further and survives a whole Region going down."
    takeaway: When one AZ failure is the risk and data must stay in one Region, spread across AZs in that Region.
    history: []
    verified:
      keyHash: 1bfe5c27fe01
      fullHash: 0bb8165ed004
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-pq6kpe
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-az-deployment
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe runs its ordering app in two isolated groups of data centers inside one Region, with a backup ready in the second group.
      Which outage is this design built to survive?
    options:
      - id: a
        text: One entire Region going offline
        why: Both groups sit in the same Region, so losing that whole Region takes a multi-Region design instead.
      - id: b
        text: One edge location going offline
        why: Edge locations only cache content near users, so losing one is not the failure this backup addresses.
      - id: c
        text: One Availability Zone going offline
        correct: true
        why: Each isolated group is an Availability Zone, so the app moves to the backup AZ when its current AZ fails.
      - id: d
        text: The customers' internet going offline
        why: A customer's own link outage cuts access to every AZ alike, so a second group of data centers cannot help.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
    takeaway: A multi-AZ deployment protects an app from the failure of a single Availability Zone.
    history: []
    verified:
      keyHash: cd6ccd88d8bd
      fullHash: 2b21aa8172a7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
