  - id: q-098bfp
    version: 1
    status: live
    type: single
    pool: practice
    concept: multi-region-architecture
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe chain's leadership wants online ordering to stay up even if every Availability Zone in its Region goes dark at once.
      Which design meets that goal?
    options:
      - id: a
        text: A multi-AZ deployment
        why: Every AZ in the Region is down in this case, so a backup AZ in that same Region is gone too.
      - id: b
        text: An Amazon CloudFront distribution
        why: CloudFront speeds delivery from edge caches but still needs a working origin to run the ordering app.
      - id: c
        text: An Amazon EC2 Auto Scaling group
        why: Adding instances inside the failed Region does not help when the whole Region is offline.
      - id: d
        text: A multi-Region architecture
        correct: true
        why: Running copies in a second Region lets ordering continue when the first Region goes down entirely.
    evidence:
      - "**Multi-Region** goes one step further and survives a whole Region going down."
      - AZ or Region outage -> switch to a configured backup AZ or another Region.
    takeaway: Only a multi-Region design keeps an app running through the loss of a whole Region.
    history: []
    verified:
      keyHash: afe9a165433e
      fullHash: 152e6dafb7d7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-v5y6wc
    version: 1
    status: live
    type: multi
    select: 2
    pool: practice
    concept: multi-region-architecture
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 1
    stem: >-
      Which statements describe a multi-Region architecture?
    options:
      - id: a
        text: It keeps an app available when a whole Region fails.
        correct: true
        why: Copies of the app in another Region carry on serving users after the first Region is lost.
      - id: b
        text: It caches content at sites that sit outside Regions.
        why: Caching at sites outside Regions describes edge locations, not a design that spans Regions.
      - id: c
        text: It gives users high availability and fault tolerance.
        correct: true
        why: Spreading copies across Regions lets the app keep running and stay reachable when a hosting location fails.
      - id: d
        text: It runs AWS services inside your own data center.
        why: Running AWS services on premises is what AWS Outposts does, not a spread across Regions.
      - id: e
        text: It places every copy of an app inside one Region.
        why: Keeping every copy in one Region leaves the app down if that Region fails, the opposite of this design.
    evidence:
      - "**Multi-Region** goes one step further and survives a whole Region going down."
      - Multi-AZ and multi-Region designs give high availability, fault tolerance and low latency for end users.
    takeaway: Multi-Region extends redundancy past multi-AZ so an app survives the loss of an entire Region.
    history: []
