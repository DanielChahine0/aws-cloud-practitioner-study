    stem: >-
      The cafe runs its ordering app in a single Availability Zone.
      What must the cafe set up so the app keeps taking orders if that zone fails?
    options:
      - id: a
        text: A larger instance of the app in the same AZ
        why: A bigger instance still sits in the failed zone, so it goes down with that zone and orders stop.
      - id: b
        text: A standby copy of the app in a second AZ
        correct: true
        why: The app can only move to a backup AZ the cafe has set up ahead of time, so the copy in a second AZ keeps orders coming.
      - id: c
        text: A cached copy of the menu pages at edge locations
        why: Edge caches speed up delivery of content, but taking orders still needs the app running in a working zone.
      - id: d
        text: An archive of the app's log files in a second AZ
        why: Log files in another zone record what the app did, but nothing there runs the app or takes new orders.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
      - AZ or Region outage -> switch to a configured backup AZ or another Region.
    takeaway: A multi-AZ deployment works only when you set up a backup in a second AZ for the app to move to.
    history: []
