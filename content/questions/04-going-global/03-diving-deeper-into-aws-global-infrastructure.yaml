  - id: q-9cp0nn
    version: 1
    status: draft
    type: single
    pool: practice
    concept: multi-az-deployment
    note: m04/diving-deeper-into-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe's ordering app runs in one Availability Zone, with nothing set up anywhere else.
      A new barista says AWS will shift the app to another zone by itself if that zone fails.
      Which fact shows the barista is wrong?
    options:
      - id: a
        text: Each AZ has its own power and networking
        why: AZs do have their own power and networking, but that isolation does not move an app that runs in only one of them.
      - id: b
        text: A Region is split into three or more AZs
        why: A Region does hold three or more AZs, but spare zones nearby do not place the app in any of them.
      - id: c
        text: A backup AZ is one the customer sets up
        correct: true
        why: In a multi-AZ design the app moves to a backup AZ you set up, so with no backup configured it has nowhere to go.
      - id: d
        text: Edge locations sit apart from every AZ
        why: Edge locations are separate caching sites, which says nothing about whether an app gets moved between AZs.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
      - AZ or Region outage -> switch to a configured backup AZ or another Region.
      - A Region has three or more AZs, and each AZ has one or more data centers.
    takeaway: Multi-AZ protection works only once the customer sets up a backup AZ, since AWS does not move a single-AZ app on its own.
    history: []
    review:
      attempts: 6
      lastFailure: "critic: Option 4 (the key) repeats the stem's words 'set up' ('nothing set up anywhere else' vs 'one the customer sets up'), which points at the key."
