        why: Running AWS services on premises is what AWS Outposts does, not a spread across AZs.
      - id: e
        text: Help in meeting compliance needs
        correct: true
        why: Compliance is one of the bonuses a multi-AZ deployment brings alongside recovery and continuity.
      - id: f
        text: DNS routing from URLs to IP addresses
        why: Turning URLs into IP addresses is the job of Amazon Route 53, not a benefit of spreading across AZs.
    evidence:
      - "**Multi-AZ** covers one AZ failing: the app moves to a backup AZ you set up, with quicker disaster recovery, continuity, lower latency and compliance as bonuses."
      - "**Multi-Region** goes one step further and survives a whole Region going down."
