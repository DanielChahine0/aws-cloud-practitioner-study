      - id: b
        text: Inside each Region, alongside its AZs
        why: Edge locations are not part of a Region at all, so they do not sit beside its AZs.
      - id: c
        text: In sites apart from any Region or AZ
        correct: true
        why: Edge locations are caching sites placed outside Regions and AZs, in cities chosen to be near users.
      - id: d
        text: In a customer's own on-premises data center
        why: Running AWS services on premises is what AWS Outposts does, not what edge locations are.
    evidence:
      - Edge locations sit apart from Regions, in spots like Atlanta and Shanghai, and cache data, video and apps for higher transfer speeds and lower latency.
      - "**AWS Outposts**: Running AWS services on premises."
    takeaway: Edge locations are caching sites outside any Region or AZ, placed near users to cut latency.
