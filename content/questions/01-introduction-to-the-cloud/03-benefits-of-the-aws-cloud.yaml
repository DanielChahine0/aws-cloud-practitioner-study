questions:
  - id: q-58az7v
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: benefits-of-the-aws-cloud
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 1
    select: 2
    stem: >-
      The cafe's owner is listing what moving its systems to AWS would give the business.
      Which two items belong on that list as AWS Cloud benefits?
    options:
      - id: a
        text: Capacity that follows real demand
        correct: true
        why: Scaling with actual demand instead of a forecast is the stop guessing capacity benefit.
      - id: b
        text: A large upfront hardware purchase
        why: A big upfront purchase is the fixed expense that the cloud lets the cafe avoid.
      - id: c
        text: Deployment to new countries in minutes
        correct: true
        why: Reaching a Region abroad without building facilities is the go global in minutes benefit.
      - id: d
        text: Servers sized for a multiyear forecast
        why: Buying for a long forecast is the on-premises guesswork the cloud removes.
      - id: e
        text: Staff time spent racking servers
        why: Racking and powering servers is data center work that AWS takes off the cafe's hands.
    evidence:
      - "On AWS, spending follows usage and capacity follows demand."
      - A US company expanding to India can deploy to an AWS-managed Region there instead of building its own data centers, in minutes rather than months or years.
    takeaway: The cloud's benefits replace upfront buying and capacity guesswork with usage-based spending, demand-based scaling and fast global reach.
    history: []

  - id: q-bk0ykx
    version: 1
    status: draft
    type: match
    pool: practice
    concept: benefits-of-the-aws-cloud
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 2
    stem: >-
      Match each change the cafe sees after moving to AWS with the cloud benefit it shows.
    pairs:
      - left: The monthly bill now rises and falls with use
        right: Trade fixed expense for variable expense
        why: A bill that tracks consumption instead of a big upfront outlay is a variable expense.
      - left: A failed menu experiment is deleted and stops costing money
        right: Increase speed and agility
        why: Cheap, disposable test environments let the team try ideas quickly and drop the failures.
      - left: The app runs in a Region abroad without a new building
        right: Go global in minutes
        why: Deploying to an existing AWS Region abroad replaces months of building facilities.
      - left: Nobody on staff replaces failed server fans anymore
        right: Stop spending money on data centers
        why: Physical upkeep of servers is data center work that AWS now carries for the cafe.
    evidence:
      - Teams spin up test environments, try ideas and delete failures so costs stop, shifting time from provisioning and deprovisioning to innovating and optimizing.
      - AWS runs that physical layer, freeing time and money for customers and strategy.
    takeaway: Each cloud benefit shows up as a concrete change, from a usage-based bill to disposable test setups and quick launches abroad.
    history: []

  - id: q-bg0jsk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: trade-fixed-expense-for-variable-expense
    note: m01/benefits-of-the-aws-cloud
    task: "1.4"
    level: 2
    stem: >-
      The cafe used to spend a large sum on servers before it opened, and paid for them even in slow months.
      Now its AWS bill grows and shrinks with how much it actually uses.
      Which benefit does this change show?
    options:
      - id: a
        text: Trade fixed for variable expense
        correct: true
        why: Swapping a big upfront outlay for a bill that follows usage is exactly this benefit.
      - id: b
        text: Benefit from massive economies of scale
        why: Bulk buying lowers AWS's prices, but the stem is about when and how the cafe pays.
      - id: c
        text: Stop guessing capacity
        why: This benefit is about sizing resources to demand, not about the shape of the bill.
      - id: d
        text: Go global in minutes
        why: Nothing in the stem involves reaching customers in another country.
    evidence:
      - Owning a data center means paying hundreds of thousands to millions of dollars upfront for space, hardware, staff and upkeep, then budgeting around it even when usage is low.
      - On AWS the bill follows monthly usage, so you start small, spending matches consumption for more financial flexibility, and billing and budgeting tools help you save.
    takeaway: Paying as you consume instead of buying ahead is the shift from fixed to variable expense.
    history: []

  - id: q-6vyd19
    version: 1
    status: draft
    type: single
    pool: practice
    concept: trade-fixed-expense-for-variable-expense
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 1
    stem: >-
      In cloud economics, which description fits a variable expense?
    options:
      - id: a
        text: A cost that stays flat at any usage level
        why: A cost that ignores usage is a fixed expense, the opposite of a variable one.
      - id: b
        text: A cost that tracks how much you consume
        correct: true
        why: A variable expense moves with consumption, the way a monthly AWS bill does.
      - id: c
        text: A one-time payment made before any use
        why: Paying everything before use is the upfront model that a variable expense replaces.
      - id: d
        text: A price cut earned from bulk hardware buys
        why: Lower prices from huge purchase volumes describe economies of scale, not an expense type.
    evidence:
      - "**Variable expense**: a cost that follows consumption, like an AWS bill."
    takeaway: A variable expense follows consumption, while a fixed expense stays the same whatever the usage.
    history: []

  - id: q-wgwkn6
    version: 1
    status: draft
    type: single
    pool: practice
    concept: economies-of-scale
    note: m01/benefits-of-the-aws-cloud
    task: "1.4"
    level: 3
    stem: >-
      The cafe is a small startup with a tiny AWS account, yet it pays low prices for powerful hardware.
      The reason is that AWS buys equipment in enormous volumes for all of its data centers and shares the savings with every customer.
      Which benefit is this?
    options:
      - id: a
        text: Pay less by using more
        why: That principle lowers a customer's rates as its own usage grows, but this cafe uses very little.
      - id: b
        text: Trade fixed for variable expense
        why: That benefit is about paying as you go, not about why the unit price is low.
      - id: c
        text: Benefit from massive economies of scale
        correct: true
        why: AWS's bulk purchasing lowers prices for all customers, even the smallest ones.
      - id: d
        text: Stop guessing capacity
        why: That benefit is about sizing resources to demand, not about hardware prices.
    evidence:
      - AWS buys hardware in bulk for its worldwide data centers and passes the lower prices on.
      - So startups, not only big enterprises, can afford advanced technology.
    takeaway: Economies of scale come from AWS's combined purchasing power, so even small customers get lower prices.
    history: []

  - id: q-wfz00n
    version: 1
    status: draft
    type: single
    pool: practice
    concept: economies-of-scale
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 1
    stem: >-
      Which statement explains the economies of scale benefit of the AWS Cloud?
    options:
      - id: a
        text: The cafe's own rates fall as its usage grows into higher tiers
        why: Volume tiers for one customer's usage describe pay less by using more, a different idea.
      - id: b
        text: The cafe pays only for what it consumes each month
        why: Paying for consumption describes trading fixed expense for variable expense.
      - id: c
        text: The cafe adds or removes servers as demand changes
        why: Matching resources to demand is the stop guessing capacity benefit.
      - id: d
        text: AWS buys hardware in bulk and passes the lower prices on
        correct: true
        why: Huge purchase volumes across AWS lower unit prices, and customers get the savings.
    evidence:
      - AWS buys hardware in bulk for its worldwide data centers and passes the lower prices on.
      - "**Economies of scale**: lower unit prices from huge purchase volumes."
    takeaway: Economies of scale means AWS's bulk buying lowers prices, not that one customer's discount grows with its own usage.
    history: []

  - id: q-y1nwv1
    version: 1
    status: draft
    type: single
    pool: practice
    concept: stop-guessing-capacity
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 2
    stem: >-
      Before its loyalty app launched, the cafe chain bought servers for a large predicted crowd of members.
      Far fewer people joined, and most of the servers now sit unused.
      Which AWS Cloud benefit would have avoided this waste?
    options:
      - id: a
        text: Increase speed and agility
        why: Agility helps the team try ideas fast, but the waste here comes from sizing hardware to a forecast.
      - id: b
        text: Stop guessing capacity
        correct: true
        why: Provisioning for today and scaling with real demand avoids buying for a forecast that misses.
      - id: c
        text: Benefit from massive economies of scale
        why: Lower hardware prices would not stop the cafe from buying far more than it needs.
      - id: d
        text: Go global in minutes
        why: The problem is idle capacity, not reaching customers in another country.
    evidence:
      - "On premises you buy hardware for a forecast: plan for 10 million users over three years and get about 500,000, and the excess sits idle, while underestimating means a scramble for servers, degraded service and lost customers."
      - On AWS you provision for today and scale with real demand in minutes, not weeks or months, keeping performance optimal without over- or under-provisioning.
    takeaway: When buying hardware for a forecast leaves servers idle or short, the cloud fix is to stop guessing capacity and scale with demand.
    history: []

