    stem: >-
      The cafe bought too few servers for its festival-week forecast.
      On the first day, orders time out and customers walk off to other cafes.
      On AWS, what would the cafe do instead to keep orders flowing?
    options:
      - id: a
        text: Deploy the app to a Region in another country
        why: A Region abroad brings the app nearer to distant customers, but it adds no capacity for this festival rush.
      - id: b
        text: Provision for today and scale with real demand
        correct: true
        why: Sizing for today and scaling with real demand in minutes adds servers as the rush arrives, so orders keep flowing.
      - id: c
        text: Spin up a test environment and delete it if it fails
        why: Throwaway test environments help the team try ideas quickly, but they add no capacity during the rush.
      - id: d
        text: Pay a monthly bill that follows the app's usage
        why: Usage-based billing changes how the cafe pays, but on its own it adds no servers when orders pile up.
    evidence:
      - "On premises you buy hardware for a forecast: plan for 10 million users over three years and get about 500,000, and the excess sits idle, while underestimating means a scramble for servers, degraded service and lost customers."
      - On AWS you provision for today and scale with real demand in minutes, not weeks or months, keeping performance optimal without over- or under-provisioning.
    takeaway: On AWS the cafe sizes for today and scales with real demand in minutes, avoiding the lost orders an underestimate causes.
