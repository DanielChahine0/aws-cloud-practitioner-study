  - id: q-z5kgg6
    version: 1
    status: draft
    type: single
    pool: practice
    concept: increase-speed-and-agility
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 3
    stem: >-
      The cafe's developers want to test a new pre-order feature in a temporary environment.
      If customers dislike it, they will delete the environment so it stops costing anything.
      Which benefit does this way of working show?
    options:
      - id: a
        text: Stop guessing capacity
        why: That benefit is about matching resources to demand, not about trying ideas cheaply.
      - id: b
        text: Trade fixed for variable expense
        why: Usage-based billing helps, but the stem is about how fast the team can experiment.
