questions:
  - id: q-58az7v
    version: 1
    status: live
    type: multi
    pool: practice
    concept: benefits-of-the-aws-cloud
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 1
    select: 2
    stem: >-
      The cafe's owner is listing the six benefits of the AWS Cloud for a planning meeting, and has mixed in some other AWS principles by mistake.
      Which two items on the list are among the six benefits?
    options:
      - id: a
        text: Stop guessing capacity
        correct: true
        why: Scaling with real demand instead of a forecast is one of the six cloud benefits.
      - id: b
        text: Pay less by using more
        why: Volume discounts as usage grows are a pricing principle, not one of the six benefits.
      - id: c
        text: Go global in minutes
        correct: true
        why: Deploying to a Region abroad instead of building facilities there is one of the six benefits.
      - id: d
        text: Grant least privilege
        why: Allowing only the access someone needs is a security principle, not one of the six benefits.
      - id: e
        text: Enable MFA on the root user
        why: Protecting the root user is a security practice, not one of the six benefits of the cloud.
    evidence:
      - "The six benefits by their course names: trade fixed expense for variable expense, benefit from massive economies of scale, stop guessing capacity, increase speed and agility, stop spending money running and maintaining data centers, and go global in minutes."
    takeaway: Stop guessing capacity and go global in minutes sit among the six cloud benefits, while volume pricing and least privilege are other AWS principles.
    history: []
    verified:
      keyHash: f4810e18f99c
      fullHash: 638553b9153a
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-bk0ykx
    version: 1
    status: live
    type: match
    pool: practice
    concept: benefits-of-the-aws-cloud
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 2
    stem: >-
      Match each change the cafe sees after moving to AWS with the cloud benefit it shows.
    pairs:
      - left: The monthly bill now rises and falls with use
        right: Trade fixed expense for variable expense
        why: A bill that tracks consumption instead of a big upfront outlay is a variable expense.
      - left: The team tries several pre-order ideas in a week and keeps the one that works
        right: Increase speed and agility
        why: Quick, disposable test setups let the team try several ideas fast and move on from the rest.
      - left: The app runs in a Region abroad without a new building
        right: Go global in minutes
        why: Deploying to an existing AWS Region abroad replaces months of building facilities.
      - left: Nobody on staff replaces failed server fans anymore
        right: Stop spending money on data centers
        why: Physical upkeep of servers is data center work that AWS now carries for the cafe.
    evidence:
      - Teams spin up test environments, try ideas and delete failures so costs stop, shifting time from provisioning and deprovisioning to innovating and optimizing.
      - AWS runs that physical layer, freeing time and money for customers and strategy.
    takeaway: Each cloud benefit shows up as a concrete change, from a usage-based bill to fast experiments and quick launches abroad.
