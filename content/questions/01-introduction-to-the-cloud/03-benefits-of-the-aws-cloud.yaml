  - id: q-10werg
    version: 1
    status: draft
    type: single
    pool: practice
    concept: stop-spending-money-on-data-centers
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 3
    stem: >-
      The cafe closes its back-room server closet and moves everything to AWS.
      It no longer pays for the closet's power and cooling, and its tech worker stops fixing hardware and starts improving the ordering experience.
      Which benefit does this show?
    options:
      - id: a
        text: Trade fixed for variable expense
        why: That benefit is about paying with usage instead of upfront, not about who does the physical upkeep.
      - id: b
        text: Stop spending money on data centers
        correct: true
        why: AWS now carries the power, cooling and hardware work, freeing time and money for customers.
      - id: c
        text: Benefit from massive economies of scale
        why: Bulk hardware pricing does not explain the end of power bills and hardware repairs.
      - id: d
        text: Stop guessing capacity and scale on demand
        why: Matching servers to demand is a different benefit from handing over the physical layer.
    evidence:
      - A data center keeps costing money after it is built, for utilities, maintenance, and racking, stacking and powering servers.
      - AWS runs that physical layer, freeing time and money for customers and strategy.
    takeaway: Handing the physical upkeep of servers to AWS frees time and money for customers, which is stopping spending on data centers.
    history: []

  - id: q-fmws3a
    version: 1
    status: draft
    type: single
    pool: practice
    concept: stop-spending-money-on-data-centers
    note: m01/benefits-of-the-aws-cloud
    task: "1.4"
    level: 2
    stem: >-
      A cafe chain has already paid to build its own small data center.
      Which kind of cost keeps arriving after construction is done?
    options:
      - id: a
        text: The original build of the server room
        why: Construction is a one-time cost that the stem says is already paid.
      - id: b
        text: Power, cooling and repairs for the servers
        correct: true
        why: Utilities and upkeep keep costing money for as long as the data center runs.
      - id: c
        text: A monthly cloud bill for unused capacity
        why: A company running its own data center is not billed by a cloud provider for it.
      - id: d
        text: Discounts lost on bulk hardware purchases
        why: Missing out on bulk pricing is not a recurring operating cost of a data center.
    evidence:
      - A data center keeps costing money after it is built, for utilities, maintenance, and racking, stacking and powering servers.
    takeaway: A data center keeps costing money after it is built, which is why handing that layer to AWS saves money.
    history: []

  - id: q-dn0smx
    version: 1
    status: draft
    type: single
    pool: practice
    concept: go-global-in-minutes
    note: m01/benefits-of-the-aws-cloud
    task: "3.2"
    level: 3
    stem: >-
      A US cafe chain is opening shops in India and wants its ordering app to run close to customers there.
      It plans to use an AWS Region in India rather than build its own facilities.
      Which benefit does this plan rely on?
    options:
      - id: a
        text: Increase speed and agility
        why: Agility is about experimenting and shipping quickly, not about reaching a new country.
      - id: b
        text: Go global in minutes
        correct: true
        why: Deploying to an existing AWS Region abroad takes minutes instead of building data centers.
      - id: c
        text: Stop guessing capacity
        why: Scaling with demand helps once the app runs there, but it does not place the app abroad.
      - id: d
        text: Benefit from massive economies of scale
        why: Lower hardware prices do not explain how the chain reaches customers in India.
    evidence:
      - A US company expanding to India can deploy to an AWS-managed Region there instead of building its own data centers, in minutes rather than months or years.
    takeaway: Using an AWS Region abroad instead of building facilities there is what going global in minutes means.
    history: []

  - id: q-sga9hz
    version: 1
    status: draft
    type: single
    pool: practice
    concept: go-global-in-minutes
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 1
    stem: >-
      What lets a company start serving users in another country in minutes rather than months?
    options:
      - id: a
        text: Building its own data center in that country
        why: Building facilities abroad takes months or years, the delay this benefit removes.
      - id: b
        text: Deploying to an AWS Region already in that country
        correct: true
        why: AWS already runs Regions abroad, so deploying there replaces the slow build.
      - id: c
        text: Shipping its current servers to that country
        why: Moving physical hardware abroad is still slow on-premises work, not a cloud benefit.
      - id: d
        text: Spinning up throwaway test environments at home
        why: Disposable test setups show speed and agility, but they do not reach users abroad.
    evidence:
      - A US company expanding to India can deploy to an AWS-managed Region there instead of building its own data centers, in minutes rather than months or years.
    takeaway: Going global in minutes comes from deploying to Regions AWS already runs, not from building or shipping hardware.
    history: []
