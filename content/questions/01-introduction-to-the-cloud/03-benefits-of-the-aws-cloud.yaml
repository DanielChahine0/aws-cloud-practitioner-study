  - id: q-bg0jsk
    version: 1
    status: live
    type: single
    pool: practice
    concept: trade-fixed-expense-for-variable-expense
    note: m01/benefits-of-the-aws-cloud
    task: "1.4"
    level: 2
    stem: >-
      The cafe used to spend a large sum on servers before it opened, and paid for them even in slow months.
      Now its AWS bill grows and shrinks with how much it actually uses.
      Which benefit does this change show?
    options:
      - id: a
        text: Trade fixed for variable expense
        correct: true
        why: Swapping a big upfront outlay for a bill that follows usage is exactly this benefit.
      - id: b
        text: Benefit from massive economies of scale
        why: Bulk buying lowers AWS's prices, but the stem is about when and how the cafe pays.
      - id: c
        text: Stop guessing capacity
        why: This benefit is about sizing resources to demand, not about the shape of the bill.
      - id: d
        text: Go global in minutes
        why: Nothing in the stem involves reaching customers in another country.
    evidence:
      - Owning a data center means paying hundreds of thousands to millions of dollars upfront for space, hardware, staff and upkeep, then budgeting around it even when usage is low.
      - On AWS the bill follows monthly usage, so you start small, spending matches consumption for more financial flexibility, and billing and budgeting tools help you save.
    takeaway: Paying as you consume instead of buying ahead is the shift from fixed to variable expense.
    history: []
    verified:
      keyHash: 20fd72914943
      fullHash: e92e2ff1f965
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-6vyd19
    version: 1
    status: live
    type: multi
    pool: practice
    concept: trade-fixed-expense-for-variable-expense
    note: m01/benefits-of-the-aws-cloud
    task: "1.1"
    level: 2
    select: 3
    stem: >-
      The cafe runs its ordering system on AWS.
      Its loyalty system runs on servers and storage the cafe bought outright, over a network line with a flat monthly fee.
      Which three of these costs are variable expenses?
    options:
      - id: a
        text: Ordering system compute
        correct: true
        why: Compute on AWS is billed by the time it runs, so this cost follows the cafe's use.
      - id: b
        text: Loyalty system storage
        why: Storage bought outright was paid for up front and costs the same however much is kept.
      - id: c
        text: Loyalty system compute
        why: The loyalty servers were bought outright, so their cost does not change with how busy they are.
      - id: d
        text: Ordering system storage
        correct: true
        why: Storage on AWS is billed by how much the cafe keeps, so the charge moves with its use.
      - id: e
        text: Ordering system network traffic
        correct: true
        why: Data sent from AWS is billed by the amount, so it rises and falls with orders.
      - id: f
        text: Loyalty system network traffic
        why: The flat monthly fee for the line stays the same whatever traffic it carries.
    evidence:
      - "**Variable expense**: a cost that follows consumption, like an AWS bill."
      - "**Fixed expense**: a cost that does not change with usage."
    takeaway: A variable expense follows consumption, while a fixed expense stays the same whatever the usage.
    history: []
    verified:
      keyHash: 031a60172790
      fullHash: 73156b5f9ef7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

