      Before uploading its recipe files to AWS, the cafe patches the office laptop's operating system and encrypts the files on the laptop.
      Later it leaves the stored copies open to anyone with a link by mistake.
      What keeps the recipes unreadable to a stranger who opens them?
    options:
      - id: a
        text: AWS guarding the buildings that hold its storage
        why: Guarding the buildings stops physical theft, but it does nothing about a link the cafe left open.
      - id: b
        text: The cafe patching the laptop's operating system
        why: Patching protects the laptop itself, but it does not change what a stranger sees in the stored copies.
      - id: c
        text: The cafe encrypting the files on the laptop
        correct: true
        why: Files encrypted before upload stay scrambled in storage, so an open link still shows nothing readable.
      - id: d
        text: AWS keeping each customer's storage apart
        why: Isolation separates one customer from another, but a stranger with the open link goes around it.
    evidence:
      - Encrypted data stays unreadable even if access is left open.
      - "**Client-side encryption**: encrypting data on the client before the server gets it."
    takeaway: Client-side encryption keeps data unreadable even when the cafe leaves access open by mistake.
