  - id: q-a7kxvk
    version: 1
    status: live
    type: single
    pool: practice
    concept: operating-system-patching
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 2
    stem: >-
      AWS spots a security flaw in the operating system on the cafe's server, and the vendor has already released a patch.
      Who installs that patch on the server?
    options:
      - id: a
        text: AWS
        why: AWS has no back door into the cafe's system, so it can only alert the cafe, not install anything.
      - id: b
        text: The cafe
        correct: true
        why: Only the cafe can sign in to its own system, so installing the patch falls to the cafe after AWS alerts it.
      - id: c
        text: The vendor
        why: The vendor supplies the patch, but it has no access to the cafe's server to install it.
      - id: d
        text: AWS and the cafe jointly
        why: AWS cannot sign in to the cafe's system, so there is no part of the install it could share.
    evidence:
      - "AWS spots a flaw in a customer's OS: it can only alert them, and they patch."
      - Only you can sign in to your OS or add users, since AWS has no back door.
    takeaway: AWS can only alert a customer about an OS flaw, and the customer applies the patch.
    history: []
    verified:
      keyHash: e3bc364cd427
      fullHash: 81df27b1aac2
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
