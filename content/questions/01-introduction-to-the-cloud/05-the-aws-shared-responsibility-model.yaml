        text: Isolating the menu servers from other tenants
        correct: true
        why: AWS secures the hypervisor and network isolation that keep one customer's machines away from another's.
      - id: d
        text: Choosing which staff can edit the menu files
        why: Deciding who reaches the cafe's own data is security in the cloud, so it is always the cafe's duty, never AWS's.
      - id: e
        text: Maintaining the hardware under the menu service
        correct: true
        why: Upkeep of the hardware that runs every service is part of what AWS secures underneath its customers.
      - id: f
        text: Setting up the firewall around the menu servers
        why: Firewall and network setup shift between AWS and the cafe depending on the service, so it is not a fixed AWS duty.
    evidence:
      - AWS owns security of the cloud, including all physical security, and the customer owns security in the cloud.
      - "Hypervisor layer: a virtualization layer that AWS secures."
      - Server-side encryption and OS, network and firewall setup vary by service.
    takeaway: AWS's fixed share covers the facilities, hardware and isolation layers, while encryption and network setup vary by service.
