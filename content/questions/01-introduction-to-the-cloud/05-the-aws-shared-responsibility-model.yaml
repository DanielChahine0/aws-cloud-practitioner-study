  - id: q-hbrcyf
    version: 1
    status: live
    type: single
    pool: practice
    concept: client-side-encryption
    note: m01/the-aws-shared-responsibility-model
    task: "2.2"
    level: 1
    stem: >-
      The cafe scrambles its recipe files on the office laptop, so no AWS server ever holds a readable copy.
      What is this practice called?
    options:
      - id: a
        text: Server-side encryption
        why: Server-side encryption is done by the service after the files arrive, so the server would see them first.
      - id: b
        text: Encryption in transit
        why: Encryption in transit guards data only while it moves, and the files would be readable again on arrival.
      - id: c
        text: Client-side encryption
        correct: true
        why: Encrypting on the sender's own machine before upload means the server only ever receives scrambled files.
      - id: d
        text: Encryption at rest
        why: Encryption at rest is applied to data once it is stored, not on the laptop before anything is sent.
    evidence:
      - "Client-side encryption: encrypting data on the client before the server gets it."
    takeaway: Client-side encryption locks the data on your own side before any server receives it.
    history: []
    verified:
      keyHash: 67738251c8c0
      fullHash: 69cbbb48ae27
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-6p35gq
    version: 1
    status: draft
    type: single
    pool: practice
    concept: client-side-encryption
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 2
    stem: >-
      The cafe scrambles its secret recipe files on the office laptop and only then uploads them to an AWS storage service.
      Who is responsible for that scrambling step?
    options:
      - id: a
        text: AWS, whichever service stores the files
        why: AWS never touches data on the cafe's laptop, so encryption before upload cannot be its duty.
      - id: b
        text: AWS or the cafe, depending on the service
        why: The owner shifts by service for encryption the service does, but not for encryption done before upload.
      - id: c
        text: AWS and the cafe together, on every service
        why: Encrypting on the client is not split between parties, since it happens before AWS receives anything.
      - id: d
        text: The cafe, whichever service stores the files
        correct: true
        why: Encryption done on the client before upload is always a customer duty, whatever service holds the files.
    evidence:
      - Customers patch their OS and secure applications, data, access and client-side encryption.
      - Server-side encryption and OS, network and firewall setup vary by service.
    takeaway: Encryption done on your own machine before upload is always your duty, unlike server-side encryption.
