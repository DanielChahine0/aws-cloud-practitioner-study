      The cafe's owner asks what stops a stranger from walking into a data center and pulling out the disk that holds the cafe's sales history.
      Which party handles that risk?
    options:
      - id: a
        text: AWS
        correct: true
        why: Physical security of the data centers is part of AWS's share and is never handed to customers.
      - id: b
        text: The cafe
        why: The cafe has no access to AWS buildings, so it cannot control who walks into them.
      - id: c
        text: The cafe and AWS jointly
        why: Physical security is never split with customers, so it is not a joint duty.
      - id: d
        text: The cafe's internet provider
        why: A network carrier has no role in guarding the inside of an AWS facility.
    evidence:
      - AWS owns security of the cloud, including all physical security, and the customer owns security in the cloud.
    takeaway: Physical protection of AWS facilities and hardware sits fully with AWS as security of the cloud.
