      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"

  - id: q-x67nxf
    version: 1
    status: draft
    type: single
    pool: practice
    concept: security-in-the-cloud
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 3
    stem: >-
      The cafe stored its staff schedules on AWS and left them open to anyone with the link, and a competitor read them.
      Under the AWS shared responsibility model, which part of security did this lapse fall into?
    options:
      - id: a
        text: Security of the cloud, owned by AWS
        why: That part covers facilities, hardware and isolation, not the access choices a customer makes for its own data.
      - id: b
        text: A duty whose owner varies by service
        why: The varying duties are things like server-side encryption and firewall setup, not who may open the cafe's files.
      - id: c
        text: Security in the cloud, owned by the cafe
        correct: true
        why: Choosing who can reach stored data is the customer's part, so the open setting was the cafe's own lapse.
      - id: d
        text: A duty that AWS and the cafe split evenly
        why: The model gives each duty to one owner or ties it to the service, and data access sits wholly with the cafe.
    evidence:
      - "You choose what data to store and, via AWS controls, who reaches it: everyone, some users, one person under conditions, or nobody."
      - AWS owns security of the cloud, including all physical security, and the customer owns security in the cloud.
    takeaway: Access settings on your own data are security in the cloud, so a wrong setting is the customer's lapse.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"

  - id: q-5m1zcb
    version: 1
    status: draft
    type: single
    pool: practice
    concept: security-in-the-cloud
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 1
    stem: >-
      Under the AWS shared responsibility model, which set of duties makes up security in the cloud?
    options:
      - id: a
        text: Facilities, hardware, networking and hypervisor isolation
        why: These sit underneath every service and belong to AWS, so they make up security of the cloud.
      - id: b
        text: Data, applications, access and data center surveillance
        why: Surveillance of the data centers is physical security, which AWS alone handles as security of the cloud.
      - id: c
        text: Hardware upkeep, applications, data and operating system patches
        why: Upkeep of the hardware behind the services is AWS's job, so this set mixes in a duty of the cloud.
      - id: d
        text: Data, applications, access and operating system patches
        correct: true
        why: Security in the cloud is the customer's share, which covers what it stores and runs and who can reach it.
    evidence:
      - "Security in the cloud: the customer's share."
      - Customers patch their OS and secure applications, data, access and client-side encryption.
    takeaway: Security in the cloud is the customer's share of data, apps, access and patches, while AWS protects what lies underneath.
