questions:
  - id: q-s4anj8
    version: 1
    status: live
    type: single
    pool: practice
    concept: shared-responsibility-model
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 1
    stem: >-
      The AWS shared responsibility model is often pictured as a house.
      In that picture, which role stands for AWS?
    options:
      - id: a
        text: The owner who locks the doors
        why: Locking the doors is what the customer does with its own data and access, so this role is the customer.
      - id: b
        text: The builder who makes the doors solid
        correct: true
        why: AWS builds and guards the platform underneath, just as a builder makes the doors strong before anyone moves in.
      - id: c
        text: The landlord who rents the house out
        why: Renting sounds like paying for cloud use, but the picture casts AWS as the one who builds, not one who leases.
      - id: d
        text: The locksmith who fits the locks
        why: Fitting locks sounds like supplying access controls, but the picture gives AWS the solid doors, not the locks.
    evidence:
      - "House analogy: the builder makes the doors solid, the owner locks them."
    takeaway: AWS is the builder that makes the platform solid, and the customer is the owner who locks what it keeps inside.
    history: []
    verified:
      keyHash: 9d6195a1e051
      fullHash: f417a92d4852
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-rbxpza
    version: 1
    status: live
    type: match
    pool: practice
    concept: shared-responsibility-model
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 2
    stem: >-
      The cafe is moving its ordering system to AWS and wants a clear list of who handles each security job.
      Match each job to the party that owns it.
    pairs:
      - left: Guarding the buildings where the servers sit
        right: AWS
        why: Physical protection of facilities is an AWS duty that customers never share.
      - left: Deciding which staff can open the sales records
        right: The cafe
        why: The customer chooses who reaches its data, so access to the sales records is the cafe's call.
      - left: Setting up server-side encryption for stored orders
        right: It depends on the service used
        why: Who owns server-side encryption changes from one AWS service to another.
    evidence:
      - AWS owns security of the cloud, including all physical security, and the customer owns security in the cloud.
      - Server-side encryption and OS, network and firewall setup vary by service.
    takeaway: Each security job has an owner under the model, and a few of them shift depending on the service.
    history: []
