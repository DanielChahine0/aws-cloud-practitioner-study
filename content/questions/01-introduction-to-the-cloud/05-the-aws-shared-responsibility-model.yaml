  - id: q-a7kxvk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: operating-system-patching
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 2
    stem: >-
      AWS spots a security flaw in the operating system on the cafe's server, and the vendor has already released a patch.
      Who installs that patch on the server?
    options:
      - id: a
        text: AWS
        why: AWS has no back door into the cafe's system, so it can only alert the cafe, not install anything.
      - id: b
        text: The cafe
        correct: true
        why: Only the cafe can sign in to its own system, so installing the patch falls to the cafe after AWS alerts it.
      - id: c
        text: The vendor
        why: The vendor supplies the patch, but it has no access to the cafe's server to install it.
      - id: d
        text: AWS and the cafe jointly
        why: AWS cannot sign in to the cafe's system, so there is no part of the install it could share.
    evidence:
      - "AWS spots a flaw in a customer's OS: it can only alert them, and they patch."
      - Only you can sign in to your OS or add users, since AWS has no back door.
    takeaway: AWS can only alert a customer about an OS flaw, and the customer applies the patch.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"

  - id: q-qzp0f5
    version: 1
    status: draft
    type: single
    pool: practice
    concept: operating-system-patching
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 1
    stem: >-
      Under the AWS shared responsibility model, which step in fixing a flaw in the operating system a customer runs can only the customer perform?
    options:
      - id: a
        text: Supplying the patch for the flaw
        why: The vendor of the operating system supplies the patch, so this step is not the customer's.
      - id: b
        text: Spotting the flaw in the system
        why: AWS can spot a flaw in a customer's system too, so this step is not the customer's alone.
      - id: c
        text: Sending an alert about the flaw
        why: Alerting the customer is the one thing AWS can do when it finds a flaw, so others perform this step.
      - id: d
        text: Applying the patch to the system
        correct: true
        why: The vendor supplies the patch, and installing it on the system is the customer's job alone.
    evidence:
      - The vendor supplies OS patches, but applying them is yours alone.
      - "AWS spots a flaw in a customer's OS: it can only alert them, and they patch."
    takeaway: The vendor publishes OS patches, but on AWS the customer is the one who applies them.
