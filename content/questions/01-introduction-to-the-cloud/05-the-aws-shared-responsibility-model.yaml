  - id: q-4y1pk6
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: security-of-the-cloud
    note: m01/the-aws-shared-responsibility-model
    task: "2.1"
    level: 2
    select: 3
    stem: >-
      The cafe runs its online menu on AWS.
      Which duties does AWS always carry for the cafe, whatever service the menu runs on?
    options:
      - id: a
        text: Guarding entry to the data center buildings
        correct: true
        why: Physical access control at the facilities belongs to AWS alone and is never handed to the cafe.
      - id: b
        text: Encrypting the menu files the service stores
        why: Who handles encryption done by the service changes from one service to another, so AWS does not always own it.
      - id: c
        text: Isolating the menu servers from other tenants
        correct: true
        why: AWS secures the hypervisor and network isolation that keep one customer's machines away from another's.
      - id: d
        text: Configuring the firewall around the menu servers
        why: Firewall setup is one of the duties whose owner changes with the service, so it is not always AWS's.
      - id: e
        text: Maintaining the hardware under the menu service
        correct: true
        why: Upkeep of the hardware that runs every service is part of what AWS secures underneath its customers.
      - id: f
        text: Configuring the network around the menu servers
        why: Network setup shifts between AWS and the cafe depending on the service, so it is not a fixed AWS duty.
    evidence:
      - AWS owns security of the cloud, including all physical security, and the customer owns security in the cloud.
      - "Hypervisor layer: a virtualization layer that AWS secures."
      - Server-side encryption and OS, network and firewall setup vary by service.
    takeaway: AWS's fixed share covers the facilities, hardware and isolation layers, while encryption and network setup vary by service.
    history: []
