questions:
  - id: q-wg72jh
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-computing-definition
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      The cafe's staff open the ordering system from a browser at the shop, at home and on delivery runs, and no server sits in any cafe building.
      Which part of the cloud computing definition does this way of reaching the system show?
    options:
      - id: a
        text: On-demand delivery
        why: On-demand delivery is about how fast resources appear and scale, not about where staff reach them from.
      - id: b
        text: Over the internet
        correct: true
        why: Staff reach the system remotely through a web-based service from any location, with no local hardware.
      - id: c
        text: Pay-as-you-go pricing
        why: Pay-as-you-go describes how the cafe is billed, not how its staff get to the ordering system.
      - id: d
        text: IT resources
        why: IT resources names what is delivered, such as servers and databases, not the remote way staff use them.
    evidence:
      - "Over the internet: remote use through web-based services, not local hardware, from anywhere."
    takeaway: Reaching resources remotely from anywhere, with nothing installed on site, is the over-the-internet part of cloud computing.
    history: []
    verified:
      keyHash: ee412f1c48ec
      fullHash: 0f8f50deca7e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-s3meps
    version: 1
    status: live
    type: match
    pool: practice
    concept: cloud-computing-definition
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 1
    stem: Match each part of the cloud computing definition to what it means for the cafe.
    pairs:
      - left: On-demand delivery
        right: Extra capacity is ready within seconds and can shrink again when the rush passes.
        why: Getting resources quickly and scaling them up or down is what on-demand delivery promises.
      - left: IT resources
        right: Servers, storage, databases and networking that run the cafe's apps.
        why: IT resources are the building blocks themselves, such as servers, storage and databases.
      - left: Over the internet
        right: Staff use the systems remotely from any place with a connection.
        why: Over the internet means remote use through web-based services instead of local hardware.
      - left: Pay-as-you-go pricing
        right: The bill follows actual consumption rather than a fixed long-term contract.
        why: Pay-as-you-go ties cost to what is consumed, with no long-term commitment.
    evidence:
      - "Definition, in order: (1) on-demand delivery (2) of IT resources (3) over the internet (4) with pay-as-you-go pricing."
    takeaway: The four parts work together as fast access to resources, the resources themselves, remote use and billing by consumption.
    history: []
    verified:
      keyHash: 258152978ca9
      fullHash: 0108b19541be
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-r96y1p
    version: 1
    status: draft
    type: single
    pool: practice
    concept: on-demand-delivery
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      For a holiday promotion, the cafe runs extra servers on AWS, is billed for the hours they run, and lets its staff manage them from home.
      Which detail of this setup shows on-demand delivery?
    options:
      - id: a
        text: Staff manage the servers from home through a browser.
        why: Managing servers remotely through web-based services is the over-the-internet part, not on-demand delivery.
      - id: b
        text: The bill covers only the hours the servers actually run.
        why: Paying only for the hours consumed is pay-as-you-go pricing, not how the servers are delivered.
      - id: c
        text: The extra servers are ready in seconds, with no long setup.
        correct: true
        why: Getting capacity within seconds and dropping it again without lengthy setup is on-demand delivery.
      - id: d
        text: The promotion runs on servers, storage and a database.
        why: Servers, storage and databases are the IT resources being delivered, not the on-demand way they arrive.
    evidence:
      - "On-demand delivery: resources in seconds, scaled up or down without long setup, the idea AWS began with."
    takeaway: On-demand delivery is about how fast resources arrive and leave, apart from where they are used from or how they are billed.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Option 4 is the only detail not described in the stem's setup besides option 1, and the stem names billing and remote management, so a reader can rule out options 2 and 3 as already labelled and guess the new detail."

  - id: q-d3jmvj
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: on-demand-delivery
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 1
    select: 2
    stem: Which statements describe on-demand delivery in cloud computing?
    options:
      - id: a
        text: New servers are ready within seconds of a request.
        correct: true
        why: Getting resources in seconds, whenever they are needed, is the core of on-demand delivery.
      - id: b
        text: The bill reflects only the resources actually consumed.
        why: Paying only for what is consumed is pay-as-you-go pricing, a separate part of the definition.
      - id: c
        text: Added capacity needs no lengthy setup before it is used.
        correct: true
        why: Skipping long setup work when capacity is added or removed is part of what on-demand delivery offers.
      - id: d
        text: Teams reach their systems remotely through web services.
        why: Remote use through web-based services is the over-the-internet part of the definition.
      - id: e
        text: Servers, storage and databases are supplied to build apps.
        why: Servers, storage and databases are the IT resources themselves, not the way they are delivered.
    evidence:
      - "On-demand delivery: resources in seconds, scaled up or down without long setup, the idea AWS began with."
      - "On-demand delivery: resources within seconds, whenever needed."
    takeaway: On-demand delivery means resources in seconds and easy scaling, which is separate from how the bill is calculated.
    history: []
    review:
      attempts: 3
      lastFailure: "solve-closed: a second option is defensible: On-demand delivery means resources are available quickly when needed without lengthy setup; option 2 describes pay-as-you-go but is often bundled into the same definition."

  - id: q-525s43
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-center
    note: m01/what-is-cloud-computing
    task: "3.2"
    level: 1
    stem: What is the name for one or more buildings that hold servers and protect them with spare power, cooling and physical security?
    options:
      - id: a
        text: AWS Region
        why: A Region is a geographic area that contains Availability Zones, not a single facility of servers.
      - id: b
        text: Edge location
        why: An edge location is a site that serves cached copies of content close to users, not the term for a server facility.
      - id: c
        text: Data center
        correct: true
        why: A data center is a facility of servers protected by backup power, cooling and physical security.
      - id: d
        text: AWS Outposts
        why: Outposts puts AWS infrastructure inside a customer's own facility, so it is not the name for the facility itself.
    evidence:
      - A data center is one or more buildings of servers with redundant power, cooling and security.
    takeaway: A data center is a physical facility of servers with redundant power, cooling and security.
    history: []
    verified:
      keyHash: 381e5c8e190c
      fullHash: a3517588383e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-xh0w3d
    version: 1
    status: draft
    type: single
    pool: practice
    concept: data-center
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      The cafe chain runs its own server room, and its IT staff spend most weeks fixing the cooling, testing backup power and checking door locks.
      What changes most when the chain moves to data centers that AWS runs?
    options:
      - id: a
        text: The staff rent space in a shared facility and keep running the hardware there.
        why: Renting space in a shared facility is co-location, where the chain still runs the hardware itself.
      - id: b
        text: AWS takes over the facility upkeep, and the staff spend that time on new features.
        correct: true
        why: AWS looks after the buildings it owns, which frees the staff from repetitive chores for innovation.
      - id: c
        text: The staff keep doing the facility upkeep, but now inside a building that AWS owns.
        why: AWS looks after the facilities it owns, so the chain's staff no longer run the cooling or power there.
      - id: d
        text: AWS takes over the facility upkeep, and the chain no longer pays for its compute.
        why: The chain still pays for what it consumes, so moving to AWS data centers does not make compute free.
    evidence:
      - Firms once ran their own or co-located, but AWS lets them use data centers they do not own, trading upkeep and repetitive chores for innovation.
    takeaway: Using AWS data centers swaps the upkeep of your own facility for time spent on innovation.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"

  - id: q-t9h3cy
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-based-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 3
    stem: >-
      A new cafe brand builds its whole ordering platform on AWS from the start, using virtual servers, databases and networking there.
      It keeps no servers in any shop or office, and AWS is its only provider. Which deployment type is this?
    options:
      - id: a
        text: Hybrid deployment
        why: Hybrid mixes in-house and cloud resources, but this brand keeps nothing in-house.
      - id: b
        text: Multi-cloud deployment
        why: Multi-cloud spreads work across several cloud providers, but this brand uses AWS alone.
      - id: c
        text: On-premises deployment
        why: On-premises keeps resources in-house, while this brand runs everything on AWS.
      - id: d
        text: Cloud-based deployment
        correct: true
        why: Running every part of the platform in the cloud, with nothing on site, is a cloud-based deployment.
    evidence:
      - "Cloud-based (public cloud): all in the cloud, migrated or newly built, for example moving data first, then building an app of virtual servers, databases and networking."
    takeaway: When every resource runs in the cloud and nothing stays in-house, the deployment is cloud-based, also called public cloud.
    history: []
    verified:
      keyHash: 763c3afd6878
      fullHash: 7dc9e3119439
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-sx7j3y
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-based-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 2
    stem: >-
      The cafe likes the easy scaling and low upfront cost of moving everything to the cloud, but a rule says its staff health records must stay on premises.
      Why does a cloud-based deployment alone fall short of that rule?
    options:
      - id: a
        text: It bills the cafe for consumption instead of a fixed contract.
        why: Billing by consumption is true of the cloud, but it says nothing about where the records are kept.
      - id: b
        text: It lets the cafe add capacity within seconds of asking.
        why: Fast capacity is a real cloud benefit, but it does not decide whether records stay on premises.
      - id: c
        text: It runs every resource in the cloud, with none kept on site.
        correct: true
        why: A cloud-based deployment is all cloud, so on its own it cannot keep sensitive records on premises.
      - id: d
        text: It lets staff reach the systems remotely from any location.
        why: Remote access is a real cloud trait, but it is not what puts the records outside the building.
    evidence:
      - It scales well with little upfront cost, but alone cannot keep sensitive data on premises for compliance.
    takeaway: Cloud-based deployment scales cheaply but, being all cloud, cannot by itself keep sensitive data on premises.
    history: []
    verified:
      keyHash: ec1e44808d83
      fullHash: b04ce05e2ae3
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-s9rz1v
    version: 1
    status: live
    type: single
    pool: practice
    concept: on-premises-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 2
    stem: >-
      The cafe's head office keeps all its servers in its own building and adds virtualization to get more use out of them.
      The owner values having dedicated machines with very low latency. Which deployment type is this?
    options:
      - id: a
        text: Cloud-based deployment
        why: Cloud-based puts everything in the cloud, but this office keeps every server in its own building.
      - id: b
        text: Hybrid deployment
        why: Hybrid combines in-house and cloud resources, and this office uses no cloud resources at all.
      - id: c
        text: Multi-cloud deployment
        why: Multi-cloud spreads work across cloud providers, while this office runs nothing in any cloud.
      - id: d
        text: On-premises deployment
        correct: true
        why: Keeping all servers in-house, with virtualization to lift utilization, is an on-premises deployment.
    evidence:
      - "On-premises: largely legacy IT plus virtualization and application management to try to lift utilization, missing many cloud benefits but offering dedicated resources and low latency."
    takeaway: An all in-house setup that leans on virtualization for better utilization is on-premises deployment.
    history: []
    verified:
