    stem: Which situations point the cafe toward a hybrid deployment?
    options:
      - id: a
        text: A regulation keeps payroll in-house, and the other systems run in the cloud.
        correct: true
        why: Regulation that holds some systems on site while others go to the cloud calls for a hybrid mix.
      - id: b
        text: A regulation once kept payroll in-house, and now every system runs in the cloud.
        why: Compliance shapes the choice but is not a deployment type, and an all-cloud setup is cloud-based.
      - id: c
        text: The older ordering system stays in-house, and new apps run in-house, not in the cloud.
        why: With the old system and the new apps all kept in-house, nothing runs in the cloud, so it is on-premises.
      - id: d
        text: The older ordering system stays in-house for upkeep, and new apps run in the cloud.
        correct: true
        why: A legacy system kept in-house for maintenance next to new cloud apps is the classic hybrid case.
      - id: e
        text: The older ordering system leaves its in-house servers, and new apps run in the cloud.
        why: Moving the old system out of its in-house servers leaves everything in the cloud, which is cloud-based.
    evidence:
      - "Hybrid: in-house and cloud resources together, for legacy systems kept in-house for maintenance or regulation."
    takeaway: Hybrid fits when maintenance or regulation keeps some systems in-house while other work runs in the cloud.
