  - id: q-4k7ydm
    version: 1
    status: draft
    type: single
    pool: practice
    concept: hybrid-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 2
    stem: >-
      The cafe chain has an older inventory system in its back-office server room and is launching a new loyalty app.
      Which plan gives the chain a hybrid deployment?
    options:
      - id: a
        text: Every system runs on AWS, and staff open them from laptops in the back office.
        why: Using cloud systems from an office laptop is still all cloud, which makes it a cloud-based deployment.
      - id: b
        text: The inventory system stays in the server room, and the loyalty app runs on AWS.
        correct: true
        why: Keeping a legacy system in-house while new work runs in the cloud mixes the two, which is hybrid.
      - id: c
        text: Every system stays in the server room, and staff reach them from home by browser.
        why: Remote access to servers that all stay in-house is still an on-premises deployment, not hybrid.
      - id: d
        text: The inventory system moves to AWS, and the loyalty app is built on AWS as well.
        why: Moving the old system out and building the new app in the cloud leaves nothing in-house, so it is cloud-based.
    evidence:
      - "Hybrid: in-house and cloud resources together, for legacy systems kept in-house for maintenance or regulation."
    takeaway: In-house legacy systems running alongside new cloud workloads make a hybrid deployment.
    history: []
