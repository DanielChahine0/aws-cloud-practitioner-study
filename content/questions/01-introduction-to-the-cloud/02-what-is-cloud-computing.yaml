  - id: q-525s43
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-center
    note: m01/what-is-cloud-computing
    task: "3.2"
    level: 1
    stem: What is the name for one or more buildings that hold servers and protect them with spare power, cooling and physical security?
    options:
      - id: a
        text: AWS Region
        why: A Region is a geographic area that contains Availability Zones, not a single facility of servers.
      - id: b
        text: Edge location
        why: An edge location is a site that serves cached copies of content close to users, not the term for a server facility.
      - id: c
        text: Data center
        correct: true
        why: A data center is a facility of servers protected by backup power, cooling and physical security.
      - id: d
        text: AWS Outposts
        why: Outposts puts AWS infrastructure inside a customer's own facility, so it is not the name for the facility itself.
    evidence:
      - A data center is one or more buildings of servers with redundant power, cooling and security.
    takeaway: A data center is a physical facility of servers with redundant power, cooling and security.
    history: []
    verified:
      keyHash: 381e5c8e190c
      fullHash: a3517588383e
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-xh0w3d
    version: 1
    status: live
    type: single
    pool: practice
    concept: data-center
    note: m01/what-is-cloud-computing
    task: "1.1"
    level: 2
    stem: >-
      The cafe chain runs its own server room, and its IT staff spend most weeks fixing the cooling, testing backup power and checking door locks.
      After the chain moves to data centers that AWS runs, what happens to those weekly chores?
    options:
      - id: a
        text: The chain is billed for what it consumes, not for a fixed contract.
        why: Consumption billing is true of AWS, but it says nothing about who now fixes cooling or tests power.
      - id: b
        text: AWS handles the facility upkeep, so staff can work on new features.
        correct: true
        why: AWS looks after the buildings it owns, which frees the staff from repetitive chores for innovation.
      - id: c
        text: The chain can add servers within seconds when an order rush starts.
        why: Fast capacity is a real AWS benefit, but it does not answer who now does the facility chores.
      - id: d
        text: The chain can run its apps in data centers in many parts of the world.
        why: Global reach is true of AWS, but it does not say what happens to the cooling and power checks.
    evidence:
      - Firms once ran their own or co-located, but AWS lets them use data centers they do not own, trading upkeep and repetitive chores for innovation.
    takeaway: Using AWS data centers swaps the upkeep of your own facility for time spent on innovation.
    history: []
    verified:
      keyHash: 2513afc243b0
      fullHash: c63d5d86208c
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-t9h3cy
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-based-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 3
    stem: >-
      A new cafe brand builds its whole ordering platform on AWS from the start, using virtual servers, databases and networking there.
      It keeps no servers in any shop or office, and AWS is its only provider. Which deployment type is this?
    options:
      - id: a
        text: Hybrid deployment
        why: Hybrid mixes in-house and cloud resources, but this brand keeps nothing in-house.
      - id: b
        text: Multi-cloud deployment
        why: Multi-cloud spreads work across several cloud providers, but this brand uses AWS alone.
      - id: c
        text: On-premises deployment
        why: On-premises keeps resources in-house, while this brand runs everything on AWS.
      - id: d
        text: Cloud-based deployment
        correct: true
        why: Running every part of the platform in the cloud, with nothing on site, is a cloud-based deployment.
    evidence:
      - "Cloud-based (public cloud): all in the cloud, migrated or newly built, for example moving data first, then building an app of virtual servers, databases and networking."
    takeaway: When every resource runs in the cloud and nothing stays in-house, the deployment is cloud-based, also called public cloud.
    history: []
    verified:
      keyHash: 763c3afd6878
      fullHash: 7dc9e3119439
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09

  - id: q-sx7j3y
    version: 1
    status: live
    type: single
    pool: practice
    concept: cloud-based-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 2
    stem: >-
      The cafe likes the easy scaling and low upfront cost of moving everything to the cloud, but a rule says its staff health records must stay on premises.
      Why does a cloud-based deployment alone fall short of that rule?
    options:
      - id: a
        text: It bills the cafe for consumption instead of a fixed contract.
        why: Billing by consumption is true of the cloud, but it says nothing about where the records are kept.
      - id: b
        text: It lets the cafe add capacity within seconds of asking.
        why: Fast capacity is a real cloud benefit, but it does not decide whether records stay on premises.
      - id: c
        text: It runs every resource in the cloud, with none kept on site.
        correct: true
        why: A cloud-based deployment is all cloud, so on its own it cannot keep sensitive records on premises.
      - id: d
        text: It lets staff reach the systems remotely from any location.
        why: Remote access is a real cloud trait, but it is not what puts the records outside the building.
    evidence:
      - It scales well with little upfront cost, but alone cannot keep sensitive data on premises for compliance.
    takeaway: Cloud-based deployment scales cheaply but, being all cloud, cannot by itself keep sensitive data on premises.
    history: []
    verified:
