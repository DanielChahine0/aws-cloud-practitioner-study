  - id: q-zs219x
    version: 1
    status: live
    type: multi
    pool: practice
    concept: hybrid-deployment
    note: m01/what-is-cloud-computing
    task: "3.1"
    level: 2
    select: 2
    stem: >-
      The cafe plans to move most of its systems to the cloud.
      Which situations point it toward a hybrid deployment rather than a fully cloud-based one?
    options:
      - id: a
        text: A regulation says staff payroll records must be held on premises.
        correct: true
        why: Regulation that holds some records on site while the rest moves to the cloud calls for a hybrid mix.
      - id: b
        text: The weekend rush needs extra capacity that is ready within seconds.
        why: Fast capacity is something a fully cloud-based deployment already gives, so it does not call for hybrid.
      - id: c
        text: The owner wants dedicated servers with very low latency for every app.
        why: Dedicated, low-latency resources for every app point to keeping everything in-house, which is on-premises rather than a mix.
      - id: d
        text: The older ordering system is maintained by the cafe's own technicians.
        correct: true
        why: A legacy system kept in-house for maintenance next to new cloud apps is the classic hybrid case.
      - id: e
        text: Every new app must be built and run in the cafe's own server room.
        why: Keeping all new work in-house as well leaves nothing in the cloud, which is on-premises rather than hybrid.
    evidence:
      - "Hybrid: in-house and cloud resources together, for legacy systems kept in-house for maintenance or regulation."
    takeaway: Hybrid fits when maintenance or regulation keeps some systems in-house while other work runs in the cloud.
