questions:
  - id: q-azv9sz
    version: 1
    status: draft
    type: match
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe plans how to deploy and run its loyalty app in the AWS Cloud, with a phone app for guests and a back end hosted by AWS.
      Match each piece of the plan to where it runs or how it is reached.
    pairs:
      - left: The guest-facing loyalty app
        right: Runs on each guest's own phone
        why: The app guests hold is the client side of the deployment, so it stays on their devices rather than in AWS.
      - left: The back end that checks and saves points
        right: Runs on a virtual server in an AWS data center
        why: On AWS the server side is deployed as a virtual server in AWS data centers instead of the cafe's own hardware.
      - left: Each request for a points balance
        right: Reaches the back end over the internet
        why: In this deployment, clients reach the scalable servers in AWS over the internet.
    evidence:
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
      - In the coffee shop, the customer is the client and the barista is the server, which on AWS would be a virtual server.
    takeaway: Deploying an app on AWS puts the server side on virtual servers in AWS data centers, which client devices reach over the internet.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The stem already says 'a phone app for guests and a back end hosted by AWS', which hands out the first two pairs before any reasoning."
  - id: q-e81xws
    version: 1
    status: draft
    type: single
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe moves the back end of its ordering app from a computer in the back room to AWS.
      Guests keep placing orders from the same app on their phones.
      After the move, what checks and fulfils each order a guest sends?
    options:
      - id: a
        text: The computer in the cafe's back room
        why: The back end has left the back room, so that computer no longer answers the app's orders.
      - id: b
        text: The phone each guest orders from
        why: The phone sends the order and shows the reply, which is the client's part, not the work of fulfilling it.
      - id: c
        text: A virtual machine in an AWS data center
        correct: true
        why: Once the back end runs on AWS, a virtual server there takes the server role and answers each request.
      - id: d
        text: The network link that carries the order
        why: The internet only carries the exchange, and it neither checks nor fulfils the order.
    evidence:
      - In the coffee shop, the customer is the client and the barista is the server, which on AWS would be a virtual server.
      - The client depends on the server to fulfil requests, and the server does nothing until a client asks.
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
    takeaway: Moving a back end to AWS keeps the client-server model, with a virtual server in AWS answering the client's requests.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-2k67rk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "4.1"
    level: 3
    stem: >-
      The cafe tries an online gift-card service on AWS for one month.
      It signs no contract and agrees to no term, and every server hour it runs is billed at the same rate however few or many it uses.
      Which AWS pricing approach is the cafe using?
    options:
      - id: a
        text: Pay less by using more
        why: That approach lowers the rate as usage grows, but here every hour costs the same.
      - id: b
        text: Save when you commit
        why: Committing to a term earns a discount, and the cafe agreed to no term at all.
      - id: c
        text: Pay-as-you-go pricing
        correct: true
        why: Paying a set rate only for the hours that actually run, with no contract or prepayment, is pay-as-you-go.
      - id: d
        text: Tiered pricing
        why: Tiers change the unit price as volume crosses each step, but here the rate never changes with usage.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: No contract, no term and a flat charge only for what runs is pay-as-you-go pricing.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Options 1 and 3 are noun phrases ending in 'pricing' while options 2 and 4 are slogans, so the options are not parallel in grammar."
  - id: q-9wx5re
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.4"
    level: 1
    select: 2
    stem: >-
      The cafe's owner asks what pay-as-you-go pricing on AWS would mean for a new ordering site.
      Which statements are accurate?
    options:
      - id: a
        text: Unused hours in one month carry over as credit to the next
        why: Pay-as-you-go charges only for what was consumed, so there are no banked hours to carry forward.
      - id: b
        text: Nothing is paid before the site uses any resources
        correct: true
        why: AWS asks for no prepayment, so the site can start without an upfront charge.
      - id: c
        text: The hourly rate drops after the first year of steady use
        why: Pay-as-you-go needs no term and gives no loyalty discount, since the site pays only for what it uses.
      - id: d
        text: Each month's bill depends on what the site consumed
        correct: true
        why: Charges track real consumption, much like wages paid only for hours on shift.
      - id: e
        text: A server that is removed keeps billing until the month ends
        why: Paying only for what you consume means a removed server stops adding charges right away.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: Pay-as-you-go means no upfront payment and a bill that follows actual consumption.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-va2dze
    version: 1
    status: draft
    type: single
    pool: practice
    concept: resource-provisioning
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.4"
    level: 2
    stem: >-
      The cafe ran extra servers on AWS for a holiday promotion.
      When the promotion closes, the owner releases those extra servers.
      When do the charges for them end?
    options:
      - id: a
        text: At the end of the current billing month
        why: AWS does not bill a released server to the end of the month, because its charges have already stopped.
      - id: b
        text: Right when the servers are released
        correct: true
        why: Billing for a resource ends the moment it is deprovisioned, so releasing the servers ends the charges at once.
      - id: c
        text: Once the last promotion orders are settled
        why: Charges follow the servers themselves, not the orders, so settling orders has no effect on their billing.
      - id: d
        text: After a set notice period for removals
        why: There is no notice period on AWS, since a released resource stops billing straight away.
    evidence:
      - Billing for a resource ends the moment it is deprovisioned.
      - "**Deprovisioning**: releasing unneeded resources, which ends their charges immediately."
    takeaway: A resource's charges stop the moment it is deprovisioned, with no wait for a billing cycle to end.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
  - id: q-cec23m
    version: 1
    status: draft
    type: single
    pool: practice
    concept: resource-provisioning
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.1"
    level: 2
    stem: >-
      During a local festival week, orders on the cafe's website spike on some days and stay normal on others, and nobody knows in advance which days will be busy.
      The owner wants the site to keep up without paying for capacity that sits unused.
      Which approach on AWS fits?
    options:
      - id: a
        text: Add servers before festival week and remove them when it ends
        why: Extra servers held for the whole week sit idle, yet still billed, on the festival's quiet days.
      - id: b
        text: Add servers as orders climb and remove them when the week ends
        why: Keeping the added servers until the week is over pays for them through every quiet day after a spike.
      - id: c
        text: Add servers as orders climb and remove them as orders drop
        correct: true
        why: Provisioning as demand rises and deprovisioning as it fades keeps capacity matched to each busy day.
      - id: d
        text: Keep the usual servers and add more only if the site fails
        why: Waiting for a failure means the site falls behind during each spike instead of keeping up.
    evidence:
      - You provision resources when demand appears and deprovision them as fast when it fades, by hand or automatically through configuration.
    takeaway: Provision resources as demand rises and deprovision them as it falls, so capacity follows the load.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone"
