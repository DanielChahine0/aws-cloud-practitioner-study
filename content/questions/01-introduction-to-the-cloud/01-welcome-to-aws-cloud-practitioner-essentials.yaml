questions:
  - id: q-azv9sz
    version: 1
    status: live
    type: match
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe deploys its loyalty program on AWS, and guests check their points from their own devices.
      Match each part of the deployment to the job it does when a guest asks for a balance.
    pairs:
      - left: A guest's phone
        right: Sends the request and displays the reply
        why: The phone is the client, so it asks for the balance and shows what comes back.
      - left: A virtual server in an AWS data center
        right: Validates the request and works out the balance
        why: The virtual server is the server side, which checks the request and processes the stored points.
      - left: The internet
        right: Carries the request and the reply between them
        why: In cloud computing, clients reach the servers in AWS over the internet, which links the two sides.
    evidence:
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
      - In the coffee shop, the customer is the client and the barista is the server, which on AWS would be a virtual server.
    takeaway: On AWS the guest's device stays the client, a virtual server in AWS is the server, and the internet links them.
    history: []
    verified:
      keyHash: 8ba36cbeb11a
      fullHash: 5ff58380eca9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-e81xws
    version: 1
    status: live
    type: single
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe deploys its ordering app's back end on virtual servers in AWS, and guests order from the app on their phones.
      A guest taps to place an order.
      Which step starts that exchange?
    options:
      - id: a
        text: The server in AWS checks the order is valid and allowed
        why: Checking the order is validation, which the server can only do after an order has arrived from the phone.
      - id: b
        text: The phone sends the order over the internet to AWS
        correct: true
        why: The server does nothing until a client asks, so the phone's request over the internet comes first.
      - id: c
        text: The server in AWS stores and processes the order data
        why: Storing and processing the order is server work that follows the request, so it cannot start the exchange.
      - id: d
        text: The phone shows the confirmation that AWS returns
        why: Showing the reply is the last step on the client side, after the server has sent its response.
    evidence:
      - The client depends on the server to fulfil requests, and the server does nothing until a client asks.
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
    takeaway: With the back end on AWS, each exchange still starts with the client sending a request over the internet to the server.
    history: []
    verified:
      keyHash: a8ea896b22f2
      fullHash: "002681882610"
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
  - id: q-2k67rk
    version: 1
    status: live
    type: single
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "4.1"
    level: 3
    stem: >-
      The cafe tries an online gift-card service on AWS for one month.
      It pays nothing upfront, agrees to no term, and is charged only for the server hours the service actually consumes.
      Which pricing approach is the cafe using?
    options:
      - id: a
        text: Fixed monthly pricing
        why: A fixed monthly price is owed whether or not the servers run, but the cafe pays only for hours consumed.
      - id: b
        text: Term commitment pricing
        why: A term commitment such as a Savings Plan earns a lower rate, and the cafe agreed to no term at all.
      - id: c
        text: Pay-as-you-go pricing
        correct: true
        why: Paying only for the hours actually consumed, with no term or prepayment, is pay-as-you-go.
      - id: d
        text: All-upfront pricing
        why: All-upfront pricing pays for capacity before it runs, and the cafe paid nothing upfront.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: No prepayment, no term and a charge only for what is consumed is pay-as-you-go pricing.
    history: []
    verified:
      keyHash: 6238cb00f017
      fullHash: f13b7d93151b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-9wx5re
    version: 1
    status: live
    type: single
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.4"
    level: 2
    stem: >-
      The cafe's owner moves the ordering site to AWS on pay-as-you-go pricing and explains the change to the staff with a cafe example.
      Which cafe expense is charged the same way as the site's AWS resources?
    options:
      - id: a
        text: Rent owed at the same amount every month
        why: Rent stays the same whether the shop is busy or empty, while the site is billed only for what it consumes.
      - id: b
        text: A coffee machine bought outright before opening
        why: Buying a machine before opening is a prepayment, and AWS asks for no payment before the site uses anything.
      - id: c
        text: Wages paid for the hours each barista works
        correct: true
        why: Wages follow the hours actually worked, just as the site's bill follows the resources it actually consumes.
      - id: d
        text: A long-term bean contract at a discounted price
        why: A long contract trades a commitment for a lower price, which is a term commitment rather than paying as you go.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: Pay-as-you-go works like hourly wages, so the bill follows what is actually used, with nothing upfront and no term.
    history: []
