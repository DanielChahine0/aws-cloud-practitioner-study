  - id: q-qb28ty
    version: 1
    status: live
    type: single
    pool: practice
    concept: resource-provisioning
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.1"
    level: 2
    stem: >-
      The cafe's back-room server cannot keep up when a weekend sale floods its online store, and buying more hardware takes weeks.
      Which benefit of moving the store to AWS lets it keep up with the next sale without buying hardware?
    options:
      - id: a
        text: Run the store with no upfront payment for servers
        why: Skipping prepayment is true on AWS, but it changes how the cafe pays, not how much capacity the sale gets.
      - id: b
        text: Leave physical server security to AWS
        why: AWS does secure its data centers, but that does nothing to add capacity when the sale floods the store.
      - id: c
        text: Add servers for the rush and release them after
        correct: true
        why: On AWS resources are provisioned when demand appears and deprovisioned as quickly once it fades.
      - id: d
        text: See each server's charges on one monthly bill
        why: AWS does itemize charges by resource, but a clearer bill does not help the store handle the flood of orders.
    evidence:
      - An on-premises data center is just as rigid, because its capacity cannot be multiplied at short notice.
      - You provision resources when demand appears and deprovision them as fast when it fades, by hand or automatically through configuration.
    takeaway: Unlike fixed on-premises hardware, AWS resources are provisioned as demand rises and released as it falls.
    history: []
