questions:
  - id: q-azv9sz
    version: 1
    status: live
    type: match
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe deploys its loyalty program on AWS, and guests check their points from their own devices.
      Match each part of the deployment to the job it does when a guest asks for a balance.
    pairs:
      - left: A guest's phone
        right: Sends the request and displays the reply
        why: The phone is the client, so it asks for the balance and shows what comes back.
      - left: A virtual server in an AWS data center
        right: Validates the request and works out the balance
        why: The virtual server is the server side, which checks the request and processes the stored points.
      - left: The internet
        right: Carries the request and the reply between them
        why: In cloud computing, clients reach the servers in AWS over the internet, which links the two sides.
    evidence:
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
      - In the coffee shop, the customer is the client and the barista is the server, which on AWS would be a virtual server.
    takeaway: On AWS the guest's device stays the client, a virtual server in AWS is the server, and the internet links them.
    history: []
    verified:
      keyHash: 8ba36cbeb11a
      fullHash: 5ff58380eca9
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-e81xws
    version: 1
    status: draft
    type: single
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe moves the back end of its ordering app from a computer in the back room to AWS.
      Guests keep placing orders from the same app on their phones.
      After the move, what does each guest's phone do when an order is placed?
    options:
      - id: a
        text: Validates the order and shows the reply
        why: Showing the reply is the phone's part, but validating the order is server work that now runs in AWS.
      - id: b
        text: Sends the order and shows the reply
        correct: true
        why: The phone is still the client, so it sends the request and displays whatever the server returns.
      - id: c
        text: Sends the order and stores the result
        why: Sending is the phone's part, but storing the result is server work that the back end in AWS does.
      - id: d
        text: Validates the order and stores the result
        why: Validating and storing are both the server's work, which moved to a virtual server in AWS, not the phone.
    evidence:
      - In the coffee shop, the customer is the client and the barista is the server, which on AWS would be a virtual server.
      - A server usually both stores and processes data, while the client sends requests and shows the replies, and cloud servers scale for both kinds of demand.
    takeaway: Moving a back end to AWS keeps the client-server model, so the guest's phone stays the client that sends requests and shows replies.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: Task 3.1 is about methods of deploying and operating in AWS, but the question tests which role the client plays in the client-server model, not a deployment or operating method."
  - id: q-2k67rk
    version: 1
    status: draft
    type: single
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "4.1"
    level: 3
    stem: >-
      The cafe tries an online gift-card service on AWS for one month.
      It pays nothing upfront, agrees to no term, and is charged only for the server hours the service actually consumes.
      Which pricing approach is the cafe using?
    options:
      - id: a
        text: Fixed monthly pricing
        why: A fixed monthly price is owed whether or not the servers run, but the cafe pays only for hours consumed.
      - id: b
        text: Term commitment pricing
        why: A term commitment such as a Savings Plan earns a lower rate, and the cafe agreed to no term at all.
      - id: c
        text: Pay-as-you-go pricing
        correct: true
        why: Paying only for the hours actually consumed, with no term or prepayment, is pay-as-you-go.
      - id: d
        text: All-upfront pricing
        why: All-upfront pricing pays for capacity before it runs, and the cafe paid nothing upfront.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: No prepayment, no term and a charge only for what is consumed is pay-as-you-go pricing.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 1 'Pay-as-you-go' is the signature cloud pricing phrase; the other three all describe commitment or fixed pricing, so it stands out as the odd one.)"
  - id: q-9wx5re
    version: 1
    status: draft
    type: multi
    pool: practice
    concept: pay-as-you-go-pricing
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.4"
    level: 1
    select: 2
    stem: >-
      The cafe's owner asks what pay-as-you-go pricing on AWS would mean for a new ordering site.
      Which statements describe pay-as-you-go pricing itself?
    options:
      - id: a
        text: A one-year commitment can lower the hourly rate
        why: That is a Savings Plans discount for committing ahead, while pay-as-you-go asks for no term at all.
      - id: b
        text: No payment is due before any resource is used
        correct: true
        why: AWS asks for no prepayment, so the site can start without an upfront charge.
      - id: c
        text: Heavier storage use can lower the per-unit rate
        why: That is volume-based pricing, a separate discount from simply paying for what is consumed.
      - id: d
        text: The bill rises and falls with resources consumed
        correct: true
        why: Charges track real consumption, much like wages paid only for hours on shift.
      - id: e
        text: Released servers stop adding to the next bill
        why: That is true of deprovisioning, which ends a resource's charges, not a trait of the pricing model itself.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: Pay-as-you-go means no upfront payment and a bill that follows actual consumption.
    history: []
    review:
      attempts: 3
      lastFailure: "solve-closed: a second option is defensible: Pay-as-you-go means no upfront payment and a bill that tracks consumption; options 1 and 5 describe commitment and volume discounts. Option 2 is also a direct consequence of paying only for use, so it competes with 3 and 4 for the two picks."
  - id: q-va2dze
    version: 1
    status: live
    type: single
    pool: practice
    concept: resource-provisioning
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.4"
    level: 2
    stem: >-
      The cafe ran extra servers on AWS for a holiday promotion that closed on Friday evening.
      The last promotion orders were delivered on Saturday morning, and the owner released the extra servers on Sunday evening.
      The month's bill arrives on Monday morning.
      When did the charges for the extra servers end?
    options:
      - id: a
        text: Friday evening
        why: The promotion closing does not stop billing, because the servers kept running until Sunday.
      - id: b
        text: Sunday evening
        correct: true
        why: Billing for a resource ends the moment it is deprovisioned, so the charges stopped when the servers were released.
      - id: c
        text: Saturday morning
        why: Charges follow the servers themselves, not the orders, so the last deliveries did not end them.
      - id: d
        text: Monday morning
        why: The bill only reports past charges, and those had already stopped when the servers were released.
    evidence:
      - Billing for a resource ends the moment it is deprovisioned.
      - "**Deprovisioning**: releasing unneeded resources, which ends their charges immediately."
    takeaway: A resource's charges stop the moment it is deprovisioned, with no wait for a billing cycle to end.
    history: []
    verified:
      keyHash: d4930223e157
      fullHash: 2876fe2d6cd7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-cec23m
    version: 1
    status: draft
    type: single
    pool: practice
    concept: resource-provisioning
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "1.1"
    level: 2
    stem: >-
      The cafe joins a local festival for the first time, so it has no past traffic to learn from.
      Its website will be busy on some festival days and quiet on others, and nobody knows in advance which.
      The owner wants the site to keep up without paying for capacity that sits unused.
      Which approach on AWS fits?
    options:
      - id: a
        text: Scheduled scaling at set times each day
        why: A schedule suits a load that repeats at known times, but these busy days cannot be predicted.
      - id: b
        text: Predictive scaling from past traffic history
        why: Predictive scaling forecasts from history, and the cafe has no past festival traffic to learn from.
      - id: c
        text: Dynamic scaling that follows live demand
        correct: true
        why: Adding servers as demand appears and removing them as it fades keeps capacity matched to each busy day.
      - id: d
        text: Fixed capacity sized for the busiest day
        why: Capacity held for the peak sits idle and still billed on the quiet days, which the owner wants to avoid.
    evidence:
      - You provision resources when demand appears and deprovision them as fast when it fades, by hand or automatically through configuration.
    takeaway: Provision resources as demand rises and deprovision them as it falls, so capacity follows the load.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: The key (option 2, dynamic scaling) and distractors 1 and 3 (scheduled and predictive scaling) test EC2 Auto Scaling policy types, while the concept and the cited m01 note cover only general resource provisioning, so the question drifts off its one concept."
