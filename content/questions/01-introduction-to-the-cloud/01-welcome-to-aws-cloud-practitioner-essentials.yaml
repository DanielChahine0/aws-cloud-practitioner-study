      fullHash: 6ec3978df25b
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-1zgb64
    version: 1
    status: live
    type: single
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe moves its ordering app's back end from a computer in the back room to a cloud-based deployment on AWS.
      Guests order from the app on their phones both before and after the move.
      Which statement about the back end is true both before and after the move?
    options:
      - id: a
        text: The back end runs on servers in AWS data centers
        why: This holds only after the move, because before it the back end ran on the cafe's own back-room computer.
      - id: b
        text: The back end adds servers the moment the app gets busy
        why: Adding servers at short notice comes with the cloud, while the back-room computer could not be multiplied quickly.
      - id: c
        text: The back end replies to the requests the app sends
        correct: true
        why: The cloud does not replace the client-server model, so the back end is the server that answers the app on both sides of the move.
      - id: d
        text: The back end's physical hardware is maintained by AWS
        why: AWS looks after the hardware only once the back end runs in its data centers, and before the move the cafe did.
    evidence:
      - The cloud does not replace the client-server model, which modern applications still use.
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
    takeaway: A cloud-based deployment keeps the client-server model, so the back end still serves the phones, only now from AWS.
    history: []
    verified:
      keyHash: 1905a547bf3a
      fullHash: ddfb06803469
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
