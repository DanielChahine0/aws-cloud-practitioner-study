        why: A term is a commitment the cafe never made, and paying for what is used asks for no term at all.
    evidence:
      - You pay only for the AWS resources you consume, just as staff earn wages only for hours on shift.
      - On AWS there is no prepayment, and you need not worry about capacity constraints.
    takeaway: With pay-as-you-go pricing a short burst of use costs only the time the resources actually ran.
