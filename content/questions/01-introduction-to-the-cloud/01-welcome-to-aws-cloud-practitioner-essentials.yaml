  - id: q-tvj2va
    version: 1
    status: live
    type: single
    pool: practice
    concept: client-server-model
    note: m01/welcome-to-aws-cloud-practitioner-essentials
    task: "3.1"
    level: 2
    stem: >-
      The cafe retires the computer in its back room and deploys the ordering app's back end on AWS instead.
      Guests still order from their phones.
      Where are each guest's orders now checked and processed?
    options:
      - id: a
        text: On each guest's phone before it reaches AWS
        why: The phone is the client, which only sends the order and shows the reply, so it does not check or process it.
      - id: b
        text: On the internet path between the phone and AWS
        why: The internet only carries the order and the reply between client and server, so it does no checking or processing.
      - id: c
        text: On a virtual server in an AWS data center
        correct: true
        why: After the move the server side is a virtual server that AWS runs in its data centers, reached over the internet.
      - id: d
        text: On the back-room computer that AWS replaced
        why: That computer was retired when the back end moved to AWS, so the cafe's own hardware no longer does this work.
    evidence:
      - "**Virtual server**: a server you use on AWS over the internet, in AWS data centers rather than your own."
      - "**Server**: the side that validates requests, stores and processes data, and returns responses."
      - Cloud computing is one version of it, supplying the server side as scalable servers that clients reach over the internet.
    takeaway: Deploying a back end on AWS moves the server role to a virtual server in AWS data centers, while phones stay clients.
    history: []
    verified:
      keyHash: 3718a51f6fb4
      fullHash: e761364d6e35
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
