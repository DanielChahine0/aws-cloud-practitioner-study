  - id: q-arybmq
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-regions
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe is opening its first branches in Brazil, and nearly all its new customers live there.
      The ordering app must answer those customers with low latency.
      Which Region should the cafe run the app in?
    options:
      - id: a
        text: The Ohio Region
        why: Ohio is far from customers in Brazil, so every order would travel a long way and add latency.
      - id: b
        text: The Dublin Region
        why: Dublin sits in Europe, far from the Brazilian customers, so it cannot give them the lowest latency.
      - id: c
        text: The Sao Paulo Region
        correct: true
        why: Sao Paulo is the Region near the customers in Brazil, which gives them low-latency access to the app.
      - id: d
        text: The Tokyo Region
        why: Tokyo is on the far side of the world from Brazil, so it would add the most latency for these customers.
    evidence:
      - Geographic area near customers (such as Ohio, Dublin, Tokyo, Paris, Sao Paulo), sited partly for availability, with three or more physically separate AZs
      - Nearby users get low-latency, fault-tolerant access to services, and advanced components come later.
    takeaway: Pick the AWS Region nearest your customers, because a nearby Region gives them low-latency access.
    history: []
    verified:
      keyHash: 8c765e650bc7
      fullHash: 43a54010084f
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
