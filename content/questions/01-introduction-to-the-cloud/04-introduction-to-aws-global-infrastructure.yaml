questions:
  - id: q-6ygz70
    version: 1
    status: live
    type: single
    pool: practice
    concept: high-availability
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      The cafe runs its ordering app on a main server with a standby copy in a separate location.
      When the main server crashes during the lunch rush, the standby picks up the orders and customers barely notice a pause.
      Which property does this setup give the cafe?
    options:
      - id: a
        text: High availability
        correct: true
        why: A standby that takes over after one failure keeps downtime minimal, which is what high availability means.
      - id: b
        text: Scalability
        why: Scalability is about handling more load by adding capacity, not about surviving a crashed server.
      - id: c
        text: Pay-as-you-go pricing
        why: Paying only for what is used is a billing benefit and does nothing when the main server crashes.
      - id: d
        text: Agility
        why: Agility is about trying ideas and launching resources quickly, not about a standby taking over.
    evidence:
      - "High availability: minimal downtime, because a standby takes over when one component fails."
    takeaway: When one component fails and a standby steps in so downtime stays small, that is high availability.
    history: []
    verified:
      keyHash: d58a2a38f917
      fullHash: 95d03dae3dc7
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-844ypb
    version: 1
    status: live
    type: single
    pool: practice
    concept: high-availability
    note: m01/introduction-to-aws-global-infrastructure
    task: "1.1"
    level: 1
    stem: >-
      Which benefit does high availability on its own give a business?
    options:
      - id: a
        text: Work carries on while several components fail at the same moment.
        why: Surviving several failures at once is fault tolerance, which goes further than high availability.
      - id: b
        text: A broken server is rebuilt from a backup by the next morning.
        why: Rebuilding overnight leaves hours of downtime, the opposite of the minimal downtime high availability gives.
      - id: c
        text: Downtime stays small because a standby replaces one failed part.
        correct: true
        why: High availability keeps downtime minimal by switching to a standby when one component fails.
      - id: d
        text: Capacity grows and shrinks on its own as customer demand shifts.
        why: Matching capacity to demand describes elasticity, not keeping downtime low after a failure.
    evidence:
      - "High availability: minimal downtime via standby components."
    takeaway: High availability means minimal downtime, because a standby component takes over when one part fails.
    history: []
    verified:
      keyHash: e69ab790423d
      fullHash: 517ebda93d89
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-vqzs5r
    version: 1
    status: live
    type: single
    pool: practice
    concept: fault-tolerance
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      The cafe's payment system must keep taking card payments even if a server, a network link and a storage disk all break at the same moment.
      Which design goal is the cafe aiming for?
    options:
      - id: a
        text: Fault tolerance
        correct: true
        why: Fault tolerance keeps the system running through several simultaneous failures by building resilience into every layer.
      - id: b
        text: High availability
        why: High availability relies on a standby taking over after one failure, which falls short of surviving several at once.
      - id: c
        text: Scalability
        why: Scalability adds capacity for more load and does not keep payments running when parts break.
      - id: d
        text: Elasticity
        why: Elasticity matches capacity to demand over time and offers no protection against several broken parts.
    evidence:
      - "Fault tolerance: going further, the system runs on when several components fail, via resilience in every layer."
    takeaway: Surviving several component failures at once, through resilience in every layer, is fault tolerance.
    history: []
    verified:
      keyHash: 408df4ec3f6a
      fullHash: ac8ec9e824be
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-h68n9s
    version: 1
    status: live
    type: single
    pool: practice
    concept: fault-tolerance
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      Which situation at the cafe shows fault tolerance rather than only high availability?
    options:
      - id: a
        text: When the main payment server breaks, a standby server takes over the orders.
        why: A standby covering one failed server is the high availability pattern, which fault tolerance goes beyond.
      - id: b
        text: When a server and a disk break together, payments carry on without a pause.
        correct: true
        why: Running on while several components fail at once is what sets fault tolerance apart.
      - id: c
        text: When the only payment server breaks, staff restore it from last night's backup.
        why: Restoring from a backup means downtime until the restore ends, so the system did not run on.
      - id: d
        text: When the server room floods, the app is rebuilt in a new location the next day.
        why: Rebuilding the next day leaves a full outage in between, which is neither availability nor tolerance.
    evidence:
      - "Fault tolerance: operating on despite multiple failures."
      - "High availability limits downtime from one failure, fault tolerance survives several, and both come from spreading resources across AZs and Regions."
    takeaway: High availability covers one failure with a standby, while fault tolerance keeps running through several failures.
    history: []
    verified:
      keyHash: 89dd1cf3022f
      fullHash: f499677e3bf4
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-dr38dj
    version: 1
    status: live
    type: match
    pool: practice
    concept: aws-global-infrastructure
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 1
    stem: >-
      Match each level of the AWS Global Infrastructure to the description that fits it.
    pairs:
      - left: AWS Region
        right: A geographic area that contains three or more separate Availability Zones
        why: A Region is the broad geographic area, and it holds several physically separate Availability Zones.
      - left: Availability Zone
        right: An isolated location inside one Region with its own power and networking
        why: An Availability Zone lives within a single Region and has independent power, networking and connectivity.
      - left: Data center
        right: A facility with redundant power, one or more of which make up each isolated location
        why: Data centers are the buildings inside each Availability Zone, and each zone holds at least one.
    evidence:
      - "AWS Region: a geographic area with three or more AZs."
      - "Availability Zone (AZ): an isolated location in a Region, with one or more data centers."
      - A Region holds three or more AZs, and each AZ is an isolated part of one Region holding one or more data centers.
    takeaway: Regions contain Availability Zones, and each Availability Zone contains one or more data centers.
    history: []
