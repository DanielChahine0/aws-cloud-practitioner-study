  - id: q-vqx7fw
    version: 1
    status: live
    type: multi
    pool: practice
    concept: availability-zones
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    select: 2
    stem: >-
      The cafe runs its ordering app in two Availability Zones of the Paris Region.
      A fire knocks out one zone, and the other zone keeps taking orders.
      Which facts about Availability Zones explain why the other zone kept running?
    options:
      - id: a
        text: Each zone sits inside the area of a single Region.
        why: Belonging to one Region is true of every zone but does nothing to shield one zone from a fire in another.
      - id: b
        text: Each zone has its own power, networking and connectivity.
        correct: true
        why: Independent power, networking and connectivity mean the fire's damage to one zone does not cut off the other.
      - id: c
        text: Each zone holds one or more data centers of its own.
        why: The data centers inside the burned zone go down with it, so holding data centers does not explain the survivor.
      - id: d
        text: Each zone is kept physically apart from the other zones.
        correct: true
        why: Zones are kept apart because one disaster can cut off a whole zone, so the fire stays in one place.
      - id: e
        text: Each zone is placed close to the customers it serves.
        why: Being near customers is about latency, which plays no part in surviving a fire in the other zone.
    evidence:
      - Isolated location in one Region (never spanning Regions) with its own power, networking and connectivity, kept apart from other AZs as a disaster could cut off a whole AZ
    takeaway: Availability Zones survive each other's disasters because each is physically apart with its own power and networking.
    history: []
    verified:
      keyHash: 111d3f954afb
      fullHash: 67f98cb59a03
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-6nwzkw
    version: 1
    status: draft
    type: single
    pool: practice
    concept: availability-zones
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      The cafe's ordering app runs in one Availability Zone of the Dublin Region, and its data must stay in the Dublin Region.
      The cafe wants the app to keep serving if a flood cuts off that zone.
      Where should it place a second copy of the app and its data?
    options:
      - id: a
        text: A second data center in the same zone in Dublin
        why: A data center in the same zone is cut off by the same flood, so both copies would stop together.
      - id: b
        text: A larger server in the same zone in Dublin
        why: A bigger server adds capacity, but it sits in the flooded zone and goes down with the first copy.
      - id: c
        text: An Availability Zone in the Paris Region
        why: A zone in Paris would survive the flood, but it moves the data out of the Dublin Region, which the cafe cannot do.
      - id: d
        text: A different Availability Zone in the Dublin Region
        correct: true
        why: Another zone in Dublin is isolated from the flooded one and keeps the data inside the Region the cafe must use.
    evidence:
      - Spread resources and replicate data across several AZs so one AZ's outage does not stop applications.
      - Isolated location in one Region (never spanning Regions) with its own power, networking and connectivity, kept apart from other AZs as a disaster could cut off a whole AZ
    takeaway: To survive one zone's outage without leaving a Region, replicate across another Availability Zone in that Region.
    history: []
    review:
      attempts: 3
      lastFailure: "critic: the cue round found the key from the options alone (tell: Option 3 is the only one using 'different' and is the textbook high-availability choice; 1 and 4 repeat 'same zone' and 2 jumps Regions, so 3 stands out as the balanced middle option.)"
  - id: q-032ns6
    version: 1
    status: live
    type: single
    pool: practice
    concept: availability-zones
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe's IT lead plans to create one Availability Zone that stretches across the Ohio and Dublin Regions.
      Which fact about Availability Zones shows why this plan cannot work?
    options:
      - id: a
        text: Each zone has its own power and networking within a Region.
        why: Independent power and networking are true of every zone but say nothing about how many Regions a zone can cover.
      - id: b
        text: Each zone holds its own data centers within a Region.
        why: Holding its own data centers is true of a zone, yet it does not stop a zone from spanning Ohio and Dublin.
      - id: c
        text: Each zone is kept physically apart from others within a Region.
        why: Keeping zones apart limits how far one disaster spreads, which is unrelated to a zone covering Ohio and Dublin.
      - id: d
        text: Each zone belongs to a single Region and never spans more.
        correct: true
        why: A zone belongs to a single Region and never spans Regions, so no zone can cover both Ohio and Dublin.
    evidence:
      - Isolated location in one Region (never spanning Regions) with its own power, networking and connectivity, kept apart from other AZs as a disaster could cut off a whole AZ
    takeaway: An Availability Zone always sits inside a single Region, so covering two Regions takes zones in each Region.
    history: []
