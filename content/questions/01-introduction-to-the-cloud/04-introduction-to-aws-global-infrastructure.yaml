  - id: q-sq6b7v
    version: 1
    status: live
    type: single
    pool: practice
    concept: high-availability
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    stem: >-
      The cafe's owner wants to move every app into one large data center with strong security and redundant power.
      Why does this plan still fall short of high availability?
    options:
      - id: a
        text: An outage at that one site would stop every app together.
        correct: true
        why: With every app in one data center, a single outage or disaster there takes all of them down, so downtime is not kept small.
      - id: b
        text: Each data center sits inside one Availability Zone of a Region.
        why: Belonging to one zone is true of any data center but does not explain why one site leaves the apps exposed.
      - id: c
        text: Customers far from that one site would see higher latency.
        why: Distance from customers affects how fast the apps answer, not whether they stay up when the site fails.
      - id: d
        text: Each data center has redundant power, networking and connectivity.
        why: Redundant power and networking help the site itself, yet they cannot keep the apps up if the whole site goes down.
    evidence:
      - One giant data center is the opposite, since one outage or disaster stops every application.
      - High availability means business resources stay up, which no single storage location or data center ensures.
    takeaway: No single data center gives high availability, because one outage there stops every app it runs.
    history: []
    verified:
      keyHash: 6e3a139461a5
      fullHash: c77a6dfe25cb
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
