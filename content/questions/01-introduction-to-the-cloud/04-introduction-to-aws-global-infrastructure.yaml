  - id: q-9nxypw
    version: 1
    status: live
    type: single
    pool: practice
    concept: aws-global-infrastructure
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 1
    stem: >-
      The cafe's owner is sketching the AWS Global Infrastructure as a set of nested boxes, from the largest level down.
      Which level belongs in the innermost box?
    options:
      - id: a
        text: AWS Region
        why: A Region is the outermost box, the geographic area that holds all the other levels.
      - id: b
        text: Edge location
        why: Edge locations cache content near viewers and are not one of the nested boxes of Region, zone and data center.
      - id: c
        text: Data center
        correct: true
        why: Data centers sit inside each Availability Zone, so they are the innermost level of the nesting.
      - id: d
        text: Availability Zone
        why: An Availability Zone is the middle box, since it sits inside a Region and itself holds data centers.
    evidence:
      - "Availability Zone (AZ): an isolated location in a Region, with one or more data centers."
      - A Region holds three or more AZs, and each AZ is an isolated part of one Region holding one or more data centers.
    takeaway: Regions hold Availability Zones, and each Availability Zone holds one or more data centers.
