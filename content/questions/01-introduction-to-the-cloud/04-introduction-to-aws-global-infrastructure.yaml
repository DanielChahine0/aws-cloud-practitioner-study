  - id: q-vqx7fw
    version: 1
    status: live
    type: multi
    pool: practice
    concept: availability-zones
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 2
    select: 2
    stem: >-
      The cafe runs its ordering app in two Availability Zones of the Paris Region.
      A fire knocks out one zone, and the other zone keeps taking orders.
      Which facts about Availability Zones explain why the other zone kept running?
    options:
      - id: a
        text: Each zone sits inside the area of a single Region.
        why: Belonging to one Region is true of every zone but does nothing to shield one zone from a fire in another.
      - id: b
        text: Each zone has its own power, networking and connectivity.
        correct: true
        why: Independent power, networking and connectivity mean the fire's damage to one zone does not cut off the other.
      - id: c
        text: Each zone holds one or more data centers of its own.
        why: The data centers inside the burned zone go down with it, so holding data centers does not explain the survivor.
      - id: d
        text: Each zone is kept physically apart from the other zones.
        correct: true
        why: Zones are kept apart because one disaster can cut off a whole zone, so the fire stays in one place.
      - id: e
        text: Each zone is placed close to the customers it serves.
        why: Being near customers is about latency, which plays no part in surviving a fire in the other zone.
    evidence:
      - Isolated location in one Region (never spanning Regions) with its own power, networking and connectivity, kept apart from other AZs as a disaster could cut off a whole AZ
    takeaway: Availability Zones survive each other's disasters because each is physically apart with its own power and networking.
    history: []
    verified:
      keyHash: 111d3f954afb
      fullHash: 67f98cb59a03
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-09
  - id: q-6nwzkw
    version: 1
    status: live
    type: single
    pool: practice
    concept: availability-zones
    note: m01/introduction-to-aws-global-infrastructure
    task: "3.2"
    level: 3
    stem: >-
      The cafe's ordering app runs in one Availability Zone of the Dublin Region, and its data must stay in the Dublin Region.
      The cafe wants the app to keep serving if a flood cuts off one zone.
      Which layout should the cafe run the app and its data in?
    options:
      - id: a
        text: One Availability Zone in Dublin and one in Paris
        why: Spreading across Dublin and Paris would survive the flood, but it puts data in the Paris Region, which the cafe must avoid.
      - id: b
        text: Two Availability Zones in the Paris Region
        why: Two zones in Paris would survive a flood in one of them, but all the data would leave the Dublin Region.
      - id: c
        text: Two data centers in one Paris zone
        why: Both data centers sit in one zone, so a flood there stops them together, and the data also leaves Dublin.
      - id: d
        text: Two Availability Zones in the Dublin Region
        correct: true
        why: Two isolated zones in Dublin keep serving when a flood cuts off one, and the data never leaves the Dublin Region.
    evidence:
      - Spread resources and replicate data across several AZs so one AZ's outage does not stop applications.
      - Isolated location in one Region (never spanning Regions) with its own power, networking and connectivity, kept apart from other AZs as a disaster could cut off a whole AZ
    takeaway: To survive one zone's outage without leaving a Region, replicate across another Availability Zone in that Region.
    history: []
    verified:
      keyHash: 591b930b7fdb
      fullHash: fc308da66adf
      checks: [ solve-closed@1, solve-notes@1, critic@1 ]
      on: 2026-10-18
